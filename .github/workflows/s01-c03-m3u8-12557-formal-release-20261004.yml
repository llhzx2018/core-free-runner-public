name: S01-C03 M3U8 1.25.57 Active-Language Readiness Formal Release

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/s01-c03-m3u8-12557-formal-release-20261004.yml'

permissions:
  contents: read
  actions: read

jobs:
  release:
    if: github.head_ref == 'task/s01-c03-m3u8-12557-formal-release-20261004'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPO: llhzx2018/vf-tools-m3u8
      SHA: b5348850bb18d57916fdf5b17110e6ec9232468a
      PROMOTED_MAIN_SHA: 8a471748495642123727be1c3c351e599661956f
      VERSION: 1.25.57
      TAG: v1.25.57
      ASSET: vf-tools-m3u8_V1.25.57.zip
      PREVIOUS_TAG: v1.25.56
      PREVIOUS_ASSET: vf-tools-m3u8_V1.25.56.zip
      PREVIOUS_SHA256: 9a4a1db8f44486833c3108effc34cb61c697ec6493a5414cf952b77f032b0c3c
      CANDIDATE_RUN_ID: 37192622006

    steps:
      - name: Credential presence
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"

      - name: Checkout exact M3U8 candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          ref: ${{ env.SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: m3u8
          persist-credentials: false

      - name: Release input and exact-candidate gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p evidence candidate-evidence previous
          test "$(git -C m3u8 rev-parse HEAD)" = "$SHA"
          test "$(tr -d '\r\n' < m3u8/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.25.57' m3u8/src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_VERSION', '1.25.57'" m3u8/src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_ROUND', 'R279'" m3u8/src/vf-tool-m3u8.php

          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/$REPO/branches/main" --jq '.commit.sha')" = "$PROMOTED_MAIN_SHA"
          GH_TOKEN="$READ_TOKEN" gh api "repos/$REPO/commits/$PROMOTED_MAIN_SHA" --jq '.parents[].sha' | grep -Fx "$SHA" >/dev/null

          gh run download "$CANDIDATE_RUN_ID" --repo llhzx2018/core-free-runner-public --name s01-c03-v1.25.57-active-language-readiness --dir candidate-evidence
          jq -e --arg sha "$SHA" --arg ver "$VERSION" '
            .status=="PASS" and
            .candidate_sha==$sha and
            .candidate_version==$ver and
            .active_language_readiness=="PASS" and
            .ops_consumer_contract=="PASS" and
            .production=="NOT_EXECUTED"
          ' candidate-evidence/FINAL_EVIDENCE.json >/dev/null

          php m3u8/tests/unit/first-run-active-language-readiness-contract.php
          php m3u8/tests/unit/package-physical-locator-contract.php
          git -C m3u8 diff --exit-code 0b883f45135ec55cbdda316c86de7cbd851d4718..$SHA -- src/includes/update >/dev/null

          cat > evidence/public-authority.txt <<'EOF'
          PUBLIC_AUTHORITY_APPLICABILITY
          INSTALL=N_A existing-install update, no installer/clean-install change
          SECURITY=REQUIRED admin/provider readiness path; no auth/session/permission/secret change; active unsupported locale remains fail-closed
          TESTING=REQUIRED exact Candidate Run 37192622006 PASS + PHP syntax/unit/package proof
          UPGRADE=REQUIRED existing-install 1.25.56 -> 1.25.57 + rollback source proof
          DATA_SCHEMA=N_A no schema/data/migration/backup/restore semantic change
          API_PROVIDER=N_A no external API/provider credential change
          SEO=N_A no public SEO/indexing change
          CRON_JOB=N_A no job/scheduler change
          NOTIFICATION=N_A no notification change
          OBSERVABILITY=REQUIRED bounded readiness false-positive correction; true-positive fail-closed case preserved
          PERFORMANCE=N_A no performance-sensitive path change
          GIT=REQUIRED exact candidate / main promotion / exact tag / remote readback
          UA_UI=N_A no layout/presentation structure change; visible status is corrected from false blocker to canonical readiness result

          RELEASE_MODE=OWNER_DIRECT_DIAGNOSTIC_RELEASE
          OWNER_DIRECT_DIAGNOSTIC_RELEASE_AUTHORIZATION=PASS
          DIAGNOSTIC_SECURITY_BOUNDARY_CHANGE=NO
          OWNER_PREVIEW_RUNTIME=POST_RELEASE_REQUIRED
          OWNER_REAL_USE=POST_PRODUCTION_REQUIRED
          PRODUCTION_AUTO_APPLY=NO
          EOF

          echo RELEASE_INPUT=PASS
          echo SECURITY=PASS_NO_SECURITY_SEMANTIC_CHANGE_FAIL_CLOSED_PRESERVED
          echo TESTING=PASS
          echo OBSERVABILITY=PASS_FALSE_POSITIVE_CORRECTED_TRUE_POSITIVE_PRESERVED
          echo GIT=PASS

      - name: PHP syntax and package security fence
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find m3u8/src -type f -name '*.php' -print0 | sort -z)
          test "$(find m3u8/src -type l | wc -l)" = "0"
          ! find m3u8/src -type f | grep -E '/(?:\.env|wp-config\.php)$'
          ! find m3u8/src -type f | grep -Ei '\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$'
          echo PHP_SYNTAX_AND_SECURITY_FENCE=PASS

      - name: Build deterministic package and Runtime Authority
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf dist stage previous-readback
          mkdir -p dist stage/vf-tool-m3u8 previous-readback
          cp -a m3u8/src/. stage/vf-tool-m3u8/
          rm -f stage/vf-tool-m3u8/README.md stage/vf-tool-m3u8/PACKAGE_PROFILE.json
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          root=Path('stage/vf-tool-m3u8')
          out=Path('dist/vf-tools-m3u8_V1.25.57.zip')
          rows=[]
          files=sorted((p for p in root.rglob('*') if p.is_file() and not p.is_symlink()), key=lambda p:p.relative_to(root).as_posix())
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in files:
                  rel=p.relative_to(root).as_posix()
                  data=p.read_bytes()
                  sha=hashlib.sha256(data).hexdigest()
                  rows.append((rel,sha))
                  info=zipfile.ZipInfo('vf-tool-m3u8/'+rel,(2026,10,4,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o100644<<16
                  z.writestr(info,data)
          canonical=b''.join(rel.encode()+b'\0'+sha.encode()+b'\n' for rel,sha in rows)
          Path('/tmp/count').write_text(str(len(rows)))
          Path('/tmp/fp').write_text(hashlib.sha256(canonical).hexdigest())
          Path('/tmp/sha').write_text(hashlib.sha256(out.read_bytes()).hexdigest())
          Path('/tmp/bytes').write_text(str(out.stat().st_size))
          PY
          test "$(cat /tmp/count)" = "567"
          unzip -tq "dist/$ASSET" >/dev/null
          test "$(unzip -Z1 "dist/$ASSET" | cut -d/ -f1 | sort -u)" = "vf-tool-m3u8"
          unzip -p "dist/$ASSET" vf-tool-m3u8/vf-tool-m3u8.php | grep -Fq 'Version: 1.25.57'
          ! unzip -Z1 "dist/$ASSET" | grep -E '(^|/)(\.git|\.github|tests?|docs?|evidence|private|tmp|temp|cache|logs?)(/|$)'
          echo PACKAGE=PASS
          echo RUNTIME_FILES="$(cat /tmp/count)"
          echo RUNTIME_FINGERPRINT="$(cat /tmp/fp)"
          echo PACKAGE_BYTES="$(cat /tmp/bytes)"
          echo PACKAGE_SHA256="$(cat /tmp/sha)"

      - name: Previous release rollback source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release download "$PREVIOUS_TAG" --repo "$REPO" --pattern "$PREVIOUS_ASSET" --dir previous
          test "$(sha256sum "previous/$PREVIOUS_ASSET" | awk '{print $1}')" = "$PREVIOUS_SHA256"
          unzip -tq "previous/$PREVIOUS_ASSET" >/dev/null
          unzip -p "previous/$PREVIOUS_ASSET" vf-tool-m3u8/vf-tool-m3u8.php | grep -Fq 'Version: 1.25.56'
          echo UPGRADE_12556_TO_12557=PASS
          echo ROLLBACK_SOURCE_12556=PASS

      - name: Publish formal release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cat > /tmp/notes.md <<EOF
          # VF Tools M3U8 V1.25.57

          Active-site language readiness correction.

          - Fixes the Production false blocker where a two-language EN+ZH site was told that 14 inactive locale packs had to be enabled.
          - Readiness and first-run expectations now follow languages actually enabled on the site.
          - Supported but inactive locale packs remain capability only.
          - An actually enabled but unsupported locale remains fail-closed.
          - Existing pages, mounts, settings, schema, updater and runtime algorithms are unchanged.
          - Candidate Run: 37192622006 PASS.
          - OWNER Real Use remains post-Production manual upgrade.
          EOF
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            test "$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SHA"
          else
            gh release create "$TAG" "dist/$ASSET#VF Tools M3U8 $VERSION" --repo "$REPO" --target "$SHA" --title "VF Tools M3U8 V$VERSION" --notes-file /tmp/notes.md
          fi

      - name: Remote readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          j="$(gh api "repos/$REPO/releases/tags/$TAG")"
          aid="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.id' <<<"$j")"
          rid="$(jq -r '.id' <<<"$j")"
          rbytes="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$j")"
          rdigest="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$j")"
          test "$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SHA"
          test "$rbytes" = "$(cat /tmp/bytes)"
          test "$rdigest" = "sha256:$(cat /tmp/sha)"
          mkdir -p previous-readback
          gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" --dir previous-readback --clobber
          test "$(sha256sum "previous-readback/$ASSET" | awk '{print $1}')" = "$(cat /tmp/sha)"
          cmp "dist/$ASSET" "previous-readback/$ASSET"
          jq -n \
            --argjson release_id "$rid" \
            --argjson asset_id "$aid" \
            --arg version "$VERSION" \
            --arg source_sha "$SHA" \
            --arg tag "$TAG" \
            --arg asset "$ASSET" \
            --arg sha "$(cat /tmp/sha)" \
            --arg fp "$(cat /tmp/fp)" \
            --argjson bytes "$(cat /tmp/bytes)" \
            --argjson files "$(cat /tmp/count)" \
            '{status:"PASS",version:$version,source_sha:$source_sha,tag:$tag,release_id:$release_id,asset:$asset,asset_id:$asset_id,asset_bytes:$bytes,asset_sha256:$sha,runtime_files:$files,runtime_fingerprint:$fp,candidate_run:37192622006,upgrade:"PASS",rollback_source:"PASS",remote_readback:"PASS",production:"NOT_EXECUTED"}' \
            | tee evidence/FORMAL_RELEASE.json
          echo FORMAL_RELEASE_REMOTE_READBACK=PASS

      - name: Upload formal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-c03-v1.25.57-formal-release
          path: evidence/
          retention-days: 30
