name: P01 V2.23 Unified Surface UI Route Patch

on:
  push:
    branches:
      - task/p01-v222-multi-surface-gate-20260828
    paths:
      - '.github/workflows/p01-v223-ui-route-patch-20260828.yml'

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Patch exact P01 feature branch
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf product
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git" product
          git -C product checkout -q feature/p01-unified-surface-ui-v223-20260828
          python3 - <<'PY'
          from pathlib import Path
          p=Path('product/src/index.php')
          s=p.read_text(encoding='utf-8')
          needle="""if (!vf_is_installed()) {
              header('Location: /setup.php');
              exit;
          }
          vf_security_headers(false);"""
          repl="""if (!vf_is_installed()) {
              header('Location: /setup.php');
              exit;
          }
          if (vf_is_admin() && !defined('VF_START_CLASSIC_ENTRY')) {
              header('Location: surfaces.php', true, 302);
              exit;
          }
          vf_security_headers(false);"""
          if needle not in s: raise SystemExit('index anchor missing')
          p.write_text(s.replace(needle,repl,1),encoding='utf-8',newline='\n')

          p=Path('product/src/surface.php')
          s=p.read_text(encoding='utf-8')
          s=s.replace("if ($surface === 'start') { header('Location: ./'); exit; }","if ($surface === 'start') { header('Location: start.php'); exit; }")
          s=s.replace('<a href="./">Start</a>','<a href="start.php">Start</a>')
          p.write_text(s,encoding='utf-8',newline='\n')

          p=Path('product/src/surfaces.php')
          s=p.read_text(encoding='utf-8').replace('href="system-settings.php"','href="settings.php"')
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
          php -l product/src/index.php
          php -l product/src/start.php
          php -l product/src/surfaces.php
          php -l product/src/surface.php
          node --check product/src/assets/surface-home.js
          git -C product config user.name VictorForge
          git -C product config user.email llhzx2018@gmail.com
          git -C product add src/index.php src/start.php src/surface.php src/surfaces.php src/assets/surface-home.css src/assets/surface-home.js
          git -C product commit -m 'feat(P01): make unified surface dashboard the admin home' || true
          git -C product push origin feature/p01-unified-surface-ui-v223-20260828
          echo P01_V223_UI_ROUTE_PATCH=PASS
