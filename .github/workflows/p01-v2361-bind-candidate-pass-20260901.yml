name: P01 V2.36.1 Bind Candidate PASS
on:
  push:
    branches: [release/p01-v2361-candidate-20260901]
    paths: [.github/workflows/p01-v2361-bind-candidate-pass-20260901.yml]
permissions:
  contents: read
jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-free-runner-public
          ref: release/p01-v2361-candidate-20260901
          path: runner
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: release/v2.36.1-formal-source-20260901
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Bind exact Candidate PASS
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          test "$(git rev-parse HEAD)" = '411404af399fc13856d71faec1ab4a6633a73ba3'
          python3 ../runner/scripts/p01_v2361_bind_candidate_pass.py
          python3 -m json.tool VF_PROJECT.json >/dev/null
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = 'VF_PROJECT.json '
          test -z "$(git diff --name-only -- src database)"
          jq -e '.candidate_state=="PASS" and .v2_36_1_candidate_gate.run==33472637909 and .v2_36_1_candidate_gate.result=="PASS" and .v2_36_1_candidate_gate.source=="411404af399fc13856d71faec1ab4a6633a73ba3" and .v2_36_1_candidate_gate.runtime_tree=="91f92c5d3e7080469a7f5ab1497145454014c87a" and .production_version=="2.36.0"' VF_PROJECT.json >/dev/null
          git add VF_PROJECT.json
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git commit -m 'release(P01): bind V2.36.1 candidate PASS'
          echo "FORMAL_SOURCE=$(git rev-parse HEAD)"
          echo "FORMAL_TREE=$(git rev-parse HEAD^{tree})"
          echo "FORMAL_RUNTIME_TREE=$(git rev-parse HEAD:src)"
          git push origin HEAD:release/v2.36.1-formal-source-20260901
