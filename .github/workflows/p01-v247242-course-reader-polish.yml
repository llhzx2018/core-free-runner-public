name: P01 V2.47.242 Course Reader Polish Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247242-course-reader-polish.yml"
      - "proof-triggers/p01-v247242-course-reader-polish.json"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd unzip nodejs >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx zip
          php -m | grep -Fx gd

      - name: Clone exact candidate and baseline
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin 81c67389e45a1888b3439f0c84826369af52faec
          git -C candidate checkout -q --detach 81c67389e45a1888b3439f0c84826369af52faec
          test "$(git -C candidate rev-parse HEAD)" = "81c67389e45a1888b3439f0c84826369af52faec"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.242"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.242"
          grep -Fq "define('VF_VERSION', '2.47.242');" candidate/src/app/bootstrap.php

          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" baseline
          git -C baseline fetch -q origin 2329303d660dc817562cb94ac78be405365944c4
          git -C baseline checkout -q --detach 2329303d660dc817562cb94ac78be405365944c4
          echo P01_V247242_EXACT_SOURCE=PASS

      - name: Reader focused proof
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l candidate/src/app/CourseMarkdownRenderer.php
          php -l candidate/tests/unit/course_markdown_reader_contract.php
          php candidate/tests/unit/course_markdown_reader_contract.php | tee /tmp/course-reader.txt
          grep -Fx 'P01_COURSE_MARKDOWN_READER=PASS' /tmp/course-reader.txt
          grep -Fq 'font-size:17px' candidate/src/assets/course-study.css
          grep -Fq 'font-size:12.5px' candidate/src/assets/course-study.css
          echo P01_V247242_READER_POLISH=PASS

      - name: Canonical regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247242_CANONICAL=PASS

      - name: Prove no release or production mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          echo FORMAL_RELEASE_CALLED=NO
          echo DISTRIBUTION_WRITE=NO
          echo PRODUCTION_WRITE=NO
