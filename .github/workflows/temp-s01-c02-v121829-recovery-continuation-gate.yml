name: TEMP S01-C02 Ops 1.21.829 Recovery Continuation Gate
on:
  push:
    branches:
      - temp/s01-c02-v121829-recovery-continuation-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121829-recovery-continuation-gate.yml'
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      BASE: 5f6ec86cff40b007084909536efd71db4a27777a
      COMMIT: c02a0d9bec85207669192ea242d44ad756c96fa4
      TREE: be2d1c90f63e047232a44f9d12724f071aea36bd
    steps:
      - name: Checkout exact Product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Verify identity syntax and exact scope
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = 1.21.829
          php -l ops/vf-ops.php
          php -l ops/includes/site-release/s01-static-recovery-continuation-v121829.php
          php -l ops/.github/phase3/v121829-recovery-continuation.php
          C="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/compare/$BASE...$COMMIT")"
          test "$(jq -r .status <<<"$C")" = ahead
          mapfile -t FILES < <(jq -r '.files[].filename' <<<"$C" | sort)
          EXPECTED=(.github/phase3/v121829-recovery-continuation.php VERSION includes/site-release/s01-static-recovery-continuation-v121829.php vf-ops.php)
          printf '%s\n' "${EXPECTED[@]}" | sort >/tmp/expected
          printf '%s\n' "${FILES[@]}" >/tmp/actual
          diff -u /tmp/expected /tmp/actual
          for b in main develop; do
            B="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/branches/$b")"
            test "$(jq -r .commit.sha <<<"$B")" = "$BASE"
          done
      - name: Run continuation contract and adjacent regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          php ops/.github/phase3/v121829-recovery-continuation.php | grep -Fxq PASS_V121829_RECOVERY_CONTINUATION
          php ops/.github/phase3/v121828-recovery-runtime-closure.php | grep -Fxq PASS_V121828_RECOVERY_RUNTIME_CLOSURE
          php ops/.github/phase3/v121827-failed-candidate-source-rebind.php | grep -Fxq PASS_V121827_FAILED_CANDIDATE_SOURCE_REBIND
          php ops/.github/phase3/v121826-candidate-route-normalization.php | grep -Fxq PASS_V121826_CANDIDATE_ROUTE_NORMALIZATION
      - name: Verify fail-closed continuation boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          F=ops/includes/site-release/s01-static-recovery-continuation-v121829.php
          grep -Fq 'VF_Ops_Release_Async_Job::sync_record' "$F"
          grep -Fq 'vf_ops_publish_release_prepare_candidate_v121771' "$F"
          grep -Fq 'VF_Ops_Release_Async_Job::run_next_stage' "$F"
          grep -Fq 'RECOVERY_CANDIDATE_SOURCE_MISMATCH' "$F"
          ! grep -Eq 'move_uploaded_file|\$_FILES|wp_update_post|wp_insert_post|wp_delete_post|update_post_meta|DELETE FROM|DROP TABLE|ALTER TABLE' "$F"
          ! grep -Fq "finalOnlinePass'=>'YES'" "$F"
          ! grep -Fq "candidatePackageReady'=>true" "$F"
      - name: Verify Production pre-upgrade recovery truth
        shell: bash
        run: |
          set -Eeuo pipefail
          J="$(curl -fsSL https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness)"
          test "$(jq -r .pluginVersion <<<"$J")" = 1.21.828
          test "$(jq -r .sourceRecoveryJobStatus <<<"$J")" = done
          test "$(jq -r .sourceRecoveryJobMode <<<"$J")" = inspect_only
          test "$(jq -r .sourceRecoveryJobInspectionComplete <<<"$J")" = true
          test "$(jq -r .candidatePackageReady <<<"$J")" = false
          test "$(jq -r .manualSourceUploadRequired <<<"$J")" = false
          test "$(jq -r .finalOnlinePass <<<"$J")" = NO
      - name: Verify runner main untouched
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-free-runner-public/git/ref/heads/main)"
          test "$(jq -r .object.sha <<<"$J")" = 0160b557ad4ae0e8c6acd97e7551285bc05870bd
      - name: Seal result
        run: echo PASS_V121829_RECOVERY_CONTINUATION_GATE
