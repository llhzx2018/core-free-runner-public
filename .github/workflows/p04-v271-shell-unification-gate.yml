name: P04 V2.7.1 One Shell IA Unification Gate

on:
  push:
    branches: [p04-v271-shell-unification-gate]
    paths:
      - '.github/workflows/p04-v271-shell-unification-gate.yml'

permissions:
  contents: write

env:
  PRODUCT_REPO: llhzx2018/vf-infra
  PRODUCT_REF: feature/v2.7.1-shell-ia-unification

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout gate repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout exact P04 V2.7.1 working branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRODUCT_REPO }}
          ref: ${{ env.PRODUCT_REF }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product

      - name: Lock product identity
        id: identity
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          HEAD=$(git rev-parse HEAD)
          test "$(tr -d '\r\n' < VERSION)" = '2.7.1'
          test -f public/assets/v271-unified-shell.js
          test -f public/assets/v271-unified-shell.css
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "P04_V271_TESTED_HEAD=$HEAD"

      - name: Install runtime and browser dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip php-mbstring >/dev/null
          cd product
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium >/dev/null
          php -v | head -n 1
          node --version

      - name: Run V2.7.1 one-shell functional / security / browser gate
        id: product_gate
        continue-on-error: true
        shell: bash
        env:
          VF_V271_TESTED_RUNTIME_COMMIT: ${{ steps.identity.outputs.head }}
          VF_V271_EVIDENCE_DIR: ${{ github.workspace }}/evidence
        run: |
          set -Eeuo pipefail
          cd product
          bash scripts/run-v271-shell-unification-gate.sh | tee "$GITHUB_WORKSPACE/p04-v271-gate.log"

      - name: Upload V2.7.1 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P04-V2.7.1-ONE-SHELL-IA-GATE
          path: |
            evidence/
            p04-v271-gate.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish non-sensitive gate status
        if: always()
        shell: bash
        env:
          TESTED_HEAD: ${{ steps.identity.outputs.head }}
          GATE_OUTCOME: ${{ steps.product_gate.outcome }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,os
          data={
            'project':'P04 · VF Infra',
            'version':'2.7.1',
            'schema':14,
            'migration':'NONE',
            'tested_head':os.environ.get('TESTED_HEAD',''),
            'run_id':int(os.environ['GITHUB_RUN_ID']),
            'gate_outcome':os.environ.get('GATE_OUTCOME','unknown'),
            'secondary_user_shell':0 if os.environ.get('GATE_OUTCOME')=='success' else 'NOT_ESTABLISHED',
            'duplicate_settings':0 if os.environ.get('GATE_OUTCOME')=='success' else 'NOT_ESTABLISHED',
            'owner_task_requires_legacy_ui':0 if os.environ.get('GATE_OUTCOME')=='success' else 'NOT_ESTABLISHED',
            'function_loss':0 if os.environ.get('GATE_OUTCOME')=='success' else 'NOT_ESTABLISHED',
            'candidate':'NOT_AUTHORIZED',
            'release':'NOT_AUTHORIZED',
            'production_write':0,
          }
          open('p04-v271-shell-gate-status.json','w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'P04 Gate Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add p04-v271-shell-gate-status.json
          git commit -m 'evidence(P04): publish V2.7.1 shell gate status' || true
          git push origin HEAD:p04-v271-shell-unification-gate

      - name: Enforce gate result
        if: always()
        shell: bash
        env:
          GATE_OUTCOME: ${{ steps.product_gate.outcome }}
        run: |
          test "$GATE_OUTCOME" = 'success'
