name: p01-watch-tmdb-menu-1926-temporary
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-watch-tmdb-menu-1926-temp.yml']
permissions:
  contents: read
jobs:
  exact-watch-tmdb-menu:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: feat/p01-watch-tmdb-dedicated-management-menu-r1
      TARGET_SHA: ae95b888bf99ebc8d2769cb15212b79a795b0b8b
      BASE_SHA: 061b60f9a8b5866b2cde11a1d4ce554398186434
    steps:
      - name: Checkout registered public Runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: P01 exact-source TMDB independent menu machine gate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$READ_TOKEN"
          ROOT="$(mktemp -d /tmp/p01-tmdb-menu-1926.XXXXXXXX)"
          PORT=18996
          SERVER_PID=""
          cleanup(){
            if [ -n "$SERVER_PID" ]; then kill "$SERVER_PID" >/dev/null 2>&1 || true; fi
            case "$ROOT" in /tmp/p01-tmdb-menu-1926.*) rm -rf -- "$ROOT";; esac
          }
          trap cleanup EXIT
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd curl unzip >/dev/null
          git clone -q --depth 1 --branch "$PRODUCT_BRANCH" "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "$ROOT/candidate"
          git clone -q --depth 1 --branch main "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "$ROOT/stable"
          test "$(git -C "$ROOT/candidate" rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C "$ROOT/stable" rev-parse HEAD)" = "$BASE_SHA"
          git -C "$ROOT/candidate" remote set-url origin "https://github.com/$PRODUCT_REPO.git"
          git -C "$ROOT/stable" remote set-url origin "https://github.com/$PRODUCT_REPO.git"
          unset READ_TOKEN
          test "$(tr -d '\r\n ' < "$ROOT/candidate/VERSION")" = "2.47.497"
          test "$(tr -d '\r\n ' < "$ROOT/candidate/src/VERSION.txt")" = "2.47.497"
          echo "P01_TMDB_MENU_EXACT_SHA=$TARGET_SHA"
          cd "$ROOT/candidate"
          php -l src/app/FunctionalWorkspaceShell.php >/dev/null
          php -l src/app/FrontstageTmdbSettings.php >/dev/null
          php -l tests/unit/p01_watch_tmdb_dedicated_menu_contract.php >/dev/null
          node --check src/assets/local-subsite-management.js
          node --check src/assets/frontstage-tmdb-settings.js
          node --check tests/integration/p01_watch_tmdb_independent_menu_browser.mjs
          echo P01_TMDB_MENU_SOURCE_SYNTAX=PASS
          php tests/unit/p01_watch_tmdb_dedicated_menu_contract.php
          node tests/unit/p01_watch_native_metadata_zero_load_contract.cjs
          node tests/unit/p01_ia5_remote_watch_r33_contract.cjs
          node tests/unit/p01_watch_frontstage_management_hooks_contract.cjs
          echo P01_TMDB_MENU_FOCUSED_CONTRACTS=PASS
          RC=0
          bash tests/canonical_release_regression.sh "$ROOT/candidate" "$ROOT/stable" --require-zero-debt >"$ROOT/canonical.log" 2>&1 || RC=$?
          grep -E '^(P01_CANONICAL_(BASELINE_TEST_COUNT|CURRENT_TEST_COUNT|CURRENT_FAILURE_COUNT|NEW_REGRESSION_COUNT|REMOVED_BASELINE_TEST_COUNT|LEGACY_TEST_DEBT_COUNT|ZERO_DEBT_REQUIRED)=|NEW_UNIT_REGRESSION=|CHANGED_TEST_FAILURE=)' "$ROOT/canonical.log" || true
          test "$RC" -eq 0
          echo P01_TMDB_MENU_CANONICAL_ZERO_DEBT=PASS

          SITE="$ROOT/site"
          mkdir -p "$SITE"
          cp -a "$ROOT/candidate/src/." "$SITE/"
          (cd "$SITE" && php -S "127.0.0.1:$PORT" -t . > "$ROOT/server.log" 2>&1) &
          SERVER_PID=$!
          for n in $(seq 1 50); do
            if curl -fsS -c "$ROOT/cookies" -b "$ROOT/cookies" "http://127.0.0.1:$PORT/setup.php" -o "$ROOT/setup.html" 2>/dev/null; then break; fi
            sleep 1
          done
          test -s "$ROOT/setup.html"
          CSRF="$(python3 - "$ROOT/setup.html" <<'PY'
          import re,sys
          text=open(sys.argv[1],encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',text)
          if not m: raise SystemExit('NO_ISOLATED_SETUP_CSRF')
          print(m.group(1))
          PY
          )"
          curl -fsS -c "$ROOT/cookies" -b "$ROOT/cookies" \
            -X POST "http://127.0.0.1:$PORT/setup.php" \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode "site_title=VF Start TMDB Test" \
            --data-urlencode 'admin_password=ModeFDisposable!2026' \
            --data-urlencode 'admin_password_confirm=ModeFDisposable!2026' \
            -o "$ROOT/setup-result.html"
          (cd "$SITE" && php cli/verify.php) | grep -Fx 'VERIFY_PASS=YES'
          echo P01_TMDB_MENU_FRESH_INSTALL=PASS

          HARNESS="$ROOT/harness"
          mkdir -p "$HARNESS"
          npm install --prefix "$HARNESS" --no-save --no-audit --no-fund --silent playwright@1.56.1
          PLAYWRIGHT_BROWSERS_PATH="$ROOT/browsers" \
            "$HARNESS/node_modules/.bin/playwright" install chromium >/dev/null
          cp "$ROOT/candidate/tests/integration/p01_watch_tmdb_independent_menu_browser.mjs" "$HARNESS/browser.mjs"
          P01_TEST_ORIGIN="http://127.0.0.1:$PORT" \
            P01_TEST_PASSWORD='ModeFDisposable!2026' \
            PLAYWRIGHT_BROWSERS_PATH="$ROOT/browsers" \
            node "$HARNESS/browser.mjs"
          echo P01_TMDB_MENU_CHROMIUM=PASS
      - name: Public safety/lifecycle receipt
        if: always()
        shell: bash
        run: |
          echo P01_PRIVATE_SOURCE_PERSISTED_PUBLIC_GIT=NO
          echo P01_PRIVATE_SOURCE_ARTIFACT=NONE
          echo P01_PRODUCTION_CHANGED=NO
          echo P01_RELEASE_NOT_AUTHORIZED=YES
          echo P01_TEMP_RUNNER_PR_CLOSE_UNMERGED=YES
