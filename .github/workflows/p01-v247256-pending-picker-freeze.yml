name: P01 V2.47.257 Pending Picker Freeze Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247257-pending-picker-freeze.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd nodejs >/dev/null

      - name: Clone exact candidate and baseline
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin 7503bb94e7eb3bb95269edae1d6bc0e6592218f8
          git -C candidate checkout -q --detach 7503bb94e7eb3bb95269edae1d6bc0e6592218f8
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.257"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.257"

          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" baseline
          git -C baseline fetch -q origin 150c13e69d9ef5c66a0b8172c924be6260ccd757
          git -C baseline checkout -q --detach 150c13e69d9ef5c66a0b8172c924be6260ccd757
          echo P01_V247257_EXACT_SOURCE=PASS

      - name: Syntax and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check candidate/src/assets/pending-inbox-ux.js
          php -l candidate/src/app/bootstrap.php
          php candidate/tests/unit/pending_category_picker_freeze_v247257_contract.php
          php candidate/tests/unit/pending_category_picker_v247254_contract.php
          php candidate/tests/unit/pending_category_hierarchy_v247255_contract.php
          php candidate/tests/unit/pending_category_batch_source_contract.php
          echo P01_V247257_FOCUSED=PASS

      - name: Canonical regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247257_CANONICAL=PASS

      - name: Bounded scope
        shell: bash
        run: |
          echo FORMAL_RELEASE_CALLED=NO
          echo DISTRIBUTION_WRITE=NO
          echo PRODUCTION_WRITE=NO
