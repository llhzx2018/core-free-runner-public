name: TEMP P01 Home R7 V2.47.105 exact gate R2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p01-home-r7-v247105-exact-gate-r2.yml'

permissions:
  contents: read

jobs:
  exact-home-candidate-r2:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      CANDIDATE_SHA: f90a89aaefc5d1e0990cb9c659261071d13161b8
      BASELINE_SHA: 2915164400a17538dd8c266a1c6f5a4a71f6f44f
      VERSION: 2.47.105
    steps:
      - name: Checkout verification control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare PHP runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx sqlite3
          echo P01_HOME_R7_R2_RUNTIME=PASS

      - name: Resolve exact candidate and baseline
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          rm -rf /tmp/p01-home-r2-candidate /tmp/p01-home-r2-baseline
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" /tmp/p01-home-r2-candidate
          git -C /tmp/p01-home-r2-candidate fetch -q --depth 1 origin "$CANDIDATE_SHA"
          git -C /tmp/p01-home-r2-candidate checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/p01-home-r2-candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n ' < /tmp/p01-home-r2-candidate/VERSION)" = "$VERSION"

          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" /tmp/p01-home-r2-baseline
          git -C /tmp/p01-home-r2-baseline fetch -q --depth 1 origin "$BASELINE_SHA"
          git -C /tmp/p01-home-r2-baseline checkout -q --detach FETCH_HEAD
          echo P01_HOME_R7_R2_EXACT_SOURCE=PASS

      - name: Home contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/p01-home-r2-candidate
          php -l src/app/FunctionalHome.php >/dev/null
          php tests/unit/frontend_home_r7_prototype_lock_v247105_contract.php
          php tests/unit/frontend_home_navigation_r2_contract.php
          php tests/unit/frontend_visual_reframe_v247101_contract.php
          php tests/unit/home_page_full_polish_contract.php
          echo P01_HOME_R7_R2_CONTRACTS=PASS

      - name: Canonical zero-debt regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/p01-home-r2-candidate
          bash tests/canonical_release_regression.sh /tmp/p01-home-r2-candidate /tmp/p01-home-r2-baseline --require-zero-debt | tee /tmp/p01-home-r2-canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/p01-home-r2-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-home-r2-canonical.txt
          echo P01_HOME_R7_R2_EXACT_GATE=PASS

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf /tmp/p01-home-r2-candidate /tmp/p01-home-r2-baseline /tmp/p01-home-r2-canonical.txt
