name: R59 Focused Discover Sort Control Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r59-discover-sort.yml'

permissions:
  contents: read

jobs:
  r59-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: 54f1ee66b63281de1c274d65b2a15bb5282e4b8c
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 54f1ee66b63281de1c274d65b2a15bb5282e4b8c
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
          coverage: none

      - name: Exact source and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.47.0'
          php -l tests/unit/discover_sort_control_contract.php
          php tests/unit/discover_sort_control_contract.php
          php tests/unit/discover_random_sample_contract.php
          echo R59_DISCOVER_SORT_CONTROL_PASS
          echo R59_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/vf-start"
