      - name: Verify release truth and concurrent branch fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = "$BASE"
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = "$BASE"
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.35.1 --jq .object.sha)" = eb36fd19d269aed4ef4246c2c18f172b2c761bde
          test "$(gh api repos/llhzx2018/vf-start/releases/tags/v2.35.1 --jq .id)" = 379424818
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = a7a601e0880becb78c9835648d06dcda2625b2dc
          for run in 33338822193 33339734236 33340105433 33340185389 33340313941 33340348260 33342185241 33342219852 33342341412; do
            test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)" = success
          done
          echo P01_V2351_RELEASE_TRUTH_FENCE=PASS | tee "$EVID/truth-fence.txt"
      - name: Checkout exact docs closure branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
