          repository: llhzx2018/vf-start
          ref: release/v2.35.1-docs-closure-20260831
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Verify docs-only base
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$BASE"
          test "$(git -C product rev-parse HEAD:src)" = 3cdfa02d8c19ae5e771b7d4abff69a670ac4396c
          test "$(git -C product show HEAD:VERSION | tr -d '\r\n')" = 2.35.1
