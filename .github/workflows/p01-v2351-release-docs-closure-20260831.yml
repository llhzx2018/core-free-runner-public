name: P01 V2.35.1 Release Docs Closure
on:
  push:
    branches: [release/p01-v2350-orchestrator-20260831]
    paths: [.github/workflows/p01-v2351-release-docs-closure-20260831.yml]
permissions:
  contents: read
jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE: b48b1071b5b56d37d35e97b61e13d055a3d2c852
      BRANCH: release/v2.35.1-docs-closure-20260831
