name: TEMP core-agent PR11 Exact Source Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-core-agent-pr11-exact-source.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      EXPECTED_SHA: 6470c206c291fea402354c60de9e063bbcea809b
    steps:
      - name: Verify registered private read capability
        shell: bash
        run: |
          test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact core-agent candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/core-agent
          ref: ${{ env.EXPECTED_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Verify exact source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 Node24
        with:
          python-version: '3.11'

      - name: Run full core-agent verification
        working-directory: source
        env:
          VF_SOURCE_SHA: ${{ env.EXPECTED_SHA }}
        run: python scripts/verify.py

      - name: Verify direct path and mission recovery contracts
        working-directory: source
        env:
          PYTHONPATH: ${{ github.workspace }}/source/src
        shell: bash
        run: |
          python -m unittest tests.test_vf_runtime_entry tests.test_context_snapshot -v
          python - <<'PY'
          from core_agent.profiles.vf.runtime_entry import begin_vf_runtime_entry
          from core_agent.context_snapshot import ProjectContextSnapshot

          start = begin_vf_runtime_entry('P01，修这个 BUG。')
          assert start.requires_activation is False
          assert start.status_line is None

          snap = ProjectContextSnapshot(
              project_id='P01', repo='llhzx2018/vf-start', observed_commit='a'*40,
              observed_at='2026-09-06T00:00:00Z', authority_pointers=('docs/authority/CURRENT.md',),
              hot_files=(), test_commands=(), runtime_level='L1', scope='sample task',
              master_mission='优化整套 VF AI 开发流程与开发环境',
              mission_success_criteria='simple stable low-cost',
              mission_non_goals=('P01 is not the master mission',),
              current_task_role='P01 is only a validation sample',
          )
          raw = snap.serialize()
          assert 'master_mission' in raw
          assert len(raw.encode('utf-8')) <= 4096
          print('DIRECT_PATH_MISSION_RECOVERY=PASS')
          PY
