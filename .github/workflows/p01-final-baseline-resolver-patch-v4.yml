name: P01 Final Baseline Resolver Patch V4

on:
  push:
    branches: [vf-agent-operations-v1]
    paths:
      - '.github/workflows/p01-final-baseline-resolver-patch-v4.yml'

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: cd3dea5cfe9a21173297ade4312a226113bd808c
      TARGET_BRANCH: maintenance/common-product-baseline-v2-20260827
    steps:
      - name: Checkout runner scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: vf-agent-operations-v1
          path: runner
      - name: Checkout P01 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: p01
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - name: Apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C p01 rev-parse HEAD)" = "$EXPECTED_HEAD"
          cd p01
          python3 ../runner/.github/scripts/p01_final_baseline_patch.py
          php -l src/app/CommonBaseline.php
          git diff --check
          test "$(git status --short | wc -l)" -eq 1
          git status --short | grep -F 'src/app/CommonBaseline.php' >/dev/null
          test "$(cat VERSION)" = '2.21.24'
          test "$(cat src/VERSION.txt)" = '2.21.24'
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          cd p01
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/CommonBaseline.php
          git commit -m 'p01: close baseline exception and update resolver'
          git push origin HEAD:$TARGET_BRANCH
          echo NEW_HEAD=$(git rev-parse HEAD)
