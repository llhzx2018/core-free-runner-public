name: TEMP S01-C02 Ops 1.21.845 Formal Release
on:
  push:
    branches:
      - temp/s01-c02-v121845-runtime-suffix-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121845-formal-release.yml'
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      COMMIT: b2e54350130866ac569b379473773d281c6d04f2
      TREE: 27f7ba81b227c6d2e93c55311aef7f041a081d61
      TAG: v1.21.845
      ASSET: vf-tools-ops_V1.21.845.zip
      BYTES: '3308390'
      SHA256: 96a290a9f6695711c81af288464c158944a786498671e5c47f449b283f370e3b
      FILES: '927'
      FP: 53c40d4311ae0923d534505c85995e77b55ea291b784072d347093114880b61e
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
    steps:
      - name: Verify authority gates and release absence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/main --jq .object.sha)" = "$COMMIT"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/develop --jq .object.sha)" = "$COMMIT"
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          if gh api "repos/llhzx2018/vf-tools-ops/git/ref/tags/$TAG" >/dev/null 2>&1; then exit 1; fi
          if gh release view "$TAG" --repo llhzx2018/vf-tools-ops >/dev/null 2>&1; then exit 1; fi
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Rebuild exact artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = 1.21.845
          php ops/.github/phase3/v121845-final-audit-runtime-suffix-retry.php | grep -Fxq PASS_V121845_FINAL_AUDIT_RUNTIME_SUFFIX_RETRY
          mkdir -p /tmp/release
          python3 - <<'PY'
          import re, hashlib, zipfile, os
          from pathlib import Path
          root=Path('ops'); files={}
          def ok(r):
              p=r.as_posix(); q=p.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in q): return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
              if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
              return q[0] in {'includes','assets','languages','config'}
          for s in root.rglob('*'):
              if s.is_file() and not s.is_symlink():
                  r=s.relative_to(root)
                  if ok(r): files[r.as_posix()]=s.read_bytes()
          files=dict(sorted(files.items())); fp=hashlib.sha256()
          for r,b in files.items(): fp.update((r+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          z=Path('/tmp/release/'+os.environ['ASSET'])
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              for r,b in files.items():
                  info=zipfile.ZipInfo('vf-ops/'+r,(2026,9,6,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=0o100644<<16; out.writestr(info,b)
          actual_sha=hashlib.sha256(z.read_bytes()).hexdigest(); actual_fp=fp.hexdigest()
          assert str(z.stat().st_size)==os.environ['BYTES']
          assert actual_sha==os.environ['SHA256']
          assert str(len(files))==os.environ['FILES']
          assert actual_fp==os.environ['FP']
          print('FORMAL_ASSET_BYTES='+str(z.stat().st_size))
          print('FORMAL_ASSET_SHA256='+actual_sha)
          print('FORMAL_RUNTIME_FILES='+str(len(files)))
          print('FORMAL_RUNTIME_FP='+actual_fp)
          PY
          unzip -tq "/tmp/release/$ASSET" >/dev/null
      - name: Create formal tag release and asset
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/notes.md <<'EOF'
          VF Tools Ops V1.21.845 closes the overly strict Final Audit failure-shape boundary proven on Production V1.21.844.

          - Focused Gate 34009797280 PASS on exact source b2e54350130866ac569b379473773d281c6d04f2 / tree 27f7ba81b227c6d2e93c55311aef7f041a081d61.
          - Deterministic Artifact Identity 34009819432 PASS.
          - Production V1.21.844 remains current before OWNER upgrade with reusable Static Source, manualSourceUploadRequired=false, candidatePackageReady=false and finalOnlinePass=NO.
          - V1.21.844 correctly failed closed at record_isolation_final_audit_boundary_changed because its recovery boundary required the single Final Audit reopen failure to equal the fixed sentence byte-for-byte.
          - Proven legitimate runtime form may append a full-width Chinese semicolon and non-whitespace PHP runtime detail to the same fixed Final Audit sentence.
          - V1.21.845 accepts exactly two grammars only: the fixed sentence, or that exact sentence plus `；` plus a non-whitespace Unicode suffix. ASCII semicolon, empty/whitespace suffixes, prefix drift and generic substring matching remain rejected.
          - All V1.21.844 safety gates remain independently re-proved: trusted DONE inspection, immutable Source SHA, exact lineage, terminal early-stage contradiction, failed final_decision, durable-kick boundary, release-record pointers, Source hashes, blocker source and blocker job identity.
          - Only after proof does V1.21.845 rebind to the trusted inspection, create a distinct RUNNING Stage-0 Candidate with no inherited audit failure and exact Source SHA, then delegate bounded execution to the existing V1.21.834 worker.
          - Static Source is not uploaded or mutated; the old failed Candidate is not reset or mutated; Final Audit, candidatePackageReady and finalOnline are never forced.
          - M3U8 migration/schema/DB, Seed HOLD, JD.gg, WPvivid, content governance and DNS are untouched.
          - Asset vf-tools-ops_V1.21.845.zip; 3308390 bytes; SHA256 96a290a9f6695711c81af288464c158944a786498671e5c47f449b283f370e3b; runtime files 927; fingerprint 53c40d4311ae0923d534505c85995e77b55ea291b784072d347093114880b61e.
          - Production upgrade is NOT executed by this GitHub Release.
          EOF
          gh release create "$TAG" "/tmp/release/$ASSET#$ASSET" --repo llhzx2018/vf-tools-ops --target "$COMMIT" --title 'VF Tools Ops v1.21.845' --notes-file /tmp/notes.md
          gh api "repos/llhzx2018/vf-tools-ops/releases/tags/$TAG" > /tmp/release.json
          jq -e --arg t "$TAG" --arg c "$COMMIT" --arg a "$ASSET" --argjson b "$BYTES" --arg d "sha256:$SHA256" '.tag_name==$t and .target_commitish==$c and .draft==false and .prerelease==false and ([.assets[] | select(.name==$a and .size==$b and .digest==$d)] | length)==1' /tmp/release.json >/dev/null
          jq -r '"FORMAL_RELEASE_ID=" + (.id|tostring), "FORMAL_ASSET_ID=" + (.assets[0].id|tostring), "FORMAL_PUBLISHED_AT=" + .published_at' /tmp/release.json
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          echo FORMAL_RELEASE_V121845=PASS
