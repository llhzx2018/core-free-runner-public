name: S01-C01 Theme 1.35.18 Formal Release

on:
  push:
    branches: [temp/s01-c01-v13518-formal-release-20260907]
    paths:
      - '.github/workflows/temp-s01-c01-v13518-formal-release-20260907.yml'

permissions:
  contents: read

concurrency:
  group: s01-c01-v13518-formal-release-20260907
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      THEME_SHA: 72d2a83da7b940a080d48c40891555dc815aaafa
      THEME_BASE: 4c89a0b78b0ab767ab0b80c702a65d2ccc0f84f0
      THEME_TAG: v1.35.18
      THEME_ASSET: vf-tools-theme_V1.35.18.zip

    steps:
      - name: Credential authority gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
          echo 'CREDENTIAL_MODEL=READ_WRITE_SEPARATED'
          echo 'PRODUCTION_WRITE_USED=NO'

      - name: Checkout exact Theme source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.THEME_SHA }}
          token: ${{ env.READ_TOKEN }}
          path: theme
          fetch-depth: 0
          persist-credentials: false

      - name: Exact source and regression gates
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C theme rev-parse HEAD)" = "$THEME_SHA"
          test "$(tr -d '\r\n' < theme/VERSION)" = '1.35.18'
          grep -Eq '^Version: 1\.35\.18$' theme/src/style.css
          grep -Fq 'V1.35.18_S01_DEEP_HUMAN_LANGUAGE' theme/src/style.css
          php theme/tests/deep-admin-human-language-contract.php
          php theme/tests/update-center-human-language-contract.php
          php theme/tests/update-refresh-policy-contract.php
          php theme/tests/visible-console-v2-contract.php
          php theme/tests/workbench-primary-action-contract.php
          php theme/tests/public-reading-final-owner-contract.php
          find theme -type f -name '*.php' -not -path '*/.git/*' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l >/dev/null
          python3 - <<'PY'
          import os,subprocess
          got=set(subprocess.check_output(['git','-C','theme','diff','--name-only',os.environ['THEME_BASE']+'..'+os.environ['THEME_SHA']],text=True).splitlines())
          expected={
            'VERSION',
            'src/inc/admin/views/brand.php',
            'src/inc/admin/views/navigation.php',
            'src/style.css',
            'tests/deep-admin-human-language-contract.php',
            'tests/update-refresh-policy-contract.php',
            'tests/visible-console-v2-contract.php',
            'tests/workbench-primary-action-contract.php',
          }
          assert got==expected,(got,expected)
          forbidden=('migration','schema')
          assert not any(any(x in p.lower() for x in forbidden) or p.startswith('src/assets/css/') or p.startswith('src/inc/update/') or p.startswith('src/inc/seo/') or p.startswith('src/inc/recovery/') or p=='src/functions.php' for p in got),got
          print('EXACT_EIGHT_FILE_SCOPE=PASS')
          print('RUNTIME_UPDATE_AND_PUBLIC_BOUNDARY=PASS')
          PY
          echo 'FORMAL_SOURCE_GATE=PASS'

      - name: Build deterministic candidates twice and lock runtime authority
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/release-a" "$RUNNER_TEMP/release-b" "$RUNNER_TEMP/authority"
          cat > /tmp/theme-authority.php <<'PHP'
          <?php
          define('ABSPATH','/');
          class WP_Error { public function __construct(...$x){} }
          require $argv[1].'/src/inc/update/class-vf-theme-runtime-authority-v1.php';
          $s=VF_Theme_Runtime_Authority_V1::snapshot($argv[1].'/src');
          unset($s['files']);
          echo json_encode($s, JSON_UNESCAPED_SLASHES), "\n";
          PHP
          php /tmp/theme-authority.php theme > "$RUNNER_TEMP/authority/theme.json"
          python3 - <<'PY' > "$RUNNER_TEMP/metrics.env"
          from pathlib import Path
          import hashlib,json,os,zipfile
          src=Path('theme/src')
          rows=[(p.relative_to(src).as_posix(),p.read_bytes()) for p in sorted(src.rglob('*'),key=lambda x:x.relative_to(src).as_posix()) if p.is_file()]
          assert len(rows) >= 440, len(rows)
          def ident(items):
              h=hashlib.sha256()
              for rel,b in sorted(items): h.update((rel+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
              return len(items),h.hexdigest()
          def build(outdir):
              out=Path(outdir); out.mkdir(parents=True,exist_ok=True)
              dirs={'vf-tools-theme/'}
              for rel,_ in rows:
                  cur='vf-tools-theme'
                  for part in rel.split('/')[:-1]: cur+='/'+part; dirs.add(cur+'/')
              zp=out/os.environ['THEME_ASSET']
              with zipfile.ZipFile(zp,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for d in sorted(dirs):
                      zi=zipfile.ZipInfo(d); zi.date_time=(1980,1,1,0,0,0); zi.external_attr=(0o40755<<16)|0x10; z.writestr(zi,b'')
                  for rel,b in rows:
                      zi=zipfile.ZipInfo('vf-tools-theme/'+rel); zi.date_time=(1980,1,1,0,0,0); zi.compress_type=zipfile.ZIP_DEFLATED; zi.external_attr=0o100644<<16; z.writestr(zi,b)
              with zipfile.ZipFile(zp) as z:
                  assert z.testzip() is None
                  files=[x for x in z.infolist() if not x.is_dir()]
                  assert len(files)==len(rows)
                  assert sorted({x.filename.split('/')[0] for x in files})==['vf-tools-theme']
                  assert b'Version: 1.35.18' in z.read('vf-tools-theme/style.css')
              count,fp=ident(rows)
              auth=json.load(open(Path(os.environ['RUNNER_TEMP'])/'authority/theme.json'))
              return {'THEME_FILES':str(count),'THEME_RUNTIME_FILES':str(auth['file_count']),'THEME_BYTES':str(zp.stat().st_size),'THEME_SHA256':hashlib.sha256(zp.read_bytes()).hexdigest(),'THEME_FP':fp,'THEME_RUNTIME_FP':auth['fingerprint_sha256']}
          a=build(os.environ['RUNNER_TEMP']+'/release-a'); b=build(os.environ['RUNNER_TEMP']+'/release-b'); assert a==b,(a,b)
          for k in sorted(a): print(f'{k}={a[k]}')
          PY
          cat "$RUNNER_TEMP/metrics.env"
          cat "$RUNNER_TEMP/metrics.env" >> "$GITHUB_ENV"
          cmp "$RUNNER_TEMP/release-a/$THEME_ASSET" "$RUNNER_TEMP/release-b/$THEME_ASSET"
          echo 'DOUBLE_BUILD_DETERMINISM=PASS'
          echo 'RUNTIME_AUTHORITY=PASS'

      - name: Tag, draft, remote readback and publish transaction
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          REPO='llhzx2018/vf-tools-theme'
          created_tag=0; created_release=0
          cleanup(){ rc=$?; if [ "$rc" -ne 0 ]; then if [ "$created_release" -eq 1 ]; then gh release delete "$THEME_TAG" --repo "$REPO" --cleanup-tag --yes >/dev/null 2>&1 || true; fi; if [ "$created_tag" -eq 1 ]; then gh api --method DELETE "repos/$REPO/git/refs/tags/$THEME_TAG" >/dev/null 2>&1 || true; fi; fi; exit "$rc"; }
          trap cleanup EXIT
          ! gh release view "$THEME_TAG" --repo "$REPO" >/dev/null 2>&1
          ! gh api "repos/$REPO/git/ref/tags/$THEME_TAG" >/dev/null 2>&1
          test "$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')" = "$THEME_SHA"
          echo 'REMOTE_RELEASE_PREFLIGHT=PASS'
          gh api --method POST "repos/$REPO/git/refs" -f ref="refs/tags/$THEME_TAG" -f sha="$THEME_SHA" >/dev/null
          created_tag=1
          test "$(gh api "repos/$REPO/git/ref/tags/$THEME_TAG" --jq '.object.sha')" = "$THEME_SHA"
          cat > "$RUNNER_TEMP/release-notes.txt" <<EOF
          S01-C01 · Deep Admin Human Language. Brand and Navigation now use plain Chinese for default-visible settings, placement, ownership and front-end verification guidance. Raw internal location values, routes, IDs, settings, runtime verification, update behavior, public rendering and recovery semantics are unchanged. Git/Release PASS does not claim Production visibility.

          Exact source: $THEME_SHA
          Package files: $THEME_FILES
          Package fingerprint: $THEME_FP
          Runtime files: $THEME_RUNTIME_FILES
          Runtime fingerprint: $THEME_RUNTIME_FP
          Asset bytes: $THEME_BYTES
          Asset SHA256: $THEME_SHA256
          Product Gate: 34127798952 PASS
          Production Gate: NOT_RUN
          EOF
          gh release create "$THEME_TAG" "$RUNNER_TEMP/release-a/$THEME_ASSET" --repo "$REPO" --title 'VF Tools Theme V1.35.18' --notes-file "$RUNNER_TEMP/release-notes.txt" --draft --verify-tag
          created_release=1
          mkdir -p "$RUNNER_TEMP/readback"
          gh release download "$THEME_TAG" --repo "$REPO" --pattern "$THEME_ASSET" --dir "$RUNNER_TEMP/readback"
          test "$(stat -c %s "$RUNNER_TEMP/readback/$THEME_ASSET")" = "$THEME_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/readback/$THEME_ASSET" | awk '{print $1}')" = "$THEME_SHA256"
          python3 - <<'PY'
          import os,zipfile
          p=os.path.join(os.environ['RUNNER_TEMP'],'readback',os.environ['THEME_ASSET'])
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              files=[x for x in z.infolist() if not x.is_dir()]
              assert len(files)==int(os.environ['THEME_FILES'])
              assert sorted({x.filename.split('/')[0] for x in files})==['vf-tools-theme']
              assert b'Version: 1.35.18' in z.read('vf-tools-theme/style.css')
          print('REMOTE_ASSET_EXACT_READBACK_BEFORE_PUBLISH=PASS')
          PY
          gh release edit "$THEME_TAG" --repo "$REPO" --draft=false
          gh api "repos/$REPO/releases/tags/$THEME_TAG" > "$RUNNER_TEMP/release.json"
          test "$(jq -r '.draft' "$RUNNER_TEMP/release.json")" = false
          test "$(jq -r '.prerelease' "$RUNNER_TEMP/release.json")" = false
          test "$(jq -r --arg a "$THEME_ASSET" '.assets[]|select(.name==$a)|.size' "$RUNNER_TEMP/release.json")" = "$THEME_BYTES"
          test "$(jq -r --arg a "$THEME_ASSET" '.assets[]|select(.name==$a)|.digest' "$RUNNER_TEMP/release.json")" = "sha256:$THEME_SHA256"
          test "$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')" = "$THEME_SHA"
          test "$(gh api "repos/$REPO/git/ref/tags/$THEME_TAG" --jq '.object.sha')" = "$THEME_SHA"
          trap - EXIT
          echo "THEME_RELEASE_ID=$(jq -r '.id' "$RUNNER_TEMP/release.json")"
          echo "THEME_ASSET_ID=$(jq -r --arg a "$THEME_ASSET" '.assets[]|select(.name==$a)|.id' "$RUNNER_TEMP/release.json")"
          echo 'FORMAL_RELEASE=PASS'
          echo 'REMOTE_ASSET_EXACT_READBACK=PASS'
          echo 'TESTED_ARTIFACT_EQUALS_DELIVERED_ARTIFACT=PASS'
