name: TEMP S01-C02 v1.21.819 Formal Release
on:
  push:
    branches: [temp/s01-c02-v121819-build-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121819-formal-release.yml']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPS_SHA: 00bc49b070485c6095a3b5bd3337b3fcc23d42f5
      OPS_TREE: 601d8e12aaa00574adffcff8efbfb6ae564ecab5
      ASSET_NAME: vf-tools-ops_V1.21.819.zip
      ASSET_BYTES: '3234853'
      ASSET_SHA: f58109dc109f33e0f82f53a5905b2d6c59d5ebb7bc3200d98143b30b3bd8d7d0
      RUNTIME_FILES: '905'
      RUNTIME_FP: 5a98012e557c81587821ea20aadd99bf981745f6351d34e518c54d5935111693
    steps:
      - name: Checkout exact Ops source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_SHA }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Verify promoted source and rebuild exact Candidate
        shell: bash
        env:
          R: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          main=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/main | jq -r '.commit.sha')
          develop=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/develop | jq -r '.commit.sha')
          test "$main" = "$OPS_SHA"
          test "$develop" = "$OPS_SHA"
          test "$(git -C ops rev-parse HEAD)" = "$OPS_SHA"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$OPS_TREE"
          php ops/.github/phase3/v121819-new-job-terminal-evidence-reset.php
          mkdir -p /tmp/release
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,zipfile
          root=Path('ops'); runtime=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.is_symlink(): continue
              rel=p.relative_to(root).as_posix(); parts=rel.split('/'); low=[x.lower() for x in parts]
              if any(x in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in low): continue
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I): continue
              if '/' not in rel:
                  if rel not in {'vf-ops.php','uninstall.php'}: continue
              elif parts[0] not in {'includes','assets','languages','config'}: continue
              runtime.append((rel,p.read_bytes()))
          runtime.sort(key=lambda x:x[0])
          fp=hashlib.sha256()
          for rel,b in runtime: fp.update((rel+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          z=Path('/tmp/release/vf-tools-ops_V1.21.819.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              for rel,b in runtime:
                  i=zipfile.ZipInfo('vf-ops/'+rel,(2026,9,5,0,0,0)); i.compress_type=zipfile.ZIP_DEFLATED; i.external_attr=0o100644<<16; out.writestr(i,b)
          assert len(runtime)==int('905')
          assert fp.hexdigest()=='5a98012e557c81587821ea20aadd99bf981745f6351d34e518c54d5935111693'
          assert z.stat().st_size==3234853
          assert hashlib.sha256(z.read_bytes()).hexdigest()=='f58109dc109f33e0f82f53a5905b2d6c59d5ebb7bc3200d98143b30b3bd8d7d0'
          PY
          unzip -tq "/tmp/release/$ASSET_NAME" >/dev/null
          echo EXACT_CANDIDATE_ARTIFACT=PASS
      - name: Create and read back Formal Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          ! gh release view v1.21.819 --repo llhzx2018/vf-tools-ops >/dev/null 2>&1
          gh release create v1.21.819 "/tmp/release/$ASSET_NAME" \
            --repo llhzx2018/vf-tools-ops \
            --target "$OPS_SHA" \
            --title 'VF Tools Ops v1.21.819' \
            --notes 'S01-C02 Static New Job Terminal Evidence Reset V1. Fixes a proven stale-terminal-evidence poisoning defect: a newly created inspect-only Source Inspection job could inherit the previous Candidate job terminal fields after the current release record was rebound, causing the fresh job to fail at final_decision before Source Inspection ran. New jobs now clear only mutable terminal Candidate evidence while preserving source authority. For the exact proven poisoned legacy signature only (inspect_only + incomplete + terminal FAIL at final_decision + candidate_audit failures), an existing readable Source is rebound only after exact durable SHA-256 authority match into a fresh private inspection job. Real Source Inspection failures, normal Candidate failures, completed inspections, and jobs without candidate_audit are fail-closed and are not auto-rebound. Existing recovered Simply Static Source remains preserved; no repeat source upload is authorized. No M3U8 migration/schema/DB write, Seed HOLD release, JD.gg/WPvivid mutation, content write, Production activation or DNS write is performed by this release.'
          j=$(gh api repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.819)
          test "$(jq -r '.target_commitish' <<<"$j")" = "$OPS_SHA"
          test "$(jq -r '.draft' <<<"$j")" = false
          test "$(jq -r '.prerelease' <<<"$j")" = false
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .size' <<<"$j")" = "$ASSET_BYTES"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .digest' <<<"$j")" = "sha256:$ASSET_SHA"
          echo "RELEASE_ID=$(jq -r '.id' <<<"$j")"
          echo "ASSET_ID=$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .id' <<<"$j")"
          echo "PUBLISHED_AT=$(jq -r '.published_at' <<<"$j")"
          echo PASS_V121819_FORMAL_RELEASE
