name: GOV actual rule-read ordering exact-source proof (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gov-rule-read-order-proof.yml

permissions:
  contents: read

jobs:
  gov-rule-read-order:
    if: >-
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'maintenance/gov-rule-read-order-proof-20261112'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GOV_EXACT_SHA: 43980b1be99f4eff64bfdf93848a4fc3009883ca
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact GOV-DOC private source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.GOV_EXACT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov-transient

      - name: Verify source identity and shared router
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C gov-transient rev-parse HEAD)" = "$GOV_EXACT_SHA"
          echo GOV_EXACT_SOURCE=PASS
          python3 -B gov-transient/governance/public-authority/tools/public_authority_router_lint.py \
            > "$RUNNER_TEMP/router.log" 2>&1
          echo GOV_PUBLIC_ROUTER=PASS

      - name: Structural contract and actual-read-order negative regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd gov-transient
          if python3 -B -m unittest discover -s governance/public-authority/tests \
            -p 'test_task_delivery_contract_lint.py' -v \
            > "$RUNNER_TEMP/contract-tests.log" 2>&1; then
            grep -E '^(Ran [0-9]+ tests|OK)$' "$RUNNER_TEMP/contract-tests.log" || true
            echo GOV_EXISTING_DELIVERY_GUARD=PASS
          else
            grep -E '^(Ran [0-9]+ tests|FAILED|ERROR)' "$RUNNER_TEMP/contract-tests.log" || true
            echo GOV_EXISTING_DELIVERY_GUARD=FAIL
            exit 1
          fi
          if python3 -B -m unittest discover -s governance/public-authority/tests \
            -p 'test_task_rule_read_order_lint.py' -v \
            > "$RUNNER_TEMP/trace-tests.log" 2>&1; then
            grep -E '^(Ran [0-9]+ tests|OK)$' "$RUNNER_TEMP/trace-tests.log" || true
            echo GOV_RULE_READ_ORDER_NEGATIVE_FIXTURES=PASS
          else
            grep -E '^(Ran [0-9]+ tests|FAILED|ERROR)' "$RUNNER_TEMP/trace-tests.log" || true
            echo GOV_RULE_READ_ORDER_NEGATIVE_FIXTURES=FAIL
            exit 1
          fi
          echo GOV_HOST_TRACE_AUTHENTICITY=NOT_VERIFIED
          echo GOV_AGENT_BEHAVIOR=NOT_OBSERVED
          echo GOV_FORMAL_RELEASE=NO
          echo GOV_PRODUCTION=NO

      - name: Remove private source and temporary logs
        if: always()
        shell: bash
        run: |
          rm -rf gov-transient
          rm -f "$RUNNER_TEMP/router.log" "$RUNNER_TEMP/contract-tests.log" \
                "$RUNNER_TEMP/trace-tests.log"
          echo GOV_TEMP_SOURCE_CLEANUP=ATTEMPTED
