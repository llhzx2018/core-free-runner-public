name: P02 V2.5.32 Convergence Exec
on:
  push:
    branches: [run/p02-v2532-convergence-write]
permissions:
  contents: read
jobs:
  converge:
    runs-on: ubuntu-24.04
    env:
      BASE_REF: c120559901039344bf0d7421cb05a1badd8b7962
    steps:
      - name: Checkout runner patch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: run/p02-v2532-convergence-write
          persist-credentials: false
          path: runner-source
      - name: Checkout exact P02 develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.BASE_REF }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: product
      - name: Extract and apply convergence patch
        run: |
          set -Eeuo pipefail
          awk '
            /python3 - <<'"'"'PY'"'"'/{capture=1;next}
            capture && $0=="          PY"{exit}
            capture{sub(/^          /,"");print}
          ' runner-source/.github/workflows/p02-v2532-convergence-write.yml > /tmp/p02-v2532-converge.py
          test -s /tmp/p02-v2532-converge.py
          cd product
          python3 /tmp/p02-v2532-converge.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('tests/unit/p02_reader_action_continuity.mjs')
          s=p.read_text(encoding='utf-8')
          bad="'wireReadingState($('#main'),content,tocLinks,$('#readerProgress'),item.id)'"
          good='"wireReadingState($(\'#main\'),content,tocLinks,$(\'#readerProgress\'),item.id)"'
          if bad not in s:
              raise SystemExit('reader action contract quoting target missing')
          p.write_text(s.replace(bad,good,1),encoding='utf-8')

          app=Path('public/assets/app.js')
          js=app.read_text(encoding='utf-8')
          js2,n=re.subn(r'<button data-reader-page-action="edit">.*?</button>','',js,count=1)
          if n!=1:
              raise SystemExit(f'duplicate Reader More edit removal expected 1, got {n}')
          app.write_text(js2,encoding='utf-8')
          PY
          python3 scripts/generate-source-manifest.py
          python3 scripts/verify-source-manifest.py
      - name: Verify syntax and contracts
        working-directory: product
        run: |
          set -Eeuo pipefail
          node --check public/assets/app.js
          php -l public/index.php
          test "$(tr -d '\r\n' < VERSION)" = '2.5.32'
          test ! -e public/assets/v2521-context-ux.js
          test ! -e public/assets/v2521-context-ux.css
          if grep -q 'v2521-context-ux' public/index.php; then exit 1; fi
          for t in tests/unit/p02_*.mjs; do node "$t"; done
          python3 scripts/verify-source-manifest.py
          python3 scripts/repository-gates.py
          python3 - <<'PY'
          import json
          m=json.load(open('SOURCE_MANIFEST.json',encoding='utf-8'))
          c=json.load(open('docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json',encoding='utf-8'))
          assert m['version']=='2.5.32' and m['runtime_source_file_count']==80
          assert c['candidate_version']=='2.5.32' and c['runtime_source_file_count']==80
          assert c['production_version']=='2.5.31'
          print('P02_V2532_NATIVE_CONVERGENCE_CONTRACTS=PASS')
          PY
      - name: Commit and push develop only
        working-directory: product
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$WRITE_TOKEN"
          git fetch origin develop
          test "$(git rev-parse origin/develop)" = "$BASE_REF"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add -A
          git diff --cached --check
          git commit -m 'feat(P02): converge UX runtime natively for V2.5.32'
          AUTH="$(printf 'x-access-token:%s' "$WRITE_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:develop
          echo P02_DEVELOP_WRITE=PASS
          echo P02_MAIN_WRITE=NO
          echo TAG_WRITE=NO
          echo RELEASE_WRITE=NO
          echo UPDATE_CHANNEL_WRITE=NO
