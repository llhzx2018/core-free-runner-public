name: S01-C01 eight-page integration formal release
on:
  push:
    branches: [task/s01-c01-eight-page-13596-formal]
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.96'
      TARGET_SHA: '4d5e2b2b4383f9cb09ce845ff0738e867d5b763a'
      TARGET_TREE: 'd57ce6cc356e11c484dd12a1b38181f6a7d44991'
      SOURCE_VERSION: '1.35.95'
      BASE_SHA: 'a2f8fa33d21bee1a484f591385080c27248e3a81'
      CANDIDATE_RUN: '37450030893'
      CANDIDATE_SHA: '7e8ee9d2770eabfe2d1a74a062fc216963b06a8f'
      CANDIDATE_RUNNER_SHA: '677a376a31f120715a34bd10b8ee83b23e3e64de'
      CANDIDATE_ARTIFACT_ID: '11405387401'
      CANDIDATE_ARTIFACT_DIGEST: 'sha256:babb78ee6d699385c940abbf4f6ed6fc55f39a26178d3ba9204d5a1714cc1306'
      UPGRADE_RUN: '37450030893'
      UPGRADE_RUNNER_SHA: '677a376a31f120715a34bd10b8ee83b23e3e64de'
      UPGRADE_ARTIFACT_ID: '11405387401'
      UPGRADE_ARTIFACT_DIGEST: 'sha256:babb78ee6d699385c940abbf4f6ed6fc55f39a26178d3ba9204d5a1714cc1306'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runner
          persist-credentials: false
      - name: Target-owned formal lane identity preflight
        run: |
          set -Eeuo pipefail
          mkdir -p proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-c01-eight-page-13596/formal-spec.json --template runner/lanes/s01-c01-eight-page-13596/formal.template.yml --output /tmp/preview-formal-rendered.yml >/dev/null
          cmp /tmp/preview-formal-rendered.yml runner/.github/workflows/s01-c01-eight-page-13596-formal.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-c01-eight-page-13596/formal-spec.json --input runner/.github/workflows/s01-c01-eight-page-13596-formal.yml > proof/formal-lane-identity-audit.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Reverse verify exact tested tree and rebuilt bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$CANDIDATE_RUN --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$CANDIDATE_RUN --jq .head_sha)" = "$CANDIDATE_RUNNER_SHA"
          gh api "repos/llhzx2018/core-free-runner-public/actions/artifacts/$CANDIDATE_ARTIFACT_ID" > /tmp/tested-artifact-meta.json
          gh api "repos/llhzx2018/core-free-runner-public/actions/artifacts/$CANDIDATE_ARTIFACT_ID/zip" > /tmp/tested-artifact.zip
          python3 - <<'PYARTIFACT'
          import os,json,pathlib,hashlib,zipfile,stat
          meta=json.loads(pathlib.Path('/tmp/tested-artifact-meta.json').read_text())
          data=pathlib.Path('/tmp/tested-artifact.zip').read_bytes()
          assert meta['id']==int(os.environ['CANDIDATE_ARTIFACT_ID']) and meta['workflow_run']['id']==int(os.environ['CANDIDATE_RUN'])
          assert meta['workflow_run']['head_sha']==os.environ['CANDIDATE_RUNNER_SHA'] and not meta['expired']
          assert meta['digest']==os.environ['CANDIDATE_ARTIFACT_DIGEST']=='sha256:'+hashlib.sha256(data).hexdigest()
          assert meta['size_in_bytes']==len(data)
          with zipfile.ZipFile('/tmp/tested-artifact.zip') as z:
              assert z.testzip() is None
              names=z.namelist();assert len(names)==len(set(names))
              for entry in z.infolist():
                  p=pathlib.PurePosixPath(entry.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in entry.filename and not stat.S_ISLNK(entry.external_attr>>16)
                  assert p.suffix in ['.json','.png']
                  if p.suffix=='.json':json.loads(z.read(entry))
              z.extractall('tested')
          PYARTIFACT
          jq -e --arg sha "$CANDIDATE_SHA" --arg tree "$TARGET_TREE" --arg ver "$TARGET_VERSION" '.status=="PASS" and .source_sha==$sha and .source_tree==$tree and .version==$ver and .canonical_page_count==8 and .layout_context_count==20 and .data_checks>=44 and .cross_page_cases>=15 and .security_boundary=="PASS" and .frozen_shell_header_menu=="PASS" and (.pages|length)==8 and (.pages|all(.status=="PASS" and .widths==6))' tested/proof/FINAL_EVIDENCE.json >/dev/null
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$UPGRADE_RUN --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$UPGRADE_RUN --jq .head_sha)" = "$UPGRADE_RUNNER_SHA"
          gh api "repos/llhzx2018/core-free-runner-public/actions/artifacts/$UPGRADE_ARTIFACT_ID" > /tmp/upgrade-artifact-meta.json
          gh api "repos/llhzx2018/core-free-runner-public/actions/artifacts/$UPGRADE_ARTIFACT_ID/zip" > /tmp/upgrade-artifact.zip
          python3 runner/lanes/s01-c01-eight-page-13596/verify-upgrade-artifact.py
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          cp -a runner/lanes/s01-c01-eight-page-13596 lane
          python3 lane/build.py
          python3 - <<'PY'
          import json,pathlib
          tested=json.loads(pathlib.Path('tested/proof/FINAL_EVIDENCE.json').read_text()); built=json.loads(pathlib.Path('proof/identity.json').read_text())
          for key in ['asset','asset_bytes','asset_sha256','source_tree','version']: assert tested[key]==built[key],key
          PY
      - name: Publish private formal Release and exact remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          ASSET="vf-tools-theme_V${TARGET_VERSION}.zip"; TAG="v$TARGET_VERSION"
          cat > /tmp/release-notes.md <<EOF
          VF Tools Theme V$TARGET_VERSION

          修复后台八页联动检查发现的恢复功能缺陷：配置导入与恢复完整保留导航页的页头、CTA、多语言文案与页脚设置，自定义配置不会因遗漏 shell 而发生读回不一致和回滚。
          Exact candidate Run: $CANDIDATE_RUN；Native upgrade and recovery Run: $UPGRADE_RUN。后台八页与六种宽度的控件及状态、20种布局上下文、连续跨页保存与前台生效、44项恢复数据检查、旧版反例、干净安装及$SOURCE_VERSION→$TARGET_VERSION原生升级/回退/再应用通过。
          保持已批准的 Shell/Header/Header Menu、原有恢复服务、权限、nonce、Schema、Updater 与各组件数据责任边界。
          工程验证范围为 Theme 八个外观后台页面及相关状态，不包含 Ops 平台工作区、真实 M3U8 Provider 业务或 Production 验收。Production由OWNER手工升级，OWNER真实使用为后置验收，独立Preview Runtime按SSOT为N_A。
          Exact promoted source: $TARGET_SHA; tree: $TARGET_TREE。
          EOF
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          else
            gh release create "$TAG" "proof/$ASSET" --repo "$TARGET_REPO" --target "$TARGET_SHA" --title "VF Tools Theme V$TARGET_VERSION" --notes-file /tmp/release-notes.md
          fi
          gh api "repos/$TARGET_REPO/releases/tags/$TAG" > proof/remote-release.json
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          mkdir readback
          gh release download "$TAG" --repo "$TARGET_REPO" --pattern "$ASSET" --dir readback
          cmp "proof/$ASSET" "readback/$ASSET"
          python3 - <<'PY'
          import json,pathlib,os
          p=pathlib.Path('proof'); m=json.loads((p/'identity.json').read_text());r=json.loads((p/'remote-release.json').read_text());t=json.loads(pathlib.Path('upgrade-tested/proof/FINAL_EVIDENCE.json').read_text());assert not r['draft'] and not r['prerelease'];a=[a for a in r['assets'] if a['name']==m['asset']];assert len(a)==1 and a[0]['size']==m['asset_bytes'] and a[0]['digest']=='sha256:'+m['asset_sha256'];m.update(release_id=r['id'],asset_id=a[0]['id'],released_at=r['published_at'],runtime_files=t['runtime_files'],runtime_fingerprint=t['runtime_fingerprint'],candidate_run=os.environ['CANDIDATE_RUN'],upgrade_run=os.environ['UPGRADE_RUN'],formal_release='PASS',remote_readback='PASS',distribution='NOT_EXECUTED',production='NOT_EXECUTED');(p/'RELEASE_RECEIPT.json').write_text(json.dumps(m,indent=2));print(json.dumps(m))
          PY
      - name: Public-safe receipt
        id: receipt_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-eight-page-release-${{ github.run_id }}
          path: proof/RELEASE_RECEIPT.json
          retention-days: 30
          if-no-files-found: error

      - name: Read back actual formal receipt ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_ARTIFACT_ID: ${{ steps.receipt_artifact.outputs.artifact-id }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RECEIPT_ARTIFACT_ID" > /tmp/formal-receipt-meta.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RECEIPT_ARTIFACT_ID/zip" > /tmp/formal-receipt.zip
          python3 - <<'PYRECEIPT'
          import os,json,pathlib,hashlib,zipfile
          meta=json.loads(pathlib.Path('/tmp/formal-receipt-meta.json').read_text())
          data=pathlib.Path('/tmp/formal-receipt.zip').read_bytes()
          digest='sha256:'+hashlib.sha256(data).hexdigest()
          assert meta['id']==int(os.environ['RECEIPT_ARTIFACT_ID']) and meta['workflow_run']['id']==int(os.environ['GITHUB_RUN_ID'])
          assert meta['workflow_run']['head_sha']==os.environ['GITHUB_SHA']
          assert not meta['expired'] and meta['digest']==digest and meta['size_in_bytes']==len(data)
          with zipfile.ZipFile('/tmp/formal-receipt.zip') as z:
              assert z.testzip() is None and z.namelist()==['RELEASE_RECEIPT.json']
              actual=json.loads(z.read('RELEASE_RECEIPT.json'))
              expected=json.loads(pathlib.Path('proof/RELEASE_RECEIPT.json').read_text())
              assert actual==expected and actual['source_sha']==os.environ['TARGET_SHA'] and actual['source_tree']==os.environ['TARGET_TREE'] and actual['formal_release']==actual['remote_readback']=='PASS'
          print('VF_FORMAL_AUDIT_BEGIN')
          print(pathlib.Path('proof/formal-lane-identity-audit.json').read_text())
          print('VF_FORMAL_AUDIT_END')
          print('VF_FORMAL_RECEIPT_BEGIN')
          print(json.dumps(actual))
          print('VF_FORMAL_RECEIPT_END')
          print('VF_FORMAL_ARTIFACT_BEGIN')
          print(json.dumps({'status':'PASS','id':meta['id'],'run_id':int(os.environ['GITHUB_RUN_ID']),'bytes':len(data),'digest':digest,'crc':'PASS','json_readback':'PASS'}))
          print('VF_FORMAL_ARTIFACT_END')
          PYRECEIPT
      - name: Private workspace cleanup
        if: always()
        run: rm -rf target readback proof/*.zip

