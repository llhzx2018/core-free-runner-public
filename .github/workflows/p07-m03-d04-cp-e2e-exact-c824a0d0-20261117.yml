name: P07 M03 D04 exact-source dual CloudPanel isolated E2E
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-cp-e2e-exact-c824a0d0-20261117.yml'
permissions:
  contents: read
jobs:
  dual-cloudpanel-mariadb-exact-source:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Public temporary harness checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient private exact P07 source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: c824a0d0fee0301c656e8ab228e10ae68e459f0f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: .p07-private-exact
      - name: Reuse previously proven dual-VM fixture with exact current product SHA
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          old=80e70ba47a1f0a8dc399e0381aeb29a66a7e6c4e
          new=c824a0d0fee0301c656e8ab228e10ae68e459f0f
          test "$(git -C .p07-private-exact rev-parse HEAD)" = "$new"
          fixture="$RUNNER_TEMP/p07-d04-dual-cloudpanel-verified-harness.sh"
          curl --retry 2 --connect-timeout 20 --max-time 120 -fsSL \
            https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/83a8fbf80760040a4f97a1299207625704680c49/tests/p07_m03_d04_mariadb_e2e_20261116.sh \
            -o "$fixture"
          python3 - "$fixture" "$old" "$new" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); source=p.read_text(encoding='utf-8')
          assert source.count(sys.argv[2]) == 1, 'unexpected fixture source identity'
          assert 'sudo qemu-system-x86_64' in source and 'clpctl db:import' in source
          p.write_text(source.replace(sys.argv[2],sys.argv[3]),encoding='utf-8')
          print('P07_D04_PRIOR_HARNESS_REUSED_EXACT_SOURCE=PASS')
          PY
          bash -n "$fixture"
          timeout --signal=TERM --kill-after=60s 3100s bash "$fixture"
      - name: Always remove private checkout and ephemeral fixture
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- .p07-private-exact
          rm -f -- "$RUNNER_TEMP/p07-d04-dual-cloudpanel-verified-harness.sh"
          test ! -e .p07-private-exact
          echo P07_D04_PRIVATE_WORKSPACE_CLEAN=PASS
