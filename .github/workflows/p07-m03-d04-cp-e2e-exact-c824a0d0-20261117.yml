name: P07 M03 D04 RC137 two CloudPanel VM single-and-whole acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-cp-e2e-exact-c824a0d0-20261117.yml'
permissions:
  contents: read
jobs:
  dual-cloudpanel-mariadb-exact-source:
    if: github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize'
    strategy:
      fail-fast: false
      matrix:
        scope: [WHOLE_VPS, ONE_SITE]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Public temporary harness checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient private exact P07 source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 72522708852f77abf807d76952ddecd361e44eeb
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: .p07-private-exact
      - name: Exact P07 target-inventory security and module regression
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-exact rev-parse HEAD)" = "72522708852f77abf807d76952ddecd361e44eeb"
          python3 -B .p07-private-exact/tests/test_p07_m03_d04_target_inventory_guard.py
          ( cd .p07-private-exact && python3 -B scripts/check_p07_modules.py )
          echo P07_D04_TARGET_INVENTORY_UNIT_AND_MODULES=PASS
      - name: Reuse original dual-QEMU CloudPanel test with exact RC137 bundled runtime
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
          SCOPE: ${{ matrix.scope }}
        run: |
          set -Eeuo pipefail
          old=80e70ba47a1f0a8dc399e0381aeb29a66a7e6c4e
          new=72522708852f77abf807d76952ddecd361e44eeb
          test "$(git -C .p07-private-exact rev-parse HEAD)" = "$new"
          export P07_RC137_CANDIDATE="$RUNNER_TEMP/p07-rc137-candidate-$SCOPE"
          python3 -B .p07-private-exact/scripts/p07_candidate_bundle.py \
            --product-root .p07-private-exact --public-root . \
            --output "$P07_RC137_CANDIDATE" \
            --product-sha 72522708852f77abf807d76952ddecd361e44eeb \
            --build 0.1.0-release137 --care 0.1.0-rc85
          test "$(cat "$P07_RC137_CANDIDATE/dist/p07/0.1.0/overlay/BUILD_ID")" = "0.1.0-release137"
          grep -q '  lib/migration_target_inventory_guard.py' "$P07_RC137_CANDIDATE/dist/p07/0.1.0/overlay/RUNTIME.gitblob"
          fixture="$RUNNER_TEMP/p07-d04-dual-cloudpanel-verified-harness.sh"
          curl --retry 2 --connect-timeout 20 --max-time 120 -fsSL \
            https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/83a8fbf80760040a4f97a1299207625704680c49/tests/p07_m03_d04_mariadb_e2e_20261116.sh \
            -o "$fixture"
          python3 - "$fixture" "$old" "$new" "$SCOPE" <<'PY'
          from pathlib import Path
          import sys
          f=Path(sys.argv[1]);old,new,scope=sys.argv[2:]
          assert scope in {"WHOLE_VPS","ONE_SITE"}
          script=f.read_text(encoding="utf-8")
          assert script.count(old)==1
          assert "sudo qemu-system-x86_64" in script and "clpctl db:import" in script
          script=script.replace(old,new)
          runtime='"$ROOT/.p07-private-exact/bin" "$ROOT/.p07-private-exact/lib"'
          replacement='"$P07_RC137_CANDIDATE/dist/p07/0.1.0/overlay/bin" "$P07_RC137_CANDIDATE/dist/p07/0.1.0/overlay/lib"'
          assert script.count(runtime)==1
          script=script.replace(runtime,replacement)
          original_build='"$ROOT/.p07-private-exact/BUILD_ID"'
          bundled_build='"$P07_RC137_CANDIDATE/dist/p07/0.1.0/overlay/BUILD_ID"'
          assert script.count(original_build)==1
          script=script.replace(original_build,bundled_build)
          # Match the official P07 installer: bin/* are chmod +x after overlay extraction.
          # The synthetic rsync staging bypasses the installer and otherwise leaves 0644 files.
          stage_marker="echo P07_M03_D04_EXACT_SOURCE_PR348_STAGED=PASS"
          assert script.count(stage_marker)==1
          script=script.replace(stage_marker,stage_marker+'\nssh_vm "$NEW" \'chmod +x /opt/vf-server-ops/bin/*\'')
          diag_marker='ssh_vm "$NEW" \x27bash -se\x27 <<\x27TARGET\x27'.replace('\\x27',"'").replace('\\x27',"'").replace('\\x27',"'")
          assert script.count(diag_marker)==1
          diagnostic = """ssh_vm "$NEW" 'python3 -B -' <<'DIAG'
          import json,sqlite3,sys
          from pathlib import Path
          sys.path.insert(0,'/opt/vf-server-ops/lib')
          try:
              import inventory
              manifest=inventory.build_manifest(Path('/'))
              sites=manifest.get('sites') or []
              result={
                  'source': manifest.get('discovery_source'),
                  'declared_count': (manifest.get('summary') or {}).get('site_count'),
                  'actual_count': len(sites),
                  'warnings_count': len(manifest.get('warnings') or []),
                  'site_flags': [{
                      'valid_domain':isinstance(s.get('domain'),str) and bool(s.get('domain')),
                      'valid_user': isinstance(s.get('site_user'),str) and s.get('site_user')!='UNKNOWN',
                      'db_list_known':isinstance(s.get('mysql_databases'),list),
                  } for s in sites if isinstance(s,dict)],
              }
              print('P07_CP_TARGET_MANIFEST_DIAG='+json.dumps(result,sort_keys=True))
          except Exception as ex:
              print('P07_CP_TARGET_MANIFEST_DIAG_EXCEPTION='+type(ex).__name__)
          try:
              conn=sqlite3.connect('file:/home/clp/htdocs/app/data/db.sq3?mode=ro',uri=True)
              cols={}
              for tbl in ('site','database'):
                  cols[tbl]=[row[1] for row in conn.execute('PRAGMA table_info("'+tbl+'")')]
              print('P07_CP_TARGET_SQLITE_COLUMNS='+json.dumps(cols,sort_keys=True))
              conn.close()
          except Exception as ex:
              print('P07_CP_TARGET_SQLITE_DIAG_EXCEPTION='+type(ex).__name__)
          DIAG
          """
          script=script.replace(diag_marker,diagnostic+diag_marker)
          marker='ssh_vm "$NEW" \'echo P07_M03_D04_TARGET_SSH_SESSION=PASS;'
          assert script.count(marker)==1
          check=('ssh_vm "$NEW" \'test "$(cat /opt/vf-server-ops/BUILD_ID)" = '
                 '"0.1.0-release137"\'\n'
                 'echo P07_D04_CANDIDATE_RC137_ACTUAL_TARGET_BYTES=PASS\n')
          script=script.replace(marker,check+marker)
          if scope=="ONE_SITE":
              plan="  --confirm-source-helper-staging ALLOW_SOURCE_HELPER_STAGING </dev/null >/root/p07-plan.json 2>/root/p07-plan.err"
              prepare="  --confirm PREPARE_PULL_MIGRATION </dev/null >/root/p07-prepare.json 2>/root/p07-prepare.err"
              assert script.count(plan)==1 and script.count(prepare)==1
              script=script.replace(plan,"  --site alpha.p07.example.com "+plan.lstrip())
              script=script.replace(prepare,"  --site alpha.p07.example.com "+prepare.lstrip())
              assert script.count("assert p['site_count']==2")==2
              script=script.replace("assert p['site_count']==2","assert p['site_count']==1")
              assert script.count("assert p['source_scope_kind']=='ALL_SOURCE_SITES'")==1
              script=script.replace("assert p['source_scope_kind']=='ALL_SOURCE_SITES'",
                                    "assert p['source_scope_kind']=='SELECTED_SITES'")
              beta_file='test "$(cat /home/p07beta/htdocs/beta.p07.example.com/index.html)" = P07_BETA_STATIC_23'
              assert script.count(beta_file)==1
              script=script.replace(beta_file,'test ! -e /home/p07beta/htdocs/beta.p07.example.com/index.html')
              beta_web='curl -ksS --resolve beta.p07.example.com:443:127.0.0.1 https://beta.p07.example.com/ | grep -Fq P07_BETA_STATIC_23'
              before,sep,after=script.partition("stage=VERIFY_HTTP")
              assert sep and after.count(beta_web)==1 and before.count(beta_web)==1
              after=after.replace(beta_web,'test ! -e /home/p07beta/htdocs/beta.p07.example.com/index.html')
              script=before+sep+after
              assert script.count("P07_M03_D04_MATCHED_MARIADB_ALL_SITES_PLAN=PASS")==1
              script=script.replace("P07_M03_D04_MATCHED_MARIADB_ALL_SITES_PLAN=PASS",
                                    "P07_M03_D04_MATCHED_MARIADB_ONE_SITE_PLAN=PASS")
          else:
              assert script.count("assert p['site_count']==2")==2
          f.write_text(script,encoding="utf-8")
          print("P07_D04_CLOUDPANEL_EXACT_TRIAL_SCOPE="+scope)
          PY
          bash -n "$fixture"
          timeout --signal=TERM --kill-after=60s 3100s bash "$fixture"
          echo "P07_D04_RC137_TWO_CLOUDPANEL_$(echo "$SCOPE")=PASS"
      - name: Always remove private checkout and ephemeral fixture
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- .p07-private-exact
          rm -f -- "$RUNNER_TEMP/p07-d04-dual-cloudpanel-verified-harness.sh"
          rm -rf -- "$RUNNER_TEMP/p07-rc137-candidate-WHOLE_VPS" "$RUNNER_TEMP/p07-rc137-candidate-ONE_SITE"
          test ! -e .p07-private-exact
          echo P07_D04_PRIVATE_WORKSPACE_CLEAN=PASS
