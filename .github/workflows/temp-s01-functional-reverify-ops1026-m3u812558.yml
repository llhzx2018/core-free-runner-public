name: S01 Functional Reverify OPS1026 M3U812558

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPS_REPO: llhzx2018/vf-tools-ops
      OPS_SHA: a0a5c48d9c422ea9f09c56bfd3eaaf3e7002b5ca
      OPS_BASE: a42b92936c86e9cdba21799af78a11e04fd4d47d
      OPS_VERSION: 1.21.1026
      OPS_PREV_TAG: v1.21.1025
      OPS_PREV_ASSET: vf-tools-ops_V1.21.1025.zip
      M3_REPO: llhzx2018/vf-tools-m3u8
      M3_SHA: abc2075b2861de2894a5ee0f9c195623fc12ccc9
      M3_BASE: 8a471748495642123727be1c3c351e599661956f
      M3_VERSION: 1.25.58
      M3_PREV_TAG: v1.25.57
      M3_PREV_ASSET: vf-tools-m3u8_V1.25.57.zip
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}

    steps:
      - name: Checkout exact candidates
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OPS_REPO }}
          ref: ${{ env.OPS_SHA }}
          token: ${{ env.READ_TOKEN }}
          path: ops
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact M3U8 candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ env.M3_REPO }}
          ref: ${{ env.M3_SHA }}
          token: ${{ env.READ_TOKEN }}
          path: m3
          fetch-depth: 0
          persist-credentials: false

      - name: Exact source and contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          test "$(git -C ops rev-parse HEAD)" = "$OPS_SHA"
          test "$(tr -d '\r\n' < ops/VERSION)" = "$OPS_VERSION"
          test "$(git -C m3 rev-parse HEAD)" = "$M3_SHA"
          test "$(tr -d '\r\n' < m3/VERSION)" = "$M3_VERSION"
          php ops/tests/s01-c02-1211026-m3u8-owner-truth-contract.php
          php ops/tests/s01-c02-v9-batch1-body-contract.php
          php ops/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          php m3/tests/unit/provider-overview-truth-contract.php
          php m3/tests/provider-dashboard-visible-ui-contract.php
          php m3/tests/s01-c03-page-body-system-v1-phase4-macro-contract.php
          php m3/tests/unit/dashboard-human-language-contract.php
          php m3/tests/unit/package-physical-locator-contract.php
          git -C ops diff --name-only "$OPS_BASE..$OPS_SHA" | tee evidence/ops-changed-files.txt
          git -C m3 diff --name-only "$M3_BASE..$M3_SHA" | tee evidence/m3-changed-files.txt
          ! grep -Eq '^includes/v6/(schema|repository|platform-backup-executor|recovery-service)\.php$' evidence/ops-changed-files.txt
          ! grep -Eq '^src/includes/v6-provider|^database/' evidence/m3-changed-files.txt
          echo SOURCE_CONTRACTS=PASS

      - name: PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm -v "$PWD/ops:/src:ro" -w /src php:8.3-cli sh -lc 'php -l vf-ops.php >/dev/null; php -l includes/s01/tool-workbench.php >/dev/null; php -l tests/s01-c02-1211026-m3u8-owner-truth-contract.php >/dev/null'
          docker run --rm -v "$PWD/m3:/src:ro" -w /src php:8.3-cli sh -lc 'php -l src/vf-tool-m3u8.php >/dev/null; php -l src/admin/Controller/class-v6-provider-operations-controller.php >/dev/null; php -l tests/unit/provider-overview-truth-contract.php >/dev/null'
          echo PHP_SYNTAX=PASS

      - name: Browser dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/vf-node && cd /tmp/vf-node
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.58.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Responsive browser proof
        shell: bash
        run: |
          set -Eeuo pipefail
          export NODE_PATH=/tmp/vf-node/node_modules
          node ops/tests/s01-c02-1211026-m3u8-owner-truth-browser-proof.js | tee evidence/ops-browser.json
          node m3/tests/unit/provider-overview-truth-browser-proof.js | tee evidence/m3-browser.json
          jq -e '.pass==true and (.failures|length)==0 and .owner_product_pass==false' evidence/ops-browser.json >/dev/null
          jq -e '.pass==true and (.failures|length)==0 and .owner_product_pass==false' evidence/m3-browser.json >/dev/null
          echo BROWSER_PROOF=PASS

      - name: Build candidate packages from last formal runtime
        shell: bash
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/pkg/ops /tmp/pkg/m3
          gh release download "$OPS_PREV_TAG" --repo "$OPS_REPO" --pattern "$OPS_PREV_ASSET" --dir /tmp/pkg --clobber
          gh release download "$M3_PREV_TAG" --repo "$M3_REPO" --pattern "$M3_PREV_ASSET" --dir /tmp/pkg --clobber
          unzip -q "/tmp/pkg/$OPS_PREV_ASSET" -d /tmp/pkg/ops
          unzip -q "/tmp/pkg/$M3_PREV_ASSET" -d /tmp/pkg/m3
          cp ops/vf-ops.php /tmp/pkg/ops/vf-ops/vf-ops.php
          cp ops/includes/s01/tool-workbench.php /tmp/pkg/ops/vf-ops/includes/s01/tool-workbench.php
          cp ops/assets/css/current/admin-s01-tools-r16.css /tmp/pkg/ops/vf-ops/assets/css/current/admin-s01-tools-r16.css
          cp m3/src/vf-tool-m3u8.php /tmp/pkg/m3/vf-tool-m3u8/vf-tool-m3u8.php
          cp m3/src/admin/Controller/class-v6-provider-operations-controller.php /tmp/pkg/m3/vf-tool-m3u8/admin/Controller/class-v6-provider-operations-controller.php
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          def pack(root,out):
              root=Path(root); files={}
              for p in root.rglob('*'):
                  if p.is_file() and not p.is_symlink():
                      rel=p.relative_to(root).as_posix()
                      files[rel]=p.read_bytes()
              files=dict(sorted(files.items()))
              with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for rel,data in files.items():
                      info=zipfile.ZipInfo(rel,(2026,10,4,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=0o100644<<16;z.writestr(info,data)
              h=hashlib.sha256()
              for rel,data in files.items():
                  rel2=rel.split('/',1)[1] if '/' in rel else rel
                  h.update(rel2.encode());h.update(b'\0');h.update(hashlib.sha256(data).hexdigest().encode());h.update(b'\n')
              p=Path(out)
              return {'files':len(files),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'runtime_fingerprint':h.hexdigest()}
          result={
            'ops':pack('/tmp/pkg/ops','/tmp/vf-tools-ops_V1.21.1026.zip'),
            'm3u8':pack('/tmp/pkg/m3','/tmp/vf-tools-m3u8_V1.25.58.zip'),
          }
          Path('evidence/packages.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
          unzip -tq /tmp/vf-tools-ops_V1.21.1026.zip >/dev/null
          unzip -tq /tmp/vf-tools-m3u8_V1.25.58.zip >/dev/null
          test "$(jq -r '.ops.files' evidence/packages.json)" = "986"
          test "$(jq -r '.m3u8.files' evidence/packages.json)" = "567"
          echo PACKAGES=PASS

      - name: Final evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -n             --arg ops_sha "$OPS_SHA" --arg ops_ver "$OPS_VERSION"             --arg m3_sha "$M3_SHA" --arg m3_ver "$M3_VERSION"             --argjson ops_browser "$(cat evidence/ops-browser.json)"             --argjson m3_browser "$(cat evidence/m3-browser.json)"             --argjson packages "$(cat evidence/packages.json)" '{
              status:"PASS",
              ops:{sha:$ops_sha,version:$ops_ver,browser:$ops_browser,package:$packages.ops},
              m3u8:{sha:$m3_sha,version:$m3_ver,browser:$m3_browser,package:$packages.m3u8},
              functional_truth:"PASS",
              shell_header_menu:"FROZEN",
              owner_product_pass:false,
              formal_release:"NOT_EXECUTED",
              production:"NOT_EXECUTED"
            }' | tee evidence/FINAL_EVIDENCE.json
          echo S01_FUNCTIONAL_REVERIFY_MACHINE_PASS

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-functional-reverify-ops1026-m3u812558
          path: evidence/
          retention-days: 30
