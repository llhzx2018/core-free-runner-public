name: P07 PR313 original 18-site exact-source sidecars and reversible roots
on:
  push:
    branches:
      - task/p07-pr313-sidecar-proof-20261111
permissions:
  contents: read
concurrency:
  group: p07-pr313-sidecar-proof-20261111
  cancel-in-progress: false
jobs:
  exact-source-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact private P07 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 30157052855080997ee02130254ea33a44c5d9ef
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Verify exact source identity and targeted file recovery unit tests
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = '30157052855080997ee02130254ea33a44c5d9ef'
          test "$(cat product/BUILD_ID)" = '0.1.0-release143'
          rsync --version >/dev/null
          (cd product && PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest -q \
            tests.test_p07_original_18_final_window \
            tests.test_p07_original_18_frozen_shadow_stage \
            tests.test_p07_original_18_file_warm_stage \
            tests.test_p07_original_18_site_root_deploy \
            tests.test_p07_original_18_sidecars)
          echo P07_PR313_SIDECAR_ROOT_REGRESSION_PASS=YES
          echo P07_PR313_ORIGINAL_VPS_MIGRATION_EXECUTED=NO
      - name: Destroy temporary private checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- product
          echo P07_PR313_PRIVATE_SOURCE_PERSISTED=NO
          echo P07_PR313_PRODUCTION_WRITES=NONE
