name: P07 PR313 original 18-site exact-source sidecars and reversible roots
on:
  push:
    branches:
      - task/p07-pr313-sidecar-proof-20261111
  pull_request:
    branches:
      - main
    types: [opened, synchronize]
permissions:
  contents: read
concurrency:
  group: p07-pr313-sidecar-proof-20261111
  cancel-in-progress: false
jobs:
  exact-source-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact private P07 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 845c9e6daa4edf06e5a020aa9b7dc991c5c58b67
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Checkout immutable public P07 distribution baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: main
          persist-credentials: false
          fetch-depth: 1
          path: public
      - name: Verify exact source identity and targeted file recovery unit tests
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = '845c9e6daa4edf06e5a020aa9b7dc991c5c58b67'
          test "$(cat product/BUILD_ID)" = '0.1.0-release143'
          rsync --version >/dev/null
          python3 -B - <<'PY'
          import ast
          from pathlib import Path
          root=Path("product")
          for name in ("lib/server_migration.py",
                       "tests/test_p07_original_18_source_freeze.py",
                       "tests/test_p07_original_18_source_cron_fence.py",
                       "tests/test_p07_original_18_mysql_writer_fence.py",
                       "lib/migration_original_18_sidecars.py",
                       "tests/test_p07_original_18_late_source_stability.py",
                       "tests/test_p07_original_18_late_mysql_source.py",
                       "lib/migration_original_18_mysql_cohort_pull.py",
                       "lib/migration_original_18_sidecar_deploy.py",
                       "lib/migration_original_18_local_acceptance.py",
                       "lib/migration_original_18_data_switch.py",
                       "lib/migration_original_18_pm2_isolated.py",
                       "lib/migration_original_18_pm2_runtime.py",
                       "tests/p07_pm2_native_user_smoke.py",
                       "tests/test_p07_original_18_native_mysql84_to_mariadb118.py",
                       "lib/migration_original_18_frozen_pipeline.py",
                       "lib/migration_original_18_owner_window.py",
                       "lib/migration_original_18_cutover_handoff.py",
                       "tests/test_p07_original_18_cutover_handoff.py",
                       "lib/migration_original_18_protected_preparation.py",
                       "lib/migration_original_18_runtime_activation.py",
                       "lib/migration_original_18_file_warm_stage.py",
                       "lib/migration_original_18_final_window.py",
                       "lib/migration_original_18_frozen_shadow_stage.py",
                       "lib/server_migration_pull.py",
                       "scripts/p07_candidate_bundle.py"):
              ast.parse((root/name).read_text(encoding="utf-8"), filename=name)
          print("P07_EXACT_SOURCE_SYNTAX_PASS=YES")
          PY
          bash -n product/bin/vfops-migrate-ui
          echo P07_PR313_ORIGINAL_UI_SYNTAX_PASS=YES
          (cd product && PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest -q \
            tests.test_p07_original_18_owner_window \
            tests.test_p07_original_18_final_window \
            tests.test_p07_original_18_frozen_pipeline \
            tests.test_p07_original_18_cutover_handoff \
            tests.test_p07_original_18_runtime_activation \
            tests.test_p07_original_18_pm2_runtime \
            tests.test_p07_original_18_data_switch)
          echo P07_PR313_ARMED_PRE_FREEZE_RECOVERY_REGRESSION_PASS=YES
          for command in original-18-prepare-owner-dns original-18-verify-owner-dns original-18-reconcile-post-dns; do
            set +e
            rejected="$(cd product && PYTHONDONTWRITEBYTECODE=1 python3 -B lib/server_migration_pull.py "$command" \
              --migration-id pull-20261109T082020Z-7cca03ae --confirm INVALID 2>&1)"
            reject_code=$?
            set -e
            test "$reject_code" -eq 13
            if [[ "$command" == original-18-reconcile-post-dns ]]; then
              printf '%s' "$rejected" | grep -q 'RECONCILE_OWNER_CONFIRMATION_REQUIRED'
            else
              printf '%s' "$rejected" | grep -q 'EXPLICIT_OWNER_CONFIRMATION'
            fi
          done
          echo P07_PR313_HANDOFF_CLI_INCORRECT_CONFIRMATION_REJECTED=YES
          echo P07_PR313_OLD_CP2_PRODUCTION_TOUCH=NO
      - name: Offline assemble original18 install candidate (no publication or artifact)
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          build_tmp="$(mktemp -d)"
          trap 'rm -rf -- "$build_tmp"' EXIT
          python3 -B product/scripts/p07_candidate_bundle.py \
            --product-root product --public-root public \
            --output "$build_tmp" \
            --product-sha '845c9e6daa4edf06e5a020aa9b7dc991c5c58b67' \
            --build 0.1.0-release143 --care 0.1.0-rc83
          test -s "$build_tmp/candidate_attestation.json"
          test -s "$build_tmp/dist/p07/0.1.0/overlay/RUNTIME.gitblob"
          test -s "$build_tmp/installers/p07-toolbox.sh"
          test -s "$build_tmp/installers/p07-final.sh"
          test -s "$build_tmp/installers/p07-system-care.sh"
          grep -q 'lib/migration_original_18_owner_window.py' "$build_tmp/dist/p07/0.1.0/overlay/RUNTIME.gitblob"
          grep -q 'lib/migration_original_18_cutover_handoff.py' "$build_tmp/dist/p07/0.1.0/overlay/RUNTIME.gitblob"
          grep -q 'tests/test_p07_original_18_cutover_handoff.py' "$build_tmp/dist/p07/0.1.0/overlay/MANIFEST.gitblob"
          grep -q 'tests/test_p07_original_18_late_mysql_source.py' "$build_tmp/dist/p07/0.1.0/overlay/MANIFEST.gitblob"
          grep -q 'tests/test_p07_original_18_mysql_writer_fence.py' "$build_tmp/dist/p07/0.1.0/overlay/MANIFEST.gitblob"
          echo P07_PR313_OFFLINE_CANDIDATE_COMPOSE_PASS=YES
          echo P07_PR313_RELEASE_PUBLISHED=NO
      - name: Destroy temporary private checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- product public
          echo P07_PR313_PRIVATE_SOURCE_PERSISTED=NO
          echo P07_PR313_PRODUCTION_WRITES=NONE
