name: P07 PR313 original 18-site exact-source sidecars and reversible roots
on:
  push:
    branches:
      - task/p07-pr313-sidecar-proof-20261111
  pull_request:
    branches:
      - main
    types: [opened, synchronize]
permissions:
  contents: read
concurrency:
  group: p07-pr313-sidecar-proof-20261111
  cancel-in-progress: false
jobs:
  exact-source-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact private P07 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 21d54f02299ff69a084f39b70c8c092ecc8c73a0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Verify exact source identity and targeted file recovery unit tests
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = '21d54f02299ff69a084f39b70c8c092ecc8c73a0'
          test "$(cat product/BUILD_ID)" = '0.1.0-release143'
          rsync --version >/dev/null
          python3 -B - <<'PY'
          import ast
          from pathlib import Path
          root=Path("product")
          for name in ("lib/server_migration.py",
                       "tests/test_p07_original_18_source_freeze.py",
                       "tests/test_p07_original_18_source_cron_fence.py",
                       "tests/test_p07_original_18_mysql_writer_fence.py",
                       "lib/migration_original_18_sidecars.py",
                       "tests/test_p07_original_18_late_source_stability.py",
                       "tests/test_p07_original_18_late_mysql_source.py",
                       "lib/migration_original_18_mysql_cohort_pull.py",
                       "lib/migration_original_18_sidecar_deploy.py",
                       "lib/migration_original_18_local_acceptance.py",
                       "lib/migration_original_18_data_switch.py",
                       "lib/migration_original_18_pm2_isolated.py",
                       "lib/migration_original_18_pm2_runtime.py",
                       "tests/p07_pm2_native_user_smoke.py",
                       "tests/test_p07_original_18_native_mysql84_to_mariadb118.py",
                       "lib/migration_original_18_frozen_pipeline.py",
                       "lib/migration_original_18_owner_window.py",
                       "lib/migration_original_18_protected_preparation.py",
                       "lib/migration_original_18_runtime_activation.py",
                       "lib/migration_original_18_file_warm_stage.py",
                       "lib/migration_original_18_final_window.py",
                       "lib/migration_original_18_frozen_shadow_stage.py",
                       "lib/server_migration_pull.py",
                       "scripts/p07_candidate_bundle.py"):
              ast.parse((root/name).read_text(encoding="utf-8"), filename=name)
          print("P07_EXACT_SOURCE_SYNTAX_PASS=YES")
          PY
          bash -n product/bin/vfops-migrate-ui
          echo P07_PR313_ORIGINAL_UI_SYNTAX_PASS=YES
          (cd product && PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest -q \
            tests.test_p07_original_18_final_window \
            tests.test_p07_original_18_source_cron_fence \
            tests.test_p07_original_18_source_freeze \
            tests.test_p07_original_18_mysql_writer_fence \
            tests.test_p07_source_pause \
            tests.test_p07_original_18_mysql_cohort \
            tests.test_p07_original_18_mysql_cohort_pull \
            tests.test_p07_original_18_late_mysql_source \
            tests.test_p07_original_18_frozen_shadow_stage \
            tests.test_p07_original_18_file_warm_stage \
            tests.test_p07_original_18_site_root_deploy \
            tests.test_p07_original_18_sidecars \
            tests.test_p07_original_18_late_source_stability \
            tests.test_p07_original_18_sidecar_deploy \
            tests.test_p07_original_18_local_acceptance \
            tests.test_p07_original_18_data_switch \
            tests.test_p07_original_18_pm2_isolated \
            tests.test_p07_original_18_pm2_runtime \
            tests.test_p07_original_18_frozen_pipeline \
            tests.test_p07_original_18_owner_window \
            tests.test_p07_original_18_protected_preparation \
            tests.test_p07_original_18_runtime_activation)
          echo P07_PR313_SIDECAR_ROOT_REGRESSION_PASS=YES
          # Real disposable MariaDB 11.8 engine, no network/ports; the
          # source is synthetic and this is NOT dual-server migration proof.
          docker info >/dev/null
          (cd product && PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest -q \
            tests.test_migration_final_db_real_engine)
          echo P07_PR313_MARIADB_11_8_SYNTHETIC_SHADOW_PASS=YES
          # Two real isolated database engines: native mysqldump from 8.4
          # into a NEW MariaDB 11.8 shadow with the P07 source verifier,
          # app-config switch and rollback. Synthetic only; no real VPS.
          (cd product && PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest -q \
            tests.test_p07_original_18_native_mysql84_to_mariadb118)
          echo P07_PR313_MYSQL84_MARIADB118_REAL_CROSS_ENGINE_PASS=YES
          # Native PM2/Node lifecycle. Only disposable runner UID, site
          # and process; never a VPS, CloudPanel, production asset or DNS.
          node --version >/dev/null
          npm --version >/dev/null
          pm2_test_prefix="$(mktemp -d /tmp/p07-native-pm2.XXXXXXXX)"
          chmod 0755 "$pm2_test_prefix"
          trap 'rm -rf -- "$pm2_test_prefix"' EXIT
          npm install --ignore-scripts --no-audit --no-fund --prefix "$pm2_test_prefix" pm2@6 >/dev/null
          test -f "$pm2_test_prefix/node_modules/pm2/bin/pm2"
          sudo -n env PYTHONDONTWRITEBYTECODE=1 \
            P07_DISPOSABLE_PM2_BINARY="$pm2_test_prefix/node_modules/pm2/bin/pm2" \
            python3 -B product/tests/p07_pm2_native_user_smoke.py
          echo P07_PR313_NATIVE_PM2_USER_ISOLATED_RUNNER_PASS=YES
          echo P07_PR313_ORIGINAL_VPS_MIGRATION_EXECUTED=NO
      - name: Destroy temporary private checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- product
          echo P07_PR313_PRIVATE_SOURCE_PERSISTED=NO
          echo P07_PR313_PRODUCTION_WRITES=NONE
