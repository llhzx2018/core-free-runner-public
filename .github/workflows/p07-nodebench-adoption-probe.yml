name: P07 NodeBench Adoption Probe

on:
  workflow_dispatch:
  push:
    branches:
      - feature/p07-nodebench-adoption-rc5
    paths:
      - .github/workflows/p07-nodebench-adoption-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Backtrace v1.0.8 exact probe
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64)
              asset='backtrace-linux-amd64.tar.gz'
              sha='a725975ca8810fe7983fd5c23e965d20ad976b36d9e079069bcbbcce1abafd38'
              ;;
            aarch64|arm64)
              asset='backtrace-linux-arm64.tar.gz'
              sha='badc08fca7db84ce701a534d0bd11f6985231d24831ac37f7af945512067ce63'
              ;;
            *) echo 'unsupported arch'; exit 0 ;;
          esac
          url="https://github.com/zhanghanyun/backtrace/releases/download/v1.0.8/${asset}"
          curl -fL --retry 3 --connect-timeout 10 "$url" -o backtrace.tgz
          echo "${sha}  backtrace.tgz" | sha256sum -c -
          mkdir bt && tar -xzf backtrace.tgz -C bt
          chmod +x bt/backtrace
          set +e
          NO_COLOR=1 timeout 150s sudo bt/backtrace | tee backtrace.txt
          rc=${PIPESTATUS[0]}
          set -e
          [[ $rc -eq 0 ]]
          grep -Eq '北京电信|上海电信|广州电信|成都电信' backtrace.txt
          grep -Eq '北京联通|上海联通|广州联通|成都联通' backtrace.txt
          grep -Eq '北京移动|上海移动|广州移动|成都移动' backtrace.txt
          if grep -q 'socket: protocol not supported' backtrace.txt; then
            echo 'Backtrace raw-socket path is unavailable in this runner.' >&2
            exit 2
          fi
          grep -Eq '电信163|电信CN2|联通4837|联通9929|移动CMI|移动CMIN2' backtrace.txt

      - name: YABS-style fio mixed random I/O probe
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fio
          mkdir -p fio-out
          for bs in 4k 64k 512k 1m; do
            fio --name="p07-${bs}" \
              --filename="$RUNNER_TEMP/p07-fio.bin" \
              --size=512M \
              --rw=randrw \
              --rwmixread=50 \
              --bs="$bs" \
              --ioengine=libaio \
              --direct=1 \
              --iodepth=32 \
              --numjobs=1 \
              --time_based=1 \
              --runtime=5 \
              --group_reporting=1 \
              --output-format=json \
              --output="fio-out/${bs}.json"
            python3 - "fio-out/${bs}.json" "$bs" <<'PY'
          import json,sys
          p,bs=sys.argv[1:]
          j=json.load(open(p))['jobs'][0]
          r,w=j['read'],j['write']
          print(f"{bs}: read={r['bw_bytes']*8/1e6:.2f} Mbit/s iops={r['iops']:.1f} | write={w['bw_bytes']*8/1e6:.2f} Mbit/s iops={w['iops']:.1f}")
          PY
          done
          rm -f "$RUNNER_TEMP/p07-fio.bin"

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p07-nodebench-adoption-probe
          path: |
            backtrace.txt
            fio-out/*.json
