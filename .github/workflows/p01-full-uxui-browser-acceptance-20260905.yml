name: P01 Full UXUI Browser Acceptance

on:
  push:
    branches: [main]
    paths: [.github/workflows/p01-full-uxui-browser-acceptance-20260905.yml]

permissions:
  contents: read

concurrency:
  group: p01-full-uxui-browser-acceptance-20260905
  cancel-in-progress: false

jobs:
  browser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_SHA: 4723025d7fa8a4ef14084d22e9222400ec1ed1cf
      APP_URL: http://127.0.0.1:8089
      TEST_PASSWORD: VF-Acceptance-2026!
      EVIDENCE_DIR: ${{ github.workspace }}/evidence/uxui
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 4723025d7fa8a4ef14084d22e9222400ec1ed1cf
          path: vf-start
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Exact source and frozen product regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.46.3'
          test "$(cat src/VERSION.txt)" = '2.46.3'
          grep -Fq "define('VF_VERSION', '2.46.3')" src/app/bootstrap.php
          grep -Fq '@import url("asset.php?file=visual-system-final.css");' src/assets/quick-open.css
          grep -Fq 'min-height:var(--vf-touch-target)!important' src/assets/visual-system-final.css
          php tests/unit/consolidated_product_acceptance_contract.php
          php tests/unit/uxui_round8_visual_system_contract.php 2>"$RUNNER_TEMP/r8.stderr"
          test ! -s "$RUNNER_TEMP/r8.stderr"
          for f in tests/unit/uxui_round1_home_root_contract.php tests/unit/uxui_round2_subject_identity_contract.php tests/unit/uxui_round3_course_identity_contract.php tests/unit/uxui_round4_tools_identity_contract.php tests/unit/uxui_round5_software_identity_contract.php tests/unit/uxui_round6_channels_watch_identity_contract.php tests/unit/uxui_round7_navigation_home_identity_contract.php; do php "$f"; done

      - name: Install Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP"
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Clean HTTP install
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR/empty" "$EVIDENCE_DIR/data"
          php -S 127.0.0.1:8089 -t "$GITHUB_WORKSPACE/vf-start/src" >"$RUNNER_TEMP/vf-start-server.log" 2>&1 &
          ready=0
          for i in $(seq 1 40); do if curl -fsS "$APP_URL/setup.php" >/dev/null; then ready=1; break; fi; sleep .5; done
          test "$ready" -eq 1
          COOKIE="$RUNNER_TEMP/setup.cookies"
          curl -fsS -c "$COOKIE" "$APP_URL/setup.php" >"$RUNNER_TEMP/setup.html"
          CSRF="$(python3 - <<'PY'
          import os,re
          s=open(os.environ['RUNNER_TEMP']+'/setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf" value="([^"]+)"',s)
          if not m: raise SystemExit('setup csrf missing')
          print(m.group(1))
          PY
          )"
          curl -fsS -b "$COOKIE" -c "$COOKIE" \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode 'site_title=VF Start Browser Acceptance' \
            --data-urlencode "admin_password=$TEST_PASSWORD" \
            --data-urlencode "admin_password_confirm=$TEST_PASSWORD" \
            "$APP_URL/setup.php" >"$RUNNER_TEMP/setup-post.html"
          grep -Fq 'VF Start 安装完成' "$RUNNER_TEMP/setup-post.html"
          curl -fsSI "$APP_URL/asset.php?file=visual-system-final.css" | grep -Eiq '^Content-Type: text/css'

      - name: Write browser harness
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >"$RUNNER_TEMP/p01-full-uxui.mjs" <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs'; import path from 'node:path';
          const base=process.env.APP_URL,state=process.env.ACCEPTANCE_STATE,out=path.join(process.env.EVIDENCE_DIR,state);
          fs.mkdirSync(out,{recursive:true});
          const routes=[['home','/'],['start','/start.php'],['channels','/channels.php'],['watch','/watch.php'],['topics','/topics.php'],['courses','/courses.php'],['projects','/projects.php'],['tools','/tools.php'],['software','/software.php']];
          const nav=['home.php','start.php','channels.php','watch.php','topics.php','courses.php','projects.php','tools.php','software.php'];
          const viewports=[['desktop',1440,1000],['tablet',900,1000],['mobile',390,844]];
          const expected={start:'Acceptance API Tool',channels:'Acceptance Channel',watch:'Acceptance Movie',topics:'Acceptance Topic',courses:'Acceptance Course',projects:'Acceptance Project',tools:'Acceptance API Tool',software:'Acceptance Desktop Editor'};
          const touch=['.vf-icon-button','.vf-theme-toggle','.vf-context-action','.vf-workspace-button','.vf-secondary-button','.vf-mobile-category-close','.vf-subject-pagination a','.vf-project-action-row>a','.vf-project-action-row>button','.vf-topic-open','.vf-course-open','.vf-course-state-action','.vf-watch-coverage-button','.vf-watch-enrich-button','.vf-subject-chips a','.vf-course-chips a'].join(',');
          const browser=await chromium.launch({headless:true}); const context=await browser.newContext({reducedMotion:'reduce'});
          const login=await context.newPage(); const loginErrors=[],css=[];
          login.on('pageerror',e=>loginErrors.push('pageerror:'+e.message)); login.on('console',m=>{if(m.type()==='error')loginErrors.push('console:'+m.text())});
          login.on('response',r=>{if(r.url().includes('file=visual-system-final.css'))css.push({status:r.status(),type:r.headers()['content-type']||''})});
          await login.goto(base+'/',{waitUntil:'domcontentloaded'}); if(await login.locator('body').getAttribute('data-vf-mode')!=='home')throw new Error('public root identity');
          await login.locator('[data-vf-auth-login]').first().click(); const dlg=login.locator('[data-vf-auth-dialog]'); await dlg.locator('input[name="password"]').fill(process.env.TEST_PASSWORD);
          const n=login.waitForNavigation({waitUntil:'networkidle'}); await dlg.locator('[data-vf-auth-submit]').click(); await n; await login.locator('body.vf-functional-workspace').waitFor({state:'attached'});
          if(!css.some(x=>x.status===200&&x.type.toLowerCase().startsWith('text/css')))throw new Error('shared visual CSS runtime missing'); if(loginErrors.length)throw new Error(loginErrors.join(' | ')); await login.close();
          const report=[];
          for(const [vp,w,h] of viewports)for(const [mode,route] of routes){
            const p=await context.newPage(); await p.setViewportSize({width:w,height:h}); const errors=[];
            p.on('pageerror',e=>errors.push('pageerror:'+e.message)); p.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
            const r=await p.goto(base+route,{waitUntil:'domcontentloaded'}); if(!r||r.status()>=400)throw new Error(`${state}/${vp}/${mode}: HTTP`); await p.waitForTimeout(180);
            if(await p.locator('body').getAttribute('data-vf-mode')!==mode)throw new Error(`${state}/${vp}/${mode}: identity`); if(!(await p.title()).includes('VF Start'))throw new Error(`${state}/${vp}/${mode}: title`);
            const hrefs=await p.locator('a[href]').evaluateAll(ns=>ns.map(x=>{try{return new URL(x.href).pathname.split('/').filter(Boolean).pop()||''}catch{return ''}})); for(const f of nav)if(!hrefs.includes(f))throw new Error(`${state}/${vp}/${mode}: nav ${f}`);
            const ov=await p.evaluate(()=>({scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth,body:document.body.scrollWidth})); if(ov.scroll>ov.client+2||ov.body>ov.client+2)throw new Error(`${state}/${vp}/${mode}: overflow ${JSON.stringify(ov)}`);
            let focus=false; for(let i=0;i<6;i++){await p.keyboard.press('Tab'); const f=await p.evaluate(()=>{const e=document.activeElement;if(!e||e===document.body)return null;const s=getComputedStyle(e);return {outline:s.outlineStyle,shadow:s.boxShadow}}); if(f){focus=true;if(f.outline==='none'&&(!f.shadow||f.shadow==='none'))throw new Error(`${state}/${vp}/${mode}: focus invisible`);break}} if(!focus)throw new Error(`${state}/${vp}/${mode}: focus unreachable`);
            if(vp==='mobile'){const items=await p.locator(touch).evaluateAll(ns=>ns.filter(x=>{const s=getComputedStyle(x),r=x.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0}).map(x=>({tag:x.tagName,cls:typeof x.className==='string'?x.className:'',h:x.getBoundingClientRect().height}))); for(const x of items)if(x.h<39.5)throw new Error(`${state}/${vp}/${mode}: touch ${JSON.stringify(x)}`)}
            if(state==='data'&&expected[mode]&&!(await p.locator('body').innerText()).includes(expected[mode]))throw new Error(`${state}/${vp}/${mode}: representative data`); if(errors.length)throw new Error(`${state}/${vp}/${mode}: ${errors.join(' | ')}`);
            const shot=`${vp}-${mode}.png`; await p.screenshot({path:path.join(out,shot),fullPage:true}); report.push({state,vp,mode,status:r.status(),overflow:ov,shot}); await p.close();
          }
          fs.writeFileSync(path.join(out,'report.json'),JSON.stringify(report,null,2)); await context.close(); await browser.close(); console.log(`P01_UXUI_BROWSER_${state.toUpperCase()}=PASS`);
          JS

      - name: Empty state 9 pages x 3 viewports
        env: { ACCEPTANCE_STATE: empty }
        shell: bash
        run: cd "$RUNNER_TEMP" && node p01-full-uxui.mjs

      - name: Seed canonical representative data
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >"$RUNNER_TEMP/p01-seed.php" <<'PHP'
          <?php
          declare(strict_types=1);
          require getenv('GITHUB_WORKSPACE').'/vf-start/src/app/FunctionalWorkspaceCore.php';
          $db=vf_db();$repo=new VfRepository($db);$surface=new VfSurfaceRepository($db);
          $cat=$repo->createCategory(['name'=>'验收导航','description'=>'browser acceptance fixture','is_private'=>0,'sort_order'=>100]);
          $start=function(array $d)use($repo,$surface,$cat):int{$d['surface']='start';$d['category_id']=$cat;$r=$repo->saveLink(null,$d,'manual');$id=(int)$r['id'];$surface->upsertProfile($id,['surface'=>'start']);return $id;};
          $domain=function(string $s,array $d,array $p=[])use($repo,$surface):int{$d['surface']=$s;$r=$repo->saveLink(null,$d,'manual');$id=(int)$r['id'];$surface->upsertProfile($id,array_merge(['surface'=>$s],$p));return $id;};
          $start(['title'=>'Acceptance API Tool','url'=>'https://example.com/api-tool','description'=>'开发工具 API 调试与建站','tags'=>['场景:做网站','开发工具','API','建站'],'is_private'=>0]);
          $start(['title'=>'Acceptance Desktop Editor','url'=>'https://example.com/desktop-editor','description'=>'桌面代码编辑器客户端','tags'=>['软件:开发 / 编程','软件','代码编辑器','客户端'],'is_private'=>0]);
          $repo->saveLink(null,['surface'=>'start','category_id'=>$cat,'title'=>'Acceptance Pending','url'=>'https://example.com/pending','description'=>'待整理验收项','is_private'=>1,'is_pending'=>1],'manual');
          $domain('channels',['title'=>'Acceptance Channel','url'=>'https://www.youtube.com/@acceptance-demo','description'=>'频道验收','tags'=>['YouTube'],'is_private'=>0],['resource_kind'=>'youtube','background_friendly'=>1]);
          $domain('watch',['title'=>'Acceptance Movie','url'=>'https://example.com/movie','description'=>'影视验收','tags'=>['电影'],'is_private'=>0],['resource_kind'=>'movie','media_year'=>2026,'media_status'=>'want']);
          $domain('topics',['title'=>'Acceptance Topic','url'=>'https://example.com/topic','description'=>'专题验收','tags'=>['指南'],'is_private'=>0],['resource_kind'=>'guide','source_kind'=>'remote_url']);
          $domain('books',['title'=>'Acceptance Course','url'=>'https://example.com/course','description'=>'课程验收','tags'=>['课程'],'is_private'=>0],['resource_kind'=>'course']);
          $domain('projects',['title'=>'Acceptance Project','url'=>'https://example.com/project','description'=>'项目验收','tags'=>['项目'],'is_private'=>1],['resource_kind'=>'project','project_code'=>'P99','project_status'=>'active','project_sort_order'=>10]);
          $counts=VfWorkspaceViewCatalog::counts($surface->allAssets(true));foreach(['start','channels','watch','topics','courses','projects','tools','software'] as $k)if((int)($counts[$k]??0)<1)throw new RuntimeException('missing fixture '.$k);
          if(strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn())!=='ok')throw new RuntimeException('SQLite integrity failed');echo "P01_CANONICAL_FIXTURE=PASS\n";
          PHP
          php "$RUNNER_TEMP/p01-seed.php"

      - name: Populated state 9 pages x 3 viewports
        env: { ACCEPTANCE_STATE: data }
        shell: bash
        run: cd "$RUNNER_TEMP" && node p01-full-uxui.mjs

      - name: Final acceptance receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(find "$EVIDENCE_DIR/empty" -name '*.png' | wc -l)" -eq 27
          test "$(find "$EVIDENCE_DIR/data" -name '*.png' | wc -l)" -eq 27
          cat >"$EVIDENCE_DIR/P01_FULL_UXUI_ACCEPTANCE.txt" <<EOF
          P01_FULL_UXUI_ACCEPTANCE=PASS
          EXACT_MAIN_SHA=$EXPECTED_SHA
          VERSION=2.46.3
          SCHEMA=2026090401
          MIGRATION=NONE
          CLEAN_INSTALL=PASS
          LOGIN_DIALOG=PASS
          EMPTY_STATE_9_PAGES_X_3_VIEWPORTS=PASS
          POPULATED_STATE_9_PAGES_X_3_VIEWPORTS=PASS
          NINE_ENTRY_REACHABILITY=PASS
          HORIZONTAL_OVERFLOW=PASS
          KEYBOARD_FOCUS=PASS
          MOBILE_40PX_TARGETS=PASS
          CONSOLE_AND_PAGE_ERRORS=PASS
          SHARED_VISUAL_CSS_RUNTIME=PASS
          CANONICAL_DATA_LANE=VfRepository+VfSurfaceRepository
          RELEASE_MUTATION=NO
          PRODUCTION_MUTATION=NO
          EOF
          cat "$EVIDENCE_DIR/P01_FULL_UXUI_ACCEPTANCE.txt"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-full-uxui-browser-acceptance-${{ github.run_id }}
          path: |
            evidence/uxui
            ${{ runner.temp }}/vf-start-server.log
            ${{ runner.temp }}/setup-post.html
          if-no-files-found: warn
          retention-days: 14
