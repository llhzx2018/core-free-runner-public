name: P01 V2.24 UX Rebaseline Final Head Gate

on:
  push:
    branches:
      - task/p01-v222-multi-surface-gate-20260828
    paths:
      - '.github/workflows/p01-v224-ux-rebaseline-final-head-gate-20260828.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      FEATURE_BRANCH: feature/p01-ux-rebaseline-v224-20260828
      EXACT_SOURCE: c96178b1112dca20af0b15b557a54abcb4211bed
      BASE_MAIN: f00a7d5dfe61d429a845bb1931065653e7750337
      VERSION: 2.23.0
      SCHEMA: '2026082801'
      TARGET_RELEASE: 2.24.0
    steps:
      - name: Checkout final UX head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXACT_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p01
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - name: Exact identity and final scope
        env:
          READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE"
          test "$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "refs/heads/${FEATURE_BRANCH}" | awk '{print $1}')" = "$EXACT_SOURCE"
          test "$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" refs/heads/main | awk '{print $1}')" = "$BASE_MAIN"
          test "$(tr -d '\r\n' < VERSION)" = "$VERSION"
          mapfile -t files < <(git diff --name-only "$BASE_MAIN...$EXACT_SOURCE")
          printf '%s\n' "${files[@]}"
          for f in "${files[@]}"; do
            case "$f" in
              src/app/SurfaceShell.php|src/assets/surface-home.css|src/assets/surface-start.css|src/start.php|src/surface-manager.php|src/surface.php|src/surfaces.php) ;;
              *) echo "unexpected final UX scope file: $f" >&2; exit 1;;
            esac
          done
          test "${#files[@]}" -eq 7
          echo P01_V224_FINAL_IDENTITY_SCOPE=PASS
      - name: Syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          find p01/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find p01/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          echo P01_V224_FINAL_SYNTAX=PASS
      - name: Fresh runtime and seed
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v224-final /tmp/p01-v224-final*.cookies
          cp -a p01/src /tmp/p01-v224-final
          cd /tmp/p01-v224-final
          php -S 127.0.0.1:18235 -t . >/tmp/p01-v224-final-server.log 2>&1 & echo $! >/tmp/p01-v224-final.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18235/setup.php -o /tmp/p01-v224-final-setup.html && break; sleep 1; done
          curl -fsS -c /tmp/p01-v224-final.cookies -b /tmp/p01-v224-final.cookies http://127.0.0.1:18235/setup.php -o /tmp/p01-v224-final-setup.html
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v224-final-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-v224-final.cookies -b /tmp/p01-v224-final.cookies -X POST http://127.0.0.1:18235/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF Start V224 Final UX' --data-urlencode 'admin_password=P01V224!FinalUX' --data-urlencode 'admin_password_confirm=P01V224!FinalUX' -o /tmp/p01-v224-final-setup-post.html
          php cli/verify.php | grep -Fx 'VERIFY_PASS=YES'
          php cli/surface-verify.php | tee /tmp/p01-v224-final-surface.txt
          grep -Fx 'MULTI_SURFACE_PASS=YES' /tmp/p01-v224-final-surface.txt
          grep -Fx "WORKING_SCHEMA=$SCHEMA" /tmp/p01-v224-final-surface.txt
          php cli/baseline-verify.php | tee /tmp/p01-v224-final-baseline.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-v224-final-baseline.txt
          grep -Fx 'DRIFT_COUNT=0' /tmp/p01-v224-final-baseline.txt
          grep -Fx 'UNKNOWN_COUNT=0' /tmp/p01-v224-final-baseline.txt
          cat >/tmp/p01-v224-final-seed.php <<'PHP'
          <?php
          require '/tmp/p01-v224-final/app/bootstrap.php';
          require_once '/tmp/p01-v224-final/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db()); $s=new VfSurfaceRepository(vf_db());
          $tools=$r->createCategory(['name'=>'工具','description'=>'','is_private'=>false]);
          $r->saveLink(null,['category_id'=>$tools,'title'=>'Cloudflare Dashboard','url'=>'https://dash.cloudflare.com/','description'=>'Cloudflare','is_private'=>false,'is_favorite'=>true],'manual');
          $r->saveLink(null,['category_id'=>$tools,'title'=>'GitHub','url'=>'https://github.com/','description'=>'Code','is_private'=>false],'manual');
          $tech=$r->createCategory(['name'=>'科技','description'=>'','is_private'=>false]);
          $ch=$r->saveLink(null,['category_id'=>$tech,'title'=>'硅谷101','url'=>'https://www.youtube.com/@TheValley101','description'=>'科技商业故事','is_private'=>false],'manual');
          $s->upsertProfile((int)$ch['id'],['surface'=>'channels','resource_kind'=>'youtube','background_friendly'=>true]);
          $movieCat=$r->createCategory(['name'=>'电影','description'=>'','is_private'=>false]);
          $mv=$r->saveLink(null,['category_id'=>$movieCat,'title'=>'测试电影','url'=>'https://example.com/movie','description'=>'测试电影','is_private'=>false],'manual');
          $s->upsertProfile((int)$mv['id'],['surface'=>'watch','resource_kind'=>'movie','media_year'=>'2024','media_status'=>'want']);
          $r->saveLink(null,['category_id'=>$tech,'title'=>'待整理 YouTube 创作者','url'=>'https://www.youtube.com/@PendingCreator','description'=>'等待归入 Channels','is_private'=>false],'manual');
          $r->saveLink(null,['category_id'=>$movieCat,'title'=>'待整理电影入口','url'=>'https://example.com/pending-film','description'=>'等待归入 Watch','is_private'=>false],'manual');
          echo "P01_V224_FINAL_SEED=PASS\n";
          PHP
          php /tmp/p01-v224-final-seed.php
          echo P01_V224_FINAL_FRESH=PASS
      - name: One-system UX contract
        shell: bash
        run: |
          set -Eeuo pipefail
          code=$(curl -sS -o /tmp/p01-v224-final-public.html -w '%{http_code}' http://127.0.0.1:18235/)
          test "$code" = 200
          ! grep -F 'PERSONAL INTERNET HOME' /tmp/p01-v224-final-public.html >/dev/null
          curl -fsS -c /tmp/p01-v224-final-admin.cookies -b /tmp/p01-v224-final-admin.cookies -H 'Content-Type: application/json' -X POST 'http://127.0.0.1:18235/api.php?action=login' --data '{"password":"P01V224!FinalUX"}' | jq -e '.ok==true' >/dev/null
          # Admin root -> unified Home.
          root_code=$(curl -sS -c /tmp/p01-v224-final-admin.cookies -b /tmp/p01-v224-final-admin.cookies -D /tmp/p01-v224-final-root.headers -o /tmp/p01-v224-final-root.html -w '%{http_code}' http://127.0.0.1:18235/)
          test "$root_code" = 302
          grep -iE '^location: *surfaces\.php' /tmp/p01-v224-final-root.headers >/dev/null
          curl -fsS -c /tmp/p01-v224-final-admin.cookies -b /tmp/p01-v224-final-admin.cookies http://127.0.0.1:18235/surfaces.php -o /tmp/p01-v224-final-home.html
          grep -F 'PERSONAL INTERNET HOME' /tmp/p01-v224-final-home.html >/dev/null
          grep -F '你的互联网，从这里继续。' /tmp/p01-v224-final-home.html >/dev/null
          grep -F '内容待整理' /tmp/p01-v224-final-home.html >/dev/null
          ! grep -F 'vf-dashboard-columns' /tmp/p01-v224-final-home.html >/dev/null
          # Cross-surface search stays in Home.
          curl -fsS -G -c /tmp/p01-v224-final-admin.cookies -b /tmp/p01-v224-final-admin.cookies --data-urlencode 'q=测试电影' http://127.0.0.1:18235/surfaces.php -o /tmp/p01-v224-final-search.html
          grep -F 'GLOBAL SEARCH' /tmp/p01-v224-final-search.html >/dev/null
          grep -F '测试电影' /tmp/p01-v224-final-search.html >/dev/null
          grep -F 'Watch' /tmp/p01-v224-final-search.html >/dev/null
          # Start now shares the same shell for admin.
          curl -fsS -c /tmp/p01-v224-final-admin.cookies -b /tmp/p01-v224-final-admin.cookies http://127.0.0.1:18235/start.php -o /tmp/p01-v224-final-start.html
          grep -F 'WEB START' /tmp/p01-v224-final-start.html >/dev/null
          grep -F 'vf-app-sidebar' /tmp/p01-v224-final-start.html >/dev/null
          grep -F 'Cloudflare Dashboard' /tmp/p01-v224-final-start.html >/dev/null
          grep -F 'surface-start.css' /tmp/p01-v224-final-start.html >/dev/null
          curl -fsS -c /tmp/p01-v224-final-admin.cookies -b /tmp/p01-v224-final-admin.cookies 'http://127.0.0.1:18235/start.php?view=favorite' -o /tmp/p01-v224-final-fav.html
          grep -F '我的收藏' /tmp/p01-v224-final-fav.html >/dev/null
          grep -F 'Cloudflare Dashboard' /tmp/p01-v224-final-fav.html >/dev/null
          curl -fsS -c /tmp/p01-v224-final-admin.cookies -b /tmp/p01-v224-final-admin.cookies 'http://127.0.0.1:18235/start.php?view=popular' -o /tmp/p01-v224-final-popular.html
          grep -F '常用网址' /tmp/p01-v224-final-popular.html >/dev/null
          # Classic remains an explicit compatibility view, not the primary Start UX.
          curl -fsS -c /tmp/p01-v224-final-admin.cookies -b /tmp/p01-v224-final-admin.cookies 'http://127.0.0.1:18235/start.php?classic=1' -o /tmp/p01-v224-final-classic.html
          ! grep -F 'WEB START' /tmp/p01-v224-final-classic.html >/dev/null
          grep -F 'id="app" class="app-shell"' /tmp/p01-v224-final-classic.html >/dev/null
          # Other Surfaces and organizer use exactly the same shell.
          curl -fsS -c /tmp/p01-v224-final-admin.cookies -b /tmp/p01-v224-final-admin.cookies http://127.0.0.1:18235/channels.php -o /tmp/p01-v224-final-channels.html
          grep -F 'CONTENT MEMORY' /tmp/p01-v224-final-channels.html >/dev/null
          grep -F 'vf-app-sidebar' /tmp/p01-v224-final-channels.html >/dev/null
          curl -fsS -c /tmp/p01-v224-final-admin.cookies -b /tmp/p01-v224-final-admin.cookies http://127.0.0.1:18235/watch.php -o /tmp/p01-v224-final-watch.html
          grep -F 'PERSONAL WATCHLIST' /tmp/p01-v224-final-watch.html >/dev/null
          grep -F 'vf-app-sidebar' /tmp/p01-v224-final-watch.html >/dev/null
          curl -fsS -c /tmp/p01-v224-final-admin.cookies -b /tmp/p01-v224-final-admin.cookies http://127.0.0.1:18235/surface-manager.php -o /tmp/p01-v224-final-manager.html
          grep -F 'RESOURCE INBOX' /tmp/p01-v224-final-manager.html >/dev/null
          grep -F '待整理 YouTube 创作者' /tmp/p01-v224-final-manager.html >/dev/null
          grep -F '待整理电影入口' /tmp/p01-v224-final-manager.html >/dev/null
          echo P01_V224_ONE_SYSTEM_UX=PASS
      - name: Final regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/p01-v224-final
          php cli/surface-verify.php | grep -Fx 'MULTI_SURFACE_PASS=YES'
          php cli/baseline-verify.php | tee /tmp/p01-v224-final-reg.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-v224-final-reg.txt
          grep -Fx 'DRIFT_COUNT=0' /tmp/p01-v224-final-reg.txt
          grep -Fx 'UNKNOWN_COUNT=0' /tmp/p01-v224-final-reg.txt
          test "$(php -r "require 'app/bootstrap.php'; echo strtolower((string)vf_db()->query('PRAGMA integrity_check')->fetchColumn());")" = ok
          test "$(php -r "require 'app/bootstrap.php'; echo count(vf_db()->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC));")" = 0
          kill "$(cat /tmp/p01-v224-final.pid)" 2>/dev/null || true
          echo P01_V224_FINAL_REGRESSION=PASS
      - name: Verdict
        shell: bash
        run: |
          echo P01_V224_FINAL_HEAD="$EXACT_SOURCE"
          echo P01_V224_FINAL_MACHINE=PASS
          echo TARGET_RELEASE="$TARGET_RELEASE"
          echo SCHEMA="$SCHEMA"
          echo PRODUCTION=NO
