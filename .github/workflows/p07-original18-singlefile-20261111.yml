name: P07 original18 offline Owner Trial exact source gate
on:
  push:
    branches:
      - task/p07-original18-singlefile-synthetic-20261111
permissions:
  contents: read
concurrency:
  group: p07-original18-singlefile-synthetic-20261111
  cancel-in-progress: false
jobs:
  exact-source-wrapper:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_SHA: 35cf44c5566595afa8ded8467072738c10cdffed
      PUBLIC_SHA: e5f0bf042110284d21c8461393cbb3b5b0ed02cc
    steps:
      - name: Transient checkout exact private P07 product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 35cf44c5566595afa8ded8467072738c10cdffed
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Exact source synthetic tests for onefile wrapper and denial cases
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(cat product/BUILD_ID)" = "0.1.0-release143"
          (cd product && python3 -B -m unittest -v tests.test_p07_original_18_cutover_handoff tests.test_p07_original_18_local_acceptance tests.test_p07_owner_trial_singlefile)
          echo P07_ORIGINAL18_OWNER_TRIAL_NONFORMAL_SLOT_GUARD=PASS
      - name: Checkout already published immutable public installer baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: e5f0bf042110284d21c8461393cbb3b5b0ed02cc
          persist-credentials: false
          fetch-depth: 1
          path: public-base
      - name: Build real exact-source candidate in private transient workspace and inspect self-extracting script
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C public-base rev-parse HEAD)" = "$PUBLIC_SHA"
          work="$RUNNER_TEMP/p07-original18-onefile"
          mkdir -p "$work/out" "$work/unpack"
          python3 -B product/scripts/p07-owner-prebuilt143-package.py \
            --product-root "$PWD/product" \
            --public-root "$PWD/public-base" \
            --product-sha "$PRODUCT_SHA" \
            --output-dir "$work/out" > "$work/package.log"
          grep -Fxq P07_OWNER_PACKAGE_CREATED=YES "$work/package.log"
          (cd "$work/out" && sha256sum -c p07-release143-rc143-owner-test.tar.gz.sha256)
          tar -xzf "$work/out/p07-release143-rc143-owner-test.tar.gz" -C "$work/unpack"
          python3 -B product/scripts/p07_owner_trial_singlefile.py \
            --candidate-dir "$work/unpack/candidate" \
            --product-sha "$PRODUCT_SHA" \
            --output "$work/p07-original18-trial.sh" > "$work/onefile.log"
          bash -n "$work/p07-original18-trial.sh"
          bash "$work/p07-original18-trial.sh" --inspect > "$work/inspect.log"
          grep -Fxq P07_TRIAL_PACKAGE_INTEGRITY=PASS "$work/inspect.log"
          grep -Fxq P07_TRIAL_VPS_WRITES=NONE "$work/inspect.log"
          echo P07_ORIGINAL18_REAL_CANDIDATE_OFFLINE_INSPECT=PASS
          # Real single-file installer execution is confined to the
          # disposable runner's temporary directory. No CloudPanel/VPS is
          # present and no Production files or credentials are touched.
          mkdir -p "$work/sandbox-bin"
          P07_ALLOW_NONROOT=1 P07_OWNER_TRIAL_TEST=1 \
            P07_INSTALL_DIR="$work/sandbox-installed" \
            P07_PREVIOUS_DIR="$work/sandbox-previous" \
            P07_BIN_LINK="$work/sandbox-bin/vfops" \
            bash "$work/p07-original18-trial.sh" --install > "$work/install.log"
          grep -Fxq P07_TRIAL_STATUS=OWNER_TRIAL_INSTALLED "$work/install.log"
          grep -Fxq P07_TRIAL_PRODUCTION_MIGRATION_EXECUTED=NO "$work/install.log"
          test "$(NO_COLOR=1 "$work/sandbox-bin/vfops" --build-id)" = "0.1.0-release143"
          test -f "$work/sandbox-installed/.runtime-manifest.gitblob"
          echo P07_ORIGINAL18_SINGLEFILE_SANDBOX_INSTALL_AND_BUILD_READBACK=PASS
          # Simulate a late installer failure AFTER directory swap.
          # A non-writable bin-link parent forces the existing installer
          # to restore its previous runtime. All paths are disposable.
          before_manifest_sha="$(sha256sum "$work/sandbox-installed/.runtime-manifest.gitblob" | cut -d' ' -f1)"
          mkdir -p "$work/no-write-link"
          chmod 0500 "$work/no-write-link"
          set +e
          P07_ALLOW_NONROOT=1 P07_OWNER_TRIAL_TEST=1 \
            P07_INSTALL_DIR="$work/sandbox-installed" \
            P07_PREVIOUS_DIR="$work/sandbox-previous" \
            P07_BIN_LINK="$work/no-write-link/blocked-vfops" \
            bash "$work/p07-original18-trial.sh" --install > "$work/blocked-install.log" 2>&1
          blocked_rc=$?
          set -e
          chmod 0700 "$work/no-write-link"
          test "$blocked_rc" -ne 0
          grep -Fq 'INSTALLER_FAILED_ROLLBACK_HANDLED_BY_P07' "$work/blocked-install.log"
          test -d "$work/sandbox-installed"
          test ! -e "$work/sandbox-previous"
          test "$(sha256sum "$work/sandbox-installed/.runtime-manifest.gitblob" | cut -d' ' -f1)" = "$before_manifest_sha"
          test "$(NO_COLOR=1 "$work/sandbox-bin/vfops" --build-id)" = "0.1.0-release143"
          echo P07_ORIGINAL18_SINGLEFILE_LATE_INSTALL_FAILURE_ROLLBACK=PASS
          echo P07_ORIGINAL18_FORMAL_RELEASE=NO
          echo P07_ORIGINAL18_PRODUCTION_MIGRATION=NOT_RUN
      - name: Deliver onefile to PRIVATE product trial branch only (not release)
        if: false # exact-source regression run; do not deliver an unqualified trial
        shell: bash
        env:
          P07_PRIVATE_WRITE: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          if [[ -z "${P07_PRIVATE_WRITE:-}" ]]; then
            echo "P07_PRIVATE_OWNER_TRIAL_DELIVERY=WRITE_CAPABILITY_UNAVAILABLE"
            exit 21
          fi
          python3 - <<'PY_PRIVATE_DELIVERY'
          import base64, hashlib, json, os, pathlib, urllib.error, urllib.request
          branch = "ownertrial/p07-rc143-d03f8451-20261111"
          product = "llhzx2018/vf-server-ops"
          expected = "35cf44c5566595afa8ded8467072738c10cdffed"
          content_path = "owner-trial/p07-original18-rc143-owner-trial.sh"
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "p07-original18-onefile" / "p07-original18-trial.sh"
          raw = path.read_bytes()
          digest = hashlib.sha256(raw).hexdigest()
          token = os.environ["P07_PRIVATE_WRITE"]
          common = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + token,
              "X-GitHub-Api-Version": "2022-11-28",
          }
          def request(url, data=None, method="GET"):
              headers = dict(common)
              if data is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(
                  url, data=(json.dumps(data).encode("utf-8") if data is not None else None),
                  headers=headers, method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=75) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  print("P07_PRIVATE_OWNER_TRIAL_GITHUB_API_STATUS=" + str(exc.code))
                  raise SystemExit(23)
          ref = request("https://api.github.com/repos/" + product + "/git/ref/heads/" + branch)
          if ref.get("object", {}).get("sha") != expected:
              raise SystemExit("P07_PRIVATE_OWNER_TRIAL_DESTINATION_NOT_SEALED")
          result = request(
              "https://api.github.com/repos/" + product + "/contents/" + content_path,
              {
                  "message": "build(p07): nonformal exact-source rc143 singlefile Owner Trial candidate",
                  "branch": branch,
                  "content": base64.b64encode(raw).decode("ascii"),
              },
              "PUT",
          )
          committed = result.get("content", {})
          if committed.get("size") != len(raw):
              raise SystemExit("P07_PRIVATE_OWNER_TRIAL_DELIVERED_CONTENT_SIZE_MISMATCH")
          print("P07_PRIVATE_OWNER_TRIAL_DELIVERED=YES")
          print("P07_PRIVATE_OWNER_TRIAL_FILE_SHA256=" + digest)
          print("P07_PRIVATE_OWNER_TRIAL_SOURCE_SHA=" + expected)
          print("P07_PRIVATE_OWNER_TRIAL_NONFORMAL_RELEASE=YES")
          print("P07_PRIVATE_OWNER_TRIAL_PUBLIC_ARTIFACT=NONE")
          PY_PRIVATE_DELIVERY
      - name: Erase transient private source and offline package
        if: always()
        shell: bash
        run: |
          rm -rf -- product public-base "$RUNNER_TEMP/p07-original18-onefile"
          echo P07_ORIGINAL18_PRIVATE_SOURCE_CLEANED=YES
