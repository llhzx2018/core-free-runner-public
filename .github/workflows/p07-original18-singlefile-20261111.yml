name: P07 original18 offline Owner Trial exact source gate
on:
  push:
    branches:
      - task/p07-original18-singlefile-synthetic-20261111
permissions:
  contents: read
concurrency:
  group: p07-original18-singlefile-synthetic-20261111
  cancel-in-progress: false
jobs:
  exact-source-wrapper:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_SHA: f2730e29db689b887fc63862efd6a1fd78b05a4b
      PUBLIC_SHA: e5f0bf042110284d21c8461393cbb3b5b0ed02cc
    steps:
      - name: Transient checkout exact private P07 product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: f2730e29db689b887fc63862efd6a1fd78b05a4b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Exact source synthetic tests for onefile wrapper and denial cases
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(cat product/BUILD_ID)" = "0.1.0-release143"
          (cd product && python3 -B -m unittest -v \
            tests.test_p07_original_18_local_acceptance \
            tests.test_p07_original_18_data_switch \
            tests.test_p07_original_18_frozen_pipeline \
            tests.test_p07_original_18_owner_window \
            tests.test_p07_original_18_runtime_activation)
          echo P07_ORIGINAL18_FULL_FROZEN_HOST_PM2_CHAIN_EXACT_SOURCE=PASS
      - name: Checkout already published immutable public installer baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: e5f0bf042110284d21c8461393cbb3b5b0ed02cc
          persist-credentials: false
          fetch-depth: 1
          path: public-base
      - name: Build real exact-source candidate in private transient workspace and inspect self-extracting script
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C public-base rev-parse HEAD)" = "$PUBLIC_SHA"
          work="$RUNNER_TEMP/p07-original18-onefile"
          mkdir -p "$work/out" "$work/unpack"
          python3 -B product/scripts/p07-owner-prebuilt143-package.py \
            --product-root "$PWD/product" \
            --public-root "$PWD/public-base" \
            --product-sha "$PRODUCT_SHA" \
            --output-dir "$work/out" > "$work/package.log"
          grep -Fxq P07_OWNER_PACKAGE_CREATED=YES "$work/package.log"
          (cd "$work/out" && sha256sum -c p07-release143-rc143-owner-test.tar.gz.sha256)
          tar -xzf "$work/out/p07-release143-rc143-owner-test.tar.gz" -C "$work/unpack"
          python3 -B product/scripts/p07_owner_trial_singlefile.py \
            --candidate-dir "$work/unpack/candidate" \
            --product-sha "$PRODUCT_SHA" \
            --output "$work/p07-original18-trial.sh" > "$work/onefile.log"
          bash -n "$work/p07-original18-trial.sh"
          bash "$work/p07-original18-trial.sh" --inspect > "$work/inspect.log"
          grep -Fxq P07_TRIAL_PACKAGE_INTEGRITY=PASS "$work/inspect.log"
          grep -Fxq P07_TRIAL_VPS_WRITES=NONE "$work/inspect.log"
          echo P07_ORIGINAL18_REAL_CANDIDATE_OFFLINE_INSPECT=PASS
          echo P07_ORIGINAL18_FORMAL_RELEASE=NO
          echo P07_ORIGINAL18_PRODUCTION_MIGRATION=NOT_RUN
      - name: Erase transient private source and offline package
        if: always()
        shell: bash
        run: |
          rm -rf -- product public-base "$RUNNER_TEMP/p07-original18-onefile"
          echo P07_ORIGINAL18_PRIVATE_SOURCE_CLEANED=YES
