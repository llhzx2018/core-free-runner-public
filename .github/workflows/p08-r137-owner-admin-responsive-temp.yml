name: P08 R137 exact final Owner app HTTPS 390 768 1440 (TEMP)
on:
  pull_request:
    paths: [.github/workflows/p08-r137-owner-admin-responsive-temp.yml]
permissions:
  contents: read
jobs:
  owner-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      P08_R137_ISOLATED: 'YES'
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_R105_DISPOSABLE: 'YES'
    steps:
      - name: Setup PHP8.4 SQLite and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip,sqlite3,pdo_sqlite,pdo_mysql,posix,mbstring,dom,curl
          coverage: none
          tools: composer:v2
      - name: Node22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Transient exact private P08 candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: f1d73d9b4fafd2c125a2060d11abdbce371c093f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p08-source
          persist-credentials: false
      - name: Existing Laravel app Owner login and updated Vue screen under real loopback HTTPS
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true && test "$P08_R137_ISOLATED" = YES && test "$P08_ISOLATED_INSTALL_TEST" = YES
          test "$(git -C p08-source rev-parse HEAD)" = f1d73d9b4fafd2c125a2060d11abdbce371c093f
          cd p08-source
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --no-interaction --no-progress --prefer-dist --no-scripts > "$RUNNER_TEMP/p08-r137-composer.log" 2>&1 || { echo P08_R137_COMPOSER_FAIL; exit 1; }
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r137-node.log" 2>&1 || { echo P08_R137_NPM_FAIL; exit 1; }
          npm run build >> "$RUNNER_TEMP/p08-r137-node.log" 2>&1 || { echo P08_R137_BUILD_FAIL; exit 1; }
          db="$RUNNER_TEMP/p08-r137-owner.sqlite"
          test ! -e "$db" && test ! -e .env
          touch "$db"; chmod 0600 "$db"
          key="$(php -r 'echo base64_encode(random_bytes(32));')"
          cat > .env <<EOF
          APP_NAME=R137_HTTPS
          APP_ENV=testing
          APP_DEBUG=false
          APP_KEY=base64:$key
          APP_URL=https://127.0.0.1:18511
          APP_LOCALE=zh_CN
          DB_CONNECTION=sqlite
          DB_DATABASE=$db
          DB_FOREIGN_KEYS=true
          SESSION_DRIVER=database
          SESSION_ENCRYPT=true
          SESSION_SECURE_COOKIE=true
          CACHE_STORE=database
          QUEUE_CONNECTION=sync
          LOG_CHANNEL=stack
          EOF
          chmod 0600 .env
          php artisan migrate --force --no-interaction > "$RUNNER_TEMP/p08-r137-migrate.log" 2>&1 || { echo P08_R137_MIGRATE_FAIL; exit 1; }
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app=require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          Illuminate\Support\Facades\DB::table('users')->insert([
            'name'=>'Synthetic Owner','email'=>'owner@isolated.example',
            'password'=>Illuminate\Support\Facades\Hash::make('Synthetic-SQLite-Owner-12345!'),
            'created_at'=>now(),'updated_at'=>now()
          ]);
          echo "P08_R137_SYNTHETIC_OWNER_ONLY=PASS\n";
          PHP
          mkdir -p storage/app/private/adops/installation
          printf '%s\n' '{"status":"INSTALLED","project_id":"P08","database_driver":"sqlite","owner_id":1,"domain":"127.0.0.1"}' > storage/app/private/adops/installation/installed.json
          chmod 0600 storage/app/private/adops/installation/installed.json
          w="$RUNNER_TEMP/p08-r137-ui"; mkdir -m 0700 "$w"
          cat > "$w/router.php" <<'PHP'
          <?php
          $site=(string)getenv('P08_R137_SITE');
          $path=parse_url((string)($_SERVER['REQUEST_URI']??''),PHP_URL_PATH);
          if(!is_string($path)||!str_starts_with($path,'/')||str_contains($path,'..')){http_response_code(404);return true;}
          $public=$site.'/public';
          $candidate=$public.$path;
          if(is_file($candidate)&&str_starts_with((string)realpath($candidate),$public.'/'))return false;
          require $public.'/index.php';
          PHP
          cat > "$w/prepend.php" <<'PHP'
          <?php
          $_SERVER['HTTPS']='on';
          $_SERVER['SERVER_PORT']='443';
          PHP
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 -keyout "$w/site.key" -out "$w/site.crt" -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1' >/dev/null 2>&1
          cat > tests/e2e/r137-admin-update-temp.spec.ts <<'SPEC'
          import { test, expect } from '@playwright/test'
          const base=process.env.P08_TEST_BASE_URL||''
          test.skip(!(process.env.GITHUB_ACTIONS==='true'&&process.env.P08_R137_ISOLATED==='YES'
            &&base==='https://127.0.0.1:18511'),'Strict synthetic Owner on loopback HTTPS only')
          test.use({ignoreHTTPSErrors:true})
          test('Owner app Updates HTTPS 390 768 1440 is safe and read-only until clicked',async ({page,request})=>{
            const errors:string[]=[]
            const automaticPosts:string[]=[]
            page.on('pageerror',e=>errors.push(e.message))
            page.on('request',r=>{
              if(r.method()==='POST'&&new URL(r.url()).pathname.startsWith('/app/system/update/'))
                automaticPosts.push(new URL(r.url()).pathname)
            })
            const guest=await request.post('/app/system/update/wake',{
              failOnStatusCode:false,maxRedirects:0,headers:{Accept:'application/json'},
              form:{_token:'invalid-r137',phase:'upgrade'}
            })
            expect([302,401,419]).toContain(guest.status())
            await page.goto('/login')
            await page.getByLabel('邮箱').fill('owner@isolated.example')
            await page.getByLabel('密码').fill('Synthetic-SQLite-Owner-12345!')
            await page.getByRole('button',{name:'登录',exact:true}).click()
            await expect(page).toHaveURL(/\/app(?:\?.*)?$/)
            await page.getByRole('button',{name:'系统更新'}).click()
            await expect(page.getByRole('heading',{name:'第 2 步 · 检查官方更新'})).toBeVisible()
            await expect(page.getByRole('heading',{name:'第 3 步 · 执行原子升级'})).toBeVisible()
            for(const width of [390,768,1440]){
              await page.setViewportSize({width,height:860})
              await expect(page.getByRole('heading',{name:'第 3 步 · 执行原子升级'})).toBeVisible()
              const actual=await page.evaluate(()=>{
                const cards=[...document.querySelectorAll('.upgrade-grid > article,.upgrade-info,.publisher-card')] as HTMLElement[]
                return {
                  width:window.innerWidth,
                  doc:document.documentElement.scrollWidth,
                  body:document.body.scrollWidth,
                  nested:cards.filter(el=>/(auto|scroll)/.test(getComputedStyle(el).overflowY)
                    &&el.scrollHeight>el.clientHeight+1).length
                }
              })
              expect(Math.max(actual.doc,actual.body),'horizontal overflow '+width).toBeLessThanOrEqual(actual.width+1)
              expect(actual.nested,'card interior scrolling '+width).toBe(0)
            }
            await expect(page.getByRole('button',{name:'检查与升级暂不可用'})).toBeDisabled()
            expect(automaticPosts,'initial load must not auto trigger updates').toEqual([])
            expect(errors,'browser must not emit JS errors').toEqual([])
            console.log('P08_R137_APP_UPDATE_REAL_HTTPS_390_768_1440=PASS')
            console.log('P08_R137_OWNER_APP_GUEST_DENY_ZERO_AUTO_POST=PASS')
          })
          SPEC
          php_pid=""; tls_pid=""
          cleanup() { rc=$?; trap - EXIT; [[ -z "$php_pid" ]] || kill "$php_pid" >/dev/null 2>&1 || true; [[ -z "$tls_pid" ]] || kill "$tls_pid" >/dev/null 2>&1 || true; exit "$rc"; }
          trap cleanup EXIT
          P08_R137_SITE="$PWD" php -d "auto_prepend_file=$w/prepend.php" -S 127.0.0.1:19511 -t "$PWD/public" "$w/router.php" > "$w/php.log" 2>&1 &
          php_pid=$!
          for i in $(seq 1 60); do (echo >/dev/tcp/127.0.0.1/19511) >/dev/null 2>&1 && break || sleep 0.2; done
          kill -0 "$php_pid"
          node "$PWD/tests/compatibility/r110_tls_front.mjs" "$w/site.crt" "$w/site.key" > "$w/tls.log" 2>&1 &
          tls_pid=$!
          for i in $(seq 1 60); do grep -Fxq R110_REAL_HTTPS_FRONT=READY "$w/tls.log" && break || sleep 0.2; done
          kill -0 "$tls_pid"
          npx playwright install --with-deps chromium > "$w/playwright-install.log" 2>&1 || { echo P08_R137_CHROMIUM_INSTALL_FAIL; exit 1; }
          P08_TEST_BASE_URL=https://127.0.0.1:18511 npx playwright test tests/e2e/r137-admin-update-temp.spec.ts --workers=1 --reporter=line
          echo P08_R137_FINAL_OWNER_ADMIN_HTTPS_THREE_VIEWPORTS=PASS
      - name: Always remove synthetic database, secrets, private source, browser and logs
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/p08-source" "$RUNNER_TEMP"/p08-r137-*
