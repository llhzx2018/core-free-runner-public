name: P07 source SQL export helper refresh exact-source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-source-export-helper-proof.yml'
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.head_ref == 'test/p07-source-export-helper-proof-20261030' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_SHA: fd966cf404dd08da412fa514d0d70e69156147ec
    steps:
      - name: Require private read token
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$VF_PRIVATE_READ_TOKEN" || { echo P07_PRIVATE_READ_UNAVAILABLE; exit 78; }
      - name: Checkout exact P07 draft
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: fd966cf404dd08da412fa514d0d70e69156147ec
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p07-private
      - name: Check affected source helper and cross-engine gates
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p07-private
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(cat BUILD_ID)" = "0.1.0-release103"
          bash -n bin/vfops-init-ui
          python3 -B -m py_compile lib/server_migration_pull.py lib/verify.py lib/sql_diff_evidence.py lib/cloudpanel.py
          export PYTHONPATH="$PWD/lib:$PWD"
          for pattern in test_source_export_helper_refresh.py test_sql_diff_command.py test_server_migration_pull.py test_bidirectional_engine_pins.py test_sql_diff_evidence.py; do
            python3 -B -m unittest discover -s tests -p "$pattern" -v
          done
          python3 -B scripts/secret_scan.py --root .
          git diff --exit-code
          echo P07_SOURCE_EXPORT_HELPER_EXACT_SOURCE_PASS
      - name: Cleanup confidential checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- p07-private
          echo P07_PRIVATE_SOURCE_CLEANUP_PASS
