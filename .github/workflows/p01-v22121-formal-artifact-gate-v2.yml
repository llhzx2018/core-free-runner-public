name: P01 V2.21.21 Formal Artifact Gate V2

on:
  pull_request:

permissions:
  contents: read

env:
  CANDIDATE: 0b62c96b787e03b0dda6ef8493d29755b6baf83e
  CANDIDATE_TREE: 02b6199ab82f2fb03dd9d8048288421037869e4e
  PRODUCTION: 383552dc5035cb60b4cd131907d05d87c3171b9b
  VERSION: 2.21.21
  SOURCE_VERSION: 2.21.20
  SCHEMA: 2026080902

jobs:
  artifact-gate-v2:
    if: startsWith(github.head_ref, 'agent/p01-22121-formal-artifact-gate')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout runner gate source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact Candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: candidate

      - name: Checkout exact Production source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCTION }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: production

      - name: Validate identities and harness
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git -C production rev-parse HEAD)" = "$PRODUCTION"
          test "$(tr -d '\r\n' < candidate/VERSION)" = "$VERSION"
          test "$(tr -d '\r\n' < production/VERSION)" = "$SOURCE_VERSION"
          bash -n runner/scripts/p01-v22121-formal-artifact-gate.sh
          python3 -m py_compile runner/scripts/p01-build-maintenance-candidate-22121.py
          echo 'IDENTITY_HARNESS=PASS'

      - name: Install gate runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip php-xml php-mbstring sqlite3 unzip jq >/dev/null

      - name: Execute corrected complete formal artifact harness
        run: |
          set -Eeuo pipefail
          cp runner/scripts/p01-v22121-formal-artifact-gate.sh /tmp/p01-v22121-formal-gate.sh
          sed -i "s#'app/AdminShell.php:sha'#'AdminShell.php:sha'#" /tmp/p01-v22121-formal-gate.sh
          sed -i 's#php -l repair-v2.21.21.php >/dev/null#php -l repair-v2.21.21.php#' /tmp/p01-v22121-formal-gate.sh
          bash -n /tmp/p01-v22121-formal-gate.sh
          bash /tmp/p01-v22121-formal-gate.sh

      - name: Publish safe evidence
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$WRITE_TOKEN"
          test -f /tmp/p01-v22121-formal-evidence.json
          jq -e '.pass==true and .release_authorized==false and .production_changed==false' /tmp/p01-v22121-formal-evidence.json >/dev/null
          git clone -q --depth 1 --branch vf-agent-operations-v1 "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/core-free-runner-public.git" evidence-repo
          mkdir -p evidence-repo/vf-agent/results
          cp /tmp/p01-v22121-formal-evidence.json evidence-repo/vf-agent/results/P01-V2.21.21-FORMAL-ARTIFACT-GATE.json
          git -C evidence-repo config user.name VictorForge
          git -C evidence-repo config user.email llhzx2018@gmail.com
          git -C evidence-repo add vf-agent/results/P01-V2.21.21-FORMAL-ARTIFACT-GATE.json
          git -C evidence-repo commit -q -m 'evidence(P01): V2.21.21 formal artifact gate PASS'
          git -C evidence-repo pull -q --rebase origin vf-agent-operations-v1
          git -C evidence-repo push -q origin HEAD:vf-agent-operations-v1
          echo 'FORMAL_ARTIFACT_GATE=PASS'

      - name: Cleanup
        if: always()
        run: |
          test ! -f /tmp/p01-v22121-browser.pid || kill "$(cat /tmp/p01-v22121-browser.pid)" 2>/dev/null || true
          rm -rf candidate production runner evidence-repo /tmp/p01-v22121-formal-gate.sh /tmp/p01-v22121-* "$RUNNER_TEMP"/p01-* || true
          echo 'CLEANUP=DONE'
