name: P01 V2.30 Formal Artifact Gate
on:
  push:
    branches: [task/p01-v230-domain-nav-shell-20260829]
    paths:
      - .github/workflows/p01-v230-formal-artifact-gate-20260829.yml
      - scripts/p01-v230-build-artifacts.py
      - scripts/p01-v230-formal-gate.sh
permissions:
  contents: read
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout gate
        uses: actions/checkout@v4
        with:
          path: runner
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout V2.30 release source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 40b2d5239c557ab6c7b9aaaa092acffa9fb926f9
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate
      - name: Checkout V2.29 production source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: v2.29.0
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - name: Checkout proven Atomic builder
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-free-runner-public
          ref: agent/p01-22121-formal-artifact-gate-20260819
          path: proven
      - name: Bind immutable source and Artifact-Gate boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          sed -i 's/1872c1268a44239a63271af0207593b05be38f51/aa9070bb810064df2e965a793b999ac8bde5734e/g' runner/scripts/p01-v230-build-artifacts.py runner/scripts/p01-v230-formal-gate.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('runner/scripts/p01-v230-formal-gate.sh')
          s=p.read_text(encoding='utf-8')
          a='PID=$(start_server "$UP" 18631 "$ART/upgrade-http-server.log")\n'
          b='echo P01_V229_TO_V230_ACTUAL_UPGRADE_HTTP_PRIVACY=PASS\n'
          i=s.find(a); j=s.find(b,i)
          if i < 0 or j < 0: raise SystemExit('remote-http block anchor missing')
          s=s[:i]+'echo P01_V230_UPGRADE_DATA_PRIVACY_DB=PASS\n'+s[j+len(b):]
          p.write_text(s,encoding='utf-8')
          PY
          test "$(git -C production rev-parse HEAD)" = aa9070bb810064df2e965a793b999ac8bde5734e
          test "$(git -C production rev-parse HEAD^{tree})" = a4922cbd297390500d5fbbf053c0072d1dd6360f
          test "$(git -C production rev-parse HEAD:src)" = 461435304a9e907f2a631c6d2af6d142917a63a5
          echo P01_V229_IMMUTABLE_TAG_AUTHORITY=PASS
          echo P01_V230_REMOTE_HTTP_GATE=DEFERRED_UNTIL_PUBLISHED_UPDATE
      - name: Exact source and formal artifact gate
        shell: bash
        run: bash runner/scripts/p01-v230-formal-gate.sh
      - name: Assemble immutable formal artifact contract
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC=/tmp/p01-v230-artifacts
          EVID=/tmp/p01-v230-formal-evidence
          OUT=/tmp/p01-v230-formal-contract
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp "$SRC/VF-Start-V2.30.0-FULL.zip" "$OUT/"
          cp "$SRC/VF_Start_V2.30.0_UPDATE.zip" "$OUT/"
          cp "$SRC/VF_Start_V2.30.0_UPDATE.zip" "$OUT/VF-Start-V2.30.0-UPDATE.zip"
          cp "$SRC/repair-v2.30.0.php" "$OUT/"
          cp "$EVID/repair-self-test.json" "$OUT/atomic-self-test.json"
          cp "$SRC/P01-V2.30.0-FORMAL-GATE.json" "$OUT/P01-V2.30.0-ARTIFACT-GATE.json"
          FULL_SHA=$(sha256sum "$OUT/VF-Start-V2.30.0-FULL.zip" | awk '{print $1}')
          UPDATE_SHA=$(sha256sum "$OUT/VF_Start_V2.30.0_UPDATE.zip" | awk '{print $1}')
          REPAIR_SHA=$(sha256sum "$OUT/repair-v2.30.0.php" | awk '{print $1}')
          FULL_BYTES=$(stat -c%s "$OUT/VF-Start-V2.30.0-FULL.zip")
          UPDATE_BYTES=$(stat -c%s "$OUT/VF_Start_V2.30.0_UPDATE.zip")
          REPAIR_BYTES=$(stat -c%s "$OUT/repair-v2.30.0.php")
          jq -n \
            --arg project_id P01 --arg version 2.30.0 --arg source_version 2.29.0 \
            --arg release_source 40b2d5239c557ab6c7b9aaaa092acffa9fb926f9 \
            --arg release_tree 771125988f07c01740e4b3dc3863ff90ebcdc5dd \
            --arg product_source 426740ee3e36d207581dddf9b3fe5d62fd8d1808 \
            --arg product_tree 73ebd54d3113b6c2123af74d6a301294689855c8 \
            --arg runtime_tree 500d485c5eda15f65cd59a61c5a6ad5a7c519f8b \
            --arg source_commit aa9070bb810064df2e965a793b999ac8bde5734e \
            --arg schema 2026082901 --arg full_sha "$FULL_SHA" --arg update_sha "$UPDATE_SHA" --arg repair_sha "$REPAIR_SHA" \
            --argjson full_bytes "$FULL_BYTES" --argjson update_bytes "$UPDATE_BYTES" --argjson repair_bytes "$REPAIR_BYTES" \
            '{project_id:$project_id,version:$version,source_version:$source_version,release_source:$release_source,release_tree:$release_tree,product_source:$product_source,product_tree:$product_tree,runtime_tree:$runtime_tree,source_commit:$source_commit,source_schema:$schema,schema:$schema,schema_change:false,schema_migrations:[],formal_artifact_gate:"PASS",actual_upgrade:"PASS",data_preservation:"PASS",public_private_db:"PASS",remote_online_update_http:"PENDING_AFTER_PUBLICATION",rollback:"PASS",interruption_recovery:"PASS",fresh_install:"PASS",release_published:false,owner_production_write:false,full:{name:"VF-Start-V2.30.0-FULL.zip",bytes:$full_bytes,sha256:$full_sha},update:{name:"VF_Start_V2.30.0_UPDATE.zip",bytes:$update_bytes,sha256:$update_sha,inner:"repair-v2.30.0.php"},repair:{name:"repair-v2.30.0.php",bytes:$repair_bytes,sha256:$repair_sha}}' > "$OUT/P01-V2.30.0-FORMAL-METADATA.json"
          (cd "$OUT" && sha256sum P01-V2.30.0-ARTIFACT-GATE.json P01-V2.30.0-FORMAL-METADATA.json VF-Start-V2.30.0-FULL.zip VF-Start-V2.30.0-UPDATE.zip VF_Start_V2.30.0_UPDATE.zip atomic-self-test.json repair-v2.30.0.php > SHA256SUMS.txt)
          test "$(find "$OUT" -maxdepth 1 -type f | wc -l)" = 8
          php -l "$OUT/repair-v2.30.0.php" >/dev/null
          unzip -Z1 "$OUT/VF_Start_V2.30.0_UPDATE.zip" | grep -Fx repair-v2.30.0.php >/dev/null
          echo "FORMAL_FULL_SHA256=$FULL_SHA"
          echo "FORMAL_UPDATE_SHA256=$UPDATE_SHA"
          echo "FORMAL_REPAIR_SHA256=$REPAIR_SHA"
          echo P01_V230_FORMAL_ARTIFACT_CONTRACT=PASS
      - name: Upload formal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p01-v230-formal-artifacts-40b2d5239c557ab6c7b9aaaa092acffa9fb926f9
          path: /tmp/p01-v230-formal-contract
          if-no-files-found: error
          retention-days: 90
      - name: Upload upgrade evidence
        uses: actions/upload-artifact@v4
        with:
          name: p01-v230-formal-evidence-40b2d5239c557ab6c7b9aaaa092acffa9fb926f9
          path: /tmp/p01-v230-formal-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Verdict
        shell: bash
        run: |
          echo P01_V230_FORMAL_RELEASE_SOURCE=40b2d5239c557ab6c7b9aaaa092acffa9fb926f9
          echo P01_V230_PRODUCT_SOURCE=426740ee3e36d207581dddf9b3fe5d62fd8d1808
          echo P01_V230_FORMAL_ARTIFACT_GATE=PASS
          echo P01_V230_READY_FOR_MAIN_PROMOTION=YES
          echo P01_V230_REMOTE_HTTP_GATE=PENDING_AFTER_PUBLICATION
          echo RELEASE_PUBLISHED=NO
          echo OWNER_PRODUCTION_WRITE=NO
