name: S01-C01 R02-R06 FAQ and glossary desktop UX verification
on:
  push:
    branches: [task/s01-frontend-design-20261017]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.133'
      TARGET_SHA: 'e531c90151efbe0f869e61b4aabbcd4c7de3939e'
      BASE_SHA: 'b0125afcea1c94feb51235074f0fa2a28d5f7d4d'
      TARGET_TREE: '5d12828b6c4ddbdab371fe02e48babd36c0c7ec1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Bound exact lane identity
        run: |
          set -Eeuo pipefail
          mkdir proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-frontend-design-20261017/spec.json --template runner/lanes/s01-frontend-design-20261017/candidate.template.yml --output /tmp/review-rendered.yml
          cmp /tmp/review-rendered.yml runner/.github/workflows/s01-frontend-design-20261017.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-frontend-design-20261017/spec.json --input runner/.github/workflows/s01-frontend-design-20261017.yml > proof/lane-identity.json
          cp -a runner/lanes/s01-frontend-design-20261017 lane
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact source and scoped syntax
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test "$(cat target/VERSION)" = "$TARGET_VERSION"
          for path in target/src/inc/services/frontend-page-{directory,progress}-service.php target/src/inc/admin/views/frontend-page*.php target/src/inc/admin/controllers/layout.php target/src/inc/bootstrap/manifests/admin-tabs/layout.php; do php -l "$path";done
          python3 - <<'PYOWN'
          import os,pathlib,subprocess,json,hashlib
          def git(*args):return subprocess.check_output(['git','-C','target',*args])
          meta=json.loads(pathlib.Path('lane/source-meta.json').read_text())
          changed=git('diff','--name-only',os.environ['BASE_SHA'],'HEAD').decode().splitlines();assert sorted(changed)==sorted(meta['files'])
          bundle=pathlib.Path('target/src/assets/css/public/vf-theme-public-runtime.css').read_text()
          for rel in meta['css_owners']:
              new=pathlib.Path('target',rel).read_text();assert bundle.count(new)==1;bundle=bundle.replace(new,git('show',os.environ['BASE_SHA']+':'+rel).decode(),1)
          assert bundle.encode()==git('show',os.environ['BASE_SHA']+':src/assets/css/public/vf-theme-public-runtime.css')
          pathlib.Path('proof/source.json').write_text(json.dumps({'status':'PASS','sha':os.environ['TARGET_SHA'],'tree':os.environ['TARGET_TREE'],'files':changed,'css_owners':meta['css_owners'],'other_css':'BYTE_IDENTICAL','version':'UNCHANGED_CANDIDATE'}))
          PYOWN
          php -l target/src/header.php
          php -l target/src/footer.php
          php -l target/src/inc/modules/module-hero.php
          php -l target/src/inc/module-system/module-system-render.php
          php -l target/src/inc/theme-navigation.php
          php -l target/src/inc/modules/module-post-list.php
          php -l target/src/inc/seo-parts/seo-jsonld.php
          php -l target/src/inc/modules/module-support-pages.php
          php -l lane/test-r07-sitemap.php
          php lane/test-r07-sitemap.php
          php -l target/src/inc/modules/module-tool-grid.php
          php -l target/src/inc/modules/module-content-matrix.php
          php -l target/src/inc/admin/views/frontend-pages.php
          php -l target/tests/targeted/test-home-priority.php
          php -l target/tests/targeted/test-nav-current-external.php
          php target/tests/targeted/test-home-priority.php
          php target/tests/targeted/test-nav-current-external.php
          node --check lane/public-browser.cjs
      - name: Existing Provider fixture
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          mkdir provider
          gh release download v1.25.91 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.91.zip --dir provider
          echo 'fcb56d605550c5b04a3ff8b3b78b8bf86ca11b77e0aa22334fa67e675b01d6df  provider/vf-tools-m3u8_V1.25.91.zip' | sha256sum -c
      - name: Browser runtime
        run: |
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Real isolated WordPress persistence and desktop browser
        run: bash lane/native.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frontend-design-proof-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Remove transient private source
        if: always()
        run: rm -rf target provider
