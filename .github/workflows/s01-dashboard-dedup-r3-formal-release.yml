name: S01 Dashboard De-dup R3 Formal Release

on:
  push:
    branches:
      - task/s01-dashboard-dedup-r3-gate
    paths:
      - .github/workflows/s01-dashboard-dedup-r3-formal-release.yml

permissions:
  contents: read

env:
  REPO: llhzx2018/vf-tools-ops
  MAIN_SHA: 04787336f03b4f02c66a66d9dd159b37032b7af2
  VERSION: 1.21.949
  ASSET: vf-tools-ops_V1.21.949.zip

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Credential gate
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"

      - name: Fetch exact merged main
        run: |
          set -Eeuo pipefail
          current="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/branches/main" | jq -r '.commit.sha')"
          test "$current" = "$MAIN_SHA"
          rm -rf /tmp/s01-r3 && mkdir -p /tmp/s01-r3/src /tmp/s01-r3/out
          curl -fsSL -L -H "Authorization: Bearer $READ_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/tarball/$MAIN_SHA" -o /tmp/s01-r3/src.tar.gz
          tar -xzf /tmp/s01-r3/src.tar.gz -C /tmp/s01-r3/src
          SOURCE_DIR="$(find /tmp/s01-r3/src -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$SOURCE_DIR"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          test "$(tr -d '\r\n' < "$SOURCE_DIR/VERSION")" = "$VERSION"

      - name: Final exact-source gate
        run: |
          set -Eeuo pipefail
          grep -F "Version: $VERSION" "$SOURCE_DIR/vf-ops.php"
          grep -F "VF_OPS_VERSION', '$VERSION'" "$SOURCE_DIR/vf-ops.php"
          php -l "$SOURCE_DIR/includes/admin-v13/views/dashboard.php"
          php "$SOURCE_DIR/tests/s01-c02-dashboard-domain-dedup-r3-contract.php"
          php "$SOURCE_DIR/tests/s01-c02-page-body-v2-production-realuse-r2-contract.php"
          php "$SOURCE_DIR/tests/s01-c02-page-body-system-v2-full-surface-contract.php"

      - name: Build exact update package
        run: |
          set -Eeuo pipefail
          python3 "$SOURCE_DIR/.github/release/build-ops-package.py"             --source "$SOURCE_DIR"             --output "/tmp/s01-r3/out/$ASSET" > /tmp/s01-r3/meta.json
          jq -e '.asset_bytes>0 and (.asset_sha256|length)==64 and .runtime_files>0 and (.runtime_fingerprint|length)==64' /tmp/s01-r3/meta.json
          python3 - <<'PY'
          import zipfile
          p="/tmp/s01-r3/out/vf-tools-ops_V1.21.949.zip"
          with zipfile.ZipFile(p) as z:
              names=[n for n in z.namelist() if not n.endswith("/")]
          assert names and all(n.startswith("vf-ops/") for n in names)
          assert "vf-ops/vf-ops.php" in names
          assert not any(n.startswith("vf-ops/vf-ops/") for n in names)
          PY
          echo "EXACT_PACKAGE_GATE=PASS"

      - name: Publish tag release asset
        run: |
          set -Eeuo pipefail
          tag="v$VERSION"
          code="$(curl -sS -o /tmp/s01-r3/ref.json -w '%{http_code}'             -H "Authorization: Bearer $WRITE_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/git/ref/tags/$tag")"
          if [ "$code" = "404" ]; then
            jq -n --arg ref "refs/tags/$tag" --arg sha "$MAIN_SHA" '{ref:$ref,sha:$sha}' >/tmp/s01-r3/ref-create.json
            curl -fsSL -X POST -H "Authorization: Bearer $WRITE_TOKEN" -H "Accept: application/vnd.github+json"               -H "Content-Type: application/json" "https://api.github.com/repos/$REPO/git/refs"               --data-binary @/tmp/s01-r3/ref-create.json >/tmp/s01-r3/ref.json
          elif [ "$code" != "200" ]; then exit 1; fi
          test "$(jq -r '.object.sha' /tmp/s01-r3/ref.json)" = "$MAIN_SHA"

          rcode="$(curl -sS -o /tmp/s01-r3/release.json -w '%{http_code}'             -H "Authorization: Bearer $WRITE_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/releases/tags/$tag")"
          if [ "$rcode" = "404" ]; then
            body='S01 Page Body V2 Production Real-use R3. Fixes the final 工作台 duplicate row: the table now renders the same filtered displayDomains collection used by the visible 8-domain count. No business logic, route, schema, permission, updater-semantic, Shell, Header or Header Menu IA change. Production remains OWNER manual.'
            jq -n --arg tag "$tag" --arg target "$MAIN_SHA" --arg name "VF Tools Ops V$VERSION" --arg body "$body"               '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,draft:false,prerelease:false}' >/tmp/s01-r3/release-create.json
            curl -fsSL -X POST -H "Authorization: Bearer $WRITE_TOKEN" -H "Accept: application/vnd.github+json"               -H "Content-Type: application/json" "https://api.github.com/repos/$REPO/releases"               --data-binary @/tmp/s01-r3/release-create.json >/tmp/s01-r3/release.json
          elif [ "$rcode" != "200" ]; then exit 1; fi

          rid="$(jq -r '.id' /tmp/s01-r3/release.json)"
          upload="$(jq -r '.upload_url' /tmp/s01-r3/release.json | sed 's/{?name,label}//')"
          curl -fsSL -H "Authorization: Bearer $WRITE_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/releases/$rid/assets" >/tmp/s01-r3/assets.json
          aid="$(jq -r --arg n "$ASSET" '.[]|select(.name==$n)|.id' /tmp/s01-r3/assets.json | head -n1)"
          if [ -z "$aid" ]; then
            curl -fsSL -X POST -H "Authorization: Bearer $WRITE_TOKEN" -H "Content-Type: application/zip"               "$upload?name=$ASSET" --data-binary @"/tmp/s01-r3/out/$ASSET" >/tmp/s01-r3/upload.json
            aid="$(jq -r '.id' /tmp/s01-r3/upload.json)"
          fi
          test -n "$aid"

          curl -fsSL -L -H "Authorization: Bearer $WRITE_TOKEN" -H "Accept: application/octet-stream"             "https://api.github.com/repos/$REPO/releases/assets/$aid" -o /tmp/s01-r3/remote.zip
          test "$(stat -c%s /tmp/s01-r3/remote.zip)" = "$(jq -r '.asset_bytes' /tmp/s01-r3/meta.json)"
          test "$(sha256sum /tmp/s01-r3/remote.zip | awk '{print $1}')" = "$(jq -r '.asset_sha256' /tmp/s01-r3/meta.json)"

          jq --argjson release_id "$rid" --argjson asset_id "$aid"              --arg released_at "$(jq -r '.published_at // .created_at' /tmp/s01-r3/release.json)"              '.+{release_id:$release_id,asset_id:$asset_id,released_at:$released_at}' /tmp/s01-r3/meta.json >/tmp/s01-r3/meta2.json
          mv /tmp/s01-r3/meta2.json /tmp/s01-r3/meta.json

      - name: Publish core-updates
        run: |
          set -Eeuo pipefail
          curl -fsSL -H "Authorization: Bearer $WRITE_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/llhzx2018/core-updates/contents/projects/S01-C02.json?ref=main" >/tmp/s01-r3/manifest-source.json
          blob="$(jq -r '.sha' /tmp/s01-r3/manifest-source.json)"
          jq -r '.content' /tmp/s01-r3/manifest-source.json | tr -d '\n' | base64 -d >/tmp/s01-r3/manifest.json

          python3 - /tmp/s01-r3/manifest.json /tmp/s01-r3/meta.json "$MAIN_SHA" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]); m=json.loads(Path(sys.argv[2]).read_text()); sha=sys.argv[3]
          d=json.loads(p.read_text())
          old=str(d.get("target_version",""))
          fv=[str(x) for x in d.get("from_versions",[])]
          if old and old!=m["version"] and old not in fv: fv.append(old)
          d.update({
            "target_version":m["version"],
            "from_versions":fv,
            "repository":"llhzx2018/vf-tools-ops",
            "release_tag":"v"+m["version"],
            "asset_name":m["asset_name"],
            "asset_bytes":m["asset_bytes"],
            "asset_sha256":m["asset_sha256"],
            "schema_from":"6.0.0",
            "schema_to":"6.0.0",
            "backup_required":True,
            "rollback_supported":True,
            "runtime_contract":"VF_WP_COMPONENT_RUNTIME_AUTHORITY_V1",
            "runtime_files":m["runtime_files"],
            "runtime_fingerprint":m["runtime_fingerprint"],
            "runtime_file_count":m["runtime_files"],
            "runtime_fingerprint_sha256":m["runtime_fingerprint"],
            "released_at":m["released_at"],
            "notes":f"Page Body V2 Production Real-use R3. Exact source {sha}. OWNER comparison surface: OPS 工作台 only. Formal Release ID {m['release_id']}; asset ID {m['asset_id']}; {m['asset_bytes']} bytes / SHA256 {m['asset_sha256']}. Runtime Authority: {m['runtime_files']} files / {m['runtime_fingerprint']}. Theme 1.35.50 and M3U8 1.25.53 unchanged. Frozen Shell/Header/Header Menu IA unchanged. Production remains OWNER manual."
          })
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")
          PY

          content="$(base64 -w0 /tmp/s01-r3/manifest.json)"
          jq -n --arg message "release(S01-C02): distribute OPS 1.21.949 dashboard de-dup R3"             --arg content "$content" --arg sha "$blob"             '{message:$message,content:$content,sha:$sha,branch:"main"}' >/tmp/s01-r3/put.json
          curl -fsSL -X PUT -H "Authorization: Bearer $WRITE_TOKEN" -H "Accept: application/vnd.github+json"             -H "Content-Type: application/json"             "https://api.github.com/repos/llhzx2018/core-updates/contents/projects/S01-C02.json"             --data-binary @/tmp/s01-r3/put.json >/tmp/s01-r3/put-result.json
          test "$(jq -r '.content.path' /tmp/s01-r3/put-result.json)" = "projects/S01-C02.json"

      - name: Remote readback
        run: |
          set -Eeuo pipefail
          test "$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/branches/main" | jq -r '.commit.sha')" = "$MAIN_SHA"
          rel="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/releases/tags/v$VERSION")"
          test "$(printf '%s' "$rel" | jq -r '.tag_name')" = "v$VERSION"
          man="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H "Accept: application/vnd.github.raw+json"             "https://api.github.com/repos/llhzx2018/core-updates/contents/projects/S01-C02.json?ref=main")"
          test "$(printf '%s' "$man" | jq -r '.target_version')" = "$VERSION"
          test "$(printf '%s' "$man" | jq -r '.asset_sha256')" = "$(jq -r '.asset_sha256' /tmp/s01-r3/meta.json)"
          test "$(printf '%s' "$man" | jq -r '.runtime_fingerprint')" = "$(jq -r '.runtime_fingerprint' /tmp/s01-r3/meta.json)"
          echo "FORMAL_RELEASE_DISTRIBUTION_CLOSURE=PASS"
          echo "PRODUCTION=NOT_EXECUTED_OWNER_MANUAL"
