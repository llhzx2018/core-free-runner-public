name: P07 M03-D04 服务器迁移 retained failed SQL readonly audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-retained-audit-20261115.yml'
permissions:
  contents: read
jobs:
  exact-source-retained-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact private P07 product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 472db71d1162a2701f393a298df198316bbbc0e9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-exact
      - name: Run isolated read-only failed audit and SQL safety regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-exact rev-parse HEAD)" = 472db71d1162a2701f393a298df198316bbbc0e9
          (
            cd .p07-exact
            export PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 PYTHONPATH="$PWD/lib"
            python3 -B -m unittest discover -s tests -p test_migration_failed_prepare_audit.py -v
            python3 -B -m unittest discover -s tests -p test_p07_m03_source_sql_safety_preimport.py -v
          )
          echo P07_M03_D04_ORIGINAL_FAILED_SQL_READONLY_EXACT_SOURCE=PASS
      - name: Remove transient private checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- .p07-exact
          test ! -e .p07-exact
          echo P07_M03_D04_PRIVATE_SOURCE_CLEANED=PASS
