name: P01 V2.36.5 Production Closure Docs R2
on:
  push:
    branches:
      - release/p01-v2365-candidate-20260902
    paths:
      - .github/workflows/p01-v2365-production-closure-docs-r2-20260902.yml
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: release/p01-v2365-candidate-20260902
          path: runner
      - name: Fresh remote fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = ef86eba16aec71c1d0dabc16ad23089a78ee5057
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = 1abe3f8808faf43d0214ec98840f0573f5216adb
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.36.5 --jq .object.sha)" = ef86eba16aec71c1d0dabc16ad23089a78ee5057
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = 61a3e93868fa8c497f4934744498e73ec0790a5f
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ef86eba16aec71c1d0dabc16ad23089a78ee5057
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Write authority closure
        run: python3 runner/scripts/p01_v2365_production_closure_docs.py
      - name: Verify docs-only boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(cat src/VERSION.txt)" = 2.36.5
          git diff --name-only | tee /tmp/changed.txt
          test "$(grep -c '^src/' /tmp/changed.txt || true)" = 0
          test "$(wc -l </tmp/changed.txt)" = 4
          grep -Fx VF_PROJECT.json /tmp/changed.txt
          grep -Fx docs/authority/CURRENT.md /tmp/changed.txt
          grep -Fx docs/handoff/CURRENT_STATE.md /tmp/changed.txt
          grep -Fx docs/evidence/P01_V2.36.5_OWNER_PRODUCTION_CLOSURE_20260902.md /tmp/changed.txt
      - name: Push closure branch
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git switch -c docs/p01-v2365-production-closure-20260902
          git add VF_PROJECT.json docs/authority/CURRENT.md docs/handoff/CURRENT_STATE.md docs/evidence/P01_V2.36.5_OWNER_PRODUCTION_CLOSURE_20260902.md
          git commit -m "docs(P01): close V2.36.5 Owner Production"
          git push origin docs/p01-v2365-production-closure-20260902
          git rev-parse HEAD | tee /tmp/closure-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2365-production-closure-docs-r2-${{ github.run_id }}
          path: |
            /tmp/changed.txt
            /tmp/closure-commit.txt
          if-no-files-found: warn
          retention-days: 90
