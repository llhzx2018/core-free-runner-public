name: TEMP S01-C02 Ops 1.21.832 Tail Probe Runtime Closure Gate
on:
  push:
    branches:
      - temp/s01-c02-v121832-tail-probe-runtime-closure-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121832-tail-probe-runtime-closure-gate.yml'
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      BASE: b0ef670e5a9564ad33329cfee8d5902bfe6a0d47
      COMMIT: 02fb592cc6aacfcf8c0a39c9a648a08977820b44
      TREE: b90f4de92921860b62d9f36f3292e8138f6ba951
    steps:
      - name: Checkout exact Product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Verify identity syntax and exact scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = '1.21.832'
          php -l ops/includes/site-release/s01-static-candidate-tail-probe-runtime-closure-v121832.php >/dev/null
          php -l ops/vf-ops.php >/dev/null
          php ops/.github/phase3/v121832-tail-probe-runtime-closure.php | grep -Fxq PASS_V121832_TAIL_PROBE_RUNTIME_CLOSURE
          mapfile -t changed < <(git -C ops diff --name-only "$BASE" "$COMMIT")
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 4
          printf '%s\n' "${changed[@]}" | grep -Fxq '.github/phase3/v121832-tail-probe-runtime-closure.php'
          printf '%s\n' "${changed[@]}" | grep -Fxq 'VERSION'
          printf '%s\n' "${changed[@]}" | grep -Fxq 'includes/site-release/s01-static-candidate-tail-probe-runtime-closure-v121832.php'
          printf '%s\n' "${changed[@]}" | grep -Fxq 'vf-ops.php'
          ! git -C ops ls-tree -r --name-only "$COMMIT" | grep -Fxq '_noop'
      - name: Verify Product authority before promotion
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for b in main develop; do
            J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/branches/$b")"
            test "$(jq -r .commit.sha <<<"$J")" = "$BASE"
            test "$(jq -r .commit.commit.tree.sha <<<"$J")" = 'bc1290af8750d54f2f2c85b6814948b7b86d891c'
          done
      - name: Verify Production remains 1.21.831 fail-closed before owner upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          J="$(curl -fsSL 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness')"
          test "$(jq -r .pluginVersion <<<"$J")" = '1.21.831'
          test "$(jq -r .activeStaticJobStatus <<<"$J")" = 'FAIL'
          test "$(jq -r .sourceRecoveryCandidateCurrentStage <<<"$J")" = '4'
          test "$(jq -r .sourceRecoveryCandidateFailureClass <<<"$J")" = 'candidate_build_unclassified'
          test "$(jq -r .sourceRecoveryCandidateBuildOffset <<<"$J")" = '225'
          test "$(jq -r .sourceRecoveryCandidateBuildTotal <<<"$J")" = '231'
          test "$(jq -r .sourceRecoveryCandidateTailProbeStatus <<<"$J")" = 'not_run'
          test "$(jq -r .candidatePackageReady <<<"$J")" = 'false'
          test "$(jq -r .manualSourceUploadRequired <<<"$J")" = 'false'
          test "$(jq -r .finalOnlinePass <<<"$J")" = 'NO'
      - name: Verify runner main untouched
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-free-runner-public/git/ref/heads/main)"
          test "$(jq -r .object.sha <<<"$J")" = '0160b557ad4ae0e8c6acd97e7551285bc05870bd'
      - name: Seal result
        shell: bash
        run: echo PASS_V121832_TAIL_PROBE_RUNTIME_CLOSURE_GATE
