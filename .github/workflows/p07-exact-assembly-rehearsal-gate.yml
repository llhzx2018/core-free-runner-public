name: TEMP P07 integrated SQL release98 rehearsal
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-exact-assembly-rehearsal-gate.yml'
      - 'experiments/p07-installer-rollback-candidate.sh'
      - 'experiments/p07-installer-rollback-gate.sh'
permissions:
  contents: read
jobs:
  isolated-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 4af318aaed2d58f590911c2a55b782613e21bce8
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source-p07
      - name: Exact-source candidate build and focused unit tests
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=source-p07 python3 -m unittest discover -s source-p07/tests -p test_p07_bundle_identity.py -v
          work="$(mktemp -d -t p07-integrated.XXXXXX)"
          echo "$work" > "$RUNNER_TEMP/p07-integrated-path"
          python3 source-p07/scripts/p07_candidate_bundle.py \
            --product-root source-p07 \
            --public-root . \
            --output "$work/staged" \
            --product-sha 4af318aaed2d58f590911c2a55b782613e21bce8 \
            --build 0.1.0-release98-rc1 \
            --care 0.1.0-rc67
          cmp source-p07/lib/verify.py "$work/staged/dist/p07/0.1.0/overlay/lib/verify.py"
          cmp source-p07/lib/server_migration_pull.py "$work/staged/dist/p07/0.1.0/overlay/lib/server_migration_pull.py"
          bash -n "$work/staged/installers/p07.sh"
          bash -n "$work/staged/installers/p07-final.sh"
          bash -n "$work/staged/installers/p07-system-care.sh"
          bash -n "$work/staged/installers/p07-toolbox.sh"
          echo P07_EXACT_SHA_CANDIDATE_STAGING_PASS
      - name: Fresh install, upgrade and aborted upgrade restore
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$(cat "$RUNNER_TEMP/p07-integrated-path")"
          candidate="$work/staged"
          export P07_ALLOW_NONROOT=1 P07_NO_EXEC=1
          # Fresh install and repeat invocation using candidate's SHA-pinned stable entry.
          export P07_INSTALL_DIR="$work/fresh/runtime"
          export P07_PREVIOUS_DIR="$work/fresh/runtime.previous"
          export P07_BIN_LINK="$work/fresh/bin/vfops"
          mkdir -p "$work/fresh/bin"
          P07_PUBLIC_ROOT="file://$candidate" bash "$candidate/installers/p07.sh"
          test "$(NO_COLOR=1 "$P07_BIN_LINK" --build-id)" = "0.1.0-release98-rc1"
          cmp source-p07/lib/verify.py "$P07_INSTALL_DIR/lib/verify.py"
          P07_PUBLIC_ROOT="file://$candidate" bash "$candidate/installers/p07.sh"
          test "$(NO_COLOR=1 "$P07_BIN_LINK" --build-id)" = "0.1.0-release98-rc1"
          echo P07_RC_FRESH_INSTALL_IDEMPOTENT_PASS

          # Old release97 -> successful release98 candidate upgrade.
          export P07_INSTALL_DIR="$work/upgrade/runtime"
          export P07_PREVIOUS_DIR="$work/upgrade/runtime.previous"
          export P07_BIN_LINK="$work/upgrade/bin/vfops"
          mkdir -p "$work/upgrade/bin"
          P07_PUBLIC_ROOT="file://$PWD" bash installers/p07.sh
          test "$(NO_COLOR=1 "$P07_BIN_LINK" --build-id)" = "0.1.0-release97"
          P07_PUBLIC_ROOT="file://$candidate" bash "$candidate/installers/p07.sh"
          test "$(NO_COLOR=1 "$P07_BIN_LINK" --build-id)" = "0.1.0-release98-rc1"
          test "$(NO_COLOR=1 "$P07_PREVIOUS_DIR/bin/vfops-user" --build-id)" = "0.1.0-release97"
          echo P07_RC_UPGRADE_PREVIOUS_PRESERVED_PASS

          # On an independent old installation, force a failure after path swap.
          export P07_INSTALL_DIR="$work/abort/runtime"
          export P07_PREVIOUS_DIR="$work/abort/runtime.previous"
          export P07_BIN_LINK="$work/abort/bin/vfops"
          mkdir -p "$work/abort/bin"
          P07_PUBLIC_ROOT="file://$PWD" bash installers/p07.sh
          test "$(NO_COLOR=1 "$P07_BIN_LINK" --build-id)" = "0.1.0-release97"
          : > "$work/abort/not-a-directory"
          export P07_BIN_LINK="$work/abort/not-a-directory/vfops"
          if P07_PUBLIC_ROOT="file://$candidate" bash "$candidate/installers/p07.sh"; then
            echo P07_ABORT_ROLLBACK_FAIL >&2
            exit 1
          fi
          test "$(NO_COLOR=1 "$P07_INSTALL_DIR/bin/vfops-user" --build-id)" = "0.1.0-release97"
          test ! -e "$P07_PREVIOUS_DIR"
          test ! -e "${P07_INSTALL_DIR}.new"
          echo P07_RC_ABORT_UPGRADE_ROLLBACK_PASS

          test ! -e /opt/vf-server-ops
          echo P07_NO_PRODUCTION_TARGETS_PASS
