name: P05 V1.1.4 Prepare Release Source

on:
  push:
    branches:
      - gate/p05-v114-owner-takeover-20260830
    paths:
      - '.github/workflows/p05-v1.1.4-prepare-release-source.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    env:
      P05_BRANCH: release/p05-v1.1.4-browser-owner-setup-20260830
      P05_VERSION: 1.1.4
      RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Verify release token
        run: test -n "$RELEASE_WRITE_TOKEN"

      - name: Checkout P05 release branch
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_BRANCH }}
          token: ${{ env.RELEASE_WRITE_TOKEN }}
          fetch-depth: 0

      - name: Bump release authority to 1.1.4
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$P05_VERSION" > VERSION
          tmp="$(mktemp)"
          jq --arg v "$P05_VERSION" '.version=$v | .target_version=$v | .working_version=$v | .status="V1.1.4_RELEASE_CANDIDATE / DEPLOYMENT_READY / PRODUCTION_NOT_DEPLOYED" | .version_change=true' VF_PROJECT.json > "$tmp"
          mv "$tmp" VF_PROJECT.json
          tmp="$(mktemp)"
          jq --arg v "$P05_VERSION" '.version=$v' package.json > "$tmp"
          mv "$tmp" package.json
          test "$(tr -d '\r\n' < VERSION)" = "$P05_VERSION"
          test "$(jq -r .version package.json)" = "$P05_VERSION"
          test "$(jq -r .version VF_PROJECT.json)" = "$P05_VERSION"
          test "$(jq -r .target_version VF_PROJECT.json)" = "$P05_VERSION"
          test "$(jq -r .working_version VF_PROJECT.json)" = "$P05_VERSION"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VERSION package.json VF_PROJECT.json
          git commit -m 'release(P05): prepare V1.1.4 browser owner setup repair'
          git push origin "HEAD:$P05_BRANCH"
          echo P05_V114_RELEASE_SOURCE_PREPARED=PASS
          echo P05_PRODUCTION_WRITE=0
