name: P08 PR84 original v013 HTTPS Owner first-forward three database proof
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-84-v013-forward-https.yml
      - scripts/p08_pr84_first_forward_https_once.sh
permissions:
  contents: read
jobs:
  first-entry-auth-https-3db:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-84-v013-forward-https-3db-20261120' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: sqlite
            image: mysql:8.4
            health: mysqladmin ping --silent
          - kind: mysql
            image: mysql:8.4
            health: mysqladmin ping --silent
          - kind: mariadb
            image: mariadb:11.8
            health: healthcheck.sh --connect --innodb_initialized
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: p08-pr84-isolated-only
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: p08-pr84-isolated-only
          MARIADB_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s
          --health-timeout=6s
          --health-retries=20
    env:
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_TEST_DB_DRIVER: ${{ matrix.kind }}
      P08_TEST_DB_HOST: 127.0.0.1
      P08_TEST_DB_CLEAN: p08_ci_clean
      P08_TEST_DB_DIRTY: p08_ci_dirty
      P08_TEST_DB_USER: root
      P08_TEST_DB_PASSWORD: p08-pr84-isolated-only
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout disposable public-safe Runner workflow only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact P08 PR84 private source, credentials never persisted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: acd89e2ebe9aefb40a4dff3a3a8ba844df28b1db
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08
      - name: Install native PHP 8.4 and Composer for genuine v013
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_mysql,pdo_sqlite,sqlite3,zip,curl,mbstring,openssl,posix,dom,intl,bcmath,fileinfo
          coverage: none
      - name: Node22 Chromium isolated browser
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install disposable nginx TLS frontend and native DB clients
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 420 sudo apt-get -qq update
          timeout 420 sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y nginx openssl mariadb-client sqlite3
          command -v nginx
          command -v mariadb-dump
      - name: Real published v013 site and v013 code entry, HTTPS Chromium owner auth/refusal
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test "$(id -u)" -ne 0
          test "$(git -C p08 rev-parse HEAD)" = acd89e2ebe9aefb40a4dff3a3a8ba844df28b1db
          bash scripts/p08_pr84_first_forward_https_once.sh "${{ matrix.kind }}"
      - name: Always erase private source, installed database fixture and test logs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- p08 "$RUNNER_TEMP/p08-84-browser-${{ matrix.kind }}" "$RUNNER_TEMP/p08-84-site-${{ matrix.kind }}"
          test ! -e p08
          test ! -e "$RUNNER_TEMP/p08-84-site-${{ matrix.kind }}"
          echo "P08_PR84_${{ matrix.kind }}_PRIVATE_CLEANUP=PASS"
