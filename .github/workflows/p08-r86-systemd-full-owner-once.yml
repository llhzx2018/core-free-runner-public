name: P08 R86 one-archive real systemd PHP-FPM nginx SQLite R21 Bridge Atomic
on:
  push:
    branches: [test/p08-r86-systemd-one-zip-20261113]
permissions:
  contents: read
jobs:
  full-owner-one-zip-lifecycle:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: f8496c916c296907550c7ce3c7098de00e8ca61a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql,pdo_sqlite,sqlite3,zip,mbstring,intl,bcmath,dom,fileinfo,sodium
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native PHP 8.4 FPM from Ubuntu 24.04 maintained PHP package repository
        run: |
          set -euo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/p08-r41-apt.log" 2>&1 || { echo P08_R41_APT_UPDATE_FAILED; tail -n 25 "$RUNNER_TEMP/p08-r41-apt.log"; exit 1; }
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq software-properties-common >> "$RUNNER_TEMP/p08-r41-apt.log" 2>&1 || { echo P08_R41_APT_PREREQUISITE_FAILED; tail -n 25 "$RUNNER_TEMP/p08-r41-apt.log"; exit 1; }
          sudo add-apt-repository -y ppa:ondrej/php >> "$RUNNER_TEMP/p08-r41-apt.log" 2>&1 || { echo P08_R41_PHP_PACKAGE_REPOSITORY_UNAVAILABLE; tail -n 25 "$RUNNER_TEMP/p08-r41-apt.log"; exit 1; }
          sudo apt-get update -qq >> "$RUNNER_TEMP/p08-r41-apt.log" 2>&1 || { echo P08_R41_PHP_PACKAGE_INDEX_UNAVAILABLE; tail -n 25 "$RUNNER_TEMP/p08-r41-apt.log"; exit 1; }
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx cron php8.4-cli php8.4-fpm php8.4-sqlite3 php8.4-mbstring php8.4-xml php8.4-zip php8.4-curl php8.4-intl >> "$RUNNER_TEMP/p08-r41-apt.log" 2>&1 || { echo P08_R41_PHP_PACKAGE_INSTALL_FAILED; tail -n 25 "$RUNNER_TEMP/p08-r41-apt.log"; exit 1; }
          test -x /usr/bin/php8.4
          test -x /usr/bin/systemctl
          test -x /usr/sbin/nginx
          test -x /usr/sbin/runuser
          echo P08_R41_REAL_PHP84_FPM_DEPENDENCIES=PASS
      - name: Create real official immutable Bridge FULL target FULL Atomic and R21 original FULL
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = f8496c916c296907550c7ce3c7098de00e8ca61a
          (cd source && python3 scripts/build_owner_atomic_pair.py --repo "$PWD" --target-sha 9c7f76434fe2d064f2f1ac15c58a760f778cf055 --output-dir "$RUNNER_TEMP/p08-r86-official")
          test "$(sha256sum "$RUNNER_TEMP/p08-r86-official/VF_AdOps_V0.1.1_UPDATE.zip" | cut -d' ' -f1)" = 329a2bbbd1bd7bc0dae5412891c06085b7b304d3a701454ac53e1a44ba12155c
          mkdir "$RUNNER_TEMP/p08-r86-historical"
          git -C source archive --format=tar 917a28636e23c89a64b0f889ed103787fd6234b8 | tar -xf - -C "$RUNNER_TEMP/p08-r86-historical"
          (
            cd "$RUNNER_TEMP/p08-r86-historical"
            composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress --classmap-authoritative >/dev/null
            npm ci --no-audit --no-fund >/dev/null
            npm run build >/dev/null
            python3 scripts/build_full.py --source "$PWD" --output "$RUNNER_TEMP/p08-r86-old-flat.zip" --version 0.1.0 --source-sha 917a28636e23c89a64b0f889ed103787fd6234b8
          )
          echo P08_R86_SYSTEMD_OLD_R21_AND_RELEASE_TAG_BYTES=PASS
      - name: Create actual disposable user, site, Nginx vhost, FPM pool and Stage artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo useradd -m -s /bin/bash p08ci
          site=/home/p08ci/htdocs/adops.kewaro.com
          bundle=/home/p08ci/artifacts/ownerbundle
          sudo mkdir -p "$site" "$bundle"
          sudo unzip -q "$RUNNER_TEMP/p08-r86-old-flat.zip" -d "$site"
          sudo cp "$RUNNER_TEMP/p08-r86-official"/VF_AdOps_V0.1.0_BRIDGE_FULL.zip "$bundle/"
          sudo cp "$RUNNER_TEMP/p08-r86-official"/VF_AdOps_V0.1.1_FULL.zip "$bundle/"
          sudo cp "$RUNNER_TEMP/p08-r86-official"/VF_AdOps_V0.1.1_UPDATE.zip "$bundle/"
          sudo cp source/scripts/cloudpanel_bridge_offline_once.sh "$bundle/"
          sudo cp source/scripts/p08-r21-official-atomic-once.php "$bundle/"
          sudo cp source/scripts/p08-r21-cloudpanel-one-time.sh "$bundle/OWNER_R21_APPLY.sh"
          sudo chown -R p08ci:p08ci /home/p08ci
          sudo chmod 0755 /home/p08ci /home/p08ci/htdocs "$site"
          sudo chmod 0700 /home/p08ci/artifacts "$bundle"
          sudo tee /etc/php/8.4/fpm/pool.d/p08ci.conf > /dev/null <<'EOF'
          [p08ci]
          user = p08ci
          group = p08ci
          listen = /run/php/p08ci-fpm.sock
          listen.owner = www-data
          listen.group = www-data
          pm = ondemand
          pm.max_children = 2
          pm.process_idle_timeout = 10s
          EOF
          sudo tee /etc/nginx/sites-enabled/adops.kewaro.com.conf > /dev/null <<'EOF'
          server {
            listen 127.0.0.1:18086;
            server_name adops.kewaro.com;
            root /home/p08ci/htdocs/adops.kewaro.com/public;
            index index.php;
            location / { try_files $uri $uri/ /index.php?$query_string; }
            location ~ \.php$ {
              include snippets/fastcgi-php.conf;
              fastcgi_pass unix:/run/php/p08ci-fpm.sock;
            }
          }
          EOF
          sudo nginx -t -q
          sudo systemctl restart php8.4-fpm cron nginx
          for service in php8.4-fpm cron nginx; do sudo systemctl is-active --quiet "$service"; done
          echo P08_R86_REAL_SYSTEMD_PHP84_FPM_NGINX_CRON_STARTED=PASS
      - name: Genuine R21 historical Laravel Owner SQLite first install and data
        shell: bash
        run: |
          set -Eeuo pipefail
          site=/home/p08ci/htdocs/adops.kewaro.com
          db=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.sqlite
          sudo runuser -u p08ci -- /usr/bin/php8.4 -r '$db=new SQLite3($argv[1],SQLITE3_OPEN_READWRITE|SQLITE3_OPEN_CREATE); $db->close();' "$site/database/$db"
          sudo runuser -u p08ci -- /usr/bin/php8.4 -r '
            $site=$argv[1];$db=$argv[2];
            require $site."/vendor/autoload.php";
            require $site."/src/Support/Autoload.php";
            (new VF\AdOps\Installation\OwnerWebInstaller())->install([
              "db_driver"=>"sqlite","db_database"=>$db,
              "owner_email"=>"owner@isolated.example",
              "owner_password"=>"SyntheticOwnerR21Testing123!",
              "owner_confirm"=>"SyntheticOwnerR21Testing123!",
            ],$site);
            $record=json_decode(file_get_contents($site."/storage/app/private/adops/installation/installed.json"),true);
            if($record["status"]!=="INSTALLED"||$record["database_driver"]!=="sqlite")exit(21);
          ' "$site" "$db"
          echo P08_R86_GENUINE_R21_SQLITE_OWNER_CREATED=PASS
      - name: Produce temporary CI-only Owner hash and user mapped scripts, never product edits
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo python3 - <<'PY'
          from pathlib import Path
          import hashlib
          site=Path('/home/p08ci/htdocs/adops.kewaro.com')
          bundle=Path('/home/p08ci/artifacts/ownerbundle')
          manifest=hashlib.sha256((site/'FULL_MANIFEST.json').read_bytes()).hexdigest()
          assert manifest!='562a664a27d1b632cc28e2225a9712c8ac670533a1e88f2e9dc41f14097f2acd'
          original='562a664a27d1b632cc28e2225a9712c8ac670533a1e88f2e9dc41f14097f2acd'
          php=(bundle/'p08-r21-official-atomic-once.php').read_text()
          assert php.count(original)==1
          php=php.replace(original,manifest)
          (bundle/'p08-r21-official-atomic-once.php').write_text(php)
          gitblob=hashlib.sha1(b'blob '+str(len(php.encode())).encode()+b'\x00'+php.encode()).hexdigest()
          shell=(bundle/'OWNER_R21_APPLY.sh').read_text()
          assert shell.count(original)>=1
          shell=shell.replace(original,manifest).replace('kewaro-adops','p08ci')
          assert '14e8a130b07e35920bbc4f17e5ff7fea33989138' in shell
          shell=shell.replace('14e8a130b07e35920bbc4f17e5ff7fea33989138',gitblob)
          (bundle/'OWNER_R21_APPLY.sh').write_text(shell)
          print('P08_R86_TEST_ONLY_SYNTHETIC_FULL_PIN_AND_P08CI_ROOT=YES')
          PY
          sudo chown -R p08ci:p08ci /home/p08ci/artifacts
          sudo bash -n /home/p08ci/artifacts/ownerbundle/OWNER_R21_APPLY.sh
          sudo /usr/bin/php8.4 -l /home/p08ci/artifacts/ownerbundle/p08-r21-official-atomic-once.php >/dev/null
      - name: Real offline Nginx and PHP-FPM drain plus private backup, Bridge, SHA256 Atomic
        shell: bash
        run: |
          set -Eeuo pipefail
          site=/home/p08ci/htdocs/adops.kewaro.com
          bundle=/home/p08ci/artifacts/ownerbundle
          sudo bash "$bundle/OWNER_R21_APPLY.sh" --check "$site" "$bundle" | tee "$RUNNER_TEMP/p08-r86-check.log"
          grep -Fxq 'P08_R86_STATUS=OFFLINE_BRIDGE_REQUIRED' "$RUNNER_TEMP/p08-r86-check.log"
          before="$(sudo systemctl show -p MainPID --value php8.4-fpm)"
          test "$before" -gt 1
          # Util-linux script creates a genuine /dev/tty for the Owner's
          # deliberate confirmation; no hidden test switch exists in source.
          printf 'APPLY_R21_P08_WITH_BACKUP\n' | script -q -e -c "sudo bash '$bundle/OWNER_R21_APPLY.sh' --apply '$site' '$bundle'" "$RUNNER_TEMP/p08-r86-real-tty.log"
          grep -Fq 'P08_R86_OWNER_R21_TO_011=SUCCEEDED' "$RUNNER_TEMP/p08-r86-real-tty.log"
          test "$(sudo readlink "$site/current")" = releases/9c7f76434fe2d064f2f1ac15c58a760f778cf055
          after="$(sudo systemctl show -p MainPID --value php8.4-fpm)"
          test "$after" -gt 1 && test "$after" != "$before"
          for service in php8.4-fpm cron nginx; do sudo systemctl is-active --quiet "$service"; done
          test ! -e "$site/storage/app/private/adops/maintenance/maintenance.json"
          echo P08_R86_FULL_ONE_BUNDLE_REAL_SYSTEMD_STOP_BACKUP_BRIDGE_ATOMIC_RESTART=PASS
      - name: Verify HTTP and installed Owner SQLite private data
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18086/up)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18086/setup.php)" = 503
          sudo runuser -u p08ci -- /usr/bin/php8.4 -r '
            $site=$argv[1]; $db=$site."/database/".str_repeat("a",32).".sqlite";
            $d=new PDO("sqlite:".$db);
            $r=$d->query("SELECT count(*) FROM users")->fetchColumn();
            if($r<1)exit(32);
            $installed=json_decode(file_get_contents($site."/storage/app/private/adops/installation/installed.json"),true);
            if($installed["status"]!=="INSTALLED")exit(33);
          ' /home/p08ci/htdocs/adops.kewaro.com
          echo P08_R86_REAL_SQLITE_OWNER_DATA_PRESERVED_AND_SETUP_LOCK=PASS
      - name: Always clean isolated private software, site and synthetic data
        if: always()
        shell: bash
        run: |
          sudo systemctl stop nginx cron php8.4-fpm 2>/dev/null || true
          sudo rm -rf /home/p08ci
          rm -rf source "$RUNNER_TEMP/p08-r86-official" "$RUNNER_TEMP/p08-r86-historical"
          rm -f "$RUNNER_TEMP/p08-r86-old-flat.zip" "$RUNNER_TEMP/p08-r86-check.log" "$RUNNER_TEMP/p08-r86-real-tty.log" "$RUNNER_TEMP/p08-r41-apt.log"
          echo P08_R86_SYSTEMD_TEST_ONLY_PRIVATE_SRC_AND_OWNER_DATA_CLEANED=YES
