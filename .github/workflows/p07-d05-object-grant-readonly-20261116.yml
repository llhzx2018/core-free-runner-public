name: P07 D05 object and grant read-only risk exact native proof TEMP
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-d05-object-grant-readonly-20261116.yml'
permissions:
  contents: read
jobs:
  p07-d05-object-risks:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout public runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact private D05 source (ephemeral)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 19b78f834b31649f4b483e8df6b56673f4257373
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: .p07-private-object
      - name: Latest GOV-DOC architecture checker (ephemeral)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-private-gov
      - name: Full PR architecture, independent module and UI UX gate
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-object rev-parse HEAD)" = 19b78f834b31649f4b483e8df6b56673f4257373
          cd .p07-private-object
          export PYTHONPATH="$PWD/lib"
          python3 -B .github/checks/test_architecture_gate.py
          python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root ../.p07-private-gov --git-root . \
            --base-sha a6da82f35fdbd06020a7e65c8cbd5717f617f2f3 --head-sha 19b78f834b31649f4b483e8df6b56673f4257373
          python3 -B scripts/check_p07_modules.py \
            --module P07-M03-D05 \
            --pr-title 'P07-M03-D05 数据库引擎转换：完整对象与授权风险预检' \
            --changed-file lib/db_engine_conversion_object_risk.py \
            --changed-file bin/vfops_db_convert_plan.py \
            --affected P07-M03-D05 \
            --shared-reason 'D05 只读预检独占实现；D04 原迁移链不变'
          python3 -B scripts/check_p07_terminal_ux.py \
            --module P07-M03-D05 \
            --changed-file bin/vfops_db_convert_plan.py \
            --evidence-file docs/ux-reviews/p07-m03-d05-compatibility-v1.json
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output([
              "git","diff","--name-only","a6da82f35fdbd06020a7e65c8cbd5717f617f2f3","19b78f834b31649f4b483e8df6b56673f4257373"
          ],text=True).splitlines()
          assert not any(p.startswith(("lib/migration_","lib/server_migration"))
                         for p in paths), "D04 execution source changed"
          print("P07_D05_OBJECT_D04_INDEPENDENCE=PASS")
          PY
          echo P07_D05_OBJECT_FULL_STRUCTURE_AND_UX=PASS
      - name: Object grant full scope unit and fail-closed regression
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          cd .p07-private-object
          export PYTHONPATH="$PWD/lib"
          python3 -B -m unittest discover -s tests -p test_p07_m03_d05_object_risk.py -v
          python3 -B -m unittest discover -s tests -p test_p07_m03_d05_cli_inspect.py -v
          echo P07_D05_OBJECT_READONLY_SECURITY=PASS
      - name: Native MariaDB special object stops MySQL target safely
        shell: bash
        env:
          P07_ALLOW_SYNTHETIC_D05: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          cd .p07-private-object
          export PYTHONPATH="$PWD/lib"
          timeout --signal=TERM --kill-after=10s 350s \
            python3 -B -m unittest discover -s tests -p test_p07_m03_d05_object_risk_native.py -v
          echo P07_D05_OBJECT_NATIVE_COMPATIBILITY=PASS
      - name: Always erase private checkout and temporary test resources
        if: always()
        shell: bash
        run: |
          set +e
          docker ps -aq --filter 'label=org.kewaro.p07.d05.synthetic' | xargs -r docker rm -f >/dev/null 2>&1
          rm -rf -- .p07-private-object .p07-private-gov
          test ! -e .p07-private-object
          test ! -e .p07-private-gov
          echo P07_D05_OBJECT_PRIVATE_CLEANUP=PASS
