name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-problem-detail196-formal-20261026]
    paths: ['.github/workflows/s01-problem-detail196-20261026-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.196
  TARGET_SHA: dbd8152792fd5a064d148672d5e415e088b7c38f
  TARGET_TREE: cebfae7eb15724801d66ecbb256928ea5869740e
  BASE_SHA: 4d44ac08dffe168f98cd78f78aa34cb6d65e750c
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Formal identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-problem-detail196-20261026/formal-spec.json --input control/.github/workflows/s01-problem-detail196-20261026-formal.yml
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: dbd8152792fd5a064d148672d5e415e088b7c38f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40269703936 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40269703936 --jq .head_sha)" = 7a7ca61f870e737beaab7096ed5363f953ef49cb
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40269703936 --repo llhzx2018/core-free-runner-public --name s01-home-40269703936 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-problem-detail196-20261026/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib,subprocess,urllib.parse
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='28adbc2ed8a372627ac1cfa6111529a7f62b0865'
          for phase in ['before','after','smoke']:
              result=json.loads((r/('problem-'+phase+'.json')).read_text())
              assert result['status']=='PASS' and result['rows']==6
          result=json.loads((r/'problem-after.json').read_text())
          assert result['status']=='PASS' and result['errors']==[] and result['checks']>=22
          assert result['ownerContentSEO']=='BYTE_IDENTICAL' and result['stockFallbacks']=='HIDDEN_CUSTOM_PRESERVED'
          assert result['ad']=='300x250_ZH_EN' and result['layout']=='1440_1024_CENTERED'
          assert result['tabletDisabled']=='COLLAPSED_NO_EMPTY_RAIL'
          assert result['off']=='HONORED' and result['noJS']=='PASS' and result['copy']=='PASS'
          for lang in ['zh','en']:
              for width in [1440,1024]:
                  for mode in ['default','ad']:assert (r/f'problem-{lang}-{width}-{mode}.png').stat().st_size>1000
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          assert json.loads((r/'bootstrap.json').read_text())['status']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']: assert old[k]==new[k],k
          assert new['sha256']=='c0c7df3116b7a2cb3fdd8b90a7e5940aad172aade9b24016fb4ec8341feaebd3' and new['bytes']==2001488
          coverage=json.loads(pathlib.Path('control/lanes/s01-problem-detail196-20261026/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA','PERFORMANCE'}
          assert coverage['source']=='28adbc2ed8a372627ac1cfa6111529a7f62b0865' and coverage['tree']=='cebfae7eb15724801d66ecbb256928ea5869740e'
          assert coverage['owner_preview_runtime']=='N_A'
          assert coverage['release_mode']=='PROJECT_PREVIEW_N_A'
          assert coverage['owner_real_use']=='POST_PRODUCTION_REQUIRED'
          assert coverage['production_auto_apply'] is False
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              endpoint='repos/llhzx2018/gov-doc/contents/'+urllib.parse.quote(item['path'],safe='/')+'?ref=main'
              live=json.loads(subprocess.check_output(['gh','api',endpoint]))
              assert live['sha']==item['sha'],item['path']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40269703936'
          coverage['merged_source']='dbd8152792fd5a064d148672d5e415e088b7c38f'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.196 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.196 provider/vf-tools-theme_V1.35.196.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.196' --notes '问题详情桌面精修：标题/目录/正文与后续模块按同一阅读区域对齐；仅呈现作者提供的诊断字段，不用分类通用文案冒充当前问题根因；默认重复限制/FAQ/工具目录推广收敛，自定义配置保留；相关工具消费现有运行时目录；侧栏广告遵守原Theme/Ops合同、页型、设备及off设置。真实WordPress/Chromium中英文1440/1024、目录/复制/noJS、自定义、合成300×250侧栏、原正文与Head保持、干净安装、195升级196/回退/重复安装及数据保护验证通过。476运行文件，Production由Owner手工升级，内容质量与真实投放及最终Owner截图验收不冒充PASS，手机暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.196 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.196 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.196 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.196.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.196.zip remote/vf-tools-theme_V1.35.196.zip
          echo 'c0c7df3116b7a2cb3fdd8b90a7e5940aad172aade9b24016fb4ec8341feaebd3  remote/vf-tools-theme_V1.35.196.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.196.zip)" = 2001488
          gh release view v1.35.196 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
