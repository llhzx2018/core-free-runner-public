name: P01 V2.36.3 Publication
on:
  push:
    branches: [release/p01-v2363-candidate-20260901]
    paths: [.github/workflows/p01-v2363-publication-20260901.yml]
permissions:
  actions: read
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORMAL_SOURCE: 718e043e3715ef7b21849bc08634fca89bf92c1f
      FORMAL_TREE: 32e8afdd6d7cdd338c62fdafaedb200b127ca881
      RUNTIME_TREE: 820724b585cb59864211f77c4fb33537b2345029
      MAIN_EXPECTED: 21ac0ff14f17237212d288f71e95bde6eae503ec
      DEVELOP_EXPECTED: bcecac5d3a9c103bfc37863a8870ec15285dcc5c
      FORMAL_RUN: '33502799058'
      FORMAL_ARTIFACT: p01-v2363-formal-artifacts-r2-33502799058
      FORMAL_DIGEST: sha256:556d4db70f831dbd69074a65f7250d791406fc9b1afe55ff5f9028bbf4a3280b
      STRICT_RUN: '33503664704'
      PROMOTION_RUN: '33504020301'
      DOWNLOAD: /tmp/p01-v2363-publish-download
      ROUNDTRIP: /tmp/p01-v2363-release-roundtrip
      EVID: /tmp/p01-v2363-publication-evidence
    steps:
      - name: Download exact Formal Artifact Gate bytes
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FORMAL_ARTIFACT }}
          path: ${{ env.DOWNLOAD }}
          repository: llhzx2018/core-free-runner-public
          run-id: ${{ env.FORMAL_RUN }}
          github-token: ${{ github.token }}
      - name: Checkout exact formal source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Publish exact tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"; rm -rf "$ROUNDTRIP"; mkdir -p "$ROUNDTRIP"
          FULL=$(find "$DOWNLOAD" -type f -name 'VF-Start-V2.36.3-FULL.zip' -print -quit); test -n "$FULL"
          PACK=$(dirname "$FULL")
          test "$(find "$PACK" -maxdepth 1 -type f | wc -l)" = 8
          for run in "$FORMAL_RUN" "$STRICT_RUN" "$PROMOTION_RUN"; do test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)" = success; done
          cd "$GITHUB_WORKSPACE/p01"
          test "$(git rev-parse HEAD)" = "$FORMAL_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$FORMAL_TREE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          DEV=$(git ls-remote origin refs/heads/develop | awk '{print $1}')
          test "$MAIN" = "$MAIN_EXPECTED"
          test "$DEV" = "$DEVELOP_EXPECTED"
          git fetch origin "$MAIN" "$DEV" --quiet
          test "$(git rev-parse "$MAIN^{tree}")" = "$FORMAL_TREE"
          test "$(git rev-parse "$MAIN:src")" = "$RUNTIME_TREE"
          git merge-base --is-ancestor "$FORMAL_SOURCE" "$MAIN"
          test "$(git rev-parse "$DEV^{tree}")" = "$FORMAL_TREE"
          test "$(git rev-parse "$DEV:src")" = "$RUNTIME_TREE"
          if git ls-remote --exit-code --tags origin refs/tags/v2.36.3 >/dev/null 2>&1; then echo UNEXPECTED_TAG; exit 20; fi
          if gh api repos/llhzx2018/vf-start/releases/tags/v2.36.3 >/dev/null 2>&1; then echo UNEXPECTED_RELEASE; exit 21; fi
          cd "$PACK"
          sha256sum -c SHA256SUMS.txt | tee "$EVID/sha256-check.txt"
          jq -e '.formal_source=="718e043e3715ef7b21849bc08634fca89bf92c1f" and .formal_tree=="32e8afdd6d7cdd338c62fdafaedb200b127ca881" and .runtime_tree=="820724b585cb59864211f77c4fb33537b2345029" and .version=="2.36.3" and .source_version=="2.36.2" and .schema=="2026082901" and .migration==null and .owner_production_write==false' P01-V2.36.3-FORMAL-METADATA.json >/dev/null
          test "$(sha256sum VF-Start-V2.36.3-FULL.zip | awk '{print $1}')" = 6580700355c8a0127b030f6217a106260f0d8867fd3c3fd6db04fbd048fe46df
          test "$(stat -c %s VF-Start-V2.36.3-FULL.zip)" = 587176
          test "$(sha256sum VF_Start_V2.36.3_UPDATE.zip | awk '{print $1}')" = 7110d0e232ce7dec521b4e76148441d06376a02124249d68237b774f2d33447d
          test "$(stat -c %s VF_Start_V2.36.3_UPDATE.zip)" = 1236976
          test "$(sha256sum repair-v2.36.3.php | awk '{print $1}')" = b76504cd122ab333815d44140ac7a1420451ed03cf63ced7013fc879044be231
          test "$(stat -c %s repair-v2.36.3.php)" = 3591557
          cp SHA256SUMS.txt "$EVID/prepublish-SHA256SUMS.txt"
          cd "$GITHUB_WORKSPACE/p01"
          git push origin "$FORMAL_SOURCE:refs/tags/v2.36.3"
          TAG=$(git ls-remote --tags origin refs/tags/v2.36.3 | awk '{print $1}')
          test "$TAG" = "$FORMAL_SOURCE"
          gh release create v2.36.3 "$PACK"/* --repo llhzx2018/vf-start --verify-tag --title 'VF Start V2.36.3' --notes 'V2.36.3 是 V2.36.2 的 Patch Release：收口 ONE FRONTEND P0 修正与四个共享前台页面的 Sticky 内容穿透修复。匿名用户保持公开内容 + 登录入口；登录后仍在同一前台显示公开 + 私人内容与管理/退出入口；退出立即恢复公开状态。没有恢复管理员视角/公开预览双视角模型。Sticky 搜索/筛选栏改为不透明背景并消除桌面 8px 泄漏间隙。Schema 仍为 2026082901，无 Migration。Candidate Readiness R2 33501907010 PASS；Formal Bind R2 33502414744 PASS；Formal Artifact R2 33502799058 PASS；Strict Fresh R2 33503664704 PASS；Main Promotion 33504020301 PASS。Owner Production 不由 Assistant 写入。'
          gh api repos/llhzx2018/vf-start/releases/tags/v2.36.3 > "$EVID/release.json"
          test "$(jq -r .tag_name "$EVID/release.json")" = v2.36.3
          test "$(jq -r .target_commitish "$EVID/release.json")" = v2.36.3
          test "$(jq -r .draft "$EVID/release.json")" = false
          test "$(jq -r .prerelease "$EVID/release.json")" = false
          test "$(jq '.assets|length' "$EVID/release.json")" = 8
          gh release download v2.36.3 --repo llhzx2018/vf-start --dir "$ROUNDTRIP"
          for f in "$PACK"/*; do n=$(basename "$f"); test -f "$ROUNDTRIP/$n"; test "$(sha256sum "$f"|awk '{print $1}')" = "$(sha256sum "$ROUNDTRIP/$n"|awk '{print $1}')"; test "$(stat -c %s "$f")" = "$(stat -c %s "$ROUNDTRIP/$n")"; done
          RELEASE_ID=$(jq -r .id "$EVID/release.json")
          PUBLISHED_AT=$(jq -r .published_at "$EVID/release.json")
          printf 'P01_V2363_PUBLICATION=PASS\nTAG=%s\nRELEASE_ID=%s\nPUBLISHED_AT=%s\nFULL_BYTES=587176\nFULL_SHA256=6580700355c8a0127b030f6217a106260f0d8867fd3c3fd6db04fbd048fe46df\nUPDATE_ASSET=VF_Start_V2.36.3_UPDATE.zip\nUPDATE_BYTES=1236976\nUPDATE_SHA256=7110d0e232ce7dec521b4e76148441d06376a02124249d68237b774f2d33447d\nREPAIR_BYTES=3591557\nREPAIR_SHA256=b76504cd122ab333815d44140ac7a1420451ed03cf63ced7013fc879044be231\nFORMAL_SOURCE=%s\nFORMAL_ARTIFACT_DIGEST=%s\nSTRICT_FRESH_R2_RUN=%s\nMAIN_PROMOTION_RUN=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$TAG" "$RELEASE_ID" "$PUBLISHED_AT" "$FORMAL_SOURCE" "$FORMAL_DIGEST" "$STRICT_RUN" "$PROMOTION_RUN" | tee "$EVID/verdict.txt"
          jq -r '.assets[] | [.name,.size,(.digest//"")] | @tsv' "$EVID/release.json" | sort > "$EVID/release-assets.tsv"
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2363-publication-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 90
