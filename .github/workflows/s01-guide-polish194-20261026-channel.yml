name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-guide-polish194-channel-20261026]
    paths: ['.github/workflows/s01-guide-polish194-20261026-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.194
  TARGET_SHA: a02c80efe12a65c0ee22ae87adfbd8130c735198
  UPDATE_SHA: 7e5001a6ba8ac8086d47b3f860e8d7263ed82bd2
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 7e5001a6ba8ac8086d47b3f860e8d7263ed82bd2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Channel identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-guide-polish194-20261026/channel-spec.json --input control/.github/workflows/s01-guide-polish194-20261026-channel.yml
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          test "$(git -C source diff --name-only 94db5883648e41001c1d3871366de8f11e54266c 7e5001a6ba8ac8086d47b3f860e8d7263ed82bd2)" = projects/S01-C01.json
          git -C source diff --exit-code 94db5883648e41001c1d3871366de8f11e54266c 7e5001a6ba8ac8086d47b3f860e8d7263ed82bd2 -- projects/S01-C03.json
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='4ef757de6068654805a649085fb6a5aba3da0f905d9cd21adc81ea473ec1a4a3' and m['asset_bytes']==1999608
          assert m['runtime_files']==476 and '1.35.193' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
