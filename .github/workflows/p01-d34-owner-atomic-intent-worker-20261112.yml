name: P01 D34 native Owner click to independent protected CLI Atomic (temporary)
on:
  push:
    branches:
      - test/p01-d34-owner-atomic-intent-worker-20261112
env:
  TARGET_VERSION: "2.47.515"
  TARGET_SHA: "7e69b23105933b7267368b045f8f85e7831cebcc"
permissions:
  contents: read
jobs:
  phase2-sqlite-real-fpm-restore-atomic:
    runs-on: ubuntu-24.04
    env:
      BEFORE_SHA: "a04ded744529fb636a539533f2befe8b75a1b5b4"
    timeout-minutes: 25
    steps:
      - name: Verify registered public-safe runner and fixture identity
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-d34-owner-atomic-intent-worker-20261112"
          echo P01_D21_INPUT=SYNTHEIC_ONLY
      - name: Probe private checkout capability without exposing secret
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ"
          echo P01_D21_PRIVATE_READ=AVAILABLE
      - name: Checkout baseline immutable Laravel private product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: a04ded744529fb636a539533f2befe8b75a1b5b4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: before
      - name: Checkout independent candidate immutable Laravel private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 7e69b23105933b7267368b045f8f85e7831cebcc
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Verify exact source, D19 contract, and native parser
        run: |
          set -Eeuo pipefail
          test "$(git -C before rev-parse HEAD)" = "a04ded744529fb636a539533f2befe8b75a1b5b4"
          test "$(git -C candidate rev-parse HEAD)" = "7e69b23105933b7267368b045f8f85e7831cebcc"
          test "$(cat before/VERSION)" = "2.47.515"
          test "$(cat candidate/VERSION)" = "2.47.515"
          php -l candidate/src/app/next/runtime/ImmutableReleasePrivateLayout.php
          php -l candidate/src/app/next/runtime/InstalledRuntime.php
          php -l candidate/src/app/next/runtime/LaravelBootAuthority.php
          php -l candidate/src/app/next/runtime/CloudPanelSiteActivation.php
          php -l candidate/src/app/next/runtime/CloudPanelFrontControllerPreflight.php
          php -l candidate/src/app/next/runtime/IsolatedRealLaravelRollout.php
          php -l candidate/src/app/next/runtime/WriteGate.php
          php -l candidate/src/app/next/runtime/IsolatedRecoverySnapshot.php
          php -l candidate/tests/compatibility/p01_d27_protected_switch.php
          php -l candidate/src/app/next/runtime/OwnerIsolatedUpdateIntent.php
          php -l candidate/src/app/next/http/OwnerUpgradeRoutes.php
          php -l candidate/tests/compatibility/p01_d34_owner_request_bridge.php
          php -l candidate/tests/compatibility/p01_d31_installed_clone_fixture.php
          php -l candidate/src/app/next/runtime/IsolatedRecoveryAssessment.php
          php -l candidate/tests/compatibility/p01_d28_recovery_assessment.php
          php -l candidate/src/app/next/runtime/IsolatedVerifiedCodeRecovery.php
          php -l candidate/tests/compatibility/p01_d29_reconcile_interrupted.php
          python3 -m py_compile candidate/tests/compatibility/p01_d21_fixed_public_http.py
          php -l candidate/src/app/next/runtime/WriteGate.php
          php -l candidate/tests/unit/p01_d19_immutable_runtime_layout_contract.php
          php -l candidate/tests/compatibility/p01_d21_fixed_public_switch.php
          python3 -m py_compile candidate/tests/compatibility/p01_d21_fixed_public_http.py
          php candidate/tests/unit/p01_d19_immutable_runtime_layout_contract.php
          php -l candidate/src/app/next/stable/selector.php
          php -l candidate/tests/compatibility/p01_d24_stage_assets.php
          php -l candidate/src/app/next/runtime/PrivateMediaRead.php
          php -l candidate/src/app/next/http/OwnerPrivateMediaRoutes.php
          php -l candidate/tests/unit/p01_d25_private_media_contract.php
          php candidate/tests/unit/p01_d25_private_media_contract.php
          python3 -m py_compile candidate/tests/compatibility/p01_d21_fixed_public_http.py
          php -l candidate/src/app/next/stable/index.php
          php -l candidate/tests/unit/p01_d21_stable_public_entry_contract.php
          php -l candidate/tests/compatibility/p01_d21_fixed_public_switch.php
          python3 -m py_compile candidate/tests/compatibility/p01_d21_fixed_public_http.py
          php candidate/tests/unit/p01_d21_stable_public_entry_contract.php
          echo P01_D21_EXACT_TWO_SOURCE_SHA=a04ded744529fb636a539533f2befe8b75a1b5b4:7e69b23105933b7267368b045f8f85e7831cebcc
      - name: Prepare build-only Composer and PHP runtime
        run: |
          set -Eeuo pipefail
          if ! command -v composer >/dev/null || ! php -r 'exit(PHP_VERSION_ID>=80300 && extension_loaded("pdo_sqlite") && extension_loaded("pdo_mysql")?0:1);'; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq composer unzip php8.3-cli php8.3-sqlite3 php8.3-mysql php8.3-mbstring php8.3-xml php8.3-curl >/dev/null
          fi
          php -r 'exit(PHP_VERSION_ID>=80300 && extension_loaded("pdo_sqlite")?0:1);'
          echo P01_D21_COMPOSER_ONLY_IN_BUILD=YES
      - name: Use locked Node 22 for build-only Vue/Vite proof
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: candidate/src/app/next/frontend/package-lock.json
      - name: Isolated native Nginx TLS plus PHP-FPM fixed-public-root Owner upgrade proof
        run: |
          set -Eeuo pipefail
          umask 077
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx php8.3-fpm php8.3-sqlite3 php8.3-mbstring php8.3-xml php8.3-curl >/dev/null
          site="/tmp/p01-d21-sandbox-$(openssl rand -hex 10)"
          scratch="$(mktemp -d /tmp/p01-d21-fpm-XXXXXX)"
          auth="$(mktemp /tmp/p01-d21-basic-XXXXXX)"
          clean_native() {
            sudo /usr/sbin/nginx -c "$scratch/nginx.conf" -s quit >/dev/null 2>&1 || true
            if [ -f "$scratch/fpm.pid" ]; then
              sudo kill "$(cat "$scratch/fpm.pid")" >/dev/null 2>&1 || true
            fi
            rm -rf -- "$site" "$scratch"
            rm -f -- "$auth" /tmp/p01-d21-fpm-before.zip /tmp/p01-d21-fpm-candidate.zip
          }
          trap clean_native EXIT
          user="$(id -un)"
          group="$(id -gn)"
          mkdir -m 0700 -- "$site"
          mkdir -m 0700 -- "$site/private" "$site/releases" "$site/public"
          python3 before/scripts/build_p01_next_clean_full.py build --source-sha "$BEFORE_SHA" --output /tmp/p01-d21-fpm-before.zip
          python3 candidate/scripts/build_p01_next_clean_full.py build --source-sha 7e69b23105933b7267368b045f8f85e7831cebcc --output /tmp/p01-d21-fpm-candidate.zip
          python3 before/scripts/build_p01_next_clean_full.py verify --zip /tmp/p01-d21-fpm-before.zip
          python3 candidate/scripts/build_p01_next_clean_full.py verify --zip /tmp/p01-d21-fpm-candidate.zip
          mkdir -m 0700 -- "$site/releases/a04ded744529fb636a539533f2befe8b75a1b5b4" "$site/releases/7e69b23105933b7267368b045f8f85e7831cebcc"
          python3 -m zipfile -e /tmp/p01-d21-fpm-before.zip "$site/releases/a04ded744529fb636a539533f2befe8b75a1b5b4"
          python3 -m zipfile -e /tmp/p01-d21-fpm-candidate.zip "$site/releases/7e69b23105933b7267368b045f8f85e7831cebcc"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=p01-test.example.org' \
            -keyout "$scratch/key.pem" -out "$scratch/cert.pem" >/dev/null 2>&1
          printf 'vf-install:%s\n' "$(openssl passwd -apr1 'p01-d21-synthetic-only')" > "$auth"
          chmod 0644 "$auth"
          cat >"$scratch/fpm.conf" <<EOF
          [global]
          pid = $scratch/fpm.pid
          error_log = $scratch/fpm.log
          daemonize = no
          [d21]
          user = $user
          group = $group
          listen = 127.0.0.1:18389
          listen.allowed_clients = 127.0.0.1
          pm = static
          pm.max_children = 2
          clear_env = yes
          php_admin_flag[display_errors] = off
          EOF
          cat >"$scratch/nginx.conf" <<EOF
          user $user $group;
          pid $scratch/nginx.pid;
          error_log $scratch/nginx.log;
          events { worker_connections 128; }
          http {
            include /etc/nginx/mime.types;
            default_type application/octet-stream;
            access_log off;
            server {
              listen 127.0.0.1:18443 ssl;
              server_name p01-test.example.org;
              root $site/public;
              ssl_certificate $scratch/cert.pem;
              ssl_certificate_key $scratch/key.pem;
              auth_basic "D21 synthetic installation gate";
              auth_basic_user_file $auth;
              location ^~ /assets/ {
                # Only the source-hashed D22 stager writes this directory.
                # No PHP execution, private paths or directory listing.
                try_files \$uri =404;
                add_header Cache-Control "public, max-age=31536000, immutable" always;
                add_header X-Content-Type-Options "nosniff" always;
              }
              location / {
                include /etc/nginx/fastcgi_params;
                fastcgi_param SCRIPT_FILENAME $site/public/index.php;
                fastcgi_param DOCUMENT_ROOT $site/public;
                fastcgi_param HTTPS on;
                fastcgi_param SERVER_NAME p01-test.example.org;
                fastcgi_param HTTP_HOST \$http_host;
                fastcgi_param AUTH_TYPE Basic;
                fastcgi_param REMOTE_USER \$remote_user;
                fastcgi_pass 127.0.0.1:18389;
              }
            }
          }
          EOF
          sudo /usr/sbin/php-fpm8.3 -t -y "$scratch/fpm.conf" >/dev/null 2>&1
          sudo /usr/sbin/nginx -c "$scratch/nginx.conf" -t >/dev/null 2>&1
          sudo /usr/sbin/php-fpm8.3 -F -y "$scratch/fpm.conf" >"$scratch/fpm.out" 2>&1 &
          sudo /usr/sbin/nginx -c "$scratch/nginx.conf" -g 'daemon off;' >"$scratch/nginx.out" 2>&1 &
          ready=NO
          for n in $(seq 1 50); do
            code="$(curl -ksS --noproxy '*' -H 'Host: p01-test.example.org' \
              -o /dev/null -w '%{http_code}' https://127.0.0.1:18443/_next/install/ 2>/dev/null || true)"
            if [ "$code" = 401 ]; then ready=YES;break; fi
            sleep 0.1
          done
          test "$ready" = YES
          echo P01_D21_NGINX_NATIVE_TLS_MISSING_BASIC=401_DENIED
          P01_D21_FPM_HTTPS=1 P01_D24_STATIC_HTTPS=1 P01_D25_MEDIA_HTTPS=1 P01_D27_PROTECTED_SWITCH=1 P01_D31_PROTECTED_DRILL=1 P01_D34_OWNER_CLICK=1 P01_D28_ASSESSMENT=1 P01_D29_RECONCILE=1 python3 candidate/tests/compatibility/p01_d21_fixed_public_http.py \
            "$site" "a04ded744529fb636a539533f2befe8b75a1b5b4" "7e69b23105933b7267368b045f8f85e7831cebcc" \
            "$PWD/candidate/tests/compatibility/p01_d21_fixed_public_switch.php"
          echo P01_D21_NATIVE_NGINX_PHP_FPM_FIXED_ROOT_OWNER_CONTINUITY=PASS
          echo P01_D24_REAL_NATIVE_HTTPS_OWNER_AND_HASHED_STATIC=PASS
          echo P01_D25_REAL_NATIVE_HTTPS_OWNER_PRIVATE_MEDIA_AND_RANGE=PASS
          echo P01_D27_REAL_INSTALLED_OWNER_PREUPGRADE_SNAPSHOT_POINTER_ATOMIC=PASS
          echo P01_D34_OWNER_CLICK_INDEPENDENT_CLI_PROTECTED_COMMIT=PASS
          echo P01_D28_SQLITE_NO_AUTOMATIC_RECOVERY_UNLOCK=PASS
          echo P01_D29_SQLITE_ACTUAL_ISOLATED_RECOVERY_AFTER_CRASH=PASS
          echo P01_D21_REAL_CLOUDPANEL_VHOST=NOT_PROVEN
          echo P01_D21_CLOUDPANEL_OWNER_TRIAL=NOT_READY
      - name: SQLite selected-engine encrypted backup, real clone restore and corrupt-data refusal
        shell: bash
        run: |
          set -Eeuo pipefail
          php candidate/tests/compatibility/p01_d14_isolated_recovery_smoke.php sqlite
          echo P01_PHASE2_SQLITE_RESTORE_NEGATIVES=PASS
      - name: Re-run D15 and D17 isolation contracts on current exact source
        run: |
          set -Eeuo pipefail
          php candidate/tests/unit/p01_d15_write_gate_contract.php
          php candidate/tests/unit/p01_d17_isolated_code_switch_contract.php
          echo P01_D21_EXISTING_RECOVERY_GUARDS=PASS
      - name: Existing Laravel boot, cloud site and full-stack contract regression
        run: |
          set -Eeuo pipefail
          cd candidate
          php tests/unit/p01_d10_front_controller_preflight_contract.php
          php tests/unit/p01_d10_deployment_binding_contract.php
          php tests/unit/p01_d10_cli_activation_contract.php
          php tests/unit/p01_d11_laravel_boot_contract.php
          php tests/unit/p01_d11_runtime_source_parse_contract.php
          python3 scripts/check_p01_fullstack_contract.py --database-adapter --database-schema
          python3 -m unittest discover -s tests/architecture -p test_p01_next_full_bundle.py -q
          set +e
          python3 scripts/check_p01_fullstack_contract.py --database-install >/tmp/p01-d21-full-gate.log 2>&1
          full_status=$?
          set -e
          test "$full_status" -ne 0
          rm -f /tmp/p01-d21-full-gate.log
          echo P01_D21_RELATED_BOOT_BUILDER_CONTRACT_REGRESSION=PASS
          echo P01_D21_FORMAL_FULL_GATE=EXPECTED_FAIL_NOT_READY
      - name: Cleanup private source and test records
        if: always()
        run: |
          rm -rf -- before candidate
          echo P01_D21_PRIVATE_SOURCE_PERSISTED=NO
