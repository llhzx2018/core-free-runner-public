name: P01 v517 real official-shaped FULL strict SHA verifier final preissue gate
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  exact-full-preissue:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TARGET_SHA: c00f54bed0fa3521a3c57bfcd591745fb45db776
      BRIDGE_SHA: ab49e83c4715cc9246c4333679fc5388e554cc98
    steps:
      - name: Confirm registered Runner and no Production writes
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = llhzx2018/core-free-runner-public
          test "$GITHUB_HEAD_REF" = test/p01-v517-official-full-anchored-verify-20261119
          test -n "$READ_TOKEN"
          echo P01_517_ONEOFF_PUBLIC_SAFE_PRODUCTION_AND_RELEASE_WRITES=NO
      - name: Exact candidate transient private checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: c00f54bed0fa3521a3c57bfcd591745fb45db776
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Bind exact current source and Python release-shape safety checks
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat candidate/VERSION)" = 2.47.517
          test "$(cat candidate/src/VERSION.txt)" = 2.47.517
          python3 -m py_compile candidate/scripts/build_p01_next_cloudpanel_full.py candidate/tests/unit/p01_d35_cloudpanel_layout_contract.py
          python3 candidate/tests/unit/p01_d35_cloudpanel_layout_contract.py
          php -l candidate/src/app/next/runtime/MajorUnsignedReleaseStage.php
          php -l candidate/src/app/next/runtime/MajorInnerFullIntegrity.php
          echo P01_517_D35_INDEPENDENT_MANIFEST_ANCHOR_NEGATIVES=PASS
      - name: Install native Composer PHP Zip and source build prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/p01-v517-install.log" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-cli php8.3-curl php8.3-zip php8.3-xml php8.3-mbstring php8.3-sqlite3 composer unzip >> "$RUNNER_TEMP/p01-v517-install.log" 2>&1
          command -v composer
          command -v php
          echo P01_517_NATIVE_BUILD_PREREQUISITES=PASS
      - name: Authenticated original v516 Release, Full asset, source and SHA
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(gh api 'repos/llhzx2018/vf-start/git/ref/tags/v2.47.516' --jq '.object.sha')" = "$BRIDGE_SHA"
          gh api 'repos/llhzx2018/vf-start/releases/tags/v2.47.516' > "$RUNNER_TEMP/v516-release.json"
          jq -e '.id==450865608 and .tag_name=="v2.47.516" and .draft==false and .prerelease==false' "$RUNNER_TEMP/v516-release.json" >/dev/null
          jq -e '.assets | any(.id==766156722 and .name=="VF-Start-V2.47.516-FULL.zip" and .size==1874648 and .digest=="sha256:016edb85c7cfa48bf939d69fce1f0925f6f50647fded286a5b6df3789ca580ce")' "$RUNNER_TEMP/v516-release.json" >/dev/null
          gh release download v2.47.516 -R llhzx2018/vf-start -D "$RUNNER_TEMP" -p 'VF-Start-V2.47.516-FULL.zip' > "$RUNNER_TEMP/v516-download.log" 2>&1
          test "$(sha256sum "$RUNNER_TEMP/VF-Start-V2.47.516-FULL.zip" | cut -d' ' -f1)" = 016edb85c7cfa48bf939d69fce1f0925f6f50647fded286a5b6df3789ca580ce
          echo P01_517_REAL_ISSUED_516_FULL_TAG_ASSET_AND_SHA=PASS
      - name: Real composer and vite FULL then private official-shaped MAJOR stage
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd candidate && python3 scripts/build_p01_next_clean_full.py build --source-sha "$TARGET_SHA" --output "$RUNNER_TEMP/dev-clean-full.zip" --composer composer > "$RUNNER_TEMP/p01-build.log" 2>&1) || { tail -n 22 "$RUNNER_TEMP/p01-build.log"; exit 1; }
          (cd candidate && python3 scripts/build_p01_next_cloudpanel_full.py build --source-zip "$RUNNER_TEMP/dev-clean-full.zip" --output "$RUNNER_TEMP/dev-cloudpanel-full.zip" > "$RUNNER_TEMP/p01-cloud-build.log" 2>&1) || { tail -n 22 "$RUNNER_TEMP/p01-cloud-build.log"; exit 1; }
          STAGE="/tmp/p01-major-release-stage-$(openssl rand -hex 10)"
          mkdir -m 700 "$STAGE"
          echo "$STAGE" > "$RUNNER_TEMP/p01-stage-root.txt"
          P01_MAJOR_RELEASE_STAGE_ISOLATED=YES php -r '
            require "candidate/src/app/next/runtime/MajorUnsignedReleaseStage.php";
            $r=VfNextMajorUnsignedReleaseStage::stage($argv[1],$argv[2],$argv[3],$argv[4]);
            if(($r["status"]??null)!=="UNSIGNED_MAJOR_CANDIDATE_SEALED_NOT_EXECUTABLE"
                ||($r["owner_execution_authorized"]??true)!==false
                ||($r["github_release_asset_verified"]??true)!==false)exit(42);
            file_put_contents($argv[2]."/stage-receipt.json", json_encode([
               "source_sha"=>$r["source_sha"],
               "manifest_sha256"=>$r["target_full_manifest_sha256"],
               "full_sha256"=>$r["target_full_sha256"]
            ],JSON_THROW_ON_ERROR));
            echo "P01_517_FULL_AND_MAJOR_CANDIDATE_ONLY_STAGED=PASS\n";
          ' "$RUNNER_TEMP/dev-cloudpanel-full.zip" "$STAGE" "$TARGET_SHA" 016edb85c7cfa48bf939d69fce1f0925f6f50647fded286a5b6df3789ca580ce
          echo P01_517_ACTUAL_RELEASE_AND_OWNER_APPLY=NOT_PERFORMED
      - name: Independently anchored official FULL verifier and malicious negative cases
        shell: bash
        run: |
          set -Eeuo pipefail
          STAGE="$(cat "$RUNNER_TEMP/p01-stage-root.txt")"
          test "$STAGE" = "$(realpath "$STAGE")"
          FULL="$STAGE/UNSIGNED-CLOUDPANEL-LARAVEL-FULL.zip"
          MANIFEST_SHA="$(jq -r .manifest_sha256 "$STAGE/stage-receipt.json")"
          test "$(jq -r .source_sha "$STAGE/stage-receipt.json")" = "$TARGET_SHA"
          test "$(sha256sum "$FULL" | cut -d' ' -f1)" = "$(jq -r .full_sha256 "$STAGE/stage-receipt.json")"
          python3 candidate/scripts/build_p01_next_cloudpanel_full.py verify --zip "$FULL" --official-source-sha "$TARGET_SHA" --official-manifest-sha256 "$MANIFEST_SHA" > "$RUNNER_TEMP/p01-official-verified.json"
          jq -e '.status=="CLOUDPANEL_OFFICIAL_SHAPED_FULL_VERIFIED_NOT_PUBLISHED" and .readiness=="OFFICIAL_SIGNED_FULL_STAGED" and .source_sha=="'"$TARGET_SHA"'"' "$RUNNER_TEMP/p01-official-verified.json" >/dev/null
          if python3 candidate/scripts/build_p01_next_cloudpanel_full.py verify --zip "$FULL" >/dev/null 2>&1; then echo FORGED_OFFICIAL_WITHOUT_IDENTITY_ACCEPTED; exit 91; fi
          if python3 candidate/scripts/build_p01_next_cloudpanel_full.py verify --zip "$FULL" --official-source-sha "$(printf 'f%.0s' {1..40})" --official-manifest-sha256 "$MANIFEST_SHA" >/dev/null 2>&1; then echo WRONG_SOURCE_ACCEPTED; exit 92; fi
          if python3 candidate/scripts/build_p01_next_cloudpanel_full.py verify --zip "$FULL" --official-source-sha "$TARGET_SHA" --official-manifest-sha256 "$(printf '0%.0s' {1..64})" >/dev/null 2>&1; then echo WRONG_MANIFEST_ACCEPTED; exit 93; fi
          if python3 candidate/scripts/build_p01_next_cloudpanel_full.py verify --zip "$RUNNER_TEMP/dev-cloudpanel-full.zip" --official-source-sha "$TARGET_SHA" --official-manifest-sha256 "$MANIFEST_SHA" >/dev/null 2>&1; then echo DEVELOPER_ZIP_PROMOTED; exit 94; fi
          echo P01_517_EXACT_SOURCE_MANIFEST_OFFICIAL_SHAPED_FULL_STRICT_VERIFIER=PASS
          echo P01_517_FAKE_SOURCE_HASH_MANIFEST_AND_DEVELOPER_READY_NEGATIVES=PASS
          echo P01_517_GITHUB_V517_RELEASE_REMOTE_BYTES=NOT_ISSUED_BY_THIS_RUN
      - name: Always remove private checkout, source, fulls and credentials
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/p01-stage-root.txt" ]; then
            STAGE="$(cat "$RUNNER_TEMP/p01-stage-root.txt")"
            if [[ "$STAGE" =~ ^/tmp/p01-major-release-stage-[a-f0-9]{20}$ ]]; then rm -rf -- "$STAGE"; fi
          fi
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP"/dev-*.zip "$RUNNER_TEMP/VF-Start-V2.47.516-FULL.zip"
          rm -f -- "$RUNNER_TEMP"/p01-*.log "$RUNNER_TEMP"/v516-*.json "$RUNNER_TEMP"/v516-*.log "$RUNNER_TEMP"/p01-*.json "$RUNNER_TEMP/p01-stage-root.txt"
          echo P01_517_PRIVATE_SOURCE_AND_FULL_PUBLIC_ARTIFACT_PERSISTED=NO
          echo P01_517_PRODUCTION_CLOUDPANEL_DNS_MIGRATION=UNCHANGED
