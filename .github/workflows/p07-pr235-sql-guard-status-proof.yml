name: P07 PR235 SQL guard status exact-source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-pr235-sql-guard-status-proof.yml'
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.head_ref == 'test/p07-sql-guard-status-pr235-20261029' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_SHA: 61d394a477ab95b62794904a787c4e0934906e57
    steps:
      - name: Check private source read capability without printing it
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$VF_PRIVATE_READ_TOKEN" || { echo P07_PRIVATE_READ_UNAVAILABLE; exit 78; }
      - name: Checkout exact private P07 PR235 head transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 61d394a477ab95b62794904a787c4e0934906e57
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p07-private
      - name: Verify exact source and focused fail-closed regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p07-private
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(cat BUILD_ID)" = '0.1.0-release100'
          bash -n bin/vfops-migrate-ui
          export PYTHONPATH="$PWD/lib:$PWD"
          for test_file in test_server_migration_pull.py test_cross_engine_sql_format.py test_verify.py test_mariadb_owner_policy.py test_secret_scan.py; do
            python3 -B -m unittest discover -s tests -p "$test_file" -v
          done
          git diff --exit-code
          echo P07_PR235_SQL_GUARD_REDACTION_FAIL_CLOSED_TESTS_PASS
      - name: Remove transient private checkout
        if: always()
        shell: bash
        run: |
          if [ -d p07-private ]; then rm -rf -- p07-private; fi
          echo P07_PRIVATE_CHECKOUT_CLEANUP_DONE
