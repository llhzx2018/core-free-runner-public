name: S01-C02 1.21.1059 Quality capability runtime candidate
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: c4ce5ccdc07e77caac3606823922ec0853b96fbd
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, sodium, mbstring

      - name: Exact source and contracts
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          test "$(git -C target rev-parse HEAD)" = "c4ce5ccdc07e77caac3606823922ec0853b96fbd"
          test "$(git -C target rev-parse HEAD^{tree})" = "d48f559f14be4414be92afe23e02a461ba89b775"
          test "$(cat target/VERSION)" = "1.21.1059"
          grep -F "Version: 1.21.1059" target/vf-ops.php >/dev/null
          grep -F "S01-V10-QUALITY-CAPABILITY-RUNTIME-CLOSURE" target/vf-ops.php >/dev/null
          php target/tests/s01-c02-1211059-quality-capability-runtime-contract.php
          php target/tests/s01-c02-1211058-quality-disclosure-contract.php
          php target/tests/s01-c02-1211057-active-quality-task-action-contract.php
          php target/tests/s01-c02-1211056-quality-task-entry-contract.php
          php target/tests/s01-c02-1211055-quality-center-final-visual-contract.php
          php target/tests/s01-c02-1211054-quality-center-visual-hierarchy-contract.php
          php target/tests/s01-c02-1211053-quality-task-compact-contract.php
          php target/tests/s01-c02-1211052-quality-center-flat-contract.php
          php target/tests/s01-c02-1211051-source-real-run-contract.php
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          php -l target/includes/views/admin-style-helpers/admin-style-core.php > evidence/php-lint-style.txt
          php -l target/includes/bootstrap/runtime-loader.php > evidence/php-lint-runtime.txt
          echo CONTRACTS=PASS

      - name: Browser Source start and regressions
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/quality-node
          cd /tmp/quality-node
          npm init -y >/dev/null
          npm install --no-save playwright@1.58.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          export NODE_PATH=/tmp/quality-node/node_modules
          cd "$GITHUB_WORKSPACE"
          node target/tests/s01-c02-1211059-source-start-browser-proof.js > evidence/source-start-browser.json
          node target/tests/s01-c02-1211058-quality-disclosure-browser-proof.js > evidence/disclosure-browser.json
          node target/tests/s01-c02-1211057-active-quality-task-action-browser-proof.js > evidence/active-task-browser.json
          node target/tests/s01-c02-1211056-quality-task-entry-browser-proof.js > evidence/task-entry-browser.json
          jq -e '.pass==true' evidence/source-start-browser.json
          jq -e '.pass==true' evidence/disclosure-browser.json
          jq -e '.pass==true' evidence/active-task-browser.json
          jq -e '.pass==true' evidence/task-entry-browser.json

      - name: Build candidate
        run: |
          set -Eeuo pipefail
          python3 target/.github/release/build-ops-package.py --source target --output "$RUNNER_TEMP/vf-tools-ops_V1.21.1059.zip" > evidence/package.json
          unzip -tq "$RUNNER_TEMP/vf-tools-ops_V1.21.1059.zip" >/dev/null

      - name: Seal evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          def readj(p):
              p=Path(p)
              if not p.exists(): return {}
              try:return json.loads(p.read_text())
              except Exception:return {}
          start=readj('evidence/source-start-browser.json')
          disclosure=readj('evidence/disclosure-browser.json')
          active=readj('evidence/active-task-browser.json')
          entry=readj('evidence/task-entry-browser.json')
          pkg=readj('evidence/package.json')
          proof={
            'schema':'vf-s01-c02-quality-capability-runtime-proof/v1',
            'source_sha':'c4ce5ccdc07e77caac3606823922ec0853b96fbd',
            'source_tree':'d48f559f14be4414be92afe23e02a461ba89b775',
            'version':'1.21.1059',
            'contracts':'PASS' if Path('evidence/php-lint-style.txt').exists() and Path('evidence/php-lint-runtime.txt').exists() else 'NOT_PROVEN',
            'browser_source_start':'PASS' if start.get('pass') is True else 'NOT_PROVEN',
            'browser_disclosure_regression':'PASS' if disclosure.get('pass') is True else 'NOT_PROVEN',
            'browser_active_task_regression':'PASS' if active.get('pass') is True else 'NOT_PROVEN',
            'browser_task_entry_regression':'PASS' if entry.get('pass') is True else 'NOT_PROVEN',
            'asset_sha256':pkg.get('asset_sha256',''),
            'asset_bytes':pkg.get('asset_bytes',0),
            'runtime_files':pkg.get('runtime_files',0),
            'runtime_fingerprint':pkg.get('runtime_fingerprint',''),
            'production':'NOT_TOUCHED',
            'owner_product_pass':False
          }
          keys=['contracts','browser_source_start','browser_disclosure_regression','browser_active_task_regression','browser_task_entry_regression']
          proof['status']='PASS' if all(proof[k]=='PASS' for k in keys) and proof['asset_sha256'] else 'FAIL'
          Path('evidence/FINAL_EVIDENCE.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(proof,ensure_ascii=False))
          if proof['status']!='PASS': raise SystemExit(1)
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-1211059-quality-runtime-evidence
          path: evidence/
          retention-days: 30
