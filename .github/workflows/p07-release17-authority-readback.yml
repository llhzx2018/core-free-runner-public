name: P07 Release17 Authority Readback Exact-source Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-release17-authority-readback.yml'

permissions:
  contents: read

jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify private read token
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact private authority candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 96755f4e27fe52010ce0e408ed48e05c4b612ce6
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Release17 authority readback
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '96755f4e27fe52010ce0e408ed48e05c4b612ce6'
          test "$(cat BUILD_ID)" = '0.1.0-release17'
          python3 -m json.tool docs/authority/P07_INTEGRATION_MANIFEST.json >/dev/null

          grep -Fq 'Slot 3 CloudPanel Ops                = 0.1.0-release17' docs/authority/CURRENT.md
          grep -Fq 'Public Distribution                   = 7240858005bc29bb4a705a95ab1e8126862c940c' docs/authority/CURRENT.md
          grep -Fq 'Release17 Distribution Gate           36811305606 PASS' docs/authority/CURRENT.md
          grep -Fq 'Production exact independently proven Slot 3 Build  0.1.0-release14' docs/authority/CURRENT.md
          grep -Fq 'release17 Production install                    NOT_YET_OWNER_VERIFIED' docs/authority/CURRENT.md

          grep -Fq '| B49 | Restore-As Direct Local HTTP Probe |' docs/authority/ACCEPTANCE_MATRIX.md
          grep -Fq 'PUBLIC_DISTRIBUTED' docs/authority/ACCEPTANCE_MATRIX.md
          grep -Fq 'RELEASE17_OWNER_REAL_USE_PENDING' docs/authority/ACCEPTANCE_MATRIX.md

          python3 - <<'PY'
          import json
          p=json.load(open('docs/authority/P07_INTEGRATION_MANIFEST.json',encoding='utf-8'))
          slot3=next(x for x in p['slots'] if x['slot']==3)
          assert slot3['internal_version']=='0.1.0-release17'
          assert slot3['source_main_commit']=='3b115516f52f61d535606d89fefbb9877afbf3ef'
          assert slot3['local_route_probe_contract']=='NO_PROXY_LOOPBACK_BOUNDED_RETRY_V1'
          assert slot3['local_route_failure_classification']=='TARGET_VHOST_PRESENT_OR_MISSING_V1'

          release=p['release']
          assert release['slot3_build']=='0.1.0-release17'
          assert release['slot3_source_main_commit']=='3b115516f52f61d535606d89fefbb9877afbf3ef'
          assert release['public_distribution_commit']=='7240858005bc29bb4a705a95ab1e8126862c940c'
          assert release['current_public_main_commit']=='7240858005bc29bb4a705a95ab1e8126862c940c'
          assert release['runtime_manifest_blob']=='a783b1cbdb9473ea73cf263d0a7b2b798c9c8b3d'
          assert release['overlay_manifest_blob']=='40f8d364c92a25ebcddf70146a32e1d980b6c311'
          assert release['final_installer_blob']=='d988fcb80e1c196254d0e8a1ae66f2244ea64867'
          assert release['stable_installer_blob']=='12fcc03c7818487b1c19be0fd096e0b49ae6f71c'
          assert release['toolbox_blob']=='b1928d11294b7103d6ae9ab44051812f45d49f51'

          prod=p['production']
          assert prod['slot3_build']=='0.1.0-release14'
          assert prod['release16_restore_evidence']['status']=='REAL_FAIL_LOCAL_HTTP_ROUTE'
          assert prod['release17_install_status']=='NOT_YET_OWNER_VERIFIED'
          assert prod['release17_owner_real_use']=='PENDING'
          assert prod['migration_executed'] is False
          assert prod['dns_write'] is False
          assert prod['source_delete'] is False
          assert prod['resource_safe_apply_run'] is False
          assert 'source_candidate' not in p
          PY

      - name: Secret boundary
        working-directory: source
        run: |
          set -Eeuo pipefail
          python3 scripts/secret_scan.py --root docs

      - name: Result
        if: always()
        run: |
          echo 'P07_RELEASE17_AUTHORITY_SOURCE=96755f4e27fe52010ce0e408ed48e05c4b612ce6'
          echo 'P07_PRODUCTION_WRITE=NOT_RUN'
