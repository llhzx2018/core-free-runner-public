name: P05 Classic Retirement Phase2 R4 Exact Gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p05-classic-retirement-phase2-r4-gate.yml'
permissions:
  contents: read
jobs:
  gate:
    if: github.event.pull_request.head.ref == 'test/p05-classic-retirement-phase2-r4-20260902'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vf_seo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vf_seo
    steps:
      - name: Verify private read capability
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
      - name: Checkout exact Product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: 1287e8560c59b15a349c1cb020fa4167fa6ef3e5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source and physical retirement
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '1287e8560c59b15a349c1cb020fa4167fa6ef3e5'
          test "$(git rev-parse HEAD^{tree})" = '21e6602dbcbd04e44f9101ad83f8ad674bcd7d25'
          test "$(cat VERSION)" = '1.2.3'
          for file in \
            src/client/App.tsx \
            src/client/DemoDatasetShortcut.tsx \
            src/client/GlobalSearchSurface.tsx \
            src/client/ProductWorkspaceShortcut.tsx \
            tests/unit/classic-keyword-trend-coverage.test.ts \
            tests/unit/classic-nullable-metric-truth.test.ts \
            tests/unit/classic-overview-loading.test.ts \
            tests/unit/classic-truth-states.test.ts \
            tests/unit/global-search-truth.test.ts; do
            test ! -e "$file"
          done
          test -e src/client/product-metric-truth.ts
          test -e tests/unit/product-metric-truth.test.ts
          grep -q "from './product-metric-truth'" src/client/ProductApp.tsx
          grep -q "clientTsxFiles" scripts/security-gate.mjs
          ! grep -RIn -E "from ['\"]\./App['\"]|ProductWorkspaceShortcut|DemoDatasetShortcut|GlobalSearchSurface|返回经典工作区|新版工作区 Preview" src/client/main.tsx src/client/ProductApp.tsx
          echo 'P05_CLASSIC_RETIREMENT_R4_SOURCE=PASS'
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Full engineering and security regression
        run: |
          set -Eeuo pipefail
          npm ci
          npm run lint
          npm run typecheck
          npm run migrate
          npm run verify:schema
          npm test
          npm run build
          npm run source:gate
          npm run scope:gate
          npm run dependency:gate
          npm audit --audit-level=high
          npm run security:gate
      - name: Exact Product truth seal
        run: |
          set -Eeuo pipefail
          node --import tsx --test tests/unit/product-metric-truth.test.ts tests/contract/single-product-shell.test.ts tests/unit/product-preview-loading.test.ts tests/contract/common-system-human-ui.test.ts
          test "$(git rev-parse HEAD)" = '1287e8560c59b15a349c1cb020fa4167fa6ef3e5'
          test "$(git rev-parse HEAD^{tree})" = '21e6602dbcbd04e44f9101ad83f8ad674bcd7d25'
          echo 'P05_CLASSIC_RETIREMENT_R4_EXACT_SEAL=PASS'
          echo 'P05_CLASSIC_RETIREMENT_RELEASE_WRITE=0'
          echo 'P05_CLASSIC_RETIREMENT_PRODUCTION_WRITE=0'
