name: p01-admin-page1-polish-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-admin-page1-polish-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      BASE_SHA: 63aece29b7562a800d6771a1479bcfc9faa26cab
      TARGET_SHA: 91a5dfd3f2339b0fd9a5784bfe637b862cde1743
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact P01 sources
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          for name in baseline current; do
            git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "$name"
          done
          git -C baseline fetch -q --depth 1 origin "$BASE_SHA"
          git -C baseline checkout -q --detach FETCH_HEAD
          git -C current fetch -q --depth 1 origin "$TARGET_SHA"
          git -C current checkout -q --detach FETCH_HEAD
          test "$(git -C baseline rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C current rev-parse HEAD)" = "$TARGET_SHA"
          echo P01_ADMIN_PAGE1_EXACT_SOURCE=PASS

      - name: Verify bounded five-file diff
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C current fetch -q --depth 1 origin "$BASE_SHA"
          git -C current diff --name-only "$BASE_SHA" "$TARGET_SHA" | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          src/assets/admin-consolidation.css
          src/manage.php
          tests/unit/admin_overview_actionable_health_contract.php
          tests/unit/admin_overview_ia_contract.php
          tests/unit/admin_overview_page1_polish_contract.php
          EOF
          sed -i 's/^          //' /tmp/expected.txt
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          test "$(tr -d '\r\n ' < current/VERSION)" = "2.47.42"
          echo P01_ADMIN_PAGE1_BOUNDED_DIFF=PASS

      - name: Lint and focused Overview contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l current/src/manage.php
          tests=(
            tests/unit/admin_overview_actionable_health_contract.php
            tests/unit/admin_overview_ia_contract.php
            tests/unit/admin_overview_r20_contract.php
            tests/unit/admin_overview_r29_special_capabilities_contract.php
            tests/unit/admin_overview_page1_polish_contract.php
          )
          for t in "${tests[@]}"; do
            php -l "current/$t"
            php "current/$t"
          done
          echo P01_ADMIN_PAGE1_FOCUSED=PASS

      - name: Canonical zero-debt guard
        shell: bash
        run: |
          set -Eeuo pipefail
          bash current/tests/canonical_release_regression.sh current baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -q '^P01_CANONICAL_CURRENT_FAILURE_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_NEW_REGRESSION_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_UNIT_REGRESSION=PASS$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS$' /tmp/canonical.txt
          echo P01_ADMIN_PAGE1_CANONICAL=PASS
