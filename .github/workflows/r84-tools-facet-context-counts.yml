name: R84 Focused Tools Facet Context Count Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r84-tools-facet-context-counts.yml'

permissions:
  contents: read

jobs:
  r84-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: 4d3c7b46fe42419f0e88ef5b786be1a48030e1d2
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 4d3c7b46fe42419f0e88ef5b786be1a48030e1d2
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Exact source and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.47.0'
          php -l tests/unit/tools_facet_context_count_contract.php
          php tests/unit/tools_facet_context_count_contract.php
          php tests/unit/sidebar_context_count_contract.php
          php tests/unit/scope_context_count_contract.php
          php tests/unit/software_os_context_count_contract.php
          php tests/unit/watch_year_genre_zero_result_contract.php
          echo R84_TOOLS_FACET_CONTEXT_COUNT_PASS
          echo R84_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/vf-start"
