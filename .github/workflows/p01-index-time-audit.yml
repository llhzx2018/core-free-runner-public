name: P01 Index Time Audit

on:
  push:
    branches:
      - vf-agent-operations-v1
    paths:
      - '.github/workflows/p01-index-time-audit.yml'
      - 'requests/p01-index-time-audit-*.txt'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact P01 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 0bfa4e4c51d71b6f4c7746ab0b7b3afd57138f03
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          path: p01
      - name: Locate browser-local formatters
        shell: bash
        run: |
          set -euo pipefail
          grep -nE 'toLocale(String|DateString|TimeString)' p01/src/index.php || true
          echo INDEX_TIME_AUDIT_COMPLETE
