name: p01-all-resources-visual-r3-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-all-resources-visual-r3-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      BASE_SHA: 41d4253b8439deb098a44db6aa25acb94cc5ce93
      TARGET_SHA: 7b06d75778ab3bce24ebda3dbb877c120504f2cd
    steps:
      - name: Checkout exact P01 sources
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          for name in baseline current; do
            git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "$name"
          done
          git -C baseline fetch -q --depth 1 origin "$BASE_SHA"
          git -C baseline checkout -q --detach FETCH_HEAD
          git -C current fetch -q --depth 1 origin "$TARGET_SHA"
          git -C current checkout -q --detach FETCH_HEAD
          test "$(tr -d '\r\n ' < current/VERSION)" = "2.47.45"
          echo P01_ALL_RESOURCES_R3_EXACT_SOURCE=PASS

      - name: Verify bounded four-file diff
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C current fetch -q --depth 1 origin "$BASE_SHA"
          git -C current diff --name-only "$BASE_SHA" "$TARGET_SHA" | sort >/tmp/actual.txt
          cat >/tmp/expected.txt <<'EOF'
          src/assets/admin-resource-manager.css
          src/surface-manager.php
          tests/unit/admin_all_resources_page3_polish_contract.php
          tests/unit/admin_all_resources_visual_alignment_r3_contract.php
          tests/unit/admin_core_pages_1_3_consistency_closure_contract.php
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          echo P01_ALL_RESOURCES_R3_BOUNDED_DIFF=PASS

      - name: Focused UX contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l current/src/surface-manager.php
          tests=(
            tests/unit/admin_all_resources_visual_alignment_r3_contract.php
            tests/unit/admin_all_resources_alignment_r2_contract.php
            tests/unit/admin_all_resources_page3_polish_contract.php
            tests/unit/admin_resource_browse_edit_r5_contract.php
            tests/unit/resource_manager_pagination_context_contract.php
            tests/unit/admin_core_pages_1_3_consistency_closure_contract.php
          )
          for t in "${tests[@]}"; do
            php -l "current/$t"
            php "current/$t"
          done
          echo P01_ALL_RESOURCES_R3_FOCUSED=PASS

      - name: Canonical zero-debt guard
        shell: bash
        run: |
          set -Eeuo pipefail
          bash current/tests/canonical_release_regression.sh current baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -q '^P01_CANONICAL_CURRENT_FAILURE_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_NEW_REGRESSION_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_LEGACY_TEST_DEBT_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS$' /tmp/canonical.txt
          echo P01_ALL_RESOURCES_R3_CANONICAL=PASS
