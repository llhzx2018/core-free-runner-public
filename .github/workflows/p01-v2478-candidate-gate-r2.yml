name: P01 V2.47.8 Candidate Gate R2

on:
  pull_request:
    paths:
      - '.github/workflows/p01-v2478-candidate-gate-r2.yml'

permissions:
  contents: read

concurrency:
  group: p01-v2478-candidate-gate-r2
  cancel-in-progress: false

jobs:
  candidate:
    if: github.head_ref == 'temp/p01-v2478-candidate-gate-r2-20260911'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      ENGINEERING_SHA: 633b796dbb998347430f68f153183cc7ddb227ab
      TARGET_BRANCH: release/v2.47.8-candidate-20260911
      SOURCE_TAG: v2.47.7
      SOURCE_SHA: 10b5946e63b4ab3f48f5c7abd7b5decb065312d0
      SOURCE_VERSION: 2.47.7
      TARGET_VERSION: 2.47.8
      EXPECTED_SCHEMA: '2026090401'
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Exact authority and safe takeover of empty candidate ref
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN" && test -n "$RELEASE_TOKEN"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$ENGINEERING_SHA"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/${SOURCE_TAG}" --jq '.object.sha')" = "$SOURCE_SHA"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')" = "$ENGINEERING_SHA"
          test "$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${PRODUCT_REPO}" --jq '.permissions.push')" = true
          echo OWNER_PREVIEW_RUNTIME_APPLICABILITY=N_A
          echo P01_V2478_R2_AUTHORITY=PASS

      - name: Checkout exact engineering source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.ENGINEERING_SHA }}
          token: ${{ env.RELEASE_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: vf-start

      - name: Create exact V2.47.8 candidate
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$ENGINEERING_SHA"
          test "$(tr -d '\r\n ' < VERSION)" = "$SOURCE_VERSION"
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = "$SOURCE_VERSION"
          grep -Fq "define('VF_VERSION', '${SOURCE_VERSION}');" src/app/bootstrap.php
          printf '%s\n' "$TARGET_VERSION" > VERSION
          printf '%s\n' "$TARGET_VERSION" > src/VERSION.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/bootstrap.php'); s=p.read_text(encoding='utf-8')
          old="define('VF_VERSION', '2.47.7');"; new="define('VF_VERSION', '2.47.8');"
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          p=Path('CHANGELOG.md'); s=p.read_text(encoding='utf-8')
          prefix='''# V2.47.8\n\n- R23：首页从空概览重构为真实个人工作台，使用现有 Authority 汇总资源、待整理、网址待查、快速操作、8 个模块和最近操作；桌面/手机使用独立密度模型。\n- 修复在线升级页长期打开后 CSRF Token 过期导致“检查更新失败”：仅对同源 updater POST 在 419 时刷新当前会话 Token，并最多自动重试一次，不降低 CSRF 校验。\n- 保持右上角账户区、导航分类侧栏边界、canonical storage、认证语义与隐私边界不变。\n- Schema 仍为 `2026090401`，Migration `NONE`；V2.47.8 只允许正式验证的 `2.47.7 → 2.47.8` 单跳在线更新。\n\n'''
          assert not s.startswith('# V2.47.8\n')
          p.write_text(prefix+s,encoding='utf-8')
          PY
          mkdir -p docs/release
          cat > docs/release/V2.47.8_RELEASE_GATE.md <<'EOF'
          # P01 · V2.47.8 Release Gate

          ## Owner Preview Applicability

          `OWNER_PREVIEW_RUNTIME_APPLICABILITY = N_A`

          Reason: the Owner supplied the live V2.47.7 Home screenshot, explicitly rejected the empty-home shape, reviewed a concrete R23 workbench plan (real summary, attention + quick actions, eight module entries, denser recent work, responsive density), and then explicitly instructed continuation. P01 has no separate supported preview runtime, while its installed updater intentionally rejects GitHub prerelease assets; forcing a separate prerelease runtime would require a new distribution mechanism solely for preview. V2.47.8 stays on the already-proven reversible one-hop updater with backup/rollback. Owner real-use after manual upgrade remains authoritative and can still reject the result.

          This N_A does not waive machine evidence. Exact Candidate Fresh Install, authenticated desktop/mobile Home geometry, CSRF 419 recovery, strict one-hop UPDATE, data preservation, backup/rollback, Security and remote byte readback remain required.

          ## Public Authority Applicability

          | Domain | State | Release obligation |
          |---|---|---|
          | INSTALL | REQUIRED | Clean FULL, setup/admin init/login/setup lock |
          | SECURITY | REQUIRED | CSRF remains fail-closed; recovery only refreshes current-session token after 419; package safety |
          | TESTING | REQUIRED | syntax, contracts, runtime, browser, install and update evidence |
          | UPGRADE | REQUIRED | strict 2.47.7 → 2.47.8 Atomic update, backup/rollback/readback |
          | DATA_SCHEMA | REQUIRED | existing SQLite preserved; schema 2026090401 unchanged; no user data in packages |
          | API_PROVIDER | N_A | no provider/API capability change |
          | SEO | N_A | no public indexing/metadata change |
          | CRON_JOB | N_A | no scheduler/background-job change |
          | NOTIFICATION | N_A | no notification capability change |
          | OBSERVABILITY | N_A | no Production write in this release gate |
          | PERFORMANCE | N_A | no capacity-sensitive change |
          | GIT | REQUIRED | exact source, candidate, tag/release/remote readback |
          | UA_UI | REQUIRED | R23 desktop/mobile Home density plus existing persistent account area |

          ## Stable Product Boundary

          - Schema: `2026090401 → 2026090401`
          - Migration: `NONE`
          - Canonical data/storage authority: unchanged
          - Update route: strict one-hop `2.47.7 → 2.47.8`
          - Production: separate; Release/Distribution do not claim installed Production
          EOF
          git config user.name 'VF Release Runner'
          git config user.email 'vf-release-runner@users.noreply.github.com'
          git checkout -B "$TARGET_BRANCH"
          git add VERSION src/VERSION.txt src/app/bootstrap.php CHANGELOG.md docs/release/V2.47.8_RELEASE_GATE.md
          git commit -m 'release(P01): prepare V2.47.8 candidate'
          CANDIDATE_SHA=$(git rev-parse HEAD)
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${PRODUCT_REPO}.git"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${ENGINEERING_SHA}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')" = "$CANDIDATE_SHA"
          echo "P01_V2478_CANDIDATE_SHA=$CANDIDATE_SHA"

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Exact identity and static contracts
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n ' < VERSION)" = "$TARGET_VERSION"
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = "$TARGET_VERSION"
          grep -Fq "define('VF_VERSION', '${TARGET_VERSION}');" src/app/bootstrap.php
          test "$(php -r '$p=json_decode(file_get_contents("VF_PROJECT.json"),true); echo $p["working_schema_version"];')" = "$EXPECTED_SCHEMA"
          mapfile -t changed < <(git diff --name-only "$ENGINEERING_SHA"..HEAD | sort)
          printf '%s\n' "${changed[@]}" >/tmp/changed
          printf '%s\n' CHANGELOG.md VERSION docs/release/V2.47.8_RELEASE_GATE.md src/VERSION.txt src/app/bootstrap.php >/tmp/expected
          diff -u /tmp/expected /tmp/changed
          find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          php tests/unit/home_page_full_polish_contract.php | grep -Fx 'P01_HOME_PAGE_FULL_POLISH_CONTRACT=PASS'
          php tests/unit/home_recent_operations_signal_contract.php | grep -Fx 'P01_HOME_RECENT_OPERATIONS_SIGNAL_CONTRACT=PASS'
          php tests/unit/global_account_actions_contract.php | grep -Fx 'P01_R22_GLOBAL_ACCOUNT_ACTIONS_CONTRACT=PASS'
          php tests/unit/update_csrf_recovery_contract.php | grep -Fx 'P01_UPDATE_CSRF_RECOVERY_CONTRACT=PASS'
          echo P01_V2478_STATIC=PASS

      - name: Fresh install and canonical seed
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v2478-runtime /tmp/p01-v2478-pw
          cp -a src /tmp/p01-v2478-runtime
          cd /tmp/p01-v2478-runtime
          php -S 127.0.0.1:18128 -t . >/tmp/p01-v2478-server.log 2>&1 & echo $! >/tmp/p01-v2478-server.pid
          for i in $(seq 1 30); do if curl -fsS -c /tmp/p01-v2478.cookies -b /tmp/p01-v2478.cookies http://127.0.0.1:18128/setup.php -o /tmp/p01-v2478-setup.html; then break; fi; sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v2478-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          PASS="Gate${GITHUB_RUN_ID}V2478x"; printf '%s' "$PASS" >/tmp/p01-v2478.password
          curl -fsS -L -c /tmp/p01-v2478.cookies -b /tmp/p01-v2478.cookies -X POST http://127.0.0.1:18128/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF Start V2478 Gate' --data-urlencode "admin_password=$PASS" --data-urlencode "admin_password_confirm=$PASS" -o /tmp/p01-v2478-post.html
          php cli/verify.php | grep -Fx 'VERIFY_PASS=YES'
          code=$(curl -sS -o /tmp/revisit -D /tmp/revisit.h -w '%{http_code}' http://127.0.0.1:18128/setup.php); test "$code" = 302
          tr -d '\r' </tmp/revisit.h | grep -Eiq '^Location: /$'
          php -r 'require "app/bootstrap.php"; require "app/SurfaceRepository.php"; $r=new VfRepository(vf_db()); $r->createCategory(["name"=>"V2478 Gate Category","is_private"=>true,"sort_order"=>0]); $x=$r->savePendingCapture(["url"=>"https://example.com/v2478-home-gate","title"=>"V2478 Home Gate Resource"],"mobile-quick-save"); if(empty($x["id"])) exit(2); echo "P01_V2478_SEED=PASS\n";'
          echo P01_V2478_INSTALL=PASS

      - name: Authenticated Home and CSRF recovery browser proof
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-v2478-pw && cd /tmp/p01-v2478-pw
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > verify.mjs <<'JS'
          import {chromium} from 'playwright';import fs from 'node:fs';
          const base='http://127.0.0.1:18128/',password=fs.readFileSync('/tmp/p01-v2478.password','utf8');
          const browser=await chromium.launch({headless:true});const ctx=await browser.newContext({viewport:{width:1291,height:797}});const p=await ctx.newPage();
          await p.goto(base+'start.php',{waitUntil:'networkidle'});await p.click('.vf-global-account-actions [data-vf-auth-login]');await p.fill('[data-vf-auth-dialog] input[name="password"]',password);await p.click('[data-vf-auth-submit]');await p.waitForSelector('.vf-global-account-actions a[href="settings.php"]',{timeout:15000});
          await p.goto(base+'home.php',{waitUntil:'networkidle'});await p.waitForSelector('#vfHomeModulesTitle');
          const d=await p.evaluate(()=>{const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)],r=s=>q(s)?.getBoundingClientRect()||null,mods=qa('.vf-home-module').map(x=>x.getBoundingClientRect()),account=q('.vf-global-account-actions')?.getBoundingClientRect();return{h1:q('.vf-home-command-head h1')?.textContent.trim(),summary:qa('.vf-home-summary>a').map(x=>x.textContent.replace(/\s+/g,'')),quick:qa('.vf-home-quick-grid>a,.vf-home-quick-grid>button').length,mods:mods.map(x=>({top:x.top,width:x.width})),focus:r('.vf-home-focus')?.width,quickW:r('.vf-home-quick')?.width,accountRight:account?.right,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}});
          const row=d.mods.filter(x=>Math.abs(x.top-d.mods[0].top)<2).length;if(d.h1!=='今天从这里开始'||d.summary.length!==3||d.quick!==4||d.mods.length!==8||row!==4||d.focus<=d.quickW||d.accountRight<1260||d.overflow>1)throw new Error('desktop '+JSON.stringify(d));
          await p.goto(base+'update.php',{waitUntil:'networkidle'});const events=[];p.on('response',r=>{const u=r.url();if(u.includes('api.php?action=update_check')||u.includes('api.php?action=bootstrap'))events.push({u,status:r.status()});});
          const recovery=await p.evaluate(async()=>{const r=await fetch('api.php?action=update_check',{method:'POST',headers:{'Accept':'application/json','X-CSRF-Token':'definitely-stale-v2478'},credentials:'same-origin'});let data=null;try{data=await r.json()}catch(e){}return{status:r.status,ok:!!(data&&data.ok)}});await p.waitForTimeout(400);
          if(recovery.status!==200||!events.some(x=>x.u.includes('action=update_check')&&x.status===419)||!events.some(x=>x.u.includes('action=bootstrap')&&x.status===200)||!events.some(x=>x.u.includes('action=update_check')&&x.status===200))throw new Error('csrf '+JSON.stringify({recovery,events}));
          await p.setViewportSize({width:390,height:844});await p.goto(base+'home.php',{waitUntil:'networkidle'});const m=await p.evaluate(()=>{const qa=s=>[...document.querySelectorAll(s)],mods=qa('.vf-home-module').map(x=>x.getBoundingClientRect()),account=document.querySelector('.vf-global-account-actions')?.getBoundingClientRect();return{mods:mods.map(x=>({top:x.top,width:x.width})),touch:qa('.vf-home-mobile-command form,.vf-home-mobile-command>a').map(x=>x.getBoundingClientRect().height),accountRight:account?.right,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}});const mrow=m.mods.filter(x=>Math.abs(x.top-m.mods[0].top)<2).length;if(mrow!==2||m.touch.length<2||m.touch.some(h=>h<43.5)||m.accountRight<375||m.overflow>1)throw new Error('mobile '+JSON.stringify(m));
          console.log('P01_V2478_BROWSER='+JSON.stringify({desktop:d,csrf:{recovery,events},mobile:m}));await browser.close();
          JS
          node verify.mjs | tee /tmp/p01-v2478-browser
          grep -F 'P01_V2478_BROWSER=' /tmp/p01-v2478-browser
          echo P01_V2478_BROWSER_GATE=PASS

      - name: Final verdict
        run: |
          echo PUBLIC_AUTHORITY_INSTALL=PASS
          echo PUBLIC_AUTHORITY_SECURITY=PASS
          echo PUBLIC_AUTHORITY_TESTING=PASS
          echo PUBLIC_AUTHORITY_GIT=PASS
          echo PUBLIC_AUTHORITY_UA_UI=PASS
          echo PUBLIC_AUTHORITY_UPGRADE=PENDING_ARTIFACT_GATE
          echo PUBLIC_AUTHORITY_DATA_SCHEMA=PENDING_ARTIFACT_GATE
          echo OWNER_PREVIEW_RUNTIME_APPLICABILITY=N_A
          echo OWNER_REAL_USE=POST_RELEASE_PENDING
          echo P01_V2478_CANDIDATE_GATE=PASS
          echo FORMAL_RELEASE=false
          echo PRODUCTION=false

      - name: Cleanup
        if: always()
        run: |
          if test -f /tmp/p01-v2478-server.pid; then kill "$(cat /tmp/p01-v2478-server.pid)" 2>/dev/null || true; fi
          rm -rf vf-start /tmp/p01-v2478-* /tmp/changed /tmp/expected /tmp/php-lint
