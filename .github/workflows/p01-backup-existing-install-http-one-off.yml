name: p01-backup-existing-install-http-one-off
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-backup-existing-install-http-one-off.yml'
permissions:
  contents: read
concurrency:
  group: p01-backup-http-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  http:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      EXPECTED_SHA: b53dd9ff78d0e846ea3ee64ad399da67f9a4ef69
    steps:
      - name: Checkout public temporary control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision PHP SQLite with required app extensions
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd unzip >/dev/null
          php -m | grep -i -Fx pdo_sqlite
          echo P01_EXISTING_SITE_RUNNER_RUNTIME=PASS
      - name: Read exact P01 candidate privately, ephemeral workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: b53dd9ff78d0e846ea3ee64ad399da67f9a4ef69
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Read formal stable baseline source privately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: v2.47.384
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: stable
          persist-credentials: false
          fetch-depth: 1
      - name: Run existing-site source upgrade and reset HTTP E2E on synthetic data
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = 2.47.384
          bash -n candidate/tests/integration/p01_backup_baseline_existing_install_http.sh
          bash candidate/tests/integration/p01_backup_baseline_existing_install_http.sh candidate stable
          echo P01_EXISTING_SITE_HTTP_MACHINE=PASS
      - name: Remove all transient private checkouts
        if: always()
        shell: bash
        run: rm -rf candidate stable
