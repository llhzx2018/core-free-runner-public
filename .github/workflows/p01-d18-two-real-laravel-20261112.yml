name: P01 D18 two exact-source real Laravel FULL bundles isolated switch
on:
  push:
    branches:
      - test/p01-d18-two-real-laravel-20261112
permissions:
  contents: read
jobs:
  d18-real-bundles:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Verify public-safe registered runner identity
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-d18-two-real-laravel-20261112"
          echo P01_D18_FIXTURES=SYNTHETIC_ONLY
      - name: Verify private exact-source checkout capability
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo P01_D18_PRIVATE_READ=AVAILABLE
      - name: Checkout actual immutable baseline product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 2cd0f6d13927a5abf0db1e79be3e8dacf3ad01ea
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: before
      - name: Checkout exact new D18 product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 86674d52b079fbe4bcc39de2edb3761a6b6d0d2d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Source identity and native PHP lint
        run: |
          set -Eeuo pipefail
          test "$(git -C before rev-parse HEAD)" = "2cd0f6d13927a5abf0db1e79be3e8dacf3ad01ea"
          test "$(git -C candidate rev-parse HEAD)" = "86674d52b079fbe4bcc39de2edb3761a6b6d0d2d"
          test "$(cat before/VERSION)" = "2.47.515"
          test "$(cat candidate/VERSION)" = "2.47.515"
          php -l candidate/src/app/next/runtime/IsolatedRealLaravelRollout.php
          php -l candidate/src/app/next/runtime/WriteGate.php
          php -l candidate/tests/compatibility/p01_d18_two_real_laravel_bundles.php
          echo P01_D18_TWO_EXACT_SOURCE_COMMITS=2cd0f6d13927a5abf0db1e79be3e8dacf3ad01ea:$(git -C candidate rev-parse HEAD)
      - name: Prepare isolated Composer/CLI environment used only by build
        run: |
          set -Eeuo pipefail
          if ! command -v composer >/dev/null || ! php -r 'exit(PHP_VERSION_ID>=80300 && extension_loaded("pdo_sqlite") ? 0 : 1);'; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq composer unzip php8.3-cli php8.3-sqlite3 php8.3-mbstring php8.3-xml php8.3-curl >/dev/null
          fi
          php -r 'exit(PHP_VERSION_ID>=80300?0:1);'
          echo P01_D18_BUILD_DEPENDENCIES_READY=YES
      - name: Build two immutable complete real Laravel ZIP packages, then reboot and rollback
        run: |
          set -Eeuo pipefail
          umask 077
          root="/tmp/p01-d18-sandbox-$(openssl rand -hex 8)"
          cleanup() {
            rm -rf -- "$root" /tmp/p01-d18-before.zip /tmp/p01-d18-candidate.zip
          }
          trap cleanup EXIT
          mkdir -m 0700 -- "$root"
          mkdir -m 0700 -- "$root/private" "$root/private/state" "$root/private/recovery" "$root/private/data" "$root/private/media" "$root/releases"
          python3 before/scripts/build_p01_next_clean_full.py build --source-sha 2cd0f6d13927a5abf0db1e79be3e8dacf3ad01ea --output /tmp/p01-d18-before.zip
          python3 candidate/scripts/build_p01_next_clean_full.py build --source-sha 86674d52b079fbe4bcc39de2edb3761a6b6d0d2d --output /tmp/p01-d18-candidate.zip
          python3 before/scripts/build_p01_next_clean_full.py verify --zip /tmp/p01-d18-before.zip
          python3 candidate/scripts/build_p01_next_clean_full.py verify --zip /tmp/p01-d18-candidate.zip
          test ! -e "$root/private/state/installation.sealed.json"
          mkdir -m 0700 -- "$root/releases/2cd0f6d13927a5abf0db1e79be3e8dacf3ad01ea" "$root/releases/86674d52b079fbe4bcc39de2edb3761a6b6d0d2d"
          python3 -m zipfile -e /tmp/p01-d18-before.zip "$root/releases/2cd0f6d13927a5abf0db1e79be3e8dacf3ad01ea"
          python3 -m zipfile -e /tmp/p01-d18-candidate.zip "$root/releases/86674d52b079fbe4bcc39de2edb3761a6b6d0d2d"
          test -f "$root/releases/2cd0f6d13927a5abf0db1e79be3e8dacf3ad01ea/vf-start-next/app/vendor/autoload.php"
          test -f "$root/releases/86674d52b079fbe4bcc39de2edb3761a6b6d0d2d/vf-start-next/app/vendor/autoload.php"
          echo P01_D18_TWO_REAL_COMPOSER_BUNDLES_STAGED=PASS
          php candidate/tests/compatibility/p01_d18_two_real_laravel_bundles.php "$root" 2cd0f6d13927a5abf0db1e79be3e8dacf3ad01ea 86674d52b079fbe4bcc39de2edb3761a6b6d0d2d
          echo P01_D18_REAL_CODE_ONLY_SWITCH_PROOF=PASS
      - name: Repeat previous D17/D15 code and lock source checks
        run: |
          set -Eeuo pipefail
          php candidate/tests/unit/p01_d17_isolated_code_switch_contract.php
          php candidate/tests/unit/p01_d15_write_gate_contract.php
          echo P01_D18_REGRESSIONS=PASS
      - name: Preserve formal readiness boundary
        run: |
          set -Eeuo pipefail
          echo P01_D18_FULL_READY=NO
          echo P01_D18_REAL_CLOUDPANEL_INSTALLED_STATE_UPGRADE=NOT_PROVEN
          echo P01_D18_SQL_MEDIA_PRODUCTION_ATOMIC_ROLLBACK=NOT_PROVEN
      - name: Clean up transient private product checkouts
        if: always()
        run: |
          rm -rf -- before candidate
          echo P01_D18_PRIVATE_SOURCE_PERSISTED=NO
