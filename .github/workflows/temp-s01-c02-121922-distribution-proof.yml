name: TEMP S01-C02 1.21.922 Distribution Proof

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  exact-distribution-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UPDATES_SHA: 75a8e28dafd50b23d689da17c24ddabd88e91e27
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      TAG: v1.21.922
      ASSET: vf-tools-ops_V1.21.922.zip

    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 75a8e28dafd50b23d689da17c24ddabd88e91e27
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: updates
          persist-credentials: false

      - name: Assert exact distribution source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$UPDATES_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("updates/projects/S01-C02.json").read_text())
          assert m["target_version"]=="1.21.922"
          assert m["release_tag"]=="v1.21.922"
          assert m["asset_name"]=="vf-tools-ops_V1.21.922.zip"
          assert m["asset_bytes"]==3494742
          assert m["asset_sha256"]=="fed9bdc48c850bee5415e0cee466613848ffec367ef512ad475c6f58d417d4fd"
          assert m["runtime_files"]==976
          assert m["runtime_fingerprint"]=="db8b0c3ae050f3ba676426e29da020c327afc7aeea529910a7f2d86d7fe87c8a"
          assert "1.21.921" in m["from_versions"]
          assert m["schema_from"]=="6.0.0" and m["schema_to"]=="6.0.0"
          assert m["backup_required"] is True
          assert m["rollback_supported"] is True
          print("S01-C02 manifest identity PASS")
          PY

      - name: Manifest contract audit
        shell: bash
        working-directory: updates
        run: python3 scripts/check_manifest_contract.py

      - name: PHP syntax
        shell: bash
        working-directory: updates
        run: find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Update Core V1 regression
        shell: bash
        working-directory: updates
        run: php update-core/php/tests/run.php

      - name: Formal release remote readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          JSON="$(gh api "repos/$PRODUCT_REPO/releases/tags/$TAG")"
          test "$(jq -r '.target_commitish' <<<"$JSON")" = "6fbb43ee302a5c88c2d446c0f8860ff0835b9de0"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$JSON")" = "3494742"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$JSON")" = "sha256:fed9bdc48c850bee5415e0cee466613848ffec367ef512ad475c6f58d417d4fd"
          echo "S01-C02 1.21.922 Distribution exact-source proof PASS"

      - name: Remove transient checkout
        if: always()
        shell: bash
        run: rm -rf updates

# synchronize distribution proof
