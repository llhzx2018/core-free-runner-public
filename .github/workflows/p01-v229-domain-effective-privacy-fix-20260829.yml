name: P01 V2.29 Domain Effective Privacy Fix

on:
  push:
    branches:
      - task/p01-v229-domain-effective-privacy-fix-20260829

permissions:
  contents: read

env:
  SOURCE_SHA: 03244e101fdc037954e7f7bc8054066439d53ba0

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact P01 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: feature/p01-domain-taxonomy-20260829
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Patch non-navigation effective privacy
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/SurfaceRepository.php')
          s=p.read_text(encoding='utf-8')
          old="            $link['surface'] = $surface;\n            $link['category_name'] = $surface === 'start' ? ($categoryNames[(int)($link['category_id'] ?? 0)] ?? '') : '';"
          new="            $link['surface'] = $surface;\n            if ($surface !== 'start') {\n                $link['category_private'] = 0;\n                $link['effective_private'] = (int)($link['is_private'] ?? 0) === 1 ? 1 : 0;\n            }\n            $link['category_name'] = $surface === 'start' ? ($categoryNames[(int)($link['category_id'] ?? 0)] ?? '') : '';"
          assert s.count(old)==1, 'surface privacy insertion point drifted'
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          php -l src/app/SurfaceRepository.php >/dev/null
          git diff --check
          test "$(git diff --name-only)" = "src/app/SurfaceRepository.php"
          grep -F "if ($surface !== 'start')" src/app/SurfaceRepository.php

      - name: Commit and push
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add src/app/SurfaceRepository.php
          git commit -m 'P01 V2.29 · Normalize non-navigation effective privacy'
          git push origin HEAD:feature/p01-domain-taxonomy-20260829
          echo "PATCH_SHA=$(git rev-parse HEAD)"
