name: P01 integrated frontend role UI test-only
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-frontend-integrated-test-only.yml'
permissions:
  contents: read
jobs:
  frontend-integrated:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact P01 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 282b9d4f69e87e3e6ceb0f642f5a331dd0ec3b07
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,mbstring,curl,zip,openssl
          coverage: none
      - name: Integrated owner/guest frontend logic regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "282b9d4f69e87e3e6ceb0f642f5a331dd0ec3b07"
          for file in index.php app/FunctionalWorkspaceCore.php app/FunctionalWorkspaceShell.php app/WorkspaceViewCatalog.php app/SubjectPageChrome.php app/ChannelLibraryPage.php app/WatchMediaLibraryPage.php app/TopicLibraryPage.php app/CourseLibraryPage.php app/ProjectActionCenterPage.php; do
            php -l "product/src/$file"
          done
          node --check product/src/assets/surface-home.js
          (cd product && node tests/unit/public_home_theme_search_parity_native.js)
          (cd product && node tests/unit/course_guest_owner_storage_isolation_native.js)
          for file in \
            public_home_shared_interaction_v247390_contract.php \
            public_home_owner_shell_unified_v247390_contract.php \
            public_global_nav_contract.php \
            public_brand_route_contract.php \
            public_home_visitor_discovery_v247390_contract.php \
            frontend_home_navigation_r2_contract.php \
            frontend_home_portal_contract.php \
            full_product_public_shared_rhythm_r1_contract.php \
            frontend_global_shell_r1_contract.php \
            home_page_full_polish_contract.php \
            frontend_shared_owner_guest_visibility_v247390_contract.php \
            navigation_page_visual_closure_contract.php \
            navigation_visibility_search_context_v247390_contract.php \
            channels_private_badge_sparse_state_v247390_contract.php \
            channels_guest_readonly_layout_v247390_contract.php \
            channels_page_full_polish_contract.php \
            watch_public_privacy_density_v247390_contract.php \
            watch_page_filter_hierarchy_contract.php \
            watch_page_full_polish_contract.php \
            topics_public_date_privacy_v247390_contract.php \
            topics_page_context_closure_contract.php \
            topics_v247158_inline_metadata_contract.php \
            course_guest_owner_storage_contract.php \
            course_continue_context_contract.php \
            course_reader_resume_visibility_contract.php \
            courses_page_full_polish_contract.php \
            course_markdown_reader_contract.php \
            projects_guest_zero_public_scope_v247390_contract.php \
            project_page_context_closure_contract.php \
            projects_dashboard_reframe_v247181_contract.php \
            project_state_language_contract.php \
            project_github_sync_v247177_contract.php; do
            php "product/tests/unit/$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          for file in ['product/src/assets/uxui-home-root.css','product/src/assets/frontend-mature.css']:
              css=Path(file).read_text()
              assert css.count('{') == css.count('}'),file
          print('P01_CROSS_PAGE_CSS_BALANCE=PASS')
          PY
          echo P01_FRONTEND_INTEGRATED_EXACT_SOURCE=PASS
      - name: Erase temporary checkout
        if: always()
        shell: bash
        run: rm -rf product
