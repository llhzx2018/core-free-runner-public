name: P02 R37 Grid Placement Ownership Write
on:
  push:
    branches: [run/p02-r37-grid-placement-ownership-write]
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-24.04
    env:
      BASE_REF: 61a46e5d704139ffdf5c1f0f0886a10a02983a9a
      EXPECTED_VERSION: '2.5.32'
      PORT: '18080'
    steps:
      - name: Checkout exact current develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.BASE_REF }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: product

      - name: Narrow notebook grid placement ownership
        working-directory: product
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          css_path=Path('public/assets/app.css')
          css=css_path.read_text(encoding='utf-8')
          old=("@media(min-width:901px){.notebook-list-pane{grid-column:1;grid-row:1}.notebook-resizer{grid-column:2;grid-row:1}.notebook-detail-scroll{grid-column:3;grid-row:1;min-width:0;width:auto}.notebook-pane-restore{grid-row:1}.notebook-layout.notebook-list-collapsed .notebook-detail-scroll{grid-column:3;grid-row:1;min-width:0;width:auto}}")
          new=("@media(min-width:901px){.notebook-layout:not(.notebook-editing)>.notebook-list-pane{grid-column:1;grid-row:1}.notebook-layout:not(.notebook-editing)>.notebook-resizer{grid-column:2;grid-row:1}.notebook-layout:not(.notebook-editing)>.notebook-detail-scroll{grid-column:3;grid-row:1;min-width:0;width:auto}.notebook-layout:not(.notebook-editing)>.notebook-pane-restore{grid-row:1}.notebook-layout.notebook-list-collapsed:not(.notebook-editing)>.notebook-detail-scroll{grid-column:3;grid-row:1;min-width:0;width:auto}}")
          if css.count(old)!=1:
              raise SystemExit(f'base grid placement block count={css.count(old)}')
          css=css.replace(old,new,1)

          # V2.5.2 remains responsible only for visibility; base V2.5.0 owns non-editing grid placement.
          old_pane=("  .notebook-layout:not(.notebook-list-collapsed):not(.notebook-focus):not(.notebook-editing) .notebook-list-pane{\n"
                    "    display:flex!important;\n"
                    "    grid-column:1;\n"
                    "    grid-row:1;\n"
                    "  }")
          new_pane=("  .notebook-layout:not(.notebook-list-collapsed):not(.notebook-focus):not(.notebook-editing) .notebook-list-pane{\n"
                    "    display:flex!important;\n"
                    "  }")
          old_res=("  .notebook-layout:not(.notebook-list-collapsed):not(.notebook-focus):not(.notebook-editing) .notebook-resizer{\n"
                   "    display:block!important;\n"
                   "    grid-column:2;\n"
                   "    grid-row:1;\n"
                   "  }")
          new_res=("  .notebook-layout:not(.notebook-list-collapsed):not(.notebook-focus):not(.notebook-editing) .notebook-resizer{\n"
                   "    display:block!important;\n"
                   "  }")
          if css.count(old_pane)!=1 or css.count(old_res)!=1:
              raise SystemExit(f'V2.5.2 duplicate placement counts pane={css.count(old_pane)} resizer={css.count(old_res)}')
          css=css.replace(old_pane,new_pane,1).replace(old_res,new_res,1)
          css='\n'.join(line.rstrip() for line in css.splitlines())+'\n'
          css_path.write_text(css,encoding='utf-8')

          identity_path=Path('docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json')
          identity=json.loads(identity_path.read_text(encoding='utf-8'))
          identity['convergence']['legacy_grid_placement_narrowed_to_non_editing']=True
          identity['convergence']['notebook_grid_placement_single_owner']=True
          identity['next_gate']='RUNTIME_STYLE_CONVERGENCE_AUDIT_AFTER_REAL_BROWSER_GEOMETRY_PASS'
          identity_path.write_text(json.dumps(identity,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          contract=[
            "import fs from 'node:fs';",
            "import assert from 'node:assert/strict';",
            "const css=fs.readFileSync('public/assets/app.css','utf8');",
            "const base='.notebook-layout:not(.notebook-editing)>.notebook-detail-scroll{grid-column:3;grid-row:1;min-width:0;width:auto}';",
            "assert.ok(css.includes(base),'non-editing detail grid placement owner missing');",
            "assert.ok(!css.includes('@media(min-width:901px){.notebook-list-pane{grid-column:1;grid-row:1}.notebook-resizer{grid-column:2;grid-row:1}.notebook-detail-scroll{grid-column:3'),'unscoped desktop grid placement remains');",
            "const v252Start=css.indexOf('/* V2.5.32 R27 consolidated source: v252-hotfix.css */');",
            "const v253Start=css.indexOf('/* V2.5.32 R27 consolidated source: v253-hotfix.css */',v252Start);",
            "assert.ok(v252Start>=0&&v253Start>v252Start,'V2.5.2 block missing');",
            "const v252=css.slice(v252Start,v253Start);",
            "assert.ok(!v252.includes('grid-column:1'),'V2.5.2 must not duplicate list grid placement');",
            "assert.ok(!v252.includes('grid-column:2'),'V2.5.2 must not duplicate resizer grid placement');",
            "assert.ok(css.includes('.notebook-layout.notebook-mode-edit,.notebook-layout.notebook-mode-split{grid-template-columns:minmax(0,1fr)!important'),'editing single-track rule missing');",
            "console.log('P02_NOTEBOOK_GRID_PLACEMENT_OWNERSHIP=PASS');",
          ]
          Path('tests/unit/p02_notebook_grid_placement_ownership.mjs').write_text('\n'.join(contract)+'\n',encoding='utf-8')

          evidence=[
            '# P02 Notebook Grid Placement Ownership · 2026-08-31','',
            '## Finding','',
            'R35 measured Edit at `layout=1196`, `detail=1005`, with computed grid `191.453px 0px 1004.55px` even though the list and resizer were hidden.','',
            'R36 found the remaining owner in the V2.5.0 notebook base block: desktop `.notebook-detail-scroll{grid-column:3}` was unconditional. When V2.5.32 changed Edit/Split to one explicit grid track, forcing the detail into column 3 caused CSS Grid to create implicit columns.','',
            '## Fix','',
            'Desktop list/resizer/detail grid placement is now owned only by `.notebook-layout:not(.notebook-editing)`. Edit and Split use normal auto-placement inside their one-track grid.','',
            'The V2.5.2 visibility block no longer duplicates list/resizer grid-column declarations, leaving one owner for desktop notebook placement.','',
            '## Acceptance','',
            '- Full existing unit contract suite passes.','- Source Manifest and repository gates pass.','- Real Chromium task flow passes.','- Real Chromium Edit detail width equals notebook layout width within 3px.','- Split detail also owns the full notebook layout while Read restores the list/detail grid.','',
            '## Boundary','',
            'No schema, API, content model, main, tag, release, update-channel, or production change.'
          ]
          Path('docs/evidence/P02_NOTEBOOK_GRID_PLACEMENT_OWNERSHIP_20260831.md').write_text('\n'.join(evidence)+'\n',encoding='utf-8')
          PY
          python3 scripts/generate-source-manifest.py
          python3 scripts/verify-source-manifest.py

      - name: Verify all static contracts and repository gates
        working-directory: product
        run: |
          set -Eeuo pipefail
          node --check public/assets/app.js
          php -l public/index.php
          test "$(tr -d '\r\n' < VERSION)" = "$EXPECTED_VERSION"
          for t in tests/unit/p02_*.mjs; do node "$t"; done
          python3 scripts/verify-source-manifest.py
          python3 scripts/repository-gates.py
          python3 - <<'PY'
          import json
          m=json.load(open('SOURCE_MANIFEST.json',encoding='utf-8'))
          c=json.load(open('docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json',encoding='utf-8'))
          assert m['version']=='2.5.32' and m['runtime_source_file_count']==72
          assert c['candidate_version']=='2.5.32' and c['runtime_source_file_count']==72
          assert c['production_version']=='2.5.31'
          assert c['convergence']['legacy_grid_placement_narrowed_to_non_editing'] is True
          assert c['convergence']['notebook_grid_placement_single_owner'] is True
          print('P02_R37_STATIC_GATES=PASS')
          PY

      - name: Install isolated browser runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 sqlite3 curl >/dev/null
          cd product
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Build and boot transformed isolated site
        working-directory: product
        run: |
          set -Eeuo pipefail
          RUN_ROOT="$RUNNER_TEMP/p02-r37"
          SITE="$RUN_ROOT/site"
          mkdir -p "$RUN_ROOT" browser-evidence
          bash scripts/build-deploy-tree.sh "$SITE"
          test "$(tr -d '\r\n' < "$SITE/VERSION.txt")" = "$EXPECTED_VERSION"
          php -d display_errors=0 -S "127.0.0.1:$PORT" -t "$SITE" >"$RUN_ROOT/php.log" 2>&1 &
          echo $! > "$RUN_ROOT/php.pid"
          BASE_URL="http://127.0.0.1:$PORT"
          for _ in $(seq 1 80); do curl -fsS "$BASE_URL/setup.php" >/dev/null 2>&1 && break; sleep .25; done
          PASSWORD="VF-R37-${GITHUB_RUN_ID}!"; printf '%s' "$PASSWORD" > "$RUN_ROOT/password"
          curl -fsS -c "$RUN_ROOT/cookie" "$BASE_URL/setup.php" > "$RUN_ROOT/setup.html"
          SETUP_CSRF="$(python3 - "$RUN_ROOT/setup.html" <<'PY'
          import html,re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s)
          if not m: raise SystemExit('setup csrf missing')
          print(html.unescape(m.group(1)))
          PY
          )"
          STATUS="$(curl -sS -o "$RUN_ROOT/setup-post.html" -w '%{http_code}' -b "$RUN_ROOT/cookie" -c "$RUN_ROOT/cookie" -H "Origin: $BASE_URL" --data-urlencode "setup_csrf=$SETUP_CSRF" --data-urlencode "password=$PASSWORD" --data-urlencode "password_confirm=$PASSWORD" "$BASE_URL/setup.php")"
          test "$STATUS" = '303'
          echo P02_R37_SITE_READY=PASS

      - name: Run existing real Chromium task flow
        working-directory: product
        run: |
          set -Eeuo pipefail
          RUN_ROOT="$RUNNER_TEMP/p02-r37"
          VF_UX_E2E_BASE_URL="http://127.0.0.1:$PORT" VF_UX_E2E_PASSWORD="$(cat "$RUN_ROOT/password")" VF_UX_E2E_VERSION="$EXPECTED_VERSION" node tests/e2e/p02_ux_task_flow.mjs

      - name: Prove editing geometry in real Chromium
        working-directory: product
        run: |
          set -Eeuo pipefail
          RUN_ROOT="$RUNNER_TEMP/p02-r37"
          cat > r37.mjs <<'JS'
          import { chromium } from 'playwright';
          const base=process.env.BASE_URL,password=process.env.PASSWORD;
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:900}});
          const page=await context.newPage();
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const shot=async n=>{await page.waitForTimeout(80);await page.screenshot({path:`browser-evidence/${n}.png`,fullPage:false});};
          await page.goto(base+'/',{waitUntil:'networkidle'});
          if(await page.locator('[data-open-login]').count()){
            await page.locator('[data-open-login]').click();
            await page.locator('#loginForm input[name="password"]').fill(password);
            await page.locator('#loginSubmit').click();
            await page.waitForFunction(async()=>Boolean((await (await fetch('/api.php?action=session')).json())?.site?.auth));
          }
          const fixture=await page.evaluate(async()=>{
            const s=await (await fetch('/api.php?action=session')).json();
            const post=async(a,b)=>{const r=await fetch('/api.php?action='+a,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':s.csrf},body:JSON.stringify(b)});const j=await r.json();if(!j.ok)throw new Error(a+JSON.stringify(j));return j;};
            const c=await post('category_save',{name:'R37 Grid Ownership',description:'isolated',icon:'folder'});
            const x=await post('content_save',{category_id:c.id,title:'R37 Grid Ownership Article',content:'# R37\n\n'+('Real Chromium geometry validation paragraph.\n\n').repeat(50),content_mode:'article',content_format:'markdown',primary_action:'read',status:'active'});
            return {id:x.item?.id||x.id};
          });
          assert(fixture.id,'fixture id missing');
          await page.evaluate(async id=>{if(state.contentView!=='list')await setContentView('list');const item=await fetchItem(id,{force:true});renderArticleWorkspace(item,'edit');},fixture.id);
          await page.waitForSelector('.article-workspace.mode-edit');await page.waitForTimeout(120);
          const edit=await page.evaluate(()=>{const l=document.querySelector('#notebookLayout'),p=document.querySelector('#notebookListPane'),r=document.querySelector('#notebookResizer'),d=document.querySelector('#notebookDetailScroll');return {pane:getComputedStyle(p).display,resizer:getComputedStyle(r).display,layout:Math.round(l.getBoundingClientRect().width),detail:Math.round(d.getBoundingClientRect().width),grid:getComputedStyle(l).gridTemplateColumns,detailColumn:getComputedStyle(d).gridColumn};});
          console.log('R37_EDIT='+JSON.stringify(edit));
          assert(edit.pane==='none'&&edit.resizer==='none','Edit list/resizer visible '+JSON.stringify(edit));
          assert(Math.abs(edit.layout-edit.detail)<=3,'Edit detail is not full width '+JSON.stringify(edit));
          assert(edit.grid.split(' ').filter(Boolean).length===1,'Edit still has implicit grid tracks '+JSON.stringify(edit));
          await shot('01-edit-desktop');

          await page.locator('.workspace-mode-switch [data-workspace-command="split"]').click();await page.waitForSelector('.article-workspace.mode-split');await page.waitForTimeout(100);
          const split=await page.evaluate(()=>{const l=document.querySelector('#notebookLayout'),d=document.querySelector('#notebookDetailScroll'),s=document.querySelector('.article-source-pane'),v=document.querySelector('.article-preview-pane');return {layout:Math.round(l.getBoundingClientRect().width),detail:Math.round(d.getBoundingClientRect().width),source:Math.round(s.getBoundingClientRect().width),preview:Math.round(v.getBoundingClientRect().width),grid:getComputedStyle(l).gridTemplateColumns,detailColumn:getComputedStyle(d).gridColumn};});
          console.log('R37_SPLIT='+JSON.stringify(split));
          assert(Math.abs(split.layout-split.detail)<=3,'Split detail is not full width '+JSON.stringify(split));
          assert(split.source>500&&split.preview>500,'Split panes remain constrained '+JSON.stringify(split));
          assert(split.grid.split(' ').filter(Boolean).length===1,'Split still has implicit grid tracks '+JSON.stringify(split));
          await shot('02-split-desktop');

          await page.locator('.workspace-mode-switch [data-workspace-command="read"]').click();await page.waitForTimeout(100);
          const read=await page.evaluate(()=>{const l=document.querySelector('#notebookLayout'),p=document.querySelector('#notebookListPane'),r=document.querySelector('#notebookResizer'),d=document.querySelector('#notebookDetailScroll');return {pane:getComputedStyle(p).display,resizer:getComputedStyle(r).display,layout:Math.round(l.getBoundingClientRect().width),detail:Math.round(d.getBoundingClientRect().width),grid:getComputedStyle(l).gridTemplateColumns,detailColumn:getComputedStyle(d).gridColumn};});
          console.log('R37_READ='+JSON.stringify(read));
          assert(read.pane==='flex'&&read.resizer==='block','Read list/resizer not restored '+JSON.stringify(read));
          assert(read.detail<read.layout-200,'Read did not restore list/detail split '+JSON.stringify(read));
          assert(read.grid.split(' ').filter(Boolean).length>=3,'Read should restore three-track notebook grid '+JSON.stringify(read));
          await shot('03-read-desktop');
          console.log('P02_R37_BROWSER_GEOMETRY=PASS');
          await browser.close();
          JS
          BASE_URL="http://127.0.0.1:$PORT" PASSWORD="$(cat "$RUN_ROOT/password")" node r37.mjs
          rm r37.mjs

      - name: Upload browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: p02-r37-grid-ownership-browser
          path: product/browser-evidence/*.png
          if-no-files-found: error
          retention-days: 1

      - name: Commit and push develop only
        working-directory: product
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$WRITE_TOKEN"
          git remote set-url origin "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-library.git"
          git fetch origin develop
          test "$(git rev-parse origin/develop)" = "$BASE_REF"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(P02): narrow V2.5.32 notebook grid placement ownership'
          git push origin HEAD:develop
          git remote set-url origin "https://github.com/llhzx2018/vf-library"
          echo P02_R37_DEVELOP_WRITE=PASS
          echo P02_MAIN_WRITE=NO
          echo TAG_WRITE=NO
          echo RELEASE_WRITE=NO
          echo UPDATE_CHANNEL_WRITE=NO
          echo PRODUCTION_WRITE=NO

      - name: Boundaries
        if: always()
        run: |
          RUN_ROOT="$RUNNER_TEMP/p02-r37"; if test -f "$RUN_ROOT/php.pid"; then kill "$(cat "$RUN_ROOT/php.pid")" 2>/dev/null || true; fi
          echo MAIN_WRITE=NO
          echo TAG_WRITE=NO
          echo RELEASE_WRITE=NO
          echo UPDATE_CHANNEL_WRITE=NO
          echo PRODUCTION_WRITE=NO
