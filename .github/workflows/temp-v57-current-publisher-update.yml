name: TEMP update Current Skill publisher for V5.7

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch canonical publisher to V5.7 Current / R4
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/gov-doc-skill-pack-publish.yml')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'EXPECTED_GOV_DOC_SHA: e68b691611e94a89fa2ca13276f0b35c175dd5ad': 'EXPECTED_GOV_DOC_SHA: 27680edd2f21cb65a14ef0b5609b8e92515a12a0',
              'VF_SKILL_PACK_VERSION: 2026.08.29-r3': 'VF_SKILL_PACK_VERSION: 2026.08.29-r4',
              'VF_SKILL_BUILD_ID: 20260829r3': 'VF_SKILL_BUILD_ID: 20260829r4',
              'VF_SKILL_RELEASE_TAG: skills-pack-2026.08.29-r3': 'VF_SKILL_RELEASE_TAG: skills-pack-2026.08.29-r4',
              'VF_SKILL_RELEASE_TITLE: VF Skills Pack 2026.08.29 R3': 'VF_SKILL_RELEASE_TITLE: VF Skills Pack 2026.08.29 R4',
              'DIST_DIR: dist/skills-2026.08.29-r3': 'DIST_DIR: dist/skills-2026.08.29-r4',
              'MIRROR_BRANCH: release/skill-pack-20260829r3-mirror': 'MIRROR_BRANCH: release/skill-pack-20260829r4-mirror',
          }
          for old, new in replacements.items():
              count = text.count(old)
              assert count == 1, (old, count)
              text = text.replace(old, new)

          needle = "topic = next(r for r in manifest['skills'] if r['skill'] == 'skill-topic')\n          assert topic['version'] == 'V1.2', topic"
          replacement = needle + "\n          book = next(r for r in manifest['skills'] if r['skill'] == 'skill-book')\n          assert book['version'] == 'V5.7', book"
          count = text.count(needle)
          assert count >= 3, count
          text = text.replace(needle, replacement)

          text = text.replace('SKILL_TOPIC_V1.2', 'SKILL_TOPIC_V1.2_SKILL_BOOK_V5.7')
          text = text.replace("'Expected skill-topic: `V1.2`\\n'", "'Expected skill-topic: `V1.2`\\n'\n                      'Expected skill-book: `V5.7`\\n'")

          # The old Current build must no longer be referenced by the canonical publisher.
          for forbidden in [
              'e68b691611e94a89fa2ca13276f0b35c175dd5ad',
              '2026.08.29-r3',
              '20260829r3',
              'skill-pack-20260829r3-mirror',
          ]:
              assert forbidden not in text, forbidden
          assert text.count("book['version'] == 'V5.7'") >= 3
          assert 'EXPECTED_GOV_DOC_SHA: 27680edd2f21cb65a14ef0b5609b8e92515a12a0' in text
          assert 'VF_SKILL_RELEASE_TAG: skills-pack-2026.08.29-r4' in text
          path.write_text(text, encoding='utf-8')
          print('CANONICAL_PUBLISHER_V57_R4_PATCH=PASS')
          PY

      - name: Self-remove helper and push branch result
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/temp-v57-current-publisher-update.yml
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add .github/workflows/gov-doc-skill-pack-publish.yml
          git diff --cached --name-only
          test "$(git diff --cached --name-only | tr '\n' ' ')" = '.github/workflows/gov-doc-skill-pack-publish.yml .github/workflows/temp-v57-current-publisher-update.yml '
          git commit -m 'release: bind Current Skill publisher to V5.7 Source Current R4'
          git push origin "HEAD:${{ github.head_ref }}"
          echo "PUBLISHER_PATCH_BRANCH_SHA=$(git rev-parse HEAD)"
