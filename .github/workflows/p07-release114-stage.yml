name: P07 release114 authorized public staging (exact-source, non-production)

on:
  push:
    branches:
      - release/p07-114-toolbox-20261106
    paths:
      - .github/workflows/p07-release114-stage.yml

permissions:
  contents: write

concurrency:
  group: p07-release114-public-stage
  cancel-in-progress: false

jobs:
  stage:
    if: >-
      ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/release/p07-114-toolbox-20261106' && startsWith(github.event.head_commit.message, 'P07 release114 authorized exact staging') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact original public release113 baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Checkout merged P07 source and proved exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 46014482feadb8db61cff71928326eb35791b192
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: _p07_release114_product
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: b02b176bb61fafba2a56c8c5d138213cd3916016
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: _p07_release114_proved

      - name: Verify source/authority merge and prior machine evidence without publishing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git -C _p07_release114_product rev-parse HEAD)" = 46014482feadb8db61cff71928326eb35791b192
          test "$(git -C _p07_release114_proved rev-parse HEAD)" = b02b176bb61fafba2a56c8c5d138213cd3916016
          test "$(cat _p07_release114_product/BUILD_ID)" = "0.1.0-release114"
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = "0.1.0-release113"
          test "$(git rev-parse HEAD)" = 2d976eac5d4e44f0e588d3adfa2810aaf5d920e1
          # Main must differ from fully tested source only in canonical docs:
          # no untested runtime or test changes can be published.
          diff_names="$(git -C _p07_release114_product diff --no-ext-diff --name-only \
            b02b176bb61fafba2a56c8c5d138213cd3916016..HEAD)"
          while IFS= read -r name; do
            [[ -z "$name" ]] && continue
            case "$name" in
              README.md|docs/authority/ACCEPTANCE_MATRIX.md|docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md|docs/authority/RPD.md|docs/authority/SSOT.md|docs/authority/USER_ACCEPTANCE.md) ;;
              *) echo "P07_RELEASE114_UNTESTED_SOURCE_DIFF"; exit 78 ;;
            esac
          done <<<"$diff_names"
          test -n "$diff_names"
          grep -Fq "vf-server-ops" _p07_release114_product/docs/authority/CURRENT.md
          echo "P07_RELEASE114_MERGED_SOURCE_RUNTIME_EQUIVALENT_TO_PROVED_SHA=PASS"

      - name: Build release114 official installer candidate from exact verified trees
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B _p07_release114_product/scripts/p07_candidate_bundle.py \
            --product-root _p07_release114_product \
            --public-root . \
            --output "$RUNNER_TEMP/p07-release114-staged" \
            --product-sha 46014482feadb8db61cff71928326eb35791b192 \
            --build 0.1.0-release114 \
            --care 0.1.0-rc81
          python3 - "$RUNNER_TEMP/p07-release114-staged" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          attest=json.loads((root/'candidate_attestation.json').read_text())
          assert attest['schema']=='p07.release-candidate.offline.v1'
          assert attest['status']=='FORMAL_STAGING_NOT_PUBLISHED'
          assert attest['product_source_sha']=='46014482feadb8db61cff71928326eb35791b192'
          assert attest['product_build']=='0.1.0-release114'
          assert attest['system_care_build']=='0.1.0-rc81'
          assert not any(attest['negative'].values())
          def blob(path):
              data=path.read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          dist=root/'dist/p07/0.1.0/overlay'
          for key,relative in (('runtime_manifest_blob','RUNTIME.gitblob'),('overlay_manifest_blob','MANIFEST.gitblob')):
              assert blob(dist/relative)==attest[key]
          for rel in ('RUNTIME.gitblob','MANIFEST.gitblob'):
              items=set()
              for record in (dist/rel).read_text().splitlines():
                  sha,name=record.split('  ',1)
                  assert name not in items
                  items.add(name)
                  path=dist/name
                  assert path.is_file() and not path.is_symlink()
                  assert blob(path)==sha
          for key,path in (('final_installer_blob',root/'installers/p07-final.sh'),
                           ('system_care_manifest_blob',root/'packages/p07-system-care/0.1.0-rc81/MANIFEST.gitblob')):
              assert blob(path)==attest[key]
          assert 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release114"' in (root/'installers/p07-toolbox.sh').read_text()
          assert 'EXPECTED_BUILD_ID="0.1.0-release114"' in (root/'installers/p07-final.sh').read_text()
          assert 'SQL_CONDITIONAL_DDL_UNPROVEN' in (dist/'lib/diagnostics.py').read_text()
          assert 'resume-verified-adoption' in (dist/'bin/vfops-migrate-ui').read_text()
          assert 'retain_failed_import' in (dist/'lib/server_migration_pull.py').read_text()
          print("P07_RELEASE114_FINAL_SOURCE_INSTALLER_MANIFEST_PASS")
          PY
          bash -n "$RUNNER_TEMP/p07-release114-staged/installers/p07-final.sh" \
            "$RUNNER_TEMP/p07-release114-staged/installers/p07-toolbox.sh" \
            "$RUNNER_TEMP/p07-release114-staged/installers/p07.sh"

      - name: Stage only approved public program files into release branch
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/p07-release114-staged"
          rsync -a "$root/dist/p07/0.1.0/overlay/" dist/p07/0.1.0/overlay/
          mkdir -p packages/p07-system-care/0.1.0-rc81
          rsync -a "$root/packages/p07-system-care/0.1.0-rc81/" packages/p07-system-care/0.1.0-rc81/
          cp "$root/installers/p07.sh" installers/p07.sh
          cp "$root/installers/p07-final.sh" installers/p07-final.sh
          cp "$root/installers/p07-toolbox.sh" installers/p07-toolbox.sh
          cp "$root/installers/p07-system-care.sh" installers/p07-system-care.sh
          cp "$root/candidate_attestation.json" experiments/p07-release114-attestation.json
          git add -- dist/p07/0.1.0/overlay \
            packages/p07-system-care/0.1.0-rc81 \
            installers/p07.sh installers/p07-final.sh \
            installers/p07-toolbox.sh installers/p07-system-care.sh \
            experiments/p07-release114-attestation.json
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          rows=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert rows
          for name in rows:
              assert (name.startswith('dist/p07/0.1.0/overlay/') or
                      name.startswith('packages/p07-system-care/0.1.0-rc81/') or
                      name in {'installers/p07.sh','installers/p07-final.sh',
                               'installers/p07-toolbox.sh','installers/p07-system-care.sh',
                               'experiments/p07-release114-attestation.json'}), name
          print("P07_RELEASE114_STAGED_PATH_ALLOWLIST_PASS")
          PY
          git -c user.name='P07 Release Builder' -c user.email='actions@users.noreply.github.com' \
              commit -m 'P07 release114 staged: exact product 46014482 / no publication'
          git push origin HEAD:refs/heads/release/p07-114-toolbox-20261106
          echo "P07_RELEASE114_STAGED_ONLY_NOT_PUBLIC_MAIN=PASS"
          echo "P07_RELEASE114_FORMAL_TAG=NOT_CREATED"
          echo "P07_RELEASE114_OWNER_CP2_WRITES=NONE"

      - name: Always remove downloaded private source and candidate
        if: always()
        shell: bash
        run: |
          rm -rf -- _p07_release114_product _p07_release114_proved
          rm -rf -- "$RUNNER_TEMP/p07-release114-staged"
          echo P07_PRIVATE_STAGING_CLEANED
