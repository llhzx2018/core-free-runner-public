name: temp-s01-ops-121860-runtime-authority-20260908
on:
  push:
    branches: [temp/s01-page-update-center-v4-20260907]
    paths: [.github/workflows/temp-s01-ops-121860-runtime-authority-20260908.yml]
permissions:
  contents: read
jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      REPO: llhzx2018/vf-tools-ops
      TAG: v1.21.860
      ASSET: vf-tools-ops_V1.21.860.zip
      EXPECTED_SOURCE: 7a0948791a69f62f603de0d187e384c279215536
      EXPECTED_BYTES: '3364996'
      EXPECTED_ASSET_SHA256: aa8db19e25708527d3c6f8b6457f563472d2abe4f81d86f87b2882b0b8b814ba
      EXPECTED_RUNTIME_FILES: '935'
      EXPECTED_RUNTIME_FP: c95f44b6b796a601aaf000315917d9a80b027b4df4abfae207e3fee549b66b91
    steps:
      - name: Verify exact delivered Ops runtime authority
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'RUNTIME_AUTHORITY_MODE=DELIVERED_RELEASE_READ_ONLY PRODUCTION_WRITE_USED=NO STATIC_WRITE_USED=NO ONLINE_WRITE_USED=NO'
          test "$(gh api repos/$REPO/git/ref/tags/$TAG --jq '.object.sha')" = "$EXPECTED_SOURCE"
          test "$(gh api repos/$REPO/releases/tags/$TAG --jq '.draft')" = false
          test "$(gh api repos/$REPO/releases/tags/$TAG --jq '.prerelease')" = false
          rm -rf "$RUNNER_TEMP/ops-runtime"; mkdir -p "$RUNNER_TEMP/ops-runtime"
          gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" --dir "$RUNNER_TEMP/ops-runtime"
          asset="$RUNNER_TEMP/ops-runtime/$ASSET"
          test "$(stat -c %s "$asset")" = "$EXPECTED_BYTES"
          test "$(sha256sum "$asset"|awk '{print $1}')" = "$EXPECTED_ASSET_SHA256"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile,os
          p=Path(os.environ['RUNNER_TEMP'])/'ops-runtime'/os.environ['ASSET']
          with zipfile.ZipFile(p) as z:
              names=sorted(n for n in z.namelist() if not n.endswith('/'))
              assert z.testzip() is None and len(names)==935
              assert all(n.startswith('vf-ops/') for n in names)
              assert 'vf-ops/VERSION' not in names and not any(n.startswith('vf-ops/tests/') for n in names)
              assert 'vf-ops/assets/css/current/admin-s01-top-domains-v3.css' in names
              rows=[(n[len('vf-ops/'):],z.read(n)) for n in names]
              runtime=''.join(f'{rel}\0{hashlib.sha256(data).hexdigest()}\n' for rel,data in rows).encode()
              fp=hashlib.sha256(runtime).hexdigest()
              assert fp==os.environ['EXPECTED_RUNTIME_FP'], fp
              assert b'Version: 1.21.860' in z.read('vf-ops/vf-ops.php')
              loader=z.read('vf-ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php'); assert b'admin-s01-top-domains-v3.css' in loader
              css=z.read('vf-ops/assets/css/current/admin-s01-top-domains-v3.css')
              for token in [b'.vf-v13-publish-single',b'.vf-accept-product',b'.vf-site-release']:
                  assert token in css
              print('RUNTIME_FILES=935'); print('RUNTIME_FP='+fp)
          PY
          echo 'PHYSICAL_LOCATOR=vf-ops/vf-ops.php'
          echo 'SCHEMA=6.0.0 LOCATOR_CUTOVER=false'
          echo 'PASS_S01_C02_121860_DELIVERED_RUNTIME_AUTHORITY'
