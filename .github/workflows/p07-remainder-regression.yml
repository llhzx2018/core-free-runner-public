name: P07 blocked-site remainder exact-source regression
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-remainder-regression.yml'
      - 'experiments/p07-remainder/**'
permissions:
  contents: read
jobs:
  p07-remainder:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact candidate source bytes (no production data)
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = "0.1.0-release111"
          test "$(git hash-object experiments/p07-remainder/lib/server_migration_pull.py)" = cb5770e0ca502a0c2931c2f0aa21ba30fafe325a
          test "$(git hash-object experiments/p07-remainder/lib/migration_remainder.py)" = 36c4166d5b06c0ef2491d60ae9c5ed134352d351
          test "$(git hash-object experiments/p07-remainder/tests/test_migration_remainder.py)" = 179736d53c790b204af859ac027cc09f61cc1c67
          test "$(git hash-object experiments/p07-remainder/bin/vfops)" = 290130764b687eaee61723ad9e476a76397e255f
          cp -a dist/p07/0.1.0/overlay "$RUNNER_TEMP/p07-remainder"
          cp experiments/p07-remainder/lib/server_migration_pull.py "$RUNNER_TEMP/p07-remainder/lib/"
          cp experiments/p07-remainder/lib/migration_remainder.py "$RUNNER_TEMP/p07-remainder/lib/"
          cp experiments/p07-remainder/tests/test_migration_remainder.py "$RUNNER_TEMP/p07-remainder/tests/"
          cp experiments/p07-remainder/bin/vfops "$RUNNER_TEMP/p07-remainder/bin/"
          chmod +x "$RUNNER_TEMP/p07-remainder/bin/"*
          echo P07_REMAINDER_EXACT_BYTES_PASS
      - name: Parse candidate and verify native CLI routing
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-remainder"
          python3 -m py_compile lib/server_migration_pull.py lib/migration_remainder.py tests/test_migration_remainder.py
          bash -n bin/vfops
          grep -F 'run_server_migration()' bin/vfops
          grep -F 'remainder-plan' bin/vfops
          echo P07_REMAINDER_COMPILE_AND_ENTRY_PASS
      - name: Focused stage-only and anti-overwrite regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-remainder"
          PYTHONPATH=lib python3 -m unittest -v \
            tests.test_migration_remainder \
            tests.test_migration_no_overwrite_resume \
            tests.test_server_migration_pull \
            tests.test_server_migration \
            tests.test_migration_conflict_recovery \
            tests.test_sql_pk_conflict_evidence \
            tests.test_verify
          echo P07_REMAINDER_GUARD_REGRESSIONS_PASS
      - name: No accidental modification of baseline runtime or backup code
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-remainder"
          for path in lib/cloudpanel.py lib/restore_apply_core.py lib/verify.py lib/package_core.py lib/server_migration.py BUILD_ID; do
            test "$(git hash-object "$GITHUB_WORKSPACE/dist/p07/0.1.0/overlay/$path")" = "$(git hash-object "$path")"
          done
          echo P07_REMAINDER_BASELINE_SAFETY_UNCHANGED_PASS
