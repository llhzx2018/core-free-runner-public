name: P08 R42 reusable V2 signed Owner offer PHP and Vue (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-r42-v2-signed-offer-once.yml'
permissions:
  contents: read
jobs:
  v2-signed-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout public-safe ephemeral test workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout exact private P08 source (runtime secret only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: abc53ea1e9d776e816e22d0e4a28fedf9adbdf95
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-p08
      - name: Validate source identity before any execution
        run: |
          set -euo pipefail
          test "$(git -C private-p08 rev-parse HEAD)" = 'abc53ea1e9d776e816e22d0e4a28fedf9adbdf95'
          test "$(cat private-p08/VERSION)" = '0.1.1'
          test ! -e private-p08/.env
          test ! -e private-p08/vendor
          echo 'P08_R38_EXACT_SOURCE_IDENTITY=PASS'
      - name: PHP 8.4 native Linux runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: sodium, zip, mbstring, pdo_sqlite
      - name: Verify reusable static signed offer and verified Owner job (real pointer)
        run: |
          set -euo pipefail
          cd private-p08
          php -l src/Upgrade/OwnerUpgradeJob.php
          php -l src/Upgrade/UpgradeReadiness.php
          php -l app/Providers/AppServiceProvider.php
          php -l app/Http/Controllers/OwnerUpgradeController.php
          php -l app/Http/Controllers/WorkspaceController.php
          php -l tests/test_owner_upgrade_job.php
          php tests/test_owner_upgrade_job.php
          php tests/test_upgrade_readiness.php
          python3 scripts/check_stack_contract.py --phase foundation
          echo 'P08_R42_STATIC_V2_SIGNATURE_OWNER_POINTER_AND_NEGATIVES=PASS'
      - name: Build and typecheck exact Vue Owner Update interface
        run: |
          set -euo pipefail
          cd private-p08
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r42-npm.log" 2>&1 || { tail -n 22 "$RUNNER_TEMP/p08-r42-npm.log"; exit 1; }
          npm run typecheck
          npm run build
          echo 'P08_R42_UPDATE_BUTTON_VUE_TYPESCRIPT_BUILD=PASS'
      - name: Remove private checkout and any synthetic artifacts
        if: always()
        run: |
          rm -rf private-p08
          rm -f "$RUNNER_TEMP/p08-r42-npm.log"
