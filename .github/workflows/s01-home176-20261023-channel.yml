name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-home176-20261023]
    paths: ['.github/workflows/s01-home176-20261023-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.176
  TARGET_SHA: 3d5c4ca2293cfcdc0d93fe43ad8e10e5439ffba0
  UPDATE_SHA: 3012f703ae9e29e0db30a72ed6d4e3336cc644c4
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 3012f703ae9e29e0db30a72ed6d4e3336cc644c4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='ce2dae77c9f5ca6996c940f33f1e9e5c9f86cbd8b1b1fe5d0f6f8bf5596366a2' and m['asset_bytes']==1975550
          assert m['runtime_files']==476 and '1.35.175' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
