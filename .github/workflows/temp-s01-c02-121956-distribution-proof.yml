name: TEMP S01-C02 1.21.956 Distribution Proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-s01-c02-121956-distribution-proof.yml'

permissions:
  contents: read

jobs:
  exact-distribution-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      UPDATES_SHA: 80ec10bc165f6ec41f9a99b85430d8b07cdf741a
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      PRODUCT_SHA: 1da10c44b5f202a82a092acb430d0064b03c3d84
      TAG: v1.21.956
      ASSET: vf-tools-ops_V1.21.956.zip
      ASSET_BYTES: '3409061'
      ASSET_SHA256: 49e876f7ad0a58546862c2ea24bd1510a09f8fff81f0621984deeba49fb2f620
      RUNTIME_FILES: '961'
      RUNTIME_FP: 41e36355e2042431f98353aa74f5c188f4c5405305346c05126254d9eba72d93

    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.UPDATES_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: updates
          persist-credentials: false

      - name: Assert exact manifest identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$UPDATES_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("updates/projects/S01-C02.json").read_text())
          assert m["target_version"]=="1.21.956"
          assert m["release_tag"]=="v1.21.956"
          assert m["asset_name"]=="vf-tools-ops_V1.21.956.zip"
          assert m["asset_bytes"]==3409061
          assert m["asset_sha256"]=="49e876f7ad0a58546862c2ea24bd1510a09f8fff81f0621984deeba49fb2f620"
          assert m["runtime_files"]==961
          assert m["runtime_fingerprint"]=="41e36355e2042431f98353aa74f5c188f4c5405305346c05126254d9eba72d93"
          assert m["runtime_file_count"]==961
          assert m["runtime_fingerprint_sha256"]=="41e36355e2042431f98353aa74f5c188f4c5405305346c05126254d9eba72d93"
          assert "1.21.955" in m["from_versions"]
          assert m["schema_from"]=="6.0.0" and m["schema_to"]=="6.0.0"
          assert m["backup_required"] is True and m["rollback_supported"] is True
          print("S01-C02 1.21.956 manifest identity PASS")
          PY

      - name: Manifest contract audit
        working-directory: updates
        run: python3 scripts/check_manifest_contract.py

      - name: PHP syntax and Update Core regression
        shell: bash
        working-directory: updates
        run: |
          set -euo pipefail
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php

      - name: Exact Formal Release readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          JSON="$(gh api "repos/$PRODUCT_REPO/releases/tags/$TAG")"
          test "$(jq -r '.target_commitish' <<<"$JSON")" = "$PRODUCT_SHA"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$JSON")" = "$ASSET_BYTES"
          DIGEST="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|(.digest // "")' <<<"$JSON")"
          if [ -n "$DIGEST" ] && [ "$DIGEST" != "null" ]; then
            test "$DIGEST" = "sha256:$ASSET_SHA256"
          fi
          echo "S01-C02 1.21.956 DISTRIBUTION_EXACT_SOURCE_PROOF=PASS"

      - name: Cleanup
        if: always()
        run: rm -rf updates
