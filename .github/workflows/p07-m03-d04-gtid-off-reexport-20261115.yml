name: P07 M03-D04 native GTID OFF reexport scoped source machine tests
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-gtid-off-reexport-20261115.yml'
permissions:
  contents: read
jobs:
  gtid-off-native-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact private P07 product source temporarily
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 7fd7b32e33510b12d8772e427da261ff61e4b835
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-private-exact
      - name: Test safe native source re-export and existing SQL protection
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-exact rev-parse HEAD)" = 7fd7b32e33510b12d8772e427da261ff61e4b835
          (
            cd .p07-private-exact
            export PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 PYTHONPATH="$PWD/lib"
            python3 -B -m unittest discover -s tests -p test_p07_m03_gtid_safe_reexport.py -v
            python3 -B -m unittest discover -s tests -p test_migration_source_mysql_hex_export.py -v
            python3 -B -m unittest discover -s tests -p test_p07_m03_source_sql_safety_preimport.py -v
            python3 -B -m unittest discover -s tests -p test_migration_safe_session_guard.py -v
            python3 -B -m unittest discover -s tests -p test_cross_engine_sql_format.py -v
            python3 -B -m unittest discover -s tests -p test_p07_m03_dynamic_sqlite_scope.py -v
          )
          echo P07_M03_D04_NATIVE_GTID_OFF_EXACT_SOURCE_UNIT=PASS
      - name: Clean transient private product source
        if: always()
        shell: bash
        run: |
          rm -rf -- .p07-private-exact
          test ! -e .p07-private-exact
          echo P07_M03_D04_TEMP_PRIVATE_SOURCE_CLEANED=PASS
