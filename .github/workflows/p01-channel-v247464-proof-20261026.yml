name: "TEMP P01 V2.47.464 exact-channel independent CI proof"
on:
  push:
    branches:
      - "verify/p01-v247464-channel-pr906-20261026"
permissions:
  contents: read
jobs:
  verify-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact proposed core-updates PR 906 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: "f797488bed2c99d0062c85c9183a2d769ce53426"
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Confirm exact core-updates source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "f797488bed2c99d0062c85c9183a2d769ce53426"
      - name: Manifest Contract Audit
        run: python3 scripts/check_manifest_contract.py
      - name: PHP environment
        run: php -v
      - name: Update Core V1 PHP syntax check
        run: find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Update Core V1 regression tests
        run: php update-core/php/tests/run.php
      - name: Verify exact P01 update discovery and rollback identity
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('projects/P01.json').read_text())
          expected = {
              'project_id': 'P01',
              'current_version': '2.47.463',
              'target_version': '2.47.464',
              'update_type': 'ATOMIC',
              'release_tag': 'v2.47.464',
              'release_id': 424294411,
              'product_identity': '1e1f6101a703a788893de72cc3ae8e0de9ec250e',
              'asset_name': 'VF_Start_V2.47.464_UPDATE.zip',
              'asset_bytes': 3114703,
              'asset_sha256': '990b12719efd477a3fe46890a3d3754c0b7d0dcb4c4a949d2b2d170e555f3b77',
              'schema_from': '2026102201',
              'schema_to': '2026102201',
              'backup_required': True,
              'rollback_supported': True,
          }
          for k, v in expected.items():
              assert p.get(k) == v, (k, p.get(k), v)
          assert p['from_versions'] == ['2.47.463']
          print('P01_EXACT_CHANNEL_MANIFEST=PASS')
          PY
