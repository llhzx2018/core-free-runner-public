name: TEMP P01 V22119 Fast UI Gate V2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-p01-v22119-fast-ui-v2.yml']
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      ADMIN_PASS: Reference-P01-22119!Strong
    steps:
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4', extensions: 'pdo_sqlite, sqlite3, curl, zip, mbstring', coverage: none}
      - name: Real Chrome gate
        shell: bash
        run: |
          set -Eeuo pipefail;test -n "$READ_TOKEN";command -v google-chrome >/dev/null
          git clone -q --depth 1 --branch maintenance/reference-driven-ui-2.21.19-20260819 "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" product
          git -C product rev-parse HEAD >/tmp/source-sha;test "$(cat /tmp/source-sha)" = '52c0ffa6e6ef668d9a6de3ace26379f590642844'
          find product/src -type f -name '*.php' -print0|xargs -0 -n1 php -l >/dev/null;node --check product/src/assets/reference-ui.js
          mkdir -p "$RUNNER_TEMP/node";cd "$RUNNER_TEMP/node";npm init -y >/dev/null 2>&1;PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm i --no-audit --no-fund playwright-core@1.57.0 >/dev/null 2>&1
          cp -a "$GITHUB_WORKSPACE/product/src" /tmp/p01-fast2;php -S 127.0.0.1:18520 -t /tmp/p01-fast2 >/tmp/server.log 2>&1&echo $!>/tmp/server.pid
          for i in $(seq 1 30);do curl -fsS -c /tmp/c http://127.0.0.1:18520/setup.php -o /tmp/s&&break||sleep 1;done
          csrf=$(python3 - <<'PY'
          import re
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',open('/tmp/s').read());assert m;print(m.group(1))
          PY
          )
          curl -fsSL -b /tmp/c -c /tmp/c -X POST http://127.0.0.1:18520/setup.php --data-urlencode "setup_csrf=$csrf" --data-urlencode 'site_title=VF Start Reference UI' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" >/dev/null
          php -r 'require "/tmp/p01-fast2/app/bootstrap.php";$r=new VfRepository(vf_db());$ids=[];foreach([["工作工具",100],["AI 与开发",90],["内容与资料",80],["运营服务",70]] as $x)$ids[]=$r->createCategory(["name"=>$x[0],"description"=>"reference fixture","is_private"=>0,"sort_order"=>$x[1]]);foreach($ids as $i=>$c)for($j=0;$j<3;$j++)$r->saveLink(null,["category_id"=>$c,"title"=>"Reference ".$i."-".$j,"url"=>"https://example.com/".$i."/".$j,"description"=>"reference fixture","is_private"=>0,"is_favorite"=>($j===0?1:0),"sort_order"=>100-$j]);if(strtolower((string)vf_db()->query("PRAGMA integrity_check")->fetchColumn())!=="ok")exit(1);'
          cat > "$RUNNER_TEMP/node/e2e.mjs" <<'JS'
          import{chromium}from'playwright-core';import fs from'node:fs';const base='http://127.0.0.1:18520';const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const c=await b.newContext({viewport:{width:1440,height:900}});const p=await c.newPage(),q={front:{},admin:{},widths:{}};await p.goto(base+'/',{waitUntil:'domcontentloaded'});await p.waitForSelector('html[data-vf-reference-ui="2"]');await p.waitForSelector('.home-page');await p.waitForTimeout(180);q.front=await p.evaluate(()=>({ref:document.documentElement.dataset.vfReferenceUi,css:[...document.styleSheets].some(x=>(x.href||'').includes('reference-ui.css')),roots:document.querySelectorAll('.ref-home-categories .root-card').length,cats:document.querySelectorAll('.ref-home-categories').length,hero:document.querySelector('.command-hero')?getComputedStyle(document.querySelector('.command-hero')).display:'missing'}));if(q.front.ref!=='2'||!q.front.css||q.front.roots<4||q.front.cats!==1||!['none','missing'].includes(q.front.hero))throw Error('FRONT '+JSON.stringify(q.front));for(const w of [1440,768,480,390,375]){await p.setViewportSize({width:w,height:844});await p.waitForTimeout(120);const v=await p.evaluate(()=>({c:document.documentElement.clientWidth,h:document.documentElement.scrollWidth,b:document.body.scrollWidth,s:document.querySelector('.top-search')?.getBoundingClientRect().width||0}));if(v.h>v.c+1||v.b>v.c+1)throw Error('FO '+w+' '+JSON.stringify(v));if(w<=700&&v.s>44)throw Error('MS '+w+' '+v.s);q.widths['f'+w]=v}await p.setViewportSize({width:1440,height:900});const lr=await p.evaluate(async pass=>{const r=await fetch('/api.php?action=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pass})});return {s:r.status,b:await r.json()};},process.env.ADMIN_PASS);if(lr.s!==200||!lr.b.ok)throw Error('LOGIN '+JSON.stringify(lr));await p.goto(base+'/links-admin.php',{waitUntil:'domcontentloaded'});await p.waitForSelector('#linksBody tr');await p.waitForSelector('html[data-vf-reference-ui="2"]');q.admin=await p.evaluate(()=>({rails:document.querySelectorAll('.vf-admin-rail').length,rows:document.querySelectorAll('#linksBody tr').length,css:[...document.styleSheets].some(x=>(x.href||'').includes('reference-ui.css')),page:document.body.dataset.vfPage||'',batch:getComputedStyle(document.getElementById('batchBar')).display}));if(q.admin.rails!==1||q.admin.rows<8||!q.admin.css||q.admin.page!=='links-admin'||q.admin.batch!=='none')throw Error('ADMIN '+JSON.stringify(q.admin));const cc=p.locator('#linksBody input[type=checkbox]');await cc.nth(0).check();await cc.nth(1).check();await p.waitForTimeout(80);if(await p.locator('#batchBar').evaluate(e=>getComputedStyle(e).display==='none'))throw Error('BATCH');for(const w of [1440,768,480,390,375]){await p.setViewportSize({width:w,height:844});await p.waitForTimeout(120);const v=await p.evaluate(()=>({c:document.documentElement.clientWidth,h:document.documentElement.scrollWidth,b:document.body.scrollWidth,rails:document.querySelectorAll('.vf-admin-rail').length}));if(v.h>v.c+1||v.b>v.c+1||v.rails!==1)throw Error('AO '+w+' '+JSON.stringify(v));q.widths['a'+w]=v}fs.writeFileSync('/tmp/browser.json',JSON.stringify(q,null,2));await b.close();console.log('REFERENCE_UI_V2_PASS');
          JS
          cd "$RUNNER_TEMP/node";ADMIN_PASS="$ADMIN_PASS" node e2e.mjs
      - name: Evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -Eeuo pipefail;python3 - <<'PY'
          import json,os
          q={'schema':'vf-public-runner-result/v1','project_id':'P01','target_version':'2.21.19','gate':'REFERENCE_UI_BROWSER_REGRESSION','status':'SUCCESS','pass':True,'source_sha':open('/tmp/source-sha').read().strip(),'browser':json.load(open('/tmp/browser.json')),'private_data_persisted_publicly':False,'workflow_run_id':os.environ['GITHUB_RUN_ID']};open('/tmp/e.json','w').write(json.dumps(q,indent=2,sort_keys=True)+'\n')
          PY
          git clone -q --depth 1 --branch vf-agent-operations-v1 https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-free-runner-public.git out;mkdir -p out/vf-agent/results;cp /tmp/e.json out/vf-agent/results/P01-V2.21.19-REFERENCE-UI-BROWSER.json;git -C out config user.name VictorForge;git -C out config user.email llhzx2018@gmail.com;git -C out add vf-agent/results/P01-V2.21.19-REFERENCE-UI-BROWSER.json;git -C out commit -q -m 'evidence(P01): seal fixed V2.21.19 UI browser gate';git -C out pull -q --rebase origin vf-agent-operations-v1;git -C out push -q origin HEAD:vf-agent-operations-v1
      - if: always()
        run: '[ -f /tmp/server.pid ]&&kill "$(cat /tmp/server.pid)" 2>/dev/null||true;rm -rf product out /tmp/p01-fast2 "$RUNNER_TEMP/node" || true'
