name: p01-channel-ux-504-disposable
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-channel-ux-504-temp.yml'
      - 'specs/p01_channel_ux_504.json'
      - 'templates/p01_channel_ux_504.yml.in'
permissions:
  contents: read
jobs:
  exact-ui:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      WORK: /tmp/p01-channel-ux-504-${{ github.run_id }}
      TARGET_REPO: llhzx2018/vf-start
      TARGET_VERSION: 2.47.504
      TARGET_SHA: 30f40464138555a53d65f97bb72e980274108057
      TARGET_TREE: 838457ee95416b7a953f4c7067d4339a4dd7835d
      SOURCE_VERSIONS: 2.47.503
      HEAD_BRANCH: feat/p01-channel-ux-hierarchy-20261107
    steps:
      - name: Checkout trusted Runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate source identity and rendered workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$WORK"
          python3 scripts/ephemeral_lane_spec.py validate --spec specs/p01_channel_ux_504.json >/dev/null
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/p01_channel_ux_504.json --input .github/workflows/p01-channel-ux-504-temp.yml
          python3 scripts/ephemeral_lane_spec.py render --spec specs/p01_channel_ux_504.json --template templates/p01_channel_ux_504.yml.in --output "$WORK/rendered.yml"
          cmp "$WORK/rendered.yml" .github/workflows/p01-channel-ux-504-temp.yml
          echo P01_504_RUNNER_SINGLE_SPEC_RENDER=PASS
      - name: Install disposable PHP test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-xml php-mbstring php-zip php-gd unzip jq >/dev/null
          php -m | grep -Fxi pdo_sqlite
          command -v google-chrome
          node --version
      - name: Exact private candidate and official source verification
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$READ_TOKEN"
          remote="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/$TARGET_REPO.git" "refs/heads/$HEAD_BRANCH" | awk '{print $1}')"
          test "$remote" = "$TARGET_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/$TARGET_REPO.git" "$WORK/candidate"
          git -C "$WORK/candidate" fetch -q --depth 40 origin "$TARGET_SHA" "refs/tags/v$SOURCE_VERSIONS:refs/tags/v$SOURCE_VERSIONS"
          git -C "$WORK/candidate" checkout -q --detach "$TARGET_SHA"
          git -C "$WORK/candidate" remote set-url origin "https://github.com/$TARGET_REPO.git"
          test "$(git -C "$WORK/candidate" rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C "$WORK/candidate" rev-parse HEAD^{tree})" = "$TARGET_TREE"
          git -C "$WORK/candidate" worktree add -q --detach "$WORK/baseline" "v$SOURCE_VERSIONS"
          test "$(tr -d '\r\n ' < "$WORK/candidate/VERSION")" = "$TARGET_VERSION"
          test "$(tr -d '\r\n ' < "$WORK/candidate/src/VERSION.txt")" = "$TARGET_VERSION"
          test "$(tr -d '\r\n ' < "$WORK/baseline/VERSION")" = "$SOURCE_VERSIONS"
          echo P01_504_EXACT_SOURCE_AND_PREVIOUS_FORMAL=PASS
      - name: Source focused JS PHP and headless Chromium UX checks
        shell: bash
        run: |
          set -Eeuo pipefail
          cand="$WORK/candidate"
          php -l "$cand/src/app/FunctionalWorkspaceShell.php"
          php -l "$cand/src/app/bootstrap.php"
          node --check "$cand/src/assets/global-remote-channels.js"
          node --check "$cand/src/assets/local-subsite-management.js"
          node --check "$cand/tests/unit/p01_channels_full_inventory_failure_receipt_contract.cjs"
          node --check "$cand/tests/browser/p01_channel_editor_hierarchy_browser_contract.cjs"
          node "$cand/tests/unit/p01_channels_full_inventory_failure_receipt_contract.cjs"
          node "$cand/tests/unit/p01_ia5_remote_channels_r34_contract.cjs"
          node "$cand/tests/unit/p01_ia6_advanced_field_readback_contract.cjs"
          node "$cand/tests/browser/p01_channel_editor_hierarchy_browser_contract.cjs" | tee "$WORK/chromium.log"
          grep -Fx P01_CHANNEL_UX_BROWSER=PASS "$WORK/chromium.log"
          echo P01_504_EXACT_UI_FOCUSED=PASS
      - name: Canonical PHP zero-regression comparison with official baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd "$WORK/candidate" && bash tests/canonical_release_regression.sh . "$WORK/baseline" --require-zero-debt) >"$WORK/canonical.log" 2>&1 || {
            tail -n 90 "$WORK/canonical.log"; exit 31;
          }
          tail -n 13 "$WORK/canonical.log"
          grep -Fx P01_CANONICAL_UNIT_REGRESSION=PASS "$WORK/canonical.log"
          grep -Fx P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS "$WORK/canonical.log"
          echo P01_504_803_CANONICAL_ZERO_DEBT=PASS
      - name: Remove all temporary private source and test evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo P01_504_PUBLIC_ARTIFACT=NONE
          echo P01_504_PRODUCTION_WRITE=NONE
          case "$WORK" in /tmp/p01-channel-ux-504-*) rm -rf -- "$WORK";; *) exit 66;; esac
