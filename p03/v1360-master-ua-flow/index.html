<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>P03 Low-Fi Flow</title><style>body{font:16px system-ui;margin:20px}nav a{margin-right:18px}.box{border:2px solid #222;padding:14px;margin:12px 0}.project-nav a{margin-right:10px}</style></head><body><nav><a href="#/today" data-id="nav-today">今天</a><a href="#/projects" data-id="nav-projects">项目</a><a href="#/search" data-id="nav-search">搜索</a><select id="switch"><option value="">切换项目</option><option>P03</option><option>P04</option></select></nav><main id="app"></main><script>
const P={P03:{name:'VF Forge',state:'UA Flow Rework',production:'1.35.4',working:'1.36.0',candidate:'—',block:'等待 MASTER UA FLOW REVIEW',next:'主控判断 Low-Fi Flow 是否通过 UA Gate',why:'工程已封板；先解决 Context Continuity。'},P04:{name:'VF Infra',state:'稳定运营',production:'2.6.0',working:'2.6.0',candidate:'—',block:'当前无用户阻断',next:'继续维护计划，不需要用户操作',why:'正式版稳定，围绕个人基础设施运营。'}};const a=document.getElementById('app');
function head(c){let p=P[c];return `<section data-project-context="${c}"><h1>${c} · ${p.name}</h1><p data-id="state">当前状态：${p.state}</p><p data-id="versions">正式运行 ${p.production} · 开发版本 ${p.working} · 候选版本 ${p.candidate}</p><p data-id="block">当前阻断：${p.block}</p><p data-id="next"><b>PRIMARY NEXT ACTION：</b>${p.next}</p><p data-id="why">为什么停在这里：${p.why}</p><nav class="project-nav"><a href="#/project/${c}/timeline" data-id="timeline">最近变化</a><a href="#/project/${c}/decisions" data-id="decisions">重要决定</a><a href="#/project/${c}/files" data-id="files">正式文件</a><a href="#/project/${c}/authority" data-id="authority">外部来源</a><a href="#/project/${c}/versions" data-id="versions-link">版本</a><a href="#/project/${c}/project-search" data-id="project-search">项目内搜索</a></nav></section>`}
function render(){let h=location.hash||'#/today',s=h.slice(2).split('/');if(s[0]==='today')a.innerHTML=`<h1>今天</h1><div class="box" data-id="needs-user">需要我处理：P03 等待 MASTER UA FLOW REVIEW <a data-id="focus-P03" href="#/project/P03/overview">打开 P03</a></div><div class="box" data-id="focus">当前重点：P03 · 正式运行 1.35.4 · 开发版本 1.36.0 · 下一步：MASTER UA FLOW REVIEW</div>`;else if(s[0]==='projects')a.innerHTML=`<h1>项目</h1><div class="box"><a data-id="open-P03" href="#/project/P03/overview">P03 · VF Forge</a></div><div class="box"><a data-id="open-P04" href="#/project/P04/overview">P04 · VF Infra</a></div>`;else if(s[0]==='project'){let c=s[1],v=s[2]||'overview';let body=v==='timeline'?`<div data-id="important-change">Source Exact 完成 <a data-id="event-related" href="#/project/${c}/decisions">相关决定</a></div>`:v==='decisions'?`<div data-id="decision">决定：先过 UA Flow Gate；原因：不包装错误 IA。</div>`:v==='files'?`<div data-id="file">V1.35.4 正式 Release · Canonical Authority: GitHub Release</div>`:v==='authority'?`<div data-id="authority-detail">源码 Git / Release / Evidence</div>`:v==='versions'?`<div data-id="version-detail">正式运行 ${P[c].production} / 开发版本 ${P[c].working}</div>`:v==='project-search'?`<div data-id="project-result">memory-api · ${c} · 事件/决定/版本/Evidence <a data-id="search-all" href="#/search">搜索全部项目</a></div>`:`<div data-id="context-recovery">现在在哪 / 为什么在这里 / 下一步是什么</div>`;a.innerHTML=head(c)+body}else if(s[0]==='search-chain')a.innerHTML=`<h1>memory-api 关联链</h1><div data-id="chain">事件 → 决定 → 版本 1.35.4 → Evidence / Authority</div><a data-id="open-P03-context" href="#/project/P03/overview">进入 P03 Context</a>`;else a.innerHTML=`<h1>搜索</h1><input aria-label="搜索" value="memory-api"><div class="box" data-id="search-result">[事件] P03 · memory-api Source Exact <a data-id="event-result" href="#/search-chain/memory-api">查看关联链</a></div>`}
document.getElementById('switch').onchange=e=>{if(e.target.value)location.hash='#/project/'+e.target.value+'/overview';e.target.value=''};addEventListener('hashchange',render);render();
</script></body></html>
