services:
  db:
    image: mariadb:11.8.8
    environment:
      MARIADB_DATABASE: vf_test
      MARIADB_USER: vf_runner
      MARIADB_PASSWORD: vf_runner_ephemeral
      MARIADB_ROOT_PASSWORD: vf_root_ephemeral
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:7.0.2-php8.4-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: vf_runner
      WORDPRESS_DB_PASSWORD: vf_runner_ephemeral
      WORDPRESS_DB_NAME: vf_test
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'development');
        define('DISALLOW_FILE_EDIT', true);
    ports:
      - "127.0.0.1:${VF_HTTP_PORT:-18080}:80"
    volumes:
      - wp_data:/var/www/html

volumes:
  db_data:
  wp_data:

