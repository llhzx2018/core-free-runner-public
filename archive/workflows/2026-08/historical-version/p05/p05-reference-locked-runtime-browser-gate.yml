name: P05 Reference-Locked Runtime Browser Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'evidence/triggers/p05-reference-runtime-browser.txt'

permissions:
  contents: read

env:
  PRODUCT_REPOSITORY: llhzx2018/vf-seo
  EXPECTED_COMMIT: f1d74810582668c71d23dbd9a97ddc497813babe
  EXPECTED_TREE: 56f52f938b62215f24af6f1a56dc5d294b2e2b6c
  EXPECTED_VERSION: 1.0.0
  PORT: '3105'
  VF_DATABASE_PROVIDER: sqlite
  VF_SQLITE_BUSY_TIMEOUT_MS: '5000'
  VF_ADMIN_USERNAME: admin
  VF_ADMIN_PASSWORD: P05-Browser-Gate-2026!
  NODE_ENV: test
  VF_SECURE_COOKIES: 'false'
  VF_REQUIRE_HTTPS: 'false'
  VF_TRUST_PROXY: 'false'

jobs:
  browser-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Existing private read credential gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'PRIVATE_READ_CREDENTIAL=VF_PRIVATE_READ_TOKEN'
          echo 'NEW_CREDENTIAL=NO'
          echo 'NEW_RUNNER=NO'

      - name: Checkout exact runtime recovery source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.PRODUCT_REPOSITORY }}
          ref: ${{ env.EXPECTED_COMMIT }}
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product

      - name: Exact source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git -C product rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(tr -d '\r\n' < product/VERSION)" = "$EXPECTED_VERSION"
          echo 'SOURCE_IDENTITY=PASS'

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: product/package-lock.json

      - name: Install and build exact source
        working-directory: product
        run: |
          set -Eeuo pipefail
          npm ci
          npm run build

      - name: Prepare fresh SQLite runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "VF_SQLITE_PATH=${RUNNER_TEMP}/vf-seo-browser.sqlite3" >> "$GITHUB_ENV"
          echo "VF_BACKUP_DIR=${RUNNER_TEMP}/vf-seo-backups" >> "$GITHUB_ENV"
          echo "VF_MASTER_KEY_BASE64=$(node -e \"console.log(require('node:crypto').randomBytes(32).toString('base64'))\")" >> "$GITHUB_ENV"

      - name: Fresh migration schema and admin
        working-directory: product
        run: |
          set -Eeuo pipefail
          npm run migrate
          npm run verify:schema
          npm run bootstrap:admin
          npm run verify:admin-ready
          echo 'SQLITE_FRESH_RUNTIME=PASS'

      - name: Start Node runtime
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          nohup npm start > "${RUNNER_TEMP}/p05-server.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/p05-server.pid"
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${PORT}/api/health" >/tmp/p05-health.json; then break; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:${PORT}/api/health" | tee /tmp/p05-health.json
          grep -q '"ok":true' /tmp/p05-health.json
          echo 'NODE_RUNTIME_BOOT=PASS'

      - name: Seed owner-review fixture through existing APIs
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "${RUNNER_TEMP}/seed.mjs" <<'NODE'
          const base='http://127.0.0.1:3105';
          const password='P05-Browser-Gate-2026!';
          const login=await fetch(base+'/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:'admin',password})});
          if(!login.ok) throw new Error('LOGIN_'+login.status);
          const cookie=(login.headers.get('set-cookie')??'').split(';',1)[0];
          const lb=await login.json(); const csrf=lb.csrfToken;
          async function req(path,method='GET',body){
            const r=await fetch(base+path,{method,headers:{cookie,'content-type':'application/json','x-csrf-token':csrf},body:body===undefined?undefined:JSON.stringify(body)});
            const text=await r.text(); let j={}; try{j=JSON.parse(text)}catch{}
            if(!r.ok) throw new Error(`${method} ${path} ${r.status} ${text.slice(0,240)}`);
            return j;
          }
          let x=await req('/api/projects','POST',{name:'Owner Review Fixture'}); const projectId=x.project.id;
          x=await req('/api/websites','POST',{projectId,name:'Kewaro Owner Review',url:'https://example.test/',businessValue:'HIGH',language:'zh-CN',countryCode:'US',siteType:'CONTENT'}); const websiteId=x.website.id;

          x=await req('/api/providers/accounts','POST',{provider:'GSC',externalAccountId:'owner-review@example.test',displayName:'GSC Owner Review'}); const gscAccount=x.account.id;
          x=await req(`/api/providers/accounts/${gscAccount}/discover`,'POST',{kind:'GSC'}); const propertyId=x.properties[0].id;
          x=await req('/api/data-sources','POST',{websiteId,propertyId}); const sourceId=x.dataSource.id;
          await req(`/api/data-sources/${sourceId}/sync`,'POST',{from:'2026-08-12',to:'2026-08-14'});
          await req(`/api/opportunities/rebuild/${websiteId}`,'POST',{});
          await req(`/api/alerts/rebuild/${websiteId}`,'POST',{});

          await req('/api/audit/single','POST',{websiteId,url:'https://example.test/seo',status:200,html:'<html><head><meta name="description" content="SEO page"></head><body><h1>SEO</h1></body></html>'});
          await req('/api/audit/single','POST',{websiteId,url:'https://example.test/start',status:200,html:'<html><head><title>Start</title></head><body><h1>Start</h1></body></html>'});
          await req('/api/audit/single','POST',{websiteId,url:'https://example.test/library',status:200,html:'<html><head><title>Library</title><meta name="description" content="Library"></head><body>Library content</body></html>'});
          await req('/api/changes','POST',{websiteId,changeType:'TITLE_CHANGE',description:'Owner review fixture title change'});
          await req(`/api/opportunities/rebuild/${websiteId}`,'POST',{});
          await req(`/api/alerts/rebuild/${websiteId}`,'POST',{});
          console.log('FIXTURE_WEBSITE_ID='+websiteId);
          console.log('OWNER_REVIEW_FIXTURE=PASS');
          NODE
          node "${RUNNER_TEMP}/seed.mjs"

      - name: Install isolated browser harness
        shell: bash
        run: |
          set -Eeuo pipefail
          HARNESS="${RUNNER_TEMP}/p05-browser-harness"
          mkdir -p "$HARNESS"
          cd "$HARNESS"
          npm init -y >/dev/null
          npm install --no-audit --no-fund puppeteer-core@24.16.0 >/dev/null
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          echo "BROWSER_HARNESS=$HARNESS" >> "$GITHUB_ENV"
          "$CHROME" --version

      - name: Desktop and mobile owner-workflow browser gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "${BROWSER_HARNESS}/gate.mjs" <<'NODE'
          import puppeteer from 'puppeteer-core';
          import assert from 'node:assert/strict';

          const base='http://127.0.0.1:3105';
          const browser=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          const page=await browser.newPage();
          const consoleErrors=[]; const pageErrors=[]; const apiFailures=[];
          page.on('console',msg=>{ if(msg.type()==='error') consoleErrors.push(msg.text()); });
          page.on('pageerror',err=>pageErrors.push(String(err)));
          page.on('response',res=>{ const u=res.url(); if(u.includes('/api/') && res.status()>=400) apiFailures.push(`${res.status()} ${u}`); });

          async function textIncludes(value){return await page.evaluate(v=>document.body.innerText.includes(v),value);}
          async function clickText(selector,text){
            const ok=await page.evaluate(({selector,text})=>{const el=[...document.querySelectorAll(selector)].find(x=>(x.textContent??'').trim()===text); if(!el)return false;(el).click();return true;},{selector,text});
            assert.equal(ok,true,`missing clickable ${text}`); await new Promise(r=>setTimeout(r,550));
          }
          async function assertNoOverflow(label){
            const m=await page.evaluate(()=>({innerWidth:window.innerWidth,scrollWidth:document.documentElement.scrollWidth,bodyWidth:document.body.scrollWidth}));
            assert.ok(m.scrollWidth<=m.innerWidth+2,`${label} document overflow ${JSON.stringify(m)}`);
            assert.ok(m.bodyWidth<=m.innerWidth+2,`${label} body overflow ${JSON.stringify(m)}`);
          }

          await page.setViewport({width:1440,height:1000,deviceScaleFactor:1});
          await page.goto(base,{waitUntil:'networkidle2'});
          await page.type('input[autocomplete="username"]','admin');
          await page.type('input[autocomplete="current-password"]','P05-Browser-Gate-2026!');
          await Promise.all([page.click('button.primary'),page.waitForNetworkIdle({idleTime:500,timeout:10000})]);
          await page.waitForSelector('.workspace-shell',{timeout:10000});
          assert.ok(await textIncludes('Kewaro Owner Review'));
          for(const label of ['概览','网站检查','关键词','页面','AI / AEO','变更记录','设置','全局搜索','备份与恢复','系统状态']) assert.ok(await textIncludes(label),`missing ${label}`);
          const primaryLabels=await page.$$eval('.site-nav button',els=>els.map(x=>(x.textContent??'').trim()));
          assert.deepEqual(primaryLabels,['概览','网站检查','关键词','页面','AI / AEO','变更记录','设置']);
          assert.ok(!primaryLabels.includes('Opportunities'));
          assert.ok(!primaryLabels.includes('Operations'));
          for(const label of ['SEO 健康度','搜索流量趋势','关键词趋势','AI 可见度','Top Keywords','Errors','Warnings','Last Audit','NEEDS ATTENTION']) assert.ok(await textIncludes(label),`overview missing ${label}`);
          await assertNoOverflow('desktop-overview');

          await clickText('.site-nav button','网站检查');
          for(const label of ['Health','Priority','Issue','Affected Pages','Fix','Verify']) assert.ok(await textIncludes(label),`audit missing ${label}`);
          await page.waitForSelector('.issue-row',{timeout:10000});
          await page.click('.issue-row'); await new Promise(r=>setTimeout(r,400));
          for(const q of ['1. 发生什么？','2. 为什么重要？','3. 影响什么？','4. 怎么处理？','5. 处理后如何确认？']) assert.ok(await textIncludes(q),`issue detail missing ${q}`);
          await assertNoOverflow('desktop-issue-detail');

          await clickText('.site-nav button','关键词');
          for(const label of ['Movement','Landing Page','Evidence','Owner Action']) assert.ok(await textIncludes(label),`keywords missing ${label}`);
          await page.waitForSelector('.keyword-row',{timeout:10000});
          assert.ok((await page.$$('.keyword-row')).length>0,'keyword rows absent');
          await assertNoOverflow('desktop-keywords');

          await clickText('.site-nav button','AI / AEO');
          for(const label of ['Engine','Prompt','Mention / Citation','Source','Change','Owner Action','未接入']) assert.ok(await textIncludes(label),`AI missing ${label}`);
          const aiValue=await page.$eval('.metrics-grid .metric-card:first-child strong',el=>(el.textContent??'').trim());
          assert.equal(aiValue,'未接入');
          await assertNoOverflow('desktop-ai');

          await clickText('.site-nav button','页面');
          await page.waitForSelector('.page-row',{timeout:10000});
          await assertNoOverflow('desktop-pages');

          await page.setViewport({width:390,height:844,deviceScaleFactor:1});
          await page.goto(base,{waitUntil:'networkidle2'});
          await page.waitForSelector('.workspace-shell',{timeout:10000});
          assert.ok(await textIncludes('当前网站'));
          const selectorVisible=await page.$eval('.site-context select',el=>{const r=el.getBoundingClientRect();return r.width>0&&r.height>0;});
          assert.equal(selectorVisible,true,'mobile site switch missing');
          await assertNoOverflow('mobile-overview');

          await clickText('.site-nav button','网站检查');
          await page.waitForSelector('.issue-row',{timeout:10000});
          await assertNoOverflow('mobile-audit');
          const issueWidth=await page.$eval('.issue-row',el=>el.getBoundingClientRect().right-window.innerWidth);
          assert.ok(issueWidth<=2,`mobile issue row clipped ${issueWidth}`);

          await clickText('.site-nav button','关键词');
          await page.waitForSelector('.keyword-row',{timeout:10000});
          await assertNoOverflow('mobile-keywords');
          const keywordWidth=await page.$eval('.keyword-row',el=>el.getBoundingClientRect().right-window.innerWidth);
          assert.ok(keywordWidth<=2,`mobile keyword row clipped ${keywordWidth}`);

          await clickText('.site-nav button','AI / AEO');
          assert.ok(await textIncludes('未接入'));
          await assertNoOverflow('mobile-ai');

          await clickText('.site-nav button','页面');
          await page.waitForSelector('.page-row',{timeout:10000});
          await assertNoOverflow('mobile-pages');

          assert.deepEqual(pageErrors,[],`PAGE_ERRORS ${JSON.stringify(pageErrors)}`);
          assert.deepEqual(apiFailures,[],`API_FAILURES ${JSON.stringify(apiFailures)}`);
          const criticalConsole=consoleErrors.filter(x=>!x.includes('favicon'));
          assert.deepEqual(criticalConsole,[],`CONSOLE_ERRORS ${JSON.stringify(criticalConsole)}`);

          console.log('DESKTOP_1440=PASS');
          console.log('MOBILE_390=PASS');
          console.log('SITE_CONTEXT=PASS');
          console.log('PRIMARY_IA=PASS');
          console.log('OPPORTUNITIES_PRIMARY_NAV=ABSENT');
          console.log('OPERATIONS_PRIMARY_NAV=ABSENT');
          console.log('DASHBOARD_HEALTH_CHANGE_ATTENTION_ACTION=PASS');
          console.log('AUDIT_ACTION_LOOP=PASS');
          console.log('ISSUE_DETAIL_FIVE_QUESTION=PASS');
          console.log('KEYWORD_MOVEMENT_MODEL=PASS');
          console.log('AI_AEO_EXPLAINABILITY=PASS');
          console.log('AI_FAKE_SCORE=ABSENT');
          console.log('MOBILE_HORIZONTAL_OVERFLOW=0');
          console.log('BROWSER_CONSOLE_ERRORS=0');
          console.log('API_FAILURES=0');
          await browser.close();
          NODE
          cd "$BROWSER_HARNESS"
          node gate.mjs

      - name: Final browser gate boundary
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f "${RUNNER_TEMP}/p05-server.pid" ]; then kill "$(cat "${RUNNER_TEMP}/p05-server.pid")" 2>/dev/null || true; fi
          echo 'RUNTIME_CHANGE=UI_ONLY'
          echo 'VERSION_CHANGE=NO'
          echo 'DATABASE_SCHEMA_PROVIDER_CHANGE=NO'
          echo 'PRODUCTION_WRITE=NO'
          echo 'CANDIDATE=NOT_AUTHORIZED'
          echo 'RELEASE=NOT_AUTHORIZED'
          echo 'PRODUCTION_DEPLOYMENT=NOT_AUTHORIZED'
