name: P04 VF Infra V2.5.8 Test Fix 02

on:
  push:
    paths:
      - '.github/workflows/p04-v258-test-fix-02.yml'

permissions:
  contents: read

env:
  TARGET_REPOSITORY: llhzx2018/vf-infra
  TARGET_BRANCH: feature/v2.5.8-personal-console-precision
  INPUT_COMMIT: 29d54486231a4ed06febaf2e777adbd4e15b5ba1

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.INPUT_COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 1
          path: private-vf-infra

      - name: Correct active-view E2E selector
        shell: bash
        working-directory: private-vf-infra
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$INPUT_COMMIT"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/e2e/v258-personal-console.mjs')
          s=p.read_text(encoding='utf-8')
          old="await page.locator('.v257-resource-item',{hasText:f.near}).click();"
          new="await page.locator('#view-assets .v257-resource-item',{hasText:f.near}).click();"
          if s.count(old) != 1: raise SystemExit('V258_ASSETS_E2E_SELECTOR_ANCHOR_INVALID')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check tests/e2e/v258-personal-console.mjs
          grep -q "#view-assets .v257-resource-item" tests/e2e/v258-personal-console.mjs
          echo 'P04_V258_E2E_ACTIVE_VIEW_SELECTOR_PASS'

      - name: Commit test correction and push non-force
        shell: bash
        working-directory: private-vf-infra
        run: |
          set -Eeuo pipefail
          git config user.name 'VF Candidate Test Fix'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/e2e/v258-personal-console.mjs
          git diff --cached --check
          git commit -m 'test(P04): scope assets E2E selector to active view'
          OUTPUT_COMMIT="$(git rev-parse HEAD)"
          OUTPUT_TREE="$(git rev-parse HEAD^{tree})"
          git push origin "HEAD:$TARGET_BRANCH"
          printf '%s\n%s\n' "$OUTPUT_COMMIT" "$OUTPUT_TREE" > "$RUNNER_TEMP/p04-v258-test-fix-02.txt"

      - name: Remote readback
        shell: bash
        working-directory: private-vf-infra
        run: |
          set -Eeuo pipefail
          OUTPUT_COMMIT="$(sed -n '1p' "$RUNNER_TEMP/p04-v258-test-fix-02.txt")"
          OUTPUT_TREE="$(sed -n '2p' "$RUNNER_TEMP/p04-v258-test-fix-02.txt")"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$OUTPUT_COMMIT"
          echo "Output Commit: $OUTPUT_COMMIT"
          echo "Output Tree: $OUTPUT_TREE"
          echo 'P04_V258_TEST_FIX_02_REMOTE_READBACK_PASS'

      - name: Remove private worktree
        if: always()
        shell: bash
        run: rm -rf private-vf-infra
