name: P04 V2.7.4 Runtime Consolidation Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'p04-v274-runtime-trigger.txt'

permissions:
  contents: read

concurrency:
  group: p04-v274-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact V2.7.4 working source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: feature/v2.7.4-ui-stability-performance
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product

      - name: Static and release-tree gates
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          TESTED_SHA="$(git rev-parse HEAD)"
          echo "TESTED_SHA=$TESTED_SHA" >> "$GITHUB_ENV"
          test "$(tr -d '\r\n' < VERSION)" = '2.7.4'
          test ! -d database/migrations/15
          php -l public/index.php
          php -l public/settings-section.php
          php -l public/api.php
          node --check public/assets/v274-performance-bridge.js
          node --check public/assets/v271-unified-shell.js
          node --check tests/e2e/v274-runtime-consolidation-v2.mjs
          ! grep -q 'src="assets/v270-reference-lock.js' public/index.php
          grep -q 'v274-performance-bridge.js' public/index.php
          grep -q 'backup_status' public/settings-section.php
          RUNTIME="$RUNNER_TEMP/p04-v274-runtime"
          python3 scripts/build-release-tree.py "$RUNTIME" | tee "$RUNNER_TEMP/v274-release-tree.json"
          test "$(tr -d '\r\n' < "$RUNTIME/VERSION.txt")" = '2.7.4'
          python3 - <<'PY'
          import json, os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'p04-v274-runtime','release-manifest.json'),encoding='utf-8'))
          assert d['version']=='2.7.4' and d['target_schema']==14
          print('P04_V274_RELEASE_TREE_PASS',d['file_count'],d['source_fingerprint'])
          PY
          echo "VF_INFRA_E2E_WEB_ROOT=$RUNTIME" >> "$GITHUB_ENV"

      - name: Install browser/runtime dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-curl php-zip >/dev/null
          cd product
          npm install --no-save --no-package-lock playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          RUNTIME="$RUNNER_TEMP/p04-v274-runtime"
          php -d opcache.enable_cli=0 -d opcache.jit=0 -S 127.0.0.1:18997 -t "$RUNTIME" >"$RUNNER_TEMP/p04-v274-php.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/p04-v274-php.pid"
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:18997/setup.php >/dev/null && break; sleep .25; done
          curl -fsS http://127.0.0.1:18997/setup.php >/dev/null

      - name: Run real Chromium consolidation gate
        shell: bash
        env:
          VF_INFRA_E2E_BASE_URL: http://127.0.0.1:18997
          VF_INFRA_E2E_ADMIN_CREDENTIAL: P04-V274-Synthetic-Review-Only-9261!
          VF_V274_EVIDENCE_DIR: ${{ runner.temp }}/p04-v274-evidence
          VF_V274_TESTED_RUNTIME_COMMIT: ${{ env.TESTED_SHA }}
        run: |
          set -Eeuo pipefail
          cd product
          node tests/e2e/v274-runtime-consolidation-v2.mjs
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ['VF_V274_EVIDENCE_DIR'],'V274_RUNTIME_CONSOLIDATION_REPORT.json')
          d=json.load(open(p,encoding='utf-8'))
          assert d['status']=='PASS', d
          assert len(d['screenshots'])==12, d['screenshots']
          assert not d['page_errors'], d['page_errors']
          assert not d['console_errors'], d['console_errors']
          print('P04_V274_BROWSER_GATE_PASS')
          PY

      - name: Collect evidence
        if: always()
        shell: bash
        run: |
          set +e
          E="$RUNNER_TEMP/p04-v274-evidence"
          mkdir -p "$E"
          cp "$RUNNER_TEMP/v274-release-tree.json" "$E/" 2>/dev/null
          cp "$RUNNER_TEMP/p04-v274-php.log" "$E/" 2>/dev/null
          cd "$E" || exit 0
          sha256sum *.png > SHA256SUMS 2>/dev/null || true

      - name: Upload V2.7.4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P04-V2.7.4-RUNTIME-CONSOLIDATION-GATE
          path: ${{ runner.temp }}/p04-v274-evidence
          if-no-files-found: warn
          retention-days: 30
