name: P04 VF Infra V2.5.8 Browser Verify R2

on:
  push:
    paths:
      - '.github/workflows/p04-v258-browser-verify-r2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REPOSITORY: llhzx2018/vf-infra
  TARGET_COMMIT: 08424721273818f5e05a8a208cd679f2f994d48e
  TARGET_TREE: ffda74bc28932b3723bbf09bdc4974322cadcf3d

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-vf-infra
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring
          coverage: none
      - name: Exact identity
        shell: bash
        working-directory: private-vf-infra
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(tr -d '\r\n' < VERSION)" = '2.5.8'
          node --check tests/e2e/v258-personal-console.mjs
      - name: Install Browser
        shell: bash
        working-directory: private-vf-infra
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Browser responsive security backup restore
        shell: bash
        working-directory: private-vf-infra
        run: |
          set -Eeuo pipefail
          bash scripts/run-v258-browser-gate.sh
          echo 'P04_V258_BROWSER_VERIFY_R2_PASS'
      - name: Cleanup private source
        if: always()
        shell: bash
        run: rm -rf private-vf-infra
