name: P04 V2.7.4 Observable Runtime Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'requests/p04-v274-observable-*.txt'

permissions:
  contents: read

concurrency:
  group: p04-v274-observable-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Require registered private read credential
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || { echo 'VF_PRIVATE_READ_TOKEN_MISSING' >&2; exit 78; }

      - name: Checkout exact P04 candidate ephemerally
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-infra
          ref: 1d748ede7a1ba3e161083a4c34ce420f61ad30d3
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p04

      - name: Bind exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p04 rev-parse HEAD)" = '1d748ede7a1ba3e161083a4c34ce420f61ad30d3'
          test "$(tr -d '\r\n' < p04/VERSION)" = '2.7.4'
          git -C p04 merge-base --is-ancestor fe0f364c7da7a4592c21a9cc36eb6a8f9563c505 HEAD
          echo 'SOURCE_IDENTITY=PASS'
          echo 'V273_ANCESTRY=PASS'

      - name: Repository health
        shell: bash
        working-directory: p04
        run: |
          set -Eeuo pipefail
          python scripts/repository-health-gate.py
          python scripts/check-migrations.py
          test ! -e database/migrations/015_

      - name: Prepare PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Chromium
        shell: bash
        working-directory: p04
        run: |
          set -Eeuo pipefail
          npm install --no-save --silent playwright
          npx playwright install --with-deps chromium >/dev/null

      - name: Run V2.7.4 runtime/browser consolidation
        shell: bash
        working-directory: p04
        env:
          VF_V274_TESTED_RUNTIME_COMMIT: 1d748ede7a1ba3e161083a4c34ce420f61ad30d3
          VF_V274_EVIDENCE_DIR: ${{ runner.temp }}/p04-v274-evidence
        run: |
          set -Eeuo pipefail
          bash scripts/run-v274-runtime-consolidation-gate.sh
          test -f "$VF_V274_EVIDENCE_DIR/V274_RUNTIME_CONSOLIDATION_REPORT.json"
          echo 'P04_V274_RUNTIME_BROWSER_GATE=PASS'

      - name: Public persistence boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'PRIVATE_SOURCE_PERSISTED_TO_PUBLIC_REPO=NO'
          echo 'PRODUCTION_WRITE=0'
