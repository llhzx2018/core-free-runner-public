name: P04 VF Infra V2.7.7 Rollback Candidate PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'requests/p04-v277-rollback-*.txt'
      - 'requests/p04-v277-formal-release-*.txt'

permissions:
  contents: read

concurrency:
  group: p04-v277-rollback-candidate-pr
  cancel-in-progress: true

env:
  SOURCE_REPOSITORY: llhzx2018/vf-infra
  SOURCE_COMMIT: 'a4d8b91d64a5c0df7685eac8b44af896f1ec6ff8'
  SOURCE_TREE: '57109ca42abb71e9d4943761690d53e66d0240ff'
  TARGET_VERSION: '2.7.7'
  SOURCE_VERSION: '2.7.6'
  SCHEMA: '14'

jobs:
  recovery-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Credential gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || { echo 'VF_PRIVATE_READ_TOKEN_MISSING' >&2; exit 78; }

      - name: Checkout exact V2.7.7 Recovery Candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_COMMIT }}
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate

      - name: Exact rollback identity and V2.7.5 UI authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(tr -d '\r\n' < candidate/VERSION)" = "$TARGET_VERSION"
          test ! -e candidate/database/migrations/015_\*
          ! grep -Fq 'v276-responsive-loading.css' candidate/public/index.php
          ! grep -Fq 'v276-responsive-loading.js' candidate/public/index.php
          ! grep -Fq 'MutationObserver' candidate/public/assets/v276-responsive-loading.js
          ! grep -Fq 'v276-progress-track' candidate/public/assets/v276-responsive-loading.js
          ! grep -Fq '@media(max-width' candidate/public/assets/v276-responsive-loading.css
          git -C candidate diff --exit-code v2.7.5 -- \
            public/index.php \
            public/assets/v270-personal-infra.css public/assets/v270-reference-lock.css public/assets/v270-reference-lock.js \
            public/assets/v270-final-polish.css public/assets/v270-final-polish.js \
            public/assets/v271-unified-shell.css public/assets/v271-unified-shell.js \
            public/assets/v272-backend-detail-ux.css public/assets/v272-backend-detail-ux.js public/assets/v272-copy-polish.js \
            public/assets/v273-typography-rhythm.css public/assets/v273-readable-floor.css \
            public/assets/v274-ui-stability.css public/assets/v274-performance-bridge.js public/assets/v274-owned-route-primer.js \
            public/assets/v275-ua-workflow.css public/assets/v275-ua-workflow.js
          python candidate/scripts/repository-health-gate.py
          python candidate/scripts/check-migrations.py
          echo 'V277_V275_UI_SOURCE_EXACT=PASS'
          echo 'V277_WITHDRAWN_OVERLAY_INACTIVE=PASS'

      - name: Prepare PHP runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring

      - name: Prepare Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install browser runtime
        shell: bash
        working-directory: candidate
        run: |
          set -Eeuo pipefail
          npm install --no-save --silent playwright
          npx playwright install --with-deps chromium >/dev/null

      - name: Re-run V2.7.5 owner workflow on V2.7.7 runtime
        shell: bash
        working-directory: candidate
        env:
          VF_V275_TESTED_RUNTIME_COMMIT: ${{ env.SOURCE_COMMIT }}
          VF_V275_EVIDENCE_DIR: ${{ runner.temp }}/p04-v277-ui
        run: |
          set -Eeuo pipefail
          sed -i "s/'2.7.5'/'2.7.7'/g; s/=='2.7.5'/=='2.7.7'/g; s/\['version'\]=='2.7.5'/['version']=='2.7.7'/g; s/\['release_kind'\]=='maintenance_release'/['release_kind']=='runtime_source'/g" scripts/run-v275-ua-workflow-gate.sh
          sed -i "s/2\.7\.5/2.7.7/g" tests/e2e/v275-ua-workflow-v2.mjs
          bash scripts/run-v275-ua-workflow-gate.sh | tee "$RUNNER_TEMP/p04-v277-ui.log"
          grep -Fxq 'P04_V275_UA_WORKFLOW_GATE_PASS' "$RUNNER_TEMP/p04-v277-ui.log"
          echo 'V277_V275_OWNER_WORKFLOW_BROWSER=PASS'

      - name: Build V2.7.7 recovery artifacts
        shell: bash
        working-directory: candidate
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/p04-v277-artifacts"
          python scripts/build-v277-candidate-artifacts.py --output "$OUT" | tee "$RUNNER_TEMP/p04-v277-build.log"
          grep -Fxq 'P04_V277_RECOVERY_ARTIFACT_PRE_GATE_PASS' "$RUNNER_TEMP/p04-v277-build.log"
          php "$OUT/update-set/repair-v2.7.7.php" --self-test | tee "$RUNNER_TEMP/p04-v277-atomic.log"
          grep -Fq 'ATOMIC_SELF_TEST_PASS' "$RUNNER_TEMP/p04-v277-atomic.log"
          echo "ARTIFACT_DIR=$OUT" >> "$GITHUB_ENV"

      - name: Download immutable V2.7.6 FULL
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/v276"
          gh release download v2.7.6 -R llhzx2018/vf-infra --pattern 'VF_Infra_V2.7.6_FULL.zip' --dir "$RUNNER_TEMP/v276"
          test -s "$RUNNER_TEMP/v276/VF_Infra_V2.7.6_FULL.zip"

      - name: V2.7.6 to V2.7.7 Source-Exact recovery gate
        shell: bash
        working-directory: candidate
        run: |
          set -Eeuo pipefail
          python scripts/full-runtime-vs-update-result-source-exact-gate.py \
            --baseline-full "$RUNNER_TEMP/v276/VF_Infra_V2.7.6_FULL.zip" \
            --candidate-full "$ARTIFACT_DIR/VF_Infra_V2.7.7_FULL.zip" \
            --candidate-update "$ARTIFACT_DIR/update-set/VF_Infra_V2.7.7_UPDATE.zip" \
            --expected-source-version 2.7.6 \
            --expected-target-version 2.7.7
          echo 'V277_FULL_RUNTIME_VS_UPDATE_SOURCE_EXACT=PASS'

      - name: Emit recovery Candidate identity
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['ARTIFACT_DIR'])
          full=root/'VF_Infra_V2.7.7_FULL.zip'; update=root/'update-set/VF_Infra_V2.7.7_UPDATE.zip'; atomic=root/'update-set/VF_Infra_V2.7.7_ATOMIC.zip'; repair=root/'update-set/repair-v2.7.7.php'
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          runtime=json.loads((root/'runtime/release-manifest.json').read_text(encoding='utf-8'))
          assert update.read_bytes()==atomic.read_bytes()
          assert sha(full)=='17bc5ad7154ae9fcf6101eb7b3c2740e6c217f6871f37306644638e96fb2bdc7'
          assert sha(update)=='92824bc833e8f56ea651104e98d25669860027e8058ccd4c431bc4da4071b86a'
          assert sha(repair)=='c49716696aa1a84d6c61efcde4fce2d4192189064db8511d66c50c550a29a8c5'
          assert runtime['source_fingerprint']=='bdd779bbc703569fa2ae76aeb8aa7821fa412a03249424dd55345e732fbcd828'
          print('P04_V277_RECOVERY_CANDIDATE_GATE=PASS')
          print('FULL_SHA256='+sha(full)); print('UPDATE_SHA256='+sha(update)); print('REPAIR_SHA256='+sha(repair))
          print('RUNTIME_FINGERPRINT='+runtime['source_fingerprint'])
          PY

      - name: Require formal release capability
        if: contains(github.event.pull_request.title, 'formal rollback recovery release')
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN" || { echo 'VF_RELEASE_WRITE_TOKEN_MISSING' >&2; exit 79; }
          GH_TOKEN="$RELEASE_TOKEN" gh release view v2.7.7 -R "$SOURCE_REPOSITORY" >/dev/null 2>&1 && { echo 'V277_RELEASE_ALREADY_EXISTS' >&2; exit 80; } || true
          echo 'V277_FORMAL_RELEASE_CAPABILITY=PASS'

      - name: Publish V2.7.7 GitHub recovery release
        if: contains(github.event.pull_request.title, 'formal rollback recovery release')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release create v2.7.7 -R "$SOURCE_REPOSITORY" --target "$SOURCE_COMMIT" --title 'VF Infra V2.7.7' --notes 'V2.7.7 紧急体验恢复：恢复 OWNER 已接受的 V2.7.5 UA/UI；撤销 V2.7.6 全局响应式、每页进度条与 Skeleton Overlay。Schema 14，无 Migration；Provider 继续 READ-ONLY FIRST。仅支持 V2.7.6 → V2.7.7。' "$ARTIFACT_DIR/VF_Infra_V2.7.7_FULL.zip" "$ARTIFACT_DIR/update-set/VF_Infra_V2.7.7_UPDATE.zip" "$ARTIFACT_DIR/update-set/VF_Infra_V2.7.7_ATOMIC.zip" "$ARTIFACT_DIR/update-set/repair-v2.7.7.php"
          echo 'V277_GITHUB_RELEASE=PASS'

      - name: Publish V2.7.7 core-updates authority
        if: contains(github.event.pull_request.title, 'formal rollback recovery release')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$SOURCE_REPOSITORY/releases/tags/v2.7.7" > "$RUNNER_TEMP/release.json"
          release_id="$(jq -r .id "$RUNNER_TEMP/release.json")"
          released_at="$(jq -r .published_at "$RUNNER_TEMP/release.json")"
          asset_id="$(jq -r '.assets[] | select(.name=="VF_Infra_V2.7.7_UPDATE.zip") | .id' "$RUNNER_TEMP/release.json")"
          asset_bytes="$(jq -r '.assets[] | select(.name=="VF_Infra_V2.7.7_UPDATE.zip") | .size' "$RUNNER_TEMP/release.json")"
          test "$asset_bytes" = '46989'
          jq -n --argjson release_id "$release_id" --argjson asset_id "$asset_id" --argjson asset_bytes "$asset_bytes" --arg released_at "$released_at" '{schema_version:"1.0",project_id:"P04",component_id:"APP",enabled:true,target_version:"2.7.7",update_type:"ATOMIC",from_versions:["2.7.6"],schema_from:"14",schema_to:"14",repository:"llhzx2018/vf-infra",release_tag:"v2.7.7",release_name:"VF Infra V2.7.7",release_id:$release_id,release_product_commit:"a4d8b91d64a5c0df7685eac8b44af896f1ec6ff8",release_product_tree:"57109ca42abb71e9d4943761690d53e66d0240ff",asset_name:"VF_Infra_V2.7.7_UPDATE.zip",asset_id:$asset_id,asset_bytes:$asset_bytes,asset_sha256:"92824bc833e8f56ea651104e98d25669860027e8058ccd4c431bc4da4071b86a",backup_required:true,rollback_supported:true,released_at:$released_at,minimum_php:"8.0.0",notes:"V2.7.7 Recovery：V2.7.6 已撤回；恢复 V2.7.5 UA/UI，撤销 V2.7.6 全局响应式、每页进度条和 Skeleton Overlay。Schema14，无 Migration；Provider READ-ONLY FIRST。同步专用进度条暂不在恢复版重做。"}' > "$RUNNER_TEMP/P04.json"
          sha="$(gh api repos/llhzx2018/core-updates/contents/projects/P04.json?ref=main --jq .sha)"
          encoded="$(base64 -w0 "$RUNNER_TEMP/P04.json")"
          gh api --method PUT repos/llhzx2018/core-updates/contents/projects/P04.json -f message='release(P04): publish V2.7.7 recovery update' -f content="$encoded" -f sha="$sha" -f branch=main > "$RUNNER_TEMP/core-write.json"
          jq -e '.commit.sha' "$RUNNER_TEMP/core-write.json" >/dev/null
          gh api repos/llhzx2018/core-updates/contents/projects/P04.json?ref=main --jq .content | base64 -d | jq -e '.enabled == true and .target_version == "2.7.7" and .from_versions == ["2.7.6"] and .asset_sha256 == "92824bc833e8f56ea651104e98d25669860027e8058ccd4c431bc4da4071b86a"' >/dev/null
          echo "RELEASE_ID=$release_id"
          echo "UPDATE_ASSET_ID=$asset_id"
          echo 'P04_V277_FORMAL_RELEASE=PASS'
          echo 'ONLINE_UPDATE_AVAILABLE=YES'
          echo 'PRODUCTION_UPGRADE=NOT_EXECUTED'

      - name: Upload ephemeral recovery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P04-V2.7.7-ROLLBACK-CANDIDATE
          path: |
            ${{ runner.temp }}/p04-v277-ui/*.png
            ${{ runner.temp }}/p04-v277-ui/V275_UA_WORKFLOW_REPORT.json
            ${{ runner.temp }}/p04-v277-artifacts/VF_Infra_V2.7.7_FULL.zip
            ${{ runner.temp }}/p04-v277-artifacts/update-set/VF_Infra_V2.7.7_UPDATE.zip
            ${{ runner.temp }}/p04-v277-artifacts/update-set/VF_Infra_V2.7.7_ATOMIC.zip
            ${{ runner.temp }}/p04-v277-artifacts/update-set/repair-v2.7.7.php
            ${{ runner.temp }}/p04-v277-artifacts/V277_PACKAGE_MANIFEST.json
            ${{ runner.temp }}/p04-v277-artifacts/V277_SHA256SUMS.txt
          retention-days: 7
