name: P04 VF Infra V2.7.4 Formal Release Current

on:
  push:
    branches: [main]
    paths:
      - 'requests/p04-v274-formal-release-current-*.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p04-v274-formal-release-current
  cancel-in-progress: false

env:
  VERSION: '2.7.4'
  SOURCE_VERSION: '2.7.3'
  SCHEMA: '14'
  CANDIDATE_COMMIT: '3e6a18b893e42467e18913facf286ca2bc420f16'
  CANDIDATE_TREE: '0be764507c0533af82418263f25700d70ed90c72'
  V273_RELEASE_COMMIT: 'fe0f364c7da7a4592c21a9cc36eb6a8f9563c505'
  EXPECTED_FULL_BYTES: '545069'
  EXPECTED_FULL_SHA: '33047f1c4f3d753529d2ca45eae4d119d83902e5f31463eeca856dac8ce22a9f'
  EXPECTED_UPDATE_BYTES: '58480'
  EXPECTED_UPDATE_SHA: '1a65f4c556a954b30c11463e76028bf1ff84a6baf077715f0ea7b954a109c808'
  EXPECTED_REPAIR_SHA: '590a328ffcae963f54c8e06e376f04701d0072e9772689750ca92f73c4fad5b0'
  EXPECTED_RUNTIME_FINGERPRINT: 'c6a6a4fc9e0fc97b291e0420c50a0b8712ded8cc4489c93675490bcf22684a58'

jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout runner evidence authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 1
          path: runner

      - name: Require sealed current runtime and artifact evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          C='runner/evidence/p04/P04_V274_CANDIDATE_LATEST.txt'
          A='runner/evidence/p04/P04_V274_ARTIFACT_LATEST.txt'
          grep -Fxq 'P04_V274_CANDIDATE=PASS' "$C"
          grep -Fxq "SOURCE_SHA=$CANDIDATE_COMMIT" "$C"
          grep -Fxq 'RUNTIME_CONSOLIDATION_GATE=PASS' "$C"
          grep -Fxq 'PAGE_ERROR_COUNT=0' "$C"
          grep -Fxq 'CONSOLE_ERROR_COUNT=0' "$C"
          grep -Fxq 'P04_V274_ARTIFACT_GATE=PASS' "$A"
          grep -Fxq "SOURCE_SHA=$CANDIDATE_COMMIT" "$A"
          grep -Fxq "FULL_SHA256=$EXPECTED_FULL_SHA" "$A"
          grep -Fxq "UPDATE_SHA256=$EXPECTED_UPDATE_SHA" "$A"
          grep -Fxq 'FULL_RUNTIME_VS_UPDATE_SOURCE_EXACT=PASS' "$A"
          echo 'SEALED_CURRENT_V274_EVIDENCE=PASS'

      - name: Unified release credential gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || { echo 'VF_PRIVATE_READ_TOKEN_MISSING' >&2; exit 78; }
          test -n "$WRITE_TOKEN" || { echo 'VF_RELEASE_WRITE_TOKEN_MISSING' >&2; exit 78; }
          echo 'UNIFIED_RELEASE_CREDENTIALS=PASS'

      - name: Checkout exact verified V2.7.4 candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-infra
          ref: ${{ env.CANDIDATE_COMMIT }}
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate

      - name: Verify candidate identity and lineage
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(tr -d '\r\n' < candidate/VERSION)" = "$VERSION"
          git -C candidate merge-base --is-ancestor "$V273_RELEASE_COMMIT" "$CANDIDATE_COMMIT"
          python candidate/scripts/repository-health-gate.py
          python candidate/scripts/check-migrations.py
          test ! -e candidate/database/migrations/015_
          echo 'CANDIDATE_IDENTITY_AND_LINEAGE=PASS'

      - name: Prepare PHP runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring

      - name: Protect V2.7.3 authority and inspect V2.7.4 identity
        shell: bash
        run: |
          set -Eeuo pipefail
          old="$(gh api repos/llhzx2018/vf-infra/releases/tags/v2.7.3)"
          test "$(jq -r '.id' <<<"$old")" = '372090957'
          old_update="$(jq -c '.assets[]|select(.name=="VF_Infra_V2.7.3_UPDATE.zip")' <<<"$old")"
          test "$(jq -r '.size' <<<"$old_update")" = '40548'
          test "$(jq -r '.digest' <<<"$old_update")" = 'sha256:3668d6d7c8fd120e87ff9dabc133723c620bca05a2b692327a659bd573dc9cf6'
          if gh api repos/llhzx2018/vf-infra/git/ref/tags/v2.7.4 > "$RUNNER_TEMP/tag.json" 2>/dev/null; then
            tag_sha="$(jq -r '.object.sha' "$RUNNER_TEMP/tag.json")"
            test "$tag_sha" = "$CANDIDATE_COMMIT" || { echo "V274_TAG_IDENTITY_CONFLICT=$tag_sha" >&2; exit 1; }
            echo 'V274_TAG_ALREADY_EXACT=YES'
          else
            echo 'V274_TAG_ALREADY_EXACT=NO'
          fi

      - name: Rebuild and validate exact formal artifacts
        shell: bash
        working-directory: candidate
        run: |
          set -Eeuo pipefail
          python scripts/build-v274-candidate-artifacts.py --output "$RUNNER_TEMP/p04-v274-release"
          python scripts/validate-v274-candidate-artifacts.py --artifacts "$RUNNER_TEMP/p04-v274-release"
          A="$RUNNER_TEMP/p04-v274-release"
          test "$(stat -c %s "$A/VF_Infra_V2.7.4_FULL.zip")" = "$EXPECTED_FULL_BYTES"
          test "$(sha256sum "$A/VF_Infra_V2.7.4_FULL.zip" | awk '{print $1}')" = "$EXPECTED_FULL_SHA"
          test "$(stat -c %s "$A/update-set/VF_Infra_V2.7.4_UPDATE.zip")" = "$EXPECTED_UPDATE_BYTES"
          test "$(sha256sum "$A/update-set/VF_Infra_V2.7.4_UPDATE.zip" | awk '{print $1}')" = "$EXPECTED_UPDATE_SHA"
          test "$(sha256sum "$A/update-set/repair-v2.7.4.php" | awk '{print $1}')" = "$EXPECTED_REPAIR_SHA"
          fp="$(python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'p04-v274-release/runtime/release-manifest.json'
          print(json.loads(p.read_text(encoding='utf-8'))['source_fingerprint'])
          PY
          )"
          test "$fp" = "$EXPECTED_RUNTIME_FINGERPRINT"
          echo 'FORMAL_REBUILD_MATCHES_VERIFIED_ARTIFACT=PASS'

      - name: Re-run V2.7.3 to V2.7.4 source-exact gate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/v273"
          gh release download v2.7.3 -R llhzx2018/vf-infra --pattern 'VF_Infra_V2.7.3_FULL.zip' --dir "$RUNNER_TEMP/v273"
          python candidate/scripts/full-runtime-vs-update-result-source-exact-gate.py \
            --baseline-full "$RUNNER_TEMP/v273/VF_Infra_V2.7.3_FULL.zip" \
            --candidate-full "$RUNNER_TEMP/p04-v274-release/VF_Infra_V2.7.4_FULL.zip" \
            --candidate-update "$RUNNER_TEMP/p04-v274-release/update-set/VF_Infra_V2.7.4_UPDATE.zip" \
            --expected-source-version 2.7.3 \
            --expected-target-version 2.7.4
          echo 'FORMAL_SOURCE_EXACT=PASS'

      - name: Assemble immutable release asset set
        shell: bash
        run: |
          set -Eeuo pipefail
          A="$RUNNER_TEMP/p04-v274-release"
          D="$RUNNER_TEMP/p04-v274-publish"
          mkdir -p "$D"
          cp "$A/VF_Infra_V2.7.4_FULL.zip" "$D/"
          cp "$A/update-set/VF_Infra_V2.7.4_UPDATE.zip" "$D/"
          cp "$A/update-set/VF_Infra_V2.7.4_ATOMIC.zip" "$D/"
          cp "$A/update-set/repair-v2.7.4.php" "$D/"
          cp "$A/V274_PACKAGE_MANIFEST.json" "$D/"
          cp "$A/V274_SHA256SUMS.txt" "$D/"
          cp "$A/V274_PRODUCTION_SOURCE_MANIFEST_EXPECTED.txt" "$D/"
          test "$(find "$D" -maxdepth 1 -type f | wc -l | tr -d ' ')" = '7'
          echo "PUBLISH_DIR=$D" >> "$GITHUB_ENV"

      - name: Create or resume exact V2.7.4 GitHub Release
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! gh api repos/llhzx2018/vf-infra/git/ref/tags/v2.7.4 >/dev/null 2>&1; then
            git -C candidate remote set-url origin "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-infra.git"
            git -C candidate tag "v$VERSION" "$CANDIDATE_COMMIT"
            git -C candidate push origin "refs/tags/v$VERSION"
          fi
          if ! gh api repos/llhzx2018/vf-infra/releases/tags/v2.7.4 >/dev/null 2>&1; then
            gh release create "v$VERSION" "$PUBLISH_DIR"/* -R llhzx2018/vf-infra --target "$CANDIDATE_COMMIT" --title "VF Infra V$VERSION" --notes-file candidate/docs/operations/package/RELEASE_NOTES.md
          fi
          echo 'V274_RELEASE_CREATE_OR_RESUME=PASS'

      - name: Remote Release exact readback
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api repos/llhzx2018/vf-infra/releases/tags/v2.7.4 > "$RUNNER_TEMP/v274-release.json"
          jq -e --arg c "$CANDIDATE_COMMIT" '.tag_name=="v2.7.4" and .target_commitish==$c and .draft==false and .prerelease==false' "$RUNNER_TEMP/v274-release.json" >/dev/null
          python - <<'PY'
          import hashlib,json,os,pathlib
          r=json.load(open(os.environ['RUNNER_TEMP']+'/v274-release.json'))
          remote={a['name']:a for a in r['assets']}
          d=pathlib.Path(os.environ['PUBLISH_DIR'])
          local={p.name:p for p in d.iterdir() if p.is_file()}
          assert set(remote)==set(local),(set(remote),set(local))
          for n,p in local.items():
              h=hashlib.sha256(p.read_bytes()).hexdigest(); a=remote[n]
              assert int(a['size'])==p.stat().st_size,(n,'bytes')
              assert a.get('digest')=='sha256:'+h,(n,a.get('digest'),h)
          print('V274_REMOTE_RELEASE_ASSET_IDENTITY=PASS')
          PY
          echo "RELEASE_ID=$(jq -r '.id' "$RUNNER_TEMP/v274-release.json")" >> "$GITHUB_ENV"
          echo "PUBLISHED_AT=$(jq -r '.published_at' "$RUNNER_TEMP/v274-release.json")" >> "$GITHUB_ENV"
          echo "UPDATE_ASSET_ID=$(jq -r '.assets[]|select(.name=="VF_Infra_V2.7.4_UPDATE.zip")|.id' "$RUNNER_TEMP/v274-release.json")" >> "$GITHUB_ENV"

      - name: Checkout current core-updates authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: main
          token: ${{ env.WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: updates

      - name: Advance or verify P04 online update channel
        shell: bash
        run: |
          set -Eeuo pipefail
          current="$(jq -r '.target_version' updates/projects/P04.json)"
          if [ "$current" = '2.7.3' ]; then
            jq -e '.release_tag=="v2.7.3" and .release_id==372090957 and .release_product_commit=="fe0f364c7da7a4592c21a9cc36eb6a8f9563c505" and .asset_name=="VF_Infra_V2.7.3_UPDATE.zip" and .asset_sha256=="3668d6d7c8fd120e87ff9dabc133723c620bca05a2b692327a659bd573dc9cf6"' updates/projects/P04.json >/dev/null
            python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('updates/projects/P04.json')
          x={
            'schema_version':'1.0','project_id':'P04','component_id':'APP','enabled':True,
            'target_version':'2.7.4','update_type':'ATOMIC','from_versions':['2.7.3'],
            'schema_from':'14','schema_to':'14','repository':'llhzx2018/vf-infra',
            'release_tag':'v2.7.4','release_name':'VF Infra V2.7.4','release_id':int(os.environ['RELEASE_ID']),
            'release_product_commit':os.environ['CANDIDATE_COMMIT'],'release_product_tree':os.environ['CANDIDATE_TREE'],
            'asset_name':'VF_Infra_V2.7.4_UPDATE.zip','asset_id':int(os.environ['UPDATE_ASSET_ID']),
            'asset_bytes':int(os.environ['EXPECTED_UPDATE_BYTES']),'asset_sha256':os.environ['EXPECTED_UPDATE_SHA'],
            'backup_required':True,'rollback_supported':True,'released_at':os.environ['PUBLISHED_AT'],'minimum_php':'8.0.0',
            'notes':'VF Infra V2.7.4 正式在线更新：仅支持 Production V2.7.3 → V2.7.4；Schema 14 → 14，无 Migration。收口统一工作区 UI 稳定性与性能，修复冷启动统一路由观察器饥饿问题，并继承 V2.7.2 后台详情 UX 与 V2.7.3 字体/视觉节奏治理。Provider 继续 READ-ONLY FIRST，不新增 DNS、VPS、付款或续费远程写权限。正式 UPDATE 已通过当前 Candidate Runtime Consolidation、Artifact Validation、Repair Self-test 与 FULL_RUNTIME_VS_UPDATE_RESULT_SOURCE_EXACT Gate。Production 安装前仍由现有 Atomic 合同建立并验证受保护备份。'
          }
          p.write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
            cd updates
            git config user.name 'VF Release Automation'
            git config user.email 'vf-release-automation@users.noreply.github.com'
            git add projects/P04.json
            git commit -m 'release(P04): advance unified update target to V2.7.4'
            git push origin main
            echo "CORE_UPDATES_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          elif [ "$current" = '2.7.4' ]; then
            echo "CORE_UPDATES_COMMIT=$(git -C updates rev-parse HEAD)" >> "$GITHUB_ENV"
          else
            echo "CORE_UPDATES_UNEXPECTED_TARGET=$current" >&2
            exit 1
          fi

      - name: Final online channel remote readback
        shell: bash
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api 'repos/llhzx2018/core-updates/contents/projects/P04.json?ref=main' --jq .content | tr -d '\n' | base64 -d > "$RUNNER_TEMP/P04.json"
          jq -e --arg c "$CANDIDATE_COMMIT" --arg t "$CANDIDATE_TREE" --arg sha "$EXPECTED_UPDATE_SHA" --argjson bytes "$EXPECTED_UPDATE_BYTES" '.target_version=="2.7.4" and .from_versions==["2.7.3"] and .schema_from=="14" and .schema_to=="14" and .release_tag=="v2.7.4" and .release_product_commit==$c and .release_product_tree==$t and .asset_name=="VF_Infra_V2.7.4_UPDATE.zip" and .asset_bytes==$bytes and .asset_sha256==$sha' "$RUNNER_TEMP/P04.json" >/dev/null
          gh api repos/llhzx2018/vf-infra/releases/tags/v2.7.4 > "$RUNNER_TEMP/final-release.json"
          a="$(jq -c '.assets[]|select(.name=="VF_Infra_V2.7.4_UPDATE.zip")' "$RUNNER_TEMP/final-release.json")"
          test "$(jq -r '.size' <<<"$a")" = "$EXPECTED_UPDATE_BYTES"
          test "$(jq -r '.digest' <<<"$a")" = "sha256:$EXPECTED_UPDATE_SHA"
          echo 'P04_V274_FORMAL_RELEASE=PASS'
          echo 'P04_V274_ONLINE_CHANNEL_REMOTE_READBACK=PASS'
          echo "P04_V274_RELEASE_ID=$(jq -r '.id' "$RUNNER_TEMP/final-release.json")"
          echo "P04_V274_CORE_UPDATES_COMMIT=$CORE_UPDATES_COMMIT"
          echo 'PRODUCTION_UPGRADE=NOT_EXECUTED'
