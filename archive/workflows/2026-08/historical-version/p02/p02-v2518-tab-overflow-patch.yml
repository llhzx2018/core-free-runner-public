name: P02 V2.5.18 Tab Overflow Patch

on:
  pull_request:
    branches: [main]
    paths: ['triggers/p02-v2518-tab-overflow-patch.txt']

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require registered capability
        env:
          WRITE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: test -n "$WRITE_TOKEN"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: maintenance/v2.5.18-tab-overflow-ux
          token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
          fetch-depth: 0
      - name: Apply V2.5.18 focused UX patch
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "c154579fb28be0f8d8bd3db165ac8b55074d5d97"
          test "$(tr -d '\r\n' < VERSION)" = "2.5.18"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/assets/v254-common-branding.js')
          s=p.read_text(encoding='utf-8')
          marker='V2.5.18_SCRATCH_TAB_OVERFLOW_UX'
          if marker in s:
              raise SystemExit('marker already present')
          block=r'''

/* V2.5.18_SCRATCH_TAB_OVERFLOW_UX */
(function(){
  'use strict';
  const STYLE_ID='scratchTabOverflowUxV2518';
  const BOUND_KEY='tabOverflowUxV2518';
  const EDGE_PAD=10;
  const EDGE_DRAG_ZONE=44;

  function ensureStyle(){
    if(document.getElementById(STYLE_ID))return;
    const style=document.createElement('style');
    style.id=STYLE_ID;
    style.textContent=`
      .scratch-tab-scroll-v2518{width:30px;height:34px;flex:0 0 30px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--muted);display:grid;place-items:center;padding:0;font-size:22px;line-height:1;cursor:pointer;transition:background .14s,border-color .14s,color .14s,opacity .14s}
      .scratch-tab-scroll-v2518:hover:not(:disabled){background:var(--surface);border-color:var(--border);color:var(--strong)}
      .scratch-tab-scroll-v2518:focus-visible{outline:2px solid color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:1px}
      .scratch-tab-scroll-v2518:disabled{opacity:.26;cursor:default}
      .scratch-tab-scroll-v2518[hidden]{display:none!important}
      .scratch-bar-v259.has-tab-overflow-v2518 .scratch-tabs-scroll-v259{scroll-behavior:smooth}
      @media(max-width:900px){.scratch-tab-scroll-v2518{order:1;width:28px;flex-basis:28px}.scratch-tabs-scroll-v259{min-width:0}}
    `;
    document.head.appendChild(style);
  }

  function navButton(direction){
    const button=document.createElement('button');
    const left=direction<0;
    button.type='button';
    button.className='scratch-tab-scroll-v2518 '+(left?'prev':'next');
    button.dataset.scratchTabScroll=left?'prev':'next';
    button.textContent=left?'‹':'›';
    button.title=left?'向左查看临时页签':'向右查看临时页签';
    button.setAttribute('aria-label',button.title);
    return button;
  }

  function attach(workspace){
    if(!workspace||workspace.dataset[BOUND_KEY]==='1')return;
    const bar=workspace.querySelector('.scratch-bar-v259');
    const scroller=workspace.querySelector('.scratch-tabs-scroll-v259');
    if(!bar||!scroller)return;
    workspace.dataset[BOUND_KEY]='1';
    ensureStyle();

    const prev=navButton(-1),next=navButton(1);
    bar.insertBefore(prev,scroller);
    scroller.insertAdjacentElement('afterend',next);
    let lastActive='';
    let raf=0;

    function maxScroll(){return Math.max(0,scroller.scrollWidth-scroller.clientWidth);}
    function updateControls(){
      const max=maxScroll();
      const overflow=max>3;
      bar.classList.toggle('has-tab-overflow-v2518',overflow);
      prev.hidden=!overflow;next.hidden=!overflow;
      prev.disabled=!overflow||scroller.scrollLeft<=2;
      next.disabled=!overflow||scroller.scrollLeft>=max-2;
      prev.setAttribute('aria-disabled',prev.disabled?'true':'false');
      next.setAttribute('aria-disabled',next.disabled?'true':'false');
    }
    function revealActive(smooth){
      const active=scroller.querySelector('.scratch-tab-v259.active');
      if(!active)return;
      const sr=scroller.getBoundingClientRect(),ar=active.getBoundingClientRect();
      let delta=0;
      if(ar.left<sr.left+EDGE_PAD)delta=ar.left-sr.left-EDGE_PAD;
      else if(ar.right>sr.right-EDGE_PAD)delta=ar.right-sr.right+EDGE_PAD;
      if(Math.abs(delta)>1)scroller.scrollBy({left:delta,behavior:smooth?'smooth':'auto'});
    }
    function sync(reveal){
      cancelAnimationFrame(raf);
      raf=requestAnimationFrame(()=>{
        const active=scroller.querySelector('.scratch-tab-v259.active');
        const key=active&&active.dataset?String(active.dataset.scratchTab||''):'';
        if(reveal||key!==lastActive)revealActive(key!==lastActive);
        lastActive=key;
        updateControls();
      });
    }
    function page(direction){
      const step=Math.max(180,Math.min(420,Math.round(scroller.clientWidth*.62)));
      scroller.scrollBy({left:direction*step,behavior:'smooth'});
    }

    prev.addEventListener('click',()=>page(-1));
    next.addEventListener('click',()=>page(1));
    scroller.addEventListener('scroll',()=>sync(false),{passive:true});
    scroller.addEventListener('dragover',event=>{
      const rect=scroller.getBoundingClientRect();
      if(event.clientX<rect.left+EDGE_DRAG_ZONE)scroller.scrollLeft-=16;
      else if(event.clientX>rect.right-EDGE_DRAG_ZONE)scroller.scrollLeft+=16;
    });

    const tabObserver=new MutationObserver(()=>sync(true));
    tabObserver.observe(scroller,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
    if(typeof ResizeObserver==='function'){
      const resizeObserver=new ResizeObserver(()=>sync(true));
      resizeObserver.observe(scroller);
    }else window.addEventListener('resize',()=>sync(true),{passive:true});
    sync(true);
  }

  function scan(){document.querySelectorAll('.scratch-workspace-v259').forEach(attach);}
  const pageObserver=new MutationObserver(scan);
  function boot(){ensureStyle();scan();pageObserver.observe(document.body,{childList:true,subtree:true});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
'''
          p.write_text(s.rstrip()+block+'\n',encoding='utf-8')

          c=Path('CHANGELOG.md')
          old=c.read_text(encoding='utf-8')
          entry='''## V2.5.18 · 临时 TAB 溢出导航 UX · 2026-08-20\n\n- 临时工作台 TAB 溢出时提供显式左右导航按钮，不再只依赖鼠标滚轮或触控板手势。\n- 左右按钮仅在确有溢出时出现，并根据滚动边界自动禁用，避免无效操作与视觉噪音。\n- 当前激活 TAB 在新建、切换、恢复、排序后自动保持在可视区域。\n- 保留原有滚轮横向浏览，并补充拖动排序到边缘时的自动横向滚动。\n- Desktop / Mobile 共用一致语义；Schema 继续 2401，无 Migration。\n\n'''
          if not old.startswith('## V2.5.18'):
              c.write_text(entry+old,encoding='utf-8')
          PY
          node --check public/assets/v254-common-branding.js
          grep -q 'V2.5.18_SCRATCH_TAB_OVERFLOW_UX' public/assets/v254-common-branding.js
          git diff --check
          git status --short
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VERSION CHANGELOG.md public/assets/v254-common-branding.js
          git commit -m 'feat(P02): add explicit scratch tab overflow navigation'
          git push origin HEAD:maintenance/v2.5.18-tab-overflow-ux
          echo PRODUCT_HEAD=$(git rev-parse HEAD)
