name: P02 V2.5.17 Final Authority Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2517-final-authority-gate.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: maintenance/v2.5.17-library-model-convergence
          token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Source exact and fresh install
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          php -m | grep -qi pdo_sqlite
          php -m | grep -qi sqlite3
          php -m | grep -qi zip
          test "$(tr -d '\r\n' < VERSION)" = 2.5.17
          test "$(jq -r .version SOURCE_MANIFEST.json)" = 2.5.17
          test "$(jq -r .schema SOURCE_MANIFEST.json)" = 2401
          test "$(jq -r .runtime_source_file_count SOURCE_MANIFEST.json)" = 74
          node --check public/assets/v254-common-branding.js
          python3 - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open('SOURCE_MANIFEST.json',encoding='utf-8'));assert len(m['entries'])==74
          for e in m['entries']:
              b=pathlib.Path(e['repo_path']).read_bytes();h=hashlib.sha256(b).hexdigest()
              assert len(b)==e['bytes'] and h==e['sha256']==e['repo_sha256'],e['repo_path']
          assert hashlib.sha256(pathlib.Path('SOURCE_MANIFEST.txt').read_bytes()).hexdigest()==m['repo_sha256']
          print('SOURCE_MANIFEST_74_OF_74=PASS')
          print('SOURCE_MANIFEST_TXT_SHA=PASS')
          PY
          SITE="$RUNNER_TEMP/site";mkdir -p "$SITE";bash scripts/build-deploy-tree.sh "$SITE" >/dev/null
          test "$(cat "$SITE/VERSION.txt")" = 2.5.17
          php -S 127.0.0.1:18744 -t "$SITE" >"$RUNNER_TEMP/php.log" 2>&1 & echo $! > "$RUNNER_TEMP/php.pid";sleep 1
          curl -fsS -c "$RUNNER_TEMP/cookies" http://127.0.0.1:18744/setup.php > "$RUNNER_TEMP/setup.html"
          CSRF="$(python3 - "$RUNNER_TEMP/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);print(m.group(1) if m else '')
          PY
          )";test -n "$CSRF"
          curl -sS -D "$RUNNER_TEMP/headers" -o /dev/null -b "$RUNNER_TEMP/cookies" -H 'Origin: http://127.0.0.1:18744' -H 'Referer: http://127.0.0.1:18744/setup.php' --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'password=P02-V2517-Final!' --data-urlencode 'password_confirm=P02-V2517-Final!' http://127.0.0.1:18744/setup.php
          grep -Eq '^HTTP/.* 303' "$RUNNER_TEMP/headers"
          echo SOURCE_EXACT=PASS
          echo FRESH_INSTALL=PASS
      - name: Real Chromium product semantics
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          PID="$(cat "$RUNNER_TEMP/php.pid")";trap 'kill "$PID" || true; tail -100 "$RUNNER_TEMP/php.log" || true' EXIT
          npm -g ls playwright >/dev/null 2>&1 || npm i -g playwright@1.55.0 >/dev/null
          playwright install chromium >/dev/null
          cat > "$RUNNER_TEMP/test.cjs" <<'JS'
          const {chromium}=require('playwright');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const ok=(x,m)=>{if(!x)throw Error(m)};
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1440,height:1000}});
            const base='http://127.0.0.1:18744';
            const recent=()=>p.evaluate(()=>fetch('/api.php?action=content_list&mode=recent&status=active&page=1&page_size=20').then(r=>r.json()));
            const open=async id=>{let x=p.locator(`[data-notebook-item="${id}"]`);if(await x.count())return x.first().click();x=p.locator(`[data-open="${id}"]`);if(await x.count())return x.first().click();throw Error('OPEN_'+id)};
            const more=async id=>{let x=p.locator(`[data-notebook-more="${id}"]`);if(await x.count())return x.first().click();x=p.locator(`[data-item-more="${id}"]`);if(await x.count())return x.first().click();throw Error('MORE_'+id)};
            await p.goto(base+'/',{waitUntil:'networkidle'});await p.click('[data-open-login]');await p.fill('input[name=password]','P02-V2517-Final!');await p.click('#loginSubmit');await p.waitForFunction(()=>document.querySelector('#accountBtn')?.textContent.includes('退出'));
            const ia=await p.evaluate(()=>({q:getComputedStyle(document.querySelector('.side-item[data-mode=quick]')).display,a:getComputedStyle(document.querySelector('.side-item[data-mode=article]')).display}));ok(ia.q==='none'&&ia.a==='none','LEGACY_NAV');
            for(const v of ['quick','article']){await p.evaluate(x=>localStorage.setItem('vftb-mode',x),v);await p.reload({waitUntil:'networkidle'});await p.waitForFunction(()=>localStorage.getItem('vftb-mode')==='all')}
            const c=await p.evaluate(async()=>{const s=await fetch('/api.php?action=session').then(r=>r.json()),csrf=s.csrf,post=async(a,z)=>{const r=await fetch('/api.php?action='+a,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(z)}),j=await r.json();if(!r.ok||j.ok===false)throw Error(a);return j};const cat=await post('category_save',{name:'V2517 Final'}),z={category_id:cat.id,description:'',tags:'',aliases:'',is_favorite:false,is_pinned:false,status:'active',attachment_ids:[]},q=await post('content_save',{...z,title:'普通资料',content:'普通',content_mode:'quick',content_format:'plain',primary_action:'copy'}),a=await post('content_save',{...z,title:'长文资料',content:'# 长文',content_mode:'article',content_format:'markdown',primary_action:'read'}),e=await post('content_save',{...z,title:'编辑资料',content:'编辑',content_mode:'quick',content_format:'plain',primary_action:'copy'}),boot=await fetch('/api.php?action=app_bootstrap').then(r=>r.json());return{cat:cat.id,q:q.id,a:a.id,e:e.id,setting:Number(boot.data.settings.article_open_counts_recent||0)}});ok(c.setting===0,'SETTING');
            await p.evaluate(()=>localStorage.setItem('vftb-content-view','notebook'));await p.reload({waitUntil:'networkidle'});await sleep(1000);let r=await recent();ok(Number(r.data.pagination.total)===0,'AUTO_RECENT');
            await open(c.q);await sleep(900);r=await recent();ok(Number(r.data.pagination.total)===1&&Number(r.data.items[0].id)===Number(c.q),'Q_RECENT');
            await sleep(1050);await p.goto(base+'/',{waitUntil:'networkidle'});await open(c.a);await sleep(900);r=await recent();ok(Number(r.data.pagination.total)===2&&Number(r.data.items[0].id)===Number(c.a),'A_RECENT');
            await sleep(1050);await p.goto(base+'/',{waitUntil:'networkidle'});await more(c.e);let x=p.locator('.context[data-recent-item-id] [data-edit]');ok(await x.count()===1,'ITEM_MENU_SCOPE');await x.click();await p.waitForSelector('#contentForm');await sleep(900);ok(await p.evaluate(()=>document.querySelector('select[name=content_mode]')?.closest('.field')?.hidden===true),'MODE_HIDDEN');r=await recent();ok(Number(r.data.pagination.total)===3&&Number(r.data.items[0].id)===Number(c.e),'E_RECENT');const stamp=r.data.items[0].last_opened_at;
            await sleep(1050);await p.goto(base+'/',{waitUntil:'networkidle'});await more(c.e);x=p.locator(`[data-category-more="${c.cat}"]`);ok(await x.count()===1,'CAT_MORE');await x.click();x=p.locator('.context [data-edit]');ok(await x.count()===1,'CAT_EDIT');await x.click();await sleep(900);r=await recent();const er=r.data.items.find(v=>Number(v.id)===Number(c.e));ok(er&&er.last_opened_at===stamp,'CAT_POLLUTED');if(await p.locator('.modal-overlay').count())await p.keyboard.press('Escape');
            await p.evaluate(()=>localStorage.setItem('vftb-content-view','list'));await p.goto(base+'/',{waitUntil:'networkidle'});await p.waitForFunction(()=>Number(document.querySelector('#recentCount')?.textContent||0)===3);await p.click('.side-item[data-mode=recent]');await p.waitForFunction(()=>document.body.innerText.includes('最近打开、阅读、编辑、复制或调用过的资料'));
            await p.goto(base+'/',{waitUntil:'networkidle'});await p.click('#addContentMenuBtn');await sleep(100);const txt=await p.evaluate(()=>document.body.innerText);ok(txt.includes('新建资料')&&txt.includes('新建长文'),'LABELS');
            const m=await b.newPage({viewport:{width:390,height:844}});await m.goto(base+'/',{waitUntil:'networkidle'});ok(await m.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth)<=1,'MOBILE');await b.close();
            console.log('PRIMARY_LIBRARY_IA=PASS');console.log('LEGACY_MODE_FALLBACK=PASS');console.log('AUTO_SELECTION_RECENT=PASS');console.log('QUICK_OPEN_RECENT=PASS');console.log('ARTICLE_OPEN_RECENT_SETTING_OFF=PASS');console.log('EDIT_RECENT=PASS');console.log('CATEGORY_EDIT_RECENT_ISOLATION=PASS');console.log('RECENT_NAV=PASS');console.log('CREATE_LABELS=PASS');console.log('MOBILE_390_OVERFLOW=NONE');console.log('REAL_CHROMIUM_V2517=PASS');
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
          NODE_PATH="$(npm root -g)" node "$RUNNER_TEMP/test.cjs"
          echo SCHEMA=2401
          echo PRODUCTION_WRITE=NO
