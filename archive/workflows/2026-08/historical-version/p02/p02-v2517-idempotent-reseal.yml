name: P02 V2.5.17 Idempotent Reseal

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2517-idempotent-reseal.yml'

permissions:
  contents: read

jobs:
  reseal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_BRANCH: maintenance/v2.5.17-library-model-convergence
      TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ env.TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify idempotence and reseal exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$TOKEN"
          test "$(tr -d '\r\n' < VERSION)" = 2.5.17
          node --check public/assets/v254-common-branding.js
          grep -q "node.textContent!=='普通资料'" public/assets/v254-common-branding.js
          grep -q "node.textContent!=='长文资料'" public/assets/v254-common-branding.js
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('SOURCE_MANIFEST.json')
          m=json.loads(p.read_text(encoding='utf-8'))
          m['version']='2.5.17'
          assert len(m['entries'])==m['runtime_source_file_count']==74
          for e in m['entries']:
              raw=Path(e['repo_path']).read_bytes()
              h=hashlib.sha256(raw).hexdigest()
              e['bytes']=len(raw);e['sha256']=h;e['repo_sha256']=h
          lines=['VF Library Source Manifest','Version: 2.5.17','Schema: 2401','Runtime source files: 74','']
          for e in m['entries']:
              lines.append(f"{e['sha256']}  {e['bytes']:>8}  {e['repo_path']} -> {e['full_path']}")
          txt='\n'.join(lines)+'\n'
          Path('SOURCE_MANIFEST.txt').write_text(txt,encoding='utf-8')
          m['repo_sha256']=hashlib.sha256(txt.encode('utf-8')).hexdigest()
          p.write_text(json.dumps(m,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          for e in m['entries']:
              raw=Path(e['repo_path']).read_bytes();h=hashlib.sha256(raw).hexdigest()
              assert len(raw)==e['bytes'] and h==e['sha256']==e['repo_sha256'],e['repo_path']
          assert hashlib.sha256(Path('SOURCE_MANIFEST.txt').read_bytes()).hexdigest()==m['repo_sha256']
          print('IDEMPOTENT_TERMINOLOGY=PASS')
          print('SOURCE_MANIFEST_74_OF_74=PASS')
          print('SOURCE_MANIFEST_TXT_SHA=PASS')
          print('SCHEMA=2401')
          print('PRODUCTION_WRITE=NO')
          PY
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          if ! git diff --cached --quiet; then git commit -m 'docs(release): reseal V2.5.17 idempotent candidate'; fi
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/llhzx2018/vf-library.git"
          git push origin HEAD:${TARGET_BRANCH}
          echo V2517_IDEMPOTENT_RESEAL=PASS
