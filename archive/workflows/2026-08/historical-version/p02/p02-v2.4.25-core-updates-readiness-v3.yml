name: P02 V2.4.25 core-updates Readiness V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2.4.25-core-updates-readiness-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require private read credential
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$READ_TOKEN"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: 4eb2d8b434000a63f71ddc74218c958efe7777a3
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: core-updates
          persist-credentials: false
      - name: PHP Update Core regression
        working-directory: core-updates
        run: |
          set -Eeuo pipefail
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
      - name: P02 exact manifest readiness
        working-directory: core-updates
        run: |
          set -Eeuo pipefail
          cat > "$RUNNER_TEMP/p02-manifest-check.php" <<'PHP'
          <?php
          require 'update-core/php/src/UpdateCore.php';
          $m=json_decode(file_get_contents('projects/P02.json'),true,512,JSON_THROW_ON_ERROR);
          if(($m['current_version']??null)!=='2.4.24'||($m['target_version']??null)!=='2.4.25')exit(21);
          if(($m['release_id']??null)!==371297306)exit(22);
          if(($m['product_identity']??null)!=='11019841b837038092b153930ab8e185bf2a2676')exit(23);
          if(($m['asset_name']??null)!=='VF_Library_V2.4.25_UPDATE.zip'||($m['asset_bytes']??null)!==294475||($m['asset_sha256']??null)!=='64da5b48b365f9b558c0d5b628393a1716af9a708c88d498f0d7b3c32cd478e9')exit(24);
          $core=new CoreUpdates\UpdateCore('P02','APP');
          $r=$core->check('2.4.24','2401',$m);
          if(($r['status']??null)!=='AVAILABLE'||($r['target_version']??null)!=='2.4.25')exit(25);
          echo "P02_CORE_UPDATES_AVAILABLE=PASS\n";
          PHP
          php "$RUNNER_TEMP/p02-manifest-check.php"
      - name: Schema extension contract
        working-directory: core-updates
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          s=json.load(open('schemas/update-manifest-v1.schema.json')); p=s['properties']; m=json.load(open('projects/P02.json'))
          assert p['current_version']['type']=='string'
          assert p['release_id']['type']=='integer'
          assert p['product_identity']['pattern']=='^[a-f0-9]{40}$'
          assert not (set(m)-set(p)), set(m)-set(p)
          print('MANIFEST_SCHEMA_EXTENSION=PASS')
          PY
