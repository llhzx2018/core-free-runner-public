name: P02 V2.4.25 Publish Final Manifest Meta
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p02-v2.4.25-publish-final-manifest-meta.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout public runner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - name: Checkout private candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: task/v2.4.25-attachment-ux
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p02
          persist-credentials: false
      - name: Generate metadata only
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p tmp-meta/p02-v2.4.25-final
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path('p02')
          current=json.loads((root/'SOURCE_MANIFEST.json').read_text(encoding='utf-8'))
          entries=[]
          for old in current['entries']:
            p=root/old['repo_path']
            if not p.is_file() or p.is_symlink(): raise SystemExit('invalid runtime path: '+old['repo_path'])
            b=p.read_bytes(); h=hashlib.sha256(b).hexdigest()
            entries.append({'full_path':old['full_path'],'repo_path':old['repo_path'],'bytes':len(b),'sha256':h,'repo_sha256':h})
          entries.sort(key=lambda x:x['full_path'])
          head=subprocess.check_output(['git','-C','p02','rev-parse','HEAD'],text=True).strip()
          out={'project':'P02 · VF Library','version':'2.4.25','schema':2401,'task_head':head,'source_baseline_full_sha256':'PENDING_FORMAL_CANDIDATE_ARTIFACT','mapping_contract':'Each declared runtime source file must exist exactly once at repo_path; hashes bind the Git-native V2.4.25 Candidate runtime derived from Production V2.4.24. Formal release identity is not assigned by this candidate manifest.','runtime_source_file_count':len(entries),'entries':entries}
          pathlib.Path('tmp-meta/p02-v2.4.25-final/SOURCE_MANIFEST.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          lines=['VF Library V2.4.25 CANDIDATE SOURCE_MANIFEST','FULL_SHA256  PENDING_FORMAL_CANDIDATE_ARTIFACT',f'RUNTIME_SOURCE_FILES  {len(entries)}','MAPPING_STATUS  CURRENT_GIT_CANDIDATE','TASK_HEAD  '+head,'']+[f"{e['sha256']}  {e['repo_path']}  <=  {e['full_path']}" for e in entries]
          pathlib.Path('tmp-meta/p02-v2.4.25-final/SOURCE_MANIFEST.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('TASK_HEAD='+head)
          print('ATTACHMENT='+next(e['sha256'] for e in entries if e['repo_path']=='public/assets/attachments.js'))
          PY
          node --check p02/public/assets/attachments.js
          if find tmp-meta -type f \( -name '*.php' -o -name '*.js' -o -name '*.css' -o -name '*.sqlite' -o -name '*.db' -o -name '*.zip' \) -print -quit | grep -q .; then exit 91; fi
      - name: Commit metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf p02
          git config user.name 'VF Runner'
          git config user.email 'actions@users.noreply.github.com'
          git add tmp-meta/p02-v2.4.25-final
          git diff --cached --quiet && exit 0
          git commit -m 'test(P02): publish V2.4.25 final runtime metadata'
          git push origin HEAD:main
