name: P02 V2.4.23 PR Head Release Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2.4.23-pr-head-release-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout public execution shell
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Require shared private read-only credential
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_TOKEN" || exit 78

      - name: Checkout exact private PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: 6044aa588d29bf885733dae38aa78226ea72cfa8
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p02
          fetch-depth: 0
          persist-credentials: false

      - name: Guard exact source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p02 rev-parse HEAD)" = "6044aa588d29bf885733dae38aa78226ea72cfa8"
          test "$(tr -d '\r\n' < p02/VERSION)" = "2.4.23"

      - name: Install formal release runtime dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl
          php -v
          sqlite3 --version

      - name: Build and reverse-verify exact formal release set
        shell: bash
        working-directory: p02
        env:
          VF_RELEASE_SOURCE_SHA: 6044aa588d29bf885733dae38aa78226ea72cfa8
          VF_RELEASE_SOURCE_REF: feature/update-core-v1
        run: |
          set -Eeuo pipefail
          bash scripts/verify-release-artifacts.sh

      - name: Build redacted release evidence only
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p public-evidence
          cp p02/build/release/SHA256SUMS.txt public-evidence/formal-release-sha256s.txt
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('p02/build/release')
          sums=[]
          for p in sorted(root.iterdir()):
              if not p.is_file() or p.name=='SHA256SUMS.txt':
                  continue
              b=p.read_bytes()
              sums.append({'name':p.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          out={
            'result':'PASS',
            'project_id':'P02',
            'project':'VF Library',
            'version':'2.4.23',
            'schema':2401,
            'source_commit':'6044aa588d29bf885733dae38aa78226ea72cfa8',
            'source_ref':'feature/update-core-v1',
            'verification':'FULL_FORMAL_RELEASE_SET_REVERSE_VERIFICATION',
            'formal_artifacts':sums,
            'privacy':'REDACTED_METADATA_ONLY_NO_SOURCE_BYTES_NO_DB_NO_SESSION_NO_SECRET'
          }
          Path('public-evidence/summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Public evidence privacy gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(find public-evidence -maxdepth 1 -type f | wc -l)" -eq 2
          ! find public-evidence -type f \( -name '*.zip' -o -name '*.php' -o -name '*.sqlite' -o -name '*.db' \) -print -quit | grep -q .
          ! grep -RIE --binary-files=without-match '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|Authorization:[[:space:]]*(token|Bearer)|Set-Cookie:|PHPSESSID=|VF_PRIVATE_READ_TOKEN=|VF_UPDATE_READ_TOKEN=)' public-evidence

      - name: Cleanup private source and formal binaries
        if: always()
        shell: bash
        run: rm -rf p02

      - name: Upload redacted release evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p02-v2.4.23-pr-head-release-verify-${{ github.run_id }}
          path: public-evidence
          if-no-files-found: error
          retention-days: 14
