name: P02 V2.4.25 Candidate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2.4.25-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p02-v2-4-25-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CANDIDATE_COMMIT: 0a2941dc6425859467bd3c3a83b2d1119113c04a
      PRODUCTION_COMMIT: b8f26afd81e0c736923579eb6fe5b298dd9fc8e3
      PUBLIC_EVIDENCE: ${{ github.workspace }}/evidence/p02-v2.4.25-candidate

    steps:
      - name: Checkout public execution shell
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Require private read-only credential
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_TOKEN" || { echo 'VF_PRIVATE_READ_TOKEN is not configured.' >&2; exit 78; }
          echo 'PRIVATE_READ_TOKEN_PRESENT=YES'

      - name: Checkout exact VF Library candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: 0a2941dc6425859467bd3c3a83b2d1119113c04a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p02
          fetch-depth: 0
          persist-credentials: false

      - name: Guard exact candidate identity and scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p02 rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test "$(tr -d '\r\n' < p02/VERSION)" = '2.4.25'
          git -C p02 cat-file -e "$PRODUCTION_COMMIT^{commit}"
          test "$(git -C p02 merge-base "$PRODUCTION_COMMIT" "$CANDIDATE_COMMIT")" = "$PRODUCTION_COMMIT"
          node --check p02/public/assets/attachments.js
          grep -Fq "finally{setBusy(cleanup,false);}" p02/public/assets/attachments.js
          grep -Fq "e.key==='Escape'" p02/public/assets/attachments.js
          grep -Fq "previousFocus.focus" p02/public/assets/attachments.js
          grep -Fq 'aria-labelledby' p02/public/assets/attachments.js
          grep -Fq "addEventListener('cancel'" p02/public/assets/attachments.js
          echo 'CANDIDATE_SCOPE_STATIC_ASSERTIONS=PASS'

      - name: Install PHP SQLite runtime and pinned browser harness
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-zip php-curl sqlite3 curl unzip
          cd p02
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          php -v | head -1
          sqlite3 --version | head -1

      - name: Full maintenance regression on 2.4.25 runtime
        shell: bash
        working-directory: p02
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/p02-maint-245
          TEST_PASSWORD: P02-245-${{ github.run_id }}-${{ github.run_attempt }}!
        run: |
          set -Eeuo pipefail
          cp scripts/maintenance-reverify.sh "$RUNNER_TEMP/maintenance-reverify-245.sh"
          cp tests/e2e/maintenance_reverify.mjs "$RUNNER_TEMP/maintenance_reverify_245.mjs"
          sed -i 's/2\.4\.24/2.4.25/g' scripts/maintenance-reverify.sh tests/e2e/maintenance_reverify.mjs
          bash scripts/maintenance-reverify.sh
          test -f "$EVIDENCE_DIR/summary.json"
          python3 - "$EVIDENCE_DIR/summary.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          assert x.get('result')=='PASS',x
          assert x.get('version')=='2.4.25',x
          assert int(x.get('schema',0))==2401,x
          print('FULL_MAINTENANCE_REGRESSION=PASS')
          PY
          mv "$RUNNER_TEMP/maintenance-reverify-245.sh" scripts/maintenance-reverify.sh
          mv "$RUNNER_TEMP/maintenance_reverify_245.mjs" tests/e2e/maintenance_reverify.mjs
          test -z "$(git status --porcelain)"

      - name: Focused attachment modal browser regression
        shell: bash
        working-directory: p02
        run: |
          set -Eeuo pipefail
          SITE="$RUNNER_TEMP/p02-attachment-site"
          COOKIE="$RUNNER_TEMP/p02-attachment-cookie"
          PORT=18125
          BASE="http://127.0.0.1:$PORT"
          PASS="P02-Attachment-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}!"
          bash scripts/build-deploy-tree.sh "$SITE" >/dev/null
          php -d display_errors=0 -S "127.0.0.1:$PORT" -t "$SITE" >"$RUNNER_TEMP/p02-attachment-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do curl -fsS "$BASE/setup.php" >/dev/null 2>&1 && break; sleep .25; done
          curl -fsS -c "$COOKIE" "$BASE/setup.php" > "$RUNNER_TEMP/setup.html"
          SETUP_CSRF=$(python3 - "$RUNNER_TEMP/setup.html" <<'PY'
          import html,re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s)
          if not m: raise SystemExit('setup csrf missing')
          print(html.unescape(m.group(1)))
          PY
          )
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -b "$COOKIE" -c "$COOKIE" -H "Origin: $BASE" --data-urlencode "setup_csrf=$SETUP_CSRF" --data-urlencode "password=$PASS" --data-urlencode "password_confirm=$PASS" "$BASE/setup.php")
          test "$CODE" = 303
          cat > "$RUNNER_TEMP/attachment-focused.mjs" <<'JS'
          import { chromium } from 'playwright';
          const base=process.env.BASE_URL,password=process.env.TEST_PASSWORD;
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          try {
            await page.goto(base+'/',{waitUntil:'networkidle'});
            const unlock=page.locator('[data-open-login]').first();
            if(await unlock.count()){
              await unlock.click();
              await page.locator('#loginForm input[name="password"]').fill(password);
              await page.locator('#loginSubmit').click();
              await page.waitForFunction(async()=>{const j=await (await fetch('/api.php?action=session')).json();return Boolean(j?.site?.auth)});
            }
            const session=await page.evaluate(async()=>await (await fetch('/api.php?action=session')).json());
            if(session?.version!=='2.4.25'||!session?.site?.auth) throw new Error('focused e2e version/auth mismatch');
            await page.evaluate(()=>openEditor(null,{forceContentMode:'article',forceContentFormat:'markdown'}));
            const opener=page.locator('[data-attachment-library]').first();
            await opener.waitFor({state:'visible'});await opener.focus();await opener.click();
            const search=page.locator('[data-library-query]');await search.waitFor({state:'visible'});
            await page.waitForFunction(()=>document.activeElement===document.querySelector('[data-library-query]'));
            const labelled=await page.locator('.attachment-modal').evaluate(el=>Boolean(el.getAttribute('aria-labelledby')&&document.getElementById(el.getAttribute('aria-labelledby'))));
            if(!labelled) throw new Error('attachment modal accessible label missing');
            await page.keyboard.press('Escape');
            await page.locator('.attachment-modal-overlay').waitFor({state:'detached'});
            const restored=await opener.evaluate(el=>document.activeElement===el);if(!restored) throw new Error('opener focus not restored after Escape');
            await opener.click();
            const cleanup=page.locator('[data-library-cleanup]');await cleanup.waitFor({state:'visible'});await cleanup.click();
            const confirm=page.locator('[data-dialog-confirm]');await confirm.waitFor({state:'visible'});
            const responsePromise=page.waitForResponse(r=>r.url().includes('action=attachment_cleanup')&&r.request().method()==='POST');
            await confirm.click();const response=await responsePromise;if(!response.ok()) throw new Error('attachment_cleanup failed HTTP '+response.status());
            await page.waitForFunction(()=>{const b=document.querySelector('[data-library-cleanup]');return b&&!b.disabled&&(b.textContent||'').trim()==='清理孤儿文件';});
            await page.setViewportSize({width:390,height:844});await page.waitForTimeout(100);
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);if(overflow>3) throw new Error('mobile modal horizontal overflow '+overflow);
            if(errors.length) throw new Error('console/page errors: '+errors.join(' | '));
            console.log('ATTACHMENT_FOCUSED_E2E=PASS');
          } finally { await browser.close(); }
          JS
          BASE_URL="$BASE" TEST_PASSWORD="$PASS" node "$RUNNER_TEMP/attachment-focused.mjs"
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

      - name: Build and reverse verify 2.4.25 candidate artifacts
        shell: bash
        working-directory: p02
        run: |
          set -Eeuo pipefail
          TREE=$(git show -s --format=%T "$CANDIDATE_COMMIT")
          python3 scripts/build-release.py --out build/release --source-commit "$CANDIDATE_COMMIT" --source-tree "$TREE" --source-ref task/v2.4.25-attachment-ux | tee "$RUNNER_TEMP/build-245.json"
          cd build/release
          sha256sum -c SHA256SUMS.txt
          for z in *.zip; do unzip -t "$z" >/dev/null; done
          python3 - <<'PY'
          import hashlib,json,re,zipfile
          from pathlib import Path
          out=Path('.');v='2.4.25'
          expected=[f'VF_Library_V{v}_SOURCE.zip',f'VF_Library_V{v}_FULL.zip',f'VF_Library_V{v}_UPDATE.zip',f'VF_Library_V{v}_ATOMIC.zip',f'repair-v{v}.php',f'VF_Library_V{v}_RELEASE_MANIFEST.json',f'VF_Library_V{v}_RELEASE_NOTES.md','SHA256SUMS.txt']
          for n in expected: assert (out/n).is_file(),n
          with zipfile.ZipFile(out/f'VF_Library_V{v}_UPDATE.zip') as z:
            m=json.loads(z.read('atomic-manifest.json'))
            assert m['format']=='vf.library.atomic-package' and m['source_version']=='2.4.24' and m['target_version']==v
            assert m['source_schema']==m['target_schema']==2401
            seen=set()
            for e in m['files']:
              p='payload/'+e['path'];b=z.read(p);seen.add(p);assert len(b)==e['bytes'] and hashlib.sha256(b).hexdigest()==e['sha256']
            assert set(z.namelist())=={'atomic-manifest.json'}|seen
          with zipfile.ZipFile(out/f'VF_Library_V{v}_FULL.zip') as z:
            names=z.namelist();low=[x.lower() for x in names]
            assert 'version.txt' in low and z.read('VERSION.txt').decode().strip()==v
            m=json.loads(z.read('release-manifest.json'));assert m['version']==v and m['schema_version']==2401
            forbidden=[n for n in names if re.search(r'(^|/)(private_data|node_modules|\.git|tests|evidence)(/|$)',n,re.I) or n.lower().endswith(('.sqlite','.sqlite3','.db','.env','.log'))]
            assert not forbidden,forbidden
          r=json.load(open(out/f'VF_Library_V{v}_RELEASE_MANIFEST.json',encoding='utf-8'))
          assert r['version']==v and r['compatibility']['supported_from']==['2.4.24'] and r['deployment']['status']=='NOT_EXECUTED'
          print('CANDIDATE_ARTIFACT_STRUCTURE=PASS')
          PY

      - name: Candidate FULL fresh-install verification
        shell: bash
        working-directory: p02
        run: |
          set -Eeuo pipefail
          SITE="$RUNNER_TEMP/p02-full-245"; mkdir -p "$SITE"
          unzip -q build/release/VF_Library_V2.4.25_FULL.zip -d "$SITE"
          test "$(tr -d '\r\n' < "$SITE/VERSION.txt")" = 2.4.25
          ( cd "$SITE" && php cli/check-requirements.php ) > "$RUNNER_TEMP/full-capabilities.json"
          python3 - "$RUNNER_TEMP/full-capabilities.json" <<'PY'
          import json,sys;x=json.load(open(sys.argv[1]));assert x.get('ok') is True,x
          PY
          echo 'CANDIDATE_FULL_FRESH_INSTALL_PACKAGE=PASS'

      - name: 2.4.24 to 2.4.25 candidate repair upgrade fixture
        shell: bash
        working-directory: p02
        run: |
          set -Eeuo pipefail
          OLD_SRC="$RUNNER_TEMP/p02-old-src"; OLD_SITE="$RUNNER_TEMP/p02-old-site"; COOKIE="$RUNNER_TEMP/p02-old.cookie"; PORT=18126; BASE="http://127.0.0.1:$PORT"; PASS="P02-Old-${GITHUB_RUN_ID}!"
          git worktree add --detach "$OLD_SRC" "$PRODUCTION_COMMIT" >/dev/null
          bash "$OLD_SRC/scripts/build-deploy-tree.sh" "$OLD_SITE" >/dev/null
          test "$(tr -d '\r\n' < "$OLD_SITE/VERSION.txt")" = 2.4.24
          php -d display_errors=0 -S "127.0.0.1:$PORT" -t "$OLD_SITE" >"$RUNNER_TEMP/p02-old-server.log" 2>&1 & SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; git worktree remove --force "$OLD_SRC" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 60); do curl -fsS "$BASE/setup.php" >/dev/null 2>&1 && break; sleep .25; done
          curl -fsS -c "$COOKIE" "$BASE/setup.php" > "$RUNNER_TEMP/old-setup.html"
          CSRF=$(python3 - "$RUNNER_TEMP/old-setup.html" <<'PY'
          import html,re,sys;s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$COOKIE" -c "$COOKIE" -H "Origin: $BASE" --data-urlencode "setup_csrf=$CSRF" --data-urlencode "password=$PASS" --data-urlencode "password_confirm=$PASS" "$BASE/setup.php")" = 303
          php -r 'require $argv[1]."/app/bootstrap.php";$d=vftb_db();$n=gmdate("c");$q=$d->prepare("INSERT INTO text_categories(parent_id,name,description,icon,sort_order,created_at,updated_at) VALUES(NULL,?,?,?,?,?,?)");$q->execute(["Upgrade Fixture","isolated","folder",100,$n,$n]);$c=(int)$d->lastInsertId();$q=$d->prepare("INSERT INTO text_items(category_id,title,description,content,content_mode,content_format,primary_action,status,aliases,tags,created_at,updated_at) VALUES(?,?,?,?,?,?,?,?,?,?,?,?)");$q->execute([$c,"升级保持 UTF-8 ✓","fixture","before candidate upgrade durable body 中文","article","markdown","read","active","[]","[]",$n,$n]);' "$OLD_SITE"
          cp build/release/repair-v2.4.25.php "$OLD_SITE/repair-v2.4.25.php"
          curl -fsS -b "$COOKIE" -c "$COOKIE" "$BASE/repair-v2.4.25.php" > "$RUNNER_TEMP/repair-form.html"
          RCSRF=$(python3 - "$RUNNER_TEMP/repair-form.html" <<'PY'
          import html,re,sys;s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )
          curl -fsS -b "$COOKIE" -c "$COOKIE" -H "Origin: $BASE" --data-urlencode action=upgrade --data-urlencode "csrf=$RCSRF" "$BASE/repair-v2.4.25.php" > "$RUNNER_TEMP/repair-result.html"
          grep -q '升级完成' "$RUNNER_TEMP/repair-result.html"
          test "$(tr -d '\r\n' < "$OLD_SITE/VERSION.txt")" = 2.4.25
          php -r 'require $argv[1]."/app/bootstrap.php";$d=vftb_db();if(VfLibrarySchemaMigration::currentVersion($d)!==2401)exit(2);$q=$d->query("SELECT content FROM text_items WHERE title=\"升级保持 UTF-8 ✓\"");if($q->fetchColumn()!=="before candidate upgrade durable body 中文")exit(3);if($d->query("PRAGMA integrity_check")->fetchColumn()!=="ok")exit(4);if(count($d->query("PRAGMA foreign_key_check")->fetchAll())!==0)exit(5);' "$OLD_SITE"
          ( cd "$OLD_SITE" && php cli/verify.php ) > "$RUNNER_TEMP/post-upgrade-verify.json"
          python3 - "$RUNNER_TEMP/post-upgrade-verify.json" <<'PY'
          import json,sys;x=json.load(open(sys.argv[1]));assert x.get('ok') is True and int(x.get('schema_version',0))==2401,x
          PY
          kill "$SERVER_PID" 2>/dev/null || true
          git worktree remove --force "$OLD_SRC" >/dev/null
          trap - EXIT
          echo 'CANDIDATE_UPGRADE_FIXTURE_2_4_24_TO_2_4_25=PASS'

      - name: Build redacted public evidence
        if: success()
        shell: bash
        working-directory: p02
        run: |
          set -Eeuo pipefail
          mkdir -p "$PUBLIC_EVIDENCE"
          cp build/release/SHA256SUMS.txt "$PUBLIC_EVIDENCE/candidate-artifact-sha256s.txt"
          python3 - "$PUBLIC_EVIDENCE/summary.json" "$CANDIDATE_COMMIT" "${{ github.run_id }}" <<'PY'
          import json,sys,datetime
          out={'result':'PASS','project_id':'P02','project':'VF Library','production':'2.4.24','candidate':'2.4.25','schema':2401,'candidate_commit':sys.argv[2],'run_id':sys.argv[3],'runner':'GitHub Hosted Runner / ubuntu-24.04','runtime_change':['public/assets/attachments.js'],'checks':{'repository_source_manifest_php':'PASS','full_maintenance_regression':'PASS','sqlite_integrity_fk':'PASS','security':'PASS','backup_restore':'PASS','crud_search_category_attachment':'PASS','browser_e2e_responsive':'PASS','focused_attachment_modal_e2e':'PASS','cleanup_busy_recovery':'PASS','escape_close_focus_restore':'PASS','mobile_modal_overflow':'PASS','candidate_artifact_structure':'PASS','full_package':'PASS','upgrade_fixture_2_4_24_to_2_4_25':'PASS'},'production_write':0,'release':'NOT_EXECUTED','main_modified':False,'evidence_privacy':'HASH_AND_SUMMARY_ONLY_NO_PRIVATE_SOURCE_DB_SESSION_SECRET','observed_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          json.dump(out,open(sys.argv[1],'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY

      - name: Public evidence privacy gate
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$PUBLIC_EVIDENCE"
          if find "$PUBLIC_EVIDENCE" -type f \( -name '*.php' -o -name '*.js' -o -name '*.css' -o -name '*.sqlite' -o -name '*.db' -o -name '*.zip' -o -name '*.sql' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .; then exit 91; fi
          echo 'PUBLIC_EVIDENCE_PRIVACY=PASS'

      - name: Cleanup private source and raw runtime
        if: always()
        shell: bash
        run: |
          git -C p02 worktree prune 2>/dev/null || true
          rm -rf p02 "$RUNNER_TEMP"/p02-* "$RUNNER_TEMP"/vf-library-release-* || true
          echo 'PRIVATE_SOURCE_AND_RAW_RUNTIME_CLEANUP=PASS'

      - name: Upload redacted candidate evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p02-v2.4.25-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/p02-v2.4.25-candidate/
          if-no-files-found: error
          retention-days: 14
