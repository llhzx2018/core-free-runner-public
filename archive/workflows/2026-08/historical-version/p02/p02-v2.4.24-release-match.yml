name: P02 V2.4.24 Published Release Match

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2.4.24-release-match.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Require private read credential
        env:
          PRIVATE_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout exact published source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: f69346f00719a253a0f7c94121b7af2a975b74ee
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p02
          fetch-depth: 0
          persist-credentials: false
      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-zip php-curl sqlite3 curl unzip
      - name: Rebuild from original task-branch release identity
        working-directory: p02
        env:
          VF_RELEASE_SOURCE_SHA: f69346f00719a253a0f7c94121b7af2a975b74ee
          VF_RELEASE_SOURCE_REF: task/v2.4.24-live-category-counts
          VF_RELEASE_OLD_COMMIT: 333d4fd52150f1c15e9911bce312bb2b6775f856
        run: bash scripts/verify-release-artifacts.sh
      - name: Exact published asset comparison
        working-directory: p02
        env:
          PRIVATE_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,hashlib,os,urllib.request,pathlib
          req=urllib.request.Request('https://api.github.com/repos/llhzx2018/vf-library/releases/tags/v2.4.24',headers={'Authorization':'Bearer '+os.environ['PRIVATE_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'p02-release-match'})
          with urllib.request.urlopen(req,timeout=30) as r: rel=json.load(r)
          assert rel['tag_name']=='v2.4.24'
          assert rel['target_commitish']=='f69346f00719a253a0f7c94121b7af2a975b74ee'
          assets={a['name']:a for a in rel['assets']}
          expected=['VF_Library_V2.4.24_SOURCE.zip','VF_Library_V2.4.24_FULL.zip','VF_Library_V2.4.24_UPDATE.zip','VF_Library_V2.4.24_ATOMIC.zip','repair-v2.4.24.php','VF_Library_V2.4.24_RELEASE_MANIFEST.json','VF_Library_V2.4.24_RELEASE_NOTES.md','SHA256SUMS.txt']
          for name in expected:
            p=pathlib.Path('build/release')/name
            sha=hashlib.sha256(p.read_bytes()).hexdigest()
            assert name in assets
            assert assets[name].get('digest')=='sha256:'+sha, (name,assets[name].get('digest'),sha)
            assert assets[name]['size']==p.stat().st_size
            print(name,sha,p.stat().st_size)
          print('V2.4.24_PUBLISHED_RELEASE_EXACT_MATCH=PASS')
          PY
      - name: Cleanup private checkout
        if: always()
        run: rm -rf p02 "$RUNNER_TEMP"/vf-library-release-* || true
