name: P02 V2.4.25 Manifest V2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p02-v2.4.25-manifest-v2.yml']
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: task/v2.4.25-attachment-ux
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p02
          persist-credentials: false
      - name: Generate metadata-only runtime manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < p02/VERSION)" = 2.4.25
          echo "CANDIDATE_RUNTIME_COMMIT=$(git -C p02 rev-parse HEAD)"
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('p02'); old=json.loads((root/'SOURCE_MANIFEST.json').read_text()); entries=[]
          for e in old['entries']:
            p=root/e['repo_path']; b=p.read_bytes(); h=hashlib.sha256(b).hexdigest(); entries.append({'full_path':e['full_path'],'repo_path':e['repo_path'],'bytes':len(b),'sha256':h,'repo_sha256':h})
          entries.sort(key=lambda x:x['full_path'])
          out={'project':'P02 · VF Library','version':'2.4.25','schema':2401,'source_baseline_full_sha256':'PENDING_FORMAL_CANDIDATE_ARTIFACT','mapping_contract':'Each declared runtime source file must exist exactly once at repo_path; hashes bind the Git-native V2.4.25 Candidate runtime derived from Production V2.4.24. Formal release identity is not assigned by this candidate manifest.','runtime_source_file_count':len(entries),'entries':entries}
          pathlib.Path('metadata').mkdir(); pathlib.Path('metadata/SOURCE_MANIFEST.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          lines=['VF Library V2.4.25 CANDIDATE SOURCE_MANIFEST','FULL_SHA256  PENDING_FORMAL_CANDIDATE_ARTIFACT',f'RUNTIME_SOURCE_FILES  {len(entries)}','MAPPING_STATUS  CURRENT_GIT_CANDIDATE','']+[f"{e['sha256']}  {e['repo_path']}  <=  {e['full_path']}" for e in entries]
          pathlib.Path('metadata/SOURCE_MANIFEST.txt').write_text('\n'.join(lines)+'\n')
          a=next(x for x in entries if x['repo_path']=='public/assets/attachments.js');print('ATTACHMENTS_BYTES='+str(a['bytes']));print('ATTACHMENTS_SHA256='+a['sha256']);print('MANIFEST_V2=PASS')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p02-v2.4.25-manifest-v2-${{ github.run_id }}
          path: metadata/
          retention-days: 3
      - if: always()
        run: rm -rf p02 metadata
