name: P02 V2.5.18 Formal Verify And Publish

on:
  pull_request:
    branches: [main]
    paths: ['triggers/p02-v2518-formal-release.txt']

permissions:
  contents: read

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require registered capabilities
        env:
          RELEASE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: test -n "$RELEASE_TOKEN"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: d473e012b2c6674c0b5f910161a866f6b0fb3866
          token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize sealed formal pipeline for V2.5.18
        env:
          PRODUCT_REF: d473e012b2c6674c0b5f910161a866f6b0fb3866
          RELEASE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: |
          set -Eeuo pipefail
          git fetch origin task/p02-v2511-formal-release
          git show FETCH_HEAD:scripts/p02-v2510-formal-release.sh > "$RUNNER_TEMP/p02-v2518-formal.sh"
          python3 - "$RUNNER_TEMP/p02-v2518-formal.sh" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);s=p.read_text(encoding='utf-8')
          s=s.replace('2.5.10','2.5.18')
          s=s.replace('2.5.9','2.5.16')
          s=s.replace('32225789953','32280835699')
          s=s.replace('test "$(jq -r .runtime_source_file_count SOURCE_MANIFEST.json)" = 72','test "$(jq -r .runtime_source_file_count SOURCE_MANIFEST.json)" = 74')
          marker="notes=out/f'VF_Library_V{VER}_RELEASE_NOTES.md'; notes.write_text(f'''";end="''')\n arts=[sz,fz,uz,az,rf,notes]"
          if marker in s and end in s:
              i=s.index(marker);j=s.index(end,i)
              notes="""notes=out/f'VF_Library_V{VER}_RELEASE_NOTES.md'; notes.write_text(f'''# VF Library V{VER}\n\nV2.5.18 is a focused Scratch TAB overflow navigation UX maintenance release.\n\n- When the temporary TAB strip overflows, explicit left/right navigation buttons appear.\n- Navigation buttons automatically disable at the left/right boundaries and stay hidden when no overflow exists.\n- The active TAB is automatically revealed while switching through real Alt+J/K navigation.\n- Existing wheel/trackpad horizontal scrolling remains available as an auxiliary gesture.\n- Drag sorting keeps an edge auto-scroll contract for long TAB strips.\n- Real Chromium Candidate Run 32280835699 PASS: explicit controls, boundary states, active TAB reveal, wheel scrolling, no-overflow hiding and 390px mobile no horizontal overflow.\n- V2.5.17 functionality is included; this release provides the canonical direct Atomic path from authenticated Production {SRCVER} to V{VER}.\n- Schema remains {SCHEMA}; no migration.\n''')\n arts=[sz,fz,uz,az,rf,notes]"""
              s=s[:i]+notes+s[j+len(end):]
          p.write_text(s,encoding='utf-8')
          PY
          bash "$RUNNER_TEMP/p02-v2518-formal.sh"
