name: P02 V2.4.25 Focused Readback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p02-v2.4.25-focused-readback.yml']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: 77a704ee8c3d1350f9430b17cf3306f597cac8e0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p02
          persist-credentials: false
      - name: Install harness
        working-directory: p02
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-zip php-curl curl >/dev/null
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Focused readback
        working-directory: p02
        shell: bash
        run: |
          set -Eeuo pipefail
          SITE="$RUNNER_TEMP/site"; COOKIE="$RUNNER_TEMP/cookie"; PORT=18137; BASE="http://127.0.0.1:$PORT"; PASS="P02-Readback-${GITHUB_RUN_ID}!"
          bash scripts/build-deploy-tree.sh "$SITE" >/dev/null
          php -S "127.0.0.1:$PORT" -t "$SITE" >"$RUNNER_TEMP/server.log" 2>&1 & PID=$!; trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do curl -fsS "$BASE/setup.php" >/dev/null 2>&1 && break; sleep .2; done
          curl -fsS -c "$COOKIE" "$BASE/setup.php" > "$RUNNER_TEMP/setup.html"
          CSRF=$(python3 - "$RUNNER_TEMP/setup.html" <<'PY'
          import html,re,sys;s=open(sys.argv[1]).read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$COOKIE" -c "$COOKIE" -H "Origin: $BASE" --data-urlencode "setup_csrf=$CSRF" --data-urlencode "password=$PASS" --data-urlencode "password_confirm=$PASS" "$BASE/setup.php")" = 303
          cat > .readback.mjs <<'JS'
          import { chromium } from 'playwright';
          const b=await chromium.launch({headless:true}),p=await b.newPage({viewport:{width:1440,height:900}}),base=process.env.BASE_URL,password=process.env.TEST_PASSWORD;
          const result={};
          await p.goto(base+'/',{waitUntil:'networkidle'});let s=await p.evaluate(async()=>await (await fetch('/api.php?action=session')).json());if(!s?.site?.auth){await p.locator('[data-open-login]').first().click();await p.locator('#loginForm input[name="password"]').fill(password);await p.locator('#loginSubmit').click();await p.waitForFunction(async()=>Boolean((await (await fetch('/api.php?action=session')).json())?.site?.auth));}
          await p.evaluate(()=>openEditor(null,{forceContentMode:'quick',forceContentFormat:'plain'}));await p.locator('#contentForm').waitFor({state:'visible'});
          await p.evaluate(()=>{const e=document.querySelector('#contentForm [data-attachment-library]');e.focus({preventScroll:true});e.click();});await p.locator('[data-library-query]').waitFor({state:'visible'});await p.waitForTimeout(30);
          result.initialFocus=await p.evaluate(()=>document.activeElement===document.querySelector('[data-library-query]'));
          result.labelled=await p.locator('.attachment-modal').evaluate(el=>{const id=el.getAttribute('aria-labelledby');return Boolean(id&&document.getElementById(id))});
          await p.keyboard.press('Escape');await p.locator('.attachment-modal-overlay').waitFor({state:'detached'});
          for(const ms of [0,20,100]){if(ms)await p.waitForTimeout(ms);result['escape'+ms]=await p.evaluate(()=>{const op=document.querySelector('#contentForm [data-attachment-library]');return {editor:!!document.querySelector('#contentForm'),opener:!!op,focus:op===document.activeElement,active:document.activeElement?.tagName};});}
          if(result.escape100.editor&&result.escape100.opener){
            await p.evaluate(()=>document.querySelector('#contentForm [data-attachment-library]').click());await p.locator('[data-library-cleanup]').waitFor({state:'visible'});await p.evaluate(()=>document.querySelector('[data-library-cleanup]').click());await p.locator('[data-dialog-confirm]').waitFor({state:'visible'});const rp=p.waitForResponse(r=>r.url().includes('action=attachment_cleanup')&&r.request().method()==='POST');await p.evaluate(()=>document.querySelector('[data-dialog-confirm]').click());const r=await rp;result.cleanupHttp=r.status();await p.waitForTimeout(100);result.cleanupButton=await p.evaluate(()=>{const x=document.querySelector('[data-library-cleanup]');return x?{disabled:x.disabled,text:x.textContent.trim()}:null;});await p.setViewportSize({width:390,height:844});await p.waitForTimeout(100);result.mobileOverflow=await p.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
          }
          console.log('FINAL_READBACK='+JSON.stringify(result));
          await b.close();
          if(!result.initialFocus||!result.labelled||!result.escape100?.editor||!result.escape100?.opener||!result.escape100?.focus||result.cleanupHttp!==200||result.cleanupButton?.disabled||result.cleanupButton?.text!=='清理孤儿文件'||result.mobileOverflow>3)process.exit(42);
          JS
          BASE_URL="$BASE" TEST_PASSWORD="$PASS" node .readback.mjs
          echo 'FOCUSED_ATTACHMENT_READBACK=PASS'
      - if: always()
        run: rm -rf p02 "$RUNNER_TEMP/site" || true
