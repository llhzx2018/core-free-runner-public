name: P02 V2.5.18 Final Candidate Verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REF: 687e9006050d409aa00829e86fb6082547c4e570
    steps:
      - name: Require registered private capability
        env:
          READ_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: test -n "$READ_TOKEN"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: '${{ env.PRODUCT_REF }}'
          token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Exact source and static UX contract
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_REF"
          test "$(tr -d '\r\n' < VERSION)" = 2.5.18
          test "$(jq -r .version SOURCE_MANIFEST.json)" = 2.5.18
          test "$(jq -r .schema SOURCE_MANIFEST.json)" = 2401
          test "$(jq -r .runtime_source_file_count SOURCE_MANIFEST.json)" = 74
          test "$(jq -r .repo_sha256 SOURCE_MANIFEST.json)" = "$(sha256sum SOURCE_MANIFEST.txt|awk '{print $1}')"
          python3 - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open('SOURCE_MANIFEST.json',encoding='utf-8')); assert len(m['entries'])==74
          for e in m['entries']:
              b=pathlib.Path(e['repo_path']).read_bytes(); h=hashlib.sha256(b).hexdigest()
              assert len(b)==e['bytes'] and h==e['sha256']==e['repo_sha256'], e['repo_path']
          print('SOURCE_MANIFEST_74_OF_74=PASS')
          PY
          node --check public/assets/v254-common-branding.js
          node --check public/assets/scratch-tabs.js
          grep -q 'V2.5.18_SCRATCH_TAB_OVERFLOW_UX' public/assets/v254-common-branding.js
          grep -q "tabsScroll.addEventListener('wheel'" public/assets/scratch-tabs.js
          grep -q "addEventListener('dragover'" public/assets/v254-common-branding.js
          echo SOURCE_EXACT=PASS
          echo STATIC_TAB_UX_CONTRACT=PASS
      - name: Real Chromium tab overflow UX
        working-directory: product
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/final2518"; mkdir -p "$ROOT"; bash scripts/build-deploy-tree.sh "$ROOT/site" >/dev/null
          test "$(cat "$ROOT/site/VERSION.txt")" = 2.5.18
          mkdir -p "$ROOT/site/candidate"
          npm -g ls playwright >/dev/null 2>&1 || npm i -g playwright@1.55.0 >/dev/null
          playwright install chromium >/dev/null
          cat > "$ROOT/site/candidate/index.html" <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/assets/app.css"></head><body data-vftb-version="2.5.18"><header class="topbar"><div class="topbar-inner"><div class="top-actions"><div id="addContentSplit" class="add-content-split"></div></div></div></header><main>Scratch UX fixture</main><script src="/assets/v254-common-branding.js"></script></body></html>
          HTML
          php -S 127.0.0.1:18738 -t "$ROOT/site" >"$RUNNER_TEMP/php2518.log" 2>&1 & PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          cat > "$RUNNER_TEMP/check2518.cjs" <<'JS'
          const {chromium}=require('playwright');
          const tabs=Array.from({length:16},(_,i)=>({id:i+1,title:`临时页签 ${String(i+1).padStart(2,'0')} · 较长标题`,content:`内容 ${i+1}`,cursor_pos:0,scroll_top:0,is_pinned:i<2?1:0,sort_order:(i+1)*100}));
          async function mock(p){
            await p.route('**/scratch-action.php?action=*',async r=>{const action=new URL(r.request().url()).searchParams.get('action');if(action==='list')return r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,data:{open:tabs,closed:[],open_count:16,closed_count:0}})});let body={};try{body=r.request().postDataJSON()||{}}catch{}const tab=tabs.find(x=>x.id===Number(body.id||1))||tabs[0];return r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,tab,open_count:16,closed_count:0})});});
            await p.route('**/api.php?action=session',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,csrf:'x',site:{auth:true}})}));
            await p.route('**/favicon-action.php?action=status',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,favicon:{exists:false}})}));
          }
          async function open(p){await p.goto('http://127.0.0.1:18738/candidate/index.html',{waitUntil:'networkidle'});await p.click('#scratchLaunchV259');await p.waitForSelector('[data-scratch-tab-scroll="next"]',{state:'attached'});await p.waitForTimeout(450)}
          const state=async p=>p.evaluate(()=>{const s=document.querySelector('.scratch-tabs-scroll-v259'),a=document.querySelector('.scratch-tab-v259.active'),pr=document.querySelector('[data-scratch-tab-scroll="prev"]'),nx=document.querySelector('[data-scratch-tab-scroll="next"]'),sr=s.getBoundingClientRect(),ar=a&&a.getBoundingClientRect();return{left:s.scrollLeft,max:s.scrollWidth-s.clientWidth,overflow:s.scrollWidth>s.clientWidth+3,prevHidden:pr.hidden,nextHidden:nx.hidden,prevDisabled:pr.disabled,nextDisabled:nx.disabled,active:a?.dataset.scratchTab,activeVisible:!!a&&ar.left>=sr.left-2&&ar.right<=sr.right+2}});
          async function waitActiveVisible(p){await p.waitForFunction(()=>{const s=document.querySelector('.scratch-tabs-scroll-v259'),a=document.querySelector('.scratch-tab-v259.active');if(!s||!a)return false;const sr=s.getBoundingClientRect(),ar=a.getBoundingClientRect();return ar.left>=sr.left-2&&ar.right<=sr.right+2;},null,{timeout:1600});}
          (async()=>{
            const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:1180,height:820}});let errs=[];p.on('pageerror',e=>errs.push(String(e)));await mock(p);await open(p);
            let s=await state(p);if(!s.overflow||s.prevHidden||s.nextHidden||!s.prevDisabled||s.nextDisabled||s.active!=='1')throw Error('INITIAL_'+JSON.stringify(s));
            await p.click('[data-scratch-tab-scroll="next"]');await p.waitForTimeout(450);let clicked=await state(p);if(clicked.left<30||clicked.prevDisabled)throw Error('NEXT_BUTTON_'+JSON.stringify(clicked));
            const beforeWheel=clicked.left;await p.$eval('.scratch-tabs-scroll-v259',e=>e.dispatchEvent(new WheelEvent('wheel',{deltaY:180,bubbles:true,cancelable:true})));await p.waitForTimeout(450);if((await state(p)).left<=beforeWheel+10)throw Error('WHEEL_SCROLL');
            for(let i=0;i<15;i++){await p.keyboard.press('Alt+J');await waitActiveVisible(p);const k=await state(p);if(k.active!==String(i+2))throw Error('ACTIVE_SEQUENCE_'+i+'_'+JSON.stringify(k));}s=await state(p);if(s.active!=='16'||s.left<50||!s.activeVisible)throw Error('ACTIVE_END_'+JSON.stringify(s));
            for(let i=0;i<16;i++){const n=p.locator('[data-scratch-tab-scroll="next"]');if(await n.isDisabled())break;await n.click();await p.waitForTimeout(200)}s=await state(p);if(!s.nextDisabled||s.prevDisabled||Math.abs(s.max-s.left)>5)throw Error('RIGHT_EDGE_'+JSON.stringify(s));
            for(let i=0;i<16;i++){const pr=p.locator('[data-scratch-tab-scroll="prev"]');if(await pr.isDisabled())break;await pr.click();await p.waitForTimeout(200)}s=await state(p);if(!s.prevDisabled||s.nextDisabled||s.left>5)throw Error('LEFT_EDGE_'+JSON.stringify(s));
            await p.evaluate(()=>{const r=document.querySelector('[data-scratch-tabs]');Array.from(r.children).slice(2).forEach(x=>x.remove())});await p.waitForTimeout(350);s=await state(p);if(s.overflow||!s.prevHidden||!s.nextHidden)throw Error('COMPACT_'+JSON.stringify(s));if(errs.length)throw Error('PAGEERROR_'+errs.join('|'));
            const m=await b.newPage({viewport:{width:390,height:844}});await mock(m);await open(m);const ms=await m.evaluate(()=>({doc:document.documentElement.scrollWidth-document.documentElement.clientWidth,next:!document.querySelector('[data-scratch-tab-scroll="next"]').hidden,bar:document.querySelector('.scratch-bar-v259').getBoundingClientRect().width}));if(ms.doc>1||!ms.next||ms.bar>391)throw Error('MOBILE_'+JSON.stringify(ms));await b.close();
            console.log('TAB_OVERFLOW_CONTROLS=PASS');console.log('LEFT_RIGHT_BOUNDARIES=PASS');console.log('ACTIVE_TAB_AUTO_REVEAL=PASS');console.log('WHEEL_AUXILIARY_SCROLL=PASS');console.log('DRAG_EDGE_STATIC_CONTRACT=PASS');console.log('NON_OVERFLOW_HIDE=PASS');console.log('MOBILE_390_OVERFLOW=NONE');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH="$(npm root -g)" node "$RUNNER_TEMP/check2518.cjs"
          echo REAL_CHROMIUM_TAB_OVERFLOW_UX=PASS
          echo FINAL_CANDIDATE_VERIFY=PASS
          echo SCHEMA=2401
          echo PRODUCTION_WRITE=NO
