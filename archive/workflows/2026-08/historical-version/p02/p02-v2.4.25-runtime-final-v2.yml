name: P02 V2.4.25 Runtime Final V2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p02-v2.4.25-runtime-final-v2.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CANDIDATE_COMMIT: 30df45d478d3b284c6b64e5ceaa36c6cd7579b5f
      PRODUCTION_COMMIT: b8f26afd81e0c736923579eb6fe5b298dd9fc8e3
      PUBLIC_EVIDENCE: ${{ github.workspace }}/evidence/p02-v2.4.25-runtime-final-v2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: 30df45d478d3b284c6b64e5ceaa36c6cd7579b5f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p02
          fetch-depth: 0
          persist-credentials: false
      - name: Exact source gates
        working-directory: p02
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test "$(git merge-base "$PRODUCTION_COMMIT" "$CANDIDATE_COMMIT")" = "$PRODUCTION_COMMIT"
          test "$(tr -d '\r\n' < VERSION)" = 2.4.25
          python3 scripts/verify-source-manifest.py
          node --check public/assets/attachments.js
          grep -Fq 'stopImmediatePropagation' public/assets/attachments.js
          grep -Fq 'previousFocus.focus({preventScroll:true})' public/assets/attachments.js
          if grep -Fq 'setTimeout(()=>previousFocus.focus' public/assets/attachments.js; then exit 91; fi
          echo 'EXACT_SOURCE_GATES=PASS'
      - name: Install runtime
        working-directory: p02
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-zip php-curl sqlite3 curl unzip
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Complete maintenance regression
        working-directory: p02
        shell: bash
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/p02-maint-245-final-v2
          TEST_PASSWORD: P02-245-FINAL2-${{ github.run_id }}!
        run: |
          set -Eeuo pipefail
          cp scripts/maintenance-reverify.sh "$RUNNER_TEMP/maintenance.sh"
          cp tests/e2e/maintenance_reverify.mjs "$RUNNER_TEMP/e2e.mjs"
          sed -i 's/2\.4\.24/2.4.25/g' scripts/maintenance-reverify.sh tests/e2e/maintenance_reverify.mjs
          bash scripts/maintenance-reverify.sh
          python3 - "$EVIDENCE_DIR/summary.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding='utf-8'));assert x.get('result')=='PASS',x;assert x.get('version')=='2.4.25',x;assert int(x.get('schema',0))==2401,x
          print('COMPLETE_MAINTENANCE_REGRESSION=PASS')
          PY
          mv "$RUNNER_TEMP/maintenance.sh" scripts/maintenance-reverify.sh
          mv "$RUNNER_TEMP/e2e.mjs" tests/e2e/maintenance_reverify.mjs
          rm -rf node_modules package-lock.json package.json
          test -z "$(git status --porcelain)"
      - name: Focused attachment UX regression
        working-directory: p02
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null
          SITE="$RUNNER_TEMP/site"; COOKIE="$RUNNER_TEMP/cookie"; PORT=18133; BASE="http://127.0.0.1:$PORT"; PASS="P02-AttFinal2-${GITHUB_RUN_ID}!"
          bash scripts/build-deploy-tree.sh "$SITE" >/dev/null
          php -d display_errors=0 -S "127.0.0.1:$PORT" -t "$SITE" >"$RUNNER_TEMP/server.log" 2>&1 & PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do curl -fsS "$BASE/setup.php" >/dev/null 2>&1 && break; sleep .25; done
          curl -fsS -c "$COOKIE" "$BASE/setup.php" > "$RUNNER_TEMP/setup.html"
          CSRF=$(python3 - "$RUNNER_TEMP/setup.html" <<'PY'
          import html,re,sys;s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$COOKIE" -c "$COOKIE" -H "Origin: $BASE" --data-urlencode "setup_csrf=$CSRF" --data-urlencode "password=$PASS" --data-urlencode "password_confirm=$PASS" "$BASE/setup.php")" = 303
          cat > .focused.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});const page=await browser.newPage({viewport:{width:1440,height:900}});const base=process.env.BASE_URL,password=process.env.TEST_PASSWORD,errors=[];page.on('pageerror',e=>errors.push(String(e)));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          try{
            await page.goto(base+'/',{waitUntil:'networkidle'});let s=await page.evaluate(async()=>await (await fetch('/api.php?action=session')).json());if(!s?.site?.auth){await page.locator('[data-open-login]').first().click();await page.locator('#loginForm input[name="password"]').fill(password);await page.locator('#loginSubmit').click();await page.waitForFunction(async()=>Boolean((await (await fetch('/api.php?action=session')).json())?.site?.auth));}s=await page.evaluate(async()=>await (await fetch('/api.php?action=session')).json());if(s?.version!=='2.4.25')throw new Error('version mismatch');
            await page.evaluate(()=>openEditor(null,{forceContentMode:'quick',forceContentFormat:'plain'}));await page.locator('#contentForm').waitFor({state:'visible'});
            const state=await page.evaluate(()=>{const el=document.querySelector('#contentForm [data-attachment-library]');if(!el)return {exists:false};el.focus({preventScroll:true});const out={exists:true,connected:el.isConnected,wired:typeof el.onclick==='function',disabled:el.disabled,focused:document.activeElement===el};el.click();return out});if(!state.exists||!state.connected||!state.wired||state.disabled||!state.focused)throw new Error('opener invalid '+JSON.stringify(state));
            await page.locator('[data-library-query]').waitFor({state:'visible'});await page.waitForFunction(()=>document.activeElement===document.querySelector('[data-library-query]'));
            const labelled=await page.locator('.attachment-modal').evaluate(el=>{const id=el.getAttribute('aria-labelledby');return Boolean(id&&document.getElementById(id))});if(!labelled)throw new Error('aria label missing');
            await page.keyboard.press('Escape');await page.locator('.attachment-modal-overlay').waitFor({state:'detached'});await page.waitForFunction(()=>document.activeElement===document.querySelector('#contentForm [data-attachment-library]'));if(!await page.locator('#contentForm').isVisible())throw new Error('editor canceled by Escape');
            await page.evaluate(()=>document.querySelector('#contentForm [data-attachment-library]').click());await page.locator('[data-library-cleanup]').waitFor({state:'visible'});await page.evaluate(()=>document.querySelector('[data-library-cleanup]').click());await page.locator('[data-dialog-confirm]').waitFor({state:'visible'});const responsePromise=page.waitForResponse(r=>r.url().includes('action=attachment_cleanup')&&r.request().method()==='POST');await page.evaluate(()=>document.querySelector('[data-dialog-confirm]').click());const response=await responsePromise;if(!response.ok())throw new Error('cleanup HTTP '+response.status());await page.waitForFunction(()=>{const b=document.querySelector('[data-library-cleanup]');return b&&!b.disabled&&(b.textContent||'').trim()==='清理孤儿文件'});
            await page.setViewportSize({width:390,height:844});await page.waitForTimeout(120);const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);if(overflow>3)throw new Error('mobile overflow '+overflow);if(errors.length)throw new Error(errors.join(' | '));console.log('ATTACHMENT_FOCUSED_REGRESSION=PASS');
          }finally{await browser.close()}
          JS
          BASE_URL="$BASE" TEST_PASSWORD="$PASS" node .focused.mjs
          rm -f .focused.mjs; kill "$PID" 2>/dev/null || true; trap - EXIT
          rm -rf node_modules package-lock.json package.json
          test -z "$(git status --porcelain)"
          echo 'ATTACHMENT_ESCAPE_ISOLATION=PASS'
          echo 'ATTACHMENT_FOCUS_RESTORE=PASS'
          echo 'ATTACHMENT_CLEANUP_BUSY_RECOVERY=PASS'
          echo 'ATTACHMENT_MOBILE_390=PASS'
      - name: Redacted evidence
        if: success()
        working-directory: p02
        shell: bash
        run: |
          mkdir -p "$PUBLIC_EVIDENCE"
          python3 - "$PUBLIC_EVIDENCE/summary.json" "$CANDIDATE_COMMIT" "${{ github.run_id }}" <<'PY'
          import json,sys,datetime
          x={'result':'PASS','project':'P02 · VF Library','production':'2.4.24','candidate':'2.4.25','schema':2401,'candidate_runtime_commit':sys.argv[2],'run_id':sys.argv[3],'checks':{'source_manifest':'PASS','php_js':'PASS','sqlite':'PASS','security':'PASS','backup_restore':'PASS','crud_search_attachment_category':'PASS','browser_e2e':'PASS','responsive':'PASS','attachment_escape_isolation':'PASS','attachment_focus_restore':'PASS','attachment_cleanup_busy_recovery':'PASS','attachment_mobile_390':'PASS'},'runtime_changed_files':['public/assets/attachments.js'],'production_write':0,'main_modified':False,'release':'NOT_EXECUTED','privacy':'SUMMARY_ONLY_NO_PRIVATE_SOURCE_DB_SESSION_SECRET','observed_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()};json.dump(x,open(sys.argv[1],'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
      - name: Privacy cleanup
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$PUBLIC_EVIDENCE"
          if find "$PUBLIC_EVIDENCE" -type f \( -name '*.php' -o -name '*.js' -o -name '*.css' -o -name '*.sqlite' -o -name '*.db' -o -name '*.zip' \) -print -quit | grep -q .; then exit 91; fi
          rm -rf p02 "$RUNNER_TEMP/site" "$RUNNER_TEMP/cookie" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: p02-v2.4.25-runtime-final-v2-${{ github.run_id }}
          path: evidence/p02-v2.4.25-runtime-final-v2/
          retention-days: 14
