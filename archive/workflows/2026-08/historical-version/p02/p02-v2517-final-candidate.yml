name: P02 V2.5.17 Final Candidate Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2517-final-candidate.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_BRANCH: maintenance/v2.5.17-library-model-convergence
      READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Require registered private capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
          echo CAPABILITY_GATE=PASS

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: '${{ env.PRODUCT_BRANCH }}'
          token: '${{ env.READ_TOKEN }}'
          path: product
          fetch-depth: 0
          persist-credentials: false

      - name: Reseal exact candidate source
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < VERSION)" = 2.5.17
          node --check public/assets/v254-common-branding.js
          grep -q 'V2.5.17_LIBRARY_MODEL_CONVERGENCE' public/assets/v254-common-branding.js
          grep -q 'recentItemId' public/assets/v254-common-branding.js
          grep -q 'side-item\[data-mode="quick"\]' public/assets/v254-common-branding.css
          grep -q "last_copied_at IS NOT NULL OR last_opened_at IS NOT NULL" src/app/Repository.php
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          changelog=Path('CHANGELOG.md').read_text(encoding='utf-8')
          section='''## V2.5.17 · 资料库模型收敛 · 2026-08-19\n\n- 明确“临时工作台 = 真正的便签 / 随手记；资料库 = 长期保存资料”的产品边界。\n- 左侧资料库导航隐藏历史“便签 / 文章资料”一级筛选，只保留全部内容、收藏、最近使用与分类。\n- 旧 quick/article 本地视图状态自动安全回落到“全部内容”，底层 content_mode 兼容字段与历史数据不迁移。\n- 最近使用统一记录明确的打开、阅读、编辑、复制或调用；自动首选、布局恢复、程序渲染及非条目菜单操作不会污染最近使用。\n- 用户可见 quick/article 术语收敛为“普通资料 / 长文资料”；Schema 继续 2401，无 Migration。\n\n'''
          body=changelog
          if body.startswith('## V2.5.17'):
              nxt=body.find('\n## ',4)
              body=body[nxt+1:] if nxt!=-1 else ''
          Path('CHANGELOG.md').write_text(section+body,encoding='utf-8')
          p=Path('SOURCE_MANIFEST.json');m=json.loads(p.read_text(encoding='utf-8'))
          m['version']='2.5.17';m['mapping_contract']=str(m.get('mapping_contract','')).replace('V2.5.16','V2.5.17')
          assert len(m['entries'])==m['runtime_source_file_count']==74
          for e in m['entries']:
              raw=Path(e['repo_path']).read_bytes();h=hashlib.sha256(raw).hexdigest();e['bytes']=len(raw);e['sha256']=h;e['repo_sha256']=h
          lines=['VF Library Source Manifest','Version: 2.5.17','Schema: 2401','Runtime source files: 74','']
          for e in m['entries']: lines.append(f"{e['sha256']}  {e['bytes']:>8}  {e['repo_path']} -> {e['full_path']}")
          txt='\n'.join(lines)+'\n';Path('SOURCE_MANIFEST.txt').write_text(txt,encoding='utf-8')
          m['repo_sha256']=hashlib.sha256(txt.encode()).hexdigest()
          p.write_text(json.dumps(m,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          for e in m['entries']:
              raw=Path(e['repo_path']).read_bytes();h=hashlib.sha256(raw).hexdigest();assert len(raw)==e['bytes'] and h==e['sha256']==e['repo_sha256'],e['repo_path']
          assert hashlib.sha256(Path('SOURCE_MANIFEST.txt').read_bytes()).hexdigest()==m['repo_sha256']
          print('SOURCE_MANIFEST_74_OF_74=PASS')
          print('SOURCE_MANIFEST_TXT_SHA=PASS')
          PY
          bash scripts/build-deploy-tree.sh "$RUNNER_TEMP/preflight-tree" >/dev/null
          test "$(cat "$RUNNER_TEMP/preflight-tree/VERSION.txt")" = 2.5.17
          echo BUILD_DEPLOY_TREE=PASS
          echo SCHEMA=2401

      - name: Fresh install runtime
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php8.3-cli php8.3-sqlite3 php8.3-zip sqlite3 >/dev/null
          SITE="$RUNNER_TEMP/p02-v2517-final-site";mkdir -p "$SITE"
          bash scripts/build-deploy-tree.sh "$SITE" >/dev/null
          php -S 127.0.0.1:18741 -t "$SITE" >"$RUNNER_TEMP/php.log" 2>&1 & echo $! > "$RUNNER_TEMP/php.pid"
          sleep 1
          curl -fsS -c "$RUNNER_TEMP/cookies" http://127.0.0.1:18741/setup.php > "$RUNNER_TEMP/setup.html"
          CSRF="$(python3 - "$RUNNER_TEMP/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);print(m.group(1) if m else '')
          PY
          )"; test -n "$CSRF"
          curl -sS -D "$RUNNER_TEMP/setup.headers" -o /dev/null -b "$RUNNER_TEMP/cookies" \
            -H 'Origin: http://127.0.0.1:18741' -H 'Referer: http://127.0.0.1:18741/setup.php' \
            --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'password=P02-V2517-Final-Test!' --data-urlencode 'password_confirm=P02-V2517-Final-Test!' \
            http://127.0.0.1:18741/setup.php
          grep -Eq '^HTTP/.* 303' "$RUNNER_TEMP/setup.headers"
          echo FRESH_INSTALL=PASS

      - name: Real Chromium final semantics
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          PID="$(cat "$RUNNER_TEMP/php.pid")"
          trap 'kill "$PID" || true; echo "--- PHP LOG ---"; tail -200 "$RUNNER_TEMP/php.log" || true' EXIT
          npm -g ls playwright >/dev/null 2>&1 || npm i -g playwright@1.55.0 >/dev/null
          playwright install chromium >/dev/null
          cat > "$RUNNER_TEMP/final.cjs" <<'JS'
          const {chromium}=require('playwright');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await chromium.launch({headless:true});const page=await browser.newPage({viewport:{width:1440,height:1000}});const base='http://127.0.0.1:18741';
            const recent=()=>page.evaluate(()=>fetch('/api.php?action=content_list&mode=recent&status=active&page=1&page_size=20').then(r=>r.json()));
            const openItem=async id=>{const l=page.locator(`[data-open="${id}"]`);if(await l.count()){await l.first().click();return 'list'}const n=page.locator(`[data-notebook-item="${id}"]`);if(await n.count()){await n.first().click();return 'notebook'}throw Error('ITEM_TRIGGER_NOT_FOUND_'+id)};
            const openMore=async id=>{const l=page.locator(`[data-item-more="${id}"]`);if(await l.count()){await l.first().click();return 'list'}const n=page.locator(`[data-notebook-more="${id}"]`);if(await n.count()){await n.first().click();return 'notebook'}throw Error('ITEM_MORE_NOT_FOUND_'+id)};
            await page.goto(base+'/',{waitUntil:'networkidle'});await page.click('[data-open-login]');await page.fill('input[name="password"]','P02-V2517-Final-Test!');await page.click('#loginSubmit');await page.waitForFunction(()=>document.querySelector('#accountBtn')?.textContent.includes('退出'));
            const ia=await page.evaluate(()=>({q:getComputedStyle(document.querySelector('.side-item[data-mode="quick"]')).display,a:getComputedStyle(document.querySelector('.side-item[data-mode="article"]')).display,all:document.querySelector('.side-item[data-mode="all"]')?.innerText||'',fav:document.querySelector('.side-item[data-mode="favorite"]')?.innerText||'',recent:document.querySelector('.side-item[data-mode="recent"]')?.innerText||''}));
            assert(ia.q==='none'&&ia.a==='none','LEGACY_PRIMARY_NAV_VISIBLE');assert(ia.all.includes('全部内容')&&ia.fav.includes('我的收藏')&&ia.recent.includes('最近使用'),'PRIMARY_IA_MISSING');
            for(const legacy of ['quick','article']){await page.evaluate(v=>localStorage.setItem('vftb-mode',v),legacy);await page.reload({waitUntil:'networkidle'});await page.waitForFunction(()=>localStorage.getItem('vftb-mode')==='all')}
            const c=await page.evaluate(async()=>{const s=await fetch('/api.php?action=session').then(r=>r.json()),csrf=s.csrf;const post=async(a,b)=>{const r=await fetch('/api.php?action='+a,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(b)}),j=await r.json();if(!r.ok||j.ok===false)throw Error(a+JSON.stringify(j));return j};const cat=await post('category_save',{name:'V2517 Final'}),base={category_id:cat.id,description:'',tags:'',aliases:'',is_favorite:false,is_pinned:false,status:'active',attachment_ids:[]};const q=await post('content_save',{...base,title:'普通资料',content:'普通资料正文',content_mode:'quick',content_format:'plain',primary_action:'copy'}),a=await post('content_save',{...base,title:'长文资料',content:'# 长文资料\n\n阅读测试',content_mode:'article',content_format:'markdown',primary_action:'read'}),e=await post('content_save',{...base,title:'编辑资料',content:'编辑测试',content_mode:'quick',content_format:'plain',primary_action:'copy'});const boot=await fetch('/api.php?action=app_bootstrap').then(r=>r.json());return{cat:cat.id,q:q.id,a:a.id,e:e.id,setting:Number(boot.data.settings.article_open_counts_recent||0)}});
            assert(c.setting===0,'LEGACY_ARTICLE_OPEN_SETTING_NOT_ZERO');
            await page.reload({waitUntil:'networkidle'});await sleep(1000);let r=await recent();assert(Number(r.data.pagination.total)===0,'AUTO_SELECTION_POLLUTED_RECENT');
            const qView=await openItem(c.q);await sleep(900);r=await recent();assert(Number(r.data.pagination.total)===1&&Number(r.data.items[0].id)===Number(c.q)&&r.data.items[0].last_opened_at,'QUICK_OPEN_RECENT_FAIL');
            await sleep(1050);await page.goto(base+'/',{waitUntil:'networkidle'});const aView=await openItem(c.a);await sleep(900);r=await recent();assert(Number(r.data.pagination.total)===2&&Number(r.data.items[0].id)===Number(c.a)&&r.data.items[0].last_opened_at,'ARTICLE_OPEN_RECENT_FAIL');
            await sleep(1050);await page.goto(base+'/',{waitUntil:'networkidle'});const eView=await openMore(c.e);await page.locator('.context[data-recent-item-id] [data-edit]').click();await page.waitForSelector('#contentForm',{state:'visible'});await sleep(900);const hidden=await page.evaluate(()=>{const s=document.querySelector('select[name="content_mode"]');return !!(s&&s.closest('.field')&&s.closest('.field').hidden)});assert(hidden,'CONTENT_MODE_VISIBLE');r=await recent();assert(Number(r.data.pagination.total)===3&&Number(r.data.items[0].id)===Number(c.e),'EDIT_RECENT_FAIL');const editStamp=r.data.items[0].last_opened_at;
            await sleep(1050);await page.goto(base+'/',{waitUntil:'networkidle'});await openMore(c.e);await page.keyboard.press('Escape');const cm=page.locator(`[data-category-more="${c.cat}"]`);if(await cm.count()){await cm.first().click();const catEdit=page.locator('.context [data-edit]');if(await catEdit.count()){await catEdit.first().click();await sleep(900)}}r=await recent();const eRow=r.data.items.find(x=>Number(x.id)===Number(c.e));assert(eRow&&eRow.last_opened_at===editStamp,'CATEGORY_EDIT_POLLUTED_RECENT');
            if(await page.locator('.modal-overlay').count())await page.keyboard.press('Escape');await page.goto(base+'/',{waitUntil:'networkidle'});await page.waitForFunction(()=>Number(document.querySelector('#recentCount')?.textContent||0)===3);await page.click('.side-item[data-mode="recent"]');await page.waitForFunction(()=>document.body.innerText.includes('最近打开、阅读、编辑、复制或调用过的资料'));
            await page.goto(base+'/',{waitUntil:'networkidle'});await page.click('#addContentMenuBtn');await sleep(120);const text=await page.evaluate(()=>document.body.innerText);assert(text.includes('新建资料')&&text.includes('新建长文'),'CREATE_LABEL_CONVERGENCE_FAIL');
            const mobile=await browser.newPage({viewport:{width:390,height:844}});await mobile.goto(base+'/',{waitUntil:'networkidle'});const overflow=await mobile.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);assert(overflow<=1,'MOBILE_OVERFLOW_'+overflow);const mi=await mobile.evaluate(()=>({q:getComputedStyle(document.querySelector('.side-item[data-mode="quick"]')).display,a:getComputedStyle(document.querySelector('.side-item[data-mode="article"]')).display}));assert(mi.q==='none'&&mi.a==='none','MOBILE_LEGACY_NAV_VISIBLE');
            await browser.close();console.log('ACTUAL_QUICK_VIEW='+qView);console.log('ACTUAL_ARTICLE_VIEW='+aView);console.log('ACTUAL_EDIT_VIEW='+eView);console.log('PRIMARY_LIBRARY_IA=PASS');console.log('LEGACY_MODE_FALLBACK=PASS');console.log('AUTO_SELECTION_RECENT=PASS');console.log('QUICK_OPEN_RECENT=PASS');console.log('ARTICLE_OPEN_RECENT_SETTING_OFF=PASS');console.log('EDIT_RECENT=PASS');console.log('CATEGORY_EDIT_RECENT_ISOLATION=PASS');console.log('RECENT_ORDERING=PASS');console.log('VISIBLE_TERMINOLOGY_CONVERGENCE=PASS');console.log('MOBILE_390_OVERFLOW=NONE');console.log('REAL_CHROMIUM_V2517=PASS');
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          JS
          NODE_PATH="$(npm root -g)" node "$RUNNER_TEMP/final.cjs"
          echo PRODUCTION_WRITE=NO

      - name: Commit final verified manifest
        working-directory: product
        shell: bash
        env:
          TOKEN: ${{ env.WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          if ! git diff --cached --quiet; then git commit -m 'docs(release): seal V2.5.17 final candidate manifest'; fi
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/llhzx2018/vf-library.git"
          git push origin HEAD:${PRODUCT_BRANCH}
          echo FINAL_CANDIDATE_PUSH=PASS
