name: P02 V2.4.25 Window Manifest Meta
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p02-v2.4.25-window-manifest-meta.yml']
permissions:
  contents: read
jobs:
  meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: task/v2.4.25-attachment-ux
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p02
          persist-credentials: false
      - name: Emit metadata only
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir metadata
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path('p02')
          head=subprocess.check_output(['git','-C','p02','rev-parse','HEAD'],text=True).strip()
          p=root/'public/assets/attachments.js'; b=p.read_bytes()
          data={'task_head':head,'path':'public/assets/attachments.js','bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          pathlib.Path('metadata/attachment-runtime.json').write_text(json.dumps(data,indent=2)+'\n')
          print(json.dumps(data))
          PY
          node --check p02/public/assets/attachments.js
          grep -Fq "window.addEventListener('keydown',onKeydown,true)" p02/public/assets/attachments.js
          grep -Fq "window.removeEventListener('keydown',onKeydown,true)" p02/public/assets/attachments.js
          grep -Fq 'finally{setBusy(cleanup,false);}' p02/public/assets/attachments.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p02-v2.4.25-window-runtime-meta-${{ github.run_id }}
          path: metadata/
          retention-days: 3
      - if: always()
        run: rm -rf p02 metadata
