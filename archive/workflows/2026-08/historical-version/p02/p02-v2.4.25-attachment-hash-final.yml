name: P02 V2.4.25 Attachment Hash Final
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p02-v2.4.25-attachment-hash-final.yml']
permissions:
  contents: read
jobs:
  hash:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: task/v2.4.25-attachment-ux
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p02
          persist-credentials: false
      - name: Exact attachment identity
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "TASK_HEAD=$(git -C p02 rev-parse HEAD)"
          echo "ATTACHMENTS_BYTES=$(wc -c < p02/public/assets/attachments.js | tr -d ' ')"
          echo "ATTACHMENTS_SHA256=$(sha256sum p02/public/assets/attachments.js | awk '{print $1}')"
          node --check p02/public/assets/attachments.js
          grep -Fq 'stopImmediatePropagation' p02/public/assets/attachments.js
          grep -Fq 'previousFocus.focus({preventScroll:true})' p02/public/assets/attachments.js
          if grep -Fq 'setTimeout(()=>previousFocus.focus' p02/public/assets/attachments.js; then exit 91; fi
          echo 'ATTACHMENT_FINAL_HASH_GATE=PASS'
      - if: always()
        run: rm -rf p02
