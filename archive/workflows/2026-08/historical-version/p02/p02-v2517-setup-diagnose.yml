name: P02 V2.5.17 Setup Diagnose

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2517-setup-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: maintenance/v2.5.17-library-model-convergence
          token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
          path: product
          persist-credentials: false
      - name: Diagnose fresh setup POST
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php8.3-cli php8.3-sqlite3 php8.3-zip sqlite3 >/dev/null
          ROOT="$RUNNER_TEMP/setup-diagnose"; SITE="$ROOT/site"; mkdir -p "$SITE"
          bash scripts/build-deploy-tree.sh "$SITE" >/dev/null
          php -S 127.0.0.1:18738 -t "$SITE" >"$RUNNER_TEMP/setup-php.log" 2>&1 & PID=$!
          trap 'kill $PID || true; echo "--- PHP LOG ---"; cat "$RUNNER_TEMP/setup-php.log" || true' EXIT
          sleep 1
          curl -fsS -c "$RUNNER_TEMP/cookies" http://127.0.0.1:18738/setup.php > "$RUNNER_TEMP/setup-get.html"
          CSRF="$(python3 - <<'PY'
          import re
          s=open('/home/runner/work/_temp/setup-get.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf" value="([^"]+)"',s)
          print(m.group(1) if m else '')
          PY
          )"
          test -n "$CSRF"
          curl -sS -D "$RUNNER_TEMP/headers" -o "$RUNNER_TEMP/body" -b "$RUNNER_TEMP/cookies" -c "$RUNNER_TEMP/cookies" \
            -H 'Origin: http://127.0.0.1:18738' \
            -H 'Referer: http://127.0.0.1:18738/setup.php' \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode 'password=P02-V2517-Test-Only!' \
            --data-urlencode 'password_confirm=P02-V2517-Test-Only!' \
            http://127.0.0.1:18738/setup.php
          echo '--- HEADERS ---'; cat "$RUNNER_TEMP/headers"
          echo '--- BODY TEXT ---'
          python3 - <<'PY'
          import re,html
          s=open('/home/runner/work/_temp/body',encoding='utf-8').read()
          text=re.sub(r'<[^>]+>','\n',s)
          text=html.unescape(text)
          print('\n'.join(x.strip() for x in text.splitlines() if x.strip()))
          PY
          if grep -Eq '^HTTP/.* 303' "$RUNNER_TEMP/headers"; then echo FRESH_SETUP_POST=PASS; else echo FRESH_SETUP_POST=FAIL; exit 1; fi
