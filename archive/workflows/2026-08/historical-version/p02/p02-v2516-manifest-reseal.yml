name: P02 V2.5.16 Source Manifest Reseal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reseal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_REF: dc1549d2c6202c11d9220b9e459e3e085966ff69
      TARGET_BRANCH: feature/v2.5.16-source-manifest-reseal
      SEALED_V2515_REF: 8c1ec28e45212b733a449278874a942e9138c785
    steps:
      - name: Require registered private capability
        env:
          WRITE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: test -n "$WRITE_TOKEN"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: '${{ env.PRODUCT_REF }}'
          token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
          path: product
          fetch-depth: 0
          persist-credentials: false

      - name: Rebuild exact V2.5.16 source manifests
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < VERSION)" = 2.5.16
          git switch -c "$TARGET_BRANCH"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          jp=Path('SOURCE_MANIFEST.json')
          obj=json.loads(jp.read_text(encoding='utf-8'))
          entries=obj.get('entries',[])
          assert len(entries)==74, len(entries)

          lines=[
              'VF Library V2.5.16 CANDIDATE SOURCE_MANIFEST',
              'FULL_SHA256  PENDING_FORMAL_CANDIDATE_ARTIFACT',
              'RUNTIME_SOURCE_FILES  74',
              'MAPPING_STATUS  CURRENT_GIT_CANDIDATE',
              ''
          ]
          for e in entries:
              repo=Path(e['repo_path'])
              assert repo.is_file(), e['repo_path']
              data=repo.read_bytes()
              sha=hashlib.sha256(data).hexdigest()
              e['bytes']=len(data)
              e['sha256']=sha
              e['repo_sha256']=sha
              lines.append(f"{sha}  {e['repo_path']}  <=  {e['full_path']}")

          txt='\n'.join(lines)+'\n'
          Path('SOURCE_MANIFEST.txt').write_text(txt,encoding='utf-8')
          repo_sha=hashlib.sha256(txt.encode('utf-8')).hexdigest()

          obj['version']='2.5.16'
          obj['schema']=2401
          obj['runtime_source_file_count']=74
          obj['source_baseline_full_sha256']='PENDING_FORMAL_CANDIDATE_ARTIFACT'
          obj['mapping_contract']='Each declared runtime source file must exist exactly once at repo_path; hashes bind the Git-native V2.5.16 candidate deploy tree. Formal release identity is not assigned by this candidate manifest.'
          obj['repo_sha256']=repo_sha
          jp.write_text(json.dumps(obj,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')

          # Independent readback.
          re=json.loads(jp.read_text(encoding='utf-8'))
          assert re['version']=='2.5.16'
          assert re['schema']==2401
          assert re['runtime_source_file_count']==74
          assert re['repo_sha256']==hashlib.sha256(Path('SOURCE_MANIFEST.txt').read_bytes()).hexdigest()
          for e in re['entries']:
              data=Path(e['repo_path']).read_bytes()
              sha=hashlib.sha256(data).hexdigest()
              assert e['bytes']==len(data)
              assert e['sha256']==sha and e['repo_sha256']==sha
          print('SOURCE_MANIFEST_RESEAL=PASS')
          print('RUNTIME_SOURCE_FILES=74')
          print('REPO_SHA256='+repo_sha)
          PY
          test "$(jq -r .version SOURCE_MANIFEST.json)" = 2.5.16
          test "$(jq -r .schema SOURCE_MANIFEST.json)" = 2401
          test "$(jq -r .runtime_source_file_count SOURCE_MANIFEST.json)" = 74
          test "$(jq -r .repo_sha256 SOURCE_MANIFEST.json)" = "$(sha256sum SOURCE_MANIFEST.txt | awk '{print $1}')"
          while read -r expected repo _ target; do
            test -f "$repo"
            test "$(sha256sum "$repo"|awk '{print $1}')" = "$expected"
          done < <(awk '$3=="<="' SOURCE_MANIFEST.txt)
          git diff --check
          echo SOURCE_EXACT=PASS

      - name: Build and Chromium re-verification
        working-directory: product
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/vf2516-reseal"; mkdir -p "$ROOT/site" "$ROOT/baseline/assets"
          bash scripts/build-deploy-tree.sh "$ROOT/site" >/dev/null
          test "$(cat "$ROOT/site/VERSION.txt")" = 2.5.16
          npm -g ls playwright >/dev/null 2>&1 || npm i -g playwright@1.55.0 >/dev/null
          playwright install chromium >/dev/null
          git show "$SEALED_V2515_REF:public/assets/app.css" > "$ROOT/baseline/assets/app.css"
          git show "$SEALED_V2515_REF:public/assets/scratch-tabs.css" > "$ROOT/baseline/assets/scratch-tabs.css"
          FIXTURE='<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/PREFIX/assets/app.css"><link rel="stylesheet" href="/PREFIX/assets/scratch-tabs.css"></head><body><div class="shell"><header class="topbar"><div class="topbar-inner">VF Library</div></header><div class="workspace"><aside class="sidebar"><div class="side-scroll"><div class="side-item active">阅读分类</div></div></aside><main class="main"><div class="page"><div class="content-list"><div class="content-row"><div class="content-main"><strong>长期阅读测试文章</strong><div class="content-preview">护眼表面验证</div></div></div></div></div></main></div></div><div class="scratch-workspace-v259"><div class="scratch-editor-wrap-v259"><textarea class="scratch-editor-v259">临时工作台长时间写作测试</textarea></div></div></body></html>'
          mkdir -p "$ROOT/site/candidate" "$ROOT/baseline/baseline"
          cp -R "$ROOT/site/assets" "$ROOT/site/candidate/assets"
          printf '%s' "${FIXTURE//PREFIX/candidate}" > "$ROOT/site/candidate/__eye.html"
          cp -R "$ROOT/baseline/assets" "$ROOT/site/baseline-assets"
          sed 's#/baseline/assets/#/baseline-assets/#g' <<<"${FIXTURE//PREFIX/baseline/assets}" > "$ROOT/site/__baseline.html"
          php -S 127.0.0.1:18726 -t "$ROOT/site" >"$RUNNER_TEMP/php.log" 2>&1 &
          PHP_PID=$!; trap 'kill $PHP_PID || true' EXIT; sleep 1
          cat > "$RUNNER_TEMP/check.cjs" <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const sample=async(page,url,theme)=>{
              await page.goto(url,{waitUntil:'networkidle'});
              await page.evaluate(t=>t==='dark'?document.documentElement.setAttribute('data-theme','dark'):document.documentElement.removeAttribute('data-theme'),theme);
              return await page.evaluate(()=>{const cs=getComputedStyle(document.documentElement),q=s=>getComputedStyle(document.querySelector(s)).backgroundColor;const vars={};for(const k of ['--bg','--surface','--surface-soft','--surface-muted','--border','--border-strong'])vars[k]=cs.getPropertyValue(k).trim();return {vars,main:q('.main'),sidebar:q('.sidebar'),card:q('.content-list'),scratch:q('.scratch-editor-v259')};});
            };
            const p=await browser.newPage({viewport:{width:1440,height:1000}});
            const base='http://127.0.0.1:18726';
            const light=await sample(p,base+'/candidate/__eye.html','light');
            if(light.vars['--bg']!=='#f2f2ef'||light.vars['--surface']!=='#fafaf8')throw new Error('LIGHT_BAD '+JSON.stringify(light));
            for(const k of ['main','sidebar','card','scratch'])if(light[k]==='rgb(255, 255, 255)')throw new Error('PURE_WHITE_'+k);
            const candidateDark=await sample(p,base+'/candidate/__eye.html','dark');
            // Baseline CSS tokens are read from the exact sealed file rather than assumed.
            const baselineHtml='<!doctype html><html><head><link rel="stylesheet" href="/baseline-assets/app.css"><link rel="stylesheet" href="/baseline-assets/scratch-tabs.css"></head><body><div class="main"></div><div class="sidebar"></div><div class="content-list"></div><textarea class="scratch-editor-v259"></textarea></body></html>';
            await p.setContent(baselineHtml,{waitUntil:'load'});
            await p.addStyleTag({url:base+'/baseline-assets/app.css'});await p.addStyleTag({url:base+'/baseline-assets/scratch-tabs.css'});
            await p.evaluate(()=>document.documentElement.setAttribute('data-theme','dark'));
            const baselineDark=await p.evaluate(()=>{const cs=getComputedStyle(document.documentElement),vars={};for(const k of ['--bg','--surface','--surface-soft','--surface-muted','--border','--border-strong'])vars[k]=cs.getPropertyValue(k).trim();return vars;});
            if(JSON.stringify(candidateDark.vars)!==JSON.stringify(baselineDark))throw new Error('DARK_DRIFT '+JSON.stringify({candidateDark,baselineDark}));
            const m=await browser.newPage({viewport:{width:390,height:844}});await m.goto(base+'/candidate/__eye.html',{waitUntil:'networkidle'});const overflow=await m.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);if(overflow>1)throw new Error('MOBILE_OVERFLOW '+overflow);
            await browser.close();
            console.log('REAL_CHROMIUM_EYE_COMFORT_REVERIFY=PASS');
            console.log('DARK_MODE_BASELINE_MATCH=PASS');
            console.log('MOBILE_390_OVERFLOW=NONE');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH="$(npm root -g)" node "$RUNNER_TEMP/check.cjs"
          echo BUILD_DEPLOY_TREE=PASS
          echo SCHEMA=2401
          echo PRODUCTION_WRITE=NO

      - name: Push corrected candidate source
        working-directory: product
        env:
          WRITE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          git commit -m 'chore(source): reseal V2.5.16 source manifest'
          git push "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-library.git" HEAD:"$TARGET_BRANCH"
