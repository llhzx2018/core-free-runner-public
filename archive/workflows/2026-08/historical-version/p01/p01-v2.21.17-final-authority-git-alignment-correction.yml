name: P01 V2.21.17 Final Authority Git Alignment Correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p01-v2.21.17-final-authority-git-alignment-correction.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO: llhzx2018/vf-start
  ALIGNMENT_SOURCE_COMMIT: a0fe293a459c1961534ed604fee9c3dc67eefb67
  PRODUCT_COMMIT: 89f55e9a772904ebe03537ec54c2891e13a52c80
  VERSION_EXPECTED: '2.21.17'

jobs:
  align:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Credential gate
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
          echo 'CREDENTIAL_GATE=PASS'

      - name: Checkout exact alignment source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.ALIGNMENT_SOURCE_COMMIT }}
          token: ${{ env.WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: p01

      - name: Guard current Remote Truth and product identity
        run: |
          set -Eeuo pipefail
          main="$(gh api repos/$REPO/git/ref/heads/main --jq .object.sha)"
          develop="$(gh api repos/$REPO/git/ref/heads/develop --jq .object.sha)"
          test "$main" = "$ALIGNMENT_SOURCE_COMMIT"
          test "$develop" = "$ALIGNMENT_SOURCE_COMMIT"
          test "$(git -C p01 rev-parse HEAD)" = "$ALIGNMENT_SOURCE_COMMIT"
          test "$(tr -d '\r\n' < p01/VERSION)" = "$VERSION_EXPECTED"
          test "$(tr -d '\r\n' < p01/src/VERSION.txt)" = "$VERSION_EXPECTED"
          test -z "$(git -C p01 diff --name-only "$PRODUCT_COMMIT" "$ALIGNMENT_SOURCE_COMMIT" -- src)"
          echo 'REMOTE_PREALIGNMENT_TRUTH=PASS'
          echo 'PRODUCT_SOURCE_CHANGED_AFTER_89F55E9=NO'

      - name: Correct VF_PROJECT final Git Authority semantics
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, os

          p=Path('p01/VF_PROJECT.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          source=os.environ['ALIGNMENT_SOURCE_COMMIT']

          d['status']='V2.21.17 PRODUCTION / FINAL ONLINE PASS / CLOSED'
          d['production_version']='2.21.17'
          d['lifecycle']='STABLE_OPERATIONS / CLOSED'
          d['current_phase']='STABLE_OPERATIONS / V2.21.17 PRODUCTION CLOSED'
          d['current_state']='PRODUCTION 2.21.17 = LATEST 2.21.17 / GIT PRODUCTION TRUTH ALIGNED / CLOSED'
          d['final_online_pass']='YES'
          d['main_updated']=True
          d['develop_updated']=True
          d['main_alignment']='PASS / NON_FORCE_FAST_FORWARD / main = Production Truth'
          d['project_block']=[]
          d['repository_block']=[]
          d['product_failure']='NONE CONFIRMED'
          d['next_action']='STOP FOR MASTER / P01 V2.21.17 CLOSED'

          gc=d.setdefault('git_closure',{})
          gc.pop('remote_main',None)
          gc.pop('remote_develop',None)
          gc['scope']='V2.21.17 FINAL GIT PRODUCTION TRUTH ALIGNMENT'
          gc['alignment_source_commit']=source
          gc['promotion_method']='NON_FORCE_FAST_FORWARD'
          gc['main_promotion']='PASS'
          gc['develop_promotion']='PASS'
          gc['main_equals_develop']='YES'
          gc['main_version']='2.21.17'
          gc['main_equals_production_truth']='PASS'
          gc['product_source_changed_after_candidate_identity']=False
          gc['note']='Final branch refs are intentionally not stored as self-referential commit SHAs. alignment_source_commit records the verified pre-correction alignment base.'

          d['git_production_truth_alignment']={
              'status':'PASS',
              'alignment_source_commit':source,
              'promotion_method':'NON_FORCE_FAST_FORWARD',
              'main_promotion':'PASS',
              'develop_promotion':'PASS',
              'main_equals_develop':'YES',
              'main_version':'2.21.17',
              'production_version':'2.21.17',
              'main_equals_production_truth':'PASS',
              'product_source_changed_after_89f55e9':False,
              'final_online_pass':'YES',
              'lifecycle':'STABLE_OPERATIONS / CLOSED',
              'project_status':'CLOSED'
          }

          fr=d.get('v2_21_17_formal_release')
          if isinstance(fr,dict):
              fr['main_promotion']='PASS / NON_FORCE_FAST_FORWARD'
              fr['develop_promotion']='PASS / NON_FORCE_FAST_FORWARD'
              fr['git_production_truth_alignment']='PASS'
              fr['alignment_source_commit']=source
              fr['status']='CLOSED'

          pc=d.get('v2_21_17_production_closure')
          if isinstance(pc,dict):
              pc['git_production_truth_alignment']='PASS'
              pc['promotion_method']='NON_FORCE_FAST_FORWARD'
              pc['alignment_source_commit']=source
              pc['status']='CLOSED'

          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          python3 -m json.tool p01/VF_PROJECT.json >/dev/null
          changed="$(git -C p01 diff --name-only)"
          test "$changed" = 'VF_PROJECT.json'
          test -z "$(git -C p01 diff --name-only "$PRODUCT_COMMIT" -- src)"
          echo 'AUTHORITY_CORRECTION_SCOPE=VF_PROJECT_ONLY'

      - name: Create Authority-only correction commit
        id: commit
        run: |
          set -Eeuo pipefail
          git -C p01 config user.name 'VictorForge'
          git -C p01 config user.email 'llhzx2018@gmail.com'
          git -C p01 add VF_PROJECT.json
          git -C p01 commit -m 'docs(P01): align V2.21.17 final Git production truth authority'
          commit="$(git -C p01 rev-parse HEAD)"
          parent="$(git -C p01 rev-parse HEAD^)"
          test "$parent" = "$ALIGNMENT_SOURCE_COMMIT"
          test "$(git -C p01 diff-tree --no-commit-id --name-only -r HEAD)" = 'VF_PROJECT.json'
          test -z "$(git -C p01 diff --name-only "$PRODUCT_COMMIT" HEAD -- src)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "AUTHORITY_COMMIT=$commit"

      - name: Promote same commit to main NON-FORCE
        run: |
          set -Eeuo pipefail
          git -C p01 push origin HEAD:refs/heads/main
          test "$(gh api repos/$REPO/git/ref/heads/main --jq .object.sha)" = '${{ steps.commit.outputs.commit }}'
          echo 'MAIN_PROMOTION=PASS_NON_FORCE_FAST_FORWARD'

      - name: Promote same commit to develop NON-FORCE
        run: |
          set -Eeuo pipefail
          git -C p01 push origin HEAD:refs/heads/develop
          test "$(gh api repos/$REPO/git/ref/heads/develop --jq .object.sha)" = '${{ steps.commit.outputs.commit }}'
          echo 'DEVELOP_PROMOTION=PASS_NON_FORCE_FAST_FORWARD'

      - name: Final Remote Readback
        run: |
          set -Eeuo pipefail
          commit='${{ steps.commit.outputs.commit }}'
          main="$(gh api repos/$REPO/git/ref/heads/main --jq .object.sha)"
          develop="$(gh api repos/$REPO/git/ref/heads/develop --jq .object.sha)"
          test "$main" = "$commit"
          test "$develop" = "$commit"
          test "$main" = "$develop"

          main_version="$(gh api "repos/$REPO/contents/VERSION?ref=main" --jq .content | tr -d '\n' | base64 -d | tr -d '\r\n')"
          develop_version="$(gh api "repos/$REPO/contents/VERSION?ref=develop" --jq .content | tr -d '\n' | base64 -d | tr -d '\r\n')"
          test "$main_version" = '2.21.17'
          test "$develop_version" = '2.21.17'

          gh api "repos/$REPO/contents/VF_PROJECT.json?ref=main" --jq .content | tr -d '\n' | base64 -d > /tmp/final.json
          jq -e --arg source "$ALIGNMENT_SOURCE_COMMIT" '
            .status=="V2.21.17 PRODUCTION / FINAL ONLINE PASS / CLOSED" and
            .production_version=="2.21.17" and
            .final_online_pass=="YES" and
            .lifecycle=="STABLE_OPERATIONS / CLOSED" and
            .main_updated==true and
            .develop_updated==true and
            .main_alignment=="PASS / NON_FORCE_FAST_FORWARD / main = Production Truth" and
            .git_production_truth_alignment.status=="PASS" and
            .git_production_truth_alignment.alignment_source_commit==$source and
            .git_production_truth_alignment.promotion_method=="NON_FORCE_FAST_FORWARD" and
            .git_production_truth_alignment.main_promotion=="PASS" and
            .git_production_truth_alignment.develop_promotion=="PASS" and
            .git_production_truth_alignment.main_equals_develop=="YES" and
            .git_production_truth_alignment.main_version=="2.21.17" and
            .git_production_truth_alignment.main_equals_production_truth=="PASS" and
            .git_production_truth_alignment.product_source_changed_after_89f55e9==false and
            .git_production_truth_alignment.project_status=="CLOSED" and
            (.git_closure|has("remote_main")|not) and
            (.git_closure|has("remote_develop")|not)
          ' /tmp/final.json >/dev/null

          test -z "$(git -C p01 diff --name-only "$PRODUCT_COMMIT" "$commit" -- src)"
          echo "FINAL_MAIN=$main"
          echo "FINAL_DEVELOP=$develop"
          echo 'MAIN_EQUALS_DEVELOP=YES'
          echo 'MAIN_VERSION=2.21.17'
          echo 'MAIN_EQUALS_PRODUCTION_TRUTH=PASS'
          echo 'PRODUCT_SOURCE_CHANGED_AFTER_89F55E9=NO'
          echo 'FINAL_ONLINE_PASS=YES'
          echo 'LIFECYCLE=STABLE_OPERATIONS_CLOSED'
          echo 'PROJECT_STATUS=CLOSED'
          echo 'STOP_FOR_MASTER'
