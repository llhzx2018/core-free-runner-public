name: P01 V2.21.22 Release API

on:
  pull_request:
    paths:
      - 'requests/p01-v22122-release-api-*.txt'

permissions:
  contents: read

jobs:
  release:
    if: startsWith(github.head_ref, 'agent/p01-v22122-release-api-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      CANDIDATE_BRANCH: maintenance/admin-consolidation-2.21.22-20260820
      CANDIDATE: 84ed48f5208f23e63e4e92c98695d53af6f278a7
      CANDIDATE_TREE: 49bc9b9d040f17fdbb370a9167e3e75cf38b8b4f
      SOURCE_TAG: v2.21.21
      SOURCE_COMMIT: 0b62c96b787e03b0dda6ef8493d29755b6baf83e
      SOURCE_TREE: 02b6199ab82f2fb03dd9d8048288421037869e4e
      TAG: v2.21.22
      GATE_ARTIFACT_ID: '9376555408'
      UPDATE_SHA: 53f59b70d3475c27c7134016fccd83741c043be9b15e9d269d49e35cae488610
      FULL_SHA: 541fc0bc262215b2c9f32f41deedebc8601c0bfcd3d042a45a43503265ebca8e
      REPAIR_SHA: ffb4ce348cba642a213b5d4622322d3bececc3d278594b2cb84bd80ce375acd1
      UPDATE_BYTES: '1080666'
      FULL_BYTES: '493717'
      REPAIR_BYTES: '3118915'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Exact source identity readback
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch "$CANDIDATE_BRANCH" "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" candidate
          git clone -q --depth 1 --branch "$SOURCE_TAG" "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" prior
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git -C prior rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C prior rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          echo EXACT_SOURCE_IDENTITY=PASS
      - name: Fetch exact Formal Gate PASS assets
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-release /tmp/p01-gate.zip
          mkdir -p /tmp/p01-release
          gh api --method GET "repos/llhzx2018/core-free-runner-public/actions/artifacts/${GATE_ARTIFACT_ID}/zip" > /tmp/p01-gate.zip
          unzip -q /tmp/p01-gate.zip -d /tmp/p01-release
          ROOT=/tmp/p01-release/p01-v22122-artifact-gate
          test "$(sha256sum "$ROOT/VF_Start_V2.21.22_UPDATE.zip"|awk '{print $1}')" = "$UPDATE_SHA"
          test "$(sha256sum "$ROOT/VF_Start_V2.21.22_FULL.zip"|awk '{print $1}')" = "$FULL_SHA"
          test "$(sha256sum "$ROOT/repair-v2.21.22.php"|awk '{print $1}')" = "$REPAIR_SHA"
          test "$(stat -c %s "$ROOT/VF_Start_V2.21.22_UPDATE.zip")" = "$UPDATE_BYTES"
          test "$(stat -c %s "$ROOT/VF_Start_V2.21.22_FULL.zip")" = "$FULL_BYTES"
          test "$(stat -c %s "$ROOT/repair-v2.21.22.php")" = "$REPAIR_BYTES"
          jq -e --arg c "$CANDIDATE" '.pass==true and .candidate==$c and .version=="2.21.22" and .production_changed==false' /tmp/p01-release/p01-v22122-gate-result.json >/dev/null
          echo EXACT_GATE_ASSETS=PASS
      - name: Create exact tag through GitHub API
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          gh api "repos/${PRODUCT_REPO}/git/ref/tags/${TAG}" > /tmp/tag.json 2>/tmp/tag.err
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            test "$(jq -r '.object.sha' /tmp/tag.json)" = "$CANDIDATE"
          else
            gh api --method POST "repos/${PRODUCT_REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="$CANDIDATE" > /tmp/tag.json
            test "$(jq -r '.object.sha' /tmp/tag.json)" = "$CANDIDATE"
          fi
          echo TAG_REMOTE_READBACK=PASS
      - name: Create or complete exact GitHub Release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT=/tmp/p01-release/p01-v22122-artifact-gate
          cat > /tmp/notes.md <<'EOF'
          V2.21.22 是 VF Start 的个人使用体验精修版本。

          - 收藏改为网址旁常驻 ☆ / ★，点击即可收藏或取消。
          - “我的收藏”、菜单、编辑弹窗与首页常用入口统一使用“收藏”语义。
          - 网址后台“选择本页”移入表格选择列头，修复工具栏错位。
          - “备份与恢复”与“设置”减少伪二级菜单，备份列表支持分页。
          - 真实 Chrome 已验证收藏、后台操作与响应式。
          - Schema 2026080902 不变；Browser Helper 1.6.4 不变。
          EOF
          if gh release view "$TAG" --repo "$PRODUCT_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ROOT/VF_Start_V2.21.22_UPDATE.zip" "$ROOT/VF_Start_V2.21.22_FULL.zip" "$ROOT/repair-v2.21.22.php" --repo "$PRODUCT_REPO" --clobber
          else
            gh release create "$TAG" "$ROOT/VF_Start_V2.21.22_UPDATE.zip" "$ROOT/VF_Start_V2.21.22_FULL.zip" "$ROOT/repair-v2.21.22.php" --repo "$PRODUCT_REPO" --title 'VF Start V2.21.22' --notes-file /tmp/notes.md --verify-tag
          fi
          gh api "repos/${PRODUCT_REPO}/releases/tags/${TAG}" > /tmp/release.json
          test "$(jq -r '.tag_name' /tmp/release.json)" = "$TAG"
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.21.22_UPDATE.zip")|.size' /tmp/release.json)" = "$UPDATE_BYTES"
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.21.22_FULL.zip")|.size' /tmp/release.json)" = "$FULL_BYTES"
          test "$(jq -r '.assets[]|select(.name=="repair-v2.21.22.php")|.size' /tmp/release.json)" = "$REPAIR_BYTES"
          echo "RELEASE_ID=$(jq -r '.id' /tmp/release.json)"
          echo "RELEASED_AT=$(jq -r '.published_at' /tmp/release.json)"
          echo "UPDATE_ASSET_ID=$(jq -r '.assets[]|select(.name==\"VF_Start_V2.21.22_UPDATE.zip\")|.id' /tmp/release.json)"
          echo RELEASE_METADATA=PASS
      - name: Remote asset SHA readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/remote && mkdir -p /tmp/remote
          gh release download "$TAG" --repo "$PRODUCT_REPO" --dir /tmp/remote --pattern 'VF_Start_V2.21.22_UPDATE.zip' --pattern 'VF_Start_V2.21.22_FULL.zip' --pattern 'repair-v2.21.22.php'
          test "$(sha256sum /tmp/remote/VF_Start_V2.21.22_UPDATE.zip|awk '{print $1}')" = "$UPDATE_SHA"
          test "$(sha256sum /tmp/remote/VF_Start_V2.21.22_FULL.zip|awk '{print $1}')" = "$FULL_SHA"
          test "$(sha256sum /tmp/remote/repair-v2.21.22.php|awk '{print $1}')" = "$REPAIR_SHA"
          echo REMOTE_ASSET_SHA_READBACK=PASS
      - name: Upload release metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v22122-release-api-${{ github.run_id }}
          path: |
            /tmp/tag.json
            /tmp/release.json
          if-no-files-found: warn
