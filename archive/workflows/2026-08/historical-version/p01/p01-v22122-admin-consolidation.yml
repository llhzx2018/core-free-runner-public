            ['href'=>'settings.php#account','label'=>'管理员账号'],
            ['href'=>'workbench.php?route=rss','label'=>'RSS 订阅'],
            ['href'=>'system.php','label'=>'系统状态'],
        ]],""", """        ['key'=>'data','label'=>'备份与恢复','href'=>'data-safety.php','icon'=>'recovery','children'=>[]],
        ['key'=>'settings','label'=>'设置','href'=>'settings.php','icon'=>'settings','children'=>[]],""")
          replace(Path('src/app/AdminShell.php'), """<link rel="stylesheet" href="<?=htmlspecialchars(vf_admin_asset_url('assets/reference-ui.css'),ENT_QUOTES,'UTF-8')?>">
<?= $headHtml ?>""", """<link rel="stylesheet" href="<?=htmlspecialchars(vf_admin_asset_url('assets/reference-ui.css'),ENT_QUOTES,'UTF-8')?>">
<link rel="stylesheet" href="<?=htmlspecialchars(vf_admin_asset_url('assets/admin-consolidation.css'),ENT_QUOTES,'UTF-8')?>">
<?= $headHtml ?>""")
          replace(Path('src/app/AdminShell.php'), """<script src="<?=htmlspecialchars(vf_admin_asset_url('assets/reference-ui.js'),ENT_QUOTES,'UTF-8')?>" defer></script>
</head>""", """<script src="<?=htmlspecialchars(vf_admin_asset_url('assets/reference-ui.js'),ENT_QUOTES,'UTF-8')?>" defer></script>
<script src="<?=htmlspecialchars(vf_admin_asset_url('assets/admin-consolidation.js'),ENT_QUOTES,'UTF-8')?>" defer></script>
</head>""")

