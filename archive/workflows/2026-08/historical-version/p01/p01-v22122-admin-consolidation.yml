name: P01 VF Start V2.21.22 Admin Consolidation

on:
  push:
    branches: [main]
    paths:
      - 'requests/p01-v22122-admin-consolidation-*.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p01-v22122-admin-consolidation
  cancel-in-progress: false

env:
  PRODUCT_REPO: llhzx2018/vf-start
  BRANCH: maintenance/admin-consolidation-2.21.22-20260820
  BASE_COMMIT: 0b62c96b787e03b0dda6ef8493d29755b6baf83e
  VERSION: '2.21.22'

jobs:
  engineer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Credential gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$WRITE_TOKEN" || { echo 'VF_RELEASE_WRITE_TOKEN_MISSING' >&2; exit 78; }

      - name: Checkout maintenance branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --branch "$BRANCH" "https://x-access-token:${WRITE_TOKEN}@github.com/${PRODUCT_REPO}.git" product
          test "$(tr -d '\r\n' < product/VERSION)" = '2.21.21'
          test "$(tr -d '\r\n' < product/src/VERSION.txt)" = '2.21.21'
          git -C product merge-base --is-ancestor "$BASE_COMMIT" HEAD

      - name: Apply full backend consolidation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('product')

          def replace(path, old, new, count=1):
              p=root/path
              s=p.read_text(encoding='utf-8')
              if s.count(old) < count:
                  raise SystemExit(f'anchor missing: {path}: {old[:80]!r}')
              s=s.replace(old,new,count)
              p.write_text(s,encoding='utf-8',newline='\n')

