          js=r'''(()=>{'use strict';
function setupSelectPageMirror(){
  const main=document.getElementById('selectPage');
  const mobile=document.getElementById('selectPageMobile');
  if(!main||!mobile)return;
  const sync=()=>{mobile.checked=main.checked;mobile.indeterminate=main.indeterminate;};
  mobile.addEventListener('change',()=>{main.checked=mobile.checked;main.indeterminate=false;main.dispatchEvent(new Event('change',{bubbles:true}));sync();});
  main.addEventListener('change',()=>setTimeout(sync,0));
  const body=document.getElementById('linksBody');
  if(body)new MutationObserver(()=>queueMicrotask(sync)).observe(body,{childList:true,subtree:true});
  sync();
}
function setupPager(boxId,pageSize=10){
  const box=document.getElementById(boxId);
  const pager=document.querySelector('[data-vf-pager-for="'+boxId+'"]');
  if(!box||!pager)return;
  const info=pager.querySelector('[data-vf-page-info]');
  const prev=pager.querySelector('[data-vf-prev]');
  const next=pager.querySelector('[data-vf-next]');
  let page=1;
  function items(){return [...box.querySelectorAll('.backup-list > .backup-item')];}
  function render(reset=false){
    const rows=items();
    if(reset)page=1;
    const pages=Math.max(1,Math.ceil(rows.length/pageSize));
    page=Math.min(Math.max(1,page),pages);
    const start=(page-1)*pageSize,end=start+pageSize;
    rows.forEach((row,i)=>row.hidden=i<start||i>=end);
    pager.hidden=rows.length<=pageSize;
    if(info)info.textContent='第 '+page+' / '+pages+' 页 · '+rows.length+' 条';
    if(prev)prev.disabled=page<=1;
    if(next)next.disabled=page>=pages;
  }
  prev?.addEventListener('click',()=>{page--;render();});
  next?.addEventListener('click',()=>{page++;render();});
  let scheduled=false;
  new MutationObserver(()=>{if(scheduled)return;scheduled=true;queueMicrotask(()=>{scheduled=false;render(true);});}).observe(box,{childList:true,subtree:true});
  render(true);
}
document.addEventListener('DOMContentLoaded',()=>{
  setupSelectPageMirror();
  setupPager('backups',10);
  setupPager('disasterPackages',10);
});
})();
'''
