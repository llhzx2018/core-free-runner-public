      <label class="btn"><input id="selectPage" type="checkbox"> 选择本页</label>""", """      <select id="categoryFilter"><option value="">全部分类</option></select>
      <label class="btn vf-select-page-mobile"><input id="selectPageMobile" type="checkbox"> 选择本页</label>""")
