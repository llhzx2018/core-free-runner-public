name: P01 V2.21.17 Release Authority State

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p01-v2.21.17-release-authority-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      BRANCH: maintenance/post-seal-health-2.21.17-20260816
      PRODUCT_COMMIT: 89f55e9a772904ebe03537ec54c2891e13a52c80
      PRODUCT_TREE: 184738a87e5bdf9a4d2cd912933f6a935dcc9038
      RELEASE_ID: '371276138'
      CORE_UPDATES_COMMIT: 92adb4319a720f31c35cd5fd270bc47e9f8d18a2
    steps:
      - name: Checkout current Candidate Authority branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.BRANCH }}
          token: ${{ env.WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: p01

      - name: Guard product identity and current production boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < p01/VERSION)" = '2.21.17'
          test "$(tr -d '\r\n' < p01/src/VERSION.txt)" = '2.21.17'
          git -C p01 cat-file -e "$PRODUCT_COMMIT^{commit}"
          test "$(git -C p01 rev-parse "$PRODUCT_COMMIT^{tree}")" = "$PRODUCT_TREE"
          echo "AUTHORITY_BASE=$(git -C p01 rev-parse HEAD)" >> "$GITHUB_ENV"
          echo 'AUTHORITY_PRODUCT_IDENTITY_GUARD=PASS'

      - name: Write exact post-release current truth
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,pathlib,os
          root=pathlib.Path('p01')
          p=root/'VF_PROJECT.json'
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['production_version']=='2.21.16'
          assert x['candidate_version']=='2.21.17'
          assert x['candidate_identity']['candidate_product_patch_identity_commit']==os.environ['PRODUCT_COMMIT']
          assert x['candidate_identity']['candidate_product_patch_identity_tree']==os.environ['PRODUCT_TREE']
          assert x['candidate_identity']['product_source_changed_after_89f55e9'] is False
          x['status']='V2.21.17 FORMAL RELEASE PUBLISHED / CORE-UPDATES PUBLISHED / AUTHENTICATED PRODUCTION DISCOVERY PENDING'
          x['candidate_state']='VERIFIED / FORMAL RELEASE PUBLISHED'
          x['candidate_verification']='PASS'
          x['current_phase']='V2.21.17 FORMAL RELEASE COMPLETE / REAL PRODUCTION AUTHENTICATED DISCOVERY PENDING'
          x['current_authority']='V2.21.16 PRODUCTION TRUTH + V2.21.17 IMMUTABLE FORMAL RELEASE + DISCOVERY-PENDING OVERLAY'
          x['current_state']='V2.21.17 RELEASE PUBLISHED / PRODUCTION STILL 2.21.16 / AUTHENTICATED DISCOVERY PENDING'
          x['lifecycle']='PRODUCTION 2.21.16 STABLE / V2.21.17 FORMAL RELEASE PUBLISHED / PRE-UPGRADE DISCOVERY'
          x['release_authorization']='AUTHORIZED / EXECUTED / V2.21.17 FORMAL RELEASE PUBLISHED'
          x['verified_release_ready']=True
          x['release_ready']='YES / RELEASE PUBLISHED'
          x['formal_artifact_gate']='PASS'
          x['final_online_pass']='NO / AUTHENTICATED PRODUCTION DISCOVERY PENDING'
          x['v2_21_17_formal_release']={
            'version':'2.21.17',
            'candidate_product_commit':os.environ['PRODUCT_COMMIT'],
            'candidate_product_tree':os.environ['PRODUCT_TREE'],
            'schema':'2026080902',
            'tag':'v2.21.17',
            'release_id':int(os.environ['RELEASE_ID']),
            'release_target_commit':os.environ['PRODUCT_COMMIT'],
            'update_asset':'VF_Start_V2.21.17_UPDATE.zip',
            'update_bytes':1043007,
            'update_sha256':'dec98a321dcfba560f1055c34fabbcee454b37ea9ab41886c09fd0f4f5cddeac',
            'full_asset':'VF_Start_V2.21.17_FULL.zip',
            'full_bytes':479778,
            'full_sha256':'8bcd6765236ceab1e555f369a919192af3131ae7da0a27058adc847878c51c63',
            'formal_release_initial_run_id':31937431512,
            'initial_run_post_publication_readback':'HARNESS_SYNTAX_ERROR AFTER SUCCESSFUL IMMUTABLE PUBLICATION / NOT PRODUCT FAILURE',
            'post_release_closure_run_id':31937510617,
            'post_release_closure':'PASS / ALL REMOTE ASSETS EXACT',
            'core_updates_commit':os.environ['CORE_UPDATES_COMMIT'],
            'core_updates':'P01 2.21.16 -> 2.21.17 / REMOTE READBACK PASS',
            'production_current_public_readback':'2.21.16 / PASS',
            'production_authenticated_discovery':'PENDING',
            'discovery_probe_run_id':31937596026,
            'discovery_probe':'update_status HTTP 401 ADMIN LOGIN REQUIRED; RETIRED BRIDGES HTTP 404',
            'production_write':0,
            'production_upgrade':'NOT EXECUTED',
            'main_promotion':'NOT EXECUTED',
            'product_failure':'NONE CONFIRMED',
            'project_block':'NONE'
          }
          us=x.setdefault('update_system',{})
          us.update({
            'project_id':'P01','component_id':'APP','target_version':'2.21.17','production_version':'2.21.16',
            'schema_from':'2026080902','schema_to':'2026080902','manifest_truth':'llhzx2018/core-updates/projects/P01.json',
            'release_truth':'GitHub Release','read_credential':'VF_PRIVATE_READ_TOKEN','write_credential':'VF_RELEASE_WRITE_TOKEN',
            'browser_extension_unit':'INDEPENDENT / 1.6.4 / UNCHANGED','production_bridge':'RETIRED / 404 / NOT REINTRODUCED',
            'production_upgrade':'NOT EXECUTED FOR V2.21.17','formal_tag':'v2.21.17','candidate_commit':os.environ['PRODUCT_COMMIT'],
            'update_asset':'VF_Start_V2.21.17_UPDATE.zip','update_asset_bytes':1043007,
            'update_asset_sha256':'dec98a321dcfba560f1055c34fabbcee454b37ea9ab41886c09fd0f4f5cddeac',
            'core_updates':'2.21.17 / VERIFIED','core_updates_commit':os.environ['CORE_UPDATES_COMMIT'],
            'production_discovery':'AUTHENTICATED ADMIN READBACK PENDING'
          })
          x['next_action']='OPEN REAL PRODUCTION ADMIN SESSION -> RUN READ-ONLY UPDATE CHECK/STATUS -> CONFIRM CURRENT 2.21.16 / TARGET 2.21.17 / AVAILABLE YES -> STOP FOR MASTER; DO NOT UPGRADE'
          p.write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          current=root/'docs/authority/CURRENT.md'
          current.write_text(f'''# P01 · VF Start · Current Authority Overlay\n\n> 更新时间：2026-08-16\n> 状态：CURRENT / V2.21.17 FORMAL RELEASE PUBLISHED / AUTHENTICATED PRODUCTION DISCOVERY PENDING\n\n## 当前正式状态\n\n```text\nProduction: 2.21.16 / UNCHANGED\nSchema: 2026080902 / UNCHANGED\nCandidate / Release: 2.21.17\nCandidate Product Commit: {os.environ['PRODUCT_COMMIT']}\nCandidate Product Tree: {os.environ['PRODUCT_TREE']}\nProduct Source Changed After Candidate Identity: NO\nCandidate Verification: PASS\nFormal Artifact Gate: PASS\nTag: v2.21.17\nRelease ID: 371276138\nUPDATE: VF_Start_V2.21.17_UPDATE.zip\nUPDATE bytes: 1043007\nUPDATE SHA-256: dec98a321dcfba560f1055c34fabbcee454b37ea9ab41886c09fd0f4f5cddeac\ncore-updates Commit: {os.environ['CORE_UPDATES_COMMIT']}\ncore-updates Target: 2.21.17\nProduction Current Public Readback: 2.21.16 / PASS\nProduction Authenticated Discovery: PENDING\nProduction Upgrade: NOT EXECUTED\nmain Promotion: NOT EXECUTED\nProduct Failure: NONE CONFIRMED\nProject Block: NONE\n```\n\n## Release 与远端回读\n\n正式发布前对最终字节重新执行 PHP 8.0、Atomic、负向篡改、Fresh FULL、精确 2.21.16→2.21.17、业务数据、备份和 SQLite Gate，全部 PASS。\n\n初次 Formal Release Run `31937431512` 已成功创建不可变 Tag / Release / Assets，随后只因发布后回读 Harness 的 Python 括号语法错误停止；未覆盖或替换任何资产。Post-Release Closure Run `31937510617` 重新确定性构建同一正式字节并与远端全部资产逐一比较，bytes / SHA / asset set 全部精确一致，然后发布 `core-updates`。\n\n## Production Discovery 边界\n\nRead-Only Probe Run `31937596026` 已确认：\n\n```text\nProduction Current: 2.21.16\napi.php?action=update_status: HTTP 401 / 需要管理员登录\n旧 Discovery Bridge: HTTP 404 / 已退役\n旧 Credential Activator: HTTP 404 / 已退役\nProduction Write: 0\nupdate_prepare: NOT CALLED\nupdate_install: NOT CALLED\n```\n\n因此当前不能把 `core-updates = 2.21.17` 推断成“真实 Production 后台已发现”。最后一个合法 Gate 是在真实 Production 管理员 Session 内执行只读 Update Check / Status，确认 `Current 2.21.16 / Target 2.21.17 / Available YES`。不得重新部署 Bridge，也不得执行 Production Upgrade。\n\n## NEXT\n\n```text\nREAL PRODUCTION ADMIN SESSION\n→ READ-ONLY UPDATE CHECK / STATUS\n→ CONFIRM 2.21.16 → 2.21.17 AVAILABLE YES\n→ STOP FOR MASTER / USER AUTHORIZATION\n```\n''',encoding='utf-8')

          handoff=root/'docs/handoff/CURRENT_STATE.md'
          handoff.write_text(f'''# CURRENT STATE · P01 VF Start\n\n更新时间：2026-08-16\n\n```text\nProduction: 2.21.16 / UNCHANGED\nCandidate / Formal Release: 2.21.17\nSchema: 2026080902 / UNCHANGED\nProduct Commit: {os.environ['PRODUCT_COMMIT']}\nProduct Tree: {os.environ['PRODUCT_TREE']}\nTag: v2.21.17\nRelease ID: 371276138\nUPDATE Asset: VF_Start_V2.21.17_UPDATE.zip\nUPDATE bytes: 1043007\nUPDATE SHA-256: dec98a321dcfba560f1055c34fabbcee454b37ea9ab41886c09fd0f4f5cddeac\ncore-updates Commit: {os.environ['CORE_UPDATES_COMMIT']}\ncore-updates Target: 2.21.17 / VERIFIED\nProduction Current Public Readback: 2.21.16 / PASS\nProduction Authenticated Discovery: PENDING\nProduction Update Status Anonymous Probe: HTTP 401 / ADMIN REQUIRED\nLegacy Bridge / Activator: HTTP 404 / RETIRED\nProduction Write: 0\nProduction Upgrade: NOT EXECUTED\nmain Promotion: NOT EXECUTED\nProduct Failure: NONE CONFIRMED\nProject Block: NONE\n```\n\n## Evidence\n\n- Candidate Regression Run: `31936680515` / PASS\n- Formal Artifact Gate Closure Run: `31937010308` / PASS\n- Formal Release Initial Run: `31937431512` / immutable publication succeeded; post-publication harness readback syntax failure only\n- Post-Release Closure Run: `31937510617` / PASS / all remote assets exact / core-updates remote readback PASS\n- Production Read-Only Probe Run: `31937596026` / COMPLETE / current 2.21.16 confirmed; authenticated discovery requires admin session\n\n## NEXT ACTION\n\n```text\n在真实 Production 管理员 Session 内只执行 Update Check / Status，\n确认 Current 2.21.16 / Target 2.21.17 / Update Available YES，\n然后 STOP FOR MASTER。\n```\n\n禁止执行升级，禁止修改 Production，禁止晋级 main，禁止创建 2.21.18。\n''',encoding='utf-8')

          ev=root/'docs/evidence/V2.21.17_FORMAL_RELEASE_AND_DISCOVERY_CURRENT_STATE.md'
          ev.write_text(f'''# P01 · VF Start · V2.21.17 Formal Release + Discovery Current State\n\n- Candidate Product Commit：`{os.environ['PRODUCT_COMMIT']}`\n- Candidate Product Tree：`{os.environ['PRODUCT_TREE']}`\n- Schema：`2026080902`\n- Candidate Regression：Run `31936680515` / PASS\n- Formal Artifact Gate：Run `31937010308` / PASS\n- Tag：`v2.21.17` → exact Candidate\n- GitHub Release ID：`371276138`\n- UPDATE：`VF_Start_V2.21.17_UPDATE.zip` / `1043007` bytes / `dec98a321dcfba560f1055c34fabbcee454b37ea9ab41886c09fd0f4f5cddeac`\n- FULL：`VF_Start_V2.21.17_FULL.zip` / `479778` bytes / `8bcd6765236ceab1e555f369a919192af3131ae7da0a27058adc847878c51c63`\n- Post-Release Closure：Run `31937510617` / PASS / 全部 Remote Asset bytes + SHA 精确一致\n- core-updates Commit：`{os.environ['CORE_UPDATES_COMMIT']}` / P01 Target `2.21.17` / PASS\n- Production Public Current：`2.21.16` / PASS\n- Production `update_status` Anonymous Read：HTTP 401 / `需要管理员登录。`\n- Legacy Bridge / Activator：HTTP 404 / RETIRED\n- Production Write：0\n- Production Upgrade：NOT EXECUTED\n- main Promotion：NOT EXECUTED\n- Product Failure：NONE CONFIRMED\n- Project Block：NONE\n- Remaining Gate：真实 Production 管理员 Session 内读取 Update Check / Status，确认 Target `2.21.17` / Available `YES`。\n''',encoding='utf-8')
          PY
          python3 -m json.tool p01/VF_PROJECT.json >/dev/null
          echo 'POST_RELEASE_AUTHORITY_WRITTEN=PASS'

      - name: Commit authority-only state
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          git config user.name 'VF Release Automation'
          git config user.email 'vf-release-automation@users.noreply.github.com'
          git add VF_PROJECT.json docs/authority/CURRENT.md docs/handoff/CURRENT_STATE.md docs/evidence/V2.21.17_FORMAL_RELEASE_AND_DISCOVERY_CURRENT_STATE.md
          if git diff --cached --name-only | grep -E '^(src/|VERSION$)'; then
            echo 'product source change detected' >&2; exit 1
          fi
          git commit -m 'docs(authority): seal V2.21.17 formal release discovery-pending state'
          git push origin HEAD:"$BRANCH"
          echo "AUTHORITY_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo 'AUTHORITY_ONLY_COMMIT=PASS'

      - name: Remote authority-only readback
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C p01 fetch origin "$BRANCH"
          test "$(git -C p01 rev-parse "origin/$BRANCH")" = "$AUTHORITY_HEAD"
          git -C p01 diff --name-only "$AUTHORITY_BASE" "$AUTHORITY_HEAD" | tee /tmp/changed.txt
          python3 - <<'PY'
          allowed={'VF_PROJECT.json','docs/authority/CURRENT.md','docs/handoff/CURRENT_STATE.md','docs/evidence/V2.21.17_FORMAL_RELEASE_AND_DISCOVERY_CURRENT_STATE.md'}
          got={x.strip() for x in open('/tmp/changed.txt',encoding='utf-8') if x.strip()}
          assert got==allowed,(got,allowed)
          print('REMOTE_AUTHORITY_ONLY_READBACK=PASS')
          PY
          test "$(tr -d '\r\n' < p01/VERSION)" = '2.21.17'
          test "$(git -C p01 rev-parse "$PRODUCT_COMMIT^{tree}")" = "$PRODUCT_TREE"
          echo 'PRODUCT_IDENTITY_UNCHANGED=PASS'
