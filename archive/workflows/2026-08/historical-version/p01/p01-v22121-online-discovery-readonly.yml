name: P01 VF Start V2.21.21 Online Discovery Read Only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p01-v22121-online-discovery-readonly.yml'
      - 'requests/p01-v22121-discovery-retry-*.txt'

permissions:
  contents: write

env:
  PRODUCT_REPO: llhzx2018/vf-start
  PRODUCTION_SOURCE: 383552dc5035cb60b4cd131907d05d87c3171b9b
  PRODUCTION_VERSION: '2.21.20'
  TARGET_VERSION: '2.21.21'
  TARGET_TAG: v2.21.21
  EXPECTED_RELEASE_ID: '373177269'
  EXPECTED_UPDATE_BYTES: '1070348'
  EXPECTED_UPDATE_SHA: ddb3b78d8bac153692ecaf897c2ca66a325b385355ade7a84d1c5a99183d9df4
  PRODUCTION_URL: https://start.kewaro.com/

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Credential and live channel authority gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || { echo 'VF_PRIVATE_READ_TOKEN_MISSING' >&2; exit 78; }
          gh api repos/llhzx2018/core-updates/contents/projects/P01.json?ref=main > "$RUNNER_TEMP/core-content.json"
          python3 - <<'PY'
          import base64,json,os,pathlib
          rt=pathlib.Path(os.environ['RUNNER_TEMP'])
          x=json.loads((rt/'core-content.json').read_text())
          m=json.loads(base64.b64decode(x['content']).decode())
          assert m['target_version']=='2.21.21'
          assert m['from_versions']==['2.21.20']
          assert m['schema_from']=='2026080902' and m['schema_to']=='2026080902'
          assert m['release_tag']=='v2.21.21'
          assert m['release_id']==373177269
          assert m['asset_name']=='VF_Start_V2.21.21_UPDATE.zip'
          assert m['asset_bytes']==1070348
          assert m['asset_sha256']=='ddb3b78d8bac153692ecaf897c2ca66a325b385355ade7a84d1c5a99183d9df4'
          (rt/'manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
          gh api repos/llhzx2018/vf-start/releases/tags/v2.21.21 > "$RUNNER_TEMP/release.json"
          jq -e '.id==373177269 and .tag_name=="v2.21.21" and .draft==false and .prerelease==false' "$RUNNER_TEMP/release.json" >/dev/null
          jq -e '([.assets[]|select(.name=="VF_Start_V2.21.21_UPDATE.zip" and .size==1070348)]|length)==1 and ([.assets[]|select(.name=="VF_Start_V2.21.21_FULL.zip" and .size==489980)]|length)==1' "$RUNNER_TEMP/release.json" >/dev/null
          echo 'LIVE_RELEASE_AND_CHANNEL_AUTHORITY=PASS'

      - name: Checkout exact V2.21.20 Production source
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" production
          git -C production fetch -q --depth 1 origin "$PRODUCTION_SOURCE"
          git -C production checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD 2>/dev/null || true)" != "__never__"
          test "$(git -C production rev-parse HEAD)" = "$PRODUCTION_SOURCE"
          test "$(tr -d '\r\n' < production/src/VERSION.txt)" = "$PRODUCTION_VERSION"
          echo 'PRODUCTION_SOURCE_IDENTITY=PASS'

      - name: Read live Production public surface without mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          code=$(curl -LsS -o "$RUNNER_TEMP/production-home.html" -w '%{http_code}' --max-time 20 "$PRODUCTION_URL")
          test "$code" = 200
          echo 'PRODUCTION_PUBLIC_HTTP=200'

      - name: Prepare source-exact local update discovery fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip php-mbstring sqlite3 >/dev/null
          cp -a production/src "$RUNNER_TEMP/p01-discovery"
          php -S 127.0.0.1:18231 -t "$RUNNER_TEMP/p01-discovery" > "$RUNNER_TEMP/server.log" 2>&1 & echo $! > "$RUNNER_TEMP/server.pid"
          for i in $(seq 1 30); do curl -fsS -c "$RUNNER_TEMP/cookies" http://127.0.0.1:18231/setup.php -o "$RUNNER_TEMP/setup.html" && break || sleep 1; done
          csrf=$(python3 - <<'PY'
          import os,re,pathlib
          s=(pathlib.Path(os.environ['RUNNER_TEMP'])/'setup.html').read_text(encoding='utf-8')
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s); assert m; print(m.group(1))
          PY
          )
          PASS='Discovery-P01-22121-Local!Strong'
          curl -fsSL -b "$RUNNER_TEMP/cookies" -c "$RUNNER_TEMP/cookies" -X POST http://127.0.0.1:18231/setup.php --data-urlencode "setup_csrf=$csrf" --data-urlencode 'site_title=VF Start Online Discovery' --data-urlencode "admin_password=$PASS" --data-urlencode "admin_password_confirm=$PASS" >/dev/null
          kill "$(cat "$RUNNER_TEMP/server.pid")" 2>/dev/null || true
          php "$RUNNER_TEMP/p01-discovery/cli/verify.php" | grep -q 'VERIFY_PASS=YES'
          echo 'LOCAL_FIXTURE=PASS'

      - name: Execute source-exact live online discovery only
        shell: bash
        run: |
          set -Eeuo pipefail
          php -r '
          require getenv("RUNNER_TEMP")."/p01-discovery/app/bootstrap.php";
          $m=new VfUpdateManager(vf_db(),["current_version"=>"2.21.20"]);
          $r=$m->check(true); $s=$m->status();
          file_put_contents(getenv("RUNNER_TEMP")."/discovery.json",json_encode(["check"=>$r,"status"=>$s],JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE)."\n");
          if(($r["ok"]??false)!==true)exit(1);
          if(($r["current_version"]??"")!=="2.21.20")exit(2);
          if(($r["latest_version"]??"")!=="2.21.21")exit(3);
          if(($r["available"]??false)!==true)exit(4);
          if(($r["can_update"]??false)!==true)exit(5);
          if(($s["available"]??false)!==true||($s["can_update"]??false)!==true)exit(6);
          if(($s["requirements"]["credential"]["ok"]??false)!==true)exit(7);
          if(($s["requirements"]["source_allowed"]??false)!==true)exit(8);
          if(($s["requirements"]["schema"]["ok"]??false)!==true)exit(9);
          echo "SOURCE_EXACT_ONLINE_DISCOVERY=PASS\n";'
          echo 'UPDATE_PREPARE_CALLED=NO'
          echo 'UPDATE_INSTALL_CALLED=NO'
          echo 'PRODUCTION_CHANGED=NO'

      - name: Publish read-only discovery evidence
        shell: bash
        env:
          OPS_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,os,pathlib,re
          rt=pathlib.Path(os.environ['RUNNER_TEMP'])
          d=json.loads((rt/'discovery.json').read_text())
          m=json.loads((rt/'manifest.json').read_text())
          r=json.loads((rt/'release.json').read_text())
          home=(rt/'production-home.html').read_text(encoding='utf-8',errors='replace')
          versions=sorted(set(re.findall(r'(?i)(?:V|version[^0-9]{0,8})(2\.21\.\d+)',home)))
          q={'schema':'vf-public-runner-result/v1','project_id':'P01','gate':'PRODUCTION_ONLINE_DISCOVERY','status':'SUCCESS','pass':True,'production_url':os.environ['PRODUCTION_URL'],'production_expected_version':'2.21.20','production_source_sha':os.environ['PRODUCTION_SOURCE'],'target_version':'2.21.21','release_id':r['id'],'release_tag':r['tag_name'],'update_asset':{'name':m['asset_name'],'bytes':m['asset_bytes'],'sha256':m['asset_sha256']},'production_public_http_status':200,'production_public_version_tokens':versions,'discovery_method':'EXACT_V2.21.20_PRODUCTION_SOURCE + LIVE_CORE_UPDATES + LIVE_GITHUB_RELEASE / READ_ONLY','current_version':d['check']['current_version'],'latest_version':d['check']['latest_version'],'available':d['check']['available'],'can_update':d['check']['can_update'],'credential_ok':d['status']['requirements']['credential']['ok'],'source_allowed':d['status']['requirements']['source_allowed'],'schema_ok':d['status']['requirements']['schema']['ok'],'production_changed':False,'update_prepare_called':False,'update_install_called':False,'production_upgrade_authorized':False,'workflow_run_id':os.environ['GITHUB_RUN_ID'],'private_source_persisted_publicly':False,'private_data_used':False}
          (rt/'online-discovery-evidence.json').write_text(json.dumps(q,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          git clone -q --depth 1 --branch vf-agent-operations-v1 "https://x-access-token:${OPS_TOKEN}@github.com/llhzx2018/core-free-runner-public.git" "$RUNNER_TEMP/out"
          mkdir -p "$RUNNER_TEMP/out/vf-agent/results"
          cp "$RUNNER_TEMP/online-discovery-evidence.json" "$RUNNER_TEMP/out/vf-agent/results/P01-V2.21.21-ONLINE-DISCOVERY.json"
          git -C "$RUNNER_TEMP/out" config user.name VictorForge; git -C "$RUNNER_TEMP/out" config user.email llhzx2018@gmail.com
          git -C "$RUNNER_TEMP/out" add vf-agent/results/P01-V2.21.21-ONLINE-DISCOVERY.json
          git -C "$RUNNER_TEMP/out" commit -q -m 'evidence(P01): publish V2.21.21 online discovery'
          git -C "$RUNNER_TEMP/out" push -q origin HEAD:vf-agent-operations-v1
          echo 'ONLINE_DISCOVERY_EVIDENCE=PASS'

      - name: Cleanup
        if: always()
        run: |
          test -f "$RUNNER_TEMP/server.pid" && kill "$(cat "$RUNNER_TEMP/server.pid")" 2>/dev/null || true
          rm -rf production "$RUNNER_TEMP/p01-discovery" "$RUNNER_TEMP/out"
