name: P01 V2.21.22 Candidate Seal V2

on:
  pull_request:
    paths:
      - 'requests/p01-v22122-candidate-seal-v2-*.txt'

permissions:
  contents: read

concurrency:
  group: p01-v22122-candidate-seal-v2
  cancel-in-progress: false

jobs:
  seal:
    if: startsWith(github.head_ref, 'agent/p01-v22122-candidate-seal-v2-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: maintenance/admin-consolidation-2.21.22-20260820
      EXPECTED_HEAD: 97504cc382c1dbdef881fcd29f157dff3f6ff944
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Exact head gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$WRITE_TOKEN"
          git clone -q --branch "$PRODUCT_BRANCH" "https://x-access-token:${WRITE_TOKEN}@github.com/${PRODUCT_REPO}.git" product
          test "$(git -C product rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(tr -d '\r\n' < product/VERSION)" = 2.21.22
          test "$(tr -d '\r\n' < product/src/VERSION.txt)" = 2.21.22
          grep -Fq "define('VF_VERSION', '2.21.21');" product/src/app/bootstrap.php
          git -C product diff --quiet e30c4f7f6d830bd7678201db8b3b4501c77f61b9 -- . ':(exclude)VERSION' ':(exclude)src/VERSION.txt'
          echo EXACT_HEAD_GATE=PASS
      - name: Complete candidate identity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('product')
          p=root/'src/app/bootstrap.php';s=p.read_text(encoding='utf-8');old="define('VF_VERSION', '2.21.21');"
          if s.count(old)!=1: raise SystemExit('bootstrap version anchor mismatch')
          p.write_text(s.replace(old,"define('VF_VERSION', '2.21.22');",1),encoding='utf-8',newline='\n')
          c=root/'src/CHANGELOG.md';oldc=c.read_text(encoding='utf-8')
          entry='''# VF Start V2.21.22\n\n- 网址后台“选择本页”移动到表格选择列头，修复全部网址与待整理页面的筛选工具栏换行错位；移动端保留独立选择本页入口。\n- “备份与恢复”取消伪二级菜单，SQLite 备份、完整恢复和旧站迁移集中在同一页；SQLite 备份与完整恢复包均支持分页。\n- “设置”取消品牌、显示、首页、SEO、管理员账号等伪二级菜单，核心设置同页连续完成；RSS 与系统状态改为页面底部低频维护入口。\n- 收藏改为网址旁常驻 ☆ / ★ 一键交互；“我的收藏”、菜单、编辑弹窗和首页常用入口统一使用“收藏”语义。\n- 真实 Chrome 验证收藏加入/取消、网格收藏、待整理隐藏收藏、后台选择本页、备份分页、设置单页；390 / 768 / 1024 / 1280 被测页面横向溢出均为 0。\n- Schema 2026080902 不变；Browser Helper 1.6.4 不变；不迁移用户业务数据。\n\n'''
          if not oldc.startswith('# VF Start V2.21.22'): c.write_text(entry+oldc,encoding='utf-8',newline='\n')
          PY
          test "$(tr -d '\r\n' < product/VERSION)" = 2.21.22
          test "$(tr -d '\r\n' < product/src/VERSION.txt)" = 2.21.22
          grep -Fq "define('VF_VERSION', '2.21.22');" product/src/app/bootstrap.php
          head -1 product/src/CHANGELOG.md | grep -Fx '# VF Start V2.21.22'
          find product/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find product/src/assets -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          git -C product diff --check
          echo IDENTITY_COMPLETE=PASS
      - name: Commit and push exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C product config user.name VictorForge
          git -C product config user.email llhzx2018@gmail.com
          git -C product add src/app/bootstrap.php src/CHANGELOG.md
          git -C product commit -m 'chore(P01): complete V2.21.22 candidate seal'
          git -C product push origin HEAD:"$PRODUCT_BRANCH"
          echo "CANDIDATE_SHA=$(git -C product rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CANDIDATE_TREE=$(git -C product rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
      - name: Summary
        shell: bash
        run: |
          echo CANDIDATE_SEAL_V2=PASS
          echo "CANDIDATE_SHA=$CANDIDATE_SHA"
          echo "CANDIDATE_TREE=$CANDIDATE_TREE"
