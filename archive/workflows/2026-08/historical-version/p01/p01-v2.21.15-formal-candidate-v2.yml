name: P01 V2.21.15 Formal Candidate Gates V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p01-v2.21.15-formal-candidate-v2.yml'
      - 'scripts/p01-formal-candidate-gates-v2.sh'
      - 'scripts/p01-build-release.py'
      - 'scripts/p01-build-release-v2.py'
      - 'requests/p01-v2.21.15-formal-candidate-v2-*.txt'

permissions:
  contents: read

concurrency:
  group: p01-v2.21.15-formal-candidate-v2
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CANDIDATE: e6d71b3309fb24b11139c6febf7dcaf0f9106e87
      CANDIDATE_TREE: 3b784e34c3519992bd7cd9087d9652f8229fac46
      PRODUCTION: 7c7ad1da3e8dcd49fa49313317c389948f40d4de
      VERSION: 2.21.15
      SOURCE_VERSION: 2.21.14
      SCHEMA: 2026080902
    steps:
      - name: Require unified credentials
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || { echo 'VF_PRIVATE_READ_TOKEN missing' >&2; exit 78; }
          test -n "$WRITE_TOKEN" || { echo 'VF_RELEASE_WRITE_TOKEN missing' >&2; exit 79; }
          echo 'UNIFIED_TWO_TOKEN_GATE=PASS'

      - name: Checkout runner scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: main
          persist-credentials: false
          path: runner

      - name: Checkout exact Candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate

      - name: Checkout exact Production
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCTION }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: production

      - name: Install real runtime dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip php-xml sqlite3 unzip >/dev/null
          php -r 'foreach(["pdo_sqlite","curl","zip"] as $x){if(!extension_loaded($x)){fwrite(STDERR,"missing:$x\n");exit(1);}}if(!class_exists("SimpleXMLElement")){fwrite(STDERR,"missing:SimpleXML\n");exit(1);}echo "REAL_RUNTIME_DEPENDENCIES=PASS\n";'

      - name: Run formal candidate gates
        shell: bash
        run: bash runner/scripts/p01-formal-candidate-gates-v2.sh

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: p01-v2.21.15-formal-candidate-v2-evidence
          path: |
            dist/
            /tmp/p01-*.json
            /tmp/p01-*.txt
            /tmp/p01-*.out
            /tmp/p01-*.err
          if-no-files-found: warn
          retention-days: 14
