name: P01 V2.21.22 Candidate Seal

on:
  pull_request:
    paths:
      - 'requests/p01-v22122-candidate-seal-*.txt'

permissions:
  contents: read

concurrency:
  group: p01-v22122-candidate-seal
  cancel-in-progress: false

jobs:
  seal:
    if: startsWith(github.head_ref, 'agent/p01-v22122-candidate-seal-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: maintenance/admin-consolidation-2.21.22-20260820
      EXPECTED_PARENT: e30c4f7f6d830bd7678201db8b3b4501c77f61b9
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Clone exact verified working source
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$WRITE_TOKEN"
          git clone -q --branch "$PRODUCT_BRANCH" "https://x-access-token:${WRITE_TOKEN}@github.com/${PRODUCT_REPO}.git" product
          test "$(git -C product rev-parse HEAD)" = "$EXPECTED_PARENT"
          test "$(tr -d '\r\n' < product/VERSION)" = '2.21.22'
          test "$(tr -d '\r\n' < product/src/VERSION.txt)" = '2.21.22'
          grep -Fq "define('VF_VERSION', '2.21.21');" product/src/app/bootstrap.php
          echo EXACT_WORKING_PARENT=PASS
      - name: Seal candidate identity and changelog
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('product')
          p=root/'src/app/bootstrap.php'
          s=p.read_text(encoding='utf-8')
          old="define('VF_VERSION', '2.21.21');"
          if s.count(old)!=1: raise SystemExit('bootstrap version anchor mismatch')
          p.write_text(s.replace(old,"define('VF_VERSION', '2.21.22');",1),encoding='utf-8',newline='\n')
          c=root/'src/CHANGELOG.md'
          oldc=c.read_text(encoding='utf-8')
          entry='''# VF Start V2.21.22\n\n- 后台“选择本页”从筛选工具栏移到网址表格选择列头，修复全部网址与待整理页面在中等宽度下的错位；移动端保留独立选择本页入口。\n- “备份与恢复”取消 SQLite 备份 / 完整恢复伪二级菜单，统一为一个连续页面；SQLite 备份与完整恢复包都提供分页。\n- “设置”取消基础品牌 / 显示分页 / 首页 / SEO / 管理员账号等伪二级菜单，改为同页连续设置；RSS 与系统状态降为页面底部低频维护入口。\n- 收藏改为网址旁常驻 ☆ / ★：点击即可收藏或取消；“我的收藏”、右键菜单、编辑弹窗与首页常用入口统一使用“收藏”语义，不再用“固定到首页”代称。\n- 390 / 768 / 1024 / 1280 真实 Chrome 回归覆盖前台分类、网址后台、待整理、网址健康、重复网址、导入导出、浏览器助手、备份恢复、设置、系统状态、安全中心与更新页，横向溢出均为 0。\n- Schema 2026080902 不变；Browser Helper 1.6.4 不变；无用户业务数据迁移。\n\n'''
          if not oldc.startswith('# VF Start V2.21.22'):
              c.write_text(entry+oldc,encoding='utf-8',newline='\n')
          PY
          test "$(tr -d '\r\n' < product/VERSION)" = '2.21.22'
          test "$(tr -d '\r\n' < product/src/VERSION.txt)" = '2.21.22'
          grep -Fq "define('VF_VERSION', '2.21.22');" product/src/app/bootstrap.php
          head -1 product/src/CHANGELOG.md | grep -Fx '# VF Start V2.21.22'
          find product/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find product/src/assets -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          git -C product diff --check
          echo CANDIDATE_IDENTITY_STATIC=PASS
      - name: Commit exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C product config user.name VictorForge
          git -C product config user.email llhzx2018@gmail.com
          git -C product add VERSION src/VERSION.txt src/app/bootstrap.php src/CHANGELOG.md
          git -C product commit -m 'chore(P01): seal V2.21.22 candidate identity'
          CANDIDATE_SHA=$(git -C product rev-parse HEAD)
          CANDIDATE_TREE=$(git -C product rev-parse HEAD^{tree})
          git -C product push origin HEAD:"$PRODUCT_BRANCH"
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          echo "CANDIDATE_TREE=$CANDIDATE_TREE" >> "$GITHUB_ENV"
      - name: Candidate summary
        shell: bash
        run: |
          echo CANDIDATE_SEAL=PASS
          echo "CANDIDATE_SHA=$CANDIDATE_SHA"
          echo "CANDIDATE_TREE=$CANDIDATE_TREE"
