name: P01 V2.21.16 Atomic Gate Corrective Candidate

on:
  push:
    branches:
      - fix/p01-v2.21.16-atomic-runtime-gate

permissions:
  contents: read

env:
  P01_BRANCH: fix/v2.21.16-atomic-runtime-gate
  PRODUCTION_COMMIT: 7c7ad1da3e8dcd49fa49313317c389948f40d4de
  PRIOR_CANDIDATE: e6d71b3309fb24b11139c6febf7dcaf0f9106e87
  VERSION: 2.21.16
  SOURCE_VERSION: 2.21.14
  SCHEMA: 2026080902

jobs:
  candidate:
    runs-on: ubuntu-24.04
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Require unified credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
          echo 'UNIFIED_TWO_TOKEN_GATE=PASS'

      - name: Checkout corrected release builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/p01-v2.21.16-atomic-runtime-gate
          persist-credentials: false
          path: runner

      - name: Checkout P01 corrective branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.P01_BRANCH }}
          token: ${{ env.WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: candidate

      - name: Prepare V2.21.16 candidate metadata only
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('candidate')
          (root/'VERSION').write_text('2.21.16\n',encoding='utf-8')
          (root/'src/VERSION.txt').write_text('2.21.16\n',encoding='utf-8')
          p=root/'src/app/bootstrap.php'
          s=p.read_text(encoding='utf-8')
          old="define('VF_VERSION', '2.21.15');"
          new="define('VF_VERSION', '2.21.16');"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('bootstrap version anchor mismatch')
          p.write_text(s,encoding='utf-8')

          c=root/'src/CHANGELOG.md'
          cs=c.read_text(encoding='utf-8')
          marker='# VF Start V2.21.16'
          if marker not in cs:
              entry='''# VF Start V2.21.16\n\n- 修复 V2.21.15 Atomic Old Source Gate 边界错误：旧源身份改由 prior Formal Production Runtime Identity Authority 生成，不再由 FULL / Git repository 文件全集机械生成。\n- `.gitignore`、`CHANGELOG.md`、`DEPLOY-HERE.txt`、`FULL-PACKAGE-NOTES.txt`、`README.md`、`UPGRADE-V2.txt`、`robots.txt` 不再参与 APP Runtime SHA Gate。\n- Browser Extension 继续为 V1.6.4 独立组件；历史 `VF-Start-Browser-Extension.zip` 使用 Legacy Component Handoff，APP Atomic 不删除、不覆盖、不机械升版。\n- Schema / Migration / 业务功能均无变化。\n\n'''
              c.write_text(entry+cs,encoding='utf-8')

          vf=root/'VF_PROJECT.json'
          doc=json.loads(vf.read_text(encoding='utf-8'))
          doc['status']='V2.21.16 CORRECTIVE CANDIDATE / VALIDATION IN PROGRESS'
          doc['working_version']='2.21.16'
          doc['candidate_version']='2.21.16'
          doc['candidate_state']='ATOMIC SOURCE GATE CORRECTIVE CANDIDATE / VALIDATION IN PROGRESS'
          doc['current_phase']='V2.21.16 ATOMIC GATE CORRECTIVE RELEASE / CANDIDATE VALIDATION'
          doc['verified_release_ready']=False
          doc['formal_artifact_gate']='PENDING_V2.21.16_VALIDATION'
          doc['corrective_release']={
              'supersedes':'2.21.15',
              'root_cause':'V2.21.15 ATOMIC SOURCE GATE DEFECT CONFIRMED',
              'scope':'ATOMIC SOURCE GATE BOUNDARY CORRECTION',
              'production_write':0,
              'schema_change':False,
              'browser_extension':'1.6.4 UNCHANGED'
          }
          vf.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          ev=root/'docs/evidence/V2.21.16_ATOMIC_GATE_CORRECTIVE.md'
          if not ev.exists():
              ev.write_text('''# P01 · VF Start · V2.21.16 Atomic Source Gate Corrective Evidence\n\n## Root Cause\n\n`V2.21.15 ATOMIC SOURCE GATE DEFECT CONFIRMED`。V2.21.15 将 7 个非 V2.21.14 Frozen Runtime Target 文件机械纳入 Old Source Gate。\n\n## Correct Boundary\n\n- Prior Frozen Runtime Target：124。\n- APP Legacy Source Gate：123。\n- Legacy Browser Extension ZIP：独立组件 Handoff，APP Atomic 保留但不拥有。\n- 7 个 Gate-only 文件：从 APP Runtime Gate 排除。\n\n## Required Regression\n\nA. Original V2.21.15 failure replay。\nB. Corrected V2.21.16 source verification and full fixture upgrade。\nC. True runtime tamper must fail closed。\nD. Gate-only file changes must not affect Runtime Gate。\n\n本文件只定义修复与验收边界；机器结果由 Candidate / Release Evidence Artifact 封板。\n''',encoding='utf-8')
          PY
          cd candidate
          git config user.name 'VF Release Automation'
          git config user.email 'vf-release-automation@users.noreply.github.com'
          git add VERSION src/VERSION.txt src/app/bootstrap.php src/CHANGELOG.md VF_PROJECT.json docs/evidence/P01_V2.21.14_APP_RUNTIME_AUTHORITY.json docs/evidence/V2.21.16_ATOMIC_GATE_CORRECTIVE.md
          if ! git diff --cached --quiet; then
            git commit -m 'fix(start): prepare V2.21.16 atomic gate corrective candidate [candidate-generated]'
            git push origin HEAD:${P01_BRANCH}
          fi
          echo "CANDIDATE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Verify corrective scope against V2.21.15 product candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C candidate fetch origin "$PRIOR_CANDIDATE" --depth=1
          git -C candidate diff --name-only "$PRIOR_CANDIDATE" HEAD -- src > /tmp/p01-src-diff.txt
          cat /tmp/p01-src-diff.txt
          python3 - <<'PY'
          allowed={'src/VERSION.txt','src/app/bootstrap.php','src/CHANGELOG.md'}
          got={x.strip() for x in open('/tmp/p01-src-diff.txt',encoding='utf-8') if x.strip()}
          bad=sorted(got-allowed)
          if bad: raise SystemExit(f'unexpected product source expansion: {bad}')
          print('PRODUCT_SOURCE_SCOPE=PASS',sorted(got))
          PY
          test "$(tr -d '\r\n' < candidate/VERSION)" = "$VERSION"
          test "$(tr -d '\r\n' < candidate/src/VERSION.txt)" = "$VERSION"
          grep -q "define('VF_VERSION', '2.21.16');" candidate/src/app/bootstrap.php
          echo 'V2.21.16_METADATA=PASS'

      - name: Checkout exact Production Truth
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCTION_COMMIT }}
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          path: production

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip php-xml sqlite3 unzip >/dev/null
          php -r 'foreach(["pdo_sqlite","curl","zip"] as $x){if(!extension_loaded($x))exit(1);}echo "PHP_RUNTIME=PASS\n";'

      - name: Build V2.21.16 with prior runtime authority
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf candidate-dist
          python3 runner/scripts/p01-build-release-v3.py \
            --candidate candidate/src \
            --production production/src \
            --source-runtime-authority candidate/docs/evidence/P01_V2.21.14_APP_RUNTIME_AUTHORITY.json \
            --out candidate-dist \
            --candidate-commit "$CANDIDATE_COMMIT" \
            --candidate-tree "$CANDIDATE_TREE" \
            --production-commit "$PRODUCTION_COMMIT" | tee /tmp/p01-build-v22116.json
          (cd candidate-dist && sha256sum -c SHA256SUMS.txt)
          php candidate-dist/repair-v2.21.16.php --self-test | tee /tmp/p01-self-test.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/p01-self-test.json'))
          assert r['ok'] is True
          assert r['source_files']==123, r
          assert r['target_files']==125, r
          assert r['payload_files']==126, r
          print('CORRECTED_ATOMIC_METADATA=PASS')
          PY

      - name: Download immutable original V2.21.15 Atomic repair
        shell: bash
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p original-v22115
          gh release download v2.21.15 -R llhzx2018/vf-start -p repair-v2.21.15.php -D original-v22115
          test "$(sha256sum original-v22115/repair-v2.21.15.php | awk '{print $1}')" = 'f2b235b6cc11485de263c3b60e22ae801a9ad550eb0c0e4643c1f7924310478f'
          echo 'ORIGINAL_V2.21.15_IDENTITY=PASS'

      - name: Build real V2.21.14 Frozen Runtime Fixture with current Bridge state
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-frozen-fixture
          cp -a production/src /tmp/p01-frozen-fixture
          mkdir -p /tmp/p01-frozen-fixture/app/CoreUpdates
          cp candidate/src/app/UpdateManager.php /tmp/p01-frozen-fixture/app/UpdateManager.php
          cp candidate/src/app/CoreUpdates/UpdateCore.php /tmp/p01-frozen-fixture/app/CoreUpdates/UpdateCore.php
          cp candidate/src/app/CoreUpdates/GitHubClient.php /tmp/p01-frozen-fixture/app/CoreUpdates/GitHubClient.php
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/p01-frozen-fixture')
          files=['CHANGELOG.md','DEPLOY-HERE.txt','FULL-PACKAGE-NOTES.txt','README.md','UPGRADE-V2.txt','robots.txt']
          for name in files:
              p=root/name
              p.write_bytes(p.read_bytes()+b'\nP01_NON_RUNTIME_PRODUCTION_VARIANT\n')
          PY
          php candidate-dist/repair-v2.21.16.php --verify-source=/tmp/p01-frozen-fixture | tee /tmp/p01-corrected-source.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/p01-corrected-source.json'))
          assert x['ok'] is True and x['checked']==123, x
          print('V2.21.14_FROZEN_RUNTIME_FIXTURE=VERIFIED')
          PY

      - name: A - Replay original V2.21.15 source-gate failure
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          php original-v22115/repair-v2.21.15.php --verify-source=/tmp/p01-frozen-fixture > /tmp/p01-original-v22115.out 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          cat /tmp/p01-original-v22115.out
          for f in CHANGELOG.md DEPLOY-HERE.txt FULL-PACKAGE-NOTES.txt README.md UPGRADE-V2.txt robots.txt; do grep -q "${f}:sha" /tmp/p01-original-v22115.out; done
          echo 'ORIGINAL_V2.21.15_FAILURE_REPLAY=PASS'

      - name: B/D - Corrected source gate ignores Gate-only files
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '\nP01_REPOSITORY_METADATA_VARIANT\n' >> /tmp/p01-frozen-fixture/.gitignore
          php candidate-dist/repair-v2.21.16.php --verify-source=/tmp/p01-frozen-fixture | tee /tmp/p01-gate-only-negative.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/p01-gate-only-negative.json'))
          assert x['ok'] is True and x['checked']==123, x
          print('GATE_ONLY_FILES_EXCLUDED=PASS')
          PY

      - name: C - True Runtime tamper must fail closed
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-runtime-tamper
          cp -a /tmp/p01-frozen-fixture /tmp/p01-runtime-tamper
          printf '\n/* P01_RUNTIME_TAMPER_NEGATIVE */\n' >> /tmp/p01-runtime-tamper/api.php
          set +e
          php candidate-dist/repair-v2.21.16.php --verify-source=/tmp/p01-runtime-tamper > /tmp/p01-runtime-tamper.out 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q 'api.php:sha' /tmp/p01-runtime-tamper.out
          echo 'TRUE_RUNTIME_TAMPER_FAIL_CLOSED=PASS'

      - name: B - Full corrected Atomic fixture upgrade with Legacy Extension preservation
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-upgrade-fixture
          cp -a /tmp/p01-frozen-fixture /tmp/p01-upgrade-fixture
          printf 'P01 LEGACY BROWSER EXTENSION 1.6.4 HANDOFF\n' > /tmp/p01-upgrade-fixture/VF-Start-Browser-Extension.zip
          legacy_before="$(sha256sum /tmp/p01-upgrade-fixture/VF-Start-Browser-Extension.zip | awk '{print $1}')"
          gate_before="$(sha256sum /tmp/p01-upgrade-fixture/README.md | awk '{print $1}')"
          php -S 127.0.0.1:18126 -t /tmp/p01-upgrade-fixture >/tmp/p01-v22116-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS -c /tmp/p01-v22116.cookies http://127.0.0.1:18126/setup.php -o /tmp/p01-v22116-setup.html; then break; fi
            sleep 1
          done
          csrf="$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v22116-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          print(m.group(1) if m else '')
          PY
          )"
          test -n "$csrf"
          curl -fsS -b /tmp/p01-v22116.cookies -c /tmp/p01-v22116.cookies -X POST http://127.0.0.1:18126/setup.php \
            --data-urlencode "setup_csrf=$csrf" \
            --data-urlencode 'site_title=P01 V22116 Fixture' \
            --data-urlencode 'admin_password=P01Fixture!22116' \
            --data-urlencode 'admin_password_confirm=P01Fixture!22116' \
            -o /tmp/p01-v22116-setup-result.html
          kill "$pid" || true
          wait "$pid" 2>/dev/null || true
          trap - EXIT
          php candidate-dist/repair-v2.21.16.php --run=/tmp/p01-upgrade-fixture | tee /tmp/p01-v22116-upgrade.json
          test "$(tr -d '\r\n' < /tmp/p01-upgrade-fixture/VERSION.txt)" = '2.21.16'
          grep -q "define('VF_VERSION', '2.21.16');" /tmp/p01-upgrade-fixture/app/bootstrap.php
          legacy_after="$(sha256sum /tmp/p01-upgrade-fixture/VF-Start-Browser-Extension.zip | awk '{print $1}')"
          gate_after="$(sha256sum /tmp/p01-upgrade-fixture/README.md | awk '{print $1}')"
          test "$legacy_before" = "$legacy_after"
          test "$gate_before" = "$gate_after"
          php candidate-dist/repair-v2.21.16.php --verify-target=/tmp/p01-upgrade-fixture | tee /tmp/p01-v22116-target.json
          python3 - <<'PY'
          import json
          u=json.load(open('/tmp/p01-v22116-upgrade.json'))
          t=json.load(open('/tmp/p01-v22116-target.json'))
          assert u['ok'] is True and u['schema']=='2026080902' and u['source_checked']==123 and u['target_checked']==125, u
          assert t['ok'] is True and t['checked']==125, t
          print('CORRECTED_V2.21.16_FIXTURE_UPGRADE=PASS')
          print('LEGACY_BROWSER_EXTENSION_HANDOFF=PASS')
          PY

      - name: Fresh install smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v22116-fresh
          mkdir -p /tmp/p01-v22116-fresh
          unzip -q candidate-dist/VF_Start_V2.21.16_FULL.zip -d /tmp/p01-v22116-fresh
          test "$(tr -d '\r\n' < /tmp/p01-v22116-fresh/VERSION.txt)" = '2.21.16'
          grep -q "define('VF_VERSION', '2.21.16');" /tmp/p01-v22116-fresh/app/bootstrap.php
          test "$(python3 - <<'PY'
          import json
          m=json.load(open('/tmp/p01-v22116-fresh/release-manifest.json'))
          print(m['runtime_hashed_file_count'])
          PY
          )" = '125'
          echo 'FRESH_INSTALL_PACKAGE_SMOKE=PASS'

      - name: Seal candidate evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('candidate-dist')
          sums={p.name:{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.iterdir()) if p.is_file()}
          evidence={
            'project':'P01','version':'2.21.16','candidate_commit':'${{ env.CANDIDATE_COMMIT }}','candidate_tree':'${{ env.CANDIDATE_TREE }}',
            'production_commit':'${{ env.PRODUCTION_COMMIT }}','production_version':'2.21.14','schema':'2026080902',
            'root_cause_generator':'IDENTIFIED','generator_fix':'PASS','old_runtime_authority':'VERIFIED',
            'gate_only_files':'EXCLUDED_FROM_RUNTIME_GATE','browser_extension_boundary':'FORMALLY_RESOLVED',
            'frozen_fixture':'VERIFIED','original_v2_21_15_failure_replay':'PASS','corrected_v2_21_16_fixture_upgrade':'PASS',
            'true_runtime_tamper_negative':'PASS','gate_only_negative':'PASS','production_write':0,'artifacts':sums
          }
          pathlib.Path('/tmp/P01_V2.21.16_CANDIDATE_EVIDENCE.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(evidence,ensure_ascii=False,indent=2))
          PY
          echo 'P01_V2.21.16_CANDIDATE=PASS'

      - name: Upload candidate evidence
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: p01-v2.21.16-candidate-evidence
          path: |
            candidate-dist/
            /tmp/P01_V2.21.16_CANDIDATE_EVIDENCE.json
            /tmp/p01-build-v22116.json
            /tmp/p01-self-test.json
            /tmp/p01-original-v22115.out
            /tmp/p01-v22116-upgrade.json
            /tmp/p01-v22116-target.json
          retention-days: 30
