name: P01 V2.21.17 Production Closure VF_PROJECT Finalize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p01-v2.21.17-production-closure-vfproject-finalize.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  P01_BRANCH: maintenance/post-seal-health-2.21.17-20260816
  PREV_HEAD: 41af9d074c6165ea70363ea75e394f6c34244188
  PRODUCT_COMMIT: 89f55e9a772904ebe03537ec54c2891e13a52c80
  REMOTE_MAIN: 4c908ae6a32ed0855751bbe809c8b204d957aba1
  REMOTE_DEVELOP: 4c908ae6a32ed0855751bbe809c8b204d957aba1

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout exact current closure Authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.P01_BRANCH }}
          token: ${{ env.WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: p01

      - name: Guard exact closure parent and product source
        run: |
          set -Eeuo pipefail
          test "$(git -C p01 rev-parse HEAD)" = "$PREV_HEAD"
          test -z "$(git -C p01 diff --name-only "$PRODUCT_COMMIT" HEAD -- src)"
          test "$(gh api repos/llhzx2018/vf-start/git/ref/heads/main --jq .object.sha)" = "$REMOTE_MAIN"
          test "$(gh api repos/llhzx2018/vf-start/git/ref/heads/develop --jq .object.sha)" = "$REMOTE_DEVELOP"

      - name: Finalize V2.21.17 machine closure semantics
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('p01/VF_PROJECT.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['status']=='V2.21.17 PRODUCTION / FINAL ONLINE PASS / CLOSED'
          assert d['production_version']=='2.21.17'
          fr=d['v2_21_17_formal_release']
          fr['production_current_public_readback']='2.21.17 / PASS'
          fr['production_authenticated_discovery']='PASS / MASTER-CONFIRMED PRODUCTION BACKEND'
          fr['discovery_probe_scope']='HISTORICAL PRE-UPGRADE READ-ONLY PROBE'
          fr['discovery_probe']='HISTORICAL PRE-UPGRADE: anonymous update_status HTTP 401 and retired bridge 404; superseded by authenticated Online Discovery PASS'
          fr['production_write']='AUTHORIZED PRODUCTION UPGRADE EXECUTED / 2026-08-16 17:11:23 +08:00'
          fr['production_upgrade']='PASS / 2.21.16 -> 2.21.17 / success'
          fr['production_version_readback']='PASS / 2.21.17'
          fr['production_latest']='2.21.17'
          fr['production_equals_latest']='YES'
          fr['main_promotion']='NOT EXECUTED IN V2.21.17 CLOSURE DIRECTIVE'
          fr['final_online_pass']='YES'
          fr['status']='CLOSED'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool p01/VF_PROJECT.json >/dev/null
          git -C p01 diff --check -- VF_PROJECT.json

      - name: Commit final machine Authority state
        run: |
          set -Eeuo pipefail
          cd p01
          git config user.name 'VF Release Automation'
          git config user.email 'vf-release-automation@users.noreply.github.com'
          git add VF_PROJECT.json
          test "$(git diff --cached --name-only)" = 'VF_PROJECT.json'
          test -z "$(git diff --cached --name-only -- src)"
          git commit -m 'docs(authority): finalize P01 V2.21.17 machine closure state'
          git push origin HEAD:"$P01_BRANCH"
          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Final remote readback
        run: |
          set -Eeuo pipefail
          git -C p01 fetch origin "$P01_BRANCH"
          test "$(git -C p01 rev-parse origin/$P01_BRANCH)" = "$FINAL_HEAD"
          test -z "$(git -C p01 diff --name-only "$PRODUCT_COMMIT" "$FINAL_HEAD" -- src)"
          test "$(gh api repos/llhzx2018/vf-start/git/ref/heads/main --jq .object.sha)" = "$REMOTE_MAIN"
          test "$(gh api repos/llhzx2018/vf-start/git/ref/heads/develop --jq .object.sha)" = "$REMOTE_DEVELOP"
          echo 'P01_V2.21.17_FINAL_MACHINE_AUTHORITY=CLOSED'
