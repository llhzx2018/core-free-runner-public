name: P06 VF Press V0.1.0 Official Release Asset Probe

on:
  pull_request:
    branches: [main]
    paths:
      - triggers/p06-v010-release-asset-probe.txt

permissions:
  contents: read

env:
  EXPECTED_FULL_SHA: 51f1323a00b3776a820b7e268972b03b2e50c0728683e7a46d9d49142d7973ca
  EXPECTED_FULL_BYTES: '179671'
  EXPECTED_UPDATE_SHA: 8e92e5033e0aa1442255a38870300af20b990edccadf7a6c16a225e96969a2dc
  EXPECTED_UPDATE_BYTES: '144067'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Wait for formal private release and verify exact assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          READY=0
          for i in $(seq 1 36); do
            if gh release view v0.1.0 --repo llhzx2018/vf-press --json tagName,targetCommitish,isDraft,isPrerelease >/tmp/release.json 2>/tmp/release.err; then READY=1; break; fi
            sleep 5
          done
          if [ "$READY" != 1 ]; then cat /tmp/release.err || true; exit 1; fi
          rm -rf /tmp/p06-release && mkdir /tmp/p06-release
          gh release download v0.1.0 --repo llhzx2018/vf-press --dir /tmp/p06-release \
            -p 'VF_Press_V0.1.0_FULL.zip' \
            -p 'VF_Press_V0.1.0_UPDATE.zip' \
            -p 'SHA256SUMS.txt' \
            -p 'RELEASE_INFO.json'
          (cd /tmp/p06-release && sha256sum -c SHA256SUMS.txt)
          FULL_SHA="$(sha256sum /tmp/p06-release/VF_Press_V0.1.0_FULL.zip | awk '{print $1}')"
          UPDATE_SHA="$(sha256sum /tmp/p06-release/VF_Press_V0.1.0_UPDATE.zip | awk '{print $1}')"
          FULL_BYTES="$(stat -c%s /tmp/p06-release/VF_Press_V0.1.0_FULL.zip)"
          UPDATE_BYTES="$(stat -c%s /tmp/p06-release/VF_Press_V0.1.0_UPDATE.zip)"
          test "$FULL_SHA" = "$EXPECTED_FULL_SHA"
          test "$UPDATE_SHA" = "$EXPECTED_UPDATE_SHA"
          test "$FULL_BYTES" = "$EXPECTED_FULL_BYTES"
          test "$UPDATE_BYTES" = "$EXPECTED_UPDATE_BYTES"
          echo "OFFICIAL_RELEASE_ASSET_PROBE=PASS"
          echo "TAG=$(jq -r '.tagName' /tmp/release.json)"
          echo "RELEASE_TARGET=$(jq -r '.targetCommitish' /tmp/release.json)"
          echo "IS_DRAFT=$(jq -r '.isDraft' /tmp/release.json)"
          echo "IS_PRERELEASE=$(jq -r '.isPrerelease' /tmp/release.json)"
          echo "FULL_BYTES=$FULL_BYTES"
          echo "FULL_SHA256=$FULL_SHA"
          echo "UPDATE_BYTES=$UPDATE_BYTES"
          echo "UPDATE_SHA256=$UPDATE_SHA"
          rm -rf /tmp/p06-release
