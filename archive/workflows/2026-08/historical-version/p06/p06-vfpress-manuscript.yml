name: P06 VF Press Publication Manuscript Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p06-vfpress-manuscript.yml'
      - 'requests/p06-vfpress-manuscript-*.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p06-vfpress-publication-manuscript
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_REPOSITORY: llhzx2018/vf-press
      SOURCE_SHA: 91758d1cd8ac3856a5748121837dd8c3c9286554
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout public-safe runner control
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner-control
          fetch-depth: 1

      - name: Require registered private read capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN" || { echo 'REGISTERED_CAPABILITY_BLOCK=VF_PRIVATE_READ_TOKEN_MISSING' >&2; exit 78; }
          echo 'PRIVATE_READ_CAPABILITY=PASS'

      - name: Checkout exact private VF Press source ephemerally
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-press
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: source

      - name: Prepare PHP SQLite runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring sqlite3 composer >/dev/null
          php -r 'if(!extension_loaded("pdo_sqlite")){exit(1);} if(!extension_loaded("mbstring")){exit(1);} echo "PHP_RUNTIME=PASS\n";'

      - name: Exact source and syntax gate
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          grep -Fq '"current_phase": "PHASE_C_PUBLICATION_MANUSCRIPT_CORE"' VF_PROJECT.json
          composer validate --strict >/dev/null
          composer dump-autoload --no-interaction --optimize >/dev/null
          COUNT=0
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; COUNT=$((COUNT+1)); done < <(find src bin public -type f -name '*.php' -print0)
          test "$COUNT" -gt 0
          echo "PHP_FILES_CHECKED=$COUNT"
          echo 'SOURCE_IDENTITY=PASS'
          echo 'PHP_SYNTAX=PASS'

      - name: Run Foundation Research Publication regression
        shell: bash
        working-directory: source
        env:
          VF_PRESS_STORAGE_PATH: ${{ runner.temp }}/p06-manuscript-storage
          VF_PRESS_DB_PATH: ${{ runner.temp }}/p06-manuscript-storage/app.db
          APP_ENV: test
        run: |
          set -Eeuo pipefail
          rm -rf "$VF_PRESS_STORAGE_PATH"
          mkdir -p "$VF_PRESS_STORAGE_PATH"
          php bin/migrate.php >/dev/null
          php bin/self-test.php >/dev/null
          php bin/security-self-test.php >/dev/null
          php bin/research-self-test.php >/dev/null
          php bin/publication-self-test.php | tee /tmp/p06-publication-self-test.txt
          grep -Fq 'PUBLICATION_MANUSCRIPT_SELF_TEST=PASS' /tmp/p06-publication-self-test.txt
          grep -Fq 'REVISION_IMMUTABLE=PASS' /tmp/p06-publication-self-test.txt
          grep -Fq 'SQLITE_INTEGRITY=PASS' /tmp/p06-publication-self-test.txt
          echo 'FOUNDATION_REGRESSION=PASS'
          echo 'RESEARCH_REGRESSION=PASS'
          echo 'PUBLICATION_MANUSCRIPT=PASS'

      - name: Verify canonical manuscript and revision boundary
        shell: bash
        working-directory: source
        env:
          VF_PRESS_STORAGE_PATH: ${{ runner.temp }}/p06-manuscript-storage
          VF_PRESS_DB_PATH: ${{ runner.temp }}/p06-manuscript-storage/app.db
        run: |
          set -Eeuo pipefail
          MANUSCRIPTS="$(find "$VF_PRESS_STORAGE_PATH/manuscripts" -type f -name '*.md' | wc -l)"
          MANIFESTS="$(find "$VF_PRESS_STORAGE_PATH/revisions" -type f -name 'manifest.json' | wc -l)"
          SNAPSHOTS="$(find "$VF_PRESS_STORAGE_PATH/revisions" -type f -name '*.md' | wc -l)"
          test "$MANUSCRIPTS" -ge 3
          test "$MANIFESTS" -ge 1
          test "$SNAPSHOTS" -ge 3
          php -r '$pdo=new PDO("sqlite:".getenv("VF_PRESS_DB_PATH")); if($pdo->query("PRAGMA integrity_check")->fetchColumn()!=="ok")exit(1); $p=(int)$pdo->query("SELECT COUNT(*) FROM publications")->fetchColumn(); $s=(int)$pdo->query("SELECT COUNT(*) FROM publication_sections")->fetchColumn(); $r=(int)$pdo->query("SELECT COUNT(*) FROM revisions")->fetchColumn(); if($p<1||$s<3||$r<1)exit(1); echo "DB_PUBLICATION_SECTIONS_REVISION=PASS\n";'
          test -z "$(git status --short --untracked-files=all)"
          echo "CANONICAL_MANUSCRIPT_FILES=$MANUSCRIPTS"
          echo "REVISION_MANIFESTS=$MANIFESTS"
          echo "REVISION_SECTION_SNAPSHOTS=$SNAPSHOTS"
          echo 'PRIVATE_SOURCE_REPOSITORY_CLEAN=PASS'
          echo 'PRIVATE_SOURCE_PERSISTED_TO_PUBLIC_REPOSITORY=NO'
          echo 'PRIVATE_SOURCE_UPLOADED_AS_ARTIFACT=NO'
          echo 'TOKEN_EXPOSED=NO'

      - name: Persist public-safe evidence
        if: ${{ always() }}
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          if [ "$JOB_STATUS" = 'success' ]; then RESULT='PASS'; else RESULT='FAIL'; fi
          mkdir -p runner-control/evidence/p06
          cat > runner-control/evidence/p06/P06_VF_PRESS_MANUSCRIPT_LATEST.txt <<EOF
          P06_PUBLICATION_MANUSCRIPT_MACHINE=$RESULT
          SOURCE_REPOSITORY=llhzx2018/vf-press
          SOURCE_SHA=$SOURCE_SHA
          EXECUTION_REPOSITORY=llhzx2018/core-free-runner-public
          EXECUTION_MODE=EPHEMERAL_PRIVATE_READ_PUBLIC_SAFE_EVIDENCE
          PRIVATE_SOURCE_PERSISTED=NO
          PRIVATE_SOURCE_ARTIFACT=NO
          TOKEN_EXPOSED=NO
          USER_MANUAL_EXECUTION_REQUIRED=NO
          CHECKS=SOURCE_IDENTITY,PHP_SYNTAX,FOUNDATION_REGRESSION,RESEARCH_REGRESSION,PUBLICATION_CREATE,RESEARCH_LINK,THREE_SECTIONS,MARKDOWN_SAVE,SECTION_REORDER,REVISION_SNAPSHOT,REVISION_IMMUTABILITY,SQLITE_INTEGRITY,REPOSITORY_CLEANLINESS
          EOF
          cd runner-control
          git config user.name 'VF Public Runner'
          git config user.email 'vf-public-runner@users.noreply.github.com'
          git add evidence/p06/P06_VF_PRESS_MANUSCRIPT_LATEST.txt
          if git diff --cached --quiet; then
            echo 'EVIDENCE_ALREADY_CURRENT=YES'
          else
            git commit -m "evidence(P06): Publication Manuscript $RESULT $SOURCE_SHA"
            git push origin HEAD:main
          fi
          echo "P06_PUBLICATION_MANUSCRIPT_MACHINE=$RESULT"
