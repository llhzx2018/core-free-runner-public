name: P06 VF Press V0.1.0 Operations Candidate Gate

on:
  push:
    branches: [main]
    paths:
      - triggers/p06-v010-ops-gate.txt
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_SHA: 6e2e2495a2a026d10ee448aaa121fa2aaf60bfb0
  PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
  VF_PRESS_OWNER_USERNAME: ops-owner
  VF_PRESS_OWNER_PASSWORD: synthetic-ops-password-2026
  VF_PRESS_OWNER_DISPLAY_NAME: Operations Owner

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Runner control
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner-control
          fetch-depth: 0

      - name: Checkout exact private candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-press
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Prepare Runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl sqlite3 composer >/dev/null
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          echo "VF_PRESS_PDF_BROWSER=$BROWSER" >> "$GITHUB_ENV"
          php -r 'foreach(["pdo","pdo_sqlite","sqlite3","json","mbstring","zip","curl"] as $e){if(!extension_loaded($e)){fwrite(STDERR,"MISSING:$e\n");exit(1);}}'

      - name: Exact Identity Static and Package Contract
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = '0.1.0'
          grep -Fq '"project_id": "P06"' VF_PROJECT.json
          grep -Fq '"lifecycle": "RELEASE_CANDIDATE"' VF_PROJECT.json
          grep -Fq '"schema": 2' VF_PROJECT.json
          grep -Fq 'VF_PRIVATE_READ_TOKEN' src/Application/Operations/OnlineUpdateService.php
          grep -Fq "private const CORE_REPOSITORY = 'llhzx2018/core-updates'" src/Application/Operations/OnlineUpdateService.php
          grep -Fq "private const PROJECT_FILE = 'P06.json'" src/Application/Operations/OnlineUpdateService.php
          grep -Fq "storagePath . '/update-source-backups'" src/Infrastructure/Config/AppConfig.php
          grep -Fq 'source-assets/branding' docs/operations/OPERATIONS_CONTRACT_V1.0.md
          ! grep -R --line-number -E '<style>|style=' src/Http public/index.php
          composer validate --strict >/dev/null
          composer dump-autoload --no-dev --optimize --no-interaction >/dev/null
          find src bin public -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null

      - name: Fresh Install and Schema Operations Tables
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf storage dist /tmp/vf-press-* || true
          mkdir -p storage
          php bin/preflight.php | tee /tmp/pre-before
          grep -Fq 'VF_PRESS_PREFLIGHT=PASS' /tmp/pre-before
          php bin/migrate.php | tee /tmp/migrate
          grep -Fq 'MIGRATION_PASS' /tmp/migrate
          php bin/preflight.php | tee /tmp/pre-after
          grep -Fq 'SCHEMA=2' /tmp/pre-after
          test "$(php -r '$p=new PDO("sqlite:storage/app.db");echo (int)$p->query("SELECT COUNT(*) FROM sqlite_master WHERE type=\"table\" AND name=\"app_settings\"")->fetchColumn();')" = '1'
          test "$(php -r '$p=new PDO("sqlite:storage/app.db");echo (int)$p->query("SELECT COUNT(*) FROM sqlite_master WHERE type=\"table\" AND name=\"update_runs\"")->fetchColumn();')" = '1'

      - name: Full Existing Regression
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          php bin/self-test.php | tee /tmp/t1
          php bin/security-self-test.php | tee /tmp/t2
          php bin/research-self-test.php | tee /tmp/t3
          php bin/publication-self-test.php | tee /tmp/t4
          php bin/reader-self-test.php | tee /tmp/t5
          php bin/edition-self-test.php | tee /tmp/t6
          php bin/job-self-test.php | tee /tmp/t7
          php bin/living-publishing-self-test.php | tee /tmp/t8
          grep -Fq 'FOUNDATION_SELF_TEST_PASS' /tmp/t1
          grep -Fq 'SECURITY_SELF_TEST_PASS' /tmp/t2
          grep -Fq 'RESEARCH_SELF_TEST_PASS' /tmp/t3
          grep -Fq 'PUBLICATION_MANUSCRIPT_SELF_TEST=PASS' /tmp/t4
          grep -Fq 'PUBLISHER_READER_SELF_TEST=PASS' /tmp/t5
          grep -Fq 'EDITION_SELF_TEST=PASS' /tmp/t6
          grep -Fq 'JOB_QUEUE_SELF_TEST=PASS' /tmp/t7
          grep -Fq 'LIVING_PUBLISHING_SELF_TEST=PASS' /tmp/t8
          grep -Fq 'WEB_EXPORT=PASS' /tmp/t8
          grep -Fq 'EPUB_EXPORT=PASS' /tmp/t8
          grep -Fq 'PDF_EXPORT=PASS' /tmp/t8
          grep -Fq 'RECOVERY_POINT=PASS' /tmp/t8
          grep -Fq 'RESTORE_READBACK=PASS' /tmp/t8

      - name: Operations Branding Recovery
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          php bin/operations-self-test.php | tee /tmp/ops
          grep -Fq 'OPERATIONS_SELF_TEST=PASS' /tmp/ops
          grep -Fq 'BRAND_ASSETS=PASS' /tmp/ops
          grep -Fq 'BRANDING_RECOVERY=PASS' /tmp/ops
          grep -Fq 'RECOVERY_VERIFY=PASS' /tmp/ops
          test -s storage/source-assets/branding/logo.png
          test -s storage/source-assets/branding/favicon.png

      - name: Update Core Commit and Automatic Rollback
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          php bin/update-self-test.php | tee /tmp/update
          for marker in UPDATE_SELF_TEST=PASS UPDATE_CORE_CHECK=PASS ASSET_BYTES_SHA=PASS AUTO_RECOVERY=PASS ATOMIC_APPLY=PASS POST_UPDATE_VERIFY=PASS FAILED_UPDATE_ROLLBACK=PASS SQLITE_INTEGRITY=PASS; do
            grep -Fq "$marker" /tmp/update
          done

      - name: HTTP Operations Center and Brand E2E
        working-directory: source
        shell: bash
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          php -r '$p=new PDO("sqlite:storage/app.db");$p->exec("UPDATE app_settings SET setting_value=\"0\" WHERE setting_key=\"update_auto_check\"");'
          php bin/create-owner.php | tee /tmp/owner
          grep -Fq 'OWNER_PROVISIONING_PASS' /tmp/owner
          cat >/tmp/vf-press-router.php <<'PHP'
          <?php
          $path=parse_url($_SERVER['REQUEST_URI']??'/',PHP_URL_PATH)?:'/';
          if($path!=='/' && is_file(getcwd().'/public'.$path)){return false;}
          require getcwd().'/public/index.php';
          PHP
          php -S 127.0.0.1:8099 -t public /tmp/vf-press-router.php >/tmp/server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 30); do
            if ! kill -0 "$PID" 2>/dev/null; then cat /tmp/server.log; exit 1; fi
            if curl -fsS --max-time 2 http://127.0.0.1:8099/health >/tmp/health 2>/tmp/curl.err; then READY=1; break; fi
            sleep 1
          done
          test "$READY" = 1
          grep -Fq '"status":"ok"' /tmp/health
          grep -Fq '"version":"0.1.0"' /tmp/health
          grep -Fq '"schema":2' /tmp/health
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/studio/operations)" = '303'
          curl -fsS -D /tmp/headers http://127.0.0.1:8099/ -o /tmp/home
          grep -Fiq "Content-Security-Policy: default-src 'self'" /tmp/headers
          grep -Fq 'VF Press 0.1.0' /tmp/home
          curl -fsS -D /tmp/logoheaders http://127.0.0.1:8099/brand/logo -o /tmp/logo.png
          grep -Fiq 'Content-Type: image/png' /tmp/logoheaders
          test -s /tmp/logo.png
          curl -fsS -c /tmp/cookies http://127.0.0.1:8099/login -o /tmp/login
          CSRF="$(grep -oP 'name="_csrf" value="\K[^"]+' /tmp/login | head -1)"
          test -n "$CSRF"
          LOGIN="$(curl -sS -b /tmp/cookies -c /tmp/cookies -o /tmp/login-result -w '%{http_code}' -X POST http://127.0.0.1:8099/login --data-urlencode "_csrf=$CSRF" --data-urlencode "username=$VF_PRESS_OWNER_USERNAME" --data-urlencode "password=$VF_PRESS_OWNER_PASSWORD")"
          test "$LOGIN" = '303'
          curl -fsS -b /tmp/cookies http://127.0.0.1:8099/studio/operations -o /tmp/ops-page
          grep -Fq 'OPERATIONS CENTER' /tmp/ops-page
          grep -Fq '在线更新' /tmp/ops-page
          grep -Fq 'Update Token' /tmp/ops-page
          grep -Fq 'Logo' /tmp/ops-page
          grep -Fq 'Recovery Point' /tmp/ops-page

      - name: Formal Artifact Build and Safety Inspection
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf dist
          php bin/build-release.php dist | tee /tmp/build
          grep -Fq 'RELEASE_BUILD=PASS' /tmp/build
          test -s dist/VF_Press_V0.1.0_FULL.zip
          test -s dist/VF_Press_V0.1.0_UPDATE.zip
          (cd dist && sha256sum -c SHA256SUMS.txt)
          unzip -l dist/VF_Press_V0.1.0_FULL.zip > /tmp/full-list
          grep -Fq 'vendor/autoload.php' /tmp/full-list
          grep -Fq 'public/index.php' /tmp/full-list
          grep -Fq 'INSTALL_VPS.md' /tmp/full-list
          ! grep -Eq '(^|[[:space:]])storage/' /tmp/full-list
          ! grep -Fq '.git/' /tmp/full-list
          ! unzip -p dist/VF_Press_V0.1.0_FULL.zip .env.example | grep -Eq 'VF_PRIVATE_READ_TOKEN=.+$'
          unzip -l dist/VF_Press_V0.1.0_UPDATE.zip > /tmp/update-list
          grep -Fq 'VF_UPDATE.json' /tmp/update-list
          grep -Fq 'payload/VERSION' /tmp/update-list
          grep -Fq 'payload/src/Infrastructure/Update/VFPressUpdateAdapter.php' /tmp/update-list
          unzip -p dist/VF_Press_V0.1.0_UPDATE.zip VF_UPDATE.json | grep -Fq '"schema": "vf-press-update/v1"'

      - name: Repository Cleanliness
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf storage dist storage-restore-* /tmp/vf-press-* || true
          STATUS="$(git status --short --untracked-files=all)"
          if [ -n "$STATUS" ]; then printf '%s\n' "$STATUS"; exit 1; fi

      - name: Persist Candidate Receipt
        if: ${{ always() }}
        shell: bash
        env:
          STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          [ "$STATUS" = success ] && RESULT=PASS || RESULT=FAIL
          git -C runner-control pull --rebase origin main
          mkdir -p runner-control/evidence/p06
          cat > runner-control/evidence/p06/P06_VF_PRESS_V010_OPERATIONS_CANDIDATE.txt <<EOF
          P06_V010_OPERATIONS_CANDIDATE=$RESULT
          VERSION=0.1.0
          SCHEMA=2
          SOURCE_REPOSITORY=llhzx2018/vf-press
          SOURCE_SHA=$SOURCE_SHA
          RUN_ID=$GITHUB_RUN_ID
          FULL_REGRESSION=${{ steps.full.outcome }}
          PRIVATE_SOURCE_PERSISTED=NO
          PRIVATE_DATA_USED=NO
          TOKEN_EXPOSED=NO
          PRODUCTION_WRITE=NO
          MAIN_WRITE=NO
          CHECKS=FOUNDATION,SECURITY,RESEARCH,MANUSCRIPT,READER,EDITION,LIVING_BOOK,WEB_EPUB_PDF,OPERATIONS,BRANDING,RECOVERY,UPDATE_CORE,ASSET_SHA,ATOMIC_APPLY,AUTO_ROLLBACK,HTTP_AUTH,CSP,FORMAL_FULL_UPDATE_ARTIFACT,CLEANLINESS
          EOF
          cd runner-control
          git config user.name 'VF Public Runner'
          git config user.email 'vf-public-runner@users.noreply.github.com'
          git add evidence/p06/P06_VF_PRESS_V010_OPERATIONS_CANDIDATE.txt
          git commit -m "evidence(P06): V0.1.0 operations candidate $RESULT $SOURCE_SHA run $GITHUB_RUN_ID" || true
          git pull --rebase origin main
          git push origin HEAD:main
          test "$RESULT" = PASS
