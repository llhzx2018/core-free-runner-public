name: P06 VF Press V0.1.0 Encrypted Package Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - triggers/p06-v010-encrypted-package-bridge.txt

permissions:
  contents: read

env:
  SOURCE_SHA: cea083cf04c74ae5bff2c6f2c92299b01fc3ad30

jobs:
  encrypted_bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact private final main source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-press
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Build verified deployment package
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl composer zip >/dev/null
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = '0.1.0'
          grep -Fq '"lifecycle": "RELEASE_READY"' VF_PROJECT.json
          composer validate --strict >/dev/null
          composer dump-autoload --no-dev --optimize --no-interaction >/dev/null
          rm -rf dist
          php bin/build-release.php dist | tee /tmp/build
          grep -Fq 'RELEASE_BUILD=PASS' /tmp/build
          (cd dist && sha256sum -c SHA256SUMS.txt)
          unzip -l dist/VF_Press_V0.1.0_FULL.zip >/tmp/full
          grep -Fq 'vendor/autoload.php' /tmp/full
          grep -Fq 'public/index.php' /tmp/full
          grep -Fq 'INSTALL_VPS.md' /tmp/full
          ! grep -Eq '(^|[[:space:]])storage/' /tmp/full
          ! grep -Fq '.git/' /tmp/full
          ! unzip -p dist/VF_Press_V0.1.0_FULL.zip .env.example | grep -Eq 'VF_PRIVATE_READ_TOKEN=.+$'
          unzip -p dist/VF_Press_V0.1.0_UPDATE.zip VF_UPDATE.json | grep -Fq '"schema": "vf-press-update/v1"'
          (cd dist && zip -q /tmp/VF_Press_V0.1.0_Deployment_Bundle.zip VF_Press_V0.1.0_FULL.zip VF_Press_V0.1.0_UPDATE.zip SHA256SUMS.txt RELEASE_INFO.json)

      - name: Encrypt bridge payload with one-time public key
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --quiet cryptography
          mkdir -p encrypted-bridge
          cat > /tmp/p06-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAwVFoZVFDY7Qo7pz1JBaI
          e3SAsLSV59HIzh4egZFFvWfCYDowMQ38G0FM9YdvJKAGLfuX3uyEc8bbg1WzdaW+
          bAy3C6xPpZ4c4bQyDC4tmCBHSwiMVLZkfnMICuTiuay7X1gUcRT3TmG9yTHVCDyG
          AZBcreWwPgBwPS7Jg0uaOBrmkHRaX99tgZ2vVcdngTNdeS746HiSoiIV7kccyHey
          IjmEq2bynaP0Ac+ywObyLDZJ5UdsoUiwheZ00FpRAsEHLcQr+NB6Cr8z2VBnMyJT
          qWFuSNF8dthNRF6kZ4sO3gWb0flDI3sjgeeYIA5advAPo5cLyRGCd6dG2qUlH13l
          AX1kekjgc7sOWmguon36JvRWY4aMla4ZD3cFs4CKujJ6toEbnLGxPxMA/Q8r8ouh
          31zZ00ZnWJiDX8d6029G4TLcGNBzwgooc1QsrcQER4UbN6+pYD7brAphg/uJNgpY
          e2/epeyddakTCUf+ZZWRBL2kMeEpYmFntnoO3HTOPWR7AgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import os, json, base64, hashlib
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization, hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          bundle=Path('/tmp/VF_Press_V0.1.0_Deployment_Bundle.zip').read_bytes()
          pub=serialization.load_pem_public_key(Path('/tmp/p06-public.pem').read_bytes())
          key=AESGCM.generate_key(bit_length=256)
          nonce=os.urandom(12)
          aad=b'P06-VF-PRESS-V0.1.0-DEPLOYMENT'
          ciphertext=AESGCM(key).encrypt(nonce,bundle,aad)
          wrapped=pub.encrypt(key,padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          out=Path('encrypted-bridge'); out.mkdir(exist_ok=True)
          (out/'payload.enc').write_bytes(ciphertext)
          (out/'key.enc').write_bytes(wrapped)
          full=Path('source/dist/VF_Press_V0.1.0_FULL.zip') if False else Path('source')
          meta={
            'schema':'p06-encrypted-bridge/v1','source_sha':os.environ['SOURCE_SHA'],
            'nonce_b64':base64.b64encode(nonce).decode(),'aad':aad.decode(),
            'bundle_sha256':hashlib.sha256(bundle).hexdigest(),'bundle_bytes':len(bundle)
          }
          (out/'meta.json').write_text(json.dumps(meta,indent=2)+'\n',encoding='utf-8')
          PY
          rm -f /tmp/VF_Press_V0.1.0_Deployment_Bundle.zip /tmp/p06-public.pem
          rm -rf source

      - name: Upload ciphertext-only bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: VF_Press_V0.1.0_Encrypted_Bridge
          path: encrypted-bridge/
          if-no-files-found: error
          retention-days: 1
