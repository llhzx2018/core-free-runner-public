name: P06 VF Press V0.1.0 Real Manifest Discovery

on:
  pull_request:
    branches: [main]
    paths:
      - triggers/p06-v010-manifest-discovery.txt

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact VF Press formal source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-press
          ref: cea083cf04c74ae5bff2c6f2c92299b01fc3ad30
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Read real core-updates P06 manifest through product client
        working-directory: source
        shell: bash
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-curl composer >/dev/null
          test -n "$VF_PRIVATE_READ_TOKEN"
          composer dump-autoload --no-dev --optimize --no-interaction >/dev/null
          php -r '
            require "vendor/autoload.php";
            $client=new CoreUpdates\GitHubClient(getenv("VF_PRIVATE_READ_TOKEN"),"vf-press-manifest-gate");
            $manifest=$client->fetchProjectManifest("llhzx2018/core-updates","P06.json");
            $core=new CoreUpdates\UpdateCore("P06");
            $result=$core->check("0.1.0","2",$manifest);
            if(($result["status"]??"")!=="UP_TO_DATE") { fwrite(STDERR,json_encode($result).PHP_EOL); exit(1); }
            if(($manifest["asset_bytes"]??0)!==144068) exit(2);
            if(($manifest["asset_sha256"]??"")!=="c2a88f2cc89ca3bf9237e33d138955686108b0c5f135388c6cafa3054fffe7fc") exit(3);
            echo "P06_REAL_MANIFEST_DISCOVERY=PASS\n";
            echo "CURRENT=0.1.0\nSCHEMA=2\nSTATUS=UP_TO_DATE\n";
          '
