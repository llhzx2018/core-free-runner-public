name: P06 VF Press V0.1.4 Final Release

on:
  pull_request:
    branches: [main]
    paths:
      - triggers/p06-v014-final-release-pr.txt

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: 5446dc20c4cdbb45cd1eaa7009b70621c8a0a9f9
      TAG: v0.1.4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-press
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source
      - name: Build exact final assets
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-zip composer >/dev/null
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat VERSION)" = '0.1.4'
          grep -Fq '"lifecycle": "RELEASE_READY"' VF_PROJECT.json
          composer dump-autoload --no-dev --optimize --no-interaction >/dev/null
          php bin/build-release.php dist | tee /tmp/build
          grep -Fq RELEASE_BUILD=PASS /tmp/build
          (cd dist && sha256sum -c SHA256SUMS.txt)
          unzip -p dist/VF_Press_V0.1.4_UPDATE.zip payload/src/Application/Operations/OnlineUpdateService.php | grep -Fq '.vfpress-secrets'
          echo "FULL_SHA=$(sha256sum dist/VF_Press_V0.1.4_FULL.zip | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "UPDATE_SHA=$(sha256sum dist/VF_Press_V0.1.4_UPDATE.zip | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "FULL_BYTES=$(stat -c%s dist/VF_Press_V0.1.4_FULL.zip)" >> "$GITHUB_ENV"
          echo "UPDATE_BYTES=$(stat -c%s dist/VF_Press_V0.1.4_UPDATE.zip)" >> "$GITHUB_ENV"
      - name: Reconcile and publish exact final release
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo llhzx2018/vf-press >/dev/null 2>&1; then
            gh release delete "$TAG" --repo llhzx2018/vf-press --cleanup-tag -y
          fi
          cat >/tmp/notes.md <<'EOF'
          VF Press V0.1.4 · 私有更新凭证正式接管版。
          - 环境变量优先，Web Root/Data/Recovery 外独立 Secret 文件兜底
          - Secret 不进入 SQLite、Data、Recovery、Git 或 Release ZIP
          - 支持一次性 vfpress-update-bootstrap.php Bootstrap Repair
          EOF
          gh release create "$TAG" --repo llhzx2018/vf-press dist/VF_Press_V0.1.4_FULL.zip dist/VF_Press_V0.1.4_UPDATE.zip dist/SHA256SUMS.txt dist/RELEASE_INFO.json --target "$SOURCE_SHA" --title 'VF Press V0.1.4' --notes-file /tmp/notes.md
          test "$(gh release view "$TAG" --repo llhzx2018/vf-press --json targetCommitish -q .targetCommitish)" = "$SOURCE_SHA"
          rm -rf /tmp/readback && mkdir /tmp/readback
          gh release download "$TAG" --repo llhzx2018/vf-press --dir /tmp/readback -p 'VF_Press_V0.1.4_FULL.zip' -p 'VF_Press_V0.1.4_UPDATE.zip'
          test "$(sha256sum /tmp/readback/VF_Press_V0.1.4_FULL.zip | awk '{print $1}')" = "$FULL_SHA"
          test "$(sha256sum /tmp/readback/VF_Press_V0.1.4_UPDATE.zip | awk '{print $1}')" = "$UPDATE_SHA"
          test "$(stat -c%s /tmp/readback/VF_Press_V0.1.4_FULL.zip)" = "$FULL_BYTES"
          test "$(stat -c%s /tmp/readback/VF_Press_V0.1.4_UPDATE.zip)" = "$UPDATE_BYTES"
          echo "OFFICIAL_FULL_BYTES=$FULL_BYTES"
          echo "OFFICIAL_FULL_SHA256=$FULL_SHA"
          echo "OFFICIAL_UPDATE_BYTES=$UPDATE_BYTES"
          echo "OFFICIAL_UPDATE_SHA256=$UPDATE_SHA"
          echo FORMAL_V014_REMOTE_READBACK=PASS
