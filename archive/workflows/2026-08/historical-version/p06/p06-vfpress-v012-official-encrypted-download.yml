name: P06 VF Press V0.1.2 Official Encrypted Download

on:
  pull_request:
    branches: [main]
    paths:
      - triggers/p06-v012-official-encrypted-download.txt

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download and verify official private FULL release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          mkdir -p /tmp/p06-v012-official
          gh release view v0.1.2 --repo llhzx2018/vf-press --json tagName,targetCommitish,isDraft,isPrerelease >/tmp/release.json
          test "$(jq -r '.tagName' /tmp/release.json)" = 'v0.1.2'
          test "$(jq -r '.targetCommitish' /tmp/release.json)" = '7a6b6d0d9a67013cdbf03a4445db12fcd0907473'
          test "$(jq -r '.isDraft' /tmp/release.json)" = 'false'
          test "$(jq -r '.isPrerelease' /tmp/release.json)" = 'false'
          gh release download v0.1.2 --repo llhzx2018/vf-press --dir /tmp/p06-v012-official -p 'VF_Press_V0.1.2_FULL.zip'
          test "$(stat -c%s /tmp/p06-v012-official/VF_Press_V0.1.2_FULL.zip)" = '144656'
          test "$(sha256sum /tmp/p06-v012-official/VF_Press_V0.1.2_FULL.zip | awk '{print $1}')" = '49f0ccfa8c19c8ec767bae182006945de9198ef81c5f2fa33172a2176bff15de'
          unzip -Z1 /tmp/p06-v012-official/VF_Press_V0.1.2_FULL.zip | sort >/tmp/full-list
          printf '%s\n' README_FIRST_INSTALL.txt index.php vfpress-install.php vfpress-runtime.php | sort >/tmp/expected
          diff -u /tmp/expected /tmp/full-list
          ! grep -Eq '^\.' /tmp/full-list
          echo OFFICIAL_V012_FULL=PASS

      - name: Encrypt official FULL with one-time public key
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --quiet cryptography
          mkdir -p encrypted-bridge
          cat >/tmp/p06-v012-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAsDizUiF2G8H9p/DHj1xQ
          WIckPPuSsmqNXa4iJTPOFRVzsIdCplyP69ThMtoZCpUaHoQC3j/x3Zt26i7Ba62g
          AFTpBB7MA6D6cfuTQchkG95MQra0wXW6Pc1f0mdLq9Cqj0ooeMkOy8t+pzpn4jK8
          tXYRoMaZTPmw1NSwcoWWFybnS4IAtG4XqN1A328BkR/Le7ggqGH21hHkdwsD6uGa
          C3i3Ya/o9yhZij+vD5IW/+7Xop0kKJWSo+/5a17n59Fo2QcTZ225s4FGaSHgZxUR
          BEHat+VPkDB2s3leX2byXsUC7R9LE1Vp6drq16BvofLD+1qr+4kytB/dh+fqJYT2
          QYd0Zb44ENYWVmNbuc60QkXlms3wsMY0a+V4/p18blQUzpvt1cofH+dMrf6+RUk+
          z6ImrKEm1xJ66P02BqqJGae10WzCiuts8vOo6vW+wVdag4hqw4INl3JWLQPDKY63
          VPtzf4d0KTQK66b1qOI6mmBUFp7D2istCIuE/sda4iHVAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import os, json, base64, hashlib
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization, hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          src=Path('/tmp/p06-v012-official/VF_Press_V0.1.2_FULL.zip').read_bytes()
          pub=serialization.load_pem_public_key(Path('/tmp/p06-v012-public.pem').read_bytes())
          key=AESGCM.generate_key(bit_length=256)
          nonce=os.urandom(12)
          aad=b'P06-VF-PRESS-V0.1.2-OFFICIAL-FULL'
          ct=AESGCM(key).encrypt(nonce,src,aad)
          wrapped=pub.encrypt(key,padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          out=Path('encrypted-bridge')
          (out/'payload.enc').write_bytes(ct)
          (out/'key.enc').write_bytes(wrapped)
          (out/'meta.json').write_text(json.dumps({
            'schema':'p06-v012-official-encrypted-bridge/v1',
            'release_tag':'v0.1.2',
            'source_sha':'7a6b6d0d9a67013cdbf03a4445db12fcd0907473',
            'nonce_b64':base64.b64encode(nonce).decode(),
            'aad':aad.decode(),
            'full_sha256':'49f0ccfa8c19c8ec767bae182006945de9198ef81c5f2fa33172a2176bff15de',
            'full_bytes':144656,
            'cipher_sha256':hashlib.sha256(ct).hexdigest()
          },indent=2)+'\n',encoding='utf-8')
          PY
          rm -rf /tmp/p06-v012-official /tmp/p06-v012-public.pem

      - name: Upload ciphertext only
        uses: actions/upload-artifact@v4
        with:
          name: VF_Press_V0.1.2_Official_Encrypted_Bridge
          path: encrypted-bridge/
          if-no-files-found: error
          retention-days: 1
