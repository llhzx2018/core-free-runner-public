name: P06 VF Press V0.1.4 Private Secret Release

on:
  push:
    branches: [main]
    paths:
      - triggers/p06-v014-private-secret-release.txt

permissions:
  contents: read

jobs:
  verify_release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: c7d8a12bb70166d47e94fd33494055595f7c0376
      TAG: v0.1.4
    steps:
      - name: Require registered capabilities
        shell: bash
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN"
          test -n "$VF_RELEASE_WRITE_TOKEN"
      - name: Checkout exact private candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-press
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source
      - name: Full regression and private secret fallback
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl sqlite3 composer >/dev/null
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat VERSION)" = '0.1.4'
          composer validate --strict >/dev/null
          composer dump-autoload --no-dev --optimize --no-interaction >/dev/null
          find public src -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          rm -rf storage dist storage-restore-*
          php bin/migrate.php | grep -Fq MIGRATION_PASS
          php bin/self-test.php | grep -Fq FOUNDATION_SELF_TEST_PASS
          php bin/security-self-test.php | grep -Fq SECURITY_SELF_TEST_PASS
          php bin/research-self-test.php | grep -Fq RESEARCH_SELF_TEST_PASS
          php bin/publication-self-test.php | grep -Fq PUBLICATION_MANUSCRIPT_SELF_TEST=PASS
          php bin/reader-self-test.php | grep -Fq PUBLISHER_READER_SELF_TEST=PASS
          php bin/edition-self-test.php | grep -Fq EDITION_SELF_TEST=PASS
          php bin/living-publishing-self-test.php | grep -Fq LIVING_PUBLISHING_SELF_TEST=PASS
          php bin/operations-self-test.php | grep -Fq OPERATIONS_SELF_TEST=PASS
          php bin/update-self-test.php | grep -Fq UPDATE_SELF_TEST=PASS
          php -r '
            require "vendor/autoload.php";
            $storage=getcwd()."/storage";
            $db=$storage."/app.db";
            $config=new VF\Press\Infrastructure\Config\AppConfig(getcwd(),$storage,$db,"test");
            $pdo=new PDO("sqlite:".$db);$pdo->setAttribute(PDO::ATTR_ERRMODE,PDO::ERRMODE_EXCEPTION);
            $audit=new VF\Press\Infrastructure\Security\AuditLogger($pdo);
            $recovery=new VF\Press\Infrastructure\Recovery\RecoveryService($pdo,$audit,$storage,$db);
            $adapter=new VF\Press\Infrastructure\Update\VFPressUpdateAdapter($pdo,$config,$audit,$recovery);
            putenv("VF_PRIVATE_READ_TOKEN");
            $secretRoot=dirname($storage)."/.vfpress-secrets";
            $siteKey=substr(hash("sha256",$storage),0,16);
            $secretFile=$secretRoot."/".$siteKey."/VF_PRIVATE_READ_TOKEN";
            @mkdir(dirname($secretFile),0700,true);file_put_contents($secretFile,"synthetic-private-token\n");@chmod($secretFile,0600);
            $svc=new VF\Press\Application\Operations\OnlineUpdateService($pdo,$config,$audit,$adapter);
            if(!$svc->tokenConfigured()) throw new RuntimeException("PRIVATE_SECRET_FALLBACK_FAIL");
            if(str_starts_with(realpath($secretFile)?:$secretFile, realpath($storage)?:$storage)) throw new RuntimeException("SECRET_INSIDE_DATA_FAIL");
            echo "PRIVATE_SECRET_FALLBACK=PASS\n";
            echo "SECRET_OUTSIDE_DATA=PASS\n";
            @unlink($secretFile);@rmdir(dirname($secretFile));@rmdir($secretRoot);
          '
          rm -rf storage dist storage-restore-*
      - name: Build formal assets
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          php bin/build-release.php dist | tee /tmp/build
          grep -Fq RELEASE_BUILD=PASS /tmp/build
          (cd dist && sha256sum -c SHA256SUMS.txt)
          FULL=dist/VF_Press_V0.1.4_FULL.zip
          UPDATE=dist/VF_Press_V0.1.4_UPDATE.zip
          test -s "$FULL" && test -s "$UPDATE"
          unzip -p "$UPDATE" payload/src/Application/Operations/OnlineUpdateService.php | grep -Fq '.vfpress-secrets'
          echo "FORMAL_FULL_SHA=$(sha256sum "$FULL" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "FORMAL_UPDATE_SHA=$(sha256sum "$UPDATE" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "FORMAL_FULL_BYTES=$(stat -c%s "$FULL")" >> "$GITHUB_ENV"
          echo "FORMAL_UPDATE_BYTES=$(stat -c%s "$UPDATE")" >> "$GITHUB_ENV"
      - name: Publish private release and remote readback
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cat >/tmp/notes.md <<'EOF'
          VF Press V0.1.4 · 私有更新凭证 Bootstrap 正式接管版。
          - 环境变量优先
          - Web Root 外独立 Secret 文件兜底
          - Secret 不进入 SQLite / Data / Recovery / Git / Release ZIP
          - 兼容一次性 Update Bootstrap Repair
          EOF
          gh release create "$TAG" --repo llhzx2018/vf-press dist/VF_Press_V0.1.4_FULL.zip dist/VF_Press_V0.1.4_UPDATE.zip dist/SHA256SUMS.txt dist/RELEASE_INFO.json --target "$SOURCE_SHA" --title 'VF Press V0.1.4' --notes-file /tmp/notes.md
          rm -rf /tmp/v014 && mkdir /tmp/v014
          gh release download "$TAG" --repo llhzx2018/vf-press --dir /tmp/v014 -p 'VF_Press_V0.1.4_FULL.zip' -p 'VF_Press_V0.1.4_UPDATE.zip'
          test "$(sha256sum /tmp/v014/VF_Press_V0.1.4_FULL.zip | awk '{print $1}')" = "$FORMAL_FULL_SHA"
          test "$(sha256sum /tmp/v014/VF_Press_V0.1.4_UPDATE.zip | awk '{print $1}')" = "$FORMAL_UPDATE_SHA"
          test "$(stat -c%s /tmp/v014/VF_Press_V0.1.4_FULL.zip)" = "$FORMAL_FULL_BYTES"
          test "$(stat -c%s /tmp/v014/VF_Press_V0.1.4_UPDATE.zip)" = "$FORMAL_UPDATE_BYTES"
          echo "OFFICIAL_FULL_SHA=$FORMAL_FULL_SHA"
          echo "OFFICIAL_UPDATE_SHA=$FORMAL_UPDATE_SHA"
          echo "OFFICIAL_FULL_BYTES=$FORMAL_FULL_BYTES"
          echo "OFFICIAL_UPDATE_BYTES=$FORMAL_UPDATE_BYTES"
          echo FORMAL_REMOTE_READBACK=PASS
