name: P06 VF Press V0.1.1 Cleanliness Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - triggers/p06-v011-cleanliness-diagnostic.txt

permissions:
  contents: read

env:
  SOURCE_SHA: cba5ad2bef6b9a00e3bfbd2bbac84aade3a358b6

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-press
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Diagnose generated changes
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          composer dump-autoload --no-dev --optimize --no-interaction >/dev/null
          echo '=== GIT STATUS ==='
          git status --porcelain --untracked-files=all
          echo '=== DIFF STAT ==='
          git diff --stat
          echo '=== CHANGED FILES ==='
          git diff --name-only
