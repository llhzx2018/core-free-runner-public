name: P06 VF Press MVP Candidate V2 Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p06-vfpress-mvp-candidate-v2.yml'
      - 'requests/p06-vfpress-mvp-candidate-v2-*.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p06-vfpress-mvp-candidate-v2
  cancel-in-progress: false

env:
  SOURCE_SHA: aa66f0d9c9441599a39c447e26a8b85feb8f99c2
  SOURCE_REPOSITORY: llhzx2018/vf-press
  PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
  VF_PRESS_OWNER_USERNAME: candidate-owner
  VF_PRESS_OWNER_PASSWORD: synthetic-candidate-password-2026
  VF_PRESS_OWNER_DISPLAY_NAME: Candidate Owner

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - id: control
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner-control
          fetch-depth: 1

      - id: capability
        shell: bash
        run: test -n "$PRIVATE_READ_TOKEN"

      - id: source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-press
          ref: aa66f0d9c9441599a39c447e26a8b85feb8f99c2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - id: runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl sqlite3 composer >/dev/null
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER"
          echo "VF_PRESS_PDF_BROWSER=$BROWSER" >> "$GITHUB_ENV"
          php -r 'foreach(["pdo_sqlite","sqlite3","mbstring","zip","curl"] as $e){if(!extension_loaded($e)){fwrite(STDERR,"missing:$e\n");exit(1);}}'

      - id: static
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          composer validate --strict >/dev/null
          composer dump-autoload --no-interaction --optimize >/dev/null
          find src bin public -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          grep -Fq 'SQLite3 extension is required for online Recovery snapshots' src/Infrastructure/Recovery/RecoveryService.php
          grep -Fq "store'=>false" src/Infrastructure/AI/OpenAIResponsesProvider.php
          grep -Fq 'PublishingController' public/index.php
          ! grep -R --line-number -E '<style>|style=' src/Http public/index.php

      - id: regression
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          rm -rf storage storage-restore-* /tmp/vf-press-*restore-* || true
          mkdir -p storage
          php bin/migrate.php >/tmp/migrate.out
          php bin/self-test.php >/tmp/base.out
          php bin/security-self-test.php >/tmp/security.out
          php bin/research-self-test.php >/tmp/research.out
          php bin/publication-self-test.php >/tmp/publication.out
          php bin/reader-self-test.php >/tmp/reader.out
          php bin/edition-self-test.php >/tmp/edition.out
          php bin/job-self-test.php >/tmp/job.out
          grep -Fq 'FOUNDATION_SELF_TEST_PASS' /tmp/base.out
          grep -Fq 'SECURITY_SELF_TEST_PASS' /tmp/security.out
          grep -Fq 'RESEARCH_SELF_TEST_PASS' /tmp/research.out
          grep -Fq 'PUBLICATION_MANUSCRIPT_SELF_TEST=PASS' /tmp/publication.out
          grep -Fq 'PUBLISHER_READER_SELF_TEST=PASS' /tmp/reader.out
          grep -Fq 'EDITION_SELF_TEST=PASS' /tmp/edition.out
          grep -Fq 'JOB_QUEUE_SELF_TEST=PASS' /tmp/job.out

      - id: living
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          php bin/living-publishing-self-test.php | tee /tmp/living.out
          for marker in LIVING_PUBLISHING_SELF_TEST=PASS WEB_EXPORT=PASS EPUB_EXPORT=PASS PDF_EXPORT=PASS DISTRIBUTION_STATE=PASS AI_EDITORIAL_ISOLATION=PASS RECOVERY_POINT=PASS RESTORE_READBACK=PASS PUBLISHED_READER_AUTHORITY=PASS SQLITE_INTEGRITY=PASS; do grep -Fq "$marker" /tmp/living.out; done

      - id: http
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          php bin/create-owner.php >/tmp/owner.out
          grep -Fq 'OWNER_PROVISIONING_PASS' /tmp/owner.out
          cat >/tmp/vf-press-router.php <<'PHP'
          <?php
          $path=parse_url($_SERVER['REQUEST_URI']??'/',PHP_URL_PATH)?:'/';
          if($path!=='/' && is_file(getcwd().'/public'.$path)){return false;}
          require getcwd().'/public/index.php';
          PHP
          php -S 127.0.0.1:8099 -t public /tmp/vf-press-router.php >/tmp/server.log 2>&1 &
          PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8099/health >/tmp/health && break; sleep 1; done
          grep -Fq '"status":"ok"' /tmp/health
          SLUG="$(php -r '$p=new PDO("sqlite:storage/app.db");echo $p->query("SELECT slug FROM publications WHERE current_edition_id IS NOT NULL ORDER BY updated_at DESC LIMIT 1")->fetchColumn();')"
          curl -fsS -D /tmp/headers http://127.0.0.1:8099/ -o /tmp/home
          grep -Fq '从 ChatGPT 到个人 Agent' /tmp/home
          grep -Fiq "Content-Security-Policy: default-src 'self'" /tmp/headers
          curl -fsS "http://127.0.0.1:8099/books/$SLUG" -o /tmp/book
          grep -Fq 'Edition 0.1.0' /tmp/book
          curl -fsS "http://127.0.0.1:8099/read/$SLUG" -o /tmp/read
          grep -Fq 'Published Snapshot' /tmp/read
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/studio/publishing)" = '303'
          curl -fsS -c /tmp/cookies http://127.0.0.1:8099/login -o /tmp/login
          CSRF="$(grep -oP 'name="_csrf" value="\K[^"]+' /tmp/login | head -1)"
          test "$(curl -sS -b /tmp/cookies -c /tmp/cookies -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8099/login --data-urlencode "_csrf=$CSRF" --data-urlencode "username=$VF_PRESS_OWNER_USERNAME" --data-urlencode "password=$VF_PRESS_OWNER_PASSWORD")" = '303'
          curl -fsS -b /tmp/cookies http://127.0.0.1:8099/studio/publishing -o /tmp/desk
          grep -Fq 'Publishing Desk' /tmp/desk

      - id: backup
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          php bin/backup.php | tee /tmp/backup
          RECOVERY_ID="$(grep '^RECOVERY_ID=' /tmp/backup | cut -d= -f2)"
          test -n "$RECOVERY_ID"
          TARGET="/tmp/vf-press-v2-restore-$RANDOM"
          php bin/restore.php --recovery="$RECOVERY_ID" --target="$TARGET" | tee /tmp/restore
          grep -Fq 'RESTORE_STAGING=PASS' /tmp/restore
          test "$(php -r '$p=new PDO("sqlite:'"$TARGET"'/app.db");echo $p->query("PRAGMA integrity_check")->fetchColumn();')" = 'ok'
          php bin/migrate.php >/dev/null
          rm -rf "$TARGET" storage-restore-* /tmp/vf-press-*restore-* || true
          test -z "$(git status --short --untracked-files=all)"

      - name: Persist V2 evidence
        if: ${{ always() }}
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          O_CAP: ${{ steps.capability.outcome }}
          O_SOURCE: ${{ steps.source.outcome }}
          O_RUNTIME: ${{ steps.runtime.outcome }}
          O_STATIC: ${{ steps.static.outcome }}
          O_REGRESSION: ${{ steps.regression.outcome }}
          O_LIVING: ${{ steps.living.outcome }}
          O_HTTP: ${{ steps.http.outcome }}
          O_BACKUP: ${{ steps.backup.outcome }}
        run: |
          set -Eeuo pipefail
          [ "$JOB_STATUS" = success ] && RESULT=PASS || RESULT=FAIL
          mkdir -p runner-control/evidence/p06
          cat > runner-control/evidence/p06/P06_VF_PRESS_MVP_CANDIDATE_V2_LATEST.txt <<EOF
          P06_MVP_CANDIDATE_V2=$RESULT
          SOURCE_SHA=$SOURCE_SHA
          SCHEMA=2
          RUN_ID=$GITHUB_RUN_ID
          OUTCOME_CAPABILITY=$O_CAP
          OUTCOME_SOURCE=$O_SOURCE
          OUTCOME_RUNTIME=$O_RUNTIME
          OUTCOME_STATIC=$O_STATIC
          OUTCOME_REGRESSION=$O_REGRESSION
          OUTCOME_LIVING=$O_LIVING
          OUTCOME_HTTP=$O_HTTP
          OUTCOME_BACKUP=$O_BACKUP
          PRIVATE_SOURCE_PERSISTED=NO
          PRIVATE_SOURCE_ARTIFACT=NO
          PRIVATE_DATA_USED=NO
          TOKEN_EXPOSED=NO
          PRODUCTION_WRITE=NO
          MAIN_WRITE=NO
          USER_MANUAL_EXECUTION_REQUIRED=NO
          CHECKS=FULL_REGRESSION,LIVING_BOOK,EDITION_IMMUTABILITY,PUBLISHED_READER,WEB_EPUB_PDF,DISTRIBUTION,AI_ISOLATION,JOB_QUEUE,ONLINE_SQLITE_BACKUP,RESTORE,HTTP,STUDIO_AUTH,CSP,CLEANLINESS
          EOF
          cd runner-control
          git config user.name 'VF Public Runner'
          git config user.email 'vf-public-runner@users.noreply.github.com'
          git add evidence/p06/P06_VF_PRESS_MVP_CANDIDATE_V2_LATEST.txt
          git commit -m "evidence(P06): MVP Candidate V2 $RESULT $SOURCE_SHA run $GITHUB_RUN_ID"
          git push origin HEAD:main
          test "$RESULT" = PASS
