name: P06 VF Press Publisher Reader Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p06-vfpress-publisher-reader.yml'
      - 'requests/p06-vfpress-publisher-reader-*.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p06-vfpress-publisher-reader
  cancel-in-progress: false

jobs:
  verify-and-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_REPOSITORY: llhzx2018/vf-press
      SOURCE_SHA: b8dbad40de5a3b7e4deb275925ec4cd896348e20
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout public-safe evidence repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: evidence-repo
          fetch-depth: 1

      - name: Require registered private read capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN" || { echo 'REGISTERED_CAPABILITY_BLOCK=VF_PRIVATE_READ_TOKEN_MISSING' >&2; exit 78; }
          echo 'PRIVATE_READ_CAPABILITY=PASS'

      - name: Checkout exact private VF Press source ephemerally
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-press
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: source

      - name: Prepare PHP runtime and validate source
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          grep -Fq '"current_phase": "PHASE_D_PUBLISHER_READER"' VF_PROJECT.json
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring sqlite3 composer curl openssl >/dev/null
          composer validate --strict >/dev/null
          composer dump-autoload --no-interaction --optimize >/dev/null
          php -r 'if(!extension_loaded("pdo_sqlite")||!extension_loaded("mbstring")){exit(1);} echo "PHP_RUNTIME=PASS\n";'
          COUNT=0
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; COUNT=$((COUNT+1)); done < <(find src bin public -type f -name '*.php' -print0)
          test "$COUNT" -gt 0
          echo "PHP_FILES_CHECKED=$COUNT"
          echo 'SOURCE_IDENTITY=PASS'
          echo 'PHP_SYNTAX=PASS'

      - name: Run isolated regression gates
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          run_test() {
            local script="$1"
            local name="$2"
            export VF_PRESS_STORAGE_PATH="${RUNNER_TEMP}/p06-${name}"
            export VF_PRESS_DB_PATH="${VF_PRESS_STORAGE_PATH}/app.db"
            export APP_ENV=test
            rm -rf "$VF_PRESS_STORAGE_PATH"
            mkdir -p "$VF_PRESS_STORAGE_PATH"
            php bin/migrate.php >/dev/null
            php "$script" >"/tmp/${name}.log"
            cat "/tmp/${name}.log"
            php -r '$pdo=new PDO("sqlite:".getenv("VF_PRESS_DB_PATH"));if($pdo->query("PRAGMA integrity_check")->fetchColumn()!=="ok")exit(1);'
          }
          run_test bin/self-test.php foundation
          run_test bin/security-self-test.php security
          run_test bin/research-self-test.php research
          run_test bin/publication-self-test.php manuscript
          run_test bin/reader-self-test.php reader
          grep -Fq 'PUBLICATION_MANUSCRIPT_SELF_TEST=PASS' /tmp/manuscript.log
          grep -Fq 'REVISION_IMMUTABLE=PASS' /tmp/manuscript.log
          grep -Fq 'PUBLISHER_READER_SELF_TEST=PASS' /tmp/reader.log
          grep -Fq 'SAFE_MARKDOWN=PASS' /tmp/reader.log
          grep -Fq 'READER_NAVIGATION=PASS' /tmp/reader.log
          echo 'FOUNDATION_REGRESSION=PASS'
          echo 'SECURITY_REGRESSION=PASS'
          echo 'RESEARCH_REGRESSION=PASS'
          echo 'MANUSCRIPT_REGRESSION=PASS'
          echo 'PUBLISHER_READER_MACHINE=PASS'

      - name: Prepare isolated synthetic Publisher Reader runtime
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          export VF_PRESS_STORAGE_PATH="${RUNNER_TEMP}/p06-visual-runtime"
          export VF_PRESS_DB_PATH="${VF_PRESS_STORAGE_PATH}/app.db"
          export APP_ENV=test
          rm -rf "$VF_PRESS_STORAGE_PATH"
          mkdir -p "$VF_PRESS_STORAGE_PATH"
          php bin/migrate.php >/dev/null

          PREVIEW_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$PREVIEW_PASSWORD" >/tmp/p06-reader-preview-password
          VF_PRESS_OWNER_USERNAME='visual-owner' \
          VF_PRESS_OWNER_PASSWORD="$PREVIEW_PASSWORD" \
          VF_PRESS_OWNER_DISPLAY_NAME='Visual Owner' \
          php bin/create-owner.php >/dev/null
          unset PREVIEW_PASSWORD

          cat >/tmp/p06-reader-seed.php <<'PHP'
          <?php
          declare(strict_types=1);
          require getcwd() . '/vendor/autoload.php';
          $config = VF\Press\Infrastructure\Config\AppConfig::fromEnvironment(getcwd());
          $pdo = VF\Press\Infrastructure\Database\ConnectionFactory::create($config);
          $audit = new VF\Press\Infrastructure\Security\AuditLogger($pdo);
          $research = new VF\Press\Application\Research\ResearchService($pdo, $audit);
          $store = new VF\Press\Infrastructure\Storage\ManuscriptStore($config->storagePath);
          $publications = new VF\Press\Application\Publication\PublicationService($pdo, $audit, $store);

          $researchId = $research->createProject(
              'Agent 可靠性研究',
              '为什么 Agent 已经拥有 Tool 和 Memory，仍然经常不能可靠完成复杂、长期、跨步骤任务？',
              '把个人实践整理成可以持续修订的知识体系。'
          );
          $publicationId = $publications->createPublication(
              'BOOK',
              '从 ChatGPT 到个人 Agent：一个普通人的 AI 自动化实践',
              '从会回答，到能持续完成复杂任务',
              '一本记录个人 AI 自动化实践、失败、修正和系统化过程的 Living Book。',
              '我想把那些真正踩过的坑、建立过的系统和验证过的方法留下来，而不是重新包装一套空泛的 AI 概念。',
              '写给想把 AI 真正用进个人工作流、但不想先成为专业程序员的人。',
              $researchId
          );
          $chapters = [
              ['从会聊天到会做事', "# 从会聊天到会做事\n\n第一次接触 ChatGPT 时，最强烈的感受是：机器终于可以用自然语言沟通了。你不需要先学会一套复杂的软件，也不需要记住命令，只要把问题说出来，它就能回答。\n\n但真正把 AI 用进日常工作以后，我很快发现，**会回答和会做事是两件完全不同的事。**\n\n> 一个回答可以在十秒钟内结束；一个真实任务却可能跨越几十个步骤、多个系统和几天时间。\n\n如果 AI 不知道自己做到哪里，不知道哪些信息可信，不知道什么动作需要授权，也不知道最后如何证明事情真的完成，那么再聪明的模型也会不断把人拉回执行位。\n\n这也是我后来开始搭 Skill、Workflow、Tool、Memory，再一路走到 Agent Runtime 的原因。\n\n## 真正的分水岭\n\n当 AI 从“给我一个答案”进入“替我推进一件事”，系统必须开始回答几个以前并不重要的问题：\n\n- 当前状态是什么？\n- 下一步应该做什么？\n- 哪些动作可以自动执行？\n- 哪些动作必须由 Owner 决定？\n- 中途失败以后从哪里恢复？\n- 最后用什么 Evidence 证明完成？\n\n这些问题看起来不像 AI 问题，却恰恰决定了 Agent 能不能长期可靠工作。\n\n## 从 Prompt 转向系统\n\nPrompt 仍然重要，但它不再是全部。真正稳定的个人自动化，更像一个由 Runtime、Authority、Memory、Tool 和 Verification 共同组成的小型操作系统。\n\n我后来越来越少问“这条 Prompt 要怎么写得更聪明”，而开始问“怎样让系统替我扛住重复执行和状态管理”。这才是从聊天工具走向个人 Agent 的真正开始。\n"],
              ['Tool：让 AI 接触外部世界', "# Tool：让 AI 接触外部世界\n\n模型本身只能生成内容。Tool 让它第一次能够读取真实状态、修改外部系统，并把执行结果重新带回推理过程。\n\n但是 Tool 越强，Authority 和 Verification 就越重要。能写 Git、能操作服务器、能发邮件，不代表每一次都应该自动执行。\n\n一个成熟的 Tool 不是简单的函数调用，而是一份明确的能力合同。\n"],
              ['Memory：为什么 Agent 需要记忆', "# Memory：为什么 Agent 需要记忆\n\n聊天记录很多，不等于 Agent 拥有可靠记忆。长期任务真正需要的是可检索、可追溯、知道何时失效的外部记忆。\n\n好的 Memory 不只是保存，它还要帮助 Agent 在新窗口、新运行、新模型之间恢复同一个任务的上下文。\n"],
              ['Agent Runtime：真正让 Agent 活起来的地方', "# Agent Runtime：真正让 Agent 活起来的地方\n\nRuntime 负责把一次模型调用变成一个可以暂停、恢复、重试、验证和持续推进的运行过程。\n\n当状态、Checkpoint、Lease、Evidence 和 Owner Gate 被放进同一个生命周期里，Agent 才不再依赖某一个聊天窗口继续活着。\n"],
          ];
          $firstSectionId = '';
          foreach ($chapters as $index => [$title, $markdown]) {
              $sectionId = $publications->addSection($publicationId, $title, 'CHAPTER');
              $publications->saveSection($publicationId, $sectionId, $title, $markdown, 'DRAFT');
              if ($index === 0) $firstSectionId = $sectionId;
          }
          file_put_contents('/tmp/p06-reader-publication-id', $publicationId);
          file_put_contents('/tmp/p06-reader-section-id', $firstSectionId);
          PHP
          php /tmp/p06-reader-seed.php
          test -s /tmp/p06-reader-publication-id
          test -s /tmp/p06-reader-section-id
          echo 'SYNTHETIC_PUBLICATION_READY=PASS'

      - name: Start isolated routed PHP runtime
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          export VF_PRESS_STORAGE_PATH="${RUNNER_TEMP}/p06-visual-runtime"
          export VF_PRESS_DB_PATH="${VF_PRESS_STORAGE_PATH}/app.db"
          export APP_ENV=test
          cat >/tmp/p06-reader-router.php <<PHP
          <?php
          declare(strict_types=1);
          \$publicRoot = '${GITHUB_WORKSPACE}/source/public';
          \$requestPath = parse_url(\$_SERVER['REQUEST_URI'] ?? '/', PHP_URL_PATH) ?: '/';
          \$candidate = realpath(\$publicRoot . \$requestPath);
          \$publicReal = realpath(\$publicRoot);
          if (\$candidate !== false && \$publicReal !== false && is_file(\$candidate) && str_starts_with(\$candidate, \$publicReal . DIRECTORY_SEPARATOR)) {
              return false;
          }
          require \$publicRoot . '/index.php';
          PHP
          nohup env VF_PRESS_STORAGE_PATH="$VF_PRESS_STORAGE_PATH" VF_PRESS_DB_PATH="$VF_PRESS_DB_PATH" APP_ENV=test php -S 127.0.0.1:8099 -t public /tmp/p06-reader-router.php >/tmp/p06-reader-server.log 2>&1 &
          echo $! >/tmp/p06-reader-server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/health >/dev/null; then
              echo 'LOCAL_RUNTIME=PASS'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/p06-reader-server.log
          exit 1

      - name: Prepare Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p06-reader-browser
          cd /tmp/p06-reader-browser
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Capture authenticated Publisher Reader runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence-repo/evidence/p06/publisher-reader
          cat >/tmp/p06-reader-browser/capture.js <<'JS'
          const { chromium } = require('/tmp/p06-reader-browser/node_modules/playwright');
          const fs = require('fs');

          (async () => {
            const password = fs.readFileSync('/tmp/p06-reader-preview-password', 'utf8');
            const publicationId = fs.readFileSync('/tmp/p06-reader-publication-id', 'utf8').trim();
            const sectionId = fs.readFileSync('/tmp/p06-reader-section-id', 'utf8').trim();
            const base = 'http://127.0.0.1:8099';
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1050 }, deviceScaleFactor: 1 });

            await page.goto(`${base}/preview/publisher`);
            if (!page.url().includes('/login')) throw new Error('Preview route must require Owner auth.');
            await page.getByLabel('用户名').fill('visual-owner');
            await page.getByLabel('密码').fill(password);
            await Promise.all([
              page.waitForURL('**/studio'),
              page.getByRole('button', { name: '登录' }).click(),
            ]);

            await page.goto(`${base}/preview/publisher`);
            await page.getByText('OWNER PREVIEW · WORKING PUBLICATION').waitFor();
            await page.screenshot({ path: 'evidence-repo/evidence/p06/publisher-reader/01_publisher_desktop.png', fullPage: true });

            await page.goto(`${base}/preview/publications/${publicationId}`);
            await page.getByRole('heading', { name: '为什么写' }).waitFor();
            await page.getByText('这还不是正式 Edition。').waitFor();
            await page.screenshot({ path: 'evidence-repo/evidence/p06/publisher-reader/02_book_detail_desktop.png', fullPage: true });

            const readerUrl = `${base}/preview/read/${publicationId}/${sectionId}`;
            await page.goto(readerUrl);
            await page.getByRole('heading', { name: '从会聊天到会做事' }).first().waitFor();
            await page.screenshot({ path: 'evidence-repo/evidence/p06/publisher-reader/03_reader_desktop.png', fullPage: true });

            await page.getByRole('button', { name: '阅读设置' }).click();
            await page.locator('[data-reader-font]').fill('23');
            await page.locator('[data-reader-line]').fill('1.95');
            await page.getByRole('button', { name: '暖色' }).click();
            if ((await page.locator('html').getAttribute('data-reader-theme')) !== 'warm') throw new Error('Reader theme preference failed.');
            await page.keyboard.press('Escape');
            if (await page.locator('[data-reader-settings-panel]').isVisible()) throw new Error('Reader settings drawer did not close.');

            await page.setViewportSize({ width: 390, height: 844 });
            await page.goto(readerUrl);
            await page.getByRole('heading', { name: '从会聊天到会做事' }).first().waitFor();
            if ((await page.locator('html').getAttribute('data-reader-theme')) !== 'warm') throw new Error('Reader preferences did not persist.');
            await page.getByRole('button', { name: '打开目录' }).click();
            await page.getByText('Tool：让 AI 接触外部世界').waitFor();
            await page.keyboard.press('Escape');
            await page.screenshot({ path: 'evidence-repo/evidence/p06/publisher-reader/04_reader_mobile.png', fullPage: true });

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          JS
          node /tmp/p06-reader-browser/capture.js
          echo 'PUBLISHER_DESKTOP_VISUAL=PASS'
          echo 'BOOK_DETAIL_DESKTOP_VISUAL=PASS'
          echo 'READER_DESKTOP_VISUAL=PASS'
          echo 'READER_MOBILE_VISUAL=PASS'
          echo 'READER_SETTINGS_INTERACTION=PASS'

      - name: Verify privacy and source cleanliness
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          rm -f /tmp/p06-reader-preview-password
          test -z "$(git status --short --untracked-files=all)"
          echo 'PRIVATE_SOURCE_REPOSITORY_CLEAN=PASS'
          echo 'PRIVATE_SOURCE_PERSISTED_TO_PUBLIC_REPOSITORY=NO'
          echo 'PRIVATE_SOURCE_UPLOADED_AS_ARTIFACT=NO'
          echo 'PRIVATE_DATA_USED=NO'
          echo 'TOKEN_EXPOSED=NO'

      - name: Persist public-safe machine and visual evidence
        if: ${{ always() }}
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          if [ "$JOB_STATUS" = 'success' ]; then RESULT='PASS'; else RESULT='FAIL'; fi
          mkdir -p evidence-repo/evidence/p06/publisher-reader
          cat > evidence-repo/evidence/p06/publisher-reader/RECEIPT.txt <<EOF
          P06_PUBLISHER_READER_MACHINE=$RESULT
          P06_PUBLISHER_READER_VISUAL=READY_FOR_OWNER_REVIEW
          SOURCE_REPOSITORY=llhzx2018/vf-press
          SOURCE_SHA=$SOURCE_SHA
          EXECUTION_REPOSITORY=llhzx2018/core-free-runner-public
          DATA_MODE=SYNTHETIC_PUBLIC_SAFE
          PREVIEW_AUTH_REQUIRED=YES
          FORMAL_EDITION_EXPOSED=NO
          SCREENSHOTS=4
          PRIVATE_SOURCE_PERSISTED=NO
          PRIVATE_SOURCE_ARTIFACT=NO
          PRIVATE_DATA_USED=NO
          TOKEN_EXPOSED=NO
          USER_MANUAL_EXECUTION_REQUIRED=NO
          CHECKS=SOURCE_IDENTITY,PHP_SYNTAX,FOUNDATION_REGRESSION,SECURITY_REGRESSION,RESEARCH_REGRESSION,MANUSCRIPT_REGRESSION,SAFE_MARKDOWN,READER_NAVIGATION,READER_PROGRESS,PREVIEW_AUTH,PUBLISHER_DESKTOP,BOOK_DETAIL_DESKTOP,READER_DESKTOP,READER_MOBILE,READER_SETTINGS_LOCAL_PREFERENCES,REPOSITORY_CLEANLINESS
          EOF
          cd evidence-repo
          git config user.name 'VF Public Runner'
          git config user.email 'vf-public-runner@users.noreply.github.com'
          git pull --rebase origin main
          git add evidence/p06/publisher-reader
          if git diff --cached --quiet; then
            echo 'EVIDENCE_ALREADY_CURRENT=YES'
          else
            git commit -m "evidence(P06): Publisher Reader $RESULT $SOURCE_SHA"
            git push origin HEAD:main
          fi
          echo "P06_PUBLISHER_READER_MACHINE=$RESULT"
