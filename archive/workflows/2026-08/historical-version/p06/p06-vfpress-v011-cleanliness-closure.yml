name: P06 VF Press V0.1.1 Cleanliness Closure

on:
  pull_request:
    branches: [main]
    paths:
      - triggers/p06-v011-cleanliness-closure.txt

permissions:
  contents: read

env:
  SOURCE_SHA: cba5ad2bef6b9a00e3bfbd2bbac84aade3a358b6

jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-press
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Reproduce recovery test residue and clean correctly
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl composer >/dev/null
          composer dump-autoload --no-dev --optimize --no-interaction >/dev/null
          rm -rf storage dist storage-restore-*
          php bin/migrate.php >/dev/null
          php bin/living-publishing-self-test.php | grep -Fq 'LIVING_PUBLISHING_SELF_TEST=PASS'
          echo 'BEFORE_CLEANUP:'
          git status --porcelain --untracked-files=all || true
          rm -rf storage dist storage-restore-*
          echo 'AFTER_CLEANUP:'
          git status --porcelain --untracked-files=all > /tmp/status
          cat /tmp/status
          test ! -s /tmp/status
          echo P06_V011_CLEANLINESS_CLOSURE=PASS
