name: core-agent V0.5 Independent Machine Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/core-agent-v0.5-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CORE_AGENT_SOURCE_SHA: e32f6411ee0ee7ca9a85340503b96fdd06ff9a26
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN || secrets.CORE_AGENT_RUNNER_TOKEN || secrets.VF_START_RUNNER_TOKEN }}
    steps:
      - name: Verify private read credential is available
        shell: bash
        run: |
          if [ -z "$PRIVATE_READ_TOKEN" ]; then
            echo "RUNNER_INFRASTRUCTURE_BLOCK=PRIVATE_READ_TOKEN_MISSING"
            exit 78
          fi

      - name: Checkout exact core-agent V0.5 develop source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-agent
          ref: ${{ env.CORE_AGENT_SOURCE_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run core-agent machine verification
        working-directory: source
        env:
          VF_SOURCE_SHA: ${{ env.CORE_AGENT_SOURCE_SHA }}
        run: python scripts/verify.py

      - name: Run real P02 autonomous read-only pilot
        working-directory: source
        env:
          VF_PRIVATE_READ_TOKEN: ${{ env.PRIVATE_READ_TOKEN }}
        run: python scripts/pilot_v05_p02.py

      - name: Build combined public-safe evidence summary
        if: always()
        working-directory: source
        env:
          VF_SOURCE_SHA: ${{ env.CORE_AGENT_SOURCE_SHA }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          machine = Path('.evidence/verification.json')
          pilot = Path('.evidence/p02-v05-pilot.json')
          out = Path('.evidence/public-evidence.json')
          payload = {
              'schema': 'core-agent-public-evidence/v2',
              'version': '0.5.0',
              'source_sha': os.environ['VF_SOURCE_SHA'],
              'private_source_persisted': False,
          }

          machine_status = 'MISSING'
          if machine.exists():
              raw = machine.read_bytes()
              detail = json.loads(raw.decode('utf-8'))
              machine_status = detail.get('status')
              payload.update({
                  'machine_status': machine_status,
                  'private_machine_evidence_sha256': hashlib.sha256(raw).hexdigest(),
                  'check_exit_codes': [item.get('exit_code') for item in detail.get('checks', [])],
                  'runner': detail.get('runner'),
              })
          else:
              payload['machine_status'] = machine_status

          pilot_status = 'MISSING'
          if pilot.exists():
              raw = pilot.read_bytes()
              detail = json.loads(raw.decode('utf-8'))
              pilot_status = detail.get('status')
              payload.update({
                  'pilot_status': pilot_status,
                  'pilot_evidence_sha256': hashlib.sha256(raw).hexdigest(),
                  'pilot_version': detail.get('version'),
                  'pilot_main_equals_develop': detail.get('main_equals_develop'),
                  'pilot_compare_status': detail.get('compare_status'),
                  'pilot_steps': detail.get('steps'),
                  'pilot_write_actions': detail.get('write_actions'),
                  'pilot_token_exposed': detail.get('token_exposed'),
              })
          else:
              payload['pilot_status'] = pilot_status

          payload['status'] = 'PASS' if machine_status == 'PASS' and pilot_status == 'PASS' else 'FAIL'
          canonical = json.dumps(payload, ensure_ascii=False, sort_keys=True).encode('utf-8')
          payload['sha256'] = hashlib.sha256(canonical).hexdigest()
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8')
          print(f"PUBLIC_EVIDENCE_STATUS={payload['status']}")
          print(f"PUBLIC_EVIDENCE_SHA256={payload['sha256']}")
          PY

      - name: Upload public-safe evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-agent-v0.5-public-evidence-${{ env.CORE_AGENT_SOURCE_SHA }}
          path: |
            source/.evidence/public-evidence.json
            source/.evidence/p02-v05-pilot.json
          if-no-files-found: error
          retention-days: 14
