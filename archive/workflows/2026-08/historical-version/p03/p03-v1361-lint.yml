name: P03 V1.36.1 Workflow Lint

on:
  pull_request:
    branches: [main]
    paths:
      - 'evidence/p03-v1361-polish/lint-trigger.txt'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate target workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; YAML.load_file(ARGV[0], aliases: true); puts "YAML_PARSE_PASS"' .github/workflows/p03-v1361-polish-release.yml
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color .github/workflows/p03-v1361-polish-release.yml
