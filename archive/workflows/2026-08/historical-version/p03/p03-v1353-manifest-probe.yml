name: P03 V1.35.3 Runtime Manifest Probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p03-v1353-manifest-probe.yml'
      - 'requests/p03-v1353-manifest-probe-*.txt'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: 78968a9af1d227f036660c30a4a6335d71012504
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p03
      - name: Print deterministic runtime manifest
        working-directory: p03
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/runtime"
          python3 scripts/build_runtime.py "$OUT" >/dev/null
          python3 - "$OUT" <<'PY'
          from pathlib import Path
          import hashlib,sys
          root=Path(sys.argv[1])
          rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              rows.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}")
          print('MANIFEST_BEGIN')
          print('\n'.join(rows))
          print('MANIFEST_END')
          print(f'RUNTIME_FILE_COUNT={len(rows)}')
          PY
