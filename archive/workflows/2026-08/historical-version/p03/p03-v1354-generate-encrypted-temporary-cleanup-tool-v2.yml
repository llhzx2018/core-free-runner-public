name: P03 V1.35.4 Generate Encrypted Temporary Cleanup Tool V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p03-v1354-generate-encrypted-temporary-cleanup-tool-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: p03-v1354-generate-encrypted-temporary-cleanup-tool-v2
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CORRECTIVE_HEAD: fab45a3da431c87fd5e30c33c2dee2e6df34be68
      FROZEN_PRODUCT_COMMIT: af34b84a3135333cf05077b3eb64e22ef6b3afef
      EXPECTED_PRODUCT_TREE: 08eee7e8c891a57c357553dd5de20c1a7bd79849
      EXPECTED_RUNTIME_FINGERPRINT: 2fd3ebbbebfd7155371fe44664715cbe34f63cfb98dfeb691bba90d4864ca083
      EXPECTED_SOURCE_MANIFEST: 07103a75ce7841cb2ede11cd30a822830cf255f991195eb05391282e6e50ec47
      EXPECTED_MEMORY_SHA: 1c9b784d0a1c8cb8f9245c4c9bc7af6511c55006de5fd3fefa796b1ec438a9b7
      EXPECTED_MEMORY_BYTES: '4497'
      EXPECTED_WRITER_SHA: b9a41499d33d1b5dddc0b9fd2ddc43a324aa9378da8336ef34cab183fa0dc18d
      EXPECTED_FORENSIC_SHA: b0024ea1d8b12f0d89a4bc9163c82139f46d5b7bd3c9ad57e978d910f73b928f
      IDEMPOTENT_GATE_RUN: '32000988800'
      IDEMPOTENT_GATE_JOB: '95301157206'
      TOOL_NAME: vf-forge-v1354-temporary-tool-cleanup-7196915be1dd.php
      PHP_IMAGE: php:8.4-cli-bookworm@sha256:5380a7dd17b978cd14fb2c84cd67ddc47adaf079b240f8138224bbadefae46f7

    steps:
      - name: Require private read credential
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'PRIVATE_READ_CREDENTIAL=PASS'

      - name: Verify exact R4 Gate Authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/$IDEMPOTENT_GATE_RUN")"
          job_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/jobs/$IDEMPOTENT_GATE_JOB")"
          python3 - "$IDEMPOTENT_GATE_RUN" "$IDEMPOTENT_GATE_JOB" "$run_json" "$job_json" <<'PY'
          import json,sys
          rid=int(sys.argv[1]); jid=int(sys.argv[2]); run=json.loads(sys.argv[3]); job=json.loads(sys.argv[4])
          assert run['id']==rid and run['conclusion']=='success'
          assert run['name']=='P03 V1.35.4 Temporary Tool Cleanup Idempotent Gate R4'
          assert job['id']==jid and job['run_id']==rid and job['conclusion']=='success'
          print('IDEMPOTENT_GATE_AUTHORITY=PASS')
          PY

      - name: Checkout exact corrective tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: ${{ env.CORRECTIVE_HEAD }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: corrective

      - name: Checkout Frozen V1.35.4 Product
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: ${{ env.FROZEN_PRODUCT_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: product

      - name: Verify exact source identities
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C corrective rev-parse HEAD)" = "$CORRECTIVE_HEAD"
          test "$(git -C product rev-parse HEAD)" = "$FROZEN_PRODUCT_COMMIT"
          test "$(git -C product rev-parse HEAD^{tree})" = "$EXPECTED_PRODUCT_TREE"
          test -f corrective/scripts/corrective/finalize_v1354_temporary_tool_cleanup_v2.py
          python3 -m py_compile corrective/scripts/corrective/finalize_v1354_temporary_tool_cleanup_v2.py
          echo 'CORRECTIVE_V2_GIT_IDENTITY=PASS'
          echo 'FROZEN_PRODUCT_GIT_IDENTITY=PASS'

      - name: Build exact Frozen Runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf runtime formal secure-out
          mkdir -p runtime formal secure-out
          python3 product/scripts/build_runtime.py runtime >/dev/null
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          s=importlib.util.spec_from_file_location('scope',Path('corrective/scripts/corrective/v1354_source_exact_scope.py'))
          m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          o=m.assert_frozen_runtime(Path('runtime'))
          assert o['runtime_files']==42
          assert o['runtime_fingerprint']=='2fd3ebbbebfd7155371fe44664715cbe34f63cfb98dfeb691bba90d4864ca083'
          assert o['source_manifest_sha256']=='07103a75ce7841cb2ede11cd30a822830cf255f991195eb05391282e6e50ec47'
          assert o['memory_api_bytes']==4497
          assert o['memory_api_sha256']=='1c9b784d0a1c8cb8f9245c4c9bc7af6511c55006de5fd3fefa796b1ec438a9b7'
          print('FROZEN_RUNTIME_IDENTITY=PASS')
          PY

      - name: Generate fixed-name formal Cleanup Tool V2
        id: tool
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 corrective/scripts/corrective/finalize_v1354_temporary_tool_cleanup_v2.py \
            --runtime-root runtime --output-dir formal --filename "$TOOL_NAME" > formal/build-metadata.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('formal/build-metadata.json').read_text())
          p=Path('formal')/'vf-forge-v1354-temporary-tool-cleanup-7196915be1dd.php'; raw=p.read_bytes()
          assert m['format']=='vf-forge-v1354-temporary-tool-cleanup-v2'
          assert m['cleanup_contract']=='IDEMPOTENT_ALREADY_ABSENT_TARGETS'
          assert m['filename']==p.name and len(raw)==m['bytes'] and hashlib.sha256(raw).hexdigest()==m['sha256']
          assert m['product_version']=='1.35.4' and m['schema']==30
          assert m['product_commit']=='af34b84a3135333cf05077b3eb64e22ef6b3afef'
          assert m['product_tree']=='08eee7e8c891a57c357553dd5de20c1a7bd79849'
          assert m['runtime_files']==42
          assert m['runtime_fingerprint']=='2fd3ebbbebfd7155371fe44664715cbe34f63cfb98dfeb691bba90d4864ca083'
          assert m['targets']['vf-forge-v1354-source-reconcile-1ec8566c6838.php']=='b9a41499d33d1b5dddc0b9fd2ddc43a324aa9378da8336ef34cab183fa0dc18d'
          assert m['targets']['vf-forge-v1354-source-forensic-3dc194b1768a.php']=='b0024ea1d8b12f0d89a4bc9163c82139f46d5b7bd3c9ad57e978d910f73b928f'
          assert m['allowed_target_states']==['PRESENT_EXACT','ALREADY_ABSENT']
          assert m['allowed_writes']==['unlink_exact_temporary_targets','unlink_self']
          assert m['product_runtime_write']==0 and m['memory_api_write']==0 and m['db_write']==0 and m['provider_write']==0
          assert m['migration']==0 and m['m030']=='NOT_RERUN'
          print('FORMAL_CLEANUP_V2_IDENTITY=LOCKED')
          print('FILENAME='+p.name)
          print('BYTES='+str(len(raw)))
          print('SHA256='+hashlib.sha256(raw).hexdigest())
          PY

      - name: PHP 8.4 syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm -v "$PWD/formal:/formal:ro" "$PHP_IMAGE" php -l "/formal/$TOOL_NAME"
          echo 'PHP_SYNTAX=PASS'

      - name: Static fail-closed idempotent no-DB gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "formal/$TOOL_NAME" <<'PY'
          from pathlib import Path
          import base64,json,re,sys
          text=Path(sys.argv[1]).read_text()
          for token in ['file_put_contents','fopen(','rename(','copy(','mkdir(','chmod(','touch(','vfab_require_admin(','vfab_require_csrf(','vfab_csrf_token(','vfab_db(','PDO','sqlite:','PRAGMA','admin_sessions','BackupService','MigrationRunner']:
              assert token not in text, token
          assert text.count('unlink(')==2
          for token in ['session_abort()','vftc_same_origin()','CSRF_FAILED','TARGET_SHA_MISMATCH','TARGET_PATH_INVALID','TARGET_IDENTITY_INVALID','FROZEN_RUNTIME_SOURCE_NOT_EXACT','MEMORY_API_NOT_CANONICAL_EXACT','ALREADY_ABSENT','PRESENT_EXACT','already_absent','already absent / safe']:
              assert token in text, token
          assert not re.search(r"['\"]\s*(UPDATE|INSERT|DELETE|ALTER|CREATE|DROP|REPLACE)\b",text,re.I)
          pm=re.search(r"const VFTC_PAYLOAD='([^']+)';",text); assert pm
          payload=json.loads(base64.b64decode(pm.group(1),validate=True))
          assert payload['memory_api_bytes']==4497
          assert payload['memory_api_sha256']=='1c9b784d0a1c8cb8f9245c4c9bc7af6511c55006de5fd3fefa796b1ec438a9b7'
          assert payload['targets']['vf-forge-v1354-source-reconcile-1ec8566c6838.php']=='b9a41499d33d1b5dddc0b9fd2ddc43a324aa9378da8336ef34cab183fa0dc18d'
          assert payload['targets']['vf-forge-v1354-source-forensic-3dc194b1768a.php']=='b0024ea1d8b12f0d89a4bc9163c82139f46d5b7bd3c9ad57e978d910f73b928f'
          assert payload['runtime_files']==42
          assert payload['runtime_fingerprint']=='2fd3ebbbebfd7155371fe44664715cbe34f63cfb98dfeb691bba90d4864ca083'
          assert payload['source_manifest_sha256']=='07103a75ce7841cb2ede11cd30a822830cf255f991195eb05391282e6e50ec47'
          print('FAIL_CLOSED_STATIC=PASS')
          print('IDEMPOTENT_ALREADY_ABSENT=PASS')
          print('NO_SQLITE_OPEN=PASS')
          print('ONLY_ALLOWED_UNLINK_WRITES=PASS')
          PY

      - name: Encrypt Cleanup Tool with ephemeral sandbox public key
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > secure-out/recipient-public.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAnpKEOomEDeT2oy3axSvw
          v6ezx8M2a7+I/HHlbeAJ6wUHwSrsxFterhmrRB+LcnrvNy5bNEpTRxUcrW36JO0W
          VQ7fD4ET791NSLQRoaYY+fayL8tXYZgIZEunPbeNz6YYrd3obQentcIf3677AU+W
          7sPDeeF2pNu8uH39GeI5Th3vxyrObGT8f8HvvyBLKl9IL9ddplE6m5MSQQh+kIH9
          mBL7WTonPmbw9+0nYwaYe1PYglxoBfIp0XpqOAm/SXm0He2JmMbD2DqxRnybAF7R
          3CJAVZCyM57Xj4ZER8mK3K1zkXS9Q4k/S4z7Oi4w7v1RhYS8wIbnAbOlOZepQcsM
          dVSTmJFZlAaBOZCwssGRuKjHklT7AY0DB6KsqB4qreSKekTpaM7QoQ8JuAf+J7qk
          KNxVqY5ehC3yW8C6pKELINbtaG4saD3ZVIndK+Y6JMVw5K6Ar0hr2vS5cDiG/vh5
          bKycBCZnwloMajSTYMqXJM5RUBaKOLU8a8mzOW5K33VlAgMBAAE=
          -----END PUBLIC KEY-----
          EOF
          openssl rand 32 > secure-out/aes.key
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -pass file:secure-out/aes.key -in "formal/$TOOL_NAME" -out secure-out/cleanup.php.enc
          openssl pkeyutl -encrypt -pubin -inkey secure-out/recipient-public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in secure-out/aes.key -out secure-out/aes.key.rsa
          cp formal/build-metadata.json secure-out/build-metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('secure-out/build-metadata.json'); m=json.loads(p.read_text())
          m.update({
            'php_syntax':'PASS',
            'idempotent_gate_run':32000988800,
            'idempotent_gate_job':95301157206,
            'idempotent_gate':'PASS',
            'fail_closed_static':'PASS',
            'idempotent_already_absent':'PASS',
            'no_sqlite_open':'PASS',
            'encrypted_bridge':'RSA_OAEP_SHA256_PLUS_AES256_CBC_PBKDF2',
            'public_artifact_contains_plaintext':False,
            'db_sidecar_write':0,
            'migration':'NOT_EXECUTED',
            'main_promotion':'NOT_EXECUTED',
            'v1_35_5':'NOT_CREATED'
          })
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          sha256sum secure-out/cleanup.php.enc secure-out/aes.key.rsa secure-out/build-metadata.json > secure-out/ENCRYPTED_SHA256SUMS.txt
          shred -u secure-out/aes.key
          shred -u "formal/$TOOL_NAME"
          rm -f secure-out/recipient-public.pem
          test ! -e "formal/$TOOL_NAME"
          test ! -e secure-out/aes.key
          echo 'PUBLIC_RUNNER_PLAINTEXT=0'

      - name: Upload encrypted cleanup artifact only
        uses: actions/upload-artifact@v4
        with:
          name: P03_V1.35.4_PRODUCTION_TEMPORARY_CLEANUP_TOOL_V2_ENCRYPTED
          path: |
            secure-out/cleanup.php.enc
            secure-out/aes.key.rsa
            secure-out/build-metadata.json
            secure-out/ENCRYPTED_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Final public plaintext zero verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -e "formal/$TOOL_NAME"
          test ! -e secure-out/aes.key
          test ! -e secure-out/recipient-public.pem
          test -f secure-out/cleanup.php.enc
          test -f secure-out/aes.key.rsa
          echo 'GENERATION_V2=PASS'
          echo 'R4_GATE=PASS'
          echo 'PUBLIC_PLAINTEXT=0'
          echo 'PRODUCT_RUNTIME_WRITE=0'
          echo 'MEMORY_API_WRITE=0'
          echo 'PRODUCTION_DB_WRITE=0'
          echo 'PROVIDER_WRITE=0'
          echo 'MIGRATION=NOT_EXECUTED'
          echo 'M030=NOT_RERUN'
          echo 'MAIN_PROMOTION=NOT_EXECUTED'
          echo 'V1.35.5=NOT_CREATED'
