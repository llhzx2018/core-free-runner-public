name: P03 V1.35.1 Bridge Material Hashes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p03-v1351-bridge-material-hashes.yml'

permissions:
  contents: read

jobs:
  hashes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Exact private bridge checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: f1b307454a91ad44672af8b58879f6567d880224
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 2
          path: p03
      - name: Guard scope and print only SHA-256 metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p03 rev-parse HEAD)" = 'f1b307454a91ad44672af8b58879f6567d880224'
          changed="$(git -C p03 diff --name-only HEAD^..HEAD)"
          expected=$'src/app/CoreUpdates/GitHubClient.php\nsrc/app/CoreUpdates/UpdateCore.php\nsrc/app/UpdateService.php'
          test "$changed" = "$expected"
          for f in \
            src/app/UpdateService.php \
            src/app/CoreUpdates/GitHubClient.php \
            src/app/CoreUpdates/UpdateCore.php; do
            test -f "p03/$f"
            printf '%s\t%s\t%s\n' "$f" "$(stat -c %s "p03/$f")" "$(sha256sum "p03/$f" | awk '{print $1}')"
          done
          echo 'P03_BRIDGE_MATERIAL_HASHES_PASS'
      - name: Cleanup private checkout
        if: always()
        run: rm -rf p03