name: P03 Release Token Capability Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/p03/token-check/**'
      - '.github/workflows/p03-release-token-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check existing release credential capability without writes
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [ -z "$RELEASE_TOKEN" ]; then
            echo 'VF_RELEASE_WRITE_TOKEN_AVAILABLE=NO'
            exit 2
          fi
          code=$(curl -sS -o "$RUNNER_TEMP/repo.json" -w '%{http_code}' \
            -H "Authorization: Bearer $RELEASE_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/llhzx2018/vf-forge)
          test "$code" = '200'
          python3 - "$RUNNER_TEMP/repo.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          p=d.get('permissions') or {}
          print('VF_RELEASE_WRITE_TOKEN_AVAILABLE=YES')
          print('VF_FORGE_PUSH_PERMISSION='+('YES' if p.get('push') else 'NO'))
          print('VF_FORGE_ADMIN_PERMISSION='+('YES' if p.get('admin') else 'NO'))
          PY
