name: P03 V1.36.2 Settings Performance Release

on:
  pull_request:
    branches: [main]
    paths:
      - 'evidence/p03-v1362-settings-performance/release-trigger.txt'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Execute P03 V1.36.2 settings performance release harness
        shell: bash
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: bash .github/scripts/p03-v1362-settings-performance-release.sh
      - name: Upload public-safe release evidence
        uses: actions/upload-artifact@v4
        with:
          name: P03-V1.36.2-SETTINGS-PERFORMANCE-RELEASE-EVIDENCE
          path: p03-v1362-release-evidence
          if-no-files-found: error
          retention-days: 30
