name: P03 V1.35.1 Discovery Bridge Solidify

on:
  push:
    branches: [main]
    paths: ['.github/workflows/p03-v1351-discovery-bridge-solidify.yml']

permissions:
  contents: read

jobs:
  solidify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRODUCT_REPOSITORY: llhzx2018/vf-forge
      PRODUCTION_HEAD: 57781a2613269f5308dfe183d84ad4575279cdd5
      CANDIDATE_HEAD: ee3cabb849ac8820d5d69a68bf15830739f270ce
      BRIDGE_BRANCH: bridge/p03-v1.35.1-core-updates-20260816
      VERIFIED_RUN: '31895875604'
    steps:
      - name: Require verified Bridge gates and unified credentials
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"; test -n "$WRITE_TOKEN"
          JOBS=$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$VERIFIED_RUN/jobs)
          for name in \
            'Require unified zero-cost credentials' \
            'Exact Production source checkout' \
            'Exact Candidate reader source checkout' \
            'Lock exact Bridge scope' \
            'Prepare PHP 8.4 bridge runtime with GitHub cURL reader' \
            'Build exact same-version Bridge runtime' \
            'Same-version Bridge failure rollback rehearsal' \
            'Install synthetic V1.35.1 bridge fixture' \
            'Missing and invalid credential Fail-Closed' \
            'Real core-updates and Release discovery from synthetic Production'; do
              test "$(printf '%s' "$JOBS" | jq -r --arg n "$name" '.jobs[0].steps[] | select(.name==$n) | .conclusion')" = success
          done
          echo 'VERIFIED_BRIDGE_GATES_BOUND=PASS'

      - name: Exact Production checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: 57781a2613269f5308dfe183d84ad4575279cdd5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: production

      - name: Exact verified Reader checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: ee3cabb849ac8820d5d69a68bf15830739f270ce
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: candidate

      - name: Create exact three-file same-version Bridge commit
        shell: bash
        working-directory: production
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCTION_HEAD"
          test "$(cat VERSION)" = '1.35.1'
          grep -Fq "define('VFAB_VERSION', '1.35.1');" src/app/bootstrap.php
          grep -Fq "define('VFAB_SCHEMA_VERSION', 29);" src/app/bootstrap.php
          mkdir -p src/app/CoreUpdates
          cp ../candidate/src/app/UpdateService.php src/app/UpdateService.php
          cp ../candidate/src/app/CoreUpdates/GitHubClient.php src/app/CoreUpdates/GitHubClient.php
          cp ../candidate/src/app/CoreUpdates/UpdateCore.php src/app/CoreUpdates/UpdateCore.php
          test -z "$(git diff -- database src/app/bootstrap.php VERSION public assets tests scripts || true)"
          CHANGED=$(git status --porcelain -uall | awk '{print $2}' | sort)
          EXPECTED=$(printf '%s\n' src/app/CoreUpdates/GitHubClient.php src/app/CoreUpdates/UpdateCore.php src/app/UpdateService.php | sort)
          if [ "$CHANGED" != "$EXPECTED" ]; then printf 'changed:\n%s\nexpected:\n%s\n' "$CHANGED" "$EXPECTED" >&2; exit 81; fi
          git config user.name 'VF Release Automation'
          git config user.email 'vf-release-automation@users.noreply.github.com'
          git add src/app/UpdateService.php src/app/CoreUpdates/GitHubClient.php src/app/CoreUpdates/UpdateCore.php
          test "$(git diff --cached --name-only | sort)" = "$EXPECTED"
          git diff --cached --check
          git commit -m 'chore(bridge): add P03 V1.35.1 core-updates discovery compatibility'
          BRIDGE_HEAD=$(git rev-parse HEAD)
          gh auth setup-git
          git push https://github.com/$PRODUCT_REPOSITORY.git "HEAD:refs/heads/$BRIDGE_BRANCH"
          echo "P03_DISCOVERY_BRIDGE_HEAD=$BRIDGE_HEAD"
          echo 'PRIVATE_BRIDGE_COMMIT=PASS'

      - name: Remote exact Bridge readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          BRIDGE_HEAD=$(git -C production rev-parse HEAD)
          REMOTE=$(gh api "repos/$PRODUCT_REPOSITORY/git/ref/heads/$BRIDGE_BRANCH" --jq .object.sha)
          test "$REMOTE" = "$BRIDGE_HEAD"
          FILES=$(gh api "repos/$PRODUCT_REPOSITORY/compare/$PRODUCTION_HEAD...$BRIDGE_HEAD" --jq '.files[].filename' | sort)
          EXPECTED=$(printf '%s\n' src/app/CoreUpdates/GitHubClient.php src/app/CoreUpdates/UpdateCore.php src/app/UpdateService.php | sort)
          test "$FILES" = "$EXPECTED"
          VERSION_REMOTE=$(gh api "repos/$PRODUCT_REPOSITORY/contents/VERSION?ref=$BRIDGE_HEAD" -H 'Accept: application/vnd.github.raw+json' | tr -d '\r\n')
          BOOTSTRAP=$(gh api "repos/$PRODUCT_REPOSITORY/contents/src/app/bootstrap.php?ref=$BRIDGE_HEAD" -H 'Accept: application/vnd.github.raw+json')
          test "$VERSION_REMOTE" = '1.35.1'
          grep -Fq "define('VFAB_VERSION', '1.35.1');" <<<"$BOOTSTRAP"
          grep -Fq "define('VFAB_SCHEMA_VERSION', 29);" <<<"$BOOTSTRAP"
          MAIN=$(gh api "repos/$PRODUCT_REPOSITORY/branches/main" --jq .commit.sha)
          test "$MAIN" = "$PRODUCTION_HEAD"
          echo "P03_DISCOVERY_BRIDGE_HEAD=$BRIDGE_HEAD"
          echo 'BRIDGE_REMOTE_DIFF=3_FILES_EXACT'
          echo 'BRIDGE_VERSION=1.35.1'
          echo 'BRIDGE_SCHEMA=29'
          echo 'MAIN_UNCHANGED=PASS'
          echo 'P03_V1.35.1_DISCOVERY_BRIDGE_SOLIDIFIED=PASS'
