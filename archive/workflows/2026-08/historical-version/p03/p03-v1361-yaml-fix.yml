name: P03 V1.36.1 Backend Polish Release

on:
  pull_request:
    branches: [main]
    paths:
      - 'evidence/p03-v1361-polish/release-trigger.txt'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Execute P03 V1.36.1 backend polish release harness
        shell: bash
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/p03-v1361-backend-polish-release.sh')
          s=p.read_text(encoding='utf-8')
          s=s.replace("#generalSettingsForm button[type=\"submit\"]","#generalSettingsForm .button.primary")
          s=s.replace("#backupSettingsForm button[type=\"submit\"]","#backupSettingsForm .button.primary")
          s=s.replace("await p.click(`[data-route=\"${route}\"]`);await p.waitForTimeout(120);","await p.locator(`[data-route=\"${route}\"]:visible`).first().click();await p.waitForTimeout(120);")
          p.write_text(s,encoding='utf-8')
          PY
          bash .github/scripts/p03-v1361-backend-polish-release.sh
      - name: Upload public-safe release evidence
        uses: actions/upload-artifact@v4
        with:
          name: P03-V1.36.1-BACKEND-POLISH-RELEASE-EVIDENCE
          path: p03-v1361-release-evidence
          if-no-files-found: error
          retention-days: 30
