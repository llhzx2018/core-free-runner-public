name: P03 V1.35.2 Formal Release Remote Readback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p03-v1352-release-readback.yml']
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REPOSITORY: llhzx2018/vf-forge
      TAG: v1.35.2
      CANDIDATE_HEAD: ee3cabb849ac8820d5d69a68bf15830739f270ce
      PRODUCTION_HEAD: 57781a2613269f5308dfe183d84ad4575279cdd5
      UPDATE_ASSET: VF_Forge_V1.35.2_UPDATE.zip
      EXPECT_UPDATE_BYTES: '707142'
      EXPECT_UPDATE_SHA256: 6b2f88cdc5f8d4352c124deef14896ddf52e46731916c3825b7cf8cf3112817a
    steps:
      - name: Require private read credential
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'READ_CREDENTIAL=PASS'
      - name: Formal Tag peeled commit readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          REF=$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
          TYPE=$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq .object.type)
          if [ "$TYPE" = tag ]; then PEELED=$(gh api "repos/$REPOSITORY/git/tags/$REF" --jq .object.sha); else PEELED="$REF"; fi
          test "$PEELED" = "$CANDIDATE_HEAD"
          echo "FORMAL_TAG_OBJECT=$REF"
          echo "FORMAL_TAG_PEELED_COMMIT=$PEELED"
          echo 'FORMAL_TAG_REMOTE_READBACK=PASS'
      - name: Release identity and asset metadata readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          TAG_NAME=$(gh api "repos/$REPOSITORY/releases/tags/$TAG" --jq .tag_name)
          DRAFT=$(gh api "repos/$REPOSITORY/releases/tags/$TAG" --jq .draft)
          PRE=$(gh api "repos/$REPOSITORY/releases/tags/$TAG" --jq .prerelease)
          PUBLISHED=$(gh api "repos/$REPOSITORY/releases/tags/$TAG" --jq .published_at)
          COUNT=$(gh api "repos/$REPOSITORY/releases/tags/$TAG" --jq '.assets | length')
          test "$TAG_NAME" = "$TAG"
          test "$DRAFT" = false
          test "$PRE" = false
          test -n "$PUBLISHED" -a "$PUBLISHED" != null
          test "$COUNT" = 6
          ASSET=$(gh api "repos/$REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name=="VF_Forge_V1.35.2_UPDATE.zip")')
          BYTES=$(printf '%s' "$ASSET" | jq -r .size)
          DIGEST=$(printf '%s' "$ASSET" | jq -r .digest)
          test "$BYTES" = "$EXPECT_UPDATE_BYTES"
          test "$DIGEST" = "sha256:$EXPECT_UPDATE_SHA256"
          echo "RELEASE_PUBLISHED_AT=$PUBLISHED"
          echo "REMOTE_UPDATE_BYTES=$BYTES"
          echo "REMOTE_UPDATE_SHA256=$EXPECT_UPDATE_SHA256"
          echo 'RELEASE_ASSET_METADATA_READBACK=PASS'
      - name: Download exact UPDATE and verify bytes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/release-readback"
          gh release download "$TAG" --repo "$REPOSITORY" --pattern "$UPDATE_ASSET" --dir "$RUNNER_TEMP/release-readback"
          P="$RUNNER_TEMP/release-readback/$UPDATE_ASSET"
          test "$(stat -c %s "$P")" = "$EXPECT_UPDATE_BYTES"
          test "$(sha256sum "$P" | awk '{print $1}')" = "$EXPECT_UPDATE_SHA256"
          unzip -t "$P"
          test "$(unzip -Z1 "$P")" = 'repair-v1.35.2.php'
          echo 'REMOTE_UPDATE_DOWNLOAD_VERIFY=PASS'
      - name: Branch and privacy closure
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          DEVELOP=$(gh api "repos/$REPOSITORY/branches/develop" --jq .commit.sha)
          MAIN=$(gh api "repos/$REPOSITORY/branches/main" --jq .commit.sha)
          test "$DEVELOP" = "$CANDIDATE_HEAD"
          test "$MAIN" = "$PRODUCTION_HEAD"
          echo 'MAIN_REMAINS_PRODUCTION_TRUTH=PASS'
          echo 'PUBLIC_SOURCE_ARTIFACT=0'
          echo 'PRIVATE_DATA_ARTIFACT=0'
          echo 'P03_V1.35.2_FORMAL_RELEASE_REMOTE_READBACK=PASS'
