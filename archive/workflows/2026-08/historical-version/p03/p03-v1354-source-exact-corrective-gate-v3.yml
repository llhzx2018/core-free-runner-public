name: P03 V1.35.4 Source Exact Corrective Gate V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p03-v1354-source-exact-corrective-gate-v3.yml'
      - 'scripts/p03_v1354_source_exact_corrective_gate_v2.sh'
      - 'scripts/p03_v1354_source_exact_corrective_gate_v3.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: p03-v1354-source-exact-corrective-gate-v3
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CORRECTIVE_BRANCH: repair/v1.35.4-source-exact-reconcile
      FROZEN_PRODUCT_COMMIT: af34b84a3135333cf05077b3eb64e22ef6b3afef
      PRODUCTION_COMMIT: 263c4d8f7e38bff58db5680a6845ceb5a576d6ae
      FIXTURE_PASS: VfP03-Source-Exact-2026!
      PHP_TEST_IMAGE: vf-forge-v1354-source-exact-php84
      GATE_ROOT: /tmp/p03-v1354-source-exact-v3

    steps:
      - name: Checkout public harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: main
          fetch-depth: 1
          persist-credentials: false
          path: harness

      - name: Require private read credential
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'PRIVATE_READ_CREDENTIAL=PASS'

      - name: Checkout corrective tooling branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: ${{ env.CORRECTIVE_BRANCH }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: corrective

      - name: Checkout Frozen V1.35.4 Product
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: ${{ env.FROZEN_PRODUCT_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: product

      - name: Checkout exact V1.35.3 Production source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: ${{ env.PRODUCTION_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: production

      - name: Build supported PHP 8.4 fixture runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 sqlite3 curl >/dev/null
          cat >"$RUNNER_TEMP/Dockerfile.p03-source-exact" <<'EOF'
          FROM php:8.4-cli-bookworm@sha256:5380a7dd17b978cd14fb2c84cd67ddc47adaf079b240f8138224bbadefae46f7
          ARG HOST_UID=1001
          ARG HOST_GID=121
          RUN apt-get update \
            && apt-get install -y --no-install-recommends libzip-dev libsqlite3-dev libcurl4-openssl-dev sqlite3 \
            && docker-php-ext-install zip pdo_sqlite curl \
            && rm -rf /var/lib/apt/lists/*
          USER ${HOST_UID}:${HOST_GID}
          EOF
          docker build --build-arg "HOST_UID=$(id -u)" --build-arg "HOST_GID=$(id -g)" -t "$PHP_TEST_IMAGE" -f "$RUNNER_TEMP/Dockerfile.p03-source-exact" "$RUNNER_TEMP" >/dev/null
          docker run --rm "$PHP_TEST_IMAGE" php -r 'foreach(["pdo_sqlite","sqlite3","zip","curl","fileinfo","sodium"] as $x){if(!extension_loaded($x)){exit(1);}} echo PHP_VERSION," SOURCE_EXACT_PHP84_PASS\n";'

      - name: Execute exact 41-to-42 corrective gate
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x harness/scripts/p03_v1354_source_exact_corrective_gate_v3.sh
          bash -n harness/scripts/p03_v1354_source_exact_corrective_gate_v3.sh
          bash harness/scripts/p03_v1354_source_exact_corrective_gate_v3.sh

      - name: Verify zero public artifacts and cleanup
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          docker rm -f p03-source-exact-18134 p03-source-exact-18135 p03-source-exact-18136 >/dev/null 2>&1 || true
          rm -rf corrective product production /tmp/p03-v1354-source-exact-v3 "$RUNNER_TEMP/Dockerfile.p03-source-exact" "$RUNNER_TEMP/p03_v1354_source_exact_corrective_gate_v3.sh"
          RESP=$(curl -fsS -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts")
          test "$(python3 -c 'import json,sys;print(json.load(sys.stdin)["total_count"])' <<<"$RESP")" = 0
          echo 'PUBLIC_ACTIONS_ARTIFACTS=0'
          echo 'EPHEMERAL_CLEANUP=PASS'

      - name: Final verdict
        shell: bash
        run: |
          echo 'P03_V1354_SOURCE_EXACT_CORRECTIVE_GATE_V3=PASS'
          echo 'SAFE_SAME_VERSION_RECONCILIATION=VERIFIED_IN_RUNNER'
          echo 'CURRENT_NATIVE_MANUAL_TRANSPORT=SAME_VERSION_UNSUPPORTED'
          echo 'PRODUCTION_WRITE=0'
          echo 'MAIN_PROMOTION=NOT_EXECUTED'
          echo 'M030_PRODUCTION=NOT_RERUN'
          echo 'PHYSICAL_DELETE=0'
          echo 'V1.35.5=NOT_CREATED'
          echo 'NEXT=STOP_FOR_MASTER_SAFE_EXECUTION_CHANNEL_DECISION'
