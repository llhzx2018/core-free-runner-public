name: P03 V1.35.4 Distribution Repair R1 Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p03-v1354-dist-r1-release.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: p03-v1354-dist-r1-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DIST_BUILD_COMMIT: 1c9993ae94566a6b83c8bd53e71b01761aa37f59
      DIST_BUILD_TREE: 7a216956ef6fb81aee2de08b55c4275af91323a9
      FROZEN_PRODUCT_COMMIT: af34b84a3135333cf05077b3eb64e22ef6b3afef
      FROZEN_PRODUCT_TREE: 08eee7e8c891a57c357553dd5de20c1a7bd79849
      PRODUCTION_COMMIT: 263c4d8f7e38bff58db5680a6845ceb5a576d6ae
      ORIGINAL_RELEASE_ID: '371488636'
      ORIGINAL_UPDATE_ASSET_ID: '517455108'
      ORIGINAL_UPDATE_SHA256: c063d99e8ab99b86da345599c8db2f27d961b3565df94daafd203e867d8c8073
      ORIGINAL_REPAIR_SHA256: 36117f9b9b58e7d5e509edb19f1f6f4411cd5826e96e8602e900268bb421f832
      TAG: v1.35.4-dist-r1
      RELEASE_NAME: VF Forge V1.35.4 Distribution Repair R1
      BUILD_ROOT: /tmp/p03-v1354-dist-r1-release

    steps:
      - name: Checkout exact Distribution Build Commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: ${{ env.DIST_BUILD_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: distribution

      - name: Checkout exact Production V1.35.3 parser
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: ${{ env.PRODUCTION_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: production

      - name: Require read and release credentials
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$RELEASE_TOKEN"
          echo 'PRIVATE_READ_CREDENTIAL=PASS'
          echo 'RELEASE_WRITE_CREDENTIAL=PASS'

      - name: Prepare acceptance runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-zip unzip >/dev/null
          php -r 'if(!class_exists("ZipArchive")){exit(1);} echo "N_MINUS_1_RUNTIME=PASS\n";'

      - name: Rebuild deterministic corrective distribution
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C distribution rev-parse HEAD)" = "$DIST_BUILD_COMMIT"
          test "$(git -C distribution rev-parse HEAD^{tree})" = "$DIST_BUILD_TREE"
          test "$(git -C production rev-parse HEAD)" = "$PRODUCTION_COMMIT"
          rm -rf "$BUILD_ROOT"; mkdir -p "$BUILD_ROOT"
          ORIGINAL="$BUILD_ROOT/original-update.zip"
          gh api -H 'Accept: application/octet-stream' "/repos/llhzx2018/vf-forge/releases/assets/$ORIGINAL_UPDATE_ASSET_ID" > "$ORIGINAL"
          test "$(sha256sum "$ORIGINAL"|awk '{print $1}')" = "$ORIGINAL_UPDATE_SHA256"
          test "$(unzip -p "$ORIGINAL" repair-v1.35.4.php | sha256sum | awk '{print $1}')" = "$ORIGINAL_REPAIR_SHA256"
          python3 distribution/scripts/distribution/build_v1354_dist_r1.py --original-update "$ORIGINAL" --output "$BUILD_ROOT/a" --distribution-build-commit "$DIST_BUILD_COMMIT" --distribution-build-tree "$DIST_BUILD_TREE" > "$BUILD_ROOT/a.json"
          python3 distribution/scripts/distribution/build_v1354_dist_r1.py --original-update "$ORIGINAL" --output "$BUILD_ROOT/b" --distribution-build-commit "$DIST_BUILD_COMMIT" --distribution-build-tree "$DIST_BUILD_TREE" > "$BUILD_ROOT/b.json"
          python3 - "$BUILD_ROOT/a" "$BUILD_ROOT/b" <<'PY'
          import hashlib,sys
          from pathlib import Path
          a=Path(sys.argv[1]); b=Path(sys.argv[2])
          expected={
            'repair-v1.35.4.php':(1024697,'de1b0eeed2d73474bd9a0332b3f09c024d530067589060d71beb99ae2f4e882c'),
            'VF_Forge_V1.35.4_UPDATE_DIST_R1.zip':(766304,'dcc784332669ae4c2dc5ec9bc723cdc174c631b6ea2dc8c9d87ae28135a52141'),
            'VF_Forge_V1.35.4_Atomic_Upgrade_DIST_R1.zip':(766304,'dcc784332669ae4c2dc5ec9bc723cdc174c631b6ea2dc8c9d87ae28135a52141'),
            'VF_Forge_V1.35.4_DISTRIBUTION_REPAIR_R1_MANIFEST.json':(2076,'2c301c10917d855585c740f3b66f0bbb7dcbae8a6c8cccd152985f108da75ac4'),
            'VF_Forge_V1.35.4_DISTRIBUTION_REPAIR_R1_NOTES.md':(963,'c396ffdcd082d8bd90f13bf5501b62bb435c1aac0a87f43fc383e63b21a96c2e'),
            'SHA256SUMS_DIST_R1.txt':(532,'8af4609fc4011519fbf8cc0b1766603c5d1b3e60355c3532fea416b0c7fc284b')}
          assert {p.name for p in a.iterdir() if p.is_file()}==set(expected)
          assert {p.name for p in b.iterdir() if p.is_file()}==set(expected)
          for n,(size,sha) in expected.items():
              da=(a/n).read_bytes(); db=(b/n).read_bytes(); assert da==db,n; assert len(da)==size,n; assert hashlib.sha256(da).hexdigest()==sha,n
          assert (a/'VF_Forge_V1.35.4_UPDATE_DIST_R1.zip').read_bytes()==(a/'VF_Forge_V1.35.4_Atomic_Upgrade_DIST_R1.zip').read_bytes()
          print('CORRECTIVE_RELEASE_IDENTITY_EXACT=PASS assets=6 A_B=PASS UPDATE_EQ_ATOMIC=PASS')
          PY
          python3 distribution/scripts/distribution/production_n_minus_1_update_acceptance_gate.py --parser production/src/app/ManualUpdateService.php --update "$BUILD_ROOT/a/VF_Forge_V1.35.4_UPDATE_DIST_R1.zip"
          echo 'PRE_RELEASE_N_MINUS_1_ACCEPTANCE=PASS'

      - name: Create corrective tag release and upload assets
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          API='https://api.github.com/repos/llhzx2018/vf-forge'
          AUTH=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $RELEASE_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28')
          CODE=$(curl -sS -o /tmp/dist-tag-before.json -w '%{http_code}' "${AUTH[@]}" "$API/git/ref/tags/$TAG")
          test "$CODE" = 404 || { echo 'CORRECTIVE_TAG_ALREADY_EXISTS_BLOCK'; exit 90; }
          CODE=$(curl -sS -o /tmp/dist-release-before.json -w '%{http_code}' "${AUTH[@]}" "$API/releases/tags/$TAG")
          test "$CODE" = 404 || { echo 'CORRECTIVE_RELEASE_ALREADY_EXISTS_BLOCK'; exit 91; }
          python3 - <<'PY' >/tmp/dist-tag-create.json
          import json,os
          print(json.dumps({'ref':'refs/tags/'+os.environ['TAG'],'sha':os.environ['DIST_BUILD_COMMIT']}))
          PY
          curl -fsS "${AUTH[@]}" -H 'Content-Type: application/json' -X POST --data-binary @/tmp/dist-tag-create.json "$API/git/refs" >/tmp/dist-tag-created.json
          python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/dist-tag-created.json'));assert d['ref']=='refs/tags/'+os.environ['TAG'];assert d['object']['sha']==os.environ['DIST_BUILD_COMMIT'];print('CORRECTIVE_TAG_CREATE=PASS '+d['object']['sha'])
          PY
          cat >/tmp/dist-release-body.md <<'EOF'
          # VF Forge V1.35.4 Distribution Repair R1

          此对象是 V1.35.4 的 Corrective Distribution Object，不是新的 Product Version。

          修复范围仅为 V1.35.3 Production Update Acceptance 兼容合同：正式 Repair 增加 `const VFF_ATOMIC_ALLOWED=["1.35.3"];`。

          Product Version 仍为 1.35.4；Schema 仍为 30；Migration 仍为 M030_EXTERNAL_AUTHORITY_MEMORY_INDEX；Frozen Product Runtime、Two-request Executor 与 42-file Runtime Payload 不变。

          原 `v1.35.4` Product Release / Release ID 371488636 保持历史不可修改；Canonical FULL 继续仅来自原 Product Release。本 Corrective Release 不包含 FULL。

          core-updates 在本 Release 完成后仍保持 enabled=false / QUARANTINED，等待 Master 独立回读与 Re-enable Authorization。Production 保持 V1.35.3 / Schema 29，本 Release 不执行 Production 写入。
          EOF
          python3 - <<'PY' >/tmp/dist-release-create.json
          import json,os
          print(json.dumps({'tag_name':os.environ['TAG'],'target_commitish':os.environ['DIST_BUILD_COMMIT'],'name':os.environ['RELEASE_NAME'],'body':open('/tmp/dist-release-body.md',encoding='utf-8').read(),'draft':False,'prerelease':False},ensure_ascii=False))
          PY
          curl -fsS "${AUTH[@]}" -H 'Content-Type: application/json' -X POST --data-binary @/tmp/dist-release-create.json "$API/releases" >/tmp/dist-release-created.json
          RID=$(python3 -c "import json,os;d=json.load(open('/tmp/dist-release-created.json'));assert d['tag_name']==os.environ['TAG'] and d['name']==os.environ['RELEASE_NAME'] and not d['draft'] and not d['prerelease'];print(d['id'])")
          echo "CORRECTIVE_RELEASE_ID=$RID" >> "$GITHUB_ENV"
          ROOT="$BUILD_ROOT/a"
          for F in repair-v1.35.4.php VF_Forge_V1.35.4_UPDATE_DIST_R1.zip VF_Forge_V1.35.4_Atomic_Upgrade_DIST_R1.zip VF_Forge_V1.35.4_DISTRIBUTION_REPAIR_R1_MANIFEST.json VF_Forge_V1.35.4_DISTRIBUTION_REPAIR_R1_NOTES.md SHA256SUMS_DIST_R1.txt; do
            case "$F" in *.zip) CT='application/zip';; *.json) CT='application/json';; *.md) CT='text/markdown';; *.php) CT='application/x-php';; *) CT='text/plain';; esac
            curl -fsS "${AUTH[@]}" -H "Content-Type: $CT" --data-binary "@$ROOT/$F" "https://uploads.github.com/repos/llhzx2018/vf-forge/releases/$RID/assets?name=$F" >"/tmp/dist-asset-$F.json"
            python3 - "$F" <<'PY'
          import json,sys
          f=sys.argv[1];d=json.load(open('/tmp/dist-asset-'+f+'.json'));assert d['name']==f and d['state']=='uploaded' and int(d['id'])>0;print('CORRECTIVE_ASSET_UPLOAD',d['id'],d['name'],d['size'],d.get('digest',''))
          PY
          done
          echo "CORRECTIVE_RELEASE_CREATE_UPLOAD=PASS id=$RID assets=6"

      - name: Remote exact readback and remote N-1 acceptance
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          API='https://api.github.com/repos/llhzx2018/vf-forge'
          AUTH=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $RELEASE_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28')
          curl -fsS "${AUTH[@]}" "$API/git/ref/tags/$TAG" >/tmp/dist-tag-readback.json
          curl -fsS "${AUTH[@]}" "$API/releases/tags/$TAG" >/tmp/dist-release-readback.json
          python3 - <<'PY'
          import json,os
          tag=json.load(open('/tmp/dist-tag-readback.json'));rel=json.load(open('/tmp/dist-release-readback.json'))
          assert tag['object']['sha']==os.environ['DIST_BUILD_COMMIT']
          assert rel['id']==int(os.environ['CORRECTIVE_RELEASE_ID']) and rel['tag_name']==os.environ['TAG'] and rel['name']==os.environ['RELEASE_NAME'] and not rel['draft'] and not rel['prerelease']
          expected={
            'repair-v1.35.4.php':(1024697,'de1b0eeed2d73474bd9a0332b3f09c024d530067589060d71beb99ae2f4e882c'),
            'VF_Forge_V1.35.4_UPDATE_DIST_R1.zip':(766304,'dcc784332669ae4c2dc5ec9bc723cdc174c631b6ea2dc8c9d87ae28135a52141'),
            'VF_Forge_V1.35.4_Atomic_Upgrade_DIST_R1.zip':(766304,'dcc784332669ae4c2dc5ec9bc723cdc174c631b6ea2dc8c9d87ae28135a52141'),
            'VF_Forge_V1.35.4_DISTRIBUTION_REPAIR_R1_MANIFEST.json':(2076,'2c301c10917d855585c740f3b66f0bbb7dcbae8a6c8cccd152985f108da75ac4'),
            'VF_Forge_V1.35.4_DISTRIBUTION_REPAIR_R1_NOTES.md':(963,'c396ffdcd082d8bd90f13bf5501b62bb435c1aac0a87f43fc383e63b21a96c2e'),
            'SHA256SUMS_DIST_R1.txt':(532,'8af4609fc4011519fbf8cc0b1766603c5d1b3e60355c3532fea416b0c7fc284b')}
          assets={a['name']:a for a in rel['assets']};assert set(assets)==set(expected)
          for n,(size,sha) in expected.items():
              a=assets[n];assert a['state']=='uploaded' and a['size']==size and a.get('digest')=='sha256:'+sha,(n,a.get('digest'))
              print('REMOTE_DIST_ASSET',a['id'],n,a['size'],a.get('digest'))
          print('CORRECTIVE_REMOTE_READBACK=PASS release_id='+str(rel['id']))
          print('REMOTE_UPDATE_ASSET_ID='+str(assets['VF_Forge_V1.35.4_UPDATE_DIST_R1.zip']['id']))
          open('/tmp/remote-update-id','w').write(str(assets['VF_Forge_V1.35.4_UPDATE_DIST_R1.zip']['id']))
          PY
          UAID=$(cat /tmp/remote-update-id)
          curl -fsSL "${AUTH[@]}" -H 'Accept: application/octet-stream' "$API/releases/assets/$UAID" -o /tmp/remote-update-dist-r1.zip
          test "$(stat -c%s /tmp/remote-update-dist-r1.zip)" = 766304
          test "$(sha256sum /tmp/remote-update-dist-r1.zip|awk '{print $1}')" = dcc784332669ae4c2dc5ec9bc723cdc174c631b6ea2dc8c9d87ae28135a52141
          python3 distribution/scripts/distribution/production_n_minus_1_update_acceptance_gate.py --parser production/src/app/ManualUpdateService.php --update /tmp/remote-update-dist-r1.zip
          echo 'REMOTE_N_MINUS_1_ACCEPTANCE=PASS'
          curl -fsS "${AUTH[@]}" "$API/releases/$ORIGINAL_RELEASE_ID" >/tmp/original-release-after.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/original-release-after.json'));assert d['id']==371488636 and d['tag_name']=='v1.35.4'
          a={x['name']:x for x in d['assets']};assert a['VF_Forge_V1.35.4_UPDATE.zip']['id']==517455108 and a['VF_Forge_V1.35.4_UPDATE.zip']['size']==766277 and a['VF_Forge_V1.35.4_UPDATE.zip'].get('digest')=='sha256:c063d99e8ab99b86da345599c8db2f27d961b3565df94daafd203e867d8c8073'
          print('ORIGINAL_V1354_RELEASE_UNCHANGED=PASS')
          PY

      - name: Verify zero public artifacts and cleanup
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf distribution production /tmp/p03-v1354-dist-r1-release /tmp/remote-update-dist-r1.zip /tmp/dist-*.json /tmp/original-release-after.json /tmp/remote-update-id
          RESP=$(curl -fsS -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts")
          test "$(python3 -c 'import json,sys;print(json.load(sys.stdin)["total_count"])' <<<"$RESP")" = 0
          echo 'PUBLIC_ACTIONS_ARTIFACTS=0'
          echo 'EPHEMERAL_CLEANUP=PASS'

      - name: Corrective release verdict
        shell: bash
        run: |
          echo 'CORRECTIVE_DISTRIBUTION_R1_RELEASE=PASS'
          echo 'REMOTE_N_MINUS_1_ACCEPTANCE=PASS'
          echo 'ORIGINAL_V1354_RELEASE_MODIFIED=NO'
          echo 'CORE_UPDATES=QUARANTINED_ENABLED_FALSE'
          echo 'PRODUCTION_WRITE=0'
          echo 'NEXT=AUTHORITY_SEAL_THEN_STOP_FOR_MASTER'
