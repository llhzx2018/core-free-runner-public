name: P03 Atomic Builder Inspect

on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/p03/atomic-inspect/**'
      - '.github/workflows/p03-atomic-builder-inspect.yml'

permissions:
  contents: read

env:
  P03_REPOSITORY: llhzx2018/vf-forge
  P03_COMMIT: 11909e07b682765346d4ef890402b4ce00b91291

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ env.P03_REPOSITORY }}
          ref: ${{ env.P03_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p03

      - name: Inspect Atomic builder contract without building
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p03
          test "$(git rev-parse HEAD)" = "$P03_COMMIT"
          python3 scripts/build_atomic.py --help || true
          python3 - <<'PY'
          from pathlib import Path
          import ast,re
          p=Path('scripts/build_atomic.py')
          s=p.read_text(encoding='utf-8')
          for name in ['TARGET_VERSION','TARGET_SCHEMA','ALLOWED_SOURCES']:
              m=re.search(rf'^{name}\s*=\s*(.+)$',s,re.M)
              print(f'{name}='+((m.group(1).strip()) if m else 'NOT_FOUND'))
          t=ast.parse(s)
          for n in ast.walk(t):
              if isinstance(n,ast.Call) and isinstance(n.func,ast.Attribute) and n.func.attr=='add_argument' and n.args:
                  vals=[]
                  for a in n.args:
                      if isinstance(a,ast.Constant): vals.append(str(a.value))
                  if vals: print('ARGUMENT='+'|'.join(vals))
          for marker in ['MANAGED_ROOT_FILES','MANAGED_DIRS','manifest.json','repair']:
              print(marker+'_PRESENT='+('YES' if marker in s else 'NO'))
          PY
