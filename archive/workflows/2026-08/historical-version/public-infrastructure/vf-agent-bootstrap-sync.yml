name: VF Agent Bootstrap Authority Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vf-agent-bootstrap-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vf-agent-bootstrap-authority-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Require registered release write capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$WRITE_TOKEN" || { echo 'REGISTERED_CAPABILITY_BLOCK=VF_RELEASE_WRITE_TOKEN_MISSING' >&2; exit 79; }
          echo 'REGISTERED_RELEASE_WRITE_CAPABILITY=PASS'

      - name: Sync USER_INTERRUPT_GATE to all VF AGENTS.md
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64, json, os, urllib.parse, urllib.request

          repos = [
              'vf-start', 'vf-library', 'vf-forge', 'vf-infra',
              'vf-seo', 'vf-tools-theme', 'vf-tools-ops', 'vf-tools-m3u8',
          ]
          branches = ['main', 'develop']
          marker = '## USER_INTERRUPT_GATE · VF Shared Authority'
          block = '\n'.join([
              '',
              '## USER_INTERRUPT_GATE · VF Shared Authority',
              '',
              'Canonical Authority：`llhzx2018/gov-doc/governance/agent/VF_AGENT_INFRA_AUTHORITY.json`。新窗口 / 新 Agent 开工时必须先读取该 Authority；当前窗口没有记忆、没有某个连接器或第一次探测失败，不等于 VF 系统“没有仓库 / Runner / 权限 / Billing 能力”。',
              '',
              '固定基础设施：`core-free-runner-public`、`core-free-runner-private`、`VF_PRIVATE_READ_TOKEN`、`VF_RELEASE_WRITE_TOKEN`。禁止为同类用途创建第三个 Runner、测试仓、Token 或权限体系。',
              '',
              '用户职责仅为：目标制定、重大产品裁决、高风险授权。用户不是 Runner、Shell/PHP/Python/SQL/Git Operator、CI Operator、Secret 搬运工、窗口记忆器或“继续”按钮。',
              '',
              'Agent 在询问用户前必须完成：Authority 读取 → Current Truth 回读 → Repository / Runner / Credential / Existing File 发现 → 正确路由 → 安全能力探测 → 自动执行 / 修复 / 重试 → 已登记替代能力检查 → Failure Classification。',
              '',
              '默认禁止：让用户重复解释历史；让用户发送“继续”推动普通流程；让用户手工执行测试、代码、Git、SQL、Shell 或 CI；未搜索 Git / Library / Drive / 当前附件就要求重传；未证明现有两 Runner / 两 Credential 路径失效就要求新仓、新 Runner、新 Token 或新权限；把当前窗口工具缺口误判成系统能力缺口。',
              '',
              '只有重大产品裁决、`main` Promotion、Formal Release、Production / Destructive / 不可逆动作、确实只能由用户完成的受保护 Secret / 设备操作，或所有已登记自动路径均被证明不可恢复地阻塞时，才允许中断用户。',
              '',
          ])

          token = os.environ['WRITE_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'vf-agent-bootstrap-sync',
          }

          def request(method, url, payload=None):
              data = None
              h = dict(headers)
              if payload is not None:
                  h['Content-Type'] = 'application/json'
                  data = json.dumps(payload, ensure_ascii=False).encode('utf-8')
              req = urllib.request.Request(url, headers=h, data=data, method=method)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode('utf-8'))

          changed, skipped = [], []
          for repo in repos:
              for branch in branches:
                  path = urllib.parse.quote('AGENTS.md', safe='/')
                  ref = urllib.parse.quote(branch, safe='')
                  url = f'https://api.github.com/repos/llhzx2018/{repo}/contents/{path}?ref={ref}'
                  obj = request('GET', url)
                  text = base64.b64decode(obj['content']).decode('utf-8-sig')
                  if marker in text:
                      skipped.append(f'{repo}@{branch}')
                      continue
                  new_text = text.rstrip() + block
                  payload = {
                      'message': 'docs(agent): enforce shared USER_INTERRUPT_GATE',
                      'content': base64.b64encode(new_text.encode('utf-8')).decode('ascii'),
                      'sha': obj['sha'],
                      'branch': branch,
                  }
                  out = request('PUT', f'https://api.github.com/repos/llhzx2018/{repo}/contents/AGENTS.md', payload)
                  changed.append(f"{repo}@{branch}:{out['commit']['sha']}")

          print(f'BOOTSTRAP_SYNC_CHANGED={len(changed)}')
          print(f'BOOTSTRAP_SYNC_ALREADY_CURRENT={len(skipped)}')
          for value in changed:
              print('SYNCED=' + value)
          for value in skipped:
              print('SKIPPED=' + value)
          print('PRODUCT_SOURCE_WRITE_ACTIONS=0')
          print('USER_MANUAL_EXECUTION_REQUIRED=NO')
          PY
