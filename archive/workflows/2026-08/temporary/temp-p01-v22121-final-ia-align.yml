name: TEMP P01 V2.21.21 Final IA Align
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-p01-v22121-final-ia-align.yml']
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BRANCH: maintenance/navigation-admin-simplify-2.21.21-20260819
      EXPECTED_HEAD: 8eac6aceb336ade404362318dd75d485b706127f
    steps:
      - name: Align final personal-use IA
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          W: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch "$BRANCH" "https://x-access-token:${R}@github.com/llhzx2018/vf-start.git" p
          cd p
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(cat VERSION)" = "2.21.20"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/AdminShell.php');s=p.read_text()
          old="        ['key'=>'overview','label'=>'概览','href'=>'manage.php','icon'=>'home','children'=>[]],\n"
          assert s.count(old)==1,s.count(old)
          s=s.replace(old,'',1)
          old="        ['key'=>'plugins','label'=>'RSS 订阅','href'=>'workbench.php?route=rss','icon'=>'plugin','children'=>[]],\n"
          assert s.count(old)==1,s.count(old)
          s=s.replace(old,'',1)
          old="            ['href'=>'settings.php#account','label'=>'管理员账号'],\n            ['href'=>'system.php','label'=>'系统状态'],"
          new="            ['href'=>'settings.php#account','label'=>'管理员账号'],\n            ['href'=>'workbench.php?route=rss','label'=>'RSS 订阅'],\n            ['href'=>'system.php','label'=>'系统状态'],"
          assert s.count(old)==1,s.count(old)
          s=s.replace(old,new,1)
          s=s.replace("$group = (string)($page['group'] ?? 'overview');","$group = (string)($page['group'] ?? 'links');")
          s=s.replace('<a class="vf-rail-brand" href="manage.php" aria-label="VF Start 管理后台首页">','<a class="vf-rail-brand" href="links-admin.php" aria-label="VF Start 网址管理">')
          p.write_text(s)
          PY
          cat > src/manage.php <<'PHP'
          <?php
          declare(strict_types=1);
          require_once __DIR__.'/app/bootstrap.php';
          vf_security_headers(true);
          header('X-Robots-Tag: noindex, nofollow, noarchive');
          header('Cache-Control: no-store, private');
          if(!vf_is_installed()){header('Location: setup.php');exit;}
          if(!vf_is_admin()){header('Location: ./');exit;}
          header('Location: links-admin.php', true, 302);
          exit;
          PHP
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/authority/P01_BACKEND_FUNCTION_VALUE_DECISION_20260819.md')
          s=p.read_text()
          start=s.index('## Current backend navigation after this decision')
          end=s.index('## Safety boundary')
          block='''## Current backend navigation after this decision\n\n1. URL\n   - All URLs\n   - Categories\n   - Pending\n   - Archive / trash\n   - URL health\n   - Duplicate URLs\n   - Import / export\n2. Browser helper\n3. Backup & restore\n   - SQLite backup\n   - Full recovery\n4. Settings\n   - Base & brand\n   - Display & pagination\n   - Home\n   - Public & SEO\n   - Admin account\n   - RSS subscription\n   - System status\n5. Update\n\n'''
          s=s[:start]+block+s[end:]
          p.write_text(s)
          PY
          find src -type f -name '*.php' -print0|xargs -0 -n1 php -l >/dev/null
          find src/assets -type f -name '*.js' -print0|xargs -0 -n1 node --check >/dev/null
          ! grep -q "'label'=>'概览'" src/app/AdminShell.php
          ! grep -q "'key'=>'plugins'" src/app/AdminShell.php
          grep -q "'href'=>'workbench.php?route=rss','label'=>'RSS 订阅'" src/app/AdminShell.php
          grep -q "header('Location: links-admin.php'" src/manage.php
          git diff --check
          git config user.name VictorForge;git config user.email llhzx2018@gmail.com
          git add src/app/AdminShell.php src/manage.php docs/authority/P01_BACKEND_FUNCTION_VALUE_DECISION_20260819.md
          git commit -q -m 'refactor(P01): finalize personal-use backend IA'
          SHA=$(git rev-parse HEAD);TREE=$(git rev-parse HEAD^{tree});printf '%s' "$SHA" >/tmp/sha;printf '%s' "$TREE" >/tmp/tree
          git remote set-url origin "https://x-access-token:${W}@github.com/llhzx2018/vf-start.git"
          git push -q origin HEAD:"$BRANCH"
      - name: Publish safe evidence
        env:
          W: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          q={'schema':'vf-public-runner-result/v1','project_id':'P01','gate':'V22121_FINAL_IA_ALIGN','status':'SUCCESS','pass':True,'source_sha':open('/tmp/sha').read(),'source_tree':open('/tmp/tree').read(),'version':'2.21.20','top_level_modules':['网址','浏览器助手','备份与恢复','设置','更新'],'production_changed':False,'private_data_used':False}
          open('/tmp/e.json','w').write(json.dumps(q,ensure_ascii=False,indent=2)+'\n')
          PY
          git clone -q --depth 1 --branch vf-agent-operations-v1 "https://x-access-token:${W}@github.com/llhzx2018/core-free-runner-public.git" out
          mkdir -p out/vf-agent/results;cp /tmp/e.json out/vf-agent/results/P01-V2.21.21-FINAL-IA-ALIGN.json
          git -C out config user.name VictorForge;git -C out config user.email llhzx2018@gmail.com
          git -C out add vf-agent/results/P01-V2.21.21-FINAL-IA-ALIGN.json
          git -C out commit -q -m 'evidence(P01): finalize V2.21.21 personal-use IA'
          git -C out pull -q --rebase origin vf-agent-operations-v1
          git -C out push -q origin HEAD:vf-agent-operations-v1
