name: TEMP P01 V2.21.19 Atomic Lint Diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-p01-v22119-atomic-lint-diagnostic.yml']
permissions:
  contents: write
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE: 2784d8de583b016e78887b707e12ed0e89489a7d
      CANDIDATE_TREE: 64626d98737f1efdddd2230a636d7b13e6a36032
      PRODUCTION: a501d2394502319b0af9caaf1c171bdf94940a9d
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4', extensions: 'pdo_sqlite, sqlite3, curl, zip, mbstring', coverage: none}
      - name: Build and lint diagnostic
        env: {READ_TOKEN: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'}
        shell: bash
        run: |
          set +e
          bash -Eeuo pipefail <<'RUN' >/tmp/lintdiag.log 2>&1
          git clone -q --depth 1 --branch maintenance/reference-driven-ui-2.21.19-20260819 "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git clone -q --depth 1 --branch v2.21.18 "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" production
          OUT="$RUNNER_TEMP/p01-lintdiag";mkdir -p "$OUT";python3 scripts/temp-p01-v22119-build.py --candidate candidate/src --production production/src --out "$OUT" --candidate-commit "$CANDIDATE" --candidate-tree "$CANDIDATE_TREE" --production-commit "$PRODUCTION" >/tmp/build.json
          echo HOST_PHP;php -v|head -1;php -l "$OUT/repair-v2.21.19.php"
          echo PHP80;docker run --rm -v "$OUT:/work:ro" -w /work php:8.0-cli php -l repair-v2.21.19.php
          echo LINT_DIAGNOSTIC_PASS
          RUN
          rc=$?;echo "$rc">/tmp/lintdiag.rc;cat /tmp/lintdiag.log;exit 0
      - name: Publish
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -Eeuo pipefail;rc=$(cat /tmp/lintdiag.rc 2>/dev/null||echo 999);python3 - "$rc" <<'PY'
          import json,os,pathlib,sys
          rc=int(sys.argv[1]);q={'schema':'vf-public-runner-result/v1','project_id':'P01','target_version':'2.21.19','gate':'ATOMIC_LINT_DIAGNOSTIC','status':'SUCCESS' if rc==0 else 'FAILURE','pass':rc==0,'rc':rc,'source_sha':os.environ['CANDIDATE'],'log':'\n'.join(open('/tmp/lintdiag.log',encoding='utf-8',errors='replace').read().splitlines()[-120:]) if pathlib.Path('/tmp/lintdiag.log').exists() else '','workflow_run_id':os.environ['GITHUB_RUN_ID']};open('/tmp/e.json','w').write(json.dumps(q,indent=2,sort_keys=True)+'\n')
          PY
          git clone -q --depth 1 --branch vf-agent-operations-v1 https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-free-runner-public.git out;mkdir -p out/vf-agent/results;cp /tmp/e.json out/vf-agent/results/P01-V2.21.19-ATOMIC-LINT-DIAGNOSTIC.json;git -C out config user.name VictorForge;git -C out config user.email llhzx2018@gmail.com;git -C out add vf-agent/results/P01-V2.21.19-ATOMIC-LINT-DIAGNOSTIC.json;git -C out commit -q -m 'evidence(P01): publish V2.21.19 Atomic lint diagnostic';git -C out pull -q --rebase origin vf-agent-operations-v1;git -C out push -q origin HEAD:vf-agent-operations-v1;test "$rc" = 0
