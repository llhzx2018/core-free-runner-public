name: TEMP P01 V22119 Fast V3 Observer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-p01-v22119-fast-v3-observer.yml']
permissions:
  contents: write
  actions: read
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -Eeuo pipefail;sleep 2;gh api -X GET repos/llhzx2018/core-free-runner-public/actions/workflows/temp-p01-v22119-fast-ui-v3.yml/runs -f branch=main -f per_page=5 >/tmp/r.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/r.json'));runs=[{k:r.get(k) for k in ['id','status','conclusion','head_sha','created_at','updated_at']} for r in x.get('workflow_runs',[])[:5]];open('/tmp/e.json','w').write(json.dumps({'schema':'vf-public-runner-observation/v1','project_id':'P01','target_version':'2.21.19','gate':'FAST_UI_V3_OBSERVER','runs':runs},indent=2)+'\n')
          PY
          git clone -q --depth 1 --branch vf-agent-operations-v1 https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-free-runner-public.git out;mkdir -p out/vf-agent/results;cp /tmp/e.json out/vf-agent/results/P01-V2.21.19-FAST-UI-V3-OBSERVER.json;git -C out config user.name VictorForge;git -C out config user.email llhzx2018@gmail.com;git -C out add vf-agent/results/P01-V2.21.19-FAST-UI-V3-OBSERVER.json;git -C out commit -q -m 'evidence(P01): observe reusable V2.21.19 UI gate';git -C out pull -q --rebase origin vf-agent-operations-v1;git -C out push -q origin HEAD:vf-agent-operations-v1
