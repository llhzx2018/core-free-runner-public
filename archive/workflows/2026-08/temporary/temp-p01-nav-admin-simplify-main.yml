name: TEMP P01 Navigation Admin Simplify Main
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-p01-nav-admin-simplify-main.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BRANCH: maintenance/navigation-admin-simplify-2.21.21-20260819
      BASE: 915d4a868f85db7549ca2fbe37a347df0c714af5
    steps:
      - name: Clone exact private working branch
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch "$BRANCH" "https://x-access-token:${R}@github.com/llhzx2018/vf-start.git" p
          test "$(git -C p rev-parse HEAD)" = "$BASE"
      - name: Apply bounded product correction
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p
          cat >> src/assets/sidebar-refinement.css <<'CSS'

