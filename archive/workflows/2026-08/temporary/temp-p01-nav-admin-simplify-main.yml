          python3 - <<'PY'
          from pathlib import Path
          import re
          # Cache-bust the existing sidebar authority and reference behavior.
          p=Path('src/assets/reference-ui.js');s=p.read_text()
          old="link.href='assets/sidebar-refinement.css?v=22120';"
          assert s.count(old)==1
          s=s.replace(old,"link.href='assets/sidebar-refinement.css?v=22121';",1)
          stability=r'''
  var sidebarViewportInstalled=false;
  var sidebarPinnedTop=null;
  function isHomeHash(){return !location.hash||location.hash==='#/'||location.hash==='#';}
  function sidebarScroll(){return document.getElementById('sidebarScroll');}
  function resetSidebarHome(){var sc=sidebarScroll();if(!sc)return;requestAnimationFrame(function(){sc.scrollTop=0;requestAnimationFrame(function(){sc.scrollTop=0;});});}
  function restoreSidebarPinned(){var sc=sidebarScroll(),top=sidebarPinnedTop;if(!sc||top===null)return;requestAnimationFrame(function(){sc.scrollTop=top;requestAnimationFrame(function(){sc.scrollTop=top;sidebarPinnedTop=null;});});}
  function installSidebarViewportStability(){
    if(sidebarViewportInstalled)return;sidebarViewportInstalled=true;
    document.addEventListener('pointerdown',function(e){var hit=e.target instanceof Element?e.target.closest('#unifiedCategoryNav .category-nav-main,#unifiedCategoryNav .nav-chevron'):null,sc=sidebarScroll();if(hit&&sc)sidebarPinnedTop=sc.scrollTop;},true);
    document.addEventListener('click',function(e){var el=e.target instanceof Element?e.target:null;if(!el)return;if(el.closest('[data-view="home"],.brand[href="#/"]')){sidebarPinnedTop=null;resetSidebarHome();return;}if(el.closest('#unifiedCategoryNav .category-nav-main,#unifiedCategoryNav .nav-chevron'))restoreSidebarPinned();});
    window.addEventListener('hashchange',function(){if(isHomeHash()){sidebarPinnedTop=null;resetSidebarHome();}else restoreSidebarPinned();});
    if(isHomeHash())resetSidebarHome();
  }
'''
          marker='\n  function apply(){'
          assert s.count(marker)==1
          s=s.replace(marker,'\n'+stability+marker,1)
          old_apply='try{mark();ensureFrontendRefinementCss();ensureAdminReferenceCss();normalizeHome();normalizeAdminLinks();}finally{applying=false;}'
          new_apply='try{mark();ensureFrontendRefinementCss();ensureAdminReferenceCss();normalizeHome();normalizeAdminLinks();installSidebarViewportStability();}finally{applying=false;}'
          assert s.count(old_apply)==1
          p.write_text(s.replace(old_apply,new_apply,1))

          p=Path('src/index.php');s=p.read_text()
          old='<script src="assets/reference-ui.js?v=22120" defer></script>'
          assert s.count(old)==1
          p.write_text(s.replace(old,'<script src="assets/reference-ui.js?v=22121" defer></script>',1))

          p=Path('src/app/AdminShell.php');s=p.read_text()
          replacement='''function vf_admin_modules(): array\n{\n    return [\n        ['key'=>'links','label'=>'网址','href'=>'links-admin.php','icon'=>'links','children'=>[\n            ['href'=>'links-admin.php','label'=>'全部网址'],\n            ['href'=>'links-admin.php#categories','label'=>'分类'],\n            ['href'=>'links-admin.php?view=pending','label'=>'待整理'],\n        ]],\n        ['key'=>'data','label'=>'备份与恢复','href'=>'data-safety.php#backups','icon'=>'recovery','children'=>[]],\n        ['key'=>'browser','label'=>'浏览器助手','href'=>'browser-helper.php','icon'=>'browser','children'=>[]],\n        ['key'=>'settings','label'=>'设置','href'=>'settings.php','icon'=>'settings','children'=>[]],\n        ['key'=>'update','label'=>'更新','href'=>'update.php','icon'=>'update','children'=>[]],\n        ['key'=>'advanced','label'=>'高级','href'=>'advanced.php','icon'=>'system','children'=>[]],\n    ];\n}\n'''
          s2,n=re.subn(r'function vf_admin_modules\(\): array\n\{.*?\n\}\n\n/\*\* @param',replacement+'\n/** @param',s,count=1,flags=re.S)
          assert n==1,n
          p.write_text(s2)
          PY
