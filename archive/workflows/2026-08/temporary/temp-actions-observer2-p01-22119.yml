name: TEMP Actions Observer2 P01 22119
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-actions-observer2-p01-22119.yml']
permissions:
  contents: write
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          gh api repos/llhzx2018/core-free-runner-public/actions/workflows/temp-p01-v2.21.19-reference-ui-regression.yml/runs -f per_page=5 >/tmp/runs.json 2>/tmp/err.txt
          rc=$?
          set -e
          python3 - "$rc" <<'PY'
          import json,sys,os
          rc=int(sys.argv[1]);err=open('/tmp/err.txt').read().strip();runs=[]
          if rc==0:
            try:
                x=json.load(open('/tmp/runs.json'));runs=[{k:r.get(k) for k in ['id','status','conclusion','run_attempt','head_sha','created_at','updated_at']} for r in x.get('workflow_runs',[])[:5]]
            except Exception as e:err='parse:'+repr(e)
          q={'schema':'vf-public-runner-observation/v1','project_id':'P01','target_version':'2.21.19','gate':'RESILIENT_ACTIONS_OBSERVER','observer_run_id':os.environ['GITHUB_RUN_ID'],'query_rc':rc,'query_error':err,'runs':runs}
          open('/tmp/out.json','w').write(json.dumps(q,indent=2)+'\n')
          PY
          git clone -q --depth 1 --branch vf-agent-operations-v1 https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-free-runner-public.git out
          mkdir -p out/vf-agent/results;cp /tmp/out.json out/vf-agent/results/P01-V2.21.19-ACTIONS-OBSERVER2.json
          git -C out config user.name VictorForge;git -C out config user.email llhzx2018@gmail.com;git -C out add vf-agent/results/P01-V2.21.19-ACTIONS-OBSERVER2.json;git -C out commit -q -m 'evidence(P01): resilient actions observer';git -C out push -q origin HEAD:vf-agent-operations-v1
