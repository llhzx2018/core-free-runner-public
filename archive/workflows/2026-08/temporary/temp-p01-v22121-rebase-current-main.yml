name: TEMP P01 V2.21.21 Rebase Current Main
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-p01-v22121-rebase-current-main.yml']
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BRANCH: maintenance/navigation-admin-simplify-2.21.21-20260819
      EXPECTED_WORK: 68b46dfe8b1eb0d197c63a72254b29f619c859e5
      EXPECTED_MAIN: 383552dc5035cb60b4cd131907d05d87c3171b9b
    steps:
      - name: Merge latest main into working branch fail-closed
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          W: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q "https://x-access-token:${R}@github.com/llhzx2018/vf-start.git" p
          cd p
          git checkout -q "$BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_WORK"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git merge --no-edit origin/main
          test "$(cat VERSION)" = "2.21.20"
          git diff --check origin/main...HEAD
          SHA=$(git rev-parse HEAD)
          TREE=$(git rev-parse HEAD^{tree})
          printf '%s' "$SHA" >/tmp/sha
          printf '%s' "$TREE" >/tmp/tree
          git remote set-url origin "https://x-access-token:${W}@github.com/llhzx2018/vf-start.git"
          git push -q origin HEAD:"$BRANCH"
      - name: Publish evidence
        if: success()
        env:
          W: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          q={"schema":"vf-public-runner-result/v1","project_id":"P01","gate":"V22121_REBASE_CURRENT_MAIN","status":"SUCCESS","pass":True,"main_sha":"383552dc5035cb60b4cd131907d05d87c3171b9b","previous_work_sha":"68b46dfe8b1eb0d197c63a72254b29f619c859e5","rebased_sha":open('/tmp/sha').read(),"rebased_tree":open('/tmp/tree').read(),"version":"2.21.20","production_changed":False,"private_data_used":False}
          open('/tmp/e.json','w').write(json.dumps(q,indent=2)+'\n')
          PY
          git clone -q --depth 1 --branch vf-agent-operations-v1 "https://x-access-token:${W}@github.com/llhzx2018/core-free-runner-public.git" out
          mkdir -p out/vf-agent/results
          cp /tmp/e.json out/vf-agent/results/P01-V2.21.21-REBASE-CURRENT-MAIN.json
          git -C out config user.name VictorForge
          git -C out config user.email llhzx2018@gmail.com
          git -C out add vf-agent/results/P01-V2.21.21-REBASE-CURRENT-MAIN.json
          git -C out commit -q -m 'evidence(P01): rebase V2.21.21 work on current main'
          git -C out pull -q --rebase origin vf-agent-operations-v1
          git -C out push -q origin HEAD:vf-agent-operations-v1
