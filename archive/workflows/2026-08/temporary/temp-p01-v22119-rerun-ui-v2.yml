name: TEMP P01 V22119 Retarget UI Gate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-p01-v22119-rerun-ui-v2.yml']
permissions:
  contents: write
jobs:
  retarget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          p='.github/workflows/temp-p01-v22119-fast-ui-v2.yml';s=open(p,encoding='utf-8').read();old='52c0ffa6e6ef668d9a6de3ace26379f590642844';new='b42ccd7352bf204684bef97a4e0a98c51d138d7e';assert s.count(old)==1,s.count(old);open(p,'w',encoding='utf-8').write(s.replace(old,new,1))
          PY
          git config user.name VictorForge;git config user.email llhzx2018@gmail.com;git add .github/workflows/temp-p01-v22119-fast-ui-v2.yml;git commit -q -m 'ci(P01): test final V2.21.19 mobile search fix';git push -q origin main
