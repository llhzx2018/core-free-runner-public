name: TEMP P01 V2.21.19 Tamper Diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-p01-v22119-tamper-diagnostic.yml']
permissions:
  contents: write
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CANDIDATE: 2784d8de583b016e78887b707e12ed0e89489a7d
      CANDIDATE_TREE: 64626d98737f1efdddd2230a636d7b13e6a36032
      PRODUCTION: a501d2394502319b0af9caaf1c171bdf94940a9d
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4', extensions: 'pdo_sqlite, sqlite3', coverage: none}
      - name: Execute
        env: {READ_TOKEN: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch maintenance/reference-driven-ui-2.21.19-20260819 "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git clone -q --depth 1 --branch v2.21.18 "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" production
          mkdir -p "$RUNNER_TEMP/o";python3 scripts/temp-p01-v22119-build.py --candidate candidate/src --production production/src --out "$RUNNER_TEMP/o" --candidate-commit "$CANDIDATE" --candidate-tree "$CANDIDATE_TREE" --production-commit "$PRODUCTION" >/dev/null
          cp -a production/src /tmp/t;printf '\n/* P01_V22119_TAMPER */\n' >>/tmp/t/app/AdminShell.php
          set +e;php "$RUNNER_TEMP/o/repair-v2.21.19.php" --verify-source=/tmp/t >/tmp/tamper.out 2>&1;rc=$?;set -e
          python3 - "$rc" <<'PY'
          import json,sys
          print(json.dumps({'rc':int(sys.argv[1]),'out':open('/tmp/tamper.out',encoding='utf-8',errors='replace').read()},ensure_ascii=False))
          PY
          test "$rc" -ne 0
      - name: Publish
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os
          q={'schema':'vf-public-runner-result/v1','project_id':'P01','gate':'TAMPER_DIAGNOSTIC','source_sha':os.environ['CANDIDATE'],'output':open('/tmp/tamper.out',encoding='utf-8',errors='replace').read(),'workflow_run_id':os.environ['GITHUB_RUN_ID']};open('/tmp/e.json','w').write(json.dumps(q,indent=2)+'\n')
          PY
          git clone -q --depth 1 --branch vf-agent-operations-v1 https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-free-runner-public.git out;mkdir -p out/vf-agent/results;cp /tmp/e.json out/vf-agent/results/P01-V2.21.19-TAMPER-DIAGNOSTIC.json;git -C out config user.name VictorForge;git -C out config user.email llhzx2018@gmail.com;git -C out add vf-agent/results/P01-V2.21.19-TAMPER-DIAGNOSTIC.json;git -C out commit -q -m 'evidence(P01): publish V2.21.19 tamper diagnostic';git -C out pull -q --rebase origin vf-agent-operations-v1;git -C out push -q origin HEAD:vf-agent-operations-v1
