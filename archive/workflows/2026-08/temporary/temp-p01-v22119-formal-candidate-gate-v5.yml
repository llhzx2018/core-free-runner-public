name: TEMP P01 V2.21.19 Formal Candidate Gate V5 Trace
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-p01-v22119-formal-candidate-gate-v5.yml']
permissions:
  contents: write
env:
  CANDIDATE: 2784d8de583b016e78887b707e12ed0e89489a7d
  CANDIDATE_TREE: 64626d98737f1efdddd2230a636d7b13e6a36032
  PRODUCTION: a501d2394502319b0af9caaf1c171bdf94940a9d
  VERSION: 2.21.19
  SOURCE_VERSION: 2.21.18
  ADMIN_PASS: FormalCandidate-P01-22119!Strong
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4', extensions: 'pdo_sqlite, sqlite3, curl, zip, mbstring', coverage: none}
      - name: Execute traced formal gate
        env: {READ_TOKEN: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'}
        shell: bash
        run: |
          set +e
          bash -Eeuo pipefail <<'RUN' >/tmp/formal.log 2>&1
          git clone -q --depth 1 --branch maintenance/reference-driven-ui-2.21.19-20260819 "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git clone -q --depth 1 --branch v2.21.18 "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" production
          bash -x scripts/temp-p01-v22119-formal-gate.sh
          RUN
          rc=$?;echo "$rc">/tmp/formal.rc;tail -160 /tmp/formal.log;exit 0
      - name: Publish trace evidence
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -Eeuo pipefail;rc=$(cat /tmp/formal.rc 2>/dev/null||echo 999);python3 - "$rc" <<'PY'
          import json,os,pathlib,sys
          rc=int(sys.argv[1]);build={}
          if pathlib.Path('/tmp/build.json').exists():build=json.load(open('/tmp/build.json'))
          log='\n'.join(open('/tmp/formal.log',encoding='utf-8',errors='replace').read().splitlines()[-180:]) if pathlib.Path('/tmp/formal.log').exists() else ''
          q={'schema':'vf-public-runner-result/v1','project_id':'P01','target_version':'2.21.19','source_version':'2.21.18','gate':'FORMAL_CANDIDATE_TRACE','status':'SUCCESS' if rc==0 else 'FAILURE','pass':rc==0,'rc':rc,'source_sha':os.environ['CANDIDATE'],'source_tree':os.environ['CANDIDATE_TREE'],'production_sha':os.environ['PRODUCTION'],'workflow_run_id':os.environ['GITHUB_RUN_ID'],'build':build,'log_tail':log,'private_data_persisted_publicly':False};open('/tmp/e.json','w').write(json.dumps(q,indent=2,sort_keys=True)+'\n')
          PY
          git clone -q --depth 1 --branch vf-agent-operations-v1 https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-free-runner-public.git out;mkdir -p out/vf-agent/results;cp /tmp/e.json out/vf-agent/results/P01-V2.21.19-FORMAL-CANDIDATE-TRACE.json;git -C out config user.name VictorForge;git -C out config user.email llhzx2018@gmail.com;git -C out add vf-agent/results/P01-V2.21.19-FORMAL-CANDIDATE-TRACE.json;git -C out commit -q -m 'evidence(P01): publish V2.21.19 formal gate trace';git -C out pull -q --rebase origin vf-agent-operations-v1;git -C out push -q origin HEAD:vf-agent-operations-v1;test "$rc" = 0
