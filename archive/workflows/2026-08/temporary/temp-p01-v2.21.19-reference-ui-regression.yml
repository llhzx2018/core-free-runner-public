name: TEMP P01 V2.21.19 Reference UI Regression
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-p01-v2.21.19-reference-ui-regression.yml']
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      REPO: llhzx2018/vf-start
      BRANCH: maintenance/reference-driven-ui-2.21.19-20260819
      ADMIN_PASS: Reference-P01-22119!Strong
    steps:
      - name: Prepare source and browser runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --depth 1 --branch "$BRANCH" "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git" product
          git -C product rev-parse HEAD >/tmp/source-sha
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip php-xml php-mbstring sqlite3 >/dev/null
          command -v google-chrome >/dev/null
          mkdir -p "$RUNNER_TEMP/p01-node";cd "$RUNNER_TEMP/p01-node";npm init -y >/dev/null 2>&1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm i --no-audit --no-fund playwright-core@1.57.0 >/dev/null 2>&1
          php -l "$GITHUB_WORKSPACE/product/src/index.php" >/dev/null
          php -l "$GITHUB_WORKSPACE/product/src/app/AdminShell.php" >/dev/null
          node --check "$GITHUB_WORKSPACE/product/src/assets/reference-ui.js"
      - name: Fresh install synthetic fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          cp -a product/src /tmp/p01-ui
          php -S 127.0.0.1:18119 -t /tmp/p01-ui >/tmp/p01-ui-server.log 2>&1 & echo $! >/tmp/p01-ui.pid
          for i in $(seq 1 30);do curl -fsS -c /tmp/p01-ui.cookies http://127.0.0.1:18119/setup.php -o /tmp/setup.html&&break||sleep 1;done
          csrf=$(python3 - <<'PY'
          import re
          s=open('/tmp/setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsSL -b /tmp/p01-ui.cookies -c /tmp/p01-ui.cookies -X POST http://127.0.0.1:18119/setup.php --data-urlencode "setup_csrf=$csrf" --data-urlencode 'site_title=VF Start Reference Preview' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" >/dev/null
          php -r '
          require "/tmp/p01-ui/app/bootstrap.php";$r=new VfRepository(vf_db());$cats=[];
          foreach([["工作工具","每天高频打开的工作入口"],["AI 与开发","AI、代码与部署服务"],["内容与资料","阅读、出版与知识资料"],["运营服务","域名、支付与运营平台"]] as $i=>$row){$cats[]=$r->createCategory(["name"=>$row[0],"description"=>$row[1],"is_private"=>0,"sort_order"=>400-$i*10]);}
          $links=[[$cats[0],"GitHub","https://github.com/","代码仓库与 Release Authority",1,390],[$cats[0],"Cloudflare","https://www.cloudflare.com/","域名、Pages 与网络服务",0,380],[$cats[0],"CloudPanel","https://www.cloudpanel.io/","网站与 PHP 运行环境",0,370],[$cats[1],"OpenAI","https://openai.com/","AI 工具与开发文档",1,360],[$cats[1],"Vercel","https://vercel.com/","Web Preview 与部署服务",0,350],[$cats[1],"MDN","https://developer.mozilla.org/","Web 标准开发参考",0,340],[$cats[2],"Leanpub","https://leanpub.com/","电子书出版与销售",0,330],[$cats[2],"Wikipedia","https://www.wikipedia.org/","快速背景资料查询",0,320],[$cats[2],"Internet Archive","https://archive.org/","历史网页与数字资料",0,310],[$cats[3],"Dynadot","https://www.dynadot.com/","域名注册与续费",0,300],[$cats[3],"PayPal","https://www.paypal.com/","支付与账单",0,290],[$cats[3],"Stripe","https://stripe.com/","支付基础设施",0,280]];
          foreach($links as $x){$r->saveLink(null,["category_id"=>$x[0],"title"=>$x[1],"url"=>$x[2],"description"=>$x[3],"is_private"=>0,"is_favorite"=>$x[4],"sort_order"=>$x[5]],"manual");}
          $priv=$r->createCategory(["name"=>"私人工作","description"=>"仅管理员可见","is_private"=>1,"sort_order"=>200]);$r->saveLink(null,["category_id"=>$priv,"title"=>"Private Console","url"=>"https://example.com/private","description"=>"Synthetic private fixture","is_private"=>1,"sort_order"=>200],"manual");echo "FIXTURE_PASS\n";'
          php /tmp/p01-ui/cli/verify.php|grep -q 'VERIFY_PASS=YES'
      - name: Browser regression and screenshots
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/p01-shots"
          cat > "$RUNNER_TEMP/p01-node/e2e.mjs" <<'JS'
          import fs from'node:fs';import{chromium}from'playwright-core';const base='http://127.0.0.1:18119';const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const c=await b.newContext({viewport:{width:1440,height:1000}});const p=await c.newPage();const result={front:{},admin:{},widths:{}};
          await p.goto(base+'/',{waitUntil:'networkidle'});await p.waitForSelector('.home-page',{timeout:10000});result.front.referenceAttr=await p.evaluate(()=>document.documentElement.getAttribute('data-vf-reference-ui'));result.front.cssLoaded=await p.evaluate(()=>performance.getEntriesByType('resource').some(x=>x.name.includes('reference-ui.css')));result.front.commandHidden=await p.locator('.command-hero').evaluate(el=>getComputedStyle(el).display==='none').catch(()=>true);result.front.navigationBeforeHistory=await p.evaluate(()=>{const s=document.querySelector('.spaces'),h=document.querySelector('.home-columns');return !!(s&&h&&(s.compareDocumentPosition(h)&Node.DOCUMENT_POSITION_FOLLOWING));});result.front.quickCount=await p.locator('.quick-link').count();result.front.rootCount=await p.locator('.root-card').count();if(result.front.referenceAttr!=='1'||!result.front.cssLoaded||!result.front.commandHidden||!result.front.navigationBeforeHistory||result.front.rootCount<4)throw new Error('FRONT '+JSON.stringify(result.front));await p.screenshot({path:process.env.RUNNER_TEMP+'/p01-shots/home-desktop.png',fullPage:true});
          for(const w of[1440,1280,1024,768,430,390,375]){await p.setViewportSize({width:w,height:w<700?844:900});await p.waitForTimeout(80);const v=await p.evaluate(()=>({client:document.documentElement.clientWidth,scroll:document.documentElement.scrollWidth,body:document.body.scrollWidth}));result.widths['front_'+w]=v;if(v.scroll>v.client||v.body>v.client)throw new Error('FRONT_OVERFLOW '+w+' '+JSON.stringify(v));}await p.setViewportSize({width:390,height:844});await p.screenshot({path:process.env.RUNNER_TEMP+'/p01-shots/home-mobile.png',fullPage:true});
          await p.setViewportSize({width:1440,height:1000});await p.goto(base+'/login.php',{waitUntil:'domcontentloaded'});await p.locator('input[type=password]').fill(process.env.ADMIN_PASS);await Promise.all([p.waitForLoadState('networkidle'),p.locator('button[type=submit],input[type=submit]').first().click()]);await p.goto(base+'/links-admin.php',{waitUntil:'networkidle'});await p.waitForSelector('#linksBody tr',{timeout:10000});result.admin.railCount=await p.locator('.vf-admin-rail').count();result.admin.cssLoaded=await p.evaluate(()=>performance.getEntriesByType('resource').some(x=>x.name.includes('reference-ui.css')));result.admin.rows=await p.locator('#linksBody tr').count();result.admin.batchInitiallyHidden=await p.locator('#batchBar').evaluate(el=>getComputedStyle(el).display==='none');const checks=p.locator('#linksBody input[type=checkbox]');if(await checks.count()>=2){await checks.nth(0).check();await checks.nth(1).check();await p.waitForTimeout(80);}result.admin.batchAfterSelection=await p.locator('#batchBar').evaluate(el=>getComputedStyle(el).display!=='none');if(result.admin.railCount!==1||!result.admin.cssLoaded||result.admin.rows<8||!result.admin.batchInitiallyHidden||!result.admin.batchAfterSelection)throw new Error('ADMIN '+JSON.stringify(result.admin));await p.screenshot({path:process.env.RUNNER_TEMP+'/p01-shots/admin-links-desktop.png',fullPage:true});for(const w of[1440,1024,768,430,390,375]){await p.setViewportSize({width:w,height:w<700?844:900});await p.waitForTimeout(100);const v=await p.evaluate(()=>({client:document.documentElement.clientWidth,scroll:document.documentElement.scrollWidth,body:document.body.scrollWidth}));result.widths['admin_'+w]=v;if(v.scroll>v.client||v.body>v.client)throw new Error('ADMIN_OVERFLOW '+w+' '+JSON.stringify(v));}await p.setViewportSize({width:390,height:844});await p.screenshot({path:process.env.RUNNER_TEMP+'/p01-shots/admin-links-mobile.png',fullPage:true});fs.writeFileSync('/tmp/ui-result.json',JSON.stringify(result,null,2));await b.close();
          JS
          cd "$RUNNER_TEMP/p01-node";ADMIN_PASS="$ADMIN_PASS" node e2e.mjs
      - name: Publish evidence to operations branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sha=$(cat /tmp/source-sha);python3 - "$sha" <<'PY'
          import json,sys
          x=json.load(open('/tmp/ui-result.json'));q={'schema':'vf-public-runner-result/v1','project_id':'P01','target_version':'2.21.19','gate':'REFERENCE_UI_BROWSER_REGRESSION','status':'SUCCESS','pass':True,'source_sha':sys.argv[1],'front':x['front'],'admin':x['admin'],'widths':x['widths'],'desktop_mobile_screenshots':4,'private_data_persisted_publicly':False};open('/tmp/evidence.json','w').write(json.dumps(q,indent=2,sort_keys=True)+'\n')
          PY
          git clone -q --depth 1 --branch vf-agent-operations-v1 "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-free-runner-public.git" out;mkdir -p out/vf-agent/results out/evidence/p01/v22119;cp /tmp/evidence.json out/vf-agent/results/P01-V2.21.19-REFERENCE-UI-BROWSER.json;cp "$RUNNER_TEMP"/p01-shots/*.png out/evidence/p01/v22119/;git -C out config user.name VictorForge;git -C out config user.email llhzx2018@gmail.com;git -C out add vf-agent/results/P01-V2.21.19-REFERENCE-UI-BROWSER.json evidence/p01/v22119;git -C out commit -q -m 'evidence(P01): publish V2.21.19 reference UI browser regression';git -C out push -q origin HEAD:vf-agent-operations-v1
      - if: always()
        run: '[ -f /tmp/p01-ui.pid ]&&kill "$(cat /tmp/p01-ui.pid)" 2>/dev/null||true'
