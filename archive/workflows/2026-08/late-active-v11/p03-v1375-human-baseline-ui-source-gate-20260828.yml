name: P03 V1.37.5 Human Baseline UI Source Gate

on:
  push:
    paths:
      - '.github/workflows/p03-v1375-human-baseline-ui-source-gate-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_MAIN: 07b48eea3d43fb3bc93d1a7037137b6c9d5520e0
      INPUT_HEAD: e080a479bebfc2f9189a5e108579f3572d4adbf0
      BRANCH: ui/p03-common-baseline-human-readable-v1375-20260828
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, zip, curl, mbstring, fileinfo, sodium
          coverage: none

      - name: Checkout exact P03 UI branch
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:${TOKEN}@github.com/llhzx2018/vf-forge.git" product >/dev/null 2>&1
          cd product
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          git checkout "$BRANCH"
          test "$(git rev-parse HEAD)" = "$INPUT_HEAD"
          echo P03_UI_INPUT_FENCE=PASS

      - name: Expose unified maintenance entries and bump patch version
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd product
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/assets/app.js')
          s=p.read_text(encoding='utf-8')
          needle='    <details class="settings-disclosure"><summary><span><strong>运行环境诊断</strong><small>Host、PHP、SQLite、权限与私有目录</small></span>'
          if s.count(needle)!=1:
              raise SystemExit(f'maintenance insertion point count={s.count(needle)}')
          card='''    <div class="settings-plain-block"><div class="settings-subhead"><div><strong>统一系统维护</strong><p>公共规范和运行状态统一从这里进入；日常不需要阅读机器参数。</p></div></div><div class="settings-inline-actions"><a class="button ghost small" href="system-info.php">系统信息</a><a class="button ghost small" href="system-baseline.php">系统基线</a><button class="button ghost small" type="button" data-settings-tab-jump="update">在线升级</button><button class="button ghost small" type="button" data-settings-tab-jump="backup">备份与恢复</button><a class="button ghost small" href="diagnose.php">运行健康</a></div></div>\n'''
          s=s.replace(needle,card+needle,1)
          s=s.replace('<strong>运行环境诊断</strong><small>Host、PHP、SQLite、权限与私有目录</small>','<strong>运行健康概览</strong><small>Host、PHP、SQLite、权限与私有目录；完整检查进入“运行健康”</small>',1)
          marker="  const brandLogoFile=$('#brandLogoFile'),brandLogoFileName=$('#brandLogoFileName');"
          if s.count(marker)!=1:
              raise SystemExit(f'listener insertion point count={s.count(marker)}')
          listener="  $$('[data-settings-tab-jump]').forEach(button=>button.addEventListener('click',()=>{$(`.settings-nav [data-settings-tab=\\\"${button.dataset.settingsTabJump}\\\"]`)?.click();}));\n"
          s=s.replace(marker,listener+marker,1)
          p.write_text(s,encoding='utf-8')
          Path('VERSION').write_text('1.37.5\n',encoding='utf-8')
          PY
          test "$(cat VERSION)" = '1.37.5'
          python3 tests/unit/common_baseline_ui_exposure_contract_test.py
          php -l public/system-baseline.php
          php -l public/system-info.php
          php -l public/diagnose.php
          node --check public/assets/app.js
          mapfile -t changed < <(git diff --name-only "$BASE_MAIN"..HEAD; git diff --name-only)
          printf '%s\n' "${changed[@]}" | sort -u > /tmp/changed
          cat /tmp/changed
          for f in VERSION public/assets/app.js public/diagnose.php public/system-baseline.php public/system-info.php tests/unit/common_baseline_ui_exposure_contract_test.py; do grep -Fxq "$f" /tmp/changed; done
          test "$(wc -l < /tmp/changed)" = '6'
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VERSION public/assets/app.js
          git commit -m 'release(P03): prepare V1.37.5 human baseline UI'
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/llhzx2018/vf-forge.git"
          git push origin "$BRANCH"
          echo "P03_V1375_EXACT_SOURCE=$(git rev-parse HEAD)"
          echo P03_V1375_HUMAN_BASELINE_UI_SOURCE_GATE=PASS
          echo PRODUCTION_WRITE=NO
