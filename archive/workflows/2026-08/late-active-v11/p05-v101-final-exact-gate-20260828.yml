name: P05 V1.0.1 Final Exact Source Gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p05-v101-final-exact-gate-20260828.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FINAL_SOURCE: 4aea437e6059444603713e1fe69d22347b57f4d1
      MACHINE_SOURCE: 00a724587c041130c0e81e0e45ef876413fb2916
      ASSESSED_BASE: ec613be42f18bd0456a7e5f5d9c0bbbe25a6e22c
      TARGET_BRANCH: release/p05-v1.0.1-common-baseline-v2-20260828
    steps:
      - uses: actions/checkout@v4
      - name: Verify final source and deployment-readiness binding
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:${TOKEN}@github.com/llhzx2018/vf-seo.git" p05 >/dev/null 2>&1
          cd p05
          git checkout "$FINAL_SOURCE"
          test "$(git rev-parse HEAD)" = "$FINAL_SOURCE"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$FINAL_SOURCE"
          test "$(git rev-parse origin/main)" = "$ASSESSED_BASE"
          test "$(git diff --name-only "$MACHINE_SOURCE" "$FINAL_SOURCE")" = 'VF_PROJECT.json'
          mapfile -t all < <(git diff --name-only "$ASSESSED_BASE" "$FINAL_SOURCE")
          test "${#all[@]}" -eq 2
          printf '%s\n' "${all[@]}" | grep -Fxq 'install-cloudpanel.sh'
          printf '%s\n' "${all[@]}" | grep -Fxq 'VF_PROJECT.json'
          test "$(tr -d '\r\n' < VERSION)" = '1.0.1'
          bash -n install-cloudpanel.sh
          grep -Fq 'VF_SESSION_TTL_SECONDS=2592000' install-cloudpanel.sh
          grep -Fq 'VF_SESSION_IDLE_SECONDS=604800' install-cloudpanel.sh
          grep -Fq 'VF_SESSION_ABSOLUTE_SECONDS=2592000' install-cloudpanel.sh
          grep -Fq 'VF_SESSION_COOKIE_SECONDS=2592000' install-cloudpanel.sh
          grep -Fq 'VF_STEP_UP_WINDOW_SECONDS=900' install-cloudpanel.sh
          ! grep -Fq 'VF_SESSION_ROTATION_SECONDS=' install-cloudpanel.sh
          python3 - <<'PY'
          import json
          d=json.load(open('VF_PROJECT.json'))
          assert d['status']=='V1.0.1_FORMAL_RELEASE_CANDIDATE_DEPLOYMENT_READY_PRODUCTION_NOT_DEPLOYED',d
          assert d['formal_release']=='v1.0.1_PENDING_PUBLICATION',d
          assert d['formal_release_state']=='CANDIDATE_MACHINE_PASS_PENDING_PUBLICATION',d
          assert d['formal_release_candidate_commit']=='00a724587c041130c0e81e0e45ef876413fb2916',d
          assert d['production_version'] is None and d['production_deployment']=='NOT_DEPLOYED' and d['production_write']==0,d
          assert d['owner_real_use_review']=='NOT_APPLICABLE_UNTIL_FIRST_DEPLOYMENT',d
          r=d['deployment_readiness']; assert r['state']=='PASS' and r['production_state']=='NOT_DEPLOYED',r
          assert r['regression_evidence']['run']==33144186906 and r['regression_evidence']['job']==98761515146,r
          e=r['first_install_evidence']; assert e['run']==33144311553 and e['job']==98761893522 and e['artifact']==9675163136 and e['state']=='PASS',e
          assert r['full_asset']['bytes']==469642 and r['full_asset']['sha256']=='ac36676612163c10006515eaa4f3265d01351425b4121c53be6d2bbe2dd92a0c',r
          a=json.load(open('docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json'))
          assert a['state']=='CURRENT' and a['version']=='1.0.1' and a['schema_version']==1,a
          assert a['machine_verification']['state']=='PASS',a
          assert a['release_executed'] is False and a['production_changed'] is False,a
          PY
          git diff --check "$ASSESSED_BASE" "$FINAL_SOURCE"
          echo P05_V101_FINAL_EXACT_SOURCE="$FINAL_SOURCE"
          echo P05_V101_MACHINE_SOURCE="$MACHINE_SOURCE"
          echo P05_V101_DEPLOYMENT_READINESS=PASS
          echo P05_V101_PRODUCTION=NOT_DEPLOYED
          echo P05_V101_FINAL_EXACT_GATE=PASS
