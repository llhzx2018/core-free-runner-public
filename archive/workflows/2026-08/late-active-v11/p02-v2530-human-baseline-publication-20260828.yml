name: P02 V2.5.30 Human Baseline Publication

on:
  push:
    paths:
      - '.github/workflows/p02-v2530-human-baseline-publication-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE: d0f3d4f0f65400c5ca4868df844bbc4684b7cd8a
      MAIN_SHA: f9bcfc3173be6db3845bcf287aeb3a737711ccda
      FORMAL_RUN: '33158085181'
      FORMAL_ARTIFACT: P02-V2.5.30-HUMAN-BASELINE-FORMAL-RELEASE-SET
      TAG: v2.5.30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: f9bcfc3173be6db3845bcf287aeb3a737711ccda
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product
      - name: Publication source fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$MAIN_SHA"
          test "$(git -C product rev-parse HEAD^{tree})" = "$(git -C product rev-parse "$CANDIDATE^{tree}")"
          test "$(tr -d '\r\n' < product/VERSION)" = '2.5.30'
          gh api repos/llhzx2018/core-free-runner-public/actions/runs/$FORMAL_RUN | jq -e '.status=="completed" and .conclusion=="success"' >/dev/null
          if git -C product rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            test "$(git -C product rev-list -n1 "$TAG")" = "$CANDIDATE"
          fi
          echo P02_V2530_PUBLICATION_SOURCE_FENCE=PASS
      - name: Download and verify exact formal artifact
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          rm -rf formal release-assets remote
          mkdir -p formal release-assets remote
          gh run download "$FORMAL_RUN" -R llhzx2018/core-free-runner-public -n "$FORMAL_ARTIFACT" -D formal
          for n in \
            VF_Library_V2.5.30_FULL.zip \
            VF_Library_V2.5.30_UPDATE.zip \
            VF_Library_V2.5.30_ATOMIC.zip \
            repair-v2.5.30.php \
            VF_Library_V2.5.30_SOURCE.zip \
            VF_Library_V2.5.30_RELEASE_MANIFEST.json \
            VF_Library_V2.5.30_RELEASE_NOTES.md \
            SHA256SUMS.txt; do
            p=$(find formal -type f -name "$n" -print -quit); test -n "$p"; cp "$p" release-assets/"$n"
          done
          (cd release-assets && sha256sum -c SHA256SUMS.txt)
          jq -e '.schema=="vf-release-manifest/2.1" and .release_id=="P02-VF-LIBRARY-2.5.30" and .version=="2.5.30" and .source.repository=="llhzx2018/vf-library" and .source.candidate_commit=="d0f3d4f0f65400c5ca4868df844bbc4684b7cd8a" and .source.source_tree=="c029838309606ceec49c168d8d60fb8e83496604" and .build.schema==2401 and .compatibility.supported_from==["2.5.29"] and .compatibility.source_schema==2401 and .compatibility.target_schema==2401 and .compatibility.schema_migration==false' release-assets/VF_Library_V2.5.30_RELEASE_MANIFEST.json >/dev/null
          echo P02_V2530_EXACT_ARTIFACT=PASS
      - name: Create exact tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd product
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-library.git"
          if ! git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            git tag "$TAG" "$CANDIDATE"
            git push origin "refs/tags/$TAG"
          else
            REMOTE_TAG=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')
            test "$REMOTE_TAG" = "$CANDIDATE"
          fi
          cd ..
          if ! gh release view "$TAG" -R llhzx2018/vf-library >/dev/null 2>&1; then
            gh release create "$TAG" -R llhzx2018/vf-library --verify-tag --title 'VF Library V2.5.30' --notes-file release-assets/VF_Library_V2.5.30_RELEASE_NOTES.md release-assets/*
          fi
          RID=$(gh api repos/llhzx2018/vf-library/releases/tags/$TAG --jq '.id')
          test -n "$RID"
          echo "P02_RELEASE_ID=$RID" >> "$GITHUB_ENV"
          echo P02_V2530_RELEASE_CREATED=PASS
      - name: Remote Release readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-library/git/ref/tags/$TAG --jq '.object.sha')" = "$CANDIDATE"
          gh api repos/llhzx2018/vf-library/releases/tags/$TAG | jq -e --argjson id "$P02_RELEASE_ID" '.id==$id and .draft==false and .prerelease==false and ([.assets[].name]|sort)==(["SHA256SUMS.txt","VF_Library_V2.5.30_ATOMIC.zip","VF_Library_V2.5.30_FULL.zip","VF_Library_V2.5.30_RELEASE_MANIFEST.json","VF_Library_V2.5.30_RELEASE_NOTES.md","VF_Library_V2.5.30_SOURCE.zip","VF_Library_V2.5.30_UPDATE.zip","repair-v2.5.30.php"]|sort)' >/dev/null
          gh release download "$TAG" -R llhzx2018/vf-library -D remote
          (cd remote && sha256sum -c SHA256SUMS.txt)
          UPDATE_SHA=$(sha256sum remote/VF_Library_V2.5.30_UPDATE.zip | awk '{print $1}')
          UPDATE_BYTES=$(stat -c%s remote/VF_Library_V2.5.30_UPDATE.zip)
          echo "P02_UPDATE_SHA=$UPDATE_SHA" >> "$GITHUB_ENV"
          echo "P02_UPDATE_BYTES=$UPDATE_BYTES" >> "$GITHUB_ENV"
          echo P02_V2530_REMOTE_RELEASE_READBACK=PASS
      - name: Publication summary
        run: |
          echo P02_V2530_PUBLICATION=PASS
          echo P02_RELEASE_ID="$P02_RELEASE_ID"
          echo P02_UPDATE_BYTES="$P02_UPDATE_BYTES"
          echo P02_UPDATE_SHA256="$P02_UPDATE_SHA"
          echo PRODUCTION=NO
