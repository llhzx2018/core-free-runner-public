name: P02 Common Baseline Human UI V2 Prep

on:
  push:
    paths:
      - '.github/workflows/p02-common-baseline-human-ui-v2-prep-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_SHA: 49c2bac2497ccc454c2134d3e491d76b2ff63d79
      EXACT_SOURCE: 726a93a01a4901215d54ce3994dc21fdc2c43e30
      PRODUCT_BRANCH: ui/p02-common-baseline-human-readable-v2530-20260828
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, zip, curl, mbstring, openssl
          coverage: none
      - name: Checkout exact P02 branch
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-library.git" p02 >/dev/null 2>&1
          cd p02
          git checkout "$PRODUCT_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git remote set-url origin https://github.com/llhzx2018/vf-library.git
          echo P02_HUMAN_UI_SOURCE_FENCE=PASS
      - name: Apply settings navigation and contract
        run: |
          set -Eeuo pipefail
          python3 scripts/p02_common_baseline_human_ui_v2_patch.py p02
          node --check p02/public/assets/app.js
          php -l p02/public/system-baseline.php
          php -l p02/public/system-info.php
          php -l p02/public/diagnose.php
          (cd p02 && node tests/unit/common_baseline_ui_exposure_contract.mjs)
          git -C p02 diff --check
          git -C p02 status --porcelain=v1 | cut -c4- | sort -u > /tmp/dirty.txt
          cat > /tmp/expected.txt <<'EOF'
          public/assets/app.js
          tests/unit/common_baseline_ui_exposure_contract.mjs
          EOF
          diff -u /tmp/expected.txt /tmp/dirty.txt
          echo P02_HUMAN_UI_STATIC_GATE=PASS
      - name: Commit and push UI exposure
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd p02
          git add public/assets/app.js tests/unit/common_baseline_ui_exposure_contract.mjs
          git commit -m 'ui(P02): expose human-readable system maintenance center'
          git remote set-url origin "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-library.git"
          git push origin HEAD:"$PRODUCT_BRANCH"
          git remote set-url origin https://github.com/llhzx2018/vf-library.git
          echo P02_HUMAN_UI_PUSH=PASS
