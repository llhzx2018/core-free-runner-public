name: P04 V2.8.10 Production Authority Closure
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p04-v2810-production-authority-closure-20260828.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify P04 owner production closure truth
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:${TOKEN}@github.com/llhzx2018/vf-infra.git" p04 >/dev/null 2>&1
          cd p04
          git fetch origin governance/p04-v2.8.10-production-closure-20260828
          git checkout af741c946cd0daf231c6263e65b70214821cd1eb
          test "$(git rev-parse origin/main)" = "0a2fe242422cdeaece988c742e29a82c034ae25a"
          test "$(git diff --name-only origin/main HEAD)" = "VF_PROJECT.json"
          python3 - <<'PY'
          import json
          p=json.load(open('VF_PROJECT.json',encoding='utf-8'))
          assert p['status']=='V2.8.10 PRODUCTION VERIFIED'
          assert p['lifecycle']=='PRODUCTION_VERIFIED'
          assert p['version']=='2.8.10' and p['production_version']=='2.8.10'
          assert p['schema']==14
          r=p['release']
          assert r['tag']=='v2.8.10' and r['release_id']==378266987
          assert r['release_product_commit']=='8f91cc4c7bd9fadf6398eda60bcd2c2283a02d98'
          assert r['update_asset']['id']==533272075
          assert r['update_asset']['sha256']=='42b72a3e5adc9d967de947c94d992d7409d1d4b7efa07bee1640356a7ae36e36'
          assert r['core_updates']=='CURRENT'
          t=p['production_truth']
          assert t['installed_version']=='2.8.10' and t['installed_schema']==14
          assert t['upgrade_from']=='2.8.9' and t['upgrade_to_2_8_10']=='SUCCESS'
          assert t['latest_version_observed']=='2.8.10' and t['update_state_observed']=='已是最新版本'
          assert t['owner_evidence']=='SCREENSHOT_VERIFIED_2026-08-28'
          assert t['production_write']=='NO'
          print('P04_PRODUCTION_AUTHORITY_JSON=PASS')
          PY
          test "$(git rev-list -n1 v2.8.10)" = "8f91cc4c7bd9fadf6398eda60bcd2c2283a02d98"
          curl -fsSL -H "Authorization: Bearer ${TOKEN}" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-infra/releases/tags/v2.8.10 > /tmp/release.json
          curl -fsSL -H "Authorization: Bearer ${TOKEN}" -H 'Accept: application/vnd.github+json' https://raw.githubusercontent.com/llhzx2018/core-updates/main/projects/P04.json > /tmp/p04-update.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/release.json'))
          assert r['id']==378266987 and r['tag_name']=='v2.8.10'
          assets={a['name']:a for a in r['assets']}
          a=assets['VF_Infra_V2.8.10_UPDATE.zip']
          assert a['id']==533272075 and a['size']==1288186
          u=json.load(open('/tmp/p04-update.json'))
          assert u['target_version']=='2.8.10'
          assert u['from_versions']==['2.8.9']
          assert u['schema_from']=='14' and u['schema_to']=='14'
          assert u['release_tag']=='v2.8.10'
          assert u['release_id']==378266987
          assert u['release_product_commit']=='8f91cc4c7bd9fadf6398eda60bcd2c2283a02d98'
          assert u['asset_id']==533272075
          assert u['asset_sha256']=='42b72a3e5adc9d967de947c94d992d7409d1d4b7efa07bee1640356a7ae36e36'
          print('P04_RELEASE_DISTRIBUTION_READBACK=PASS')
          PY
          echo P04_V2810_PRODUCTION_AUTHORITY_CLOSURE=PASS
          echo P04_PRODUCTION_VERSION=2.8.10
          echo P04_PRODUCTION_SCHEMA=14
          echo P04_OWNER_EVIDENCE=VERIFIED
