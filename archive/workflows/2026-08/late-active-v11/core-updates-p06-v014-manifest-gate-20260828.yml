name: core-updates P06 V0.1.14 Manifest Exact Source Gate

on:
  push:
    paths:
      - '.github/workflows/core-updates-p06-v014-manifest-gate-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      CORE_UPDATES_SOURCE: 757f91a4770d387b8be98177a0b2b657cccd58b5
      CORE_UPDATES_BASE: cf3a89a722cf190ed5b94184a92feceba1f0dd32
      P06_RELEASE_SOURCE: d689b79a6f1d98f0bf5bccba438f3c9a74077782
      P06_RELEASE_ID: '378314190'
      P06_RELEASE_TAG: v0.1.14
      P06_ASSET: VF_Press_V0.1.14_UPDATE.zip
      P06_ASSET_BYTES: '273201'
      P06_ASSET_SHA256: 0c9cbfa2e21865f5306eeeac83cef89a155d4e6539bba8cb54c6b3b0b37e9769
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact core-updates source and fence base
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:${TOKEN}@github.com/llhzx2018/core-updates.git" updates >/dev/null 2>&1
          cd updates
          git fetch --no-tags origin "$CORE_UPDATES_SOURCE"
          git checkout --detach "$CORE_UPDATES_SOURCE"
          test "$(git rev-parse HEAD)" = "$CORE_UPDATES_SOURCE"
          test "$(git rev-parse HEAD^1)" = "$CORE_UPDATES_BASE"
          test "$(git diff --name-only "$CORE_UPDATES_BASE".."$CORE_UPDATES_SOURCE")" = 'projects/P06.json'
          echo CORE_UPDATES_EXACT_SOURCE_FENCE=PASS

      - name: Validate P06 manifest against repository JSON Schema
        run: |
          set -Eeuo pipefail
          python3 -m pip install --quiet jsonschema
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          root = Path('updates')
          schema = json.loads((root/'schemas/update-manifest-v1.schema.json').read_text())
          manifest = json.loads((root/'projects/P06.json').read_text())
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(manifest)
          assert manifest['project_id'] == 'P06'
          assert manifest['component_id'] == 'APP'
          assert manifest['enabled'] is True
          assert manifest['target_version'] == '0.1.14'
          assert manifest['update_type'] == 'ATOMIC'
          assert manifest['from_versions'] == ['0.1.13']
          assert manifest['schema_from'] == '3' and manifest['schema_to'] == '3'
          assert manifest['repository'] == 'llhzx2018/vf-press'
          assert manifest['release_tag'] == 'v0.1.14'
          assert manifest['release_id'] == 378314190
          assert manifest['product_identity'] == 'd689b79a6f1d98f0bf5bccba438f3c9a74077782'
          assert manifest['asset_name'] == 'VF_Press_V0.1.14_UPDATE.zip'
          assert manifest['asset_bytes'] == 273201
          assert manifest['asset_sha256'] == '0c9cbfa2e21865f5306eeeac83cef89a155d4e6539bba8cb54c6b3b0b37e9769'
          assert manifest['backup_required'] is True
          assert manifest['rollback_supported'] is True
          print('P06_MANIFEST_JSON_SCHEMA=PASS')
          print('P06_MANIFEST_STRICT_FROM_VERSION=PASS')
          PY

      - name: Verify formal P06 release metadata and asset identity
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/vf-press/releases/tags/$P06_RELEASE_TAG" > /tmp/p06-release.json
          test "$(jq -r '.id' /tmp/p06-release.json)" = "$P06_RELEASE_ID"
          test "$(jq -r '.target_commitish' /tmp/p06-release.json)" = "$P06_RELEASE_SOURCE"
          test "$(jq -r '.draft' /tmp/p06-release.json)" = 'false'
          test "$(jq -r '.prerelease' /tmp/p06-release.json)" = 'false'
          ASSET_COUNT="$(jq --arg n "$P06_ASSET" '[.assets[] | select(.name==$n)] | length' /tmp/p06-release.json)"
          test "$ASSET_COUNT" = '1'
          test "$(jq -r --arg n "$P06_ASSET" '.assets[] | select(.name==$n) | .size' /tmp/p06-release.json)" = "$P06_ASSET_BYTES"
          DIGEST="$(jq -r --arg n "$P06_ASSET" '.assets[] | select(.name==$n) | .digest' /tmp/p06-release.json)"
          test "$DIGEST" = "sha256:$P06_ASSET_SHA256"
          echo P06_RELEASE_METADATA=PASS
          echo P06_RELEASE_ASSET_IDENTITY=PASS

      - name: core-updates PHP syntax and regression
        run: |
          set -Eeuo pipefail
          cd updates
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/core-updates-lint.log
          php update-core/php/tests/run.php
          echo CORE_UPDATES_REGRESSION=PASS

      - name: Evidence binding
        run: |
          set -Eeuo pipefail
          cd updates
          grep -Fq '33150691059' projects/P06.json
          grep -Fq '98781719882' projects/P06.json
          echo ATOMIC_UPGRADE_EVIDENCE_BOUND=PASS
          echo P06_V014_MANIFEST_EXACT_SOURCE_GATE=PASS
          echo PRODUCTION_WRITE=NO
