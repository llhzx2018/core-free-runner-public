name: P02 V2.5.30 Production Project Registry Closure V2

on:
  push:
    paths:
      - '.github/workflows/p02-v2530-production-project-registry-closure-v2-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_MAIN: f9bcfc3173be6db3845bcf287aeb3a737711ccda
      AUTH_BRANCH: closure/p02-v2.5.30-production-20260828-1720
      AUTH_HEAD: 82b3b474290d5a51b17bac62a9034dd7ba82ad93
    steps:
      - uses: actions/checkout@v4
      - name: Patch only P02 project registry authority
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:${TOKEN}@github.com/llhzx2018/vf-library.git" product >/dev/null 2>&1
          cd product
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          git checkout "$AUTH_BRANCH"
          test "$(git rev-parse HEAD)" = "$AUTH_HEAD"
          jq '.status="V2.5.30_PRODUCTION_VERIFIED_CLOSED"
            | .as_of="2026-08-28T17:19:00+08:00"
            | .production_truth={"current_version":"2.5.30","latest_version":"2.5.30","current_schema":2401,"evidence":"OWNER_AUTHENTICATED_SYSTEM_UPDATE_SCREENSHOT_2026_08_28_1719","evidence_observed_at":"2026-08-28T17:19:00+08:00","update_status":"UP_TO_DATE","authenticated_admin_session":"PASS","application_shell":"PASS","system_update_page":"PASS_CURRENT_EQUALS_LATEST_V2.5.30","version_footer":"PASS_V2.5.30","upgrade_executor":"OWNER","production_write_by_agent":"NO"}
            | .v2_5_30_closure={"result":"PASS","formal_gate_run":33158085181,"formal_gate_job":98805590903,"formal_artifact":9680438872,"release_tag":"v2.5.30","release_id":378373541,"product_identity":"d0f3d4f0f65400c5ca4868df844bbc4684b7cd8a","source_tree":"c029838309606ceec49c168d8d60fb8e83496604","main_merge":"f9bcfc3173be6db3845bcf287aeb3a737711ccda","publication_run":33158628462,"publication_job":98807386126,"core_updates_main":"17a74caa3074e6400c5c8c24cfddbce959ed9cb8","update_asset":"VF_Library_V2.5.30_UPDATE.zip","update_bytes":363823,"update_sha256":"eb151d6a2348b68758374038db97f54d6aeed0fd0b505efe208df9081f8d59fc","owner_production_readback":"PASS_CURRENT_EQUALS_LATEST_V2.5.30","schema":2401,"production_write_by_agent":"NO"}
            | .current_phase="V2.5.30_FINAL_CLOSED"
            | .next_gate="NORMAL_OPERATIONS"
            | .project_failure="NONE"
            | .project_block="NONE"' VF_PROJECT.json > VF_PROJECT.json.tmp
          mv VF_PROJECT.json.tmp VF_PROJECT.json
          python3 -m json.tool VF_PROJECT.json >/dev/null
          mapfile -t changed < <(git diff --name-only "$BASE_MAIN"..HEAD; git diff --name-only) 
          printf '%s\n' "${changed[@]}" | sort -u > /tmp/changed
          test "$(wc -l < /tmp/changed)" = '2'
          grep -Fxq 'VF_PROJECT.json' /tmp/changed
          grep -Fxq 'docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json' /tmp/changed
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json
          git commit -m 'docs(P02): close V2.5.30 production registry'
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/llhzx2018/vf-library.git"
          git push origin "$AUTH_BRANCH"
          echo "P02_V2530_AUTH_HEAD=$(git rev-parse HEAD)"
          echo P02_V2530_PROJECT_REGISTRY_CLOSURE=PASS
          echo PRODUCTION_WRITE_BY_AGENT=NO
