name: P04 V2.8.11 Publication

on:
  push:
    paths:
      - '.github/workflows/p04-v2811-publication-20260828.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-infra
      VERIFIED_SOURCE: cab41a436126ccfb050ba37642ffc7a7c87953e6
      RELEASE_SOURCE: d6f1e0660ba859d160bc3393cc281bcbe186c779
      FORMAL_RUN: 33164572288
      FORMAL_ARTIFACT: P04-V2.8.11-FINAL-R2-cab41a436126ccfb050ba37642ffc7a7c87953e6
      TAG: v2.8.11

    steps:
      - uses: actions/checkout@v4

      - name: Publish exact verified release and update channel
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/p04-v2811-publish"
          mkdir -p "$ROOT/artifact" "$ROOT/assets"

          gh run download "$FORMAL_RUN" -R llhzx2018/core-free-runner-public -n "$FORMAL_ARTIFACT" --dir "$ROOT/artifact"
          FULL_SRC="$(find "$ROOT/artifact" -type f -name 'VF_Infra_V2.8.11_FULL.zip' -print -quit)"
          UPDATE_SRC="$(find "$ROOT/artifact" -type f -name 'VF_Infra_V2.8.11_UPDATE.zip' -print -quit)"
          REPORT_SRC="$(find "$ROOT/artifact" -type f -name 'browser-report.json' -print -quit)"
          test -n "$FULL_SRC" -a -n "$UPDATE_SRC" -a -n "$REPORT_SRC"
          cp "$FULL_SRC" "$ROOT/assets/VF_Infra_V2.8.11_FULL.zip"
          cp "$UPDATE_SRC" "$ROOT/assets/VF_Infra_V2.8.11_UPDATE.zip"
          cp "$REPORT_SRC" "$ROOT/assets/browser-report.json"
          test "$(jq -r '.status' "$ROOT/assets/browser-report.json")" = PASS

          cd "$ROOT/assets"
          sha256sum VF_Infra_V2.8.11_FULL.zip VF_Infra_V2.8.11_UPDATE.zip > RELEASE_SHA256SUMS.txt
          FULL_SHA="$(sha256sum VF_Infra_V2.8.11_FULL.zip | awk '{print $1}')"
          UPDATE_SHA="$(sha256sum VF_Infra_V2.8.11_UPDATE.zip | awk '{print $1}')"
          UPDATE_BYTES="$(stat -c %s VF_Infra_V2.8.11_UPDATE.zip)"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCT_REPO}.git" "$ROOT/product" >/dev/null 2>&1
          cd "$ROOT/product"
          test "$(git rev-parse origin/main)" = "$RELEASE_SOURCE"
          git cat-file -e "$VERIFIED_SOURCE^{commit}"
          git cat-file -e "$RELEASE_SOURCE^{commit}"
          test "$(git show "$VERIFIED_SOURCE:VERSION" | tr -d '\r\n')" = '2.8.11'
          test "$(git show "$RELEASE_SOURCE:VERSION" | tr -d '\r\n')" = '2.8.11'
          VERIFIED_TREE="$(git show -s --format=%T "$VERIFIED_SOURCE")"
          PRODUCT_TREE="$(git show -s --format=%T "$RELEASE_SOURCE")"
          test "$VERIFIED_TREE" = "$PRODUCT_TREE"
          git diff --quiet "$VERIFIED_SOURCE" "$RELEASE_SOURCE" -- .
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then echo P04_V2811_TAG_ALREADY_EXISTS; exit 31; fi

          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git tag "$TAG" "$RELEASE_SOURCE"
          git push origin "refs/tags/$TAG"

          cd "$ROOT/assets"
          cat > release-notes.md <<'MD'
          # P04 · VF Infra V2.8.11

          Common Product Baseline V2 的人类可读运维界面正式发布。

          - 设置区正式拆分为 5 个独立维护入口：系统信息 / 系统基线 / 在线升级 / 备份与恢复 / 运行健康。
          - 系统基线首屏改为管理员结论、需要关注、5 个工作域概览；Runtime 参数与证据来源默认折叠在技术详情。
          - Common Baseline V2 继续保持 15 / 15 Required Domains，LOGGING PASS，DRIFT=0 / UNKNOWN=0。
          - 修复设置导航在异步 Shell / Overlay 并存时的 DOM 重建竞态，桌面与移动端路由稳定性已真实浏览器验证。
          - Schema 14 不变，Migration NONE；CommonBaselineV2Closure Resolver 未修改；Provider Authority 继续 READ_ONLY_FIRST。
          - V2.8.10 → V2.8.11 Source-Exact Atomic PASS；Fresh Install、deterministic FULL+UPDATE、Desktop/Mobile Browser 全部通过。
          - Production 不由发布动作自动修改，需 Owner 在 VF Infra 后台执行在线升级。

          Final Exact Source R2 Gate: Run 33164572288 / Job 98826800175 = PASS.
          Browser R2: Run 33164230554 / Job 98825698054 = PASS.
          Verified Candidate: cab41a436126ccfb050ba37642ffc7a7c87953e6
          Release Source (tree-identical merge commit): d6f1e0660ba859d160bc3393cc281bcbe186c779
          MD

          gh release create "$TAG" VF_Infra_V2.8.11_FULL.zip VF_Infra_V2.8.11_UPDATE.zip RELEASE_SHA256SUMS.txt \
            -R "$PRODUCT_REPO" --title 'VF Infra V2.8.11' --notes-file release-notes.md

          RELEASE_JSON="$(gh api "repos/${PRODUCT_REPO}/releases/tags/${TAG}")"
          RELEASE_ID="$(jq -r '.id' <<<"$RELEASE_JSON")"
          RELEASED_AT="$(jq -r '.published_at' <<<"$RELEASE_JSON")"
          UPDATE_ID="$(jq -r '.assets[]|select(.name=="VF_Infra_V2.8.11_UPDATE.zip")|.id' <<<"$RELEASE_JSON")"
          REMOTE_UPDATE_BYTES="$(jq -r '.assets[]|select(.name=="VF_Infra_V2.8.11_UPDATE.zip")|.size' <<<"$RELEASE_JSON")"
          REMOTE_UPDATE_DIGEST="$(jq -r '.assets[]|select(.name=="VF_Infra_V2.8.11_UPDATE.zip")|.digest' <<<"$RELEASE_JSON")"
          test "$REMOTE_UPDATE_BYTES" = "$UPDATE_BYTES"
          test "$REMOTE_UPDATE_DIGEST" = "sha256:$UPDATE_SHA"
          test "$(gh api "repos/${PRODUCT_REPO}/git/ref/tags/${TAG}" --jq '.object.sha')" = "$RELEASE_SOURCE"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-updates.git" "$ROOT/core-updates" >/dev/null 2>&1
          cd "$ROOT/core-updates"
          python3 - "$RELEASE_ID" "$RELEASED_AT" "$UPDATE_ID" "$UPDATE_BYTES" "$UPDATE_SHA" "$PRODUCT_TREE" <<'PY'
          import json,sys
          from pathlib import Path
          release_id=int(sys.argv[1]); released_at=sys.argv[2]; asset_id=int(sys.argv[3]); asset_bytes=int(sys.argv[4]); asset_sha=sys.argv[5]; tree=sys.argv[6]
          p=Path('projects/P04.json')
          old=json.loads(p.read_text(encoding='utf-8'))
          assert old['project_id']=='P04' and old['target_version']=='2.8.10'
          d={
            'schema_version':'1.0','project_id':'P04','component_id':'APP','enabled':True,
            'target_version':'2.8.11','update_type':'ATOMIC','from_versions':['2.8.10'],
            'schema_from':'14','schema_to':'14','repository':'llhzx2018/vf-infra',
            'release_tag':'v2.8.11','release_name':'VF Infra V2.8.11','release_id':release_id,
            'release_product_commit':'d6f1e0660ba859d160bc3393cc281bcbe186c779','release_product_tree':tree,
            'asset_name':'VF_Infra_V2.8.11_UPDATE.zip','asset_id':asset_id,'asset_bytes':asset_bytes,'asset_sha256':asset_sha,
            'backup_required':True,'rollback_supported':True,'released_at':released_at,'minimum_php':'8.0.0',
            'notes':'V2.8.11 正式发布 Common Product Baseline V2 人类可读运维界面；5 个独立维护入口、OWNER Attention First、技术详情默认折叠。Schema 14，无 Migration；仅支持 V2.8.10 → V2.8.11 Atomic；Resolver 与 Provider Authority 均未改变。'
          }
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool projects/P04.json >/dev/null
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add projects/P04.json
          git commit -m 'release(P04): publish V2.8.11 update channel'
          git push origin main

          echo "P04_V2811_RELEASE_ID=$RELEASE_ID"
          echo "P04_V2811_UPDATE_ASSET_ID=$UPDATE_ID"
          echo "P04_V2811_FULL_SHA256=$FULL_SHA"
          echo "P04_V2811_UPDATE_SHA256=$UPDATE_SHA"
          echo "P04_V2811_UPDATE_BYTES=$UPDATE_BYTES"
          echo "P04_V2811_TAG_SOURCE=$RELEASE_SOURCE"
          echo "P04_V2811_PRODUCT_TREE=$PRODUCT_TREE"
          echo P04_V2811_PUBLICATION=PASS

      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: P04-V2.8.11-PUBLICATION-EVIDENCE
          path: |
            ${{ runner.temp }}/p04-v2811-publish/assets/RELEASE_SHA256SUMS.txt
            ${{ runner.temp }}/p04-v2811-publish/assets/release-notes.md
            ${{ runner.temp }}/p04-v2811-publish/assets/browser-report.json
          if-no-files-found: error
