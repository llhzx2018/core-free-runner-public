name: P05 V1.0.2 Human UI Final Exact Source Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p05-v102-human-ui-final-exact-source-gate-20260828.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vfseo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vfseo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EXACT_SOURCE: 557a9c72f8f9d8130a1dba77581b1d1ce340fb5f
      BASE_MAIN: 540ce8feae99d3451d0cc5597f5b231f077c7c9c
      TARGET_BRANCH: ui/p05-human-baseline-v102-20260828
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vfseo

    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact P05 candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.EXACT_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p05

      - name: Prepare Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: p05/package-lock.json

      - name: Exact source and UI-only scope fence
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p05
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE"
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXACT_SOURCE"
          test "$(tr -d '\r\n' < VERSION)" = '1.0.2'
          test "$(node -p "require('./package.json').version")" = '1.0.2'
          grep -Fq "APP_VERSION = '1.0.2'" src/server/version.ts
          grep -Fq 'SCHEMA_VERSION = 1' src/server/version.ts

          mapfile -t changed < <(git diff --name-only "$BASE_MAIN" "$EXACT_SOURCE")
          test "${#changed[@]}" -eq 7
          for file in \
            CHANGELOG.md VERSION VF_PROJECT.json package.json \
            src/client/CommonSystemCenter.tsx src/server/version.ts \
            tests/contract/common-system-human-ui.test.ts; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$file"
          done

          git diff --quiet "$BASE_MAIN" "$EXACT_SOURCE" -- \
            src/server/common-baseline-v2.ts src/server/common-system-v2.ts \
            src/server/database migrations install-cloudpanel.sh src/client/App.tsx src/client/main.tsx
          test "$(git rev-parse "$BASE_MAIN:src/server/common-baseline-v2.ts")" = "$(git rev-parse "$EXACT_SOURCE:src/server/common-baseline-v2.ts")"

          python3 - <<'PY'
          import json
          p=json.load(open('VF_PROJECT.json'))
          assert p['project_id']=='P05'
          assert p['version']=='1.0.2' and p['target_version']=='1.0.2'
          assert p['schema_version']==1
          assert p['production_version'] is None and p['production_deployment']=='NOT_DEPLOYED' and p['production_write']==0
          h=p['human_ui_exposure_v1_0_2']
          assert h['scope']=='HUMAN_READABLE_COMMON_BASELINE_UI_ONLY'
          assert h['canonical_maintenance_entries']==['系统信息','系统基线','在线升级','备份与恢复','运行健康']
          assert h['domains_chinese']==15 and h['resolver_change'] is False and h['schema_change'] is False and h['primary_ia_change'] is False
          assert h['production_state']=='NOT_DEPLOYED'
          PY
          git diff --check "$BASE_MAIN" "$EXACT_SOURCE"
          echo P05_V102_SOURCE_SCOPE=PASS

      - name: Full Node regression and build
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p05
          npm ci
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run test:contract
          npm run test:integration
          npm run build
          echo P05_V102_NODE_REGRESSION=PASS

      - name: Common Baseline V2 runtime contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p05
          node --input-type=module - <<'JS'
          import {resolveCommonBaselineV2} from './dist/src/server/common-baseline-v2.js';
          const c={
            sessionTtlSeconds:2592000,
            sessionIdleSeconds:604800,
            sessionAbsoluteSeconds:2592000,
            sessionCookieSeconds:2592000,
            stepUpWindowSeconds:900,
            displayTimezone:'Asia/Shanghai',
            locale:'zh-CN'
          };
          const r=resolveCommonBaselineV2(c,'sqlite');
          if(r.version!=='1.0.2'||r.schema!==1) throw new Error(JSON.stringify(r));
          if(r.results.length!==15||r.summary.pass!==14||r.summary.exception!==0||r.summary.drift!==0||r.summary.unknown!==0||r.summary.nA!==1||!r.summary.fullPass) throw new Error(JSON.stringify(r));
          const domains=r.results.map(x=>x.domain).sort();
          const expected=['API','AUTH','BACKUP','CACHE','DATA','FILE_UPLOAD','HEALTH','JOB','LOCALE','LOGGING','NOTIFICATION','TIME','UI_COMMON_STATES','UPDATE','VERSION'].sort();
          if(JSON.stringify(domains)!==JSON.stringify(expected)) throw new Error(JSON.stringify(domains));
          console.log('P05_V102_COMMON_BASELINE_V2=PASS');
          JS

      - name: Build deterministic V1.0.2 release set
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p05
          OUT="$RUNNER_TEMP/p05-v102-release"
          STAGE_A="$RUNNER_TEMP/p05-v102-stage-a"
          STAGE_B="$RUNNER_TEMP/p05-v102-stage-b"
          rm -rf "$OUT" "$STAGE_A" "$STAGE_B"; mkdir -p "$OUT" "$STAGE_A" "$STAGE_B"
          for STAGE in "$STAGE_A" "$STAGE_B"; do
            STAGE="$STAGE" python3 - <<'PY'
          import os,pathlib,shutil,subprocess
          root=pathlib.Path('.').resolve(); stage=pathlib.Path(os.environ['STAGE'])
          for raw in subprocess.check_output(['git','ls-files','-z']).split(b'\0'):
              if not raw: continue
              rel=raw.decode()
              if rel.startswith('.github/'): continue
              src=root/rel
              if not src.is_file(): continue
              dst=stage/rel; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(src,dst)
          shutil.copytree(root/'dist',stage/'dist',dirs_exist_ok=True)
          PY
          done
          diff -qr "$STAGE_A" "$STAGE_B"
          test "$(tr -d '\r\n' < "$STAGE_A/VERSION")" = '1.0.2'
          test -f "$STAGE_A/dist/src/server/index.js"
          test -f "$STAGE_A/install-cloudpanel.sh"
          test ! -d "$STAGE_A/node_modules"
          ! find "$STAGE_A" -type f \( -name '*.sqlite' -o -name '*.sqlite3' -o -name '.env' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .
          STAGE="$STAGE_A" OUT="$OUT" python3 - <<'PY'
          import hashlib,os,pathlib,shutil,zipfile
          stage=pathlib.Path(os.environ['STAGE']); out=pathlib.Path(os.environ['OUT'])
          full=out/'VF_SEO_V1.0.2_FULL.zip'
          with zipfile.ZipFile(full,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=True) as z:
              for p in sorted(x for x in stage.rglob('*') if x.is_file()):
                  rel=p.relative_to(stage).as_posix(); info=zipfile.ZipInfo(rel,date_time=(1980,1,1,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.create_system=3
                  info.external_attr=((0o100755 if rel=='install-cloudpanel.sh' or rel.startswith('bin/') else 0o100644)<<16)
                  z.writestr(info,p.read_bytes())
          update=out/'VF_SEO_V1.0.2_UPDATE.zip'; shutil.copyfile(full,update)
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          (out/'SHA256SUMS.txt').write_text(f'{sha(full)}  {full.name}\n{sha(update)}  {update.name}\n',encoding='utf-8')
          print('FULL_BYTES='+str(full.stat().st_size)); print('FULL_SHA256='+sha(full)); print('UPDATE_BYTES='+str(update.stat().st_size)); print('UPDATE_SHA256='+sha(update))
          PY
          (cd "$OUT" && sha256sum -c SHA256SUMS.txt)
          cmp "$OUT/VF_SEO_V1.0.2_FULL.zip" "$OUT/VF_SEO_V1.0.2_UPDATE.zip"
          echo P05_V102_ARTIFACT_BUILD=PASS

      - name: Real first install from V1.0.2 FULL
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/p05-v102-release"
          ROOT="$RUNNER_TEMP/p05-v102-first-install"
          APP="$ROOT/app"; HOME_DIR="$ROOT/home"
          rm -rf "$ROOT"; mkdir -p "$APP" "$HOME_DIR"
          unzip -q "$OUT/VF_SEO_V1.0.2_FULL.zip" -d "$APP"
          if ! command -v crontab >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq cron >/dev/null; fi
          export HOME="$HOME_DIR"
          export VF_INSTALL_PORT=19052
          printf '1\n19052\nhttps://seo.example.test\nadmin\nP05-V102-First-Install-Password-2026!\nP05-V102-First-Install-Password-2026!\n' | bash "$APP/install-cloudpanel.sh"
          ENV_FILE="$HOME/.config/vf-seo/runtime.env"; DB_FILE="$HOME/.local/share/vf-seo/vf-seo.sqlite3"
          test -f "$ENV_FILE" && test -f "$DB_FILE"
          test "$(stat -c '%a' "$ENV_FILE")" = '600'
          set -a; source "$ENV_FILE"; set +a
          cd "$APP"
          npm run verify:schema
          npm run verify:admin-ready
          curl -fsS -H 'x-forwarded-proto: https' -H 'host: app' 'http://127.0.0.1:19052/api/health' > "$ROOT/health.json"
          ROOT="$ROOT" node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          const h=JSON.parse(readFileSync(process.env.ROOT+'/health.json','utf8'));
          if(!h.ok||h.version!=='1.0.2'||h.schema!==1||h.databaseProvider!=='sqlite') throw new Error(JSON.stringify(h));
          JS
          node --input-type=module - <<'JS'
          import {resolveCommonBaselineV2} from './dist/src/server/common-baseline-v2.js';
          const n=k=>Number(process.env[k]);
          const c={sessionTtlSeconds:n('VF_SESSION_TTL_SECONDS'),sessionIdleSeconds:n('VF_SESSION_IDLE_SECONDS'),sessionAbsoluteSeconds:n('VF_SESSION_ABSOLUTE_SECONDS'),sessionCookieSeconds:n('VF_SESSION_COOKIE_SECONDS'),stepUpWindowSeconds:n('VF_STEP_UP_WINDOW_SECONDS'),displayTimezone:process.env.VF_DISPLAY_TIMEZONE,locale:process.env.VF_LOCALE};
          const r=resolveCommonBaselineV2(c,'sqlite');
          if(r.version!=='1.0.2'||r.results.length!==15||r.summary.pass!==14||r.summary.nA!==1||r.summary.drift!==0||r.summary.unknown!==0) throw new Error(JSON.stringify(r));
          JS
          pm2 restart vf-seo vf-seo-worker >/dev/null
          for _ in $(seq 1 60); do curl -fsS -H 'x-forwarded-proto: https' -H 'host: app' 'http://127.0.0.1:19052/api/health' >/dev/null 2>&1 && break; sleep .5; done
          npm run verify:admin-ready
          pm2 delete vf-seo vf-seo-worker >/dev/null 2>&1 || true
          echo P05_V102_FIRST_INSTALL=PASS

      - name: Install Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p05
          npm install --no-save --no-package-lock playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Human-readable maintenance browser gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p05
          ROOT="$RUNNER_TEMP/p05-v102-browser"
          mkdir -p "$ROOT"
          cat > .runner-p05-v102.html <<'HTML'
          <!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>P05 Human UI Gate</title></head><body><div id="root"></div><script type="module" src="/.runner-p05-v102.tsx"></script></body></html>
          HTML
          cat > .runner-p05-v102.tsx <<'TSX'
          import {StrictMode} from 'react';
          import {createRoot} from 'react-dom/client';
          import {CommonSystemCenter} from './src/client/CommonSystemCenter';
          createRoot(document.getElementById('root')!).render(<StrictMode><CommonSystemCenter/></StrictMode>);
          TSX
          npx vite --host 127.0.0.1 --port 19053 --strictPort >"$ROOT/vite.log" 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do curl -fsS 'http://127.0.0.1:19053/.runner-p05-v102.html' >/dev/null 2>&1 && break; sleep .1; done
          cat > .runner-p05-v102-browser.mjs <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const base='http://127.0.0.1:19053/.runner-p05-v102.html';
          const report={status:'FAIL',stage:'start',page_errors:[],console_errors:[],bad_responses:[],mobile_overflow:null};
          const baselineResults=[
            ['TIME','PASS'],['AUTH','PASS'],['UPDATE','PASS'],['BACKUP','PASS'],['DATA','PASS'],['API','PASS'],['JOB','PASS'],['NOTIFICATION','N_A'],['LOGGING','PASS'],['UI_COMMON_STATES','PASS'],['FILE_UPLOAD','PASS'],['HEALTH','PASS'],['VERSION','PASS'],['CACHE','PASS'],['LOCALE','PASS']
          ].map(([domain,state])=>({domain,state,reason:`raw ${domain} machine reason`,runtime:{machine:true}}));
          const payloads={
            '/api/auth/me':{csrfToken:'browser-gate'},
            '/api/system/branding':{branding:{siteName:'VF SEO',logoDataUrl:null,faviconDataUrl:null,version:1},limits:{logoBytes:786432,faviconBytes:131072}},
            '/api/system/info':{version:'1.0.2',schema:1,profile:'PERSONAL_SINGLE_ADMIN',databaseProvider:'sqlite',time:{displayTimezone:'Asia/Shanghai'},locale:'zh-CN',auth:{idleSeconds:604800,absoluteSeconds:2592000,cookieSeconds:2592000,stepUpWindowSeconds:900},stepUp:{recent:false,windowSeconds:900}},
            '/api/system/baseline':{report:{baseline:'VF-COMMON-PRODUCT-BASELINE@2.0',profile:'PERSONAL_SINGLE_ADMIN',version:'1.0.2',schema:1,summary:{pass:14,exception:0,drift:0,unknown:0,nA:1,fullPass:true},results:baselineResults}},
            '/api/system/update/status':{currentVersion:'1.0.2',updateAvailable:false,channel:'UPDATE_CHANNEL_NOT_PUBLISHED',credentialConfigured:false,execution:{phase:'IDLE'}},
            '/api/backups':{provider:'sqlite',productionReady:true,backups:[]},
            '/api/system/health':{process:'healthy',database:'healthy',version:'1.0.2',schema:1,uptimeSeconds:93784,latencyMs:12,checkedAt:'2026-08-28T11:00:00Z'}
          };
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1365,height:900}});
          const page=await context.newPage();
          page.on('pageerror',e=>report.page_errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')report.console_errors.push(m.text())});
          page.on('response',r=>{if(r.status()>=400)report.bad_responses.push({url:r.url(),status:r.status()})});
          await page.route('**/api/**',async route=>{
            const path=new URL(route.request().url()).pathname;
            const body=payloads[path]??{};
            await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(body)});
          });
          try{
            report.stage='open';
            await page.goto(base,{waitUntil:'networkidle'});
            await page.locator('.vf-common-launch').click();
            await page.locator('.vf-common-modal').waitFor({state:'visible'});
            const nav=page.locator('.vf-common-nav');
            const five=['系统信息','系统基线','在线升级','备份与恢复','运行健康'];
            for(const label of five){if(await nav.getByRole('button',{name:label,exact:true}).count()!==1)throw new Error('missing '+label)}
            report.stage='baseline';
            await nav.getByRole('button',{name:'系统基线',exact:true}).click();
            await page.getByText('系统关键规则正常',{exact:true}).waitFor({state:'visible'});
            await page.getByText('你需要关注',{exact:true}).waitFor({state:'visible'});
            if(await page.locator('.vf-common-row').count()!==15)throw new Error('baseline rows !=15');
            for(const label of ['时间与时区','登录与会话','日志与脱敏','版本与数据结构','语言与显示']){
              if(await page.getByText(label,{exact:true}).count()<1)throw new Error('missing human domain '+label)
            }
            if(await page.getByText('本项目不适用',{exact:true}).count()<1)throw new Error('N_A translation missing');
            const details=page.locator('details.vf-common-tech').first();
            if(await details.getAttribute('open')!==null)throw new Error('technical details open by default');
            await page.screenshot({path:process.env.RUNNER_TEMP+'/p05-v102-browser/desktop.png',fullPage:true});
            report.stage='other-tabs';
            for(const label of ['系统信息','在线升级','备份与恢复','运行健康']){
              await nav.getByRole('button',{name:label,exact:true}).click();
              await page.waitForTimeout(80);
            }
            report.stage='mobile';
            await page.setViewportSize({width:390,height:844});
            await nav.getByRole('button',{name:'系统基线',exact:true}).click();
            await page.waitForTimeout(100);
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
            report.mobile_overflow=overflow;
            if(overflow>2)throw new Error('mobile overflow '+overflow);
            await page.screenshot({path:process.env.RUNNER_TEMP+'/p05-v102-browser/mobile.png',fullPage:true});
            if(report.page_errors.length||report.console_errors.length||report.bad_responses.length)throw new Error(JSON.stringify(report));
            report.status='PASS';report.stage='done';
          }catch(e){report.error=String(e?.stack||e);}
          finally{fs.writeFileSync(process.env.RUNNER_TEMP+'/p05-v102-browser/report.json',JSON.stringify(report,null,2));await browser.close();}
          if(report.status!=='PASS')process.exit(2);
          JS
          node .runner-p05-v102-browser.mjs
          cat "$ROOT/report.json"
          echo P05_V102_BROWSER=PASS

      - name: Final exact-source verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p05
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXACT_SOURCE"
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          echo P05_V102_EXACT_SOURCE="$EXACT_SOURCE"
          echo P05_V102_SCHEMA=1
          echo P05_V102_COMMON_BASELINE_V2=PASS
          echo P05_V102_HUMAN_UI=PASS
          echo P05_V102_FIRST_INSTALL=PASS
          echo P05_V102_PRODUCTION=NOT_DEPLOYED
          echo P05_V102_MACHINE=PASS

      - name: Upload verified V1.0.2 evidence and release set
        uses: actions/upload-artifact@v4
        with:
          name: P05-V1.0.2-HUMAN-UI-FINAL-${{ env.EXACT_SOURCE }}
          path: |
            ${{ runner.temp }}/p05-v102-release/VF_SEO_V1.0.2_FULL.zip
            ${{ runner.temp }}/p05-v102-release/VF_SEO_V1.0.2_UPDATE.zip
            ${{ runner.temp }}/p05-v102-release/SHA256SUMS.txt
            ${{ runner.temp }}/p05-v102-browser/desktop.png
            ${{ runner.temp }}/p05-v102-browser/mobile.png
            ${{ runner.temp }}/p05-v102-browser/report.json
          if-no-files-found: error
          retention-days: 90
