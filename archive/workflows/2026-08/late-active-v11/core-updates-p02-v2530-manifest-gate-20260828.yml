name: core-updates P02 V2.5.30 Manifest Exact Source Gate

on:
  push:
    paths:
      - '.github/workflows/core-updates-p02-v2530-manifest-gate-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      CORE_UPDATES_SOURCE: 74ce3c4e5994eff771622b8c9b35f79bf57ecc70
      CORE_UPDATES_BASE: 8cbf4386c481e7fd658c0326cdaefa057da0b49e
      RELEASE_SOURCE: d0f3d4f0f65400c5ca4868df844bbc4684b7cd8a
      RELEASE_ID: '378373541'
      RELEASE_TAG: v2.5.30
      ASSET: VF_Library_V2.5.30_UPDATE.zip
      ASSET_BYTES: '363823'
      ASSET_SHA256: eb151d6a2348b68758374038db97f54d6aeed0fd0b505efe208df9081f8d59fc
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact core-updates source and fence base
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:${TOKEN}@github.com/llhzx2018/core-updates.git" updates >/dev/null 2>&1
          cd updates
          git fetch --no-tags origin "$CORE_UPDATES_SOURCE"
          git checkout --detach "$CORE_UPDATES_SOURCE"
          test "$(git rev-parse HEAD)" = "$CORE_UPDATES_SOURCE"
          test "$(git rev-parse HEAD^1)" = "$CORE_UPDATES_BASE"
          test "$(git diff --name-only "$CORE_UPDATES_BASE".."$CORE_UPDATES_SOURCE")" = 'projects/P02.json'
          echo CORE_UPDATES_P02_SOURCE_FENCE=PASS
      - name: Validate P02 manifest against repository JSON Schema
        run: |
          set -Eeuo pipefail
          python3 -m pip install --quiet jsonschema
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          root=Path('updates')
          schema=json.loads((root/'schemas/update-manifest-v1.schema.json').read_text())
          m=json.loads((root/'projects/P02.json').read_text())
          Draft202012Validator(schema,format_checker=FormatChecker()).validate(m)
          assert m['project_id']=='P02' and m['component_id']=='APP' and m['enabled'] is True
          assert m['current_version']=='2.5.29' and m['target_version']=='2.5.30'
          assert m['update_type']=='ATOMIC' and m['from_versions']==['2.5.29']
          assert m['schema_from']=='2401' and m['schema_to']=='2401'
          assert m['repository']=='llhzx2018/vf-library'
          assert m['release_tag']=='v2.5.30' and m['release_id']==378373541
          assert m['product_identity']=='d0f3d4f0f65400c5ca4868df844bbc4684b7cd8a'
          assert m['asset_name']=='VF_Library_V2.5.30_UPDATE.zip'
          assert m['asset_bytes']==363823
          assert m['asset_sha256']=='eb151d6a2348b68758374038db97f54d6aeed0fd0b505efe208df9081f8d59fc'
          assert m['backup_required'] is True and m['rollback_supported'] is True
          assert '33158085181' in m['notes']
          print('P02_V2530_MANIFEST_SCHEMA=PASS')
          PY
      - name: Verify exact Release tag and UPDATE asset
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-library/git/ref/tags/$RELEASE_TAG --jq '.object.sha')" = "$RELEASE_SOURCE"
          gh api "repos/llhzx2018/vf-library/releases/tags/$RELEASE_TAG" > /tmp/release.json
          test "$(jq -r '.id' /tmp/release.json)" = "$RELEASE_ID"
          test "$(jq -r '.draft' /tmp/release.json)" = false
          test "$(jq -r '.prerelease' /tmp/release.json)" = false
          test "$(jq --arg n "$ASSET" '[.assets[]|select(.name==$n)]|length' /tmp/release.json)" = 1
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' /tmp/release.json)" = "$ASSET_BYTES"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' /tmp/release.json)" = "sha256:$ASSET_SHA256"
          echo P02_V2530_RELEASE_ASSET_IDENTITY=PASS
      - name: core-updates PHP syntax and regression
        run: |
          set -Eeuo pipefail
          cd updates
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/core-lint.log
          php update-core/php/tests/run.php
          echo CORE_UPDATES_REGRESSION=PASS
      - name: Final result
        run: |
          echo P02_V2530_MANIFEST_EXACT_SOURCE_GATE=PASS
          echo PRODUCTION_WRITE=NO
