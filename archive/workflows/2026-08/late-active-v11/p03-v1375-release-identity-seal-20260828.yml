name: P03 V1.37.5 Release Identity Seal

on:
  push:
    paths:
      - '.github/workflows/p03-v1375-release-identity-seal-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_MAIN: 07b48eea3d43fb3bc93d1a7037137b6c9d5520e0
      INPUT_HEAD: 27e8e71cd82408f8e27d45250ee8970b901385a9
      BRANCH: ui/p03-common-baseline-human-readable-v1375-20260828
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, zip, curl, mbstring, sodium, fileinfo
          coverage: none
      - name: Seal exact V1.37.5 candidate identity
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:${TOKEN}@github.com/llhzx2018/vf-forge.git" product >/dev/null 2>&1
          cd product
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          git checkout "$BRANCH"
          test "$(git rev-parse HEAD)" = "$INPUT_HEAD"
          python3 - <<'PY'
          import json
          from pathlib import Path

          boot=Path('src/app/bootstrap.php'); s=boot.read_text(encoding='utf-8')
          assert s.count("define('VFAB_VERSION', '1.37.4');")==1
          boot.write_text(s.replace("define('VFAB_VERSION', '1.37.4');","define('VFAB_VERSION', '1.37.5');",1),encoding='utf-8')

          atomic=Path('scripts/build_atomic.py'); s=atomic.read_text(encoding='utf-8')
          assert s.count("TARGET_VERSION='1.37.4'")==1
          assert s.count("ALLOWED_SOURCES=['1.37.3']")==1
          s=s.replace("TARGET_VERSION='1.37.4'","TARGET_VERSION='1.37.5'",1)
          s=s.replace("ALLOWED_SOURCES=['1.37.3']","ALLOWED_SOURCES=['1.37.4']",1)
          atomic.write_text(s,encoding='utf-8')

          vp=Path('VF_PROJECT.json'); d=json.loads(vp.read_text(encoding='utf-8'))
          assert d['production_version']=='1.37.4'
          d['status']='V1.37.5 CANDIDATE / HUMAN-READABLE COMMON BASELINE UI'
          d['project_status']='CANDIDATE_VERIFIED_PENDING_FORMAL_GATE'
          d['lifecycle']='RELEASE_CANDIDATE'
          d['working_version']='1.37.5'; d['candidate_version']='1.37.5'; d['migration']='NONE'
          d['version_semantics']={'target':'1.37.5','change_class':'PATCH / COMMON BASELINE HUMAN-READABLE UI','allowed_source_versions':['1.37.4'],'schema_from':30,'schema_to':30,'database_migration':'NONE'}
          d['product_identity']={'installed_production_version':'1.37.4','candidate_version':'1.37.5','candidate_branch':'ui/p03-common-baseline-human-readable-v1375-20260828','candidate_source_commit':'PENDING_EXACT_SOURCE_SEAL','release_tag':'PENDING','release_asset':'VF_Forge_V1.37.5_UPDATE.zip','meaning':'V1.37.5 exposes the existing Common Product Baseline V2 as a human-readable administrator surface without creating shadow truth.'}
          d['release']={'installed_production_version':'1.37.4','candidate_version':'1.37.5','release_ready':'MACHINE_GATE_PENDING','release_tag':'PENDING','asset_name':'VF_Forge_V1.37.5_UPDATE.zip','core_updates':'PENDING','owner_upgrade_authorized':False,'production_write':False,'owner_upgrade_completed':False}
          d['git_alignment']={'mode':'V1.37.5 CANDIDATE','production_main_version':'1.37.4','working_candidate_version':'1.37.5','force_push':False,'history_rewrite':False}
          d['current_phase']='V1.37.5 HUMAN BASELINE UI FORMAL GATE'
          d['current_verdict']='CANDIDATE / SOURCE GATE PASS / FORMAL GATE PENDING'
          d['runtime_change']='UI EXPOSURE ONLY / COMMON BASELINE RESOLVER UNCHANGED'
          d['version_change']='1.37.4 -> 1.37.5 CANDIDATE'
          d['production_write']='NO'; d['next_action']='V1.37.5 FORMAL MACHINE GATE'
          vp.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          ch=Path('CHANGELOG.md'); text=ch.read_text(encoding='utf-8')
          entry='''## 1.37.5 - 2026-08-28\n- 将 Common Product Baseline V2 从机器参数表改为管理员可读的系统基线：首页先给出“当前是否正常 / 你需要关注”，规则按中文用途分组，原始证据折叠为技术详情。\n- 设置中心显式提供系统信息、系统基线、在线升级、备份与恢复、运行健康五个统一维护入口。\n- “运行环境诊断”统一命名为“运行健康”；Runtime Resolver、Schema 30 与公共规范计算逻辑不变。\n- V1.37.4 → V1.37.5 为无 Schema 迁移的 Patch / Atomic 更新。\n\n'''
          if '## 1.37.5 - 2026-08-28' not in text:
              ch.write_text(entry+text,encoding='utf-8')
          PY
          test "$(cat VERSION)" = '1.37.5'
          grep -Fq "define('VFAB_VERSION', '1.37.5');" src/app/bootstrap.php
          grep -Fq "TARGET_VERSION='1.37.5'" scripts/build_atomic.py
          grep -Fq "ALLOWED_SOURCES=['1.37.4']" scripts/build_atomic.py
          python3 -m json.tool VF_PROJECT.json >/dev/null
          python3 tests/unit/common_baseline_ui_exposure_contract_test.py
          python3 scripts/repo_health.py .
          python3 tests/integration/source_integrity_test.py
          python3 tests/unit/schema_contract_test.py
          find src public -type f -name '*.php' -print0 | xargs -0 -n1 php -l >"$RUNNER_TEMP/p03-v1375-php-lint.log"
          node --check public/assets/app.js
          git config user.name VictorForge; git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md VF_PROJECT.json scripts/build_atomic.py src/app/bootstrap.php
          git commit -m 'release(P03): seal V1.37.5 candidate identity'
          NEW=$(git rev-parse HEAD)
          python3 - "$NEW" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path('VF_PROJECT.json');d=json.loads(p.read_text(encoding='utf-8'));d['product_identity']['candidate_source_commit']=sys.argv[1];p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git add VF_PROJECT.json
          git commit --amend --no-edit
          FINAL=$(git rev-parse HEAD)
          # Candidate SHA is self-referential in VF_PROJECT, so bind exact identity through the commit/tree evidence rather than forcing a SHA fixed point.
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/llhzx2018/vf-forge.git"
          git push origin "$BRANCH"
          echo "P03_V1375_EXACT_SOURCE=$FINAL"
          echo P03_V1375_RELEASE_IDENTITY_SEAL=PASS
          echo PRODUCTION_WRITE=NO
