name: P04 V2.8.10 Final Exact Source Gate
on:
  push:
    paths:
      - '.github/workflows/p04-v2810-final-exact-gate-20260828.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      FINAL_SOURCE: 15adb7a52d6a5658aafc6ff51e8ec7c4dfca55c2
      MACHINE_SOURCE: 8f91cc4c7bd9fadf6398eda60bcd2c2283a02d98
      BASE_MAIN: 45f35274284071649f6a3103d3a9e4383da90083
      TARGET_BRANCH: release/p04-v2.8.10-common-baseline-v2-20260828
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: ${{ env.FINAL_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify final exact source and formal evidence binding
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_SOURCE"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$FINAL_SOURCE"
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          test "$(tr -d '\r\n' < VERSION)" = '2.8.10'
          mapfile -t authority_delta < <(git diff --name-only "$MACHINE_SOURCE" "$FINAL_SOURCE")
          test "${#authority_delta[@]}" -eq 1
          test "${authority_delta[0]}" = 'VF_PROJECT.json'
          test -z "$(git diff --name-only "$MACHINE_SOURCE" "$FINAL_SOURCE" -- src public database config scripts VERSION)"
          python3 - <<'PY'
          import json
          d=json.load(open('VF_PROJECT.json',encoding='utf-8'))
          assert d['project_id']=='P04'
          assert d['version']=='2.8.10' and d['production_version']=='2.8.9' and d['candidate_version']=='2.8.10'
          assert d['schema']==14 and d['schema_version_contract']==14
          c=d['release_source_contract']['candidate_evidence']
          assert c['status']=='PASS'
          assert c['tested_source']=='8f91cc4c7bd9fadf6398eda60bcd2c2283a02d98'
          assert c['run']==33142877248 and c['job']==98757392839 and c['artifact']==9674628624
          assert c['common_product_baseline_v2']=='PASS' and c['required_domains']==15 and c['logging']=='PASS'
          assert c['drift']==0 and c['unknown']==0 and c['atomic_source_exact_2_8_9_to_2_8_10']=='PASS'
          assert d['release']['release_ready'] is True and d['release']['production_write'] is False
          assert d['production_truth']['installed_version']=='2.8.9' and d['production_truth']['production_write']=='NO'
          print('P04_V2810_AUTHORITY_BINDING=PASS')
          PY
          python3 -m py_compile scripts/build-v2810-release-tree.py scripts/build-v2810-update-release.py
          test -f src/app/CommonBaselineV2Closure.php
          grep -Fq "'LOGGING'" src/app/CommonBaselineV2Closure.php
          echo P04_V2810_FINAL_EXACT_SOURCE="$FINAL_SOURCE"
          echo P04_V2810_MACHINE_SOURCE="$MACHINE_SOURCE"
          echo P04_V2810_FINAL_EXACT_GATE=PASS
          echo P04_V2810_RELEASE=NO
          echo P04_V2810_PRODUCTION=NO
