name: P05 V1.0.1 Authority Bind
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p05-v101-authority-bind-20260828.yml'
permissions:
  contents: read
jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bind exact machine evidence without claiming Production
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:${TOKEN}@github.com/llhzx2018/vf-seo.git" p05 >/dev/null 2>&1
          cd p05
          git checkout release/p05-v1.0.1-common-baseline-v2-20260828
          test "$(git rev-parse HEAD)" = "00a724587c041130c0e81e0e45ef876413fb2916"
          test "$(git rev-parse origin/main)" = "ec613be42f18bd0456a7e5f5d9c0bbbe25a6e22c"
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('VF_PROJECT.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['status']='V1.0.1_FORMAL_RELEASE_CANDIDATE_DEPLOYMENT_READY_PRODUCTION_NOT_DEPLOYED'
          d['version']='1.0.1'
          d['target_version']='1.0.1'
          d['working_version']='1.0.1'
          d['production_version']=None
          d['formal_release']='v1.0.1_PENDING_PUBLICATION'
          d['formal_release_state']='CANDIDATE_MACHINE_PASS_PENDING_PUBLICATION'
          d['formal_release_candidate_commit']='00a724587c041130c0e81e0e45ef876413fb2916'
          d['formal_release_asset']='VF_SEO_V1.0.1_FULL.zip'
          d['formal_release_asset_bytes']=469642
          d['formal_release_asset_sha256']='ac36676612163c10006515eaa4f3265d01351425b4121c53be6d2bbe2dd92a0c'
          d['deployment_readiness']={
            'state':'PASS',
            'production_state':'NOT_DEPLOYED',
            'production_verification':'NOT_APPLICABLE_UNTIL_FIRST_DEPLOYMENT',
            'exact_source':'00a724587c041130c0e81e0e45ef876413fb2916',
            'schema':1,
            'common_product_baseline':'VF-COMMON-PRODUCT-BASELINE@2.0',
            'regression_evidence':{
              'repository':'llhzx2018/core-free-runner-public',
              'run':33144186906,
              'job':98761515146,
              'state':'PASS_SCOPE_REGRESSION'
            },
            'first_install_evidence':{
              'repository':'llhzx2018/core-free-runner-public',
              'workflow':'.github/workflows/p05-v101-first-install-artifact-gate-v2-20260828.yml',
              'run':33144311553,
              'job':98761893522,
              'artifact':9675163136,
              'state':'PASS',
              'first_install':'PASS',
              'sqlite_migration':'PASS',
              'admin_bootstrap':'PASS',
              'pm2_server_worker':'PASS',
              'health':'PASS',
              'restart_persistence':'PASS',
              'baseline_v2':'PASS'
            },
            'full_asset':{'name':'VF_SEO_V1.0.1_FULL.zip','bytes':469642,'sha256':'ac36676612163c10006515eaa4f3265d01351425b4121c53be6d2bbe2dd92a0c'},
            'update_asset':{'name':'VF_SEO_V1.0.1_UPDATE.zip','bytes':469642,'sha256':'ac36676612163c10006515eaa4f3265d01351425b4121c53be6d2bbe2dd92a0c'}
          }
          d['candidate_authorization']='USER_AUTHORIZED_FOR_V1.0.1_FORMAL_RELEASE'
          d['release_authorization']='USER_AUTHORIZED_V1.0.1_FORMAL_RELEASE'
          d['production_deployment']='NOT_DEPLOYED'
          d['production_write']=0
          d['production_main_promotion']='NOT_APPLICABLE_NO_PRODUCTION_RUNTIME'
          d['owner_real_use_review']='NOT_APPLICABLE_UNTIL_FIRST_DEPLOYMENT'
          d['owner_real_use_pass']='NOT_APPLICABLE_UNTIL_FIRST_DEPLOYMENT'
          d['production_deployment_authorization']='NOT_APPLICABLE_UNTIL_FIRST_DEPLOYMENT'
          d['next_action']='FINAL_EXACT_GATE -> RELEASE_V1.0.1 -> PRODUCTION_NOT_DEPLOYED -> P06'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          test "$(git diff --name-only)" = 'VF_PROJECT.json'
          git diff --check
          python3 - <<'PY'
          import json
          d=json.load(open('VF_PROJECT.json'))
          assert d['status']=='V1.0.1_FORMAL_RELEASE_CANDIDATE_DEPLOYMENT_READY_PRODUCTION_NOT_DEPLOYED'
          assert d['production_version'] is None and d['production_deployment']=='NOT_DEPLOYED' and d['production_write']==0
          r=d['deployment_readiness']; assert r['state']=='PASS' and r['production_state']=='NOT_DEPLOYED'
          assert r['exact_source']=='00a724587c041130c0e81e0e45ef876413fb2916'
          assert r['first_install_evidence']['run']==33144311553 and r['first_install_evidence']['job']==98761893522 and r['first_install_evidence']['artifact']==9675163136
          assert r['full_asset']['sha256']=='ac36676612163c10006515eaa4f3265d01351425b4121c53be6d2bbe2dd92a0c'
          assert d['formal_release']=='v1.0.1_PENDING_PUBLICATION'
          PY
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json
          git commit -m 'docs(P05): bind V1.0.1 deployment-readiness evidence'
          git push origin HEAD:release/p05-v1.0.1-common-baseline-v2-20260828
          echo P05_V101_AUTHORITY_BIND=PASS
