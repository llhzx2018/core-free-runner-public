name: P03 V1.37.5 Production Authority Exact Source Gate

on:
  push:
    paths:
      - '.github/workflows/p03-v1375-production-authority-gate-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      P03_AUTHORITY_SOURCE: 10edf4cf3b24a671d2e77577b259f38fe8a5f1da
      P03_AUTHORITY_BASE: 010af1daebd0a5654fba6d799b5a65af2a243ab0
      P03_RELEASE_SOURCE: f2865c97f80bd8052dd47d76ef08c626c044e669
      P03_RELEASE_TAG: v1.37.5
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact P03 Production Authority source and fence scope
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:${TOKEN}@github.com/llhzx2018/vf-forge.git" p03 >/dev/null 2>&1
          cd p03
          git fetch --no-tags origin "$P03_AUTHORITY_SOURCE"
          git checkout --detach "$P03_AUTHORITY_SOURCE"
          test "$(git rev-parse HEAD)" = "$P03_AUTHORITY_SOURCE"
          test "$(git rev-parse HEAD^1)" = "$P03_AUTHORITY_BASE"
          test "$(git diff --name-only "$P03_AUTHORITY_BASE".."$P03_AUTHORITY_SOURCE")" = 'VF_PROJECT.json'
          echo P03_V1375_PRODUCTION_AUTHORITY_SOURCE_FENCE=PASS

      - name: Validate Production Authority truth
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('p03/VF_PROJECT.json').read_text())
          assert d['project_id']=='P03'
          assert d['status']=='V1.37.5 PRODUCTION / HUMAN-READABLE COMMON BASELINE UI CURRENT'
          assert d['project_status']=='PRODUCTION_CURRENT'
          assert d['lifecycle']=='PRODUCTION'
          assert d['production_version']=='1.37.5'
          assert d['working_version']=='1.37.5'
          assert d['schema_version']==30 and d['migration']=='NONE'
          pi=d['product_identity']
          assert pi['installed_production_version']=='1.37.5'
          assert pi['candidate_source_commit']=='f2865c97f80bd8052dd47d76ef08c626c044e669'
          assert pi['release_tag']=='v1.37.5'
          pt=d['production_truth']
          assert pt['installed_version']=='1.37.5' and pt['installed_schema']==30
          assert pt['production_upgrade_to_1_37_5']=='OWNER_COMPLETED / VERIFIED'
          assert pt['production_write']=='OWNER_EXECUTED / AGENT_NO'
          assert 'V1.37.5' in pt['evidence'] and 'footer V1.37.5' in pt['evidence']
          cv=d['verification']['current_release_verification']
          assert cv['version']=='1.37.5' and cv['production_version']=='1.37.5'
          assert cv['production_upgrade']=='OWNER_COMPLETED / VERIFIED / SCREENSHOT 2026-08-28'
          assert cv['production_write']=='OWNER_EXECUTED / AGENT_NO'
          r=d['release']
          assert r['installed_production_version']=='1.37.5'
          assert r['release_ready']=='PUBLISHED / OWNER UPGRADED / CURRENT'
          assert r['owner_upgrade_completed'] is True
          assert r['owner_upgrade_verified_at']=='2026-08-28'
          assert d['authority_reconciliation']['status']=='POST_RELEASE_RECONCILED / PRODUCTION_CLOSED'
          assert d['git_alignment']['mode']=='PRODUCTION CURRENT'
          assert d['git_alignment']['production_main_version']=='1.37.5'
          assert d['current_phase']=='V1.37.5 PRODUCTION CURRENT'
          assert d['current_verdict']=='PRODUCTION CURRENT / OWNER VERIFIED'
          assert d['production_real_use_pass']=='V1.37.5 RUNNING / OWNER VERIFIED'
          assert d['production_write']=='OWNER_EXECUTED / AGENT_NO'
          assert d['next_action']=='NONE / P03 PRODUCTION CLOSED'
          print('P03_V1375_PRODUCTION_AUTHORITY_JSON=PASS')
          PY

      - name: Verify immutable V1.37.5 Release and current update channel
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-forge/git/ref/tags/$P03_RELEASE_TAG --jq '.object.sha')" = "$P03_RELEASE_SOURCE"
          gh api repos/llhzx2018/vf-forge/releases/tags/$P03_RELEASE_TAG >/tmp/release.json
          test "$(jq -r '.draft' /tmp/release.json)" = false
          test "$(jq -r '.prerelease' /tmp/release.json)" = false
          gh api repos/llhzx2018/core-updates/contents/projects/P03.json -H 'Accept: application/vnd.github.raw+json' >/tmp/p03-update.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/p03-update.json'))
          assert d['project_id']=='P03'
          assert d['target_version']=='1.37.5'
          assert d['from_versions']==['1.37.4']
          assert d['schema_from']==d['schema_to']=='30'
          assert d['release_tag']=='v1.37.5'
          assert d['product_identity']=='f2865c97f80bd8052dd47d76ef08c626c044e669'
          print('P03_V1375_RELEASE_AND_UPDATE_CHANNEL=PASS')
          PY

      - name: Final result
        run: |
          echo P03_V1375_PRODUCTION_AUTHORITY_EXACT_SOURCE_GATE=PASS
          echo PRODUCTION_WRITE_BY_AGENT=NO
