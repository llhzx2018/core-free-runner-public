name: P05 V1.0.2 Updater Tool Probe Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p05-v102-updater-tool-probe-fix-20260828.yml'

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE: 809f329ae15215eea2329ad5b3a88ea9fc9b497e
      TARGET_BRANCH: fix/p05-updater-version-identity-v102-20260828
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact P05 fix branch
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.EXPECTED_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: p05
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fix unzip version probe and push
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p05
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_SOURCE"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('bin/vf-seo-updater.mjs')
          s=p.read_text(encoding='utf-8')
          old="""function requireTool(name) {
            const found = spawnSync(name, ['--version'], { stdio: 'ignore' });
            if (found.error || found.status !== 0) throw new Error(`UPDATE_TOOL_MISSING_${name.toUpperCase()}`);
          }"""
          new="""function requireTool(name) {
            const args = name === 'unzip' ? ['-v'] : ['--version'];
            const found = spawnSync(name, args, { stdio: 'ignore' });
            if (found.error || found.status !== 0) throw new Error(`UPDATE_TOOL_MISSING_${name.toUpperCase()}`);
          }"""
          assert s.count(old)==1, 'expected exact requireTool block'
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          test "$(git status --porcelain | wc -l)" -eq 1
          test "$(git status --porcelain | sed -E 's/^.. //')" = 'bin/vf-seo-updater.mjs'
          unzip -v >/dev/null
          npm ci
          npm run test:contract
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add bin/vf-seo-updater.mjs
          git commit -m 'fix(P05): probe unzip with supported flag'
          NEW_SOURCE="$(git rev-parse HEAD)"
          git push origin "HEAD:$TARGET_BRANCH"
          echo P05_V102_UPDATER_TOOL_PROBE_FIX=PASS
          echo P05_V102_UPDATER_TOOL_PROBE_SOURCE="$NEW_SOURCE"
