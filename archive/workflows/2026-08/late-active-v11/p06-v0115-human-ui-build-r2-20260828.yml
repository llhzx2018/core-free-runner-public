name: P06 V0.1.15 Human Baseline UI Build R2

on:
  push:
    paths:
      - '.github/workflows/p06-v0115-human-ui-build-r2-20260828.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BRANCH: ui/p06-human-baseline-v0115-20260828
      START_HEAD: 528c0f8afdf670c7ac84190954ac499631b2b678
      BASE_MAIN: d689b79a6f1d98f0bf5bccba438f3c9a74077782

    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact P06 candidate branch
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-press
          ref: ${{ env.BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: p06

      - name: Complete candidate files
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p06 rev-parse HEAD)" = "$START_HEAD"
          test "$(git -C p06 rev-parse origin/main)" = "$BASE_MAIN"
          python3 scripts/p06-v0115-complete.py p06
          test "$(tr -d '\r\n' < p06/VERSION)" = '0.1.15'
          python3 -m json.tool p06/VF_PROJECT.json >/dev/null
          php -l p06/src/Http/Studio/SystemBaselineController.php
          php -l p06/bin/common-baseline-human-ui-self-test.php
          php p06/bin/common-baseline-human-ui-self-test.php
          git -C p06 diff --check
          test -z "$(git -C p06 diff --name-only "$BASE_MAIN" -- src/Application/Operations/CommonBaselineV2.php database)"
          echo P06_V0115_PRECOMMIT=PASS

      - name: Commit exact remaining scope
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p06
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add VERSION VF_PROJECT.json CHANGELOG.md public/assets/maintenance.css bin/common-baseline-human-ui-self-test.php
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '5'
          git commit -m 'feat(P06): complete V0.1.15 human baseline UI candidate'
          git push origin "HEAD:$BRANCH"
          echo P06_V0115_CANDIDATE_PUSH=PASS
