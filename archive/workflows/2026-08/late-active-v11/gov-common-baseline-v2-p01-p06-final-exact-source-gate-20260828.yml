name: GOV Common Baseline V2 P01-P06 Final Exact Source Gate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gov-common-baseline-v2-p01-p06-final-exact-source-gate-20260828.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOV_FINAL_SOURCE: 0bb3d7546e8957bb0b595b409bad9c4de271f019
      GOV_RUNTIME_CANDIDATE: 76db25f21f2b475e7d1aec352de77bbf326139f2
      GOV_BASE: 827318198e26a4b8bae06b7e8570a14f54678c84
      GOV_BRANCH: governance/common-product-baseline-v2-cross-project-closure-20260828
      P01_SHA: 6b774b6f46c26b94ea83f5de8754f4db556447a5
      P02_SHA: a3e42bfecd1214f68e59eb20eba498f0e8ae0dca
      P03_SHA: cc9a6da445240534016d08e148aa8a28c11be241
      P04_SHA: 45f35274284071649f6a3103d3a9e4383da90083
      P05_SHA: ec613be42f18bd0456a7e5f5d9c0bbbe25a6e22c
      P06_SHA: 44def40930019b1c597e404fa49c98d4ceb2ac42
    steps:
      - name: Checkout final exact GOV-DOC source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.GOV_FINAL_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: gov
      - name: Final GOV source and authority fence
        shell: bash
        run: |
          set -Eeuo pipefail
          cd gov
          test "$(git rev-parse HEAD)" = "$GOV_FINAL_SOURCE"
          test "$(git rev-parse origin/$GOV_BRANCH)" = "$GOV_FINAL_SOURCE"
          test "$(git rev-parse origin/main)" = "$GOV_BASE"
          test -z "$(git diff --name-only "$GOV_BASE" "$GOV_FINAL_SOURCE" -- governance/agent/VF_COMMON_PRODUCT_BASELINE_AUTHORITY.json governance/agent/VF_COMMON_PRODUCT_BASELINE_V2_REMEDIATION_SET_P01_P06.json)"
          mapfile -t changed < <(git diff --name-only "$GOV_BASE" "$GOV_FINAL_SOURCE")
          test "${#changed[@]}" -eq 4
          for p in \
            governance/agent/evidence/VF_COMMON_PRODUCT_BASELINE_V2_P01_P06_RUNTIME_CLOSURE_20260828.json \
            governance/agent/evidence/VF_COMMON_PRODUCT_BASELINE_V2_P01_P06_RUNTIME_CLOSURE_20260828.md \
            governance/agent/evidence/VF_COMMON_PRODUCT_BASELINE_V2_P01_P06_RUNTIME_CLOSURE_FINAL_20260828.json \
            governance/agent/evidence/VF_COMMON_PRODUCT_BASELINE_V2_P01_P06_RUNTIME_CLOSURE_FINAL_20260828.md; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$p"
          done
          python3 - <<'PY'
          import json
          a=json.load(open('governance/agent/VF_COMMON_PRODUCT_BASELINE_AUTHORITY.json'))
          assert a['capability_id']=='VF-COMMON-PRODUCT-BASELINE@2.0'
          assert a['version']=='2.0' and a['status']=='CURRENT'
          assert len(a['domain_order'])==15
          assert a['runtime_resolution']['no_shadow_truth'] is True
          assert a['runtime_resolution']['unknown_is_not_pass'] is True
          plan=json.load(open('governance/agent/VF_COMMON_PRODUCT_BASELINE_V2_REMEDIATION_SET_P01_P06.json'))
          assert plan['status']=='CANDIDATE_READ_ONLY_PLAN_NOT_EXECUTED'
          assert plan['runtime_write_performed'] is False
          print('GOV_FINAL_AUTHORITY_FENCE=PASS')
          PY
      - name: Validate candidate plus FINAL closure evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          cd gov
          python3 - <<'PY'
          import json,os
          candidate=json.load(open('governance/agent/evidence/VF_COMMON_PRODUCT_BASELINE_V2_P01_P06_RUNTIME_CLOSURE_20260828.json'))
          final=json.load(open('governance/agent/evidence/VF_COMMON_PRODUCT_BASELINE_V2_P01_P06_RUNTIME_CLOSURE_FINAL_20260828.json'))
          assert candidate['status']=='MACHINE_VERIFICATION_PENDING'
          assert candidate['machine_verification']['state']=='PENDING'
          assert candidate['closure_result']=='PENDING_MACHINE_VERIFICATION'
          assert candidate['baseline_id']=='VF-COMMON-PRODUCT-BASELINE@2.0'
          assert len(candidate['matrix'])==6
          req=candidate['closure_requirements']
          assert req['project_count']==6 and req['required_domain_count_per_project']==15
          assert req['unexplained_drift']==0 and req['required_unknown']==0
          assert req['all_v2_adoptions_current'] is True and req['all_projects_have_machine_pass'] is True
          assert final['status']=='COMPLETE' and final['closure_result']=='PASS'
          assert final['baseline_id']=='VF-COMMON-PRODUCT-BASELINE@2.0' and final['baseline_status']=='CURRENT'
          assert final['authority_modified_by_closure'] is False
          assert final['remediation_plan_snapshot_modified_by_closure'] is False
          ce=final['candidate_evidence']
          assert ce['exact_source_sha']==os.environ['GOV_RUNTIME_CANDIDATE']
          assert ce['matrix_validated_by_machine'] is True
          mv=final['machine_verification']
          assert mv['state']=='PASS'
          assert mv['run_id']==33117839859 and mv['job_id']==98676964389
          assert mv['gov_exact_source_sha']==os.environ['GOV_RUNTIME_CANDIDATE']
          assert mv['gov_source_fence']=='PASS' and mv['immutable_v2_authority']=='PASS'
          assert mv['candidate_matrix_contract']=='PASS' and mv['six_exact_main_checkouts']=='PASS'
          assert mv['six_live_current_adoptions']=='PASS' and mv['cross_project_verdict']=='PASS'
          cr=final['closure_requirements']
          assert cr['projects_current']==6 and cr['projects_expected']==6
          assert cr['required_domains_per_project']==15
          assert cr['unexplained_drift']==0 and cr['required_unknown']==0
          assert cr['exceptions_traceable'] is True and cr['reasoned_n_a_only'] is True and cr['no_shadow_truth'] is True
          assert cr['release_executed'] is False and cr['tag_created'] is False and cr['production_changed'] is False
          expected={'P01':os.environ['P01_SHA'],'P02':os.environ['P02_SHA'],'P03':os.environ['P03_SHA'],'P04':os.environ['P04_SHA'],'P05':os.environ['P05_SHA'],'P06':os.environ['P06_SHA']}
          assert final['live_main']==expected
          assert final['release'] is False and final['tag'] is False and final['production'] is False
          assert len(final['cross_project_remediation'])==1
          r=final['cross_project_remediation'][0]
          assert r['project']=='P04' and r['id']=='P04-LOGGING-DOMAIN-COVERAGE' and r['result']=='PASS'
          assert r['required_domains']==15 and r['covered_domains']==15 and r['logging']=='PASS' and r['drift']==0 and r['unknown']==0
          print('GOV_FINAL_EVIDENCE=PASS')
          PY
          grep -Fq 'Status: **COMPLETE / MACHINE PASS**' governance/agent/evidence/VF_COMMON_PRODUCT_BASELINE_V2_P01_P06_RUNTIME_CLOSURE_FINAL_20260828.md
          grep -Fq 'Run: `33117839859`' governance/agent/evidence/VF_COMMON_PRODUCT_BASELINE_V2_P01_P06_RUNTIME_CLOSURE_FINAL_20260828.md
      - name: Checkout P01 current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {repository: llhzx2018/vf-start, ref: '${{ env.P01_SHA }}', token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}', fetch-depth: 1, persist-credentials: false, path: p01}
      - name: Checkout P02 current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {repository: llhzx2018/vf-library, ref: '${{ env.P02_SHA }}', token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}', fetch-depth: 1, persist-credentials: false, path: p02}
      - name: Checkout P03 current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {repository: llhzx2018/vf-forge, ref: '${{ env.P03_SHA }}', token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}', fetch-depth: 1, persist-credentials: false, path: p03}
      - name: Checkout P04 current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {repository: llhzx2018/vf-infra, ref: '${{ env.P04_SHA }}', token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}', fetch-depth: 1, persist-credentials: false, path: p04}
      - name: Checkout P05 current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {repository: llhzx2018/vf-seo, ref: '${{ env.P05_SHA }}', token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}', fetch-depth: 1, persist-credentials: false, path: p05}
      - name: Checkout P06 current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {repository: llhzx2018/vf-press, ref: '${{ env.P06_SHA }}', token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}', fetch-depth: 1, persist-credentials: false, path: p06}
      - name: Final live Current Adoption readback
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          expected={'p01':os.environ['P01_SHA'],'p02':os.environ['P02_SHA'],'p03':os.environ['P03_SHA'],'p04':os.environ['P04_SHA'],'p05':os.environ['P05_SHA'],'p06':os.environ['P06_SHA']}
          for d,sha in expected.items():
            assert os.popen(f'git -C {d} rev-parse HEAD').read().strip()==sha,(d,sha)
            a=json.loads((pathlib.Path(d)/'docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json').read_text())
            assert a['state']=='CURRENT'
            assert a['baseline_id']=='VF-COMMON-PRODUCT-BASELINE@2.0'
            assert a['profile']=='PERSONAL_SINGLE_ADMIN'
            mv=a.get('machine_verification',{})
            assert mv.get('state',mv.get('status'))=='PASS',(d,mv)
            for key in ('release','release_executed','tag','tag_created','production','production_changed'):
              if key in a: assert a[key] is False,(d,key,a[key])
          p04=json.loads((pathlib.Path('p04')/'docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json').read_text())
          m=p04['machine_verification']
          assert m['required_domain_count']==15 and m['covered_domain_count']==15 and m['missing_domains']==[]
          assert m['logging_domain']=='PASS' and m['resolver']['drift_count']==0 and m['resolver']['unknown_count']==0
          p06=json.loads((pathlib.Path('p06')/'docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json').read_text())
          assert p06['historical_gap'] is True and p06['first_formal_common_product_baseline_adoption'] is True
          print('P01_P06_FINAL_LIVE_READBACK=PASS')
          PY
      - name: Final exact-source verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          cd gov
          test "$(git rev-parse HEAD)" = "$GOV_FINAL_SOURCE"
          test "$(git rev-parse origin/$GOV_BRANCH)" = "$GOV_FINAL_SOURCE"
          test "$(git rev-parse origin/main)" = "$GOV_BASE"
          echo VF_COMMON_BASELINE_V2_GOV_FINAL_EXACT_SOURCE="$GOV_FINAL_SOURCE"
          echo VF_COMMON_BASELINE_V2_P01_P06_FINAL_MACHINE=PASS
          echo PROJECTS_CURRENT=6
          echo REQUIRED_DOMAINS_PER_PROJECT=15
          echo UNEXPLAINED_DRIFT=0
          echo REQUIRED_UNKNOWN=0
          echo COMMON_BASELINE_V2_AUTHORITY=CURRENT
          echo RELEASE=NO
          echo TAG=NO
          echo PRODUCTION=NO
