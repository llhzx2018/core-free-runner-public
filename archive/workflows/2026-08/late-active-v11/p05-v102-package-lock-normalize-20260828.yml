name: P05 V1.0.2 Package Lock Normalize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p05-v102-package-lock-normalize-20260828.yml'

permissions:
  contents: read

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXACT_SOURCE: 557a9c72f8f9d8130a1dba77581b1d1ce340fb5f
      TARGET_BRANCH: ui/p05-human-baseline-v102-20260828
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact P05 candidate with write authority
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.EXACT_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: p05
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Normalize package lock and push one-file commit
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p05
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXACT_SOURCE"
          test "$(node -p "require('./package.json').version")" = '1.0.2'
          npm install --package-lock-only --ignore-scripts >/dev/null
          test "$(node -p "require('./package-lock.json').version")" = '1.0.2'
          test "$(node -p "require('./package-lock.json').packages[''].version")" = '1.0.2'
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //')
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'package-lock.json'
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add package-lock.json
          git commit -m 'release(P05): align V1.0.2 package lock'
          NEW_SOURCE="$(git rev-parse HEAD)"
          git push origin "HEAD:$TARGET_BRANCH"
          echo P05_V102_LOCK_NORMALIZED=PASS
          echo P05_V102_NEW_SOURCE="$NEW_SOURCE"
