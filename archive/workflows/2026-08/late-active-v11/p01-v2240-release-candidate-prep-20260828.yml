name: P01 V2.24.0 Release Candidate Prep
on:
  push:
    paths:
      - '.github/workflows/p01-v2240-release-candidate-prep-20260828.yml'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      BASE_DEVELOP: 4cb7000309601e4722c12906f9896a45b4e4f238
      RELEASE_BRANCH: release/p01-v2.24.0-20260828
      VERSION: 2.24.0
    steps:
      - uses: actions/checkout@v4
      - name: Prepare exact release identity and inspect previous repair
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/p01-v2240"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCT_REPO}.git" "$ROOT" >/dev/null 2>&1
          cd "$ROOT"
          git fetch origin develop main --tags
          test "$(git rev-parse origin/develop)" = "$BASE_DEVELOP"
          if git ls-remote --exit-code --heads origin "refs/heads/$RELEASE_BRANCH" >/dev/null 2>&1; then
            echo RELEASE_BRANCH_ALREADY_EXISTS
            exit 31
          fi
          git checkout -b "$RELEASE_BRANCH" "$BASE_DEVELOP"
          printf '%s\n' "$VERSION" > VERSION
          printf '%s\n' "$VERSION" > src/VERSION.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/bootstrap.php')
          s=p.read_text(encoding='utf-8')
          old="define('VF_VERSION', '2.23.0');"
          new="define('VF_VERSION', '2.24.0');"
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          p=Path('CHANGELOG.md')
          s=p.read_text(encoding='utf-8')
          old='## VF Start V2.24.0 — UX Rebaseline · Unreleased'
          new='## VF Start V2.24.0 — UX Rebaseline · Formal Release'
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = 'CHANGELOG.md VERSION src/VERSION.txt src/app/bootstrap.php '
          test "$(cat VERSION)" = "$VERSION"
          test "$(cat src/VERSION.txt)" = "$VERSION"
          grep -Fq "define('VF_VERSION', '2.24.0');" src/app/bootstrap.php
          test "$(git show "$BASE_DEVELOP:docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json" | sha256sum | awk '{print $1}')" = "$(sha256sum docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json | awk '{print $1}')"
          find src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          php tests/unit/system_baseline_human_ui_contract.php
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md VERSION src/VERSION.txt src/app/bootstrap.php
          git commit -m 'release(P01): prepare V2.24.0 identity'
          CANDIDATE="$(git rev-parse HEAD)"
          TREE="$(git rev-parse HEAD^{tree})"
          git push origin "$RELEASE_BRANCH"
          echo "P01_V2240_CANDIDATE=$CANDIDATE"
          echo "P01_V2240_TREE=$TREE"
          echo 'P01_V2240_IDENTITY_GATE=PASS'

          mkdir -p "$RUNNER_TEMP/p01-prev-release"
          cd "$RUNNER_TEMP/p01-prev-release"
          gh release download v2.23.0 -R "$PRODUCT_REPO" -p 'server-update-v2.23.0-repair.php' -p 'VF_Start_V2.23.0_UPDATE.zip'
          php -l server-update-v2.23.0-repair.php >/dev/null
          unzip -l VF_Start_V2.23.0_UPDATE.zip
          test "$(unzip -Z1 VF_Start_V2.23.0_UPDATE.zip)" = 'repair-v2.23.0.php'
          cmp -s server-update-v2.23.0-repair.php <(unzip -p VF_Start_V2.23.0_UPDATE.zip repair-v2.23.0.php)
          echo '--- REPAIR CONTRACT MARKERS ---'
          grep -nE "class VfAtomicPackage|TARGET_VERSION|SOURCE_VERSION|PAYLOAD|payload|base64|gz|MANIFEST|selfTest|function run|source|target" server-update-v2.23.0-repair.php | head -n 220 || true
          echo 'P01_V2230_REPAIR_CONTRACT_INSPECTION=PASS'
