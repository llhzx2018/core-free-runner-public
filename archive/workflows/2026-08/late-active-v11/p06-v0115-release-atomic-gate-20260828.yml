# registered trigger
name: P06 V0.1.15 Release Atomic Gate

on:
  push:
    paths:
      - '.github/workflows/p06-v0115-release-atomic-gate-20260828.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact V0.1.14 source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-press
          ref: d689b79a6f1d98f0bf5bccba438f3c9a74077782
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Checkout exact V0.1.15 release source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-press
          ref: a9300382d3a862fb599b8b928961ead38dee8f31
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: target
      - name: Prepare PHP runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl composer sqlite3 rsync >/dev/null
          php -m | grep -Fxq PDO
          php -m | grep -Fxq pdo_sqlite
          php -m | grep -Fxq sqlite3
          php -m | grep -Fxq zip
      - name: Execute real V0.1.14 to V0.1.15 Atomic Gate
        shell: bash
        run: bash scripts/p06-v0115-release-atomic-gate.sh source target
      - name: Upload verified formal release set
        uses: actions/upload-artifact@v4
        with:
          name: P06-V0.1.15-FORMAL-ATOMIC-RELEASE-SET
          path: ${{ runner.temp }}/p06-v0115-release-atomic/formal/
          if-no-files-found: error
          retention-days: 14
