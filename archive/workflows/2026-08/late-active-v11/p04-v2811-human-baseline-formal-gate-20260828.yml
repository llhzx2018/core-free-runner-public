name: P04 V2.8.11 Human Baseline Formal Gate

on:
  push:
    paths:
      - '.github/workflows/p04-v2811-human-baseline-formal-gate-20260828.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CANDIDATE: 3cd3d62327d4ff78419563d9698976d6ff993f23
      BASE_MAIN: d52acf3f200652c9806e51dd08e9207da4a1170b
      OLD_SOURCE: 8f91cc4c7bd9fadf6398eda60bcd2c2283a02d98
      TARGET_BRANCH: ui/p04-human-baseline-v2811-20260828

    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact P04 candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: product

      - name: Checkout exact P04 V2.8.10 release source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: ${{ env.OLD_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: old

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, sodium, zip, mbstring, fileinfo
          coverage: none

      - name: Exact source fence and UI-only contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C old rev-parse HEAD)" = "$OLD_SOURCE"
          test "$(git -C product rev-parse origin/main)" = "$BASE_MAIN"
          test "$(git -C product rev-parse origin/$TARGET_BRANCH)" = "$CANDIDATE"
          test "$(tr -d '\r\n' < product/VERSION)" = '2.8.11'
          test "$(tr -d '\r\n' < old/VERSION)" = '2.8.10'
          mapfile -t changed < <(git -C product diff --name-only "$BASE_MAIN" "$CANDIDATE")
          test "${#changed[@]}" -eq 11
          for file in \
            VERSION VF_PROJECT.json \
            public/assets/system-operations.css \
            public/assets/v2811-human-baseline.css \
            public/assets/v2811-human-baseline.js \
            public/baseline-summary.php public/index.php \
            public/system-baseline.php public/system-info.php \
            scripts/build-v2811-release-tree.py scripts/build-v2811-update-release.py; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$file"
          done
          git -C product diff --quiet "$BASE_MAIN" "$CANDIDATE" -- src/app/CommonBaselineV2Closure.php database config
          cd product
          python3 scripts/repository-health-gate.py
          python3 scripts/check-migrations.py
          python3 -m py_compile scripts/build-v2811-release-tree.py scripts/build-v2811-update-release.py scripts/validate-online-atomic-package.py scripts/full-runtime-vs-update-result-source-exact-gate.py
          node --check public/assets/v2811-human-baseline.js
          find src public -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          python3 - <<'PY'
          import json
          p=json.load(open('VF_PROJECT.json'))
          assert p['project_id']=='P04'
          assert p['version']=='2.8.11' and p['production_version']=='2.8.10' and p['candidate_version']=='2.8.11'
          assert p['schema']==14 and p['release_source_contract']['runtime_resolver_change'] is False
          assert p['release_source_contract']['baseline_authority']=='CommonBaselineV2Closure::summary()'
          assert p['release_source_contract']['allowed_source_versions']==['2.8.10']
          PY
          grep -Fq 'v2811-human-baseline.css' public/index.php
          grep -Fq 'v2811-human-baseline.js' public/index.php
          grep -Fq "CommonBaselineV2Closure::summary()" public/baseline-summary.php
          echo P04_V2811_SOURCE_FENCE=PASS

      - name: Clean FULL install on Schema 14
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          VF_INFRA_TEST_PORT=19030 bash scripts/run-clean-full-install-gate.sh
          echo P04_V2811_CLEAN_FULL=PASS

      - name: Deterministic FULL and UPDATE plus Source Exact Atomic
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/p04-v2811"
          cd product
          python3 scripts/build-v2811-release-tree.py "$RUNNER_TEMP/p04-v2811/tree-a" | tee "$RUNNER_TEMP/p04-v2811/tree-a.json"
          python3 scripts/build-v2811-release-tree.py "$RUNNER_TEMP/p04-v2811/tree-b" | tee "$RUNNER_TEMP/p04-v2811/tree-b.json"
          diff -qr "$RUNNER_TEMP/p04-v2811/tree-a" "$RUNNER_TEMP/p04-v2811/tree-b"
          python3 - "$RUNNER_TEMP/p04-v2811/tree-a" "$RUNNER_TEMP/p04-v2811/VF_Infra_V2.8.11_FULL.zip" <<'PY'
          from pathlib import Path
          import sys,zipfile
          root=Path(sys.argv[1]); out=Path(sys.argv[2])
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=True) as z:
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  rel=p.relative_to(root).as_posix(); info=zipfile.ZipInfo(rel,date_time=(1980,1,1,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.create_system=3; info.external_attr=(0o100644<<16); z.writestr(info,p.read_bytes())
          PY
          python3 scripts/build-v2811-update-release.py --target-runtime "$RUNNER_TEMP/p04-v2811/tree-a" --output "$RUNNER_TEMP/p04-v2811/update-a" | tee "$RUNNER_TEMP/p04-v2811/update-a.json"
          python3 scripts/build-v2811-update-release.py --target-runtime "$RUNNER_TEMP/p04-v2811/tree-b" --output "$RUNNER_TEMP/p04-v2811/update-b" | tee "$RUNNER_TEMP/p04-v2811/update-b.json"
          cmp "$RUNNER_TEMP/p04-v2811/update-a/VF_Infra_V2.8.11_UPDATE.zip" "$RUNNER_TEMP/p04-v2811/update-b/VF_Infra_V2.8.11_UPDATE.zip"
          test "$(jq -r '.version' "$RUNNER_TEMP/p04-v2811/tree-a/release-manifest.json")" = '2.8.11'
          test "$(jq -r '.target_schema' "$RUNNER_TEMP/p04-v2811/tree-a/release-manifest.json")" = '14'
          test "$(jq -r '.maintenance_entry_count' "$RUNNER_TEMP/p04-v2811/tree-a/release-manifest.json")" = '5'
          test "$(jq -r '.human_readable_baseline_ui' "$RUNNER_TEMP/p04-v2811/tree-a/release-manifest.json")" = 'true'
          test "$(jq -r '.runtime_resolver_change' "$RUNNER_TEMP/p04-v2811/tree-a/release-manifest.json")" = 'false'
          test "$(jq -c '.allowed_source_versions' "$RUNNER_TEMP/p04-v2811/update-a/PACKAGE_MANIFEST.json")" = '["2.8.10"]'
          python3 scripts/validate-online-atomic-package.py --runtime "$RUNNER_TEMP/p04-v2811/tree-a" --zip "$RUNNER_TEMP/p04-v2811/update-a/VF_Infra_V2.8.11_UPDATE.zip" --version 2.8.11
          cd ../old
          python3 scripts/build-release-tree.py "$RUNNER_TEMP/p04-v2811/old-tree" >/dev/null
          python3 - "$RUNNER_TEMP/p04-v2811/old-tree" "$RUNNER_TEMP/p04-v2811/VF_Infra_V2.8.10_FULL.zip" <<'PY'
          from pathlib import Path
          import sys,zipfile
          root=Path(sys.argv[1]); out=Path(sys.argv[2])
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=True) as z:
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  rel=p.relative_to(root).as_posix(); info=zipfile.ZipInfo(rel,date_time=(1980,1,1,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.create_system=3; info.external_attr=(0o100644<<16); z.writestr(info,p.read_bytes())
          PY
          cd ../product
          python3 scripts/full-runtime-vs-update-result-source-exact-gate.py \
            --baseline-full "$RUNNER_TEMP/p04-v2811/VF_Infra_V2.8.10_FULL.zip" \
            --candidate-full "$RUNNER_TEMP/p04-v2811/VF_Infra_V2.8.11_FULL.zip" \
            --candidate-update "$RUNNER_TEMP/p04-v2811/update-a/VF_Infra_V2.8.11_UPDATE.zip" \
            --expected-source-version 2.8.10 --expected-target-version 2.8.11
          echo P04_V2811_DETERMINISTIC_ATOMIC=PASS

      - name: Install browser dependency after source/privacy gates
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-package-lock playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Human-readable Common Baseline and five-entry browser gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          WEB="$RUNNER_TEMP/p04-v2811/browser-runtime"
          EVIDENCE="$RUNNER_TEMP/p04-v2811/browser-evidence"
          PORT=19031
          mkdir -p "$EVIDENCE"
          python3 scripts/build-v2811-release-tree.py "$WEB" >/dev/null
          php -d opcache.jit=0 -S "127.0.0.1:$PORT" -t "$WEB" >"$EVIDENCE/php-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do curl -fsS "http://127.0.0.1:$PORT/setup.php" >/dev/null 2>&1 && break; sleep .1; done
          cat > .runner-p04-v2811.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const base='http://127.0.0.1:19031';
          const password='Vf'+crypto.randomUUID().replaceAll('-','')+'Aa1';
          const report={status:'FAIL',baseline_api:false,standalone_human:false,five_entries:false,routes:{},mobile:false,page_errors:[],console_errors:[],bad_responses:[]};
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1365,height:900}});
          const page=await context.newPage();
          page.on('pageerror',e=>report.page_errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')report.console_errors.push(m.text())});
          page.on('response',r=>{if(r.status()>=400)report.bad_responses.push({url:r.url(),status:r.status()})});
          async function route(label, expected, forbidden='') {
            const nav=page.locator('.v271-settings-nav');
            await nav.getByRole('button',{name:label,exact:true}).click();
            await page.locator('.v271-settings-content h2',{hasText:expected}).first().waitFor({state:'visible'});
            const titles=await page.locator('.v271-settings-content h2').allInnerTexts();
            if(!titles.some(t=>t.trim()===expected)) throw new Error(`${label} missing ${expected}`);
            if(forbidden && titles.some(t=>t.trim()===forbidden)) throw new Error(`${label} still merged with ${forbidden}`);
            report.routes[label]=titles;
          }
          try {
            await page.goto(base+'/setup.php',{waitUntil:'domcontentloaded'});
            await page.locator('#site_name').fill('VF Infra V2.8.11 Gate');
            await page.locator('#password').fill(password); await page.locator('#password_confirm').fill(password);
            await Promise.all([page.waitForURL(/login\.php\?installed=1/),page.getByRole('button',{name:'安装并进入系统'}).click()]);
            await page.locator('#admin-password').fill(password);
            await Promise.all([page.waitForURL(/index\.php(?:#.*)?$/),page.getByRole('button',{name:'登录'}).click()]);

            const api=await context.request.get(base+'/baseline-summary.php');
            if(!api.ok()) throw new Error(`baseline API HTTP ${api.status()}`);
            const baseline=(await api.json()).baseline;
            if(Number(baseline?.counts?.DRIFT)!==0||Number(baseline?.counts?.UNKNOWN)!==0) throw new Error('baseline drift/unknown');
            if(Number(baseline?.required_domain_count)!==15||Number(baseline?.covered_domain_count)!==15) throw new Error('baseline coverage');
            if(!Array.isArray(baseline?.rows)||!baseline.rows.some(r=>r.domain==='LOGGING'&&r.result==='PASS')) throw new Error('logging baseline missing');
            report.baseline_api=true;

            await page.goto(base+'/system-baseline.php',{waitUntil:'domcontentloaded'});
            if(!(await page.locator('.conclusion strong').innerText()).includes('系统正常')) throw new Error('standalone conclusion not human readable');
            if(!(await page.locator('.attention').innerText()).includes('当前没有需要你处理')) throw new Error('standalone attention missing');
            if(await page.locator('.group-row').count()!==5) throw new Error('standalone groups != 5');
            if(await page.locator('.tech-details').getAttribute('open')!==null) throw new Error('technical details should be closed');
            report.standalone_human=true;

            await page.goto(base+'/index.php#settings/baseline',{waitUntil:'domcontentloaded'});
            await page.locator('.v2811-baseline-hero h2').waitFor({state:'visible'});
            const nav=page.locator('.v271-settings-nav');
            for(const label of ['系统信息','系统基线','在线升级','备份与恢复','运行健康']) {
              if(await nav.getByRole('button',{name:label,exact:true}).count()!==1) throw new Error(`maintenance entry missing ${label}`);
            }
            if(!(await page.locator('.v2811-attention').innerText()).includes('当前没有需要你处理')) throw new Error('shell attention missing');
            if(await page.locator('.v2811-baseline-group').count()!==5) throw new Error('shell groups != 5');
            if(await page.locator('.v2811-tech-details').getAttribute('open')!==null) throw new Error('shell technical details should be closed');
            report.five_entries=true;

            await route('系统信息','系统信息','运行健康');
            await route('在线升级','在线升级');
            await route('备份与恢复','备份与恢复','导入导出');
            await route('运行健康','运行健康','系统信息');

            await page.setViewportSize({width:390,height:844});
            await page.goto(base+'/index.php#settings/baseline',{waitUntil:'domcontentloaded'});
            await page.locator('.v2811-baseline-hero h2').waitFor({state:'visible'});
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
            if(overflow>2) throw new Error(`mobile horizontal overflow ${overflow}`);
            report.mobile=true;
            report.status='PASS';
          } catch(e) { report.error=String(e?.stack||e); }
          finally { await browser.close(); fs.writeFileSync(process.env.REPORT,JSON.stringify(report,null,2)); }
          if(report.status!=='PASS'||report.page_errors.length||report.console_errors.length||report.bad_responses.length) process.exit(2);
          JS
          REPORT="$EVIDENCE/browser-report.json" node .runner-p04-v2811.mjs
          rm -f .runner-p04-v2811.mjs
          cat "$EVIDENCE/browser-report.json"
          kill "$SERVER_PID"; wait "$SERVER_PID" || true; trap - EXIT
          echo P04_V2811_HUMAN_BASELINE_BROWSER=PASS

      - name: Final formal verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C product rev-parse origin/main)" = "$BASE_MAIN"
          echo P04_V2811_EXACT_SOURCE="$CANDIDATE"
          echo P04_V2811_VERSION=2.8.11
          echo P04_V2811_SCHEMA=14
          echo P04_V2811_MIGRATION=NONE
          echo P04_V2811_FIVE_MAINTENANCE_ENTRIES=PASS
          echo P04_V2811_HUMAN_READABLE_BASELINE=PASS
          echo P04_V2811_RUNTIME_RESOLVER_CHANGE=NO
          echo P04_V2811_ATOMIC_2810_TO_2811=PASS
          echo P04_V2811_MACHINE=PASS
          echo P04_V2811_PRODUCTION=NO

      - name: Upload verified formal release set
        uses: actions/upload-artifact@v4
        with:
          name: P04-V2.8.11-HUMAN-BASELINE-FORMAL-RELEASE-SET
          path: |
            ${{ runner.temp }}/p04-v2811/VF_Infra_V2.8.11_FULL.zip
            ${{ runner.temp }}/p04-v2811/update-a/VF_Infra_V2.8.11_UPDATE.zip
            ${{ runner.temp }}/p04-v2811/update-a/PACKAGE_MANIFEST.json
            ${{ runner.temp }}/p04-v2811/update-a/SHA256SUMS.txt
            ${{ runner.temp }}/p04-v2811/browser-evidence/browser-report.json
            ${{ runner.temp }}/p04-v2811/tree-a.json
            ${{ runner.temp }}/p04-v2811/update-a.json
          retention-days: 30
