name: P01 V2.24.0 Release Contract Inspection
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect V2.23.0 formal repair contract
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/repair.php https://github.com/llhzx2018/vf-start/releases/download/v2.23.0/server-update-v2.23.0-repair.php
          echo "bytes=$(wc -c </tmp/repair.php)"
          php -l /tmp/repair.php
          echo '--- HEAD ---'
          sed -n '1,120p' /tmp/repair.php
          echo '--- CONTRACT MARKERS ---'
          grep -nE "class VfAtomicPackage|TARGET_VERSION|SOURCE_VERSION|payload|base64|gz|MANIFEST|selfTest|function run|schema|file_put_contents|rename" /tmp/repair.php | head -n 180 || true
          echo '--- ZIP CONTENT ---'
          curl -fL --retry 3 -o /tmp/update.zip https://github.com/llhzx2018/vf-start/releases/download/v2.23.0/VF_Start_V2.23.0_UPDATE.zip
          unzip -l /tmp/update.zip
          unzip -p /tmp/update.zip repair-v2.23.0.php | sha256sum
          sha256sum /tmp/repair.php
