          a['currentized_at']='2026-08-28T09:20:00Z'
          adoption_path.write_text(json.dumps(a,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          evidence=Path('docs/evidence/P02_V2.5.30_PRODUCTION_CLOSURE_20260828.json')
          evidence.write_text(json.dumps({
            'project_id':'P02','product':'VF Library','version':'2.5.30','schema':2401,'result':'PASS',
            'owner_production_evidence':{'type':'AUTHENTICATED_SYSTEM_UPDATE_SCREENSHOT','observed_at':'2026-08-28T17:19:00+08:00','current_version':'2.5.30','latest_version':'2.5.30','status':'已是最新版本','footer':'VF Library · V2.5.30'},
            'formal_gate':{'run_id':33158085181,'job_id':98805590903,'artifact_id':9680438872,'result':'PASS'},
            'release':{'tag':'v2.5.30','release_id':378373541,'product_identity':'d0f3d4f0f65400c5ca4868df844bbc4684b7cd8a','main_merge':'f9bcfc3173be6db3845bcf287aeb3a737711ccda','publication_run':33158628462,'publication_job':98807386126},
            'online_update_channel':{'core_updates_main':'17a74caa3074e6400c5c8c24cfddbce959ed9cb8','from':'2.5.29','to':'2.5.30','asset':'VF_Library_V2.5.30_UPDATE.zip','bytes':363823,'sha256':'eb151d6a2348b68758374038db97f54d6aeed0fd0b505efe208df9081f8d59fc'},
            'production_write_by_agent':'NO'
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          python3 -m json.tool docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json >/dev/null
          python3 -m json.tool docs/evidence/P02_V2.5.30_PRODUCTION_CLOSURE_20260828.json >/dev/null
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = 'VF_PROJECT.json'
          test "${changed[1]}" = 'docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json'
          test "${changed[2]}" = 'docs/evidence/P02_V2.5.30_PRODUCTION_CLOSURE_20260828.json'
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json docs/evidence/P02_V2.5.30_PRODUCTION_CLOSURE_20260828.json
          git commit -m 'docs(P02): close V2.5.30 production authority'
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/llhzx2018/vf-library.git"
          git push origin "$CLOSURE_BRANCH"
          echo "P02_CLOSURE_HEAD=$(git rev-parse HEAD)"
