            'tag':'v2.5.30','release_id':378373541,'published_at':'2026-08-28T09:15:53Z',
            'product_identity':'d0f3d4f0f65400c5ca4868df844bbc4684b7cd8a','source_tree':'c029838309606ceec49c168d8d60fb8e83496604',
            'deterministic_release_set':'PASS','fresh_install':'PASS','common_product_baseline_v2':'PASS_DRIFT_0_UNKNOWN_0',
