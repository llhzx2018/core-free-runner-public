name: P02 V2.5.30 Production Authority Closure

on:
  push:
    paths:
      - '.github/workflows/p02-v2530-production-authority-closure-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_MAIN: f9bcfc3173be6db3845bcf287aeb3a737711ccda
      CANDIDATE: d0f3d4f0f65400c5ca4868df844bbc4684b7cd8a
      SOURCE_TREE: c029838309606ceec49c168d8d60fb8e83496604
      RELEASE_ID: '378373541'
      RELEASE_TAG: v2.5.30
      UPDATE_BYTES: '363823'
      UPDATE_SHA: eb151d6a2348b68758374038db97f54d6aeed0fd0b505efe208df9081f8d59fc
      CORE_UPDATES_MAIN: 17a74caa3074e6400c5c8c24cfddbce959ed9cb8
      FORMAL_RUN: '33158085181'
      FORMAL_JOB: '98805590903'
      PUBLICATION_RUN: '33158628462'
      PUBLICATION_JOB: '98807386126'
      CLOSURE_BRANCH: closure/p02-v2.5.30-production-20260828-1720
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact P02 main and remote fences
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:${TOKEN}@github.com/llhzx2018/vf-library.git" product >/dev/null 2>&1
          test "$(git -C product rev-parse origin/main)" = "$PRODUCT_MAIN"
          test "$(git -C product rev-parse "$CANDIDATE^{tree}")" = "$SOURCE_TREE"
          test "$(git -C product rev-parse "$PRODUCT_MAIN^{tree}")" = "$SOURCE_TREE"
          test "$(git -C product rev-list -n1 "$RELEASE_TAG")" = "$CANDIDATE"
          gh api repos/llhzx2018/vf-library/releases/tags/$RELEASE_TAG | jq -e --argjson rid "$RELEASE_ID" '.id==$rid and .draft==false and .prerelease==false' >/dev/null
          test "$(gh api repos/llhzx2018/vf-library/releases/tags/$RELEASE_TAG --jq '.assets[] | select(.name=="VF_Library_V2.5.30_UPDATE.zip") | .size')" = "$UPDATE_BYTES"
          test "$(gh api repos/llhzx2018/vf-library/releases/tags/$RELEASE_TAG --jq '.assets[] | select(.name=="VF_Library_V2.5.30_UPDATE.zip") | .digest')" = "sha256:$UPDATE_SHA"
          git clone "https://x-access-token:${TOKEN}@github.com/llhzx2018/core-updates.git" updates >/dev/null 2>&1
          test "$(git -C updates rev-parse origin/main)" = "$CORE_UPDATES_MAIN"
          jq -e '.project_id=="P02" and .current_version=="2.5.29" and .target_version=="2.5.30" and .release_id==378373541 and .product_identity=="d0f3d4f0f65400c5ca4868df844bbc4684b7cd8a" and .asset_bytes==363823 and .asset_sha256=="eb151d6a2348b68758374038db97f54d6aeed0fd0b505efe208df9081f8d59fc"' updates/projects/P02.json >/dev/null
          echo P02_V2530_REMOTE_FENCES=PASS

      - name: Write authenticated owner production evidence into authority
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd product
          git checkout -b "$CLOSURE_BRANCH" "$PRODUCT_MAIN"
          python3 - <<'PY'
          import json
          from pathlib import Path

          project_path=Path('VF_PROJECT.json')
          p=json.loads(project_path.read_text(encoding='utf-8'))
          p['status']='V2.5.30_PRODUCTION_VERIFIED_CLOSED'
          p['as_of']='2026-08-28T17:19:00+08:00'
          p['production_truth']={
            'current_version':'2.5.30',
            'latest_version':'2.5.30',
            'current_schema':2401,
