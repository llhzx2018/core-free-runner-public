name: P02 Common Baseline V2 UI Exposure Manifest Refresh

on:
  push:
    paths:
      - '.github/workflows/p02-common-baseline-v2-ui-exposure-manifest-refresh-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    env:
      EXACT_SOURCE: b766c85e2a86af6fcff925817107f2548f31613f
      BASE_SHA: 49c2bac2497ccc454c2134d3e491d76b2ff63d79
      PRODUCT_BRANCH: ui/common-baseline-v2-exposure-p02-20260828
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact P02 source
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-library.git" p02 >/dev/null 2>&1
          cd p02
          git checkout "$PRODUCT_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git remote set-url origin https://github.com/llhzx2018/vf-library.git
          echo P02_MANIFEST_REFRESH_SOURCE_FENCE=PASS

      - name: Regenerate and verify Source Manifest
        run: |
          set -Eeuo pipefail
          cd p02
          python3 scripts/generate-source-manifest.py
          python3 scripts/verify-source-manifest.py
          git diff --check
          git status --porcelain=v1
          test "$(git status --porcelain=v1 | wc -l)" -eq 2
          git status --porcelain=v1 | cut -c4- | sort -u > /tmp/p02-manifest-dirty.txt
          printf 'SOURCE_MANIFEST.json\nSOURCE_MANIFEST.txt\n' > /tmp/p02-manifest-allowed.txt
          diff -u /tmp/p02-manifest-allowed.txt /tmp/p02-manifest-dirty.txt
          echo P02_SOURCE_MANIFEST_REFRESH=PASS

      - name: Commit and push manifest binding
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd p02
          git add SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          git commit -m 'chore(P02): refresh source manifest for UI exposure'
          git remote set-url origin "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-library.git"
          git push origin HEAD:"$PRODUCT_BRANCH"
          git remote set-url origin https://github.com/llhzx2018/vf-library.git
          echo P02_SOURCE_MANIFEST_PUSH=PASS
