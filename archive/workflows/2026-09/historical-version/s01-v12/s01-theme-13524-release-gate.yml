name: S01 Theme 1.35.24 Release Gate

on:
  push:
    paths:
      - '.github/workflows/s01-theme-13524-release-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: llhzx2018/vf-tools-theme
      TARGET_BASE: d2e23516388cf6d01cf75843cb497829d444495f
      TARGET_SHA: 68fad66583f0c5a174395189907fc77baf97356d
      TARGET_VERSION: 1.35.24
    steps:
      - name: Checkout exact release source
        shell: bash
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN"
          git clone -q "https://x-access-token:${VF_PRIVATE_READ_TOKEN}@github.com/${TARGET_REPO}.git" target
          cd target
          git checkout -q "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          echo "exact_release_source=$TARGET_SHA"

      - name: Exact release changed-file fence
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git diff --name-only "$TARGET_BASE" "$TARGET_SHA" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          VERSION
          src/assets/css/admin/pages/seo/admin-page-seo-reference-v3.css
          src/inc/admin/admin-s01-uiux-polish.php
          src/style.css
          tests/seo-reference-prototype-v3-contract.php
          tests/update-refresh-policy-contract.php
          tests/visible-console-v2-contract.php
          tests/workbench-primary-action-contract.php
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          ! git diff --name-only "$TARGET_BASE" "$TARGET_SHA" | grep -Eq '(src/inc/admin/actions|src/inc/seo|migration|schema|updater|core-updates)'
          echo PASS_RELEASE_FILE_FENCE

      - name: Version and package identity
        shell: bash
        run: |
          set -euo pipefail
          cd target
          test "$(tr -d '\r\n' < VERSION)" = "$TARGET_VERSION"
          grep -F "Version: $TARGET_VERSION" src/style.css
          grep -F "V1.35.24_S01_REFERENCE_FIRST_TECHNICAL_SEO_PREVIEW" src/style.css
          grep -F "Update URI: https://kewaro.com/vf-tools-theme" src/style.css
          echo PASS_VERSION_IDENTITY

      - name: PHP syntax full source
        shell: bash
        run: |
          set -euo pipefail
          cd target
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find src -type f -name '*.php' -print0)
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find tests -type f -name '*.php' -print0)
          echo PASS_PHP_SYNTAX_FULL_SOURCE

      - name: SEO V3 contract
        shell: bash
        run: |
          set -euo pipefail
          cd target
          php tests/seo-reference-prototype-v3-contract.php

      - name: Existing standalone contract regression
        shell: bash
        run: |
          set -euo pipefail
          cd target
          failures=0
          count=0
          for f in tests/*.php; do
            [ -f "$f" ] || continue
            count=$((count+1))
            if ! php "$f"; then
              echo "FAILED_CONTRACT=$f" >&2
              failures=$((failures+1))
            fi
          done
          echo "contract_count=$count"
          test "$failures" -eq 0
          echo PASS_ALL_STANDALONE_CONTRACTS

      - name: CSS and final-owner release assertions
        shell: bash
        run: |
          set -euo pipefail
          cd target
          python3 - <<'PY'
          from pathlib import Path
          css=Path('src/assets/css/admin/pages/seo/admin-page-seo-reference-v3.css').read_text()
          loader=Path('src/inc/admin/admin-s01-uiux-polish.php').read_text()
          assert css.count('{') == css.count('}')
          for s in ['--vf-seo-cyan:var(--vf-v5-brand,#0f766e)','grid-template-columns:188px minmax(0,920px)','font-size:13.5px!important','font-size:12.5px!important','min-height:40px!important','@media(max-width:420px)','@media(prefers-reduced-motion:reduce)','@media(forced-colors:active)']:
              assert s in css, s
          assert 'font-size:10px' not in css
          assert 'font-size:10.5px' not in css
          assert 'admin-page-seo-reference-v3.css' in loader
          assert 'vf-theme-seo-page-reference-v3' in loader
          assert 'reference-v2' not in loader and 'reference-v1' not in loader
          print('PASS_UI_RELEASE_ASSERTIONS')
          PY

      - name: Upgrade safety classification
        shell: bash
        run: |
          set -euo pipefail
          cd target
          test "$(git diff --name-only "$TARGET_BASE" "$TARGET_SHA" | grep -Ec '(^|/)(migration|schema|database|updater)(/|\.|$)' || true)" -eq 0
          echo 'upgrade_class=FILES_ONLY_PRESENTATION_UPDATE'
          echo 'schema_change=NONE'
          echo 'data_migration=NONE'
          echo 'rollback=WORDPRESS_THEME_PREVIOUS_RELEASE_ASSET'
          echo PASS_UPGRADE_SAFETY_CLASSIFICATION

      - name: Gate summary
        shell: bash
        run: echo PASS_S01_THEME_13524_RELEASE_GATE
