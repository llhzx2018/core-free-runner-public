name: S01 Theme SEO Reference V3 Gate

on:
  push:
    paths:
      - '.github/workflows/s01-theme-seo-reference-v3-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-gate:
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: llhzx2018/vf-tools-theme
      TARGET_BASE: d2e23516388cf6d01cf75843cb497829d444495f
      TARGET_SHA: b1fb40e4def86fa26ab593e8d5cc37c264768657
    steps:
      - name: Checkout exact candidate
        shell: bash
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN"
          git clone -q "https://x-access-token:${VF_PRIVATE_READ_TOKEN}@github.com/${TARGET_REPO}.git" target
          cd target
          git checkout -q "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          echo "exact_head=$(git rev-parse HEAD)"

      - name: Exact changed-file fence
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git diff --name-only "$TARGET_BASE" "$TARGET_SHA" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          src/assets/css/admin/pages/seo/admin-page-seo-reference-v3.css
          src/inc/admin/admin-s01-uiux-polish.php
          tests/seo-reference-prototype-v3-contract.php
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          ! git diff --name-only "$TARGET_BASE" "$TARGET_SHA" | grep -Eq '(^VERSION$|style\.css$|src/inc/admin/actions|src/inc/seo|src/inc/services.*seo|core-updates|migration|updater)'
          echo PASS_EXACT_CHANGED_FILE_FENCE

      - name: PHP syntax and V3 contract
        shell: bash
        run: |
          set -euo pipefail
          cd target
          php -l src/inc/admin/admin-s01-uiux-polish.php
          php -l tests/seo-reference-prototype-v3-contract.php
          php tests/seo-reference-prototype-v3-contract.php

      - name: CSS structural and maturity checks
        shell: bash
        run: |
          set -euo pipefail
          cd target
          css=src/assets/css/admin/pages/seo/admin-page-seo-reference-v3.css
          test -s "$css"
          python3 - <<'PY'
          from pathlib import Path
          css=Path('src/assets/css/admin/pages/seo/admin-page-seo-reference-v3.css').read_text()
          assert css.count('{') == css.count('}'), 'unbalanced CSS braces'
          required=[
            '--vf-seo-cyan:var(--vf-v5-brand,#0f766e)',
            'grid-template-columns:188px minmax(0,920px)',
            'font-size:13.5px!important',
            'font-size:12.5px!important',
            'min-height:40px!important',
            '@media(max-width:680px)',
            '@media(max-width:420px)',
            '@media(prefers-reduced-motion:reduce)',
            '@media(forced-colors:active)',
          ]
          for item in required:
              assert item in css, item
          assert 'font-size:10px' not in css
          assert 'font-size:10.5px' not in css
          print('PASS_CSS_STRUCTURE_AND_MATURITY')
          PY

      - name: Loader order and retired-owner checks
        shell: bash
        run: |
          set -euo pipefail
          cd target
          loader=src/inc/admin/admin-s01-uiux-polish.php
          grep -F "admin-page-seo-reference-v3.css" "$loader"
          grep -F "vf-theme-seo-page-reference-v3" "$loader"
          ! grep -F "admin-page-seo-reference-v2.css" "$loader"
          test ! -e src/assets/css/admin/pages/seo/admin-page-seo-reference-v2.css
          test ! -e src/assets/css/admin/pages/seo/admin-page-seo-reference-v1.css
          echo PASS_FINAL_OWNER_LOAD_ORDER

      - name: Gate summary
        shell: bash
        run: |
          echo 'PASS_S01_THEME_SEO_REFERENCE_V3_CANDIDATE_GATE'
