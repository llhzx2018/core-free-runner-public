name: P07 Server Ops RC3 Toolbox Smoke

on:
  push:
    branches: [main]
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-rc3-admin-simple.sh'
      - 'installers/p07-rc3-nav-flat.sh'
      - 'dist/p07/0.1.0-rc3/**'
      - '.github/workflows/p07-server-ops-rc3-toolbox-smoke.yml'
  pull_request:
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-rc3-admin-simple.sh'
      - 'installers/p07-rc3-nav-flat.sh'
      - 'dist/p07/0.1.0-rc3/**'
      - '.github/workflows/p07-server-ops-rc3-toolbox-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare isolated Toolbox environment
        run: |
          set -euo pipefail
          rm -rf /tmp/p07-toolbox-smoke
          mkdir -p /tmp/p07-toolbox-smoke/fakebin
          cat >/tmp/p07-toolbox-smoke/fakebin/rclone <<'SH'
          #!/usr/bin/env bash
          exit 0
          SH
          chmod +x /tmp/p07-toolbox-smoke/fakebin/rclone
          bash -n installers/p07.sh
          bash -n installers/p07-toolbox.sh
          bash -n installers/p07-rc3-admin-simple.sh
          bash -n installers/p07-rc3-nav-flat.sh
          grep -Fq 'VF_SERVER_OPS_EXPECTED="VF Server Ops 0.1.0 RC3"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-rc3-guided-init14"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc12"' installers/p07-toolbox.sh
          grep -Fq 'EXPECTED_BLOB="8043a1c8edf538028eb0df6482481f78ca3999c9"' installers/p07.sh
          grep -Fq 'BASE_INSTALLER_BLOB="e3f91a6d0aacff4fe7c7ba0a2e861b7170dad03d"' installers/p07-rc3-admin-simple.sh
          grep -Fq '测试中' installers/p07-toolbox.sh
          test "$(cat dist/p07/0.1.0-rc3/overlay/BUILD_ID)" = '0.1.0-rc3-guided-init14'

      - name: Install Slot3 through stable p07.sh
        env:
          P07_PUBLIC_ROOT: https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/${{ github.event.pull_request.head.sha || github.sha }}
          P07_ALLOW_NONROOT: '1'
          P07_SKIP_APT: '1'
          P07_SKIP_INVENTORY_SELFTEST: '1'
          P07_NO_EXEC: '1'
          P07_INSTALL_DIR: /tmp/p07-toolbox-smoke/opt/vf-server-ops
          P07_PREVIOUS_DIR: /tmp/p07-toolbox-smoke/opt/vf-server-ops.previous
          P07_BIN_LINK: /tmp/p07-toolbox-smoke/bin/vfops
        run: |
          set -euo pipefail
          export PATH="/tmp/p07-toolbox-smoke/fakebin:$PATH"
          bash installers/p07.sh
          ROOT=/tmp/p07-toolbox-smoke/opt/vf-server-ops
          test "$(/tmp/p07-toolbox-smoke/bin/vfops --version)" = 'VF Server Ops 0.1.0 RC3'
          test "$(cat "$ROOT/BUILD_ID")" = '0.1.0-rc3-guided-init14'
          test "$(git hash-object "$ROOT/bin/vfops-user")" = '1028b939ecd4c52377c846ab8e12ff136667981c'
          test "$(git hash-object "$ROOT/bin/vfops-cloudpanel-ui")" = '5b0fa75d6951586c82404e361b88ab5e10661212'
          test "$(git hash-object "$ROOT/lib/cloudpanel_ui_common.sh")" = 'b591cd9b7e1ab9e715cf60cd702fee44f448e7ff'
          test "$(git hash-object "$ROOT/lib/cloudpanel_ui_admin.sh")" = 'eeae6b514b27e15e20ea596f5cd363e7779e461b'
          test "$(git hash-object "$ROOT/lib/site_lifecycle.py")" = '3e84dfa74b4df8413c3228322b8dc1c22d901761'
          test "$(git hash-object "$ROOT/lib/restore_as_verified.py")" = 'c0df2750e0cb79e16bf46cad88e85cacacfc2415'

      - name: Toolbox Slot3 routes to installed init14 without reinstall
        run: |
          set -euo pipefail
          export PATH="/tmp/p07-toolbox-smoke/bin:/tmp/p07-toolbox-smoke/fakebin:$PATH"
          printf '3\n7\n0\n0\n0\n' | script -qec 'NO_COLOR=1 bash installers/p07-toolbox.sh' /dev/null > /tmp/p07-toolbox-smoke/tty.log
          grep -Fq 'CloudPanel 备份 / 恢复 / 迁移' /tmp/p07-toolbox-smoke/tty.log
          grep -Fq '6. 网站管理' /tmp/p07-toolbox-smoke/tty.log
          grep -Fq '7. CloudPanel 管理' /tmp/p07-toolbox-smoke/tty.log
          grep -Fq '1. 创建网站' /tmp/p07-toolbox-smoke/tty.log
          grep -Fq '2. CloudPanel 安全' /tmp/p07-toolbox-smoke/tty.log
          grep -Fq '3. CloudPanel 用户' /tmp/p07-toolbox-smoke/tty.log
          grep -Fq '4. 平台基础能力检查' /tmp/p07-toolbox-smoke/tty.log
          ! grep -Fq '4. Vhost 模板' /tmp/p07-toolbox-smoke/tty.log
          ! grep -Fq '下载并校验 CloudPanel 简化 UX guided-init14' /tmp/p07-toolbox-smoke/tty.log

      - name: Single ordinary-user entry and closed Menu4 contract
        run: |
          set -euo pipefail
          test "$(NO_COLOR=1 bash installers/p07-toolbox.sh --version)" = 'P07 Toolbox V0.1.0'
          NO_COLOR=1 bash installers/p07-toolbox.sh --help > /tmp/p07-help.txt
          grep -Fq '3. CloudPanel 备份 / 恢复 / 迁移' /tmp/p07-help.txt
          grep -Fq '（测试中）' /tmp/p07-help.txt
          grep -Fq '4. 系统维护 / 安全' /tmp/p07-help.txt
          grep -Fq '（可用）' /tmp/p07-help.txt
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc12"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_INSTALLER="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07.sh"' installers/p07-toolbox.sh

      - name: Result
        run: echo 'P07_SERVER_OPS_RC3_TOOLBOX_ROUTE_SMOKE=PASS'
