name: P07 Bench Stable Launcher Gate

on:
  push:
    branches: [main]
    paths:
      - installers/p07-bench.sh
      - .github/workflows/p07-bench-stable-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: bash -n installers/p07-bench.sh
      - name: Version
        run: bash installers/p07-bench.sh --version | grep -F '0.9.0'
      - name: Self test
        run: bash installers/p07-bench.sh --self-test | grep -F 'SELF_TEST=PASS'
      - name: Demo one-shot contract
        run: |
          bash installers/p07-bench.sh --demo >/tmp/p07-bench-demo.txt
          grep -F 'P07 Enhanced Bench' /tmp/p07-bench-demo.txt
          grep -F 'China IP Risk' /tmp/p07-bench-demo.txt
          ! grep -q '请选择\|Select option' /tmp/p07-bench-demo.txt
      - name: Stable pin contract
        run: |
          grep -F 'PINNED_REF="90d34694a6bdfadf46311919a3067644fa5f146d"' installers/p07-bench.sh
          grep -F "EXPECTED_VERSION='0.9.0'" installers/p07-bench.sh
