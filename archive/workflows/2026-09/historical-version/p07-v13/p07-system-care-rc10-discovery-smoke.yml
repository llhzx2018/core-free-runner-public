name: P07 System Care RC10 CloudPanel Discovery Smoke

on:
  push:
    branches: [main, work/p07-system-care-rc10-cloudpanel-wp-discovery]
    paths:
      - 'packages/p07-system-care/0.1.0-rc10/**'
      - 'installers/p07-system-care.sh'
      - '.github/workflows/p07-system-care-rc10-discovery-smoke.yml'
  pull_request:
    paths:
      - 'packages/p07-system-care/0.1.0-rc10/**'
      - 'installers/p07-system-care.sh'
      - '.github/workflows/p07-system-care-rc10-discovery-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Syntax and overlay identity
        shell: bash
        run: |
          set -euo pipefail
          bash -n installers/p07-system-care.sh
          base='packages/p07-system-care/0.1.0-rc9'
          overlay='packages/p07-system-care/0.1.0-rc10'
          test "$(cat "$overlay/VERSION")" = '0.1.0-rc10'
          test "$(git hash-object "$base/MANIFEST.gitblob")" = 'a6f75e96cf9b6971b6a431309f72f629ef6ed931'
          test "$(git hash-object "$overlay/MANIFEST.gitblob")" = '22da2481a09f3048fda79e3088ac4d021b000dd9'
          while read -r expected path; do
            test "$(git hash-object "$overlay/$path")" = "$expected"
          done < "$overlay/MANIFEST.gitblob"
          grep -Fq "VERSION='0.1.0-rc10'" installers/p07-system-care.sh
          grep -Fq "BASE_VERSION='0.1.0-rc9'" installers/p07-system-care.sh
          grep -Fq 'intrusion_scan_rc9.py' installers/p07-system-care.sh

      - name: CloudPanel-user-bounded WordPress discovery
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/lib" "$tmp/home/alice/htdocs/custom-root/public" "$tmp/home/outsider/htdocs/not-cloudpanel" "$tmp/nginx"
          cp packages/p07-system-care/0.1.0-rc9/lib/intrusion_scan.py "$tmp/lib/intrusion_scan_rc9.py"
          cp packages/p07-system-care/0.1.0-rc10/lib/intrusion_scan.py "$tmp/lib/intrusion_scan.py"
          printf '<?php // wp\n' > "$tmp/home/alice/htdocs/custom-root/public/wp-config.php"
          printf '<?php // outsider\n' > "$tmp/home/outsider/htdocs/not-cloudpanel/wp-config.php"
          python3 - "$tmp" <<'PY'
          import os
          import sqlite3
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          db = root / 'cloudpanel.sq3'
          conn = sqlite3.connect(db)
          conn.execute('CREATE TABLE site (domain_name TEXT, user TEXT)')
          conn.execute('INSERT INTO site(domain_name,user) VALUES (?,?)', ('example.test','alice'))
          conn.commit(); conn.close()

          os.environ['P07_IE_DISCOVERY_HOME'] = str(root / 'home')
          os.environ['P07_IE_CLOUDPANEL_DB'] = str(db)
          os.environ['P07_IE_NGINX_SITES_DIR'] = str(root / 'nginx')
          sys.path.insert(0, str(root / 'lib'))
          import intrusion_scan

          found = intrusion_scan.discover([])
          assert found == [(root / 'home/alice/htdocs/custom-root/public').resolve()], found
          assert all('outsider' not in str(path) for path in found)
          PY

      - name: Real baseline command succeeds on RC10 layout
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/runtime/lib" "$tmp/home/alice/htdocs/custom-root/public/wp-admin" "$tmp/nginx" "$tmp/state"
          cp packages/p07-system-care/0.1.0-rc9/lib/*.py "$tmp/runtime/lib/"
          mv "$tmp/runtime/lib/intrusion_scan.py" "$tmp/runtime/lib/intrusion_scan_rc9.py"
          cp packages/p07-system-care/0.1.0-rc10/lib/intrusion_scan.py "$tmp/runtime/lib/intrusion_scan.py"
          printf '<?php // wp\n' > "$tmp/home/alice/htdocs/custom-root/public/wp-config.php"
          printf '<?php echo 1;\n' > "$tmp/home/alice/htdocs/custom-root/public/index.php"
          printf '<?php // admin\n' > "$tmp/home/alice/htdocs/custom-root/public/wp-admin/admin.php"
          python3 - "$tmp" <<'PY'
          import sqlite3
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          conn = sqlite3.connect(root / 'cloudpanel.sq3')
          conn.execute('CREATE TABLE site (domain_name TEXT, user TEXT)')
          conn.execute('INSERT INTO site(domain_name,user) VALUES (?,?)', ('example.test','alice'))
          conn.commit(); conn.close()
          PY
          P07_IE_DISCOVERY_HOME="$tmp/home" \
          P07_IE_CLOUDPANEL_DB="$tmp/cloudpanel.sq3" \
          P07_IE_NGINX_SITES_DIR="$tmp/nginx" \
          PYTHONPATH="$tmp/runtime/lib" \
          python3 "$tmp/runtime/lib/intrusion_evidence.py" --state-dir "$tmp/state" baseline | tee "$tmp/baseline.out"
          grep -Fq '"result": "BASELINE_READY"' "$tmp/baseline.out"
          test -s "$tmp/state/baseline.json"
          test -s "$tmp/state/scan_state.json"

      - name: Symlink marker remains fail closed
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/lib" "$tmp/home/alice/htdocs/site" "$tmp/nginx"
          cp packages/p07-system-care/0.1.0-rc9/lib/intrusion_scan.py "$tmp/lib/intrusion_scan_rc9.py"
          cp packages/p07-system-care/0.1.0-rc10/lib/intrusion_scan.py "$tmp/lib/intrusion_scan.py"
          printf '<?php // target\n' > "$tmp/target.php"
          ln -s "$tmp/target.php" "$tmp/home/alice/htdocs/site/wp-config.php"
          python3 - "$tmp" <<'PY'
          import os
          import sqlite3
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          db = root / 'cloudpanel.sq3'
          conn = sqlite3.connect(db)
          conn.execute('CREATE TABLE site (domain_name TEXT, user TEXT)')
          conn.execute('INSERT INTO site(domain_name,user) VALUES (?,?)', ('example.test','alice'))
          conn.commit(); conn.close()

          os.environ['P07_IE_DISCOVERY_HOME'] = str(root / 'home')
          os.environ['P07_IE_CLOUDPANEL_DB'] = str(db)
          os.environ['P07_IE_NGINX_SITES_DIR'] = str(root / 'nginx')
          sys.path.insert(0, str(root / 'lib'))
          import intrusion_scan

          try:
              intrusion_scan.discover([])
          except intrusion_scan.UnsupportedWordPressLayoutError:
              pass
          else:
              raise AssertionError('symlink wp-config.php must fail closed')
          PY
